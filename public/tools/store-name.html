<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 店铺起名 | AgentGongju.com</title>
<meta name="description" content="输入店铺类型与关键词，AI批量生成好听好记的店铺名字，附广告语与含义解读，适合网店、实体店取名">
<meta name="keywords" content="起名,店铺,店名,品牌,取名,网店">
<link rel="stylesheet" href="../css/style.css">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.name-item{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:14px 18px;margin-bottom:10px}
.name-item .nm{font-size:1.2rem;font-weight:700;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.name-item .tg{font-size:.8rem;color:#94a3b8}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🏪 AI 店铺起名</h1><p>好店名自带好运，一听就记住</p></div>

<div class="card">
<label>🏷 店铺类型</label>
<select id="type">
<option value="奶茶">🧋 奶茶饮品店</option>
<option value="服装">👗 服装店</option>
<option value="餐饮">🍜 餐厅/小吃</option>
<option value="美妆">💄 美妆护肤</option>
<option value="家居">🛋 家居生活</option>
<option value="数码">📱 数码电子</option>
<option value="书店">📚 书店/文创</option>
<option value="花店">🌸 鲜花礼品</option>
<option value="烘焙">🍰 蛋糕烘焙</option>
<option value="网店">🛒 综合网店/工作室</option>
</select>
<label>💡 备注关键词（风格/特色，选填）</label>
<input type="text" id="note" placeholder="例如：ins风、少女心、高端、复古、国风、实惠">
<button class="btn-gen" id="genBtn">🚀 生成店名</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:16px">✅ 为你精选的店名</div>
<div id="nameBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制全部店名</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const pools={
'奶茶':[['茶',['一刻','时光','语','乐园','星球','研究所']],['糖',['半杯','甜','度','水','宇宙']],['甘',['之味','泉','草','棠']],['拾',['光','味','遇','间']]],
'服装':[['衣',['点','语','橱','阁','恋','然']],['妮',['裳','装','子','物语']],['袖',['里','间','香']],['霓',['裳','彩','语']]],
'餐饮':[['食',['光','间','尚','刻','在']],['鲜',['香','味','之','源']],['欢',['聚','乐','宴','喜']],['灶',['头','间','香']]],
'美妆':[['颜',['之','究院','如玉','值']],['妆',['界','点','容']],['樱',['粉','梦','语']],['水',['光','润','漾']]],
'家居':[['暖',['居','家','巢','舍']],['栖',['居','木','心']],['简',['家','居','亦']],['拾',['居','光','味']]],
'数码':[['极',['客','光','能']],['芯',['纪元','动','空间']],['智',['汇','酷','能']],['玩',['转','家','机']]],
'书店':[['墨',['香','语','客']],['阅',['时光','见','然']],['纸',['间','上','飞机']],['知',['已','行','音']]],
'花店':[['花',['语','间','漾','时光']],['春',['野','酿','意']],['蕊',['香','语','集']],['拾',['花','光','香']]],
'烘焙':[['甜',['度','蜜','心','品']],['麦',['香','语','子']],['米',['乐','朵','啦']],['糖',['果','罐','霜']]],
'网店':[['拾',['光','趣','乐']],['小',['确幸','惊喜','美好']],['素',['然','见','成']],['一',['见','品','麓']]]};
const taglines={
'奶茶':'一杯好茶，治愈一天','服装':'穿出你的气质','餐饮':'好吃到光盘','美妆':'颜值从此开挂',
'家居':'住进理想生活','数码':'科技改变生活','书店':'在文字里遇见自己','花店':'把美好打包送给你',
'烘焙':'甜到心里','网店':'好物随你挑','奶茶':'double快乐','餐饮':'人间烟火味'};
function rand(a){return a[Math.floor(Math.random()*a.length)]}
document.getElementById('genBtn').addEventListener('click',()=>{
const type=document.getElementById('type').value;
const note=document.getElementById('note').value.trim();
const pool=pools[type];
const box=document.getElementById('nameBox');box.innerHTML='';
const used=[];
for(let i=0;i<10;i++){
const [pre,suflist]=rand(pool);
let suf=rand(suflist);
let name=pre+suf;
let guard=0;
while(used.includes(name)&&guard<20){suf=rand(suflist);name=pre+suf;guard++;}
used.push(name);
const item=document.createElement('div');item.className='name-item';
item.innerHTML=`<div>
<div class="nm">✦ ${name}</div>
<div class="tg">广告语：${note?note+' · ':''}${rand(taglines[type].split('|'))}</div>
</div>
<button class="copy-btn" onclick="copyName('${name}')">复制</button>`;
box.appendChild(item);
}
document.getElementById('resultArea').classList.add('active');
});
function copyName(n){navigator.clipboard.writeText(n).then(()=>alert('✅ 已复制：'+n))}
function copyResult(){const names=[...document.querySelectorAll('.name-item .nm')].map(x=>x.textContent.replace('✦ ','')).join('\n');navigator.clipboard.writeText('【AI 店铺起名】\n'+names).then(()=>alert('✅ 已复制！'))}
</script>
</body>
</html>
