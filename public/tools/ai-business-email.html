<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 商务邮件助手 | AgentGongju.com</title>
<meta name="description" content="AI商务邮件助手，输入邮件要点，自动生成专业得体中英文商务邮件，催收、请假、汇报、邀约等多场景模板一键生成">
<meta name="keywords" content="商务邮件,邮件写作,办公邮件,请假邮件,汇报邮件,职场">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;margin-bottom:12px;font-size:.92rem}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>✉️ AI 商务邮件助手</h1><p>把三两句话，写成得体又专业的职场邮件</p></div>

<div class="card">
<label>📌 邮件要点（想表达的核心内容）</label>
<textarea id="points" placeholder="例如：跟王总约下周一下午2点谈合作，需要对方准备初步报价单，地点定在咱们公司会议室。"></textarea>
<div class="param-row">
<div><label>📮 邮件场景</label>
<select id="scene">
<option value="约会">📅 邀约会议</option>
<option value="汇报">📊 工作汇报</option>
<option value="请假">🏝️ 请假申请</option>
<option value="催办">⏰ 催办跟进</option>
<option value="致谢">🙏 感谢致意</option>
<option value="拒绝">🙅 婉拒答复</option>
</select></div>
<div><label>🌐 语言</label>
<select id="lang">
<option value="中文">🇨🇳 中文邮件</option>
<option value="英文">🇬🇧 英文邮件</option>
</select></div>
</div>
<div class="param-row">
<div><label>🧑‍💼 收件人称呼</label>
<input type="text" id="to" placeholder="例如：王总 / Mr. Wang / 张经理"></div>
<div><label>✍️ 语气</label>
<select id="tone">
<option value="正式">📜 正式</option>
<option value="友好">😊 友好</option>
<option value="简洁">🧩 简洁</option>
</select></div>
</div>
<button class="btn-gen" id="genBtn">✉️ 生成邮件</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">📧 邮件正文</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制邮件</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const sceneTpl={
'约会':{sub:'会议安排','open':['您好，','Hi there,','尊敬的'],body:['关于合作事宜，想邀您进一步沟通。','现就合作洽谈做如下安排：'],act:'请确认以上安排是否可行，期待您的回复。'},
'汇报':{sub:'工作汇报','open':[],body:['现将近期工作进展向您汇报如下：'],act:'以上为近期工作进展，请审阅并给予指导意见。'},
'请假':{sub:'请假申请','open':[],body:['因个人事务需要，特向您申请请假，具体安排如下：'],act:'请假期间将保持通讯畅通，工作已妥善交接，恳请批准。'},
'催办':{sub:'进度跟进','open':[],body:['就前述事项进度，想与您再做一次跟进：'],act:'如方便烦请在近日给予答复，以便推进后续安排，感谢配合。'},
'致谢':{sub:'致谢','open':[],body:['感谢您一直以来给予的支持与信任：'],act:'期待未来继续携手，共创佳绩。'},
'拒绝':{sub:'婉拒答复','open':[],body:['非常感谢您的邀请与信任，经慎重考虑：'],act:'希望未来仍有合作机会，再次感谢您的理解。'}};
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 商务邮件助手 | AgentGongju.com'))return;
const points=document.getElementById('points').value.trim();
if(!points){alert('请先填写邮件要点');return;}
const scene=document.getElementById('scene').value;
const lang=document.getElementById('lang').value;
const to=document.getElementById('to').value.trim()||(lang==='英文'?'Sir/Madam':'尊敬的领导');
const tone=document.getElementById('tone').value;
const t=sceneTpl[scene];
const date=new Date();const dateStr=`${date.getMonth()+1}月${date.getDate()}日`;
const isZh=lang==='中文';
let out;
if(isZh){
const greet=tone==='正式'?'尊敬的':tone==='友好'?'您好':to+'';
out=`主题：${t.sub} ${dateStr}\n\n`;
out+=`${to}，\n\n`;
out+=t.body[0]+'\n'+t.body[0]?''.replace(new RegExp(esc(t.body[0])),''):'';
out=`主题：${t.sub} ${dateStr}\n\n${to}，\n\n`;
out+=`${t.body[0]}\n`;
out+=`要点：${points}\n`;
if(scene==='约会')out+=`时间/地点等细节请您确认，我方将做好相应接待。\n`;
out+=`\n${t.act}\n\n此致\n敬礼\n\n${getSender()}\n${dateStr}`;
}else{
out=`Subject: ${t.sub}\n\nDear ${to},\n\n`;
out+=`${t.body[0]}\n`;
out+=`Regarding the key points: ${points}\n`;
out+=`Please let me know if any adjustment is needed. I look forward to your reply.\n\nBest regards,\n${getSender()}`;
}
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function getSender(){return '【你的姓名】\n【你的职位】';}
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 邮件已复制！'))}
</script>
</body>
</html>
