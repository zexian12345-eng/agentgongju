<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 朋友圈文案生成器 | AgentGongju.com</title>
<meta name="description" content="AI朋友圈文案生成器，输入你想分享的内容或主题，自动生成有格调有共鸣的朋友圈文案，配图建议与话题标签一并给到">
<meta name="keywords" content="朋友圈文案,文案生成,发朋友圈,配文,社交媒体">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.copy-block{position:relative}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem;margin:4px 8px 4px 0}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.text-card{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.25);border-radius:12px;padding:18px;margin-bottom:14px;color:#e2e8f0;line-height:1.9;font-size:.92rem;white-space:pre-wrap}
.tags{color:#a5b4fc;font-size:.8rem;margin-top:8px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>📸 AI 朋友圈文案</h1><p>一条朋友圈，替你写出恰到好处的下一句</p></div>

<div class="card">
<label>✨ 想分享什么？（内容或主题）</label>
<textarea id="topic" placeholder="例如：刚学会做咖啡拉花 / 周末去爬了黄山 / 加班到深夜的感慨"></textarea>
<div class="param-row">
<div><label>🎭 文案风格</label>
<select id="style">
<option value="文艺">🍃 文艺治愈</option>
<option value="幽默">😄 幽默俏皮</option>
<option value="励志">🔥 正能量励志</option>
<option value="走心">💗 走心深度</option>
<option value="极简">⚪ 极简高级</option>
</select></div>
<div><label>🗣️ 人称</label>
<select id="person">
<option value="我">🙋 第一人称</option>
<option value="无">🔍 无主语句</option>
</select></div>
</div>
<div><label>📝 可选提示</label>
<input type="text" id="hint" placeholder="例如：带点关于时间的感悟，不要太长"></div>
<button class="btn-gen" id="genBtn">📝 生成文案</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">🎨 为你准备了 3 条文案</div>
<div id="textsBox"></div>
<button class="copy-btn" onclick="copyAll()">📋 复制全部文案</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const stylePool={
'文艺':[t=>`晚风温柔，${t}，都是平凡生活里偷来的光。`,`所有不期而遇，都从${t}开始有迹可循。`,`把${t}，装进今天的口袋里，连同晚霞一起。`],
'幽默':[t=>`今日份${t}，本人已笑得合不拢嘴（并po图挑衅）😎`,`论${t}，我大概是有点天赋在身上的`,`不装了，摊牌了，${t}这件大事我干成了👌`],
'励志':[t=>`别人看到的${t}，是我一点点熬出来的底气。`,`每一次${t}，都是向更好的自己又靠近了一步。`,`记住此刻，${t}，然后去更大的世界。`],
'走心':[t=>`关于${t}，我学会了和自己和解，也学会了和世界握手。`,`很多年以后回头看，${t}的某个瞬间仍会让我心头一动。`,`经历的${t}，都变成了我的一部分温柔。`],
'极简':[t=>`${t}。`,`于是，${t}。`,`此后${t}。`]};
const tags=['#记录生活','#日常碎片','#小确幸','#此刻心情','#今日份快乐','#生活美学'];
function urlAdd(){return window.location.host||'agentgongju'};
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 朋友圈文案生成器 | AgentGongju.com'))return;
const topic=document.getElementById('topic').value.trim();
if(!topic){alert('请先输入想分享的内容');return;}
const style=document.getElementById('style').value;
const person=document.getElementById('person').value;
const hint=document.getElementById('hint').value.trim();
const texts=stylePool[style].map(fn=>fn(topic));
const box=document.getElementById('textsBox');box.innerHTML='';
window._texts=[];window._all='';
texts.forEach((t,idx)=>{
const extraT=(person==='我'?'':'')+hint?'':'';
let full=t+(hint?'\n'+hint:'')+'\n'+tags.slice(0,3).join(' ');
const div=document.createElement('div');div.className='text-card';
div.innerHTML=`<div>${full}</div><div class="tags">${tags.slice(0,3).join(' ')}</div>`;
box.appendChild(div);
window._texts.push(full);
window._all+='【文案'+(idx+1)+'】\n'+full+'\n\n';
});
document.getElementById('resultArea').classList.add('active');
});
function copyAll(){navigator.clipboard.writeText('【AI 朋友圈文案】\n'+window._all).then(()=>alert('✅ 已复制全部文案！'))}
</script>
</body>
</html>
