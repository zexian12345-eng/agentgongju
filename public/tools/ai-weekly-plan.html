<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 周工作计划生成器 | AgentGongju.com</title>
<meta name="description" content="一键生成一周工作计划表，适合职场人士提前规划，含每日任务、优先级与复盘提醒">
<meta name="keywords" content="周计划,工作计划,效率,时间管理,职场">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.days{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.day{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:16px}
.day h4{color:#a5b4fc;margin-bottom:10px;font-size:.95rem;display:flex;align-items:center;gap:8px}
.task-item{display:flex;gap:8px;align-items:flex-start;font-size:.88rem;color:#cbd5e1;margin-bottom:6px;line-height:1.5}
.pri-l{color:#f87171;font-weight:700}
.pri-m{color:#fbbf24;font-weight:700}
.pri-s{color:#4ade80;font-weight:700}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-row,.days{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🗓 AI 周工作计划生成器</h1><p>一分钟搞定一周工作安排，科学高效</p></div>

<div class="card">
<label>🎯 本周核心目标（可写3条）</label>
<textarea id="goals" placeholder="例如：完成季度汇报PPT、跟进3个客户、学习新技能"></textarea>
<div class="param-row">
<div><label>💼 职业/岗位</label>
<select id="job">
<option value="通用">通用职场</option>
<option value="产品">产品经理</option>
<option value="运营">内容/新媒体运营</option>
<option value="开发">程序员/开发</option>
<option value="销售">销售</option>
<option value="市场">市场/营销</option>
<option value="教师">教师</option>
</select></div>
<div><label>📆 工作节奏</label>
<select id="pace">
<option value="normal">标准（5天工作制）</option>
<option value="busy">冲刺（高负荷）</option>
<option value="easy">轻松（弹性）</option>
</select></div>
</div>
<button class="btn-gen" id="genBtn">🚀 生成计划</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:16px">✅ 本周工作计划</div>
<div id="planBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制计划</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const days=['周一','周二','周三','周四','周五','周末'];
const taskPool={'通用':['处理日常邮件与审批','整理本周会议纪要','推进重点项目进度','复盘上周数据','参加团队周例会','完善工作文档','对接跨部门协作'],'产品':['梳理需求池优先级','撰写产品需求文档','参与需求评审会','跟进版本迭代','分析用户反馈','设计竞品调研','更新产品路线图'],'运营':['更新公众号推文','策划活动方案','分析粉丝增长数据','回复用户私信','制作短视频素材','优化选题库','复盘投放效果'],'开发':['修复线上Bug','推进功能开发','代码审查Code Review','优化接口性能','编写单元测试','技术方案评审','部署迭代版本'],'销售':['跟进意向客户','制定拜访计划','整理客户报价','复盘成交漏斗','维护老客关系','参加销售晨会','收集竞品情报'],'市场':['撰写营销方案','对接广告投放','准备活动物料','分析投放数据','媒体关系维护','制作宣传素材','策划品牌事件'],'教师':['备课与教案整理','批改学生作业','组织课堂互动','与家长沟通反馈','设计教学课件','组织课后答疑','参加教研会议']};
function rand(a){return a[Math.floor(Math.random()*a.length)]}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 周工作计划生成器 | AgentGongju.com'))return;
let goals=document.getElementById('goals').value.trim();
const job=document.getElementById('job').value;
const pace=document.getElementById('pace').value;
if(!goals){goals='推进核心工作目标，提升效率与产出';}
const pool=taskPool[job];
const gLines=goals.split(/[\n，,。;；]+/).filter(x=>x).slice(0,3);
const box=document.getElementById('planBox');box.innerHTML='';
const planWrap=document.createElement('div');planWrap.className='days';
const weekdays=days.slice(0,5);
const extra=Math.max(1,Math.round(gLines.length/3)+1);
weekdays.forEach((d,idx)=>{
const dayDiv=document.createElement('div');dayDiv.className='day';
let tasks='';
if(pace==='busy'){tasks+=mkTask('高','处理积压事务与加急需求');tasks+=mkTask('高',gLines[Math.min(idx,gLines.length-1)]||'推进重点项目');}
else if(pace==='easy'){tasks+=mkTask('中',rand(pool));tasks+=mkTask('低','弹性时间提升自我');}
else{tasks+=mkTask(idx%2===0?'高':'中',gLines[Math.min(idx%Math.max(gLines.length,1),gLines.length-1)]||rand(pool));tasks+=mkTask('中',rand(pool));tasks+=mkTask('低','整理工作成果与心得');}
if(idx===4){tasks+=mkTask('中','周复盘：总结成果与不足');}
dayDiv.innerHTML=`<h4>${d}</h4>${tasks}`;
planWrap.appendChild(dayDiv);
});
const wd=document.createElement('div');wd.className='days';wd.style.marginTop='12px';
const we=document.createElement('div');we.className='day';
we.innerHTML=`<h4>周末（充电提升）</h4>${mkTask('中','回顾本周，规划下周')}${mkTask('低','阅读/学习充电')}${mkTask('低','放松休息，恢复精力')}`;
wd.appendChild(we);
box.appendChild(planWrap);box.appendChild(wd);
document.getElementById('resultArea').classList.add('active');
});
function mkTask(pri,t){const c=pri==='高'?'pri-l':pri==='中'?'pri-m':'pri-s';const dot=pri==='高'?'🔴':pri==='中'?'🟡':'🟢';return `<div class="task-item"><span class="${c}">${dot} ${pri}优先级</span> ${t}</div>`;}
function copyResult(){navigator.clipboard.writeText(document.getElementById('planBox').innerText.replace(/\n{3,}/g,'\n\n')).then(()=>alert('✅ 已复制！'))}
</script>
</body>
</html>
