<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 英语口语陪练 | AgentGongju.com</title>
<meta name="description" content="AI英语智能陪练，输入你想说的中文，给出地道英文表达、发音拆解与跟读练习">
<meta name="keywords" content="英语学习,口语,翻译,英语陪练,雅思口语">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;min-height:60px;margin-bottom:12px}
.result-box.en{font-family:'Georgia',serif;font-size:1.15rem;color:#a5b4fc}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🗣 AI 英语口语陪练</h1><p>你说中文，我教你地道英文+发音分解</p></div>

<div class="card">
<label>💬 你想说的话（中文）</label>
<textarea id="cn" placeholder="例如：我就是喜欢周末睡懒觉，放松心情放空自己。"></textarea>
<label>🎯 使用场景</label>
<select id="scene">
<option value="daily">日常聊天</option>
<option value="work">职场/会议</option>
<option value="travel">旅行</option>
<option value="ordering">餐厅点餐</option>
<option value="interview">面试</option>
</select>
<button class="btn-gen" id="genBtn">🗣 教我怎么说</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 地道表达 & 跟读练习</div>
<div class="result-box en" id="resultEn"></div>
<div class="result-box" id="resultTips"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制练习</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const templates={daily:[['I just love sleeping in on weekends and letting my mind wander.','I just love staying in bed late on weekends to relax and unwind.']],work:[['I prefer to focus on the core tasks and avoid getting sidetracked.','Let me summarize the key takeaways from our meeting.']],travel:[['Excuse me, could you tell me how to get to the nearest subway station?','I would like to check in for my flight, please.']],ordering:[['I would like a table for two, please.','Could I get the menu? I am still deciding between the pasta and the steak.']],interview:[['I believe my strengths lie in problem-solving and teamwork.','I am excited about this opportunity because it aligns with my career goals.']]};
const tips=['🗣 发音要点：注意连读「sleeping in」中的 g 可以弱读。','🌀 语气提示：休闲话题用轻松上扬的语调，显得自然亲切。','💡 替换词汇：love 可用 enjoy / really like；unwind 可用 decompress / take it easy。','✨ 高分加分：加一句「It really helps me recharge.」会更地道。'];
function rand(a){return a[Math.floor(Math.random()*a.length)]}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 英语口语陪练 | AgentGongju.com'))return;
let cn=document.getElementById('cn').value.trim();
const scene=document.getElementById('scene').value;
if(!cn){alert('请输入你想说的话');return}
const pair=rand(templates[scene]);const en=pair[0];const alt=pair[1];
const tip1=rand(tips);
const tip2='🧠 中文理解：'+cn+' → '+alt+'（更口语化的版本）';
document.getElementById('resultArea').classList.add('active');
document.getElementById('resultEn').textContent=en;
document.getElementById('resultTips').textContent=`${tip1}\n${tip2}\n\n另一种地道说法：\n${alt}\n\n🎤 跟读步骤：先慢读→连读→整句快读三遍。`;
});
function copyResult(){const en=document.getElementById('resultEn').textContent+'\n'+document.getElementById('resultTips').textContent;navigator.clipboard.writeText(en).then(()=>alert('✅ 已复制！'))}
</script>
</body>
</html>
