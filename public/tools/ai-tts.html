<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI在线配音 - 文字转语音免费工具 | AgentGongju.com</title>
<meta name="description" content="免费AI配音工具，文字转语音在线生成。支持多种中文声音，适用于短视频配音、有声书制作、广告旁白等场景。">
<meta name="keywords" content="AI配音,文字转语音,在线配音,免费配音,短视频配音,TTS">
<link rel="stylesheet" href="../css/style.css">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
textarea{width:100%;min-height:120px;padding:16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;color:#e2e8f0;font-size:0.95rem;resize:vertical;outline:none;font-family:inherit}
textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
select{width:100%;padding:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none}
select:focus{border-color:#6366f1}
.btn-generate{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all 0.3s}
.btn-generate:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.btn-generate:disabled{opacity:0.5;cursor:not-allowed}
.player-area{display:none;margin-top:20px}
.player-area.active{display:block}
audio{width:100%;margin-top:12px}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a><a href="image-to-video.html">图转视频</a><a href="text-to-video.html">文生视频</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🎙️ AI 在线配音</h1><p>文字转语音，一键生成自然流畅的中文配音</p></div>
<div class="card">
<label>📝 输入文字内容</label>
<textarea id="textInput" placeholder="输入需要配音的文字内容...&#10;&#10;例如：欢迎收看今天的科技早报，我是你们的主播小智..."></textarea>
<div class="param-row">
<div><label style="color:#94a3b8;font-size:0.85rem;margin-bottom:4px">👤 声音选择</label>
<select id="voice"><option>标准女声</option><option>标准男声</option><option>温柔女声</option><option>磁性男声</option><option>可爱童声</option><option>新闻播音</option></select></div>
<div><label style="color:#94a3b8;font-size:0.85rem;margin-bottom:4px">⏱ 语速</label>
<select id="speed"><option value="0.8">慢速</option><option value="1.0" selected>正常</option><option value="1.2">稍快</option><option value="1.5">快速</option></select></div></div></div>
<button class="btn-generate" id="generateBtn">🎙️ 生成配音</button>
<div class="player-area card" id="playerArea">
<div style="color:#22c55e;font-weight:600;margin-bottom:8px">✅ 配音已生成</div>
<audio id="audioPlayer" controls></audio>
<p style="color:#94a3b8;font-size:0.85rem;margin-top:8px">右键音频选择"另存为"即可下载</p></div></div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
document.getElementById('generateBtn').addEventListener('click', async ()=>{
const text=document.getElementById('textInput').value.trim();if(!text){alert('请输入文字内容！');return}
const btn=document.getElementById('generateBtn');btn.disabled=true;btn.textContent='⏳ 生成中...';
try{
const res=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,voice:document.getElementById('voice').value,speed:parseFloat(document.getElementById('speed').value)})});
const data=await res.json();
if(data.success&&data.audio_url){document.getElementById('playerArea').classList.add('active');document.getElementById('audioPlayer').src=data.audio_url;document.getElementById('audioPlayer').play();}
else alert('生成失败: '+(data.error||'请重试'));
}catch(err){alert('网络错误: '+err.message);}
finally{btn.disabled=false;btn.textContent='🎙️ 生成配音';}});
</script>
</body>
</html>
