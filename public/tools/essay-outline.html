<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 论文大纲生成 | AgentGongju.com</title>
<meta name="description" content="输入论文主题与要求，AI自动生成结构化写作大纲，包含引言、分论点、例证与结论，助力论文写作">
<meta name="keywords" content="论文,大纲,写作,毕业论文,提纲,报告">
<link rel="stylesheet" href="../css/style.css">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.outline{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:22px;color:#e2e8f0;line-height:1.9;white-space:pre-wrap;margin-bottom:12px;font-size:.92rem}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>📝 AI 论文大纲生成</h1><p>条理清晰，从引言到结论一气呵成</p></div>

<div class="card">
<label>📚 论文主题</label>
<textarea id="topic" placeholder="例如：人工智能技术在中学教育中的应用研究 或 短视频对青少年消费观的影响"></textarea>
<div class="param-row">
<div><label>🎓 文章类型</label>
<select id="type">
<option value="毕业论文">🎖 毕业论文</option>
<option value="学术论文">🔬 学术/期刊论文</option>
<option value="报告">📊 调研报告</option>
<option value="综述">📑 文献综述</option>
</select></div>
<div><label>🧱 大纲详细度</label>
<select id="depth">
<option value="3">三级标题（详细）</option>
<option value="2">二级标题（简洁）</option>
</select></div>
</div>
<button class="btn-gen" id="genBtn">🚀 生成大纲</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:16px">✅ 写作大纲</div>
<div class="outline" id="outlineBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制大纲</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const pointBank=[
['相关概念与理论基础','对核心概念进行界定，梳理国内外研究现状，指出已有研究的空白'],
['现状分析','结合具体数据与案例，呈现当前发展现状、主要特征与面临的挑战'],
['问题剖析','从多个维度深入剖析存在的问题及其成因，区分主因与次因'],
['原因探究','分析问题背后的制度、技术、社会与个体因素，揭示深层逻辑'],
['对策与建议','针对前述问题提出有针对性、可落地的改进方案与政策建议'],
['实践探索','给出具体的实施路径、应用场景与典型案例，增强说服力'],
['总结与展望','总结全文核心观点，指出研究不足并展望未来研究方向']];
function rand(a){return a[Math.floor(Math.random()*a.length)]}
document.getElementById('genBtn').addEventListener('click',()=>{
const topic=document.getElementById('topic').value.trim()||'人工智能与教育融合';
const type=document.getElementById('type').value;
const depth=document.getElementById('depth').value;
let out='论文题目：《'+topic+'》\n\n';
out+='一、引言\n   · 研究背景与意义\n   · 国内外研究现状\n   · 研究思路与方法\n\n';
const chosen=[...pointBank].sort(()=>Math.random()-0.5).slice(0,4);
out+='二、'+chosen[0][0]+'\n   · '+chosen[0][1]+'\n';
if(depth==='3'){out+='     1. 核心概念界定\n     2. 相关理论基础\n     3. 研究现状述评\n';}
out+='\n三、'+chosen[1][0]+'\n   · '+chosen[1][1]+'\n';
if(depth==='3'){out+='     1. 数据与现状梳理\n     2. 典型特征归纳\n     3. 案例佐证\n';}
out+='\n四、'+chosen[2][0]+'\n   · '+chosen[2][1]+'\n';
if(depth==='3'){out+='     1. 问题表现\n     2. 成因分析\n     3. 影响评估\n';}
out+='\n五、'+chosen[3][0]+'\n   · '+chosen[3][1]+'\n';
if(depth==='3'){out+='     1. 对策方案\n     2. 实施路径\n     3. 可行性分析\n';}
out+='\n六、结论\n   · 全文总结与核心论点\n   · 研究不足与未来展望\n\n【参考文献建议】围绕主题补充近三年国内外核心期刊与专著10~15篇。';
document.getElementById('outlineBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText('【AI 论文大纲】\n'+document.getElementById('outlineBox').innerText).then(()=>alert('✅ 已复制！'))}
</script>
</body>
</html>
