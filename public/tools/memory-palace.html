<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记忆宫殿法 | AgentGongju.com</title>
<meta name="description" content="AI记忆宫殿法学习工具，把待记内容编成生动联想，助你高效背单词背资料">
<meta name="keywords" content="记忆宫殿,记忆法,背单词,高效记忆,学习方法">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.btn-gen:disabled{opacity:.5;cursor:not-allowed}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.room{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:16px;margin-bottom:12px}
.room h4{color:#a5b4fc;margin-bottom:8px}
.room p{color:#e2e8f0;line-height:1.8}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🏰 记忆宫殿法</h1><p>把一段待记内容，编成房间里的生动画面，过目不忘</p></div>

<div class="card"><label>📚 待记忆的内容（可用 # 或换行分隔要点）</label>
<textarea id="notes" placeholder="例如：五岳：泰山 华山 嵩山 衡山 恒山&#10;或者：apple 苹果 / 恐龙 extinction"></textarea>
<div class="param-row">
<div><label>宫殿场景</label><select id="scene"><option value="自家卧室">自家卧室</option><option value="图书馆">图书馆</option><option value="厨房">厨房</option><option value="办公室">办公室</option></select></div>
<div><label>记忆手法</label><select id="method"><option value="联想夸张">联想夸张</option><option value="动作串联">动作串联</option><option value="谐音挂钩">谐音挂钩</option></select></div>
</div>
<button class="btn-gen" id="genBtn">🧠 构建记忆宫殿</button></div>

<div class="result-area" id="resultArea"><div class="card"><div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 记忆宫殿已构建（按房间顺序走一遍就能记住）</div>
<div id="out"></div>
<button class="copy-btn" onclick="copyAll()">📋 复制记忆路线</button></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyAll(){let t='';document.querySelectorAll('#out .room').forEach(el=>t+=el.innerText+'\n');navigator.clipboard.writeText(t.trim()).then(()=>alert('✅ 已复制'))}
const LOC={
'自家卧室':['床前的地毯','衣柜的镜子','书桌的台灯','窗台的盆栽','枕头旁边'],
'图书馆':['大门入口','借阅台','书架第一排','自习长桌','窗边座位'],
'厨房':['灶台','冰箱门','案板','微波炉','餐桌'],
'办公室':['工位隔断','打印机','饮水机','会议室白板','老板办公室门口']};
const STYLES={
'联想夸张':(w)=>'想象'+w+'变得巨大夸张，塞满了整个角落，还散发出奇异的光',
'动作串联':(w)=>'让它动起来，一边'+(Math.random()>0.5?'蹦跳':'旋转')+'一边钻进这个位置',
'谐音挂钩':(w)=>'把「'+w.split(' ').slice(-1)[0]+'」的音和画面挂在这个位置，越离谱越好'};
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('记忆宫殿法 | AgentGongju.com'))return;
let raw=document.getElementById('notes').value.trim();
if(!raw){alert('请输入内容');return}
const scene=document.getElementById('scene').value;
const method=document.getElementById('method').value;
const items=raw.split(/[\n#]+/).map(x=>x.trim()).filter(Boolean);
const locs=LOC[scene];
let html='';
items.slice(0,10).forEach((item,i)=>{
  const loc=locs[i%locs.length];
  const style=STYLES[method](item);
  html+='<div class="room"><h4>📍 第'+(i+1)+'站 · '+loc+'</h4><p>把「'+item+'」放进去：'+style+'。</p></div>';
});
const recall='🧠 复习技巧：在脑海里沿着'+scene+'走一遍，把所有画面串成故事，当晚睡前默背一遍。';
html+='<div style="background:rgba(99,102,241,0.1);border:1px solid rgba(99,102,241,0.3);border-radius:10px;padding:14px;color:#a5b4fc">'+recall+'</div>';
document.getElementById('resultArea').classList.add('active');
document.getElementById('out').innerHTML=html;
});
</script>
</body>
</html>
