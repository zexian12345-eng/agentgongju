<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 懒人菜谱推荐 | AgentGongju.com</title>
<meta name="description" content="根据现有食材和人数，智能推荐快手家常菜，含详细做法与买菜清单，新手也能做">
<meta name="keywords" content="菜谱,家常菜,快手菜,懒人食谱,做饭">
<link rel="stylesheet" href="../css/style.css">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:22px;color:#e2e8f0;line-height:2;white-space:pre-wrap;min-height:60px;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🍳 AI 懒人菜谱推荐</h1><p>家里有什么就做什么，新手也能轻松搞定</p></div>

<div class="card">
<label>🥬 家里现有食材（用逗号分隔）</label>
<textarea id="ing" placeholder="例如：鸡蛋,西红柿,土豆,青椒,五花肉,豆腐"></textarea>
<div class="param-row">
<div><label>👨‍👩‍👧 用餐人数</label><input type="number" id="num" min="1" max="6" value="2"></div>
<div><label>⏱ 期望时长</label>
<select id="time"><option value="15">15分钟快手</option><option value="30">30分钟标准</option><option value="60">1小时慢慢做</option></select></div>
</div>
<button class="btn-gen" id="genBtn">🍽 推荐菜谱</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 为你定制的菜谱</div>
<div class="result-box" id="result"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制菜谱</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const rec=[
{name:'西红柿炒鸡蛋',key:['鸡蛋','西红柿'],steps:['鸡蛋打散加少许盐，西红柿切块。','热油下蛋液炒至金黄盛出。','另起锅炒西红柿出汁，倒回鸡蛋，加糖盐翻炒即可。']},
{name:'家常土豆丝',key:['土豆'],steps:['土豆切细丝用清水泡去淀粉。','热油爆香葱花，下土豆丝大火快炒。','加醋、盐、青椒丝炒熟出锅。']},
{name:'青椒炒肉丝',key:['青椒','肉'],steps:['肉丝用生抽、淀粉腌制。','热油滑炒肉丝变色盛出。','下青椒段翻炒，倒回肉丝调味装盘。']},
{name:'麻婆豆腐',key:['豆腐'],steps:['豆腐切块焯水去豆腥。','豆瓣酱+蒜末炒香出红油。','下豆腐轻翻，加水淀粉勾芡，撒花椒粉。']},
{name:'蒜蓉青菜',key:['青菜'],steps:['青菜洗净焯水摆盘。','热油爆蒜末，加生抽蚝油调汁。','淋在青菜上即可。']},
{name:'紫菜蛋花汤',key:['鸡蛋'],steps:['水烧开放紫菜。','淋入蛋液成蛋花。','加盐、香油、葱花出锅。']},
{name:'可乐鸡翅',key:['鸡'],steps:['鸡翅两面煎至金黄。','倒可乐没过鸡翅，加生抽。','小火焖15分钟收汁。']},
{name:'清蒸鱼',key:['鱼','葱'],steps:['鱼身划刀，铺姜丝葱段。','水开后蒸8分钟。','淋蒸鱼豉油，浇热油即可。']}];
function pick(a){return a[Math.floor(Math.random()*a.length)]}
document.getElementById('genBtn').addEventListener('click',()=>{
let ings=document.getElementById('ing').value.trim();
const num=parseInt(document.getElementById('num').value||2);
const time=document.getElementById('time').value;
const ingArr=ings?ings.split(/[,，、\s]+/):[];
// 匹配可用菜谱
let matched=rec.filter(r=>r.key.some(k=>ingArr.some(i=>i.includes(k[0])||k.includes(i))));
if(matched.length<2)matched=rec.filter(r=>Math.random()<0.5).concat(rec).slice(0,3);
if(!ingArr.length)matched=[pick(rec),pick(rec)];
// 选出2-3道
const chosen=Array.from(new Set(matched)).slice(0,Math.min(3,Math.max(2,Math.floor(num))));
let output=`👨‍🍳 今日${num}人份 · ${time}分钟 懒人菜单\n━━━━━━━━━━━━━━━━\n`;
chosen.forEach((r,i)=>{
output+=`\n【菜${i+1}】${r.name}\n食材：${r.key.join('、')}${ingArr.length?`（家里有：${r.key.filter(k=>ingArr.some(x=>x.includes(k[0])))||'常规配菜'}）`:''}\n做法：\n1. ${r.steps[0]}\n2. ${r.steps[1]}\n3. ${r.steps[2]}\n`;
});
output+='\n💡 提示：食材不够可灵活替换，调料按口味增减！';
document.getElementById('resultArea').classList.add('active');
document.getElementById('result').textContent=output;
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('result').textContent).then(()=>alert('✅ 已复制！'))}
</script>
</body>
</html>
