<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.8;white-space:pre-wrap;margin-bottom:12px;font-size:.92rem}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.tip{color:#94a3b8;font-size:.8rem;line-height:1.8;margin-top:6px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>💬 高情商聊天回复生成器</h1><p>把想说的话，说得得体、舒服、有分寸</p></div>

<div class="card">
<label>🗣️ 对方是谁</label>
<select id="who">
<option value="领导">领导 / 上司</option>
<option value="同事">同事</option>
<option value="客户">客户 / 甲方</option>
<option value="对象">对象 / 恋人</option>
<option value="朋友">朋友 / 好友</option>
<option value="长辈">长辈 / 亲戚</option>
</select>
<label>📝 对方说了什么 / 你的处境</label>
<textarea id="situation" placeholder="例如：领导说方案还要再改改；对象说今天好累；同事推我给你背锅；朋友借钱…"></textarea>
<div class="param-row">
<div><label>🎭 回复语气</label>
<select id="tone">
<option value="得体">得体大方</option>
<option value="暖心">温暖治愈</option>
<option value="幽默">轻松幽默</option>
<option value="强韧">不卑不亢</option>
</select></div>
<div><label>🔢 生成版本</label>
<select id="vers">
<option value="3">3 个版本</option>
<option value="5">5 个版本</option>
</select></div>
</div>
<button class="btn-gen" id="genBtn">✨ 生成回复</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">💌 参考回复</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制回复</button>
<div class="tip">💡 提示：回复宜贴合真实情境微调，语气自然最动人，别照搬硬套。</div>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const BANK={
'领导':{
'得体':['收到，我马上跟进，今晚给您反馈进展。','好的领导，我这就落实，有问题第一时间向您汇报。','明白，我按您的方向调整，稍后给您过目。'],
'暖心':['好的，辛苦您一直盯着，我这边尽快推进，不让您操心。','放心交给我，您忙，有结果我随时汇报。','好的领导，我抓紧，您也多注意休息。'],
'幽默':['收到！保证完成任务，绝不掉链子 😄','没问题，这就安排上，领导放心！','好嘞，马上安排，给您办得妥妥的。'],
'强韧':['理解您的要求，我会评估后再回复您一个可行方案。','我明白，不过存在一些客观情况，我梳理清楚后跟您汇报。','好的，我会综合考虑，确保在合理范围内完成。']},
'同事':{
'得体':['没问题，我这边安排一下，稍后给你信。','收到，我们一起把这事处理好。','行，我看看，咱们配合推进。'],
'暖心':['别着急，我帮你一起想办法，有我在。','辛苦啦，这部分我帮你分担一点，别太累。','没事的，慢慢来，需要搭把手随时喊我。'],
'幽默':['哈哈，咱俩谁跟谁，这不就安排上了嘛 😄','收到收到，保证不掉链子！','放心，交给我妥妥的，咱们一起搞定。'],
'强韧':['这个分工咱们之前确认过，我可以配合，但责任我们要明确。','我可以帮忙，但需要协调的资源和时间咱们先说清楚。','我理解，不过这块确实不在我职责内，我们可以一起向上面反馈。']},
'客户':{
'得体':['您好，您的需求我已记录，会尽快处理并给您反馈，请您放心。','好的，辛苦您耐心等待，我们会第一时间跟进。','收到，感谢您的反馈，我们会认真对待。'],
'暖心':['感谢您一直以来的信任，这个情况我们非常重视，会加急处理。','让您久等了，我们正在协调，一定给您满意答复。','理解您的心情，我们一定尽快解决，不让您失望。'],
'幽默':['收到！这就给您办，绝不敷衍您 😄','放心，这事儿包在我们身上，保您满意！','OK的，我们效率杠杠的，稍等片刻。'],
'强韧':['感谢您的反馈，不过具体情况我们需要按协议条款核实后再回复。','这部分超出常规范围，我需要走内部流程评估，请您理解。','我们愿意配合，但需要明确责任归属后推进，避免后续分歧。']},
'对象':{
'得体':['辛苦啦，等你缓过来我们一起吃点好的。','听到你说这些，我有点心疼，来，抱抱。','没事的，有我在呢，慢慢说给我听。'],
'暖心':['辛苦了，我知道你很不容易，累了就靠着我。','别太勉强自己，不开心的事都说给我听。','不管怎样我都站你这边，你最重要。'],
'幽默':['来，我给你点杯你爱的，包你满血复活 😄','你委屈了，罚我请你吃顿大餐！','别愁啦，天塌下来有我这个高个儿顶着～'],
'强韧':['我理解你的情绪，但这件事我们好好沟通，别伤感情。','我们之间可以好好说，我不希望用情绪解决问题。','我在乎你，所以我们更要坦诚地谈一谈。']},
'朋友':{
'得体':['听到你这样，我挺担心的，需要我帮忙尽管开口。','辛苦啦，改天请你吃饭散散心。','好的，我记着了，有需要随时call我。'],
'暖心':['不管发生什么，我都在，别一个人扛着。','有你这个朋友真好，我也一直在呢。','抱抱你，时候到了都会好起来的。'],
'幽默':['哈？谁欺负我兄弟，我第一个不答应 😄','走，烧烤啤酒安排上，边吃边聊！','怕啥，说好的有福同享有难我陪。'],
'强韧':['我懂你的难处，但这件事我要跟你把话说在前头，是为你好。','咱们是朋友才直说，这个忙可以帮，但原则要说清楚。','我支持你，也希望你听我一句劝。']},
'长辈':{
'得体':['好的，谢谢您提醒，我记下了，一定注意。','您说得对，我记在心里了，您放心。','好的，我会放在心上，谢谢您的挂念。'],
'暖心':['您这么惦记我，特别暖心，您也要照顾好自己身体。','收到，您的话我记住了，有空去看您。','谢谢您，有您这句话真踏实，您也多保重。'],
'幽默':['哈哈，您说得是，我一定照办，让您放心！','好嘞，保证按您说的来，不让您操心 😄','记住了记住了，您就放心吧！'],
'强韧':['谢谢您的关心，这件事我有自己的安排，会处理好的。','我明白您的意思，不过这件事我会按我自己的节奏来。','您放心，我有分寸，会对自己负责。']}};
function pick(a){return a[Math.floor(Math.random()*a.length)];}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('高情商聊天回复生成器 | AgentGongju.com'))return;
const who=document.getElementById('who').value;
const situation=document.getElementById('situation').value.trim();
const tone=document.getElementById('tone').value;
const vers=parseInt(document.getElementById('vers').value);
if(!situation){alert('请描述一下对方说了什么或你的处境');return;}
const opts=BANK[who][tone];
const heads={'领导':'👉 ','同事':'👉 ','客户':'👉 ','对象':'💛 ','朋友':'👉 ','长辈':'🌿 '}[who];
let out=`对方：${who}　|　语气：${tone}\n情境：${situation.length>60?situation.slice(0,60)+'…':situation}\n\n━━━━━━━━━━━━━━━━\n\n`;
const used=[];
for(let i=0;i<vers;i++){
let base=pick(opts);
while(used.includes(base)){base=pick(opts);}
used.push(base);
out+=`${heads}版本 ${i+1}：\n${base}\n\n`;
}
out+='━━━━━━━━━━━━━━━━\n💡 可选一条，也可组合使用，记得贴合实际语气自然地说出口～';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 回复已复制！'))}
</script>
</body>
</html>
