<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>朋友圈营业文案生成 | AgentGongju.com</title>
<meta name="description" content="针对微商、店主、个人IP，一键生成刷屏不烦人、高转化朋友圈营销文案">
<meta name="keywords" content="朋友圈,微商文案,营销文案,推广文案,朋友圈文案,私域运营">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:720px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:600}
input[type=text],textarea,select{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
textarea{resize:vertical;min-height:80px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;min-height:60px;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>📱 朋友圈营业文案生成</h1><p>不发烦人广告，也能把生意做进朋友圈</p></div>

<div class="card"><div class="param-row">
<div><label>🛍️ 卖的是什么</label><input type="text" id="product" placeholder="例如：轻奢女装 / 有机水果 / 线上课程"></div>
<div><label>🎯 文案类型</label><select id="type"><option value="种草" selected>日常种草</option><option value="痛点">痛点转化</option><option value="上新">新品上新</option><option value="口碑">客户反馈</option><option value="限时">限时活动</option></select></div>
</div>
<label>📝 一点补充（产品卖点/心情，可选）</label><textarea id="extra" placeholder="例如：这批手作纯天然无添加，只剩最后30份"></textarea>
<button class="btn-gen" id="genBtn">✍️ 生成朋友圈文案</button></div>

<div class="result-area" id="resultArea"><div class="card"><div class="result-box" id="result"></div><button class="copy-btn" onclick="copyResult()">📋 复制</button></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const samples={
种草:'把日子过成喜欢的样子，藏不住的快乐想跟你分享。\n最近超爱的小确幸《{p》上线啦，品质在线，关键是颜值也长在我审美上。\n感兴趣的朋友我来给你细说～',
痛点:'你有没有过这种烦？花了钱买回来却吃灰、不合适、还要退货。\n所以这次我认真帮大家把关，只推我自己都反复回购的《{p》。\n品质，我替你先试过了。',
上新:'叮🔔 新鲜出炉！\n《{p》正式上新啦，这一批我可是盯了整整一周的品质。\n数量不多，先到先得，想要的扣1~',
口碑:'收到老顾客的好评，比赚到钱还开心🥰\n“《{p》真的值这个价，我回购三次了”\n谢谢大家的信任，我会继续把产品做好。\n有需要的朋友随时找我～',
限时:'⚡限时福利，仅此今天！\n平时99的《{p》，今天直接给你省到底。\n手慢无，错过真的要等很久咯。\n私我“抢”，我来安排～'
};
const hooks=['☀️ 又是元气满满的一天','🌊 分享一点小确幸','今日份开心度+1'],
hashtags=['#好物分享','#品质生活','#真诚推荐','#不踩雷'];
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('朋友圈营业文案生成 | AgentGongju.com'))return;
let p=document.getElementById('product').value.trim();let type=document.getElementById('type').value;let extra=document.getElementById('extra').value.trim();
if(!p){alert('请输入你卖的产品/服务');return;}
let tpl=samples[type]||samples['种草'];
let body=tpl.replace(/\{p\}/g,p);
let out='【'+type+'·'+p+'】\n\n'+ (type==='口碑'?'':'') + body.replace(/^自定义/m,'');
if(extra)out+='\n\n（补充：'+extra+'）';
out+='\n\n'+hashtags.slice(0,3).join(' ')+'\n\n'+'—— 来自 AgentGongju 文案助手';
document.getElementById('result').textContent=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('result').textContent).then(()=>alert('✅ 已复制！'))}
</script>
</body>
</html>
