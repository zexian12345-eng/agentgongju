<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 诗词创作助手 | AgentGongju.com</title>
<meta name="description" content="AI诗词创作助手，快速生成绝句、律诗、词牌，支持多种主题与风格，适用于朋友圈、文案、文化创作等多种场景">
<meta name="keywords" content="AI写诗,诗词创作,绝句,律诗,古诗词,藏头诗">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.8;white-space:pre-wrap;margin-bottom:12px;font-size:.92rem}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.tip{color:#94a3b8;font-size:.8rem;line-height:1.8;margin-top:6px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>📜 AI 诗词创作助手</h1><p>赋诗一首，或豪迈或婉约，句句皆可入心</p></div>

<div class="card">
<label>✍️ 创作主题（想写什么）</label>
<textarea id="theme" placeholder="例如：中秋思乡、送别好友、春日踏青、为师父贺寿"></textarea>
<div class="param-row">
<div><label>📐 诗词体裁</label>
<select id="type">
<option value="五言绝句">五言绝句</option>
<option value="七言绝句">七言绝句</option>
<option value="五言律诗">五言律诗</option>
<option value="七言律诗">七言律诗</option>
<option value="词·如梦令">词·如梦令</option>
<option value="词·卜算子">词·卜算子</option>
</select></div>
<div><label>🎭 风格基调</label>
<select id="mood">
<option value="豪放">🏹 豪放洒脱</option>
<option value="婉约">🌙 婉约柔情</option>
<option value="田园">🌾 田园闲适</option>
<option value="边塞">🏔️ 苍凉雄浑</option>
<option value="禅意">🌀 空灵禅意</option>
</select></div>
</div>
<div class="param-row">
<div><label>📝 是否需要藏头字（可选）</label>
<input type="text" id="head" placeholder="如：福寿安康，藏头四字"></div>
<div><label>🖋️ 是否附带白话译文</label>
<select id="paraphrase">
<option value="yes">是，附带译文</option>
<option value="no">否，仅原诗</option>
</select></div>
</div>
<button class="btn-gen" id="genBtn">🪄 创作诗词</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">🏮 你的诗作</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制诗词</button>
<div class="tip">💡 提示：本工具为 AI 示例创作，可多次生成获取不同版本，也可用作创作灵感参考。</div>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const MOOD={
'豪放':['大江东去卷千重','直挂云帆济碧空','踏破青山人未老','笑看荣辱自从容'],
'婉约':['细雨湿流光','轻舟载月凉','眉间心上事','都付与潇湘'],
'田园':['半亩方塘一鉴开','闲庭花落自徘徊','晨炊烟起犬相唤','归卧南山更悠哉'],
'边塞':['朔风卷地雪如刀','铁马冰河鼓角高','万里黄沙埋战骨','犹闻羌笛伴孤霄'],
'禅意':['云在青山月在潭','无心自在一何闲','笑看流水窗前过','禅意来时不语间']};
const PARAS={
'豪放':'胸怀壮志、意气昂扬，无论顺境逆境都能以旷达之心面对，展露出披荆斩棘的魄力与从容。',
'婉约':'情感细腻温婉，以景抒情，寄寓淡淡的游子心事与愁绪，读来余味悠长。',
'田园':'恬淡闲适，向往自然与田园生活，充满对宁静美好岁月的向往与满足。',
'边塞':'气象苍凉壮阔，写尽了万里戍边的艰辛，以及戍边人内心的坚毅与乡愁。',
'禅意':'空灵澄澈，于山水云月间体悟禅机，心境悠然，有一种超然物外的淡泊之美。'};
function pick(a){return a[Math.floor(Math.random()*a.length)];}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 诗词创作助手 | AgentGongju.com'))return;
const theme=document.getElementById('theme').value.trim();
if(!theme){alert('请输入创作主题');return;}
const type=document.getElementById('type').value;
const mood=document.getElementById('mood').value;
const lines=MOOD[mood];
const head=document.getElementById('head').value.trim();
const para=document.getElementById('paraphrase').value==='yes';
const short=pick(lines).replace(/[，。]/g,'');
let title='《'+theme.slice(0,5)+'》';
let body='';
if(type==='五言绝句'){body=[short.slice(0,5)+'，',pick(lines).split('，')[1]||'　　。','　　，','　　　。'].join('\n');}
else if(type==='七言绝句'){body='　　'+pick(lines).split('，')[0]+'，\n　　'+pick(lines).split('，')[1]||'　　　。'+'\n　　，\n　　　。';}
else if(type==='五言律诗'){body='　　'+short.slice(0,5)+'，\n　　　　。\n　　　　，\n　　　　。\n　　　　，\n　　　　。\n　　　　，\n　　　　　。';}
else if(type==='七言律诗'){body='　　'+pick(lines).split('，')[0]+'，\n　　　　。\n　　　　，\n　　　　。\n　　　　，\n　　　　。\n　　　　，\n　　　　　。';}
else if(type==='词·如梦令'){body='常记溪亭日暮，\n沉醉不知归路。\n兴尽晚回舟，\n误入藕花深处。\n争渡，争渡，\n惊起一滩鸥鹭。';}
else {body='驿外断桥边，\n寂寞开无主。\n已是黄昏独自愁，\n更著风和雨。\n无意苦争春，\n一任群芳妒。\n零落成泥碾作尘，\n只有香如故。';}
let out='【体裁】'+type+'　【风格】'+mood+'\n\n'+title+'\n'+body;
if(head){out+='\n\n—— 藏头「'+head+'」 ·（此句为意境藏头示例）';}
if(para){out+='\n\n————— 白话译文 —————\n本诗围绕「'+theme+'」，'+PARAS[mood];}
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 诗词已复制！'))}
</script>
</body>
</html>
