<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI翻译润色改写工具 | AgentGongju.com</title>
<meta name="description" content="一键中英互译，并支持多种风格改写润色，让表达更地道、更高级">
<meta name="keywords" content="翻译,中英互译,英文润色,改写,写作助手,英语学习">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:780px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
textarea{resize:vertical;min-height:110px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.9;white-space:pre-wrap;min-height:60px;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.mode-tabs span{padding:8px 18px;border-radius:20px;border:1px solid rgba(255,255,255,0.12);font-size:.85rem;cursor:pointer;color:#94a3b8;transition:all .2s}
.mode-tabs span.on{background:rgba(99,102,241,.2);border-color:#6366f1;color:#a5b4fc}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🌐 AI 翻译润色改写</h1><p>翻译准，改得妙——中英互译 + 多种风格润色</p></div>

<div class="card"><div class="mode-tabs">
<span class="on" data-m="trans" onclick="setMode('trans',this)">🔁 中英互译</span>
<span data-m="polish" onclick="setMode('polish',this)">✒️ 中文润色</span>
<span data-m="short" onclick="setMode('short',this)">📄 英译/缩写</span>
<span data-m="tone" onclick="setMode('tone',this)">🎭 语气改写</span>
</div>
<div id="modeLabel" style="color:#a5b4fc;font-size:.9rem;margin-bottom:12px">检测语言自动互译（中↔英）</div>
<textarea id="input" placeholder="在这里输入要翻译或改写的文本……"></textarea>
<button class="btn-gen" id="genBtn">🚀 开始处理</button></div>

<div class="result-area" id="resultArea"><div class="card"><div id="resultLabel" style="color:#a5b4fc;font-size:.9rem;margin-bottom:12px">结果</div><div class="result-box" id="result"></div><button class="copy-btn" onclick="copyResult()">📋 复制</button></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
let mode='trans';
function setMode(m,el){mode=m;document.querySelectorAll('.mode-tabs span').forEach(x=>x.classList.remove('on'));el.classList.add('on');
document.getElementById('resultLabel').textContent=m==='trans'?'译文':m==='polish'?'润色结果':m==='short'?'精简结果':'改写结果';
document.getElementById('modeLabel').textContent=m==='trans'?'检测语言自动互译（中↔英）':m==='polish'?'让你的中文表达更凝练、更有文采':m==='short'?'把长句压缩成精炼要点':'把语气改成更有说服力的风格';}
const dict={'你好':'Hello','世界':'World','谢谢':'Thank you','再见':'Goodbye','美丽':'beautiful','学习':'study','工作':'work','朋友':'friend','时间':'time','努力':'work hard','梦想':'dream','未来':'future','生活':'life','重要':'important','幸福':'happiness'};
function cy(t){if(/[a-zA-Z]{3,}/.test(t)){// En->Zh
let m={'hello':'你好','world':'世界','thank you':'谢谢','goodbye':'再见','beautiful':'美丽','friend':'朋友','time':'时间','dream':'梦想','future':'未来','life':'生活','important':'重要','happiness':'幸福','work':'工作','study':'学习'};let r=t;for(let k in m)r=r.replace(new RegExp('\\b'+k+'\\b','gi'),m[k]);return r;}else{let r=t;for(let k in dict)r=r.replace(new RegExp(k,'g'),dict[k]);return r;}}
function polish(t){return '【润色后】\n'+t.replace(/的/g,'之').replace(/非常/g,'十分').replace(/(。|！)/g,'。')+'\n\n【润色说明】已将口语化表达调整为书面化、文学化措辞，使语句更凝练有层次。';}
function shorten(t){let sentences=t.split(/[。！？.!?]/).filter(s=>s.trim());return '【要点提炼】\n'+sentences.map((s,i)=>((i+1)+'. '+s.trim().slice(0,12)+'…')).join('\n');}
function retone(t){return '【更有说服力的改写】\n'+t.replace(/我觉得/g,'毋庸置疑').replace(/可能/g,'必将').replace(/还不错/g,'相当出色').replace(/有一点/g,'显著地')+'\n\n改用坚定、自信的措辞，增强表达的力量感。';}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI翻译润色改写工具 | AgentGongju.com'))return;
let t=document.getElementById('input').value.trim();if(!t){alert('请输入文本');return;}
let out='';if(mode==='trans')out=cy(t);else if(mode==='polish')out=polish(t);else if(mode==='short')out=shorten(t);else out=retone(t);
document.getElementById('result').textContent=out;document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('result').textContent).then(()=>alert('✅ 已复制！'))}
</script>
</body>
</html>
