<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品测评文案生成器 | AgentGongju.com</title>
<meta name="description" content="商品测评文案生成器，一键生成真实感十足的好评、差评或中立测评文案，适用于电商评价、测评种草、买家秀文案等场景">
<meta name="keywords" content="商品评价,测评文案,买家秀,好评,差评,种草文案,电商评价">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.8;white-space:pre-wrap;margin-bottom:12px;font-size:.92rem}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.tip{color:#94a3b8;font-size:.8rem;line-height:1.8;margin-top:6px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🛍️ 商品测评文案生成器</h1><p>写评价不再词穷，真实又有重点</p></div>

<div class="card">
<label>📦 商品名称/类型</label>
<input type="text" id="product" placeholder="例如：无线蓝牙耳机、保温杯、扫地机器人、小家电">
<label>🌡️ 评价倾向</label>
<select id="type">
<option value="好评">😍 好评种草</option>
<option value="差评">😤 差评吐槽</option>
<option value="中立">🤔 中立客观</option>
</select>
<div class="param-row">
<div><label>✨ 使用场景</label>
<select id="scene">
<option value="自用">自用测评</option>
<option value="送人">送人礼物</option>
<option value="办公">办公使用</option>
<option value="居家">居家生活</option>
</select></div>
<div><label>🔢 生成数量</label>
<select id="num">
<option value="3">3 条</option>
<option value="5">5 条</option>
</select></div>
</div>
<label>📝 实际使用感受（可选，写得越具体越真实）</label>
<textarea id="feel" placeholder="例如：用了两周，音质不错但连接偶尔会断；颜值高，容量大，就是有点重"></textarea>
<button class="btn-gen" id="genBtn">✨ 生成文案</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">⭐ 你的测评文案</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制全部</button>
<div class="tip">💡 提示：建议结合真实使用情况如实描述，测评文案以诚实、有帮助为佳。</div>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const GOOD={
'好评':['包装很用心，收到没有磕碰，做工也没得挑。','使用体验超出预期，这个价位真的挺值的。','细节到位，看得出是用心做的产品，推荐。','上手很简单，很快就用顺手了，好评！','颜值和性能都在线，已经在回购了。'],
'差评':['收到后发现有点小瑕疵，做工一般般。','性价比一般，实际效果没有宣传的那么好。','到手体验略失望，跟想象的有点差距。','客服响应有点慢，处理问题不太及时。','用了一周就出现小问题，售后要跟得上啊。'],
'中立':['整体中规中矩，优点缺点都明显，看个人需求。','不算完美，但也对得起这个价格，见仁见智。','基本功能没问题，细节还有提升空间。','中肯来说，看你的使用场景，合适就值。']};
const OPEN={
'自用':'买来自己用了一段时间','送人':'买来送朋友，对方很喜欢','办公':'平时办公用的比较多','居家':'放家里日常使用'};
const STRENGTH=['性价比','颜值做工','使用手感','功能体验','包装物流'];
const WEAK=['细节做工','客服响应','续航/耐用度','宣传与实际','价格'];
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){let r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('商品测评文案生成器 | AgentGongju.com'))return;
const product=document.getElementById('product').value.trim()||'这款商品';
const type=document.getElementById('type').value;
const scene=document.getElementById('scene').value;
const num=parseInt(document.getElementById('num').value);
const feel=document.getElementById('feel').value.trim();
let out=`【${product}】测评文案 · ${type} · ${num} 条\n\n`;
for(let i=0;i<num;i++){
const base=pick(GOOD[type]);
if(type==='好评'){out+=`${i+1}️⃣ ${OPEN[scene]}，${base}\n   优点：${pick(STRENGTH)}确实不错，${pick(GOOD['好评'])}\n   建议：${pick(['追求极致可以再观望，日常使用完全够了','整体满意，值得入手','回购率高，可以放心冲'])}\n\n`;}
else if(type==='差评'){out+=`${i+1}️⃣ ${OPEN[scene]}，${base}\n   槽点：${pick(WEAK)}这块有待改进，希望改进。\n   结论：${pick(['如果在意这点建议慎拍','看大家更看重哪方面，理性下单','给卖家优化建议，期待改善'])}\n\n`;}
else{out+=`${i+1}️⃣ ${OPEN[scene]}，${base}\n   亮点：${pick(STRENGTH)}\n   不足：${pick(WEAK)}\n   一句话：${pick(['看需求，合适就值','中规中矩，别抱太高期待','看预算和用途再决定'])}\n\n`;}
}
if(feel){out+='━━ 你的真实体验备注 ━━\n'+feel+'\n\n（可融入上方任意一条，让评价更真实）\n';}
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 文案已复制！'))}
</script>
</body>
</html>
