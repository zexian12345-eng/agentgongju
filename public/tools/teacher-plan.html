<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 教案生成器 | AgentGongju.com</title>
<meta name="description" content="输入课程主题、年级与课时，AI快速生成完整教案，包含教学目标、重难点、教学过程与板书设计">
<meta name="keywords" content="教案,教师,教学,备课,课程设计,教育">
<link rel="stylesheet" href="../css/style.css">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.outline{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:22px;color:#e2e8f0;line-height:1.9;white-space:pre-wrap;margin-bottom:12px;font-size:.92rem}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>📋 AI 教案生成器</h1><p>备课神器，十分钟产出专业教案</p></div>

<div class="card">
<label>📖 课程主题</label>
<textarea id="topic" placeholder="例如：《背影》朱自清 或 一元二次方程的解法 或 太阳系八大行星"></textarea>
<div class="param-row">
<div><label>🎒 适用年级</label>
<select id="grade">
<option value="小学低年级">小学低年级</option>
<option value="小学高年级">小学高年级</option>
<option value="初中">初中</option>
<option value="高中">高中</option>
<option value="大学">大学</option>
</select></div>
<div><label>⏱ 课时长度</label>
<select id="duration">
<option value="40">40分钟</option>
<option value="45">45分钟</option>
<option value="50">50分钟</option>
<option value="90">90分钟（连堂课）</option>
</select></div>
</div>
<button class="btn-gen" id="genBtn">🚀 生成教案</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:16px">✅ 完整教案</div>
<div class="outline" id="lessonBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制教案</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const openers=['通过生活实例导入，激发学生兴趣','以提问引入，激活学生已有经验','播放一段相关视频/故事，创设情境导入','展示图片素材，引导学生观察思考'];
const activities=['小组合作探究','情境角色扮演','动手实践操作','师生问答互动','课堂小游戏'];
const summaries=['教师总结归纳本课核心知识，形成知识框架','引导学生自行梳理小结，查漏补缺','通过当堂练习检测掌握情况，及时反馈'];
const assignments=['完成课后练习与思考题','观察生活并记录相关现象，下节课分享','完成一份拓展小作业'];
const themes=['知识立意','素养导向','学以致用'];
function rand(a){return a[Math.floor(Math.random()*a.length)]}
document.getElementById('genBtn').addEventListener('click',()=>{
const topic=document.getElementById('topic').value.trim()||'本课主题';
const grade=document.getElementById('grade').value;
const dur=document.getElementById('duration').value;
let out='《'+topic+'》教学设计\n';
out+='【适用年级】'+grade+'　【课时】'+dur+'分钟\n\n';
out+='一、教学目标\n  1. 知识与技能：理解并掌握「'+topic+'」的核心概念与内容。\n  2. 过程与方法：通过'+rand(activities)+'，提升分析与运用能力。\n  3. 情感态度与价值观：激发学习兴趣，培养'+rand(themes)+'的意识。\n\n';
out+='二、教学重难点\n  ▸ 重点：理解「'+topic+'」的关键知识点。\n  ▸ 难点：在真实情境中灵活运用所学内容解决问题。\n\n';
out+='三、教学准备\n  多媒体课件、教具学具、任务单、拓展资料若干。\n\n';
out+='四、教学过程\n';
const min=dur>=60?8:5;
out+='  🔹 导入环节（'+min+'分钟）\n    '+rand(openers)+'，引出课题《'+topic+'》。\n';
const core=Math.max(18,Math.floor(dur*0.5));
out+='  🔹 新授环节（'+core+'分钟）\n    ① 呈现核心知识点，结合多媒体直观讲解；\n    ② 组织'+rand(activities)+'，突破重难点；\n    ③ 典型例题示范，引导学生归纳方法。\n';
out+='  🔹 练习巩固（'+(dur-core-min-8)+'分钟）\n    分层练习：基础题＋提升题，个别辅导。\n';
out+='  🔹 课堂小结（5分钟）\n    '+rand(summaries)+'。\n';
out+='  🔹 布置作业（3分钟）\n    '+rand(assignments)+'。\n\n';
out+='五、板书设计\n  主板书围绕课题层级展开，突出核心概念与方法，条例清晰，重点用彩色粉笔标注。\n\n';
out+='六、教学反思\n  课后记录学生掌握情况与课堂生成，动态调整下节课教学策略。';
document.getElementById('lessonBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText('【AI 教案生成】\n'+document.getElementById('lessonBox').innerText).then(()=>alert('✅ 已复制！'))}
</script>
</body>
</html>
