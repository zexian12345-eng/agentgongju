<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品文案生成器 | AgentGongju.com</title>
<meta name="description" content="AI商品卖点文案生成，电商详情页标题、卖点、种草文案一键生成">
<meta name="keywords" content="商品文案,电商文案,卖点提炼,种草文案,标题生成">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.9;white-space:pre-wrap;min-height:60px;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🏷️ 商品文案生成</h1><p>电商标题 · 核心卖点 · 种草短文一键生成</p></div>

<div class="card"><label>📦 商品名称</label>
<input type="text" id="prod" placeholder="例如：全自动咖啡机">
<label>📝 商品卖点 / 特点（用逗号分隔，如：一键萃取,28秒出杯,奶泡绵密）</label>
<textarea id="feats" placeholder="例如：一键萃取, 28秒快速出杯, 绵密奶泡, 智能温控, 小巧不占台面"></textarea>
<div class="param-row"><div><label>平台风格</label><select id="plat"><option value="淘宝">淘宝详情页</option><option value="抖音">抖音短视频</option><option value="小红书">小红书种草</option><option value="京东">京东标品</option></select></div><div><label>目标人群</label><select id="crowd"><option value="上班族">上班族</option><option value="学生党">学生党</option><option value="宝妈">宝妈</option><option value="精致girl">精致girl</option><option value="数码控">数码控</option></select></div></div>
<button class="btn-gen" id="genBtn">✨ 生成商品文案</button></div>
<div class="result-area" id="resultArea"><div class="card">
<div class="result-box" id="out"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制全部文案</button></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyResult(){navigator.clipboard.writeText(document.getElementById('out').textContent).then(()=>alert('✅ 已复制！'))}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('商品文案生成器 | AgentGongju.com'))return;
const prod=document.getElementById('prod').value.trim();if(!prod){alert('请输入商品名称');return}
const feats=document.getElementById('feats').value.split(/[,，、]/).map(s=>s.trim()).filter(Boolean);
const plat=document.getElementById('plat').value;const crowd=document.getElementById('crowd').value;
if(feats.length===0){alert('请至少填写一个卖点');return}
const f=feats.slice(0,4);
const titles=['爆款推荐！'+prod+'｜'+f[0]+'，'+(f[1]||'性价比拉满')+'','闭眼入的'+prod+'，'+f[0]+'真的绝了🔥',''+prod+'测评：'+(f[1]||f[0])+'，'+(f[2]||'体验升级')+'让人心动','2026年必囤！'+prod+'，'+(f[0])+'才是关键！'];
const bullets=f.map(x=>'· '+x).join('\n');
let head='';
if(plat==='小红书'){head='#好物推荐 #平价好物 #宝藏单品\n\n姐妹们！这款'+prod+'真的让我直呼真香😍\n\n'+bullets+'\n\n妥妥的'+crowd+'必备，性价比直接拉满，入股不亏～';}
else if(plat==='抖音'){head='【'+prod+'】'+f[0]+'！'+f[1]+'！\n\n家人们先别划走！这款'+prod+'简直为'+crowd+'量身定做～\n'+bullets+'\n左下角小黄车，手慢无！';}
else{head='【商品名称】'+prod+'\n【核心卖点】\n'+bullets+'\n【适用人群】'+crowd+'\n【推荐语】'+prod+'，专为'+crowd+'打造，'+f[0]+'，让你的日常更轻松。';
document.getElementById('out').textContent='【'+plat+'】\n\n🏆 标题选项：\n'+titles[Math.floor(Math.random()*titles.length)]+'\n\n主要文案：\n'+head;
document.getElementById('resultArea').classList.add('active');return;}
document.getElementById('out').textContent='【'+plat+'】\n\n'+head;
document.getElementById('resultArea').classList.add('active');
});
</script>
</body>
</html>
