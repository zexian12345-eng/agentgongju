<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奶茶DIY配方生成器 | AgentGongju.com</title>
<meta name="description" content="奶茶DIY配方生成器，一键生成网红奶茶、果茶、咖啡特调配方，含原料配比与教程步骤，在家也能做出好味道">
<meta name="keywords" content="奶茶配方,DIY奶茶,果茶,冷萃,网红饮品,自制饮品">
<link rel="stylesheet" href="../css/style.css">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.8;white-space:pre-wrap;margin-bottom:12px;font-size:.92rem}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.tip{color:#94a3b8;font-size:.8rem;line-height:1.8;margin-top:6px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🧋 奶茶DIY配方生成器</h1><p>足不出户，复刻一杯杯快乐</p></div>

<div class="card">
<div class="param-row">
<div><label>🥤 饮品类型</label>
<select id="type">
<option value="奶茶">珍珠奶茶</option>
<option value="果茶">鲜果茶</option>
<option value="奶盖">芝士奶盖茶</option>
<option value="咖啡">咖啡特调</option>
<option value="冷萃">冷萃/气泡饮</option>
</select></div>
<div><label>🍬 甜度</label>
<select id="sugar">
<option value="全糖">全糖</option>
<option value="七分甜">七分甜</option>
<option value="五分甜">五分甜</option>
<option value="三分甜">三分甜</option>
<option value="无糖">无糖（代糖）</option>
</select></div>
</div>
<div class="param-row">
<div><label>🧊 冰量</label>
<select id="ice">
<option value="正常冰">正常冰</option>
<option value="少冰">少冰</option>
<option value="去冰">去冰</option>
<option value="热饮">热饮</option>
</select></div>
<div><label>🔥 茶底基底</label>
<select id="base">
<option value="红茶">红茶底</option>
<option value="绿茶">绿茶底</option>
<option value="乌龙">乌龙茶底</option>
<option value="茉莉">茉莉花茶底</option>
<option value="无茶">无茶底</option>
</select></div>
</div>
<label>🍓 想要的口味/配料（可选）</label>
<input type="text" id="topping" placeholder="例如：加椰果、黑糖、柠檬、芒果、芋泥">
<button class="btn-gen" id="genBtn">✨ 生成配方</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">🧑‍🍳 你的专属配方</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制配方</button>
<div class="tip">💡 提示：以 500ml 一杯为基准调制，甜度可按个人口味微调糖浆用量。</div>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const TYPE={
'奶茶':{milk:'纯牛奶 250ml',extra:'黑糖珍珠',step:'奶与茶融合，绵密顺滑'},
'果茶':{milk:'鲜榨果汁 200ml',extra:'时令水果',step:'果香清新，冰爽解腻'},
'奶盖':{milk:'奶盖 80ml（淡奶油打发）',extra:'海盐芝士',step:'奶盖咸香浓郁，与茶分层'},
'咖啡':{milk:'浓缩咖啡 2shot',extra:'燕麦奶',step:'醇厚咖啡，回味悠长'},
'冷萃':{milk:'气泡水 200ml',extra:'薄荷叶',step:'清爽气泡，夏日必备'}};
const SUGAR={
'全糖':'糖浆 30ml','七分甜':'糖浆 22ml','五分甜':'糖浆 15ml','三分甜':'糖浆 8ml','无糖':'代糖 5ml'};
const ICE={ '正常冰':'冰块加满','少冰':'冰块少量','去冰':'不加冰','热饮':'加热至 60℃'};
const TOPPING=['珍珠','椰果','芋圆','布丁','红豆','寒天','烧仙草','西米'];
function pick(a){return a[Math.floor(Math.random()*a.length)];}
document.getElementById('genBtn').addEventListener('click',()=>{
const type=document.getElementById('type').value;
const sugar=document.getElementById('sugar').value;
const ice=document.getElementById('ice').value;
const base=document.getElementById('base').value;
const top=document.getElementById('topping').value.trim();
const t=TYPE[type];
const topChoice=top||pick(TOPPING);
const out=`【${type}】· ${sugar} ${ice} ${base}

——— 材料清单（500ml/杯）———
· 茶底：${base==='无茶'?(type==='咖啡'?'浓缩咖啡 60ml':'牛奶 300ml'):'茶汤 250ml（'+base+'）'}
· ${t.milk}
· 甜度：${SUGAR[sugar]}
· 冰量：${ICE[ice]}
· 灵魂配料：${topChoice}
· 点睛：${t.extra}

——— 制作步骤 ———
1️⃣ 提前泡好${base==='无茶'?'牛奶/咖啡基底':base+'茶汤'}，放凉备用；
2️⃣ 杯底铺入${topChoice}，倒入${SUGAR[sugar]}；
3️⃣ 加入${ICE[ice]+(/冰/.test(ICE[ice])?'':'，倒入茶底')}；
4️⃣ 依次倒入茶汤与${t.milk}${type==='奶盖'?'，最后轻轻铺上奶盖使分层明显':''}；
5️⃣ 搅拌均匀即可享用！${type==='奶盖'?'（先尝奶盖再搅拌更有仪式感）':''}

——— 口感小贴士 ———
${t.step}。在家复刻，甜度冰量自由掌控，比外卖更懂你！`;
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 配方已复制！'))}
</script>
</body>
</html>
