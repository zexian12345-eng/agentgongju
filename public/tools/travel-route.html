<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 城市旅行攻略 | AgentGongju.com</title>
<meta name="description" content="输入旅行目的地、天数与偏好，AI生成一份完整的三日游攻略，含行程安排、美食推荐与实用贴士">
<meta name="keywords" content="旅行,攻略,行程,旅游,美食,景点,攻略生成">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.day-block{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:18px;margin-bottom:12px}
.day-block h4{color:#fbbf24;margin-bottom:10px;font-size:1rem}
.day-block .item{font-size:.9rem;color:#cbd5e1;line-height:1.8}
.day-block .item b{color:#e2e8f0}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🧳 AI 城市旅行攻略</h1><p>说走就走，攻略我来帮你排</p></div>

<div class="card">
<label>📍 目的地</label>
<input type="text" id="city" placeholder="例如：成都、西安、厦门、重庆、大理">
<div class="param-row">
<div><label>📅 旅行天数</label>
<select id="days">
<option value="3">3天</option>
<option value="5">5天</option>
<option value="7">7天</option>
</select></div>
<div><label>🎯 旅行偏好</label>
<select id="style">
<option value="经典">🏛 经典景点必打卡</option>
<option value="美食">🍜 吃货美食之旅</option>
<option value="休闲">🌴 慢节奏休闲</option>
<option value="文艺">🎨 文艺小资&网红</option>
</select></div>
</div>
<button class="btn-gen" id="genBtn">🧳 生成攻略</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:16px">✅ 旅行攻略</div>
<div id="travelBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制攻略</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const famousCity={成都:['宽窄巷子','锦里','大熊猫基地','武侯祠','春熙路'],西安:['兵马俑','大雁塔','回民街','钟鼓楼','城墙'],厦门:['鼓浪屿','环岛路','曾厝垵','南普陀','沙坡尾'],重庆:['洪崖洞','解放碑','磁器口','长江索道','李子坝'],大理:['洱海','大理古城','苍山','双廊','喜洲古镇'],杭州:['西湖','灵隐寺','河坊街','西溪湿地','宋城'],北京:['故宫','长城','天安门','颐和园','南锣鼓巷'],广州:['珠江夜游','沙面','广州塔','越秀公园','上下九'],上海:['外滩','陆家嘴','豫园','田子坊','南京路'],拉萨:['布达拉宫','大昭寺','八廓街','纳木错','羊卓雍措']};
const foods={成都:['火锅','串串香','担担面','伤心凉粉','龙抄手'],西安:['肉夹馍','羊肉泡馍','凉皮','Biangbiang面','胡辣汤'],厦门:['沙茶面','土笋冻','海蛎煎','花生汤','姜母鸭'],重庆:['重庆小面','毛血旺','酸辣粉','烤鱼','抄手'],大理:['饵丝','乳扇','酸辣鱼','鲜花饼','白族三道茶'],杭州:['西湖醋鱼','龙井虾仁','东坡肉','片儿川','定胜糕'],北京:['北京烤鸭','炸酱面','豆汁','铜锅涮肉','驴打滚'],广州:['早茶','烧鹅','艇仔粥','肠粉','双皮奶'],上海:['生煎','小笼包','葱油拌面','蟹壳黄','红烧肉'],拉萨:['藏面','酥油茶','牦牛肉','糌粑','甜茶']};
function rand(a){return a[Math.floor(Math.random()*a.length)]}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 城市旅行攻略 | AgentGongju.com'))return;
const city=document.getElementById('city').value.trim()||'成都';
const days=parseInt(document.getElementById('days').value);
const style=document.getElementById('style').value;
const spots=famousCity[city]||['城市地标','老城区','博物馆','本地市集','滨江步道'];
const food=foods[city]||['本地特色菜','老字号小吃','夜市美食','梁头早餐'];
const box=document.getElementById('travelBox');box.innerHTML='';
const n=Math.min(days,3);
for(let d=1;d<=n;d++){
const block=document.createElement('div');block.className='day-block';
let markers=['🌅 上午','☀️ 下午','🌙 晚上'];
let items;
if(style==='美食'){items=[`逛<b>${rand(food)}</b>老店，尝地道早点`,`打卡<b>${rand(food)}</b>，再来份${rand(food)}`,`夜市扫街，${rand(food)}吃到扶墙】`];}
else if(style==='休闲'){items=[`睡到自然醒，找家<b>咖啡馆</b>慢慢喝`,`漫步<b>${rand(spots)}</b>，不赶时间`,`江边吹风看夜景，惬意收尾】`];}
else if(style==='文艺'){items=[`打卡<b>${rand(spots)}</b>拍照出片`,`逛文艺街区+${rand(food)}下午茶`,`去小酒馆/书店感受氛围】`];}
else{items=[`游览<b>${rand(spots)}</b>`,`前往<b>${rand(spots)}</b>，顺路吃${rand(food)}`,`夜游<b>${rand(spots)}</b>，灯光绝美】`];}
block.innerHTML=`<h4>📅 第 ${d} 天</h4>`+markers.map((m,i)=>`<div class="item">${m}　${items[i]}</div>`).join('')+`<div class="item" style="margin-top:6px;color:#a855f7">🚇 交通提示：市内建议地铁+打车结合，景点间预留30~60分钟。</div>`;
box.appendChild(block);
}
const tips=document.createElement('div');tips.className='day-block';
tips.innerHTML=`<h4>💡 出发前贴心提示</h4>
<div class="item">· 提前<b>预约</b>热门景点门票（大熊猫基地、故宫等需提前抢票）</div>
<div class="item">· 备好<b>身份证</b>、充电宝、舒适鞋子，市内可办交通卡/扫码乘车</div>
<div class="item">· 关注<b>天气</b>，市区以轻便穿搭为主，早晚/山区带外套</div>
<div class="item">· 想去<b>${rand(spots)}</b>建议避开周末高峰，体验更佳</div>`;
box.appendChild(tips);
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText('【AI 旅行攻略】\n'+document.getElementById('travelBox').innerText.replace(/\n{3,}/g,'\n')).then(()=>alert('✅ 已复制！'))}
</script>
</body>
</html>
