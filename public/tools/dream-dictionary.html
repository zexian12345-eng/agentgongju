<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 梦境详析 | AgentGongju.com</title>
<meta name="description" content="输入你做的梦，AI结合常见意象与现代心理学，解析梦境寓意、情绪暗示与生活启示，仅供参考娱乐">
<meta name="keywords" content="解梦,梦境,心理学,潜意识,做梦">
<link rel="stylesheet" href="../css/style.css">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;min-height:60px;margin-bottom:12px}
.theme-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tag{background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.35);border-radius:20px;padding:4px 14px;font-size:.82rem;color:#a5b4fc}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🌙 AI 梦境详析</h1><p>把梦说给我听，我为你解读潜意识的悄悄话</p></div>

<div class="card">
<label>💭 描述你的梦境</label>
<textarea id="dream" placeholder="例如：我梦见自己在大海边奔跑，但突然天空下起了大雨，我躲进了一座老房子里……"></textarea>
<div class="param-row">
<div><label>😴 梦境氛围感受</label>
<select id="mood">
<option value="平静">😌 平静</option>
<option value="焦虑">😰 焦虑不安</option>
<option value="开心">😄 开心幸福</option>
<option value="恐惧">😱 恐惧紧张</option>
<option value="困惑">🤔 迷茫困惑</option>
</select></div>
<div><label>🎯 解梦角度</label>
<select id="angle">
<option value="心理">🧠 心理学角度</option>
<option value="综合">🌐 传统+心理综合</option>
<option value="启发">🌟 生活启示</option>
</select></div>
</div>
<button class="btn-gen" id="genBtn">🌙 解析梦境</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:16px">🔎 梦境解析报告</div>
<div class="theme-tags" id="tagsBox"></div>
<div class="result-box" id="interpretBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制解析</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const symbols={
'水':['情绪与潜意识的流动','梦见水多与心境有关，平静的水宜放平心态，汹涌的水提示情绪需要宣泄'],
'大海':['心境的宽广与压力','大海象征你胸中的起伏，浪花多大，压力就有多大，试着给自己放个假'],
'雨':['情绪的释放与净化','雨是内心情绪的具象化，淋雨或被雨困，都是内心需要被治愈的信号'],
'天空':['理想与远景','广阔的天空对应你的抱负，灰蒙蒙则暗示方向感不足，需重新校准目标'],
'飞':['渴望自由与突破','飞翔常与摆脱束缚的愿望相关，越飞越高也代表对自己能力的自信'],
'坠落':['失控感与不安','坠落多与近期的不安全感、对失去掌控的担忧相关'],
'鬼':['潜藏的恐惧与压力','梦到鬼往往是现实压力的化身，直面它，恐惧就会消散'],
'牙齿掉':['焦虑与失去感','掉牙常与对衰老、失去或形象受损的焦虑有关'],
'考试':['被评价的紧张','考试梦反映对结果与评价的在意，放下对完美的执着'],
'追':['逃避与压力','被人追逐表示你在逃避某个现实问题，停下来正面面对反而轻松'],
'蛇':['隐患与直觉','蛇既可能是隐患，也可能代表内在的智慧，需结合对你的观感判断'],
'花':['美好与喜悦','鲜花象征欣欣向荣的心情或新机遇的萌芽'],
'猫':['独立与神秘','猫象征灵动直觉，也可能提示你需要一点自我空间'],
'狗':['忠诚与情感陪伴','狗是与情感连接相关的意象，反映你对亲密关系的期许'],
'家':['安全感与归属','家代表内心安全区，家中环境的杂乱暗示情绪需要整理'],
'死亡':['变化与重生','梦到死亡常象征旧阶段的结束与新生的开始，不必恐慌']};
const moods={
'平静':['你此刻内心较为安定，梦境是日常的温和回响','情绪基调平和，是身体在好好充电的信号'],
'焦虑':['梦境放大了你近期的焦虑，像一面镜子','试着列出烦恼清单，逐条化解，焦虑会减半'],
'开心':['好心情延伸到了梦里，是积极能量在持续','说明近期状态在线，记得感恩这些美好的小确幸'],
'恐惧':['恐惧是潜意识的警报，说明有未被面对的担忧','给它起个名字、说出来，勇气就会回来'],
'困惑':['梦境让你困惑，往往是你内心也在寻找答案','给自己一点安静时间，答案自会浮现']};
function rand(a){return a[Math.floor(Math.random()*a.length)]}
document.getElementById('genBtn').addEventListener('click',()=>{
const txt=document.getElementById('dream').value.trim();
const mood=document.getElementById('mood').value;
const angle=document.getElementById('angle').value;
const tagsBox=document.getElementById('tagsBox');tagsBox.innerHTML='';
if(!txt){document.getElementById('interpretBox').innerText='请先描述你的梦境哦～';document.getElementById('resultArea').classList.add('active');return;}
const found=[...symbols].filter(([k])=>txt.includes(k));
const used=found.length?found.slice(0,4):[['梦境','整体情绪与近期状态'],['生活','日常细节的投射']];
used.forEach(([k,v])=>{const t=document.createElement('span');t.className='tag';t.textContent='#'+k;tagsBox.appendChild(t);});
let out='【梦中意象解读】\n';
used.forEach(([k,v])=>{out+='· '+k+'：'+v+'\n';});
out+='\n【情绪线索】'+moods[mood][0]+'。'+moods[mood][1]+'。\n';
if(angle==='心理'){out+='\n【心理学视角】梦境是潜意识写给意识的一封信。近期的压力、渴望与未完成的心愿，都会化作意象入梦。你的梦在提醒你：好好照顾当下的心情。';}
else if(angle==='启发'){out+='\n【生活启示】不妨把梦当作一次温柔的自我对话——关注你的休息质量，给情绪一个出口，也别忘了那个让你开心的念头。';}
else{out+='\n【综合解读】结合传统联想与现代心理，这个梦更像一面镜子：映出你的情绪底色，也照见你可选择的下一步。梦醒之后，带着这份觉察去过好今天。';}
out+='\n\n（以上内容仅为趣味参考，愿你好梦常在 🌙）';
document.getElementById('interpretBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText('【AI 梦境详析】\n'+document.getElementById('interpretBox').innerText).then(()=>alert('✅ 已复制！'))}
</script>
</body>
</html>
