<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI健身计划生成器 | AgentGongju.com</title>
<meta name="description" content="AI健身计划生成器，根据目标、水平和时间自动生成科学的每周训练计划">
<meta name="keywords" content="健身计划,训练计划,减脂,增肌,运动计划,AI健身">
<link rel="stylesheet" href="../css/style.css">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.8;white-space:pre-wrap;min-height:60px;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🏋️ AI健身计划</h1><p>根据目标、水平与时间，生成科学的每周训练安排</p></div>

<div class="card"><div class="param-row">
<div><label>健身目标</label><select id="goal"><option>减脂塑形</option><option>增肌增重</option><option>强化体能</option><option>保持健康</option></select></div>
<div><label>训练水平</label><select id="level"><option>零基础</option><option>初级</option><option>中级</option><option>高级</option></select></div></div>
<div class="param-row">
<div><label>每周天数</label><select id="days"><option value="3">3 天</option><option value="4">4 天</option><option value="5">5 天</option></select></div>
<div><label>每次时长(分钟)</label><select id="time"><option value="30">30分钟</option><option value="45">45分钟</option><option value="60">60分钟</option></select></div></div>
<div><label>可用的运动条件（选填）</label><input type="text" id="cond" placeholder="例如：只有哑铃、无器械，在家练"></div>
<button class="btn-gen" id="genBtn">💪 生成训练计划</button></div>
<div class="result-area" id="resultArea"><div class="card"><div style="color:#22c55e;font-weight:600;margin-bottom:12px">📋 你的自定义训练计划</div><div class="result-box" id="out"></div><button class="copy-btn" onclick="copyResult()">📋 复制</button></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyResult(){navigator.clipboard.writeText(document.getElementById('out').textContent).then(()=>alert('✅ 已复制！'))}
const dayNames=['周一','周二','周三','周四','周五','周六','周日'];
const plans={
'减脂塑形':{'零基础':['全身热身+徒手深蹲','快走/慢跑有氧','全身拉伸','休息','轻力量循环','有氧+核心','休息'],'初级':['深蹲+弓步+高抬腿','开合跳+平板支撑','休息','全身循环训练','有氧间歇跑','核心+拉伸','休息']},
'增肌增重':{'零基础':['全身大肌群训练','休息','上身推类动作','下肢蹲类动作','休息','上肢拉类动作','休息'],'初级':['胸+三头','背+二头','腿+肩','休息','胸+三头','背+二头','休息']},
'强化体能':{'零基础':['慢跑+基础拉伸','全身循环','休息','间歇训练','力量+体能','长距离慢跑','休息'],'初级':['有氧强化','力量训练','HIIT间歇','休息','全身挑战','耐力跑','休息']},
'保持健康':{'零基础':['散步+拉伸','全身基础操','休息','快走有氧','核心稳定','瑜伽拉伸','休息'],'初级':['全身评估训练','有氧+力量','休息','核心+平衡','中等强度训练','舒缓拉伸','休息']}};
document.getElementById('genBtn').addEventListener('click',()=>{
const goal=document.getElementById('goal').value;const level=document.getElementById('level').value;const days=parseInt(document.getElementById('days').value);const time=document.getElementById('time').value;const cond=document.getElementById('cond').value.trim();
const arr=plans[goal][level]||plans[goal]['零基础'];
const pick=[];let i=0;while(pick.length<days){pick.push((dayNames[i]+'：'+arr[i%7]));i++;}
let condLine=cond?('· 训练条件：'+cond+'\n'):'';
let out='【'+goal+' · '+level+'\u3000每周'+days+'练】\n\n';
pick.forEach((d)=>out+='· '+d+'（'+time+'分钟）\n');
out+='\n📌 建议：\n· 训练前充分热身5-10分钟，练后拉伸\n';
out+='· '+condLine;
out+='· 循序渐进，优先保证动作标准，再追求重量/时长\n· 合理饮食+充足睡眠，效果才会更好\n\n';
out+='⚠️ 注：如有伤病请咨询专业教练，量力而行。';
document.getElementById('resultArea').classList.add('active');
document.getElementById('out').textContent=out;
});
</script>
</body>
</html>
