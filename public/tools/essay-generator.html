<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 作文生成器 | AgentGongju.com</title>
<meta name="description" content="AI中小学生作文生成，命题作文/周记/读后感一键生成大纲与范文">
<meta name="keywords" content="作文生成,AI作文,命题作文,周记,读后感">
<link rel="stylesheet" href="../css/style.css">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
input:focus,select:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.9;white-space:pre-wrap;min-height:60px;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
.tip{font-size:.78rem;color:#f59e0b;margin-top:8px}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>✍️ AI 作文生成</h1><p>命题作文 / 周记 / 读后感，大纲到范文一步到位</p></div>

<div class="card"><label>📚 作文类型</label>
<select id="type"><option value="记叙文">记叙文</option><option value="议论文">议论文</option><option value="周记">周记</option><option value="读后感">读后感</option><option value="写景作文">写景作文</option></select>
<label>✏️ 作文题目 / 主题</label>
<input type="text" id="topic" placeholder="例如：一件难忘的事 / 我的老师 / 读后感《草房子》">
<div class="param-row" style="margin-top:12px"><div><label>年级水平</label><select id="grade"><option value="小学">小学</option><option value="初中">初中</option><option value="高中">高中</option></select></div><div><label>字数限制</label><select id="len"><option value="400">约400字</option><option value="600">约600字</option><option value="800">约800字</option></select></div></div>
<button class="btn-gen" id="genBtn">📝 生成作文</button>
<div class="tip">💡 仅作写作思路参考，建议在此基础上融入自己的真实经历与情感。</div></div>
<div class="result-area" id="resultArea"><div class="card"><div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 作文已生成</div><div class="result-box" id="out"></div><button class="copy-btn" onclick="copyResult()">📋 复制全文</button></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyResult(){navigator.clipboard.writeText(document.getElementById('out').textContent).then(()=>alert('✅ 已复制！'))}
const openings={记叙文:['那天发生的事，至今仍像电影一样在我的脑海里回放。','生活中总有些瞬间，平凡却闪耀，让我久久无法忘怀。'],议论文:['常言道：一千个人眼中有一千个哈姆雷特。关于这个议题，我有自己的思考。','任何事物都有两面性，关键在于我们如何看待与取舍。'],周记:['时间过得真快，转眼一周又过去了。回望这周的点点滴滴，收获颇多。'],读后感:['读完这本书，合上书页的那一刻，我的内心久久不能平静。'],写景作文:['清晨的第一缕阳光斜斜地洒下来，整座城市仿佛刚刚苏醒。']};
function buildEssay(type,topic,grade,len){
const o=openings[type][Math.floor(Math.random()*openings[type].length)];
const paras={
记叙文:['那是一个寻常的日子，但于我却有着不寻常的意义。我清楚地记得当时的每一个细节，空气里弥漫的味道，耳边传来的声响，一切都那么真实。','起初我并不明白这件事会带给我什么，直到后来，当我再次回望，才渐渐领悟了其中的深意。原来，所谓成长，就是在一次次亲历中学会坚持与珍惜。','如今，这件事早已成为我心中一段温暖而珍贵的记忆。它教会了我，也激励着我，在往后的日子里带着这份力量继续前行。'],
议论文:['首先，任何事物都有其两面性，盲目地肯定或否定都是不客观的。其次，我们在追求目标的同时，也要守住内心的原则与底线。','诚然，事情的发展有着复杂的一面，不能简单一概而论。但我们更应看到，只要我们秉持理性与包容，就一定能找到解决问题的最佳路径。','综上所述，面对这一问题，我们既要保持清醒的头脑，也要怀揣乐观的心态，唯有如此，方能行稳致远。'],
周记:['这一周，我经历了紧张与忙碌，也在忙碌中收获了成长。课堂上我学到了新知识，课后也有许多难忘的趣事。','当然，这一周也有过波折。遇到困难时，我一度有些沮丧，在同学的鼓励和老师的指导下，我逐渐找到了方法，最终顺利解决。','展望下周，我希望自己能更加自律、更加专注，把每件小事都认真做好，让每一天都过得充实而有意义。'],
读后感:['这部作品最打动我的，是其中朴实而真挚的情感。作者用细腻的笔触，描绘出一个个鲜活的人物与动人的故事。','读完全书，我不禁反思自己的生活。书中主人公的坚韧与善良，像一面镜子，照见了我身上的不足，也给了我极大的鼓舞。','我想，这就是读书的意义——它让我们在别人的故事里，读到自己的人生。这本书我会推荐给每一个热爱阅读的人。'],
写景作文:['放眼望去，远处是连绵起伏的山峦，近处是波光粼粼的水面。微风拂过，带来花草的清香，令人心旷神怡。','这里的一草一木，一砖一瓦，都透着岁月的静好。几只飞鸟掠过天空，留下清脆的鸣叫，更添了几分生气。','置身其间，我仿佛忘却了所有烦恼，只想把这份美好永远留在心底。自然之美，当真无可替代。']};
const parasX=paras[type];
const gnote=grade==='小学'?'结尾时，我抬头看向远方，心中充满了对未来的期待。':grade==='初中'?'在这件事中，我明白了许多道理，也坚定了自己前行的方向。':'透过表象审视本质，我们终将收获属于自己的答案。';
const title='《'+topic+'》';
return '标题：'+title+'\n\n'+o+'\n\n'+parasX[0]+'\n\n'+parasX[1]+'\n\n'+parasX[2]+'\n\n'+gnote+'\n\n（全文约'+len+'字，供写作参考）';
}
document.getElementById('genBtn').addEventListener('click',()=>{
const type=document.getElementById('type').value;const topic=document.getElementById('topic').value.trim();
if(!topic){alert('请输入作文题目');return}
const grade=document.getElementById('grade').value;const len=document.getElementById('len').value;
document.getElementById('resultArea').classList.add('active');
document.getElementById('out').textContent=buildEssay(type,topic,grade,len);
});
</script>
</body>
</html>
