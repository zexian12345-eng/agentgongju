<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 考前冲刺计划 | AgentGongju.com</title>
<meta name="description" content="输入考试科目、剩余天数与每天学习时长，AI生成科学的考前冲刺时间表，含每日任务、复习轮次与心态调整建议">
<meta name="keywords" content="考试,复习,冲刺,计划,备考,学习">
<link rel="stylesheet" href="../css/style.css">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.phase{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:18px;margin-bottom:14px}
.phase h4{color:#a5b4fc;margin-bottom:10px;font-size:1rem}
.phase .row{font-size:.9rem;color:#cbd5e1;line-height:1.9;margin-bottom:6px}
.phase b{color:#e2e8f0}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.plan-daily{margin-top:6px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>⏰ AI 考前冲刺计划</h1><p>科学排期，不留死角，从容应考</p></div>

<div class="card">
<label>📚 考试科目（可多写，用逗号分隔）</label>
<input type="text" id="subject" placeholder="例如：数学、英语、专业课">
<div class="param-row">
<div><label>📅 距离考试（天）</label><input type="number" id="days" min="1" max="90" value="14"></div>
<div><label>🕐 每天可学习（小时）</label><input type="number" id="hours" min="1" max="16" value="6"></div>
</div>
<div><label>🎯 当前复习阶段</label>
<select id="stage">
<option value="预习">🚀 刚开始/基础薄弱</option>
<option value="过一轮">📖 正在过第一遍</option>
<option value="巩固">✍️ 已过一轮，在巩固</option>
<option value="冲刺">💪 临近考试冲刺</option>
</select></div>
<button class="btn-gen" id="genBtn">🚀 生成冲刺计划</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:16px">✅ 你的冲刺计划</div>
<div id="planBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制计划</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function splitH(h){
const study=Math.floor(h*0.7);
const rest=h-study;
return {study,rest};
}
document.getElementById('genBtn').addEventListener('click',()=>{
const subRaw=document.getElementById('subject').value.trim();
const subjects=(subRaw||'全部科目').split(/[，,、\s]+/).filter(x=>x).slice(0,5);
const days=Math.max(1,parseInt(document.getElementById('days').value)||14);
const hours=Math.max(1,parseInt(document.getElementById('hours').value)||6);
const stage=document.getElementById('stage').value;
const {study,rest}=splitH(hours);
const box=document.getElementById('planBox');box.innerHTML='';

const p1=document.createElement('div');p1.className='phase';
const split2=Math.floor(days/3),split3=Math.floor(days*2/3);
p1.innerHTML=`<h4>🟣 第一阶段（第 1~${split2} 天）打基础 · 全面过一遍</h4>
<div class="row">· 目标：把 ${subjects.join('、')} 的知识点<b>地毯式过一遍</b>，标注薄弱点。</div>
<div class="row">· 每天安排 ${study} 小时学习：${subjects.map(s=>randTasks(s)).join('；')}</div>
<div class="row">· 抽出 ${Math.floor(rest/2)} 小时整理笔记与错题本。</div>
<div class="row">💡 建议：优先攻克<b>高频考点</b>，难题先标记，回头再补。</div>`;
box.appendChild(p1);

const p2=document.createElement('div');p2.className='phase';
p2.innerHTML=`<h4>🔵 第二阶段（第 ${split2+1}~${split3} 天）刷题 · 查漏补缺</h4>
<div class="row">· 每天安排 ${subjects.length>=3?splitSubjects(subjects,study):study}</div>
<div class="row">· 以<b>真题/模拟卷</b>为主，限时训练，训练手感与时间分配。</div>
<div class="row">· 每天复盘错题，归纳常错题型，重复巩固薄弱项。</div>
<div class="row">💡 冲刺提分关键：<b>改错比做新题更重要</b>。</div>`;
box.appendChild(p2);

const p3=document.createElement('div');p3.className='phase';
p3.innerHTML=`<h4>🔴 第三阶段（第 ${split3+1}~${days} 天）冲刺 · 保持状态</h4>
<div class="row">· 回归课本+框架图，快速过核心知识点，建立知识网络。</div>
<div class="row">· 适当做1~2套<b>全真模拟</b>，调整答题节奏与心态。</div>
<div class="row">· 每晚入睡前快速回顾当天内容，<b>保证7~8小时睡眠</b>。</div>
<div class="row">💡 心态贴士：稳住节奏就是赢，别再被新难题打乱阵脚。</div>`;
box.appendChild(p3);

const p4=document.createElement('div');p4.className='phase';
p4.innerHTML=`<h4>🎉 每日作息模板（可参考）</h4>
<div class="plan-daily" id="dailyBox"></div>`;
box.appendChild(p4);
const dbox=document.getElementById('dailyBox');
const blocks=[
['08:00-08:30','起床+早餐，大脑开机'],
['08:30-10:30','主科核心学习（2h）'],
['10:30-10:50','休息，走动放松'],
['10:50-12:30','刷题或难点攻克'],
['14:00-16:00','第二科目学习'],
['16:00-17:00','做练习/真题'],
['19:30-21:30','复盘错题+整理笔记'],
['21:30-22:00','快速回顾，洗漱'],
['22:00-23:00','放松，20分钟冥想，按时入睡']];
dbox.innerHTML=blocks.map(([t,v])=>`<div class="row">· <b>${t}</b>　${v}</div>`).join('');
document.getElementById('resultArea').classList.add('active');
});
function randTasks(s){const t=['背'+s+'核心概念','梳理'+s+'框架','做'+s+'基础题'];return t[Math.floor(Math.random()*t.length)]}
function splitSubjects(subjects,h){return subMap(subjects.slice(0,4),h)}
function subMap(ss,h){const per=Math.floor(h/ss.length);return `${ss.join('、')}各分到约 ${per} 小时刷题`}
function copyResult(){navigator.clipboard.writeText('【AI 考前冲刺计划】\n'+document.getElementById('planBox').innerText.replace(/\n{3,}/g,'\n')).then(()=>alert('✅ 已复制！'))}
</script>
</body>
</html>
