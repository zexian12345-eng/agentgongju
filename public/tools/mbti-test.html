<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI 性格测试 | AgentGongju.com</title>
<meta name="description" content="专业版MBTI 16型人格测试，28道题免费测出你的性格类型与职业天赋">
<meta name="keywords" content="MBTI,性格测试,16型人格,心理测试,职场">
<link rel="stylesheet" href="../css/style.css">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=range]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.q-item{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:18px;margin-bottom:14px}
.q-text{color:#e2e8f0;font-weight:500;margin-bottom:12px;line-height:1.6}
.q-opt{display:flex;gap:10px;flex-wrap:wrap}
.opt{padding:9px 18px;border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:#cbd5e1;font-size:.88rem;cursor:pointer;transition:all .2s;background:transparent}
.opt:hover{border-color:#6366f1;background:rgba(99,102,241,0.1)}
.opt.sel{background:linear-gradient(135deg,#6366f1,#a855f7);border-color:transparent;color:white;font-weight:600}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s;margin-top:10px}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.btn-gen:disabled{opacity:.5;cursor:not-allowed}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.res-type{font-size:2.6rem;font-weight:800;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:6px}
.res-name{text-align:center;color:#a5b4fc;font-size:1.2rem;margin-bottom:16px}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.9;white-space:pre-wrap;min-height:60px;margin-bottom:12px}
.bar{height:8px;background:rgba(255,255,255,0.08);border-radius:6px;overflow:hidden;margin:6px 0 14px}
.bar .fill{height:100%;background:linear-gradient(90deg,#6366f1,#a855f7);border-radius:6px}
.dim-row{display:grid;grid-template-columns:60px 1fr 60px;align-items:center;gap:10px;font-size:.8rem;color:#94a3b8;margin-bottom:4px}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🧬 MBTI 性格测试</h1><p>28道题轻松测出你的 16 型人格与职业天赋</p></div>
<div class="card" id="quizCard">
<label style="color:#94a3b8;font-size:.85rem">每题选择更符合你的一个选项，凭第一感觉作答</label>
<div id="questions"></div>
<button class="btn-gen" id="genBtn">📊 查看我的性格类型</button>
</div>
<div class="result-area" id="resultArea"><div class="card" id="resultCard"></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const questions=[
['在一个陌生的聚会上，你通常：','主动认识新朋友','待在熟悉的人身边'],
['你更看重：','事实与逻辑','感受与价值'],
['做决定时，你倾向于：','快速果断、按计划来','保持灵活、保留余地'],
['周末独处的时候，你更喜欢：','计划好做几件具体的事','随心而动、想到什么做什么'],
['面对新项目，你通常：','先想清楚再行动','边做边调整'],
['小组讨论时，你：','喜欢先结构化讨论','喜欢自由发散头脑风暴'],
['写报告时，你更关注：','数据是否精确','读起来是否有感染力'],
['旅行时，你：','提前做好详细攻略','走到哪算哪、随性探索'],
['评价一个人，你更看中：','能力与成果','品德与情感'],
['遇到分歧时，你：','据理力争讲道理','照顾对方情绪、求同存异'],
['你的办公桌通常是：','整洁有序、分类清晰','东西多但自己找得到'],
['做长期规划时，你：','严格执行时间表','预留大量弹性时间'],
['向朋友求助前，你：','自己先研究一番','直接开口找帮手'],
['开会时，你更喜欢：','清晰明确的结论','开放多元的探讨'],
['心情不好时，你：','自己消化、安静待着','找人倾诉、需要陪伴'],
['做选择时，你的依据更多是：','理性利弊分析','内心直觉感受'],
['交朋友对你意味着：','贵精不贵多','朋友多多益善'],
['工作时，你偏好：','按既定流程执行','自由发挥、尝试新路径'],
['你更享受：','专注于完成一件事','同时经营多件事'],
['面对批评，你更在意：','说的有没有道理','是不是伤害了感情'],
['你判断一个人，更凭：','长期观察的表现','第一眼的直觉'],
['截止日期临近，你：','早早做完很安心','最后关头冲刺'],
['你的表达方式：','直接明了、直奔主题','委婉含蓄、铺垫较多'],
['你更愿意相信：','看得见的证据','内心的感受'],
['忙碌一天后，你：','需要独处充电','聚会聊天回血'],
['准备发言稿时：','先列提纲再补内容','想到哪写哪最后整理'],
['你选择工作更看重：','薪资与前景','氛围与意义'],
['面对变化，你：','感到不安、喜欢确定性','开心、觉得刺激']];
const types={};
document.addEventListener('DOMContentLoaded',init);
function init(){
const qBox=document.getElementById('questions');
questions.forEach((q,i)=>{
const div=document.createElement('div');div.className='q-item';
div.innerHTML=`<div class="q-text">${i+1}. ${q[0]}</div><div class="q-opt" data-i="${i}"><button class="opt" data-v="A">${q[1]}</button><button class="opt" data-v="B">${q[2]}</button></div>`;
qBox.appendChild(div);
});
qBox.addEventListener('click',e=>{
const btn=e.target.closest('.opt');if(!btn)return;
const group=btn.closest('.q-opt');const i=parseInt(group.dataset.i);
group.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));btn.classList.add('sel');
});
}
document.getElementById('genBtn').addEventListener('click',()=>{
let scored=true;
questions.forEach((q,i)=>{
const group=document.querySelector(`.q-opt[data-i="${i}"]`);
if(!group.querySelector('.opt.sel'))scored=false;
});
if(!scored){alert('还有题目没作答，请完成全部题目哦');return}
let E=0,I=0,S=0,N=0,T=0,F=0,J=0,P=0;
questions.forEach((q,i)=>{
const sel=document.querySelector(`.q-opt[data-i="${i}"] .opt.sel`).dataset.v;
let type=q[3]||dimOf(i);
if(sel==='A'){if(type==='EI')E++;if(type==='SN')S++;if(type==='TF')T++;if(type==='JP')J++;}
else{if(type==='EI')I++;if(type==='SN')N++;if(type==='TF')F++;if(type==='JP')P++;}
});
const d1=E>I?'E':'I',d2=N>S?'N':'S',d3=F>T?'F':'T',d4=J>P?'J':'P';
const mbti=d1+d2+d3+d4;
const names={'INTJ':'建筑师型','INTP':'逻辑学家型','ENTJ':'指挥官型','ENTP':'辩论家型','INFJ':'提倡者型','INFP':'调停者型','ENFJ':'主人公型','ENFP':'竞选者型','ISTJ':'物流师型','ISFJ':'守卫者型','ESTJ':'总经理型','ESFJ':'执政官型','ISTP':'鉴赏家型','ISFP':'探险家型','ESTP':'企业家型','ESFP':'表演者型'};
const jobs={'INTJ':'战略顾问、科学家、系统架构师','INTP':'研究员、程序员、分析师','ENTJ':'企业高管、创业者','ENTP':'创业者、产品经理、律师','INFJ':'心理咨询师、作家、导师','INFP':'作家、设计师、社工','ENFJ':'教育、人力资源、主持','ENFP':'创意策划、主持人','ISTJ':'会计师、审计、行政','ISFJ':'护理、教师、客服','ESTJ':'管理者、项目经理','ESFJ':'公关、客服、教师','ISTP':'工程师、技师、外科医生','ISFP':'艺术家、厨师、设计','ESTP':'销售、运动员、市场','ESFP':'演员、活动策划'};
const traits={'INTJ':'独立理性，天生的战略家，喜欢系统化思考。','INTP':'爱钻研的逻辑学家，对抽象概念着迷。','ENTJ':'天生的领导者，目标明确，执行力超强。','ENTP':'思维敏捷的辩论家，热衷挑战新观点。','INFJ':'安静的理想主义者，洞察人心极强。','INFP':'富有诗意的调停者，追求内心真实。','ENFJ':'魅力十足的领袖，善于激励他人。','ENFP':'热情洋溢的倡导者，创意源源不断。','ISTJ':'严谨负责的守护者，重视规则与承诺。','ISFJ':'温柔可靠的守卫者，细心贴心的照顾者。','ESTJ':'务实高效的管理者，天生的组织者。','ESFJ':'热心肠的执政官，重视和谐与人情。','ISTP':'冷静的鉴赏家，动手能力极强。','ISFP':'随和灵动的探险家，艺术细胞发达。','ESTP':'大胆的企业家，行动派中的行动派。','ESFP':'热情四射的表演者，人群中的焦点。'};
// percentages
const p1=toInt(E,I),p2=toInt(N,S),p3=toInt(F,T),p4=toInt(J,P);
const box=document.getElementById('resultCard');
box.innerHTML=`
<div class="res-type">${mbti}</div>
<div class="res-name">${names[mbti]}</div>
<div class="card" style="padding:16px">
<div class="dim-row"><span>I ${p1}%</span><div class="bar"><div class="fill" style="width:${p1}%"></div></div><span style="text-align:right">${100-p1}% E</span></div>
<div class="dim-row"><span>S ${p2}%</span><div class="bar"><div class="fill" style="width:${p2}%"></div></div><span style="text-align:right">${100-p2}% N</span></div>
<div class="dim-row"><span>T ${p3}%</span><div class="bar"><div class="fill" style="width:${p3}%"></div></div><span style="text-align:right">${100-p3}% F</span></div>
<div class="dim-row"><span>J ${p4}%</span><div class="bar"><div class="fill" style="width:${p4}%"></div></div><span style="text-align:right">${100-p4}% P</span></div>
</div>
<div class="result-box">🧠 <b>性格解读：</b>${traits[mbti]}
💼 <b>适合职业：</b>${jobs[mbti]}
🤝 <b>相处建议：</b>做决定时多倾听他人感受，重要决策给自己留一点缓冲时间。
━━━━━━
⚠️ MBTI 结果仅供参考，不作为专业心理评估依据。</div>`;
document.getElementById('resultArea').classList.add('active');
document.getElementById('resultArea').scrollIntoView({behavior:'smooth'});
});
function dimOf(i){const seq=['EI','SN','TF','JP'];return seq[i%4];}
function toInt(a,b){return Math.round(a/(a+b)*100)}
</script>
</body>
</html>
