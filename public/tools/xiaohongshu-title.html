<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小红书爆款标题生成 | AgentGongju.com</title>
<meta name="description" content="小红书爆款标题生成器，一键生成吸睛的种草标题，提升笔记点击率">
<meta name="keywords" content="小红书,标题生成,爆款,种草文案,笔记标题">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px;color-scheme:dark}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.title-item{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:14px 16px;margin-bottom:10px;color:#e2e8f0;display:flex;align-items:center;gap:12px;justify-content:space-between}
.title-item .txt{flex:1;line-height:1.6}
.title-item .tar{color:#fbbf24;font-size:.8rem;white-space:nowrap}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem;margin-left:10px}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>📕 小红书爆款标题生成</h1><p>输入笔记主题，一键批量化生成吸睛爆款标题，提高笔记点击率</p></div>
<div class="card"><label>📝 笔记主题</label>
<input type="text" id="topic" placeholder="例如：平价好用的护肤品推荐 / 一人食晚餐食谱">
<div class="param-row">
<div><label>笔记类型</label><select id="type"><option value="好物分享">好物分享</option><option value="经验教程">经验教程</option><option value="美食探店">美食探店</option><option value="穿搭美妆">穿搭美妆</option><option value="旅行攻略">旅行攻略</option><option value="生活记录">生活记录</option></select></div>
<div><label>目标人群</label><select id="aud"><option value="学生党">学生党</option><option value="上班族">上班族</option><option value="宝妈">宝妈</option><option value="精致女孩">精致女孩</option><option value="健身人群">健身人群</option></select></div>
</div>
<button class="btn-gen" id="genBtn">✨ 生成标题</button></div>
<div class="result-area" id="resultArea"><div class="card"><div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 10个爆款标题已生成，任你挑选！</div>
<div id="titles"></div>
<button class="copy-btn" onclick="copyAll()">📋 复制全部标题</button></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyAll(){const t=document.getElementById('titles').textContent;navigator.clipboard.writeText(t).then(()=>alert('✅ 已复制全部标题'))}
function copyT(btn){const txt=btn.parentElement.querySelector('.txt').textContent;navigator.clipboard.writeText(txt).then(()=>alert('✅ 已复制该标题'))}
const PREFIX=['绝了！','救命！','谁懂啊','太顶了','真的会谢','直接封神','后悔没早点知道','实测有效！','亲测！','挖到宝了！','别再乱买了！','有手就会！','闭眼冲！','绝绝子！'];
const SUFFIX=['谁用谁知道','一篇讲清楚','建议收藏','亲测不踩雷','天花板级别的','全网都在推','无限回购','真的上瘾','也太好用了吧','我不允许有人还不知道','求求你们一定要试试','早买早享受'];
const EMJ=['✨','🔥','💖','😭','🤯','🌟','👍','❤️'];
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('小红书爆款标题生成 | AgentGongju.com'))return;
const topic=document.getElementById('topic').value.trim();
if(!topic){alert('请输入笔记主题');return}
const type=document.getElementById('type').value;
const aud=document.getElementById('aud').value;
let html='';
const used=new Set();
for(let i=0;i<10;i++){
let t='';
const p=PREFIX[Math.floor(Math.random()*PREFIX.length)];
const s=SUFFIX[Math.floor(Math.random()*SUFFIX.length)];
const e=EMJ[Math.floor(Math.random()*EMJ.length)];
const n=(i%4)+'月'+((i*7)%27+1)+'日';
const templates=[
p+topic+s+e,
aud+'必看！'+topic+'全攻略'+e,
'别再错过啦，'+topic+'就看这篇'+e,
'收藏！'+topic+'（'+n+'更新）'+e,
'一篇看懂'+topic+'｜'+aud+'亲身总结'+e,
'我发现！'+topic+'还可以这样'+e,
'亲测'+topic+'，'+(['不后悔','无限回购','太太太香了'][i%3])+e,
'今天必须安利！'+topic+e,
topic+'天花板！'+s+e,
'姐妹们！'+topic+'真的要试试'+e];
t=templates[Math.floor(Math.random()*templates.length)];
if(!used.has(t)){used.add(t);}
const tag=Math.floor(Math.random()*4)+1;
html+='<div class="title-item"><span class="txt">'+(i+1)+'. '+t+'</span><span class="tar">🔥'+(90+Math.floor(Math.random()*10))+'%</span><button class="copy-btn" onclick="copyT(this)">复制</button></div>';
}
document.getElementById('titles').innerHTML=html;
document.getElementById('resultArea').classList.add('active');
});
</script>
</body>
</html>
