<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 起名神器 | AgentGongju.com</title>
<meta name="description" content="AI宝宝起名神器，根据姓氏和期望自动生成寓意美好的名字，附打分与解析">
<meta name="keywords" content="宝宝起名,名字生成,AI起名,测名,男宝宝名字,女宝宝名字">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
input:focus,select:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.name-card{display:flex;align-items:center;justify-content:space-between;padding:14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:10px;margin-bottom:12px}
.name-card .nm{font-size:1.3rem;color:#a5b4fc;font-weight:700}
.name-card .sc{background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700}
.name-card .mn{color:#94a3b8;font-size:.8rem;margin-top:4px}
.name-card .cp{cursor:pointer;color:#22c55e;font-size:.8rem}
.name-card .cp:hover{text-decoration:underline}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>👶 AI 宝宝起名</h1><p>按姓氏与期望寓意，生成高分好名字并附解析</p></div>

<div class="card"><label>🧑‍🤝‍🧑 宝宝姓氏</label>
<input type="text" id="surname" placeholder="例如：李">
<div class="param-row" style="margin-top:12px"><div><label>性别</label><select id="gender"><option value="男">男宝宝</option><option value="女">女宝宝</option><option value="中性">通用</option></select></div><div><label>期望寓意</label><select id="meaning"><option value="文雅">文雅书香</option><option value="大气">大气有为</option><option value="健康">健康平安</option><option value="聪明">聪慧机敏</option><option value="富贵">富贵吉祥</option></select></div></div>
<label style="margin-top:12px">长辈忌讳（可选，如：避免与长辈重字）</label>
<input type="text" id="avoid" placeholder="例如：避免"明"字">
<button class="btn-gen" id="genBtn">✨ 生成名字</button></div>
<div class="result-area" id="resultArea"><div class="card"><div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 推荐名字（点击复制）</div><div id="listOut"></div></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyText(t){navigator.clipboard.writeText(t).then(()=>alert('✅ 已复制：'+t))}
const boy={文雅:['文轩','子墨','亦凡'],大气:['浩然','铭泽','世勋'],健康:['安康','泰然','健宁'],聪明:['睿哲','明轩','思齐'],富贵:['嘉瑞','泽辰','天佑']};
const girl={文雅:['诗涵','雅静','书瑶'],大气:['沐宸','舒宁','若曦'],健康:['安然','欣怡','静好'],聪明:['慧颖','灵犀','珂昕'],富贵:['亦辰','瑾瑜','梓萱']};
const base={文雅:'文质彬彬，气韵儒雅',大气:'气度不凡，胸怀宽广',健康:'健健康康，平安顺遂',聪明:'聪慧过人，思维敏捷',富贵:'前程锦绣，富贵有余'};
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 起名神器 | AgentGongju.com'))return;
const sur=document.getElementById('surname').value.trim();if(!sur){alert('请输入姓氏');return}
const gen=document.getElementById('gender').value;const mean=document.getElementById('meaning').value;
const avoid=document.getElementById('avoid').value.trim();
const pool=gen==='女'?girl:boy;const names=pool[mean].slice();
for(let i=names.length;i<6;i++){names.push(names[i%names.length]);}
const defs={文雅:'品性文雅，心志高远',大气:'器宇轩昂，前程远大',健康:'身心康健，一生平安',聪明:'聪颖灵动，才思泉涌',富贵:'财源广进，富贵绵长'};
let used=new Set();let html='';
names.forEach((n,i)=>{
  const full=sur+n;
  if(avoid&&full.includes(avoid.replace('避免','').trim()))return;
  if(used.has(full))return;used.add(full);
  const score=82+Math.floor(Math.random()*18);
  const g=gen==='女'?'女':gen==='男'?'男':'通用';
  html+='<div class="name-card"><div><div class="nm">'+full+'<span class="sc">  '+score+'分</span></div><div class="mn">寓意：'+base[mean].split('，')[0]+'，意义取自「'+defs[mean].split('，')[1]+'」，'+g+'。</div></div><span class="cp" onclick="copyText(\''+full+'\')">复制</span></div>';
});
document.getElementById('resultArea').classList.add('active');
document.getElementById('listOut').innerHTML=html||'<div style="color:#fbbf24">未生成，请调整姓氏或忌字后重试。</div>';
});
</script>
</body>
</html>
