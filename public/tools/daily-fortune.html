<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日运势每日签 | AgentGongju.com</title>
<meta name="description" content="每日一句幸运签文 + 黄历宜忌，开启元气满满的一天">
<meta name="keywords" content="运势,今日运势,黄历,每日签,宜忌,好运,抽签">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:680px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px;text-align:center}
.qian{font-size:1.4rem;font-weight:700;color:#f1e9ff;line-height:1.9;margin:20px 0;font-family:"KaiTi","STKaiti",serif}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{margin-top:20px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;min-height:60px;margin-bottom:12px;text-align:left}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.badge{display:inline-block;padding:4px 14px;border-radius:16px;font-size:.8rem;background:rgba(99,102,241,.15);color:#a5b4fc;margin-bottom:10px}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🍀 今日运势每日签</h1><p>抽一支今日签文，看看今天该做什么、慎做什么</p></div>

<div class="card"><label>🙋 你的星座</label><select id="sign"><option>白羊座</option><option>金牛座</option><option>双子座</option><option>巨蟹座</option><option>狮子座</option><option>处女座</option><option>天秤座</option><option>天蝎座</option><option>射手座</option><option>摩羯座</option><option>水瓶座</option><option>双鱼座</option></select>
<button class="btn-gen" id="genBtn">🎋 抽今日签</button></div>

<div class="result-area" id="resultArea">
<div class="card"><span class="badge" id="toneBadge"></span><div class="qian" id="qian"></div><div class="result-box" id="result"></div><button class="copy-btn" onclick="copyResult()">📋 复制</button></div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const qians=['今日宜沉淀，不必急于结果，缓一缓自见分晓','与人善言，暖于布帛，多一句体谅胜过千句道理','山有峰谷，事有起落，放平心态自会柳暗花明','种一棵树最好的时间是十年前，其次就是今天','欲速则不达，稳中求进方为上策','得之淡然，失之坦然，顺其自然','心有猛虎，细嗅蔷薇，张弛有度','贵人运在酝酿，保持真诚与开放','今天的你已经足够努力，剩下的交给时间','小确幸藏在细节里，慢下来才能发现','敢想敢做，逢山开路，好运偏爱行动派','凡所有相，皆是虚妄，见心明性即是安然'];
const yiji=['宜：安心 / 沟通 / 复盘','宜：学习 / 阅读 / 运动','宜：出行 / 洽谈 / 展示','宜：规划 / 整理 / 早睡','宜：储蓄 / 节俭 / 专注'];
const buji=['忌：冲动消费 / 口舌是非','忌：熬夜 / 急躁冒进','忌：轻信传言 / 谈崩大事','忌：久坐不动 / 情绪上头'];
const stars=['★★★☆☆','★★★★☆','★★★★★','★★★☆☆','★★★★☆'];
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('今日运势每日签 | AgentGongju.com'))return;
let sign=document.getElementById('sign').value;
let now=new Date();let dateStr=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
let seed=(sign+dateStr).split('').reduce((a,c)=>a+c.charCodeAt(0),0);
let qiansToday=qians[seed%qians.length];
let y=yiji[seed%yiji.length],b=buji[(seed+1)%buji.length],st=stars[seed%stars.length];
let tone=st.startsWith('★')&&parseInt(st[0])>=4?'今日运势 · 上上签':'今日运势 · 中签';
document.getElementById('toneBadge').textContent=tone+'  '+sign;
document.getElementById('qian').textContent='「 '+qiansToday+' 」';
document.getElementById('result').textContent='【幸运指数】'+st+'\n'+y+'\n'+b+'\n\n真诚提醒：运势仅供参考，真正的运气藏在你的心态与行动里。祝'+sign+'的你今天顺心如意～';
document.getElementById('resultArea').style.display='block';document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('qian').textContent+'\n'+document.getElementById('result').textContent).then(()=>alert('✅ 已复制！'))}
</script>
</body>
</html>
