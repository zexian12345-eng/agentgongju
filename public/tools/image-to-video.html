<div class="tool-container">
  <div class="tool-header">
    <h1>🖼️→🎬 免费图转视频</h1>
    <p>上传一张图片，AI 自动生成流畅动画视频。免费、快速、无需安装</p>
  </div>

  <div class="tool-grid">
    <div>
      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">📤</div>
        <div class="upload-text">点击 <span>上传图片</span> 或拖拽到此区域</div>
        <div class="upload-hint">支持 JPG / PNG，建议 1080px 以上</div>
        <input type="file" id="fileInput" accept="image/jpeg,image/png" style="display:none">
        <img id="previewImg" class="preview-img" style="display:none">
      </div>
    </div>

    <div class="settings-panel">
      <div class="setting-group">
        <label class="setting-label">运镜效果</label>
        <div class="option-grid" id="motionOptions">
          <button class="option-btn active" data-value="slow_zoom">🐢 缓慢缩放</button>
          <button class="option-btn" data-value="pan">↔️ 平移</button>
          <button class="option-btn" data-value="float">🪶 浮动</button>
          <button class="option-btn" data-value="rotate">🔄 旋转</button>
        </div>
      </div>
      <div class="setting-group">
        <label class="setting-label">视频比例</label>
        <select class="setting-select" id="aspectRatio">
          <option value="16:9">16:9 横屏（YouTube）</option>
          <option value="9:16">9:16 竖屏（抖音/TikTok）</option>
          <option value="1:1">1:1 方形（Instagram）</option>

      </div>
      <div class="setting-group">
        <label class="setting-label">时长 <span class="hint">(秒)</span></label>

          <option value="3">3 秒</option>
          <option value="5" selected>5 秒</option>

<script>
const uploadArea = document.getElementById('uploadArea');
const fileInput = document.getElementById('fileInput');
const previewImg = document.getElementById('previewImg');
const generateBtn = document.getElementById('generateBtn');
const progressArea = document.getElementById('progressArea');
const progressBar = document.getElementById('progressBar');
const progressTitle = document.getElementById('progressTitle');
const statusText = document.getElementById('statusText');
const resultArea = document.getElementById('resultArea');
const resultVideo = document.getElementById('resultVideo');
const downloadBtn = document.getElementById('downloadBtn');

let uploadedFile = null;
let currentMotion = 'slow_zoom';

// 运镜选择
document.querySelectorAll('.option-btn').forEach(btn => {
  btn.addEventListener('click', () => {
if(!Paywall.countUse('免费图转视频 - AI在线生成 | AgentGongju.com'))return;
    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMotion = btn.dataset.value;
  });
});

// 上传处理
uploadArea.addEventListener('click', () => fileInput.click());
uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.style.borderColor = '#6366f1'; });
uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = 'rgba(99,102,241,0.3)'; });
uploadArea.addEventListener('drop', e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', e => { if(e.target.files[0]) handleFile(e.target.files[0]); });

function handleFile(file) {
  if(!file.type.match('image.*')) { alert('请上传图片文件(JPG/PNG)'); return; }
  uploadedFile = file;
  const reader = new FileReader();
  reader.onload = e => {
    previewImg.src = e.target.result;
    previewImg.style.display = 'block';
    uploadArea.classList.add('has-image');
    document.querySelector('.upload-icon').textContent = '✅';
    document.querySelector('.upload-text').innerHTML = '已选择: <strong>' + file.name + '</strong>';
  };
  reader.readAsDataURL(file);
}

// 生成视频
generateBtn.addEventListener('click', async () => {
  if(!uploadedFile) { alert('请先上传一张图片！'); return; }

  generateBtn.disabled = true;
  generateBtn.textContent = '⏳ 生成中...';
  progressArea.classList.add('active');
  progressBar.style.width = '0%';

  // 模拟进度
  let progress = 0;
  const steps = ['正在连接 AI 引擎...', '分析图片内容...', '计算运镜轨迹...', '渲染画面帧...', '编码视频文件...', '即将完成...'];
  const interval = setInterval(() => {
    progress += Math.random() * 8;
    if(progress > 95) { progress = 95; clearInterval(interval); }
    progressBar.style.width = progress + '%';
    const idx = Math.min(Math.floor(progress / 17), steps.length - 1);
    statusText.textContent = steps[idx];
  }, 800);

  try {
    // 调用 Nemo API 后端代理
    const formData = new FormData();
    formData.append('image', uploadedFile);
    formData.append('motion', currentMotion);
    formData.append('aspect_ratio', document.getElementById('aspectRatio').value);
    formData.append('duration', document.getElementById('duration').value);

    const res = await fetch('/api/image-to-video', { method: 'POST', body: formData });
    const data = await res.json();

    clearInterval(interval);
    progressBar.style.width = '100%';
    statusText.textContent = '✅ 视频生成完成！';

    if(data.success && data.video_url) {
      setTimeout(() => {
        progressArea.classList.remove('active');
        resultArea.classList.add('active');
        resultVideo.src = data.video_url;
        downloadBtn.href = data.video_url;
      }, 500);
    } else {
      statusText.textContent = '❌ ' + (data.error || '生成失败，请重试');
      progressBar.style.width = '0%';
      setTimeout(() => progressArea.classList.remove('active'), 3000);
    }
  } catch(err) {
    clearInterval(interval);
    statusText.textContent = '❌ 网络错误: ' + err.message;
    progressBar.style.width = '0%';
  } finally {
    generateBtn.disabled = false;
    generateBtn.textContent = '🎬 生成视频';
  }
});
</script>
