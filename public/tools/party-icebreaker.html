<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 聚会破冰游戏 | AgentGongju.com</title>
<meta name="description" content="输入聚会场景与人数，AI推荐的破冰游戏、暖场话题与互动节目，让聚会氛围瞬间升温">
<meta name="keywords" content="聚会,破冰,游戏,团建,活动,派对,暖场">
<link rel="stylesheet" href="../css/style.css">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.game-card{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;margin-bottom:14px}
.game-card h4{color:#a5b4fc;margin-bottom:8px;font-size:1.05rem}
.game-card .desc{font-size:.9rem;color:#cbd5e1;line-height:1.8;white-space:pre-line}
.rule{background:rgba(255,255,255,0.02);border:1px dashed rgba(255,255,255,0.12);border-radius:8px;padding:12px;margin-top:10px;color:#e2e8f0;font-size:.88rem;line-height:1.7}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🎉 AI 聚会破冰游戏</h1><p>告别冷场，让气氛一秒热起来</p></div>

<div class="card">
<div class="param-row">
<div><label>🎪 聚会场景</label>
<select id="scene">
<option value="朋友">👫 朋友聚餐</option>
<option value="同事">💼 公司团建/年会</option>
<option value="同学">🎓 同学聚会</option>
<option value="相亲">💘 相亲/初次见面</option>
<option value="家庭">👨‍👩‍👧 家庭聚会</option>
<option value="线上">💻 线上开黑/连麦</option>
</select></div>
<div><label>👥 大概人数</label>
<select id="count">
<option value="6">6人以内</option>
<option value="15">7~15人</option>
<option value="30">16~30人</option>
<option value="50">30人以上</option>
</select></div>
</div>
<label>🎮 想要几个游戏</label>
<select id="num">
<option value="3">3个</option>
<option value="5">5个</option>
</select>
<button class="btn-gen" id="genBtn">🎊 开始推荐</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:16px">✅ 破冰游戏推荐</div>
<div id="gameBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制全部</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const games=[
{name:'两真一假',desc:'每人说三条关于自己的事，两条真一条假，大家猜哪个是假的',rule:'适合破冰：大家很快互相了解，笑点不断。轮流进行，猜对可获小奖励。',scene:['朋友','同事','同学','相亲','家庭'],need:6},
{name:'谁是卧底',desc:'一人拿不同的词（卧底），其他人拿相同关键词，通过描述找出卧底',rule:'每人轮流用一句话描述自己的词，切忌直说词面。每轮投票淘汰，卧底撑到最后即胜。',scene:['朋友','同事','同学','家庭'],need:7},
{name:'你画我猜',desc:'一人根据题目画画，其他人猜成语/名词，限时抢答',rule:'可分两队PK，画手不能说话写字，只能画图，每轮1分钟，猜对得分。',scene:['朋友','同事','同学','家庭'],need:4},
{name:'动作接龙',desc:'一人做个动作，下一个人复制动作并提出新动作，依次累加',rule:'做不出来的淘汰，考验记忆与表演力，笑料百出。',scene:['朋友','同事','同学','家庭','线上'],need:5},
{name:'真心话大冒险',desc:'转瓶子选人，被选者选真心话或大冒险',rule:'饮酒或乐群均可，注意尺度，玩得开心不尬场。',scene:['朋友','同事','同学'],need:4},
{name:'成语接龙',desc:'轮流说出以上一个成语最后一字开头的成语，接不上淘汰',rule:'可加限定（如必须带数字），接不上表演才艺或罚酒。',scene:['朋友','同学','家庭'],need:4},
{name:'1分钟自我介绍挑战',desc:'每人用1分钟介绍自己，但要加一个独特标签或趣事',rule:'要求用三个关键词和一件趣事介绍自己，让彼此更快记住。',scene:['同事','相亲','同学'],need:3},
{name:'猜价格',desc:'主持人展示一个物品，大家猜价格，最接近者获胜',rule:'适合年会/聚餐，猜中可送小礼物，互动感强。',scene:['同事','朋友'],need:6},
{name:'数字炸弹',desc:'大家轮流说1~100间的数字，猜中主持人预设的"炸弹"数字者受罚',rule:'每次报数缩小范围，逼问陷阱，刺激又好操作。',scene:['朋友','同事','同学','线上'],need:4},
{name:'你问我答接龙',desc:'提问者问一个私密/趣味问题，被问者回答后反向提问下一人',rule:'问题越有趣气氛越热，注意尺度，笑着玩一整晚。',scene:['朋友','同事','同学','相亲'],need:5},
{name:'组队抢麦K歌',desc:'分成两队，随机放歌前奏，抢麦猜歌名并唱出来',rule:'猜歌+唱歌双环节，麦霸展示时刻，气氛拉满。',scene:['同事','朋友','同学'],need:8},
{name:'emoji猜美食',desc:'主持人用表情包组合表示一道菜，大家抢答',rule:'比如🍜🐔=鸡汤面，逗趣又好猜，老少皆宜。',scene:['朋友','同事','同学','家庭','线上'],need:4},
{name:'谁是影帝',desc:'一人表演一个情绪或场景（如"被领导夸"），大家猜演的什么',rule:'考验演技，笑点密集，适合朋友与同事聚会。',scene:['朋友','同事','同学'],need:5},
{name:'小时候的糗事分享',desc:'轮流分享一件童年糗事，笑中带暖拉近距离',rule:'回忆杀环节，气氛瞬间松弛，适合家庭与小范围朋友。',scene:['朋友','相亲','家庭','同学'],need:4}];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
document.getElementById('genBtn').addEventListener('click',()=>{
const scene=document.getElementById('scene').value;
const people=parseInt(document.getElementById('count').value);
const num=parseInt(document.getElementById('num').value);
const box=document.getElementById('gameBox');box.innerHTML='';
const candidates=games.filter(g=>g.scene.includes(scene)&&g.need<=people);
const list=shuffle(candidates).slice(0,num);
if(!list.length){box.innerHTML='<div style="color:#94a3b8">暂时没有匹配的游戏，试试调大人数或换场景～</div>';}
list.forEach((g,i)=>{const card=document.createElement('div');card.className='game-card';
card.innerHTML=`<h4>🎲 游戏${i+1} · ${g.name}</h4><div class="desc">${g.desc}</div><div class="rule">🛠 玩法：${g.rule}</div>`;
box.appendChild(card);});
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText('【AI 破冰游戏推荐】\n'+document.getElementById('gameBox').innerText.replace(/\n{3,}/g,'\n')).then(()=>alert('✅ 已复制！'))}
</script>
</body>
</html>
