<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 书单推荐 | AgentGongju.com</title>
<meta name="description" content="AI书单推荐，输入你的兴趣方向、阅读目的与偏好的篇幅难度，AI为你量身推荐一份精选书单，附推荐理由和阅读顺序建议，读好书少走弯路">
<meta name="keywords" content="AI书单,书籍推荐,读书清单,好书推荐,阅读工具">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;margin-bottom:12px;font-size:.92rem}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>📚 AI 书单推荐</h1><p>按你的兴趣，推荐值得一读的好书</p></div>

<div class="card">
<label>🔍 你的阅读兴趣 / 想解决的问题</label>
<textarea id="interest" placeholder="例如：我想提升职场沟通能力，同时想了解一些心理学，也喜欢科幻小说"></textarea>
<div class="param-row">
<div><label>🎯 阅读目的</label>
<select id="purpose">
<option value="成长">🌱 个人成长</option>
<option value="专业" selected>💼 职业提升</option>
<option value="娱乐">🎈 休闲娱乐</option>
<option value="学习">🎓 系统学习</option>
</select></div>
<div><label>📐 篇幅偏好</label>
<select id="level">
<option value="入门">🎯 入门轻松</option>
<option value="中等" selected>⚖️ 适中</option>
<option value="深度">🧠 经典深度</option>
</select></div>
</div>
<div class="param-row">
<div><label>📚 推荐数量</label>
<select id="num">
<option value="3">3本</option>
<option value="5" selected>5本</option>
<option value="8">8本</option>
</select></div>
<div><label>🌐 书籍类型</label>
<select id="type">
<option value="综合" selected>综合混搭</option>
<option value="中文">🇨🇳 中文为主</option>
<option value="外文">🌍 外文译作</option>
</select></div>
</div>
<button class="btn-gen" id="genBtn">✨ 生成书单</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">📚 推荐书单</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制书单</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const pool={
'成长':[['《非暴力沟通》','马歇尔·卢森堡','学会不带伤害的沟通方式'],['《被讨厌的勇气》','岸见一郎/古贺史健','用阿德勒心理学解开人际关系烦恼'],['《原则》','瑞·达利欧','一套可复用的生活与工作原则'],['《原子习惯》','詹姆斯·克利尔','微小习惯带来巨大改变'],['《人生的智慧》','叔本华','关于幸福与欲望的清醒洞察']],
'专业':[['《金字塔原理》','芭芭拉·明托','结构化表达与思考的经典'],['《影响力》','罗伯特·西奥迪尼','洞悉说服与影响的心理机制'],['《高效能人士的七个习惯》','史蒂芬·柯维','自我管理与职业成功的地图'],['《刻意练习》','安德斯·艾利克森','如何从新手进阶为高手'],['《埃隆·马斯克传》','沃尔特·艾萨克森','读懂极致创新与第一性原理'],['《思考，快与慢》','丹尼尔·卡尼曼','了解大脑决策的两种模式']],
'娱乐':[['《三体》','刘慈欣','中国硬科幻巅峰之作'],['《活着》','余华','在苦难中读懂生命的韧性'],['《嫌疑人X的献身》','东野圭吾','悬疑推理+深情反转'],['《小王子》','圣埃克苏佩里','写给大人的治愈童话'],['《围城》','钱锺书','辛辣幽默的世态百相']],
'学习':[['《如何阅读一本书》','莫提默·艾德勒','系统提升阅读能力'],['《费曼学习法》','尹红心','把知识真正学会的方法'],['《认知觉醒》','周岭','普通人可以践行的成长方法论'],['《卡片笔记写作法》','申克·阿伦斯','用笔记系统构建知识体系'],['《深度工作》','卡尔·纽波特','重新夺回专注力']]};
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 书单已复制！'))}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 书单推荐 | AgentGongju.com'))return;
const interest=document.getElementById('interest').value.trim();
const purpose=document.getElementById('purpose').value;
const num=parseInt(document.getElementById('num').value);
const type=document.getElementById('type').value;
const level=document.getElementById('level').value;
let list=[...pool[purpose]].sort(()=>Math.random()-0.5).slice(0,num);
if(list.length<num){const all=[...pool['成长'],...pool['专业'],...pool['娱乐'],...pool['学习']];const dm=new Set(list.map(x=>x[0]));for(const b of all){if(dm.has(b[0]))continue;list.push(b);if(list.length>=num)break;}}
let out=`📚 为你推荐的${num}本好书\n${interest?`兴趣方向：${interest}\n`:''}阅读目的：${purpose}　篇幅：${level}\n\n`;
list.forEach((b,i)=>{
out+=`${i+1}. 《${b[0]}》——${b[1]}\n`;
out+=`   推荐理由：${b[2]}。\n`;
});
out+=`\n📖 阅读顺序建议\n· 从最贴近你当前需求的一本读起，先建立正反馈。\n· 建议每本读完写3条行动清单，读了就用。\n`;
if(level==='深度')out+=`· 深度书目建议精读+做笔记，配合相关领域视频讲解更佳。\n`;
out+=`\n开始阅读吧，翻开第一页你就已经领先了。`;
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
</script>
</body>
</html>
