<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🍲 AI 一周菜谱与采购单</h1><p>七天菜单＋买菜清单，一次生成直接照着买</p></div>

<div class="card">
<div class="param-row">
<div><label>👨‍👩‍👧 吃饭人数</label>
<select id="people"><option value="1">1 人</option><option value="2" selected>2 人</option><option value="3">3 人</option><option value="4">4 人</option><option value="5">5 人及以上</option></select></div>
<div><label>🍳 口味偏好</label>
<select id="taste">
<option value="home" selected>家常清淡</option>
<option value="spicy">偏辣重口</option>
<option value="soup">多汤汤水水</option>
<option value="light">少油减脂</option>
<option value="meat">无肉不欢</option>
</select></div>
</div>
<div class="param-row">
<div><label>⏰ 每晚做饭时间</label>
<select id="time"><option value="15">15 分钟以内</option><option value="30" selected>30 分钟左右</option><option value="60">1 小时，愿意慢慢做</option></select></div>
<div><label>🥬 是否要带饭</label>
<select id="lunch"><option value="no" selected>只做晚餐</option><option value="yes">晚餐＋第二天带饭</option></select></div>
</div>
<label>🚫 忌口 / 不爱吃的（选填，逗号分隔）</label>
<input type="text" id="avoid" placeholder="例如：香菜、内脏、苦瓜">
<button class="btn-gen" id="genBtn">🥘 生成一周菜单</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制菜单</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
var MENUS={
home:[["番茄炒蛋","清炒时蔬","紫菜蛋花汤"],["青椒土豆丝","蒜蓉西兰花","冬瓜排骨汤"],["香菇滑鸡","上汤娃娃菜","丝瓜蛋汤"],["红烧豆腐","清炒荷兰豆","玉米胡萝卜汤"],["黄瓜炒木耳","蒸水蛋","番茄牛腩"],["土豆烧鸡","凉拌菠菜","萝卜丝汤"],["清蒸鲈鱼","蒜蓉生菜","菌菇豆腐汤"]],
spicy:[["辣子鸡丁","手撕包菜","酸辣汤"],["水煮肉片","干煸四季豆","冬瓜汤"],["麻婆豆腐","清炒藕片","番茄蛋汤"],["回锅肉","蒜蓉油麦菜","紫菜汤"],["剁椒蒸鱼","炝炒豆芽","酸萝卜汤"],["小炒黄牛肉","凉拌黄瓜","丝瓜汤"],["麻辣香锅","上汤娃娃菜","莲藕排骨汤"]],
soup:[["山药炖排骨","清炒时蔬","—"],["冬瓜丸子汤","蒜蓉西兰花","—"],["莲藕花生猪骨汤","清炒芥蓝","—"],["番茄牛腩煲","白灼生菜","—"],["鲫鱼豆腐汤","清炒芦笋","—"],["香菇鸡汤","上汤娃娃菜","—"],["萝卜羊肉汤","蒜蓉菠菜","—"]],
light:[["香煎鸡胸","西兰花拌虾仁","—"],["清蒸鱼","凉拌秋葵","—"],["豆腐虾仁羹","蒜蓉菠菜","—"],["鸡胸肉沙拉","番茄黄瓜","—"],["水煮牛肉片","清炒芦笋","—"],["蒸南瓜＋蒸蛋","凉拌木耳","—"],["烤鸡腿排","清炒芥蓝","—"]],
meat:[["可乐鸡翅","清炒时蔬","蛋花汤"],["红烧肉","蒜蓉青菜","冬瓜汤"],["黑椒牛柳","蒜香西兰花","紫菜汤"],["孜然羊肉","凉拌黄瓜","番茄汤"],["红烧排骨","上汤娃娃菜","丝瓜汤"],["烤鸡腿","清炒荷兰豆","玉米排骨汤"],["酱牛肉","干煸豆角","萝卜汤"]]
};
var SHOP={
'番茄':['番茄炒蛋','番茄牛腩','番茄蛋汤','番茄汤','番茄黄瓜'],'鸡蛋':['番茄炒蛋','蒸水蛋','蛋花汤','番茄蛋汤','紫菜蛋花汤'],
'土豆':['青椒土豆丝','土豆烧鸡'],'青椒':['青椒土豆丝'],'西兰花':['蒜蓉西兰花','西兰花拌虾仁'],
'排骨':['冬瓜排骨汤','莲藕排骨汤','红烧排骨','玉米排骨汤'],'鸡':['香菇滑鸡','土豆烧鸡','辣子鸡丁','剁椒蒸鱼'],
'豆腐':['红烧豆腐','菌菇豆腐汤','麻婆豆腐','鲫鱼豆腐汤','豆腐虾仁羹'],'菠菜':['凉拌菠菜','蒜蓉菠菜'],
'生菜':['蒜蓉生菜','白灼生菜'],'黄瓜':['黄瓜炒木耳','凉拌黄瓜','番茄黄瓜'],
'牛腩':['番茄牛腩','番茄牛腩煲'],'鲈鱼':['清蒸鲈鱼'],'木耳':['黄瓜炒木耳','凉拌木耳'],
'冬瓜':['冬瓜排骨汤','冬瓜丸子汤','冬瓜汤'],'娃娃菜':['上汤娃娃菜'],'油麦菜':['蒜蓉油麦菜'],
'鸡翅':['可乐鸡翅'],'鸡胸':['香煎鸡胸','鸡胸肉沙拉'],'虾仁':['西兰花拌虾仁','豆腐虾仁羹'],
'牛肉':['小炒黄牛肉','黑椒牛柳','水煮牛肉片'],'羊肉':['孜然羊肉','萝卜羊肉汤'],'南瓜':['蒸南瓜＋蒸蛋']
};
function gen(){
var people=+document.getElementById('people').value;
var taste=document.getElementById('taste').value;
var t=document.getElementById('time').value;
var lunch=document.getElementById('lunch').value;
var avoid=document.getElementById('avoid').value.trim();
var dishes=MENUS[taste].slice();
var week=['周一','周二','周三','周四','周五','周六','周日'];
var out='════ 一周菜单（'+people+' 人份 · '+({home:'家常清淡',spicy:'偏辣重口',soup:'多汤水',light:'少油减脂',meat:'无肉不欢'}[taste])+'）════\n';
out+='做饭时长：约 '+t+' 分钟/天　'+(lunch==='yes'?'｜晚餐＋第二天带饭':'｜仅晚餐')+'\n';
if(avoid)out+='忌口：'+avoid+'\n';
out+='每餐搭配建议：1 荤 + 1 素 + 1 汤，先做汤再炒菜，出锅顺序不慌乱。\n';

var allDishes=[];
for(var i=0;i<7;i++){
var day=dishes[i%dishes.length];
var list=day.filter(function(x){return x!=='—';});
list.forEach(function(x){allDishes.push(x);});
out+='\n【'+week[i]+'】'+list.join('　+　')+'\n';
if(lunch==='yes')out+='　→ 带饭建议：多做 1 份荤菜，单独装盒，叶菜当天吃完不隔夜。\n';
}

var items={};
allDishes.forEach(function(d){
Object.keys(SHOP).forEach(function(k){ if(SHOP[k].indexOf(d)!==-1) items[k]=1; });
});
var keys=Object.keys(items);
if(avoid){var av=avoid.split(/[,，、\s]+/);keys=keys.filter(function(k){return !av.some(function(a){return a&&k.indexOf(a)!==-1;});});}
keys.sort();
out+='\n════ 采购清单（'+keys.length+' 项）════\n';
out+='🥩 荤菜：'+keys.filter(function(k){return /肉|排|鸡|鱼|虾|牛|羊|翅/.test(k);}).join('、')+'\n';
out+='🥬 蔬菜：'+keys.filter(function(k){return !/肉|排|鸡|鱼|虾|牛|羊|翅/.test(k);}).join('、')+'\n';
out+='🧂 常备：油盐酱醋、生抽、蚝油、料酒、姜蒜葱、淀粉、白胡椒\n';

var qty=people>=4?'（按'+people+'人份加量）':'';
out+='\n════ 采购与备菜技巧 ════\n';
out+='1. 周末一次性采购，叶菜放最上面、根茎类垫底，冰箱按"先用先放前面"摆；\n';
out+='2. 到家先花 30 分钟洗切分装'+qty+'，工作日直接下锅，做饭时间能省一半；\n';
out+='3. 肉类按每餐用量分小包冷冻，前晚拿到冷藏解冻；\n';
out+='4. 汤类可以一次煮两天的量，第二天加热即可；\n';
out+='5. 每天留一天"清冰箱日"，把剩菜和边角料做成炒饭或汤面。\n';
return out;
}
</script>
<script>
document.getElementById('genBtn').addEventListener('click',function(){
if(!Paywall.countUse('AI 一周菜谱与采购单 | AgentGongju.com'))return;
document.getElementById('outputBox').innerText=gen();
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(function(){alert('✅ 已复制！')})}
</script>
</body>
