<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}

.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
textarea,input[type=text],select{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:70px;resize:vertical}

.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.9;white-space:pre-wrap;font-size:.92rem;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-grid{grid-template-columns:1fr}}
</style>

<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🎨 AI绘画提示词生成器</h1><p>把脑海中的画面，变成专业级的绘图提示词</p></div>

<div class="card">
<label>🖼️ 你想画什么</label>
<textarea id="subject" placeholder="例如：一只戴着宇航头盔的橘猫，坐在月球表面遥望地球"></textarea>
<div class="param-grid">
<div><label>🎭 绘画风格</label>
<select id="style"><option>写实摄影</option><option>动漫二次元</option><option>水墨国风</option><option>赛博朋克</option><option>油画古典</option><option>3D渲染</option><option>像素复古</option><option>水彩清新</option></select></div>
<div><label>📐 画幅比例</label>
<select id="ratio"><option>1:1 正方形</option><option>16:9 横版</option><option>9:16 竖版</option><option>3:2 横版</option><option>2:3 竖版</option></select></div>
<div><label>💡 光线氛围</label>
<select id="light"><option>自然光</option><option>柔光梦幻</option><option>逆光剪影</option><option>霓虹夜光</option><option>清晨薄雾</option><option>黄昏暖阳</option></select></div>
<div><label>✨ 画面质量</label>
<select id="quality"><option>高清细腻</option><option>超清8K</option><option>大师级精修</option><option>电影质感</option></select></div>
</div>
<button class="btn-gen" id="genBtn">✨ 生成专业提示词</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">🎨 你的专属绘画提示词</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制提示词</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const styleMap={
'写实摄影':'photorealistic, ultra detailed, DSLR, f/1.8, sharp focus, natural skin texture',
'动漫二次元':'anime style, vibrant colors, cel shading, detailed lineart, moe aesthetic',
'水墨国风':'chinese ink wash painting, 水墨, flowing brush strokes, monochrome with accents',
'赛博朋克':'cyberpunk, neon lights, rain-slicked streets, futuristic, holographic, dystopian',
'油画古典':'classical oil painting, rich brushwork, warm tones, old masters, textured canvas',
'3D渲染':'3D render, Pixar style, soft global illumination, subsurface scattering, blender',
'像素复古':'pixel art, retro 8-bit, limited palette, crisp pixels, nostalgic',
'水彩清新':'watercolor, soft washes, delicate, pastel tones, paper texture, dreamy'
};
const lightMap={
'自然光':'natural lighting, soft shadows, balanced exposure',
'柔光梦幻':'soft dreamy lighting, glowing halos, ethereal atmosphere',
'逆光剪影':'backlit silhouette, dramatic rim light, high contrast',
'霓虹夜光':'neon glow, night scene, cyan and magenta reflections',
'清晨薄雾':'morning mist, gentle haze, soft diffused light',
'黄昏暖阳':'golden hour, warm sunset glow, long shadows'
};
const qualityMap={
'高清细腻':'highly detailed, 8k, sharp, crisp',
'超清8K':'8k resolution, ultra sharp, super detailed, sharp focus',
'大师级精修':'masterpiece, best quality, award winning, intricate details',
'电影质感':'cinematic, film grain, dramatic composition, 35mm'
};
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI绘画提示词生成器 | AgentGongju.com'))return;
const sub=document.getElementById('subject').value.trim();
if(!sub){alert('请先描述你想画的画面');return;}
const st=document.getElementById('style').value;
const rt=document.getElementById('ratio').value;
const li=document.getElementById('light').value;
const qu=document.getElementById('quality').value;
const neg='lowres, bad anatomy, watermark, text, blurry, deformed, extra fingers';
const prompts=[sub, styleMap[st], lightMap[li], qualityMap[qu], '--ar '+ratioCode(rt)].filter(Boolean);
const out='【画面主体】\n'+sub+'\n\n【完整提示词（英文）】\n'+prompts.join(', ')+'\n\n【负面提示词】\n'+neg+'\n\n【参数建议】\n画幅比例：'+rt+'\n采样步数：30｜提示词引导：7.5｜随机种子：随机';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function ratioCode(r){return r.split(' ')[0];}
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 提示词已复制！'))}
</script>
</body>
