<script>
document.getElementById('genBtn').addEventListener('click',function(){
 if(!Paywall.countUse('AI 视唱练耳每日训练 | AgentGongju.com'))return;
 var lvl=document.getElementById('level').value;
 var mins=document.getElementById('mins').value;
 var target=document.getElementById('target').value;
 var tool=document.getElementById('tool').value;
 var R=function(a){return a[Math.floor(Math.random()*a.length)];};
 var key=R(lvl==='begin'?['C大调手写音阶']:[lvl==='adv'?'bB/试唱移调':''].concat(['C大调','a小调','某首喜欢的歌练唱调'])).replace(/^$/g,'C大调');
 var a=new Date(),today=a.getMonth()+1+'月'+a.getDate()+'日';
 var itv={
  begin:{name:'音程',list:['纯一度→纯八度里先练同音：Do—Do','小二度Do-Re，#声往上半音的感觉'],desc:'先只盯两个音程不贪多：二度(上下移动一步的感觉)和三度(轻松软软、像跳远一步)。'},
  mid:{name:'音程',list:['三度/四度/五度视唱跳进','区分大三度(明快)和小三度(带点忧郁)','六度跳进听辨：想到\"天空之城/婚礼进行曲\"的开头帮助定位'],desc:'把音程绑到听过的歌上，是耳朵记住音高的最快办法。'},
  adv:{name:'音程/和弦',list:['相邻音程+转位','三和弦、七和弦性质听辨','离调音程识别'],desc:'到这一步要对着谱面边弹边唱母音，耳朵和手连着练效率才高。'} }[lvl];
 var rhy={
  begin:{t:'节奏',list:['用手/脚打稳定拍(节拍器或手机拍子App 60-72)，先能跟上不掉','全音符、二分、四分、八分：两拍打一次/一拍一打/半拍一打']},
  mid:{t:'节奏',list:['视读 4/4 拍两小节组合：ta(四分) ti-ti(八分) 各组合','跟节拍器用\"口唱+手拍\"两声部：口唱旋律手打节拍']},
  adv:{t:'节奏',list:['切分、附点、三连音专项','换拍号(3/4、6/8)切换顺畅','二声部手脚并用视唱']} }[lvl];
 var sing={begin:['同度模唱：跟琴唱Do，再跟唱 Re，注意别\"滑\"进去，直接落准','用手机录音回放，听听自己是不是每句尾音往下掉'],mid:['唱大二度→小三度→大二度再到四度，带\"呼吸和支撑\"别喊','随便哼一段旋律，用调音器对每个音，跑调的自己听出来再纠正'],adv:['完整视唱一首自带调号与移调的谱子并录音回听','把节奏中加入快速经过音与连线，检验指法般流畅']};
 var plan=[];
 var B=[];
 if(target==='interval'){B.push('今日重点「'+itv.name+'」\n· '+itv.list.join('\n· ')+'\n· '+itv.desc);}
 else if(target==='rhythm'){B.push('今日重点「'+rhy.t+'」\n· '+rhy.list.join('\n· '));B.push('节奏小技：先用一只脚打地板节拍，再让手上的\"口唱\"在拍点里穿梭，感觉像织毛衣——主线不断就稳。');}
 else if(target==='sing'){B.push('今日重点「模唱练准」\n· '+sing.join('\n· ')+'\n· 秘诀：用\"先低后高\"唱，高音别使劲\"够\"，想着\"往下坐\"反而准。');}
 else {B.push('今日重点「视谱反应」\n· 每天拿3条陌生短谱，不求一次对，先看清调号/拍号再慢速从头到尾唱一遍不断\n· 唱不准的某一句单独拎出来慢练 3 遍再合起来，进步最快。');}
 plan.push('🎧 '+today+' · 视唱练耳训练单（约'+mins+'分钟）\n');
 plan.push('🟢 热身 2分钟：轻哼\"Ma—Me—Mi\"五个半音往上，放松喉咙通通气，别用力。');
 plan.push(B.join('\n\n'));
 // combos daily
 plan.push('🔁 今日份组合练（挑一段）\n· 用琴(或App弹出)连续音：听→想名字→唱出来，5遍后换一组。\n· 打开手机录音，对着节拍器唱你最近学的一首歌/练习曲，播回来找音准问题。');
 playR=rhy;
 plan.push('⏱ 今天先'+(mins==='10'?'只挑上面\"重点\"两条认真做，别贪多':(mins==='20'?'做\"重点+一轮组合练\"即可，收尾留2分钟听录音':'做完整套：重点→组合练→再二轮视谱，最后对照录音自我打分')));
 plan.push('📌 一句提醒：'+(target==='sing'?'所谓跑调大多是\"不敢听自己\"，多录音、多比对，脸皮厚点进步就快。':target==='rhythm'?'节奏不稳90%是拍没\"打稳\"，把节拍器调慢到你能从容打准再说快。':'每天15分钟，三周后的耳朵连你自己都会吓一跳。'));
 var out=plan.join('\n');
 out+='\n\n（用琴出现困难时可搜\"在线钢琴\"网页/免费App代替，练耳不挑设备，挑坚持。）';
 document.getElementById('resultArea').classList.add('active');
 document.getElementById('result').textContent=out;
});
