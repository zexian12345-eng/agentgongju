<button class="btn-gen" id="genBtn">✨ 生成花样文字</button></div>

<script>
function wrap(t,style){let parts=t.split('');let res;
if(style==='花体'){let m={'a':'𝐚'};res=parts.map(c=>fontMapping(c,'flower')).join('');}
else if(style==='泡泡'){res=parts.map(c=>'Ⓐ'.includes(c)?c:circled(c)).join('');}
else if(style==='波浪'){res=parts.map((c,i)=>i%2===0?c:c+'̶').join('');}
else if(style==='上下'){res=parts.slice().reverse().join('')+' ƃuıɥʇ';}
else if(style==='空格'){res=parts.join(' ');}
else if(style==='符号'){res='『'+t+'』';}
else if(style==='加粗'){res=parts.map(c=>boldMap[c]||c).join('');}
else if(style==='勾股'){res=parts.map(c=>'✧'+c+'✧').join('');}
else {res=t;}
return res;}
function circled(c){if(/[a-z]/.test(c))return String.fromCharCode(0x24D0+(c.charCodeAt(0)-97));if(/[A-Z]/.test(c))return String.fromCharCode(0x24B6+(c.charCodeAt(0)-65));if(/[0-9]/.test(c))return ['⓪','①','②','③','④','⑤','⑥','⑦','⑧','⑨'][+c];return c;}
const boldMap={'我':'𝐈','是':'𝐒'};
function fontMapping(c,type){return c;}
const styles=['花体','泡泡','加粗','符号','空格','上下','勾股','波浪'];
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('表情包花样文字生成 | AgentGongju.com'))return;
let t=document.getElementById('txt').value;if(!t){alert('请输入文字');return;}
let html='';styles.forEach(s=>{let v=wrap(t,s);html+='<div class="out-item"><span class="t">'+s+'</span><span class="v">'+v+'</span><button onclick="copyV(\''+(v.replace(/'/g,"\\'"))+'\')">复制</button></div>';});
document.getElementById('outList').innerHTML=html;document.getElementById('resultArea').style.display='block';
});
function copyV(v){navigator.clipboard.writeText(v).then(()=>alert('✅ 已复制！'))}
</script>
