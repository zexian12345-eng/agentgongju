<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写作灵感选题器 | AgentGongju.com</title>
<meta name="description" content="AI写作灵感选题生成器，为博主、作者、内容创作者一键生成爆款选题与内容角度">
<meta name="keywords" content="写作灵感,选题,爆款选题,内容创作,选题灵感,自媒体">
<link rel="stylesheet" href="../css/style.css">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.8;white-space:pre-wrap;min-height:60px;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>💡 写作灵感选题器</h1><p>为博主与内容创作者一键生成爆款选题和内容角度</p></div>

<div class="card"><div class="param-row">
<div><label>创作领域</label><select id="field"><option>职场成长</option><option>情感生活</option><option>理财投资</option><option>生活方式</option><option>科技数码</option><option>美妆时尚</option></select></div>
<div><label>平台</label><select id="plat"><option>小红书</option><option>公众号</option><option>抖音</option><option>知乎</option><option>今日头条</option></select></div></div>
<div><label>当前热点 / 想写相关的内容（选填）</label>
<textarea id="hot" placeholder="例如：最近在流行极简生活，想写相关的"></textarea>
<button class="btn-gen" id="genBtn">🎲 生成灵感选题</button></div>
<div class="result-area" id="resultArea"><div class="card"><div style="color:#22c55e;font-weight:600;margin-bottom:12px">💡 你的灵感选题</div><div class="result-box" id="out"></div><button class="copy-btn" onclick="copyResult()">📋 复制</button></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyResult(){navigator.clipboard.writeText(document.getElementById('out').textContent).then(()=>alert('✅ 已复制！'))}
const topics={
'职场成长':['从月薪3千到3万，我做对了这3件事','面试官最反感的5个行为','30岁前，请尽早想清楚的3个问题','高效人士的一天是怎么安排的？'],
'情感生活':['恋爱里最舒服的状态是什么样','成年人的友情，越长大越珍贵','婚姻里比爱更重要的3件事','独处时的快乐，你真的会吗'],
'理财投资':['月薪8千如何存下第一笔10万','新手理财最容易踩的3个坑','记账4年，我看到了什么','副业与理财的底层逻辑'],
'生活方式':['断舍离后，我的生活轻松多了','把家布置舒服的小技巧','极简生活的一周实验','把日子过成诗的一件小事'],
'科技数码':['如何挑选适合自己的第一台电脑','这些隐藏技巧让你的手机更好用','聊聊今年的新趋势','数码产品避坑指南'],
'美妆时尚':['普通女生如何找到自己的风格','护肤品的正确使用顺序','平价又高级的穿搭思路','换季皮肤护理全攻略']};
const hooks=['教你轻松上手','看完就懂','亲测有效','建议收藏慢慢看','很多人不知道','别再走弯路了'];
document.getElementById('genBtn').addEventListener('click',()=>{
const field=document.getElementById('field').value;const plat=document.getElementById('plat').value;const hot=document.getElementById('hot').value.trim();
const pool=topics[field]||topics['职场成长'];
const picks=[];const t=[...pool];while(t.length&&picks.length<5){picks.push(t.splice(Math.floor(Math.random()*t.length),1)[0]);}
let hotLine=hot?('\n热点结合：围绕「'+hot+'」切入，你的选题可以更有时效性。\n'):'';
let out='【'+field+' · '+plat+' 灵感选题】\n\n';
picks.forEach((p,i)=>{out+=(i+1)+'. '+p+' '+hooks[Math.floor(Math.random()*hooks.length)]+'\n';});
out+='\n📌 内容切入角度建议：\n· 用个人真实经历开头，建立代入感\n· 结合'+hotLine.replace('热点结合：','')+'当前热点话题\n· 结尾抛出互动提问，引导评论\n\n🎯 挑选原则：选你最擅长、最有表达欲的一个，先写起来！';
if(hot)out=out.replace('\n\n📌 内容切入角度建议：\n· 用个人真实经历开头，建立代入感\n· '+'\n· 结尾抛出互动提问，引导评论\n', '\n\n📌 内容切入角度建议：\n· 用个人真实经历开头，建立代入感\n· 结合当前热点话题\n· 结尾抛出互动提问，引导评论\n');
document.getElementById('resultArea').classList.add('active');
document.getElementById('out').textContent=out;
});
</script>
</body>
</html>
