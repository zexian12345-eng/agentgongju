<script>
function rf(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
document.getElementById('genBtn').addEventListener('click',()=>{
  if(!Paywall.countUse('AI 吉祥物昵称生成器 | AgentGongju.com'))return;
  const a=document.getElementById('animal').value;
  const ind=document.getElementById('industry').value;
  const style=document.getElementById('style').value;
  let n=parseInt(document.getElementById('num').value||5);n=Math.max(3,Math.min(6,n));
  const pool=build(a,ind,style);
  const names=shuffle(pool).slice(0,n);
  const box=document.getElementById('box');box.innerHTML='';
  names.forEach((it,i)=>{
    const d=document.createElement('div');d.className='mascot';
    d.innerHTML=`<div class="nm">${it[0]}</div><div class="tag">${it[1]}</div><div class="wh">${it[2]}</div><button class="copy-btn" onclick="c(this,'${it[0]}')">📋 复制</button>`;
    box.appendChild(d);
  });
  document.getElementById('resultArea').classList.add('active');
  document.getElementById('resultArea').scrollIntoView({behavior:'smooth'});
});
function c(b,t){navigator.clipboard.writeText(t).then(()=>{const o=b.textContent;b.textContent='✓ 已复制';setTimeout(()=>b.textContent=o,1200);});}
function build(animal,ind,style){
  // [名字, 标签(形象+风格), 内涵一句话]
  const B={
  '熊':[['阿憨','元气可爱','憨厚又好脾气，人人都想给它抱一抱。'],['壮壮','稳重可靠','壮实可靠，像把品牌的安稳都扛在肩上。'],['团团熊','呆萌好记','圆圆一团让人想rua，亲和力满分。'],['北辰','国潮高级','如北国之星，沉稳大气有分量。']],
  '兔子':[['跳跳','元气可爱','蹦蹦跳跳一见你就开心。'],['软糖','呆萌好记','又甜又软，有它在就很治愈。'],['雪团','元气可爱','白白一团像小雪山，干净温柔。'],['瑶瑶','国潮高级','灵动轻盈，敏捷又有福气。']],
  '猫':[['阿卷','呆萌好记','爱窝成一小卷，慵懒又治愈。'],['嗨皮','元气可爱','元气十足，走到哪都能嗨起来。'],['灵犀','国潮高级','心有灵犀，默契又机灵。'],['招财团','稳重可靠','招财纳福，靠谱稳当。']],
  '狗':[['旺财','元气可爱','把福气迎进大门，见人就摇尾巴。'],['铁头','稳重可靠','忠心又坚毅，认定的事一定干成。'],['来福','元气可爱','把福气迎进来，亲热照顾客人。'],['忠勇','稳重可靠','忠诚勇敢的伙伴形象。']],
  '熊猫':[['糯米团','元气可爱','白白糯糯，憨态可掬人见人爱。'],['圆圆','呆萌好记','圆滚滚的国宝，把地球人萌化。'],['墨宝','国潮高级','黑白衣着如墨，自带东方气韵。'],['滚滚','呆萌好记','爱打滚的快乐担当。']],
  '龙':[['小龙包','元气可爱','包子脸的酷龙，奶凶又可爱。'],['腾云','国潮高级','腾云驾雾，气势不凡。'],['晓龙','国潮高级','破晓之龙，朝气勃发。'],['阿敖','稳重可靠','翱翔九天，稳得住的担当。']],
  '虎':[['虎哥','元气可爱','敞亮豪爽，见谁都是哥们儿。'],['威风','稳重可靠','威风凛凛又充满安全感。'],['跃跃','元气可爱','虎虎生威，跃跃欲试。'],['赳赳','国潮高级','雄赳赳气昂昂，中国气派。']],
  '鹿':[['诺诺','呆萌好记','鹿角软萌小宝宝，听话又温顺。'],['灵鹿','国潮高级','福禄同音，温雅灵动。'],['音音','元气可爱','轻轻松松敲开你心门。'],['瑞鹿','国潮高级','瑞兽临门，吉祥温润。']],
  '狐狸':[['阿狐','元气可爱','机灵俏皮，点子王。'],['雪黛','国潮高级','白狐黛眉，聪明又雅致。'],['嗖嗖','元气可爱','跑得快主意灵。'],['睿狐','稳重可靠','睿智冷静处变不惊。']],
  '海豚':[['跃跃','元气可爱','跃出水面，元气满满。'],['波仔','呆萌好记','爱冲浪的蓝色小伙伴。'],['灵波','国潮高级','身姿灵巧，笑声如波。'],['冲浪','呆萌好记','活力与自由的化身。']],
  '熊2':[['飞羽','国潮高级','翱翔凌厉，目光如炬。'],['闪电','元气可爱','快如闪电，一飞冲天。'],['毅哥','稳重可靠','坚毅果敢，长空霸主。'],['疾风','元气可爱','御风而行，潇洒自信。']],
  '娃娃':[['小福','元气可爱','把福气慢慢讲给你听。'],['芽芽','元气可爱','元气新芽，代表成长与希望。'],['团子','呆萌好记','圆头圆脑自带喜感。'],['小满','国潮高级','小得盈满，不骄不躁。']]
  };
  let list=B[animal]||B['熊'];
  // 行业附加暗示词
  const indFix={
   '': ['', '', '', ''],
   '互联网科技': ['AI灵感常驻', '科技感拉满', '聪明又靠谱', '数字时代的暖伙伴'],
   '教育校园': ['象牙塔里的活宝', '学到哪见到哪', '求知小伙伴', '操场上的快乐担当'],
   '体育赛事': ['运动神经在线', '为冠军打CALL', '热血担当', '荣誉守护者'],
   '食品餐饮': ['看着就很好吃', '自带好胃口', '餐桌上的开心果', '健康饮食小卫士'],
   '旅游文创': ['爱旅行的远方客', '带你看世界', '旅途最佳拍档', '把风景装进口袋'],
   '金融财税': ['严谨又亲民', '帮你管好钱袋', '理财好帮手', '稳稳的幸福'],
   '医疗健康': ['元气守护者', '健康小卫士', '给人力量催人向上', '温柔告白的贴心人'],
   '游戏动漫': ['把把超神', '攻略小能手', '开黑气氛组', '次元破壁机']
  }[ind]||['','','',''];
  // 附加行业后缀偏好 - 生成
  const out=[];let idx=0;
  for(const base of list){ const fix=(indFix&&indFix[idx])?' · 行业人设：'+indFix[idx]:''; out.push([base[0], ind+ ' 吉祥物 · '+(base[0]||''), (base[2]||'')+fix]); idx++; }
  // 若不足补风格变体
  const extra=[[''+rf(['宝','豆','果','仔']),'风格变体','好记上口的后缀变体，适合更进一步取舍。']];
  out.push(...extra);
  return out.filter(Boolean);
}
