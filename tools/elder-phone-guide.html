<script>
const OS_EXTRA={安卓:{name:'安卓',tip:'“设置→显示→字体大小→调大”，并把桌面图标也调大些更容易点。'},苹果:{name:'iPhone',tip:'“设置→辅助功能→显示与文字大小→更大字体”，打开它们认得更清。'},不分:{name:'通用',tip:'多数手机在“设置→显示与亮度→字体大小”可调大。'}};
const F={
'视频':{t:'📹 微信视频通话，想孩子了就点开他',
step:['① 找到微信(绿色图，右下角一绿点)，点开。','② 最上面一栏找到孩子的名字(聊天的那个)，点进去。','③ 点右上角那个“摄像机”图标(⊕或＋号旁)，选择【视频通话】。','④ 等对方接起来，就能看到孩子了！声音小就把手机侧边音量键往上按。','⑤ 想挂断就点屏幕上的红色“挂断”键。']},
'支付':{t:'💳 用手机“扫一扫”买菜付款',
step:['① 打开微信，点右上角“＋”，再点最下面【扫一扫】。','② 对着老板贴的二维码，把整个方框对准它。','③ 手机屏幕跳出一行数字，点【输入金额】。','④ 输好价钱(看清楚小数点，别多点一个0！)，点【付款】。','⑤ 老板手机响“叮”就是钱付成功了。','⚠ 密码只在自己手上输，别让旁人帮忙。']},
'打车':{t:'🚕 用高德/滴滴叫车(先点开看步骤)',
step:['① 让子女先把付款方式绑好(绑银行卡或子女代付更安全)。','② 打开“高德地图”，点上面的【打车】按钮。','③ 它会问你“从哪里上车”——你不动，站在路边等车就行，一般不用改。','④ 输入或喊出目的地(也可让子女提前存好：写在哪就点到哪)。','⑤ 点【确认叫车】→ 看见车牌号，车到了对号码再上车。']},
'挂号':{t:'🏥 网上挂号看医生',
step:['① 打开微信，搜你常去医院的公众号(子女帮忙关注好)。','② 公众号菜单里找【预约挂号/挂号】，点开。','③ 选【科室】→ 选【专家或普通号】→ 选【时间】。','④ 输就诊人信息(第一次要在-我的-就诊人里加好自己和证件)。','⑤ 付款后会收到短信/二维码，到院出示即可。']},
'截图':{t:'📸 怎么把手机画面存下来/发给子女',
step:['① 要看的东西先停在那个画面。','② 按住机身侧面的“电源键+音量小键”同时按一下(安卓)或有“屏幕录制/截屏”功能从顶部下拉选。','③ 听到“咔嚓”就说明截好了，会自动存到相册。','④ 打开微信→点“+”→相册→选刚才那张→发送。','⑤ iPhone：同时按“右侧电源键+左侧上音量键”。']},
'安全':{t:'🛡 一张图认清诈骗套路，守好养老钱',
step:['① 只要对方在电话里让你“转账/给验证码/去银行”，先挂断再亲自问孩子。','② “公检法/客服退款/免费抽奖”都是骗子最爱说的话。','③ 陌生链接、让点开短信里网址的，一律不点。','④ 手机上的支付密码只自己输，谁都别告诉。','⑤ 装好国家反诈中心APP，收到提醒第一时间提高警觉。']}
};
const TONE={爸妈:{p:'爸/妈',words:'学起来很快的，别急，我们一步一步来。'},祖辈:{p:'爷爷/奶奶',words:'这个特别简单，您点一下试试，我在这儿呢。'},自己手机:{p:'他/她',words:'一次只教一个动作，让长辈自己点手指，你只在旁边讲解。'}};
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI教爸妈用智能手机讲义 | AgentGongju.com'))return;
const who=document.getElementById('who').value,func=document.getElementById('func').value,os=document.getElementById('os').value,font=document.getElementById('font').value;
const P=TONE[who],F2=F[func],OS=OS_EXTRA[os];
let out=`📞 给${P.p}的《${F2.t}》手机小讲义\n\n`;
out+=`💬 开场白：${P.words}　（注意：您说、他点，别抢他的手机！）\n\n`;
out+=`━━ 一步一步来 ━━\n${F2.step.map(s=>s).join('\n')}\n`;
out+='\n━━ 小贴士 ━━\n';
out+=font==='开大字'?'· 字已经调大了，看得更清楚，很好！\n':'· 建议先把字调大：设置→显示→字体大小调到最大，长辈按起来舒服。\n';
out+='· 把这些步骤抄在纸上贴在手机背面/桌面，忘了能查。\n· 教完让${P.p}自己完整做一遍，你在旁边看，最能巩固。\n';
out+='· 别忘了夸一句！“对，就是这样，特别好！”\n';
out+='\n━━ 系统提示 ━━\n· '+OS.tip+'\n';
out+='\n━━ 如果卡住了 ━━\n· 让ta长按电源重启手机(不是关机)。\n· 真急了就当面帮，别隔着电话指挥太久。\n\n【多一份耐心，少一份代沟 📞】';
document.getElementById('outputBox').innerText=out.replace(/\$\{P\.p\}/g,"他");
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 已复制！'))}
</script>
