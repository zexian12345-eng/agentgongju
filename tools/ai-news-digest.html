<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI新闻资讯摘要 | AgentGongju.com</title>
<meta name="description" content="粘贴一段新闻或长文，AI帮你提炼核心要点、生成几句话摘要，快速把握资讯重点。">
<meta name="keywords" content="新闻摘要,资讯速览,文章总结,新闻要点,AI摘要,长文提炼">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
textarea,input[type=text],select{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;font-size:.92rem;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-grid{grid-template-columns:1fr}}
</style>
<script>
var _hmt = _hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";

  s.parentNode.insertBefore(hm, s);

<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>📰 AI新闻资讯摘要</h1><p>长文秒变要点，快速get资讯核心</p></div>

<div class="card">
<label>📄 摘要长度</label>
<select id="len"><option value="short">一句话速览</option><option value="mid" selected>3-5条核心要点</option><option value="long">详细摘要（含背景）</option></select>
<label>📝 输入新闻/文章内容</label>
<textarea id="content" placeholder="在此粘贴要摘要的新闻或长文内容，AI将自动提炼核心信息……"></textarea>
<button class="btn-gen" id="genBtn">⚡ 生成摘要</button>
<label style="margin-top:12px;color:#64748b;font-size:.8rem">* AI摘要基于输入文本生成，重要信息建议核对原文</label>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">📰 资讯摘要</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制摘要</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
document.getElementById('genBtn').addEventListener('click',function(){
if(!Paywall.countUse('AI新闻资讯摘要 | AgentGongju.com'))return;
const content=document.getElementById('content').value.trim();
const len=document.getElementById('len').value;
if(!content){alert('请先输入新闻或文章内容');return;}
// 简单句子切分
const sentences=content.split(/[。！？!?\n]/).map(s=>s.trim()).filter(s=>s.length>3);
const domain=guessDomain(content);
const keywords=extractKeywords(content);
let out='';
if(len==='short'){
  out+='【一句话速览】\n';
  out+=(sentences[0]||'本文围绕相关话题展开。')+'\n\n';
  out+='【事件类型】'+domain+'\n';
  out+='【涉及关键词】'+(keywords.length?keywords.slice(0,5).join('、'):'无突出关键词')+'\n';
}else if(len==='mid'){
  out+='【核心要点】\n';
  const picks=sentences.length>5?sentences.slice(0,5):sentences;
  picks.forEach((s,i)=>{out+=(i+1)+'. '+s.trim().slice(0,60)+(s.length>60?'……':'')+'\n';});
  out+='\n【一句话总结】\n'+guessSummary(sentences)+'\n\n';
  out+='【关键词】'+keywords.slice(0,5).join('、')+'\n';
  out+='【领域】'+domain+'\n';
}else{
  out+='【详细摘要】\n';
  out+='本文属于「'+domain+'」领域的报道。\n';
  const first=sentences.slice(0,Math.min(8,sentences.length)).join(' ');
  out+='核心内容概述：'+first.slice(0,180)+(first.length>180?'……':'')+'\n\n';
  out+='【关键要点】\n';
  sentences.slice(0,6).forEach((s,i)=>{out+='· '+s.trim().slice(0,70)+'\n';});
  out+='\n【关键词】'+keywords.slice(0,8).join('、')+'\n';
}
out+='\n—— AI 资讯摘要，助你快速掌握要点 📰';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function guessDomain(t){
  if(/科技|AI|人工智能|互联网|芯片|APP/.test(t))return'科技互联网';
  if(/股市|经济|金融|投资|央行|GDP/.test(t))return'财经经济';
  if(/体育|比赛|联赛|夺冠/.test(t))return'体育';
  if(/娱乐|明星|电影|演唱会/.test(t))return'文娱';
  if(/健康|医疗|疾病|药物/.test(t))return'健康医疗';
  if(/教育|学校|学生|考试/.test(t))return'教育';
  return'综合资讯';
}
function extractKeywords(t){
  // 简单关键词提取：选取出现较频繁的双字/三字词
  const stop=['我们','他们','一个','这个','进行','通过','以及','对于','关于','相关'];
  const words=[];
  const re=/[\u4e00-\u9fa5]{2,4}/g;let m;
  while((m=re.exec(t))&&words.length<20){const w=m[0];if(!stop.includes(w)&&!words.includes(w))words.push(w);}
  return words.slice(0,12);
}
function guessSummary(s){
  return (s[0]||'')+' 总体而言，'+(s[1]||'该事件')+'反映了当前相关领域的最新动态与发展趋势。';
}
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 摘要已复制！'))}
</script>
</body>
</html>
