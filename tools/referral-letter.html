<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内推推荐信生成器 | AgentGongju.com</title>
<meta name="description" content="内推推荐信生成器，一键生成专业又真诚的求职内推信，适用于同事、校友、朋友内推，突出候选人优势">
<meta name="keywords" content="内推信,推荐信,求职内推,招聘推荐,岗位推荐,同事推荐">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.8;white-space:pre-wrap;margin-bottom:12px;font-size:.92rem}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.tip{color:#94a3b8;font-size:.8rem;line-height:1.8;margin-top:6px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>
var _hmt = _hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";
  var s = document.getElementsByTagName("script")[0];
  s.parentNode.insertBefore(hm, s);
})();
</script>
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>💌 内推推荐信生成器</h1><p>帮朋友一把，也为自己攒口碑</p></div>

<div class="card">
<label>👤 求职者姓名</label>
<input type="text" id="name" placeholder="例如：王小明的姓名">
<label>🎯 应聘岗位</label>
<input type="text" id="job" placeholder="例如：高级前端工程师 / 数据分析师 / 运营主管">
<div class="param-row">
<div><label>🤝 你和 TA 的关系</label>
<select id="rel">
<option value="前同事">前同事</option>
<option value="校友">同校校友</option>
<option value="导师学生">导师/学生</option>
<option value="朋友">多年好友</option>
</select></div>
<div><label>📌 内推对象/渠道</label>
<select id="chan">
<option value="HR">发给 HR</option>
<option value="业务主管">发给用人主管</option>
<option value="猎头">给猎头</option>
</select></div>
</div>
<label>🌟 推荐理由 / 亮点（可选）</label>
<textarea id="point" placeholder="例如：技术扎实、带过团队、抗压能力强、为公司解决过难点问题"></textarea>
<button class="btn-gen" id="genBtn">✉️ 生成推荐信</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">📨 推荐信草稿</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制推荐信</button>
<div class="tip">💡 提示：请替换文中「署名」为你的真实姓名，并结合真实事例微调，推荐信会更真实可信。</div>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const REL={
'前同事':'我与他在同一个项目组共事过两年，合作默契，对他的工作能力有最直观的了解',
'校友':'我们虽不同届，但同为母校校友，私下交流较多，对他的为人和能力相当熟悉',
'导师学生':'我作为他求学期间的导师，一路见证了他的成长与蜕变',
'朋友':'我们相识多年，既是好友又有过多次工作上的合作，对他相当信任'};
const CHAN={
'HR':'给您推荐一位非常不错的候选人，烦请您抽空评估一下：',
'业务主管':'冒昧打扰，想向您诚意推荐一位我非常认可的候选人：',
'猎头':'这里有一位我个人非常看好的候选人，推荐给您跟进：'};
const TRAITS=['解决问题的能力很强','学习能力出众，上手很快','责任心强，交付让人放心','合作意识好，团队反馈极佳','为人踏实靠谱，值得信赖','逻辑清晰，沟通表达到位'];
function pick(a){return a[Math.floor(Math.random()*a.length)];}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('内推推荐信生成器 | AgentGongju.com'))return;
const name=document.getElementById('name').value.trim()||'这位候选人';
const job=document.getElementById('job').value.trim()||'该岗位';
const rel=document.getElementById('rel').value;
const chan=document.getElementById('chan').value;
const points=document.getElementById('point').value.trim().split(/[,，、\n]+/).filter(Boolean);
const ps=points.length?points:pick(TRAITS).replace(/[。，]/g,'');
const traitLine=points.length?points.slice(0,4).map((p,i)=>`${i+1}. ${p.trim()}`).join('\n') : '· '+pick(TRAITS)+'\n· '+pick(TRAITS);
const out=`您好！\n\n${CHAN[chan]}\n\n我推荐${name==='这位候选人'?'的这位朋友':name}应聘贵司「${job}」一职。${REL[rel]}。\n\n就我观察，${name==='这位候选人'?'TA':name}具备以下几点突出优势：\n${traitLine}\n\n我认为${name==='这位候选人'?'TA':name}非常适合「${job}」这个岗位，对团队会是很好的补充。如贵方有兴趣，欢迎安排面试进一步了解，也欢迎随时与我沟通。${name==='这位候选人'?'若方便，还望优先考虑':''}\n\n感谢您拨冗阅读，期待好消息！\n\n此致\n敬礼\n\n推荐人：〔您的署名〕\n联系方式：〔您的电话/邮箱〕`;
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 推荐信已复制！'))}
</script>
</body>
</html>
