var CARE_BONUS={
fortune:['1','5','8','9'],
peace:['2','5','6'],
relation:['2','4','6','7'],
study:['3','4','7']
};
var CARE_BONUS2={
fortune:['8','9','1','5'],
peace:['5','6','2'],
relation:['6','7','2','4'],
study:['7','3','4']
};
function analyze(){
var p=document.getElementById('phone').value.replace(/\D/g,'');
if(p.length!==11){alert('请输入 11 位手机号');return null;}
var use=document.getElementById('use').value;
var care=document.getElementById('care').value;
var tail=p.slice(3);
var pairs=[];
for(var i=0;i<tail.length-1;i++)pairs.push(tail.substr(i,2));
var score=60,notes=[];
var excellent=['13','14','15','16','17','18','19','31','39','41','48','58','61','66','67','68','78','81','83','86','87','88','89','91','94','95','96','98'];
var caution=['26','44','46','63','74'];
pairs.forEach(function(pr){
if(PAIR[pr]){
if(excellent.indexOf(pr)!==-1){score+=3;notes.push(pr+'　'+PAIR[pr][0]+'：'+PAIR[pr][1]+'（加分项）');}
else if(caution.indexOf(pr)!==-1){score-=2;notes.push(pr+'　'+PAIR[pr][0]+'：'+PAIR[pr][1]+'（需留意节奏）');}
else{score+=1;notes.push(pr+'　'+PAIR[pr][0]+'：'+PAIR[pr][1]);}
}
});
CARE_BONUS[care].forEach(function(c){ if(tail.indexOf(c)!==-1)score+=2; });
CARE_BONUS2[care].forEach(function(c){ if(tail.indexOf(c)!==-1)score-=1; });
if(/(\d)\1\1/.test(tail))score+=4;
if(+p.slice(8,11)%2===0)score+=2;
if(score>98)score=98;
if(score<35)score=35;
var level=score>=88?'上佳':score>=75?'良好':score>=60?'中平':'一般';
document.getElementById('scoreBig').innerText=score+' 分 · '+level;
var out='════ 号码数字能量报告 ════\n';
out+='号码：'+p.slice(0,3)+'****'+p.slice(7)+'（已做隐私遮罩）\n';
out+='后八位：'+tail+'　|　用途：'+({biz:'商务人脉',work:'工作沟通',life:'生活日常',love:'情感社交'}[use])+'\n';
out+='综合评分：'+score+' 分（'+level+'）\n';
out+='\n──── 数字组合逐个解读 ────\n';
if(notes.length)notes.forEach(function(n,i){out+=(i+1)+'. '+n+'\n';});
else out+='该号码未匹配到常见的双数组合理念，可参考单数字寓意。\n';
out+='\n──── 针对你的侧重点 ────\n';
var careName={fortune:'财运事业',peace:'平安顺遂',relation:'人缘贵人',study:'学业成长'}[care];
out+='你更看重「'+careName+'」：';
var cg=CARE_BONUS[care].filter(function(c){return tail.indexOf(c)!==-1;});
if(cg.length)out+='号码中出现了 '+'['+cg.join('、')+']'+' 这类倾向的数字，与你的关注点是契合的。\n';
else out+='号码中这类倾向的数字偏少，若特别在意，选号时可优先考虑包含 '+'['+CARE_BONUS[care].join('、')+']'+' 的号码。\n';
out+='\n──── 选号实用建议 ────\n';
out+='1. 尾号好记比"数字吉利"更实际：连号、ABAB、AABB 都容易被人记住；\n';
out+='2. 号码主要用于对外联络时，尽量避开满是 4 的尾号，减少对方记忆障碍；\n';
out+='3. 换号成本很高（要通知所有联系人），别为了数字反复更换；\n';
out+='4. 所谓数字能量主要影响的是心理暗示，真正决定人脉的是你的可靠度。\n';
out+='\n⚠️ 本工具基于民间数字文化与传统寓意整理，纯属娱乐参考，不具科学性，请勿据此影响实际决策。';
return {score:score,out:out};
}
</script>
