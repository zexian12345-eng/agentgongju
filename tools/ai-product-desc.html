<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 商品详情页文案 | AgentGongju.com</title>
<meta name="description" content="输入商品信息，生成电商详情页主图文案、卖点提炼、规格说明与买家常见问题，适合淘宝京东拼多多。">
<meta name="keywords" content="商品文案,详情页,电商文案,卖点提炼,主图文案,产品描述,淘宝详情">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,input[type=text],textarea{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:110px;resize:vertical;line-height:1.8}
select:focus,input:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;margin-bottom:12px;font-size:.92rem}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>
var _hmt = _hmt || [];
(function() { var hm = document.createElement("script"); hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949"; var s = document.getElementsByTagName("script")[0]; s.parentNode.insertBefore(hm, s); })();
</script>
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🛒 AI 商品详情页文案</h1><p>主图表什么字、详情页怎么写，一次给全</p></div>

<div class="card">
<label>📦 商品名称</label>
<input type="text" id="name" placeholder="例如：家用静音破壁机">
<div class="param-row">
<div><label>🏪 平台</label>
<select id="plat"><option value="taobao" selected>淘宝 / 天猫</option><option value="jd">京东</option><option value="pdd">拼多多</option><option value="douyin">抖音小店</option></select></div>
<div><label>🎯 目标人群</label>
<select id="target"><option value="young">年轻上班族</option><option value="mom" selected>宝妈家庭</option><option value="old">中老年</option><option value="student">学生党</option><option value="pet">养宠人群</option></select></div>
</div>
<div class="param-row">
<div><label>💰 价格定位</label>
<select id="price"><option value="low">低价走量</option><option value="mid" selected>中端性价比</option><option value="high">高端品质</option></select></div>
<div><label>🎨 文案调性</label>
<select id="tone"><option value="practical" selected>实用理性</option><option value="warm">温情生活</option><option value="hot">热销爆款</option><option value="quality">品质高端</option></select></div>
</div>
<label>✨ 商品核心信息（材质、功能、参数、差异点）</label>
<textarea id="info" placeholder="例如：600W 电机、8 叶刀头、550ml 容量、一键自清洗、可做豆浆/果汁/辅食、静音设计 60 分贝以下、食品级 Tritan 杯体"></textarea>
<button class="btn-gen" id="genBtn">🛒 生成文案</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制文案</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function gen(){
var name=document.getElementById('name').value.trim()||'本商品';
var plat=document.getElementById('plat').value;
var target=document.getElementById('target').value;
var price=document.getElementById('price').value;
var tone=document.getElementById('tone').value;
var info=document.getElementById('info').value.trim();
if(!info){alert('请填写商品核心信息，否则无法提炼卖点');return null;}

var features=info.split(/[,，、;；\n]+/).map(function(x){return x.trim();}).filter(function(x){return x;});
var nums=features.filter(function(f){return /\d/.test(f);});
var targetName={young:'年轻上班族',mom:'宝妈家庭',old:'中老年',student:'学生党',pet:'养宠人群'}[target];
var platName={taobao:'淘宝/天猫',jd:'京东',pdd:'拼多多',douyin:'抖音小店'}[plat];
var toneName={practical:'实用理性',warm:'温情生活',hot:'热销爆款',quality:'品质高端'}[tone];

var out='════ 商品详情页文案套件 ════\n';
out+='商品：'+name+'\n';
out+='平台：'+platName+'　|　人群：'+targetName+'　|　定位：'+({low:'低价走量',mid:'中端性价比',high:'高端品质'}[price])+'　|　调性：'+toneName+'\n\n';

out+='──── 一、主图文案（每张不超过 10 字，短才有冲击力）────\n';
var hooks;
if(tone==='practical'){
hooks=['一台顶三台','省时省力','参数全公开','细节看得见'];
}else if(tone==='warm'){
hooks=['给家人的一份用心','每天都用得上','生活小确幸','把时间留给自己'];
}else if(tone==='hot'){
hooks=['爆款返场','已售 10万+','闭眼入不踩雷','断货预警'];
}else{
hooks=['用料讲究','品质之选','细节决定体验','慢工出细活'];
}
hooks.forEach(function(h,i){out+='图'+(i+1)+'：'+h+'\n';});
out+='\n──── 二、卖点提炼（3 大核心卖点）────\n';
for(var i=0;i<Math.min(3,Math.max(1,features.length));i++){
var f=features[i];
out+='卖点 '+(i+1)+'：'+f+'\n';
out+='　→ 用户视角翻译：这对「'+targetName+'」意味着——'+(
/静音|降噪|低噪/.test(f)?'早上用也不吵醒家人，晚上做辅食不闹心。':
/容量|L|ml|升/.test(f)?'一次做够全家的量，不用反复操作，省时间。':
/清洗|自清/.test(f)?'用完冲一冲就干净，不用拆洗一堆零件。':
/电机|W|功率|刀头/.test(f)?'打得细腻不卡渣，硬食材也能轻松搞定。':
/材质|食品级|不锈钢/.test(f)?'入口的东西，材质安全最让人放心。':
'解决日常使用中的实际麻烦，用过就回不去了。')+'\n';
}
if(features.length>3){
out+='\n其他卖点（可作为详情页次要模块）：\n';
features.slice(3).forEach(function(f,i){out+='· '+f+'\n';});
}

out+='\n──── 三、详情页结构（从上到下）────\n';
out+='① 场景代入图：'+targetName+'正在使用 '+name+' 的真实场景，配一句你正在解决的痛点；\n';
out+='② 一句话价值主张：'+name+'，'+hooks[0]+'。\n';
out+='③ 核心卖点三连：用图标＋短句＋一句解释，看图就能懂；\n';
out+='④ 参数规格表：把买家最关心的 6-8 个参数列成表格，别堆全部参数；\n';
out+='⑤ 细节实拍：接口、材质、做工的特写，打消"是不是便宜货"的疑虑；\n';
out+='⑥ 使用步骤：3 步以内讲完怎么用，越简单越显好用；\n';
out+='⑦ 常见问题：把差评里出现过的问题正面回答，比藏起来更有信任感；\n';
out+='⑧ 售后与保障：质保时长、退换规则、客服响应时间。\n';

out+='\n──── 四、规格与卖点文案（可直接用）────\n';
out+='【标题备选】\n';
out+='1. '+name+'｜'+features[0]+'｜适合'+targetName+'\n';
out+='2. 【'+({low:'限时特惠',mid:'高性价比',high:'品质款'}[price])+'】'+name+'　'+features.slice(0,2).join('　')+'\n';
out+='3. '+name+'，'+hooks[1]+'｜'+targetName+'首选\n';
out+='\n【详情页开头文案】\n';
out+=name+'，专为'+targetName+'设计。';
if(tone==='warm')out+='生活已经很忙了，好在有些事可以更简单一点。';
else if(tone==='hot')out+='上线以来好评不断，回头客都在推荐。';
else if(tone==='quality')out+='每一处细节都经过反复打磨，值得你长期使用。';
else out+='不做多余的功能，只把最常用的部分做到好用。';
out+='\n';
if(nums.length)out+='核心参数：'+nums.slice(0,6).join('、')+'。\n';
out+='\n【买家常见问题（建议做成详情页问答模块）】\n';
out+='Q：这个和便宜的那款有什么区别？\nA：主要差在'+features[0]+'，这也是最影响使用体验的地方。\n';
out+='Q：好不好清洗？\nA：'+ (features.filter(function(f){return /清洗|自清/.test(f);})[0] || '日常冲洗即可，不用拆洗复杂零件。') +'\n';
out+='Q：噪音大吗？\nA：'+ (features.filter(function(f){return /静音|分贝|噪/.test(f);})[0] || '日常使用噪音在可接受范围内，早上用不会打扰家人。') +'\n';
out+='Q：坏了怎么办？\nA：支持全国联保，收到货 7 天内可退换，客服在工作时间内会及时回复。\n';

out+='\n──── 五、合规提醒 ────\n';
out+='· 绝对化用语（最、第一、国家级、顶级）属于违法广告用语，请勿使用；\n';
out+='· 参数、认证、检测报告务必与实物一致，虚假宣传可被平台处罚；\n';
out+='· 功效性描述（如"降三高""美白祛斑"）需有对应资质，普通商品不要写；\n';
out+='· 销量、好评数等数据必须真实，编造数据属违规。\n';
out+='\n⚠️ 本工具生成的是文案框架，请结合商品实际情况修改后再发布。';
return out;
}
</script>
<script>
document.getElementById('genBtn').addEventListener('click',function(){
if(!Paywall.countUse('AI 商品详情页文案 | AgentGongju.com'))return;
var out=gen();
if(!out)return;
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(function(){alert('✅ 已复制！')})}
</script>
</body>
</html>
