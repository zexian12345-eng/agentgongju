<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 家庭家务分工方案生成器 | AgentGongju.com</title>
<meta name="description" content="AI家庭家务分工方案生成器，输入家庭成员与家务清单，自动生成公平可执行的分工表，减少家庭矛盾">
<meta name="keywords" content="家务分工,家庭分工表,家务安排,夫妻分工,生活规划">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:100px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.08);text-align:left}
th{color:#a5b4fc;font-weight:600;background:rgba(99,102,241,0.08)}
td{color:#cbd5e1}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem;margin-top:14px}
.tip{color:#94a3b8;font-size:.8rem;margin-top:8px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>
var _hmt = _hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";
  var s = document.getElementsByTagName("script")[0];
  s.parentNode.insertBefore(hm, s);
})();
</script>
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🧹 AI 家务分工方案</h1><p>把家务摆到明面上，比谁付出多更有效</p></div>

<div class="card">
<label>👨‍👩‍👧 家庭成员（每行一个，可标注特征）</label>
<textarea id="members" placeholder="例如：\n我（上班族，早出晚归）\n老公（经常加班）\n孩子（小学四年级）">我（上班族）
另一半（也上班）
孩子</textarea>
<label>📋 需要分配的家务（每行一项，可选）</label>
<textarea id="chores" placeholder="留空会用常见家务清单">做饭
洗碗
拖地扫地
洗衣服晾衣服
倒垃圾
买菜
卫生间清洁
接送孩子</textarea>
<div class="param-row">
<div><label>⚖️ 分配原则</label><select id="rule"><option value="按空闲时间">按空闲时间</option><option value="均衡平摊">完全均衡平摊</option><option value="各展所长">按擅长/喜好</option></select></div>
<div><label>🔄 周期</label><select id="cycle"><option value="daily">每日</option><option value="weekly" selected>每周</option></select></div>
</div>
<button class="btn-gen" id="genBtn">✨ 生成分工表</button>
<div class="tip">💡 分工关键是"谁负责"而不是"谁帮忙"。用轮换制可以避免长期怨气。</div>
</div>
<div class="result-area" id="resultArea"><div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 分工方案已生成</div>
<div style="overflow-x:auto"><table id="tbl"></table></div>
<div style="color:#94a3b8;font-size:.85rem;line-height:1.9;margin-top:14px" id="note"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制表格</button>
</div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
var DEF=['做饭','洗碗','拖地扫地','洗衣晾衣','倒垃圾','买菜','卫生间清洁','整理收纳','擦桌擦窗','宠物照顾'];
function copyResult(){
var t=document.getElementById('tbl').innerText+'\n\n'+document.getElementById('note').innerText.replace(/<[^>]+>/g,'');
navigator.clipboard.writeText(t).then(()=>alert('✅ 已复制！'))}
function gen(){
if(!Paywall.countUse('AI 家庭家务分工方案生成器 | AgentGongju.com'))return;
var ms=document.getElementById('members').value.split('\n').map(s=>s.trim()).filter(s=>s);
if(ms.length<2){alert('请至少输入 2 位家庭成员（每行一个）');return}
var cs=document.getElementById('chores').value.split('\n').map(s=>s.trim()).filter(s=>s);
if(!cs.length)cs=DEF.slice();
var rule=document.getElementById('rule').value,cycle=document.getElementById('cycle').value;
var names=ms.map(m=>m.replace(/[（(].*?[)）]/g,'').trim()||m);
if(rule==='各展所长'){
// assign by simple preference heuristics
var pref={'做饭':0,'洗碗':1,'拖地扫地':0,'洗衣晾衣':1,'倒垃圾':0,'买菜':0,'卫生间清洁':1,'整理收纳':1,'擦桌擦窗':0,'宠物照顾':1};
}
var tbl=document.getElementById('tbl');
var head='<tr><th>家务项目</th>'+names.map(n=>'<th>'+n+'</th>').join('')+'</tr>';
var rows='';
cs.forEach((c,ci)=>{
var cells=names.map((n,ni)=>{
var owner;
if(rule==='均衡平摊'){owner=(ci+0)%names.length===ni;}
else if(rule==='按空闲时间'){owner=(ni===0)?(ci%2===0):(ci%2===1);}
else{owner=(ci%names.length)===ni;}
return owner?'<td style="color:#22c55e;font-weight:600">✅ 负责</td>':'<td style="color:#475569">—</td>';
}).join('');
rows+='<tr><td>'+c+'</td>'+cells+'</tr>';
});
tbl.innerHTML=head+rows;
var counts=names.map((n,ni)=>{var n2=0;cs.forEach((c,ci)=>{var owner;if(rule==='均衡平摊')owner=(ci)%names.length===ni;else if(rule==='按空闲时间')owner=(ni===0)?(ci%2===0):(ci%2===1);else owner=(ci%names.length)===ni;if(owner)n2++;});return n+':'+n2+'项';}).join('｜');
document.getElementById('note').innerHTML='📌 分配原则：'+rule+'（'+(cycle==='daily'?'每日':'每周')+'执行）<br>📊 每人负荷：'+counts+'<br>💬 建议：每月复盘一次，可轮换项目；临时有事提前沟通替换，不秋后算账。<br>🎯 记住：家务是共同责任，不是"帮谁的忙"。';
document.getElementById('resultArea').classList.add('active');
}
document.getElementById('genBtn').addEventListener('click',gen);
</script>
</body>
</html>
