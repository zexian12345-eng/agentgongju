<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🔥 短视频爆款标题</h1><p>输入主题，一键批量生成吸睛标题，引爆点击率</p></div>

<div class="card"><label>🎯 视频主题</label>
<input type="text" id="topic" placeholder="例如：下班后自我提升、新手做饭、职场沟通技巧">
<div class="param-row">
<div><label>生成数量</label><input type="number" id="num" value="10" min="5" max="15"></div>
<div><label>目标平台</label><select id="platform"><option value="抖音">抖音</option><option value="小红书">小红书</option><option value="快手">快手</option><option value="视频号">视频号</option></select></div>
</div>
<button class="btn-gen" id="genBtn">🚀 生成爆款标题</button></div>

<div class="result-area" id="resultArea"><div class="card"><div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 已生成标题</div>
<div id="out"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制全部标题</button></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyResult(){let t='';document.querySelectorAll('.result-item p').forEach(p=>t+=p.textContent+'\n');navigator.clipboard.writeText(t.trim()).then(()=>alert('✅ 已复制！'))}
const TEMPLATES=[
  (t)=>'花了3个月才明白，'+t+'这件事真的会改变人生',
  (t)=>'别再焦虑了！'+t+'，方法其实很简单',
  (t)=>'90%的人都不知道的'+t+'秘诀',
  (t)=>'今天开始'+t+'，一个月后你会感谢自己',
  (t)=>'为什么劝你一定要学会'+t+'？原因太现实',
  (t)=>'月薪3千到3万，全靠'+t+'这个习惯',
  (t)=>'不看会后悔！'+t+'避坑指南来了',
  (t)=>'姐妹/兄弟都给我冲！'+t+'全面攻略',
  (t)=>'别人都在悄悄'+t+'，你还在观望吗',
  (t)=>'亲测有效！'+t+'踩过的坑都替你们避了',
  (t)=>'一招教你'+t+'，打工人必备',
  (t)=>'收藏！'+t+'从入门到精通全流程',
  (t)=>'为什么我劝你早点开始'+t+'，看完你就懂了',
  (t)=>'普通人如何靠'+t+'逆袭？这几点很关键',
  (t)=>'保姆级教程：'+t+'手把手教学'
];
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('短视频爆款标题 | AgentGongju.com'))return;
const topic=document.getElementById('topic').value.trim();if(!topic){alert('请输入视频主题');return}
const n=Math.min(15,Math.max(5,parseInt(document.getElementById('num').value)||10));
const platform=document.getElementById('platform').value;
const shuffled=TEMPLATES.slice().sort(()=>Math.random()-0.5).slice(0,n);
let html='';
shuffled.forEach((fn,i)=>{
  const em=platform==='小红书'?'去同款':'花1分钟学';
  let title=fn(topic);
  if(platform==='小红书')title=title.replace(/90%的人都不知道/,'人人都在问');
  html+='<div class="result-item"><h4>标题 '+(i+1)+'</h4><p>'+title+'</p></div>';
});
document.getElementById('resultArea').classList.add('active');
document.getElementById('out').innerHTML=html;
});
</script>
