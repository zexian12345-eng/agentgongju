<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 性格测试 | AgentGongju.com</title>

<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;min-height:60px;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.opt-box{margin-bottom:10px}
.opt-box label{display:block;padding:12px 16px;border:1px solid rgba(255,255,255,0.12);border-radius:10px;cursor:pointer;transition:all .2s;margin-bottom:8px}
.opt-box label:hover{border-color:#6366f1;background:rgba(99,102,241,0.08)}
.opt-box input{margin-right:10px}
</style>
<script>
var _hmt = _hmt || [];

  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";

</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🧩 AI 性格测试</h1><p>回答 4 个问题，测出你的隐藏性格标签</p></div>

<div class="card">
<label>🎮 1. 周末你更愿意？</label>
<div class="opt-box"><label><input type="radio" name="q1" value="E" checked> 和朋友聚会、外出热闹</label><label><input type="radio" name="q1" value="I"> 一个人宅家静静待着</label></div>
<label>🧠 2. 做决定时你更看重？</label>
<div class="opt-box"><label><input type="radio" name="q2" value="T" checked> 逻辑和客观事实</label><label><input type="radio" name="q2" value="F"> 感受和他人情绪</label></div>
<label>🗓 3. 面对新任务，你的第一反应？</label>
<div class="opt-box"><label><input type="radio" name="q3" value="J" checked> 先列计划、按部就班</label><label><input type="radio" name="q3" value="P"> 边做边调整、自由发挥</label></div>
<label>🔭 4. 你更关注？</label>
<div class="opt-box"><label><input type="radio" name="q4" value="N" checked> 未来的想象和可能性</label><label><input type="radio" name="q4" value="S"> 当下具体的细节事实</label></div>
<button class="btn-gen" id="genBtn">✨ 查看我的性格</button></div>
<div class="result-area" id="resultArea"><div class="card"><div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 测试结果</div><div class="result-box" id="out"></div><button class="copy-btn" onclick="copyResult()">📋 复制</button></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyResult(){navigator.clipboard.writeText(document.getElementById('out').textContent).then(()=>alert('✅ 已复制！'))}
const types={'E':'外向活跃型','I':'内向沉静型','T':'理性逻辑型','F':'感性共情型','J':'规划掌控型','P':'随性灵活型','N':'理想远见型','S':'务实细节型'};
const combos={
'ENFJ':'天生领导者：热情会感染人，愿意带动大家往前走。',
'INFP':'温柔理想家：内心丰富，温柔且坚定。',
'ESTJ':'执行管理者：条理清晰，说一不二。',
'ISTP':'冷静探索家：动手能力强，遇事沉着。',
'ENTJ':'强势战略家：目标感强，天生做大事。',
'ISFJ':'温暖守护者：细心靠谱，让人安心。',
'ENFP':'元气冒险家：点子多、热情满，走到哪都热闹。',
'INTJ':'深邃谋略家：独立思考，表面平静内心有宇宙。'};
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 性格测试 | AgentGongju.com'))return;
const v=q=>document.querySelector('input[name="'+q+'"]:checked').value;
const a=v('q1')+v('q2')+v('q3')+v('q4');
let desc=combos[a];
if(!desc){const t1=types[v('q1')],t2=types[v('q2')],t3=types[v('q3')],t4=types[v('q4')];desc='你的组合是'+t1+' × '+t2+' × '+t3+' × '+t4+'，性格多元灵动，很难被单一标签定义！';}
let out='🧩 你的性格类型：【'+a+'】\n\n'+desc+'\n\n🔎 维度解读：\n• 能量来源：'+types[v('q1')]+'\n• 决策方式：'+types[v('q2')]+'\n• 做事节奏：'+types[v('q3')]+'\n• 关注焦点：'+types[v('q4')]+'\n\n（本测试仅为趣味参考，别太认真，开心最重要～）';
document.getElementById('resultArea').classList.add('active');
document.getElementById('out').textContent=out;
});
</script>
</body>
</html>
