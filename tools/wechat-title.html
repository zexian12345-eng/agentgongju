<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微信公众号爆款标题 | AgentGongju.com</title>
<meta name="description" content="AI公众号标题生成器，一键生成吸睛、高点击率的爆款文章标题">
<meta name="keywords" content="公众号标题,爆款标题,微信文章,标题生成">
<link rel="stylesheet" href="../css/style.css">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.8;white-space:pre-wrap;min-height:60px;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>📱 公众号爆款标题</h1><p>输入内容主题，一键生成吸睛、高点击率的文章标题</p></div>

<div class="card"><label>✍️ 文章主题（一句话说明想写什么）</label>
<textarea id="topic" placeholder="例如：如何在一周内养成早睡早起的好习惯"></textarea>
<div class="param-row">
<div><label>文章类型</label><select id="type"><option>干货教程</option><option>情感共鸣</option><option>热点资讯</option><option>种草推荐</option><option>观点评论</option><option>故事分享</option></select></div>
<div><label>标题风格</label><select id="style"><option>数字型</option><option>提问型</option><option>悬念型</option><option>干货型</option><option>情绪型</option></select></div></div>
<button class="btn-gen" id="genBtn">🚀 生成爆款标题</button></div>
<div class="result-area" id="resultArea"><div class="card"><div style="color:#22c55e;font-weight:600;margin-bottom:12px">🔥 为你生成的标题（点击📋可复制全部）</div><div class="result-box" id="out"></div><button class="copy-btn" onclick="copyResult()">📋 复制</button></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyResult(){navigator.clipboard.writeText(document.getElementById('out').textContent).then(()=>alert('✅ 已复制！'))}
const tpl={
'数字型':['{n}个{kw}技巧，第{m}个最重要','{n}分钟学会{kw}，亲测有效','{n}年经验的{kw}老手，教你避坑','{kw}的{n}个真相，最后一个扎心了','普通人也能{kw}的{n}个方法'],
'提问型':['为什么{kw}这么难？答案出乎意料','你还在为{kw}发愁吗？','{kw}，真的有必要吗？','做到这几点，{kw}还难吗？','{kw}的正确姿势，你掌握了吗？'],
'悬念型':['没人告诉你的{kw}秘密','关于{kw}，90%的人都做错了','{kw}背后，藏着这样一个真相','原来{kw}还可以这样玩','{kw}这件事，远比你想象的简单'],
'干货型':['{kw}完整指南：从入门到精通','{kw}实操手册，收藏这一篇就够了','手把手教你{kw}，零基础也能上手','{kw}保姆级教程，建议反复阅读','{kw}避坑清单，小白必看'],
'情绪型':['看完这篇{kw}，我彻底清醒了','{kw}让我重新找回了自己','深夜聊聊{kw}，句句说到心坎','{kw}教会我的{n}件事','如果早点懂{kw}，就不会走这么多弯路']};
document.getElementById('genBtn').addEventListener('click',()=>{
const topic=document.getElementById('topic').value.trim();const type=document.getElementById('type').value;const style=document.getElementById('style').value;
if(!topic){alert('请先输入文章主题～');return;}
const pools=tpl[style]||tpl['干货型'];const n=[5,7,8,9,10][Math.floor(Math.random()*5)];const m=[1,2,3,4][Math.floor(Math.random()*4)];
const kw=topic.length>12?topic.slice(0,12)+'…':topic;
let titles=[];
pools.forEach((t,i)=>{let s=t.replace('{kw}',kw).replace('{n}',n).replace('{m}',m);titles.push(s);});
let out='【'+type+' · '+style+' 标题】\n\n';
titles.forEach((t,i)=>{out+=(i+1)+'. '+t+'\n';});
out+='\n💡 小贴士：标题前加数字、制造反差、带情绪词能显著提升点击率。';
document.getElementById('resultArea').classList.add('active');
document.getElementById('out').textContent=out;
});
</script>
</body>
</html>
