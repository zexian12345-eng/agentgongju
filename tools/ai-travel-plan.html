<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 旅行行程规划 | AgentGongju.com</title>
<meta name="description" content="输入目的地、天数、预算和偏好，自动生成逐日行程安排，含景点顺序、交通方式、餐饮建议与人均花费估算。">
<meta name="keywords" content="旅行规划,行程安排,旅游攻略,自由行,出行计划,景点路线,预算估算">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
input:focus,select:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;margin-bottom:12px;font-size:.92rem}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>
var _hmt = _hmt || [];
(function() { var hm = document.createElement("script"); hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949"; var s = document.getElementsByTagName("script")[0]; s.parentNode.insertBefore(hm, s); })();
</script>
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🧳 AI 旅行行程规划</h1><p>填几个参数，拿到一份能直接照着走的行程</p></div>

<div class="card">
<div class="param-row">
<div><label>📍 目的地</label><input type="text" id="dest" placeholder="例如：成都 / 日本关西"></div>
<div><label>📅 出行天数</label><input type="number" id="days" value="3" min="1" max="15"></div>
</div>
<div class="param-row">
<div><label>💰 人均预算</label>
<select id="budget">
<option value="low">经济型（3千以内）</option>
<option value="mid" selected>舒适型（3千-8千）</option>
<option value="high">品质型（8千以上）</option>
</select></div>
<div><label>🚶 出行节奏</label>
<select id="pace">
<option value="relax">慢节奏，一天 2 个点</option>
<option value="normal" selected>适中，一天 3 个点</option>
<option value="tight">紧凑，尽量多看</option>
</select></div>
</div>
<div class="param-row">
<div><label>👥 同行人员</label>
<select id="who">
<option value="solo">一个人</option>
<option value="couple" selected>情侣 / 朋友</option>
<option value="family">带长辈小孩</option>
</select></div>
<div><label>❤️ 偏好主题</label>
<select id="theme">
<option value="food">美食为主</option>
<option value="culture" selected>人文历史</option>
<option value="nature">自然风光</option>
<option value="photo">拍照打卡</option>
<option value="shopping">购物休闲</option>
</select></div>
</div>
<label>✏️ 特别想去 / 想避开的（选填）</label>
<input type="text" id="extra" placeholder="例如：想去大熊猫基地，不想爬山">
<button class="btn-gen" id="genBtn">🗺️ 生成我的行程</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制行程</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
var PACE_NUM={relax:2,normal:3,tight:4};
var THEME_SLOT={
food:['当地人气早市 / 老字号早点','午餐：本地特色正餐','下午茶 / 甜品铺','晚餐：本地菜馆','夜市 / 小吃街'],
culture:['博物馆 / 历史展馆','古城老街漫步','名人故居 / 寺庙','地方戏剧或非遗体验','夜景灯光带'],
nature:['城市公园 / 湖边晨走','近郊山景 / 森林公园','观景平台 / 江边步道','植物园 / 湿地','日落观景点'],
photo:['地标建筑机位','网红街拍街区','高处俯瞰全景','文艺小店 / 咖啡馆','夜景灯光机位'],
shopping:['核心商圈逛街','本地特产市场','设计师 / 买手小店','免税店或奥特莱斯','特色书店＋咖啡馆']
};
function gen(){
var dest=document.getElementById('dest').value.trim()||'目的地';
var days=Math.max(1,Math.min(15,+document.getElementById('days').value||3));
var budget=document.getElementById('budget').value;
var pace=document.getElementById('pace').value;
var who=document.getElementById('who').value;
var theme=document.getElementById('theme').value;
var extra=document.getElementById('extra').value.trim();
var n=PACE_NUM[pace];
var slots=THEME_SLOT[theme];
var cost=budget==='low'?'约 300-500 元/人/天':budget==='mid'?'约 600-1000 元/人/天':'约 1200-2500 元/人/天';
var out='════ 行程总览 ════\n';
out+='目的地：'+dest+'　|　天数：'+days+' 天　|　节奏：'+({relax:'慢节奏',normal:'适中',tight:'紧凑'}[pace])+'\n';
out+='同行：'+({solo:'一个人',couple:'情侣/朋友',family:'带长辈小孩'}[who])+'　|　主题：'+({food:'美食',culture:'人文历史',nature:'自然风光',photo:'拍照打卡',shopping:'购物休闲'}[theme])+'\n';
out+='预估花费：'+cost+'（不含往返大交通）\n';
if(extra)out+='特别说明：'+extra+'\n';
out+='\n温馨提示：以下为骨架行程，景点名请以当天实际开放情况为准，出发前用地图 App 核对路线与营业时间。\n';

for(var d=1;d<=days;d++){
out+='\n════ 第 '+d+' 天 ════\n';
if(d===1){
out+='上午：抵达后先到住处放行李，就近逛逛适应环境，别安排远距离景点。\n';
out+='午餐：住处附近找本地人多的馆子，第一顿以清淡易消化为主。\n';
}else if(d===days){
out+='上午：'+(slots[0])+'（把最想去但还没去的补上）\n';
out+='中午：午餐后回住处取行李 / 办理退房。\n';
out+='下午：'+(slots[1])+'，预留 2 小时机动时间赶车 / 赶飞机。\n';
out+='晚餐：就近解决，避免赶时间吃坏肚子。\n';
out+='晚上：返程，回程路上把照片和票据整理一下。\n';
continue;
}
for(var i=0;i<n;i++){
var time=i===0?'上午':i===1?'中午/下午':'傍晚';
out+=time+'：'+(slots[i%slots.length])+'\n';
if(i<n-1)out+='　→ 交通建议：地铁 / 公交优先，打车备用，两点之间预留 40 分钟。\n';
}
if(d===Math.ceil(days/2))out+='晚上：安排一次放松项目（泡温泉、看演出、逛夜市），给后半程留体力。\n';
else out+='晚上：'+slots[slots.length-1]+'（吃饱后散步回住处）。\n';
if(who==='family')out+='👨‍👩‍👧 带娃/带长辈提示：每半天安排一次坐下休息，景点间优先打车，带好常用药与零食。\n';
if(who==='solo')out+='🎒 独自出行提示：白天行程照常，晚上尽量走人多的大路，贵重物品分开放。\n';
}

out+='\n════ 打包与出行清单 ════\n';
out+='□ 证件：身份证、学生证（有优惠）、护照/签注（出境）\n';
out+='□ 电子：充电宝、充电线、转换插头、耳机\n';
out+='□ 药品：退烧药、肠胃药、创可贴、晕车药\n';
out+='□ 衣物：按天气预报准备，带一件外套应对早晚温差\n';
out+='□ 其他：雨伞、保温杯、小包湿巾、少量现金\n';
out+='\n════ 省钱小技巧 ════\n';
out+='· 门票提前 1 天在官方渠道买，常有早鸟价，还能免排队；\n';
out+='· 住在地铁沿线而非景点旁，房价能便宜 30% 以上；\n';
out+='· 午餐吃正餐、晚餐吃小吃，一天餐费能省下不少；\n';
out+='· 多人同行打车往往比每人买地铁票还便宜，短途别硬挤公交。\n';
return out;
}
</script>
<script>
document.getElementById('genBtn').addEventListener('click',function(){
if(!Paywall.countUse('AI 旅行行程规划 | AgentGongju.com'))return;
document.getElementById('outputBox').innerText=gen();
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(function(){alert('✅ 已复制！')})}
</script>
</body>
</html>
