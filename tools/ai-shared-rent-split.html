<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 租房水电费分摊计算器 | AgentGongju.com</title>
<meta name="description" content="AI合租水电费分摊计算器，按房间面积、入住天数、空调使用强度自动算清每个人该交多少，附催款话术">
<meta name="keywords" content="合租分摊,水电费计算,室友分账,合租算账,房租水电">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,input[type=text],textarea{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
select:focus,input:focus,textarea:focus{border-color:#6366f1}
textarea{min-height:100px;resize:vertical;line-height:1.8}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.btn-sm{padding:8px 16px;background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.82rem;margin:0 8px 12px 0}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.rec{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.25);border-radius:12px;padding:16px;margin-bottom:12px}
.rec-h{font-size:1.05rem;color:#a5b4fc;font-weight:700;margin-bottom:8px}
.rec-b{color:#cbd5e1;font-size:.88rem;line-height:1.9}
table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:6px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid rgba(255,255,255,.07);color:#cbd5e1}
th{color:#a5b4fc;font-weight:600}
.room-row{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:12px;margin-bottom:10px}
.room-row .rr-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:8px}
.room-row input,.room-row select{margin-bottom:0;font-size:.83rem;padding:9px 12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem;margin-top:12px}
.tip{color:#94a3b8;font-size:.8rem;margin-top:8px;line-height:1.7}
@media(max-width:600px){.param-row{grid-template-columns:1fr}.room-row .rr-grid{grid-template-columns:1fr 1fr}}
</style>
<script>
var _hmt = _hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";

<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🧾 AI 合租水电费分摊计算器</h1><p>谁住几天、谁空调开得猛，一算就清楚，还附催款话术</p></div>

<div class="card">
<div class="param-row">
<div><label>💧 本期水费（元）</label><input type="text" id="water" value="86"></div>
<div><label>⚡ 本期电费（元）</label><input type="text" id="power" value="420"></div>
</div>
<div class="param-row">
<div><label>🔥 燃气费（元）</label><input type="text" id="gas" value="60"></div>
<div><label>🌐 宽带/物业等杂费（元）</label><input type="text" id="other" value="80"></div>
</div>
<label>🏠 分摊方式</label>
<select id="mode">
<option value="area" selected>按房间面积 + 入住天数加权（最公平，推荐）</option>
<option value="days">只按入住天数平均</option>
<option value="even">完全平均分</option>
</select>
<label>👥 室友信息</label>
<div id="rooms"></div>
<button class="btn-sm" onclick="addRoom()">＋ 添加室友</button>
<button class="btn-gen" id="genBtn">🧮 开始算账</button>
<div class="tip">💡 空调/取暖费建议单独按使用情况分摊，本工具用「耗电系数」加权处理。数据只在本地计算，不上传。</div>
</div>
<div class="result-area" id="resultArea"><div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 分摊结果</div>
<div id="out"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制结果</button>
</div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyResult(){navigator.clipboard.writeText(document.getElementById('out').innerText).then(function(){alert('✅ 已复制！')})}

var roomSeq=0;
function addRoom(name,area,days,factor){
 roomSeq++;
 var d=document.createElement('div');d.className='room-row';
 d.innerHTML='<div class="rr-grid">'+
  '<input type="text" class="r-name" placeholder="姓名/房间" value="'+(name||('室友'+roomSeq))+'">'+
  '<input type="text" class="r-area" placeholder="面积(㎡)" value="'+(area||12)+'">'+
  '<input type="text" class="r-days" placeholder="住几天" value="'+(days||30)+'">'+
  '<select class="r-factor"><option value="1"'+(factor===1?' selected':'')+'>用电正常 ×1</option><option value="1.3"'+(factor===1.3?' selected':'')+'>常开空调 ×1.3</option><option value="1.6"'+(factor===1.6?' selected':'')+'>全天开空调 ×1.6</option><option value="0.7"'+(factor===0.7?' selected':'')+'>常年不在 ×0.7</option></select>'+
 '</div>';
 document.getElementById('rooms').appendChild(d);
}
function readRooms(){
 var out=[];
 document.querySelectorAll('#rooms .room-row').forEach(function(r){
   var n=r.querySelector('.r-name').value.trim()||'室友';
   var a=parseFloat(r.querySelector('.r-area').value)||10;
   var d=parseFloat(r.querySelector('.r-days').value)||30;
   var f=parseFloat(r.querySelector('.r-factor').value)||1;
   out.push({name:n,area:a,days:d,factor:f});
 });
 return out;
}
function gen(){
 if(!Paywall.countUse('AI 租房水电费分摊计算器 | AgentGongju.com'))return;
 var water=parseFloat(document.getElementById('water').value)||0;
 var power=parseFloat(document.getElementById('power').value)||0;
 var gas=parseFloat(document.getElementById('gas').value)||0;
 var other=parseFloat(document.getElementById('other').value)||0;
 var mode=document.getElementById('mode').value;
 var rooms=readRooms();
 if(rooms.length<1){alert('至少添加一位室友～');return;}
 var total=water+power+gas+other;

 // 权重
 rooms.forEach(function(r){
   if(mode==='even')r.w=1;
   else if(mode==='days')r.w=r.days;
   else r.w=Math.max(r.area,1)*Math.max(r.days,1)*r.factor;
 });
 var sumW=rooms.reduce(function(s,r){return s+r.w},0);

 var out=document.getElementById('out');out.innerHTML='';
 out.innerHTML='<div style="color:#94a3b8;font-size:.85rem;margin-bottom:14px">💰 本期总费用 <b style="color:#a5b4fc">'+total.toFixed(2)+' 元</b>（水 '+water+' ｜ 电 '+power+' ｜ 燃气 '+gas+' ｜ 杂费 '+other+'）｜ 分摊方式：'+document.getElementById('mode').selectedOptions[0].text+'</div>';

 var rows='<table><tr><th>室友</th><th>权重</th><th>占比</th><th>应缴</th></tr>';
 rooms.forEach(function(r){
   var pct=r.w/sumW, pay=total*pct;
   r.pay=pay;
   rows+='<tr><td>'+r.name+'</td><td>'+r.w.toFixed(1)+'</td><td>'+(pct*100).toFixed(1)+'%</td><td style="color:#22c55e;font-weight:700">¥'+pay.toFixed(2)+'</td></tr>';
 });
 rows+='<tr><td style="color:#a5b4fc;font-weight:700">合计</td><td>-</td><td>100%</td><td style="color:#a5b4fc;font-weight:700">¥'+total.toFixed(2)+'</td></tr></table>';
 out.insertAdjacentHTML('beforeend','<div class="rec"><div class="rec-h">📊 分摊明细</div><div class="rec-b">'+rows+'</div></div>');

 // 电费单独拆（因为电费最容易吵）
 var powerPer=power/sumW;
 var elec=rooms.map(function(r){return r.name+' ¥'+(powerPer*r.w).toFixed(2)}).join(' ｜ ');
 out.insertAdjacentHTML('beforeend','<div class="rec"><div class="rec-h">⚡ 只看电费（最容易有争议的一项）</div><div class="rec-b">'+elec+'<br><span style="color:#94a3b8">空调是电费大头。谁的用电系数高，谁就应该多担，这个逻辑当面说清楚比事后争更省事。</span></div></div>');

 // 取整建议
 var rounded=rooms.map(function(r){
   var up=Math.ceil(r.pay);
   return {name:r.name,pay:r.pay,up:up,diff:(up-r.pay).toFixed(2)};
 });
 var sumUp=rounded.reduce(function(s,r){return s+r.up},0);
 out.insertAdjacentHTML('beforeend','<div class="rec" style="border-color:rgba(34,197,94,.3)"><div class="rec-h">💵 收款建议（向上取整，多出的进公账）</div><div class="rec-b">'+
  rounded.map(function(r){return r.name+' 收 <b>¥'+r.up+'</b>（精确 ¥'+r.pay.toFixed(2)+'，多收 ¥'+r.diff+'）';}).join('<br>')+
  '<br><span style="color:#94a3b8">合计收到 ¥'+sumUp.toFixed(2)+'，比应交多 ¥'+(sumUp-total).toFixed(2)+'，可以留作下次公摊或买公共用品。</span></div></div>');

 out.insertAdjacentHTML('beforeend','<div class="rec"><div class="rec-h">💬 催款话术（直接复制发群里）</div><div class="rec-b">'+
  '【'+new Date().getFullYear()+'年'+(new Date().getMonth()+1)+'月水电分摊】<br>'+
  '本期水费 '+water+' 元、电费 '+power+' 元、燃气 '+gas+' 元、杂费 '+other+' 元，合计 <b>'+total.toFixed(2)+' 元</b>。<br>'+
  rounded.map(function(r){return r.name+' ¥'+r.up;}).join('，')+'。<br>'+
  '分摊依据：按房间面积×入住天数×用电系数加权，明细在上方表格，有疑问随时说，24 小时内确认即可～ 麻烦转我微信，谢谢配合 🙏</div></div>');

 out.insertAdjacentHTML('beforeend','<div class="rec" style="border-color:rgba(245,158,11,.3)"><div class="rec-h">🤝 合租不吵架的三条约定</div><div class="rec-b">1. 固定每月 1 号出账，账单截图一起发群里，透明比客气更重要<br>2. 空调/取暖这类高耗电项，提前约定好系数而不是事后扯皮<br>3. 给公共账留 50-100 元余额，避免为了几块钱反复转账</div></div>');

 document.getElementById('resultArea').classList.add('active');
 document.getElementById('resultArea').scrollIntoView({behavior:'smooth'});
}
addRoom('我',15,30,1.3);addRoom('室友A',12,30,1);addRoom('室友B',10,20,1);
document.getElementById('genBtn').addEventListener('click',gen);
</script>
</body>
</html>
