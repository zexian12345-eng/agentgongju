<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>减脂增肌食谱生成器 | AgentGongju.com</title>
<meta name="description" content="减脂增肌食谱生成器，根据目标、运动量和口味定制一天三餐的健康食谱，附热量估算与营养搭配建议">
<meta name="keywords" content="减脂食谱,增肌餐,健身餐,健康饮食,减脂餐,营养搭配,轻食">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.8;white-space:pre-wrap;margin-bottom:12px;font-size:.92rem}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.tip{color:#94a3b8;font-size:.8rem;line-height:1.8;margin-top:6px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🥗 减脂增肌食谱生成器</h1><p>吃得健康，也吃得开心</p></div>

<div class="card">
<div class="param-row">
<div><label>🎯 你的目标</label>
<select id="goal">
<option value="减脂">减脂塑形</option>
<option value="增肌">增肌增重</option>
<option value="保持">保持体形</option>
</select></div>
<div><label>🚴 运动量</label>
<select id="act">
<option value="少">久坐少动</option>
<option value="中">每周2-3次运动</option>
<option value="多">每周4次以上</option>
</select></div>
</div>
<div class="param-row">
<div><label>🥢 口味偏好</label>
<select id="taste">
<option value="清淡">清淡健康</option>
<option value="咸鲜">咸鲜中式</option>
<option value="无辣不欢">无辣不欢</option>
<option value="西式">西式轻食</option>
</select></div>
<div><label>🙋 是否素食</label>
<select id="veg">
<option value="no">正常（含肉）</option>
<option value="yes">素食</option>
</select></div>
</div>
<label>🍱 忌口/偏好（可选）</label>
<input type="text" id="note" placeholder="例如：不吃香菜、不吃海鲜、乳糖不耐受">
<button class="btn-gen" id="genBtn">🍳 生成食谱</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">🍽️ 你的一天食谱</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制食谱</button>
<div class="tip">⚠️ 提示：热量为估算值，个体差异大，仅供参考。有基础疾病请遵医嘱。</div>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const BREAKFAST={
'清淡':['燕麦牛奶粥 + 水煮蛋 + 水果','全麦面包 + 无糖酸奶 + 香蕉'],
'咸鲜':['杂粮粥 + 茶叶蛋 + 凉拌小菜','豆腐脑 + 玉米 + 少量坚果'],
'无辣不欢':['小米粥 + 卤蛋 + 凉拌木耳','燕麦 + 煎蛋 + 少量辣白菜'],
'西式':['奇亚籽酸奶碗 + 全麦吐司','燕麦碗 + 煎蛋 + 牛油果']};
const LUNCH={
'清淡':['鸡胸肉沙拉 + 糙米饭','清蒸鱼 + 西兰花 + 杂粮饭'],
'咸鲜':['卤牛肉 + 时蔬 + 米饭','番茄炖牛腩 + 青菜 + 杂粮'],
'无辣不欢':['香辣鸡胸 + 时蔬 + 糙米','麻婆豆腐 + 少量米饭 + 青菜'],
'西式':['三文鱼配芦笋 + 藜麦','鸡胸藜麦碗 + 蔬菜']};
const DINNER={
'清淡':['虾仁豆腐汤 + 水煮菜','清炒时蔬 + 玉米 + 蛋'],
'咸鲜':['冬瓜排骨汤 + 清炒菜心','番茄鸡蛋 + 蒸红薯'],
'无辣不欢':['酸辣汤 + 口蘑炒鸡','水煮鱼片(少油) + 蔬菜'],
'西式':['牛油果沙拉 + 烤鸡胸','烤蔬 + 全麦意面']};
function pick(a){return a[Math.floor(Math.random()*a.length)];}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('减脂增肌食谱生成器 | AgentGongju.com'))return;
const goal=document.getElementById('goal').value;
const act=document.getElementById('act').value;
const taste=document.getElementById('taste').value;
const veg=document.getElementById('veg').value;
const note=document.getElementById('note').value.trim();
const calorie={
'减脂':['少',1500,'中',1700,'多',1900],
'增肌':['少',2200,'中',2500,'多',2800],
'保持':['少',1800,'中',2000,'多',2200]};
const c=calorie[goal];
const kcal=c[c.indexOf(act)+1]||c[3];
const b=pick(BREAKFAST[taste]);
const l=pick(LUNCH[taste]);
const d=pick(DINNER[taste]);
const protein=goal==='增肌'?'高蛋白':(goal==='减脂'?'适量优质蛋白':'均衡蛋白');
const out=`【${goal} · ${act} · ${taste}】一日食谱 (素${veg==='yes'?'食':''})
目标热量：约 ${kcal} 千卡/天　·　核心原则：${protein} + 足量蔬菜 + 控制精制碳水

————— 早餐（约 ${Math.round(kcal*0.3)} 千卡）—————
${b}
🥚 蛋白质 + 🥣 优质碳水 + 🍎 维生素，启动元气一天。

————— 午餐（约 ${Math.round(kcal*0.4)} 千卡）—————
${l}
🥩 主菜 + 🥦 时蔬 + 🍚 主食，吃饱吃好，下午才有力气。

————— 晚餐（约 ${Math.round(kcal*0.3)} 千卡）—————
${d}
🥗 清淡为主，七分饱，给身体留出消化与恢复时间。

————— 加餐建议 —————
${goal==='增肌'?'训练后：蛋白粉/酸奶 + 一根香蕉，补充能量与肌肉修复营养。':(goal==='减脂'?'下午：一小把坚果或一个苹果，避免正餐暴食。':'下午：无糖酸奶或一个水果，保持血糖稳定。')}

————— 饮水与作息 —————
每天 1.5-2L 水，${goal==='增肌'?'保证 7-8 小时睡眠，利于肌肉合成。':'保证 7-8 小时睡眠，减轻水肿、提升代谢。'}${veg==='yes'?'素食建议额外补充豆制品与铁、B12。':''}${note?'\n忌口提示：「'+note+'」，已尽量避开相关食材。':''}`;
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 食谱已复制！'))}
</script>
</body>
</html>
