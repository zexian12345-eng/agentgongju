<script>
function getCurrentType(){return document.getElementById('type').value}
function hook(t){
const type=getCurrentType();
const getter={
'带货':`（开场钩子）你有没有遇到过……明明想专心，却被噪音搅得心神不宁？今天必须把这款【${t}】分享给你。\n（痛点）市面上产品虽多，但真正好用的没几个，踩过太多坑的都知道。\n（卖点+价值）这款有三个亮点：第一，性能扎实；第二，性价比超高；第三，售后省心。真心推荐，错过真的会后悔！\n（行动号召）还不赶紧左下角安排上？手慢无，链接放这了！`,
'知识':`（开场钩子）关于【${t}】，90%的人都理解错了，今天花一分钟讲明白。\n（展开）其实它的原理并不复杂，我用最简单的例子给你讲清楚：就像你平时……\n（升华）所以以后再遇到相关的问题，你就能举一反三了。\n（收尾）觉得有用记得点赞收藏，下期讲更硬核的！`,
'情感':`（开场）你有没有一段藏在心里、不敢说出口的话？关于【${t}】我想说……\n（共鸣场景）夜深人静的时候，我们总会想起那些遗憾和不甘。\n（治愈转向）但请相信，时间会带走伤痛，也会把合适的人带到你身边。\n（收尾）愿你被世界温柔以待，我也是。点个关注，我们互相取暖。`,
'励志':`（开场）你凭什么轻易放弃？关于【${t}】，我想对还在坚持的你致敬。\n（转折）成功的路上从不拥挤，因为坚持下来的人并不多。\n（激励）你现在的每一份努力，都会在未来某个时刻发光。\n（收尾）别让今天的懈怠，变成明日的遗憾。一起加油，评论区聊聊你的坚持！`,
'日常':`（开场）家人们，今天跟大家聊聊【${t}】。\n（日常场景）今天一出门就遇到了……这种小事真的能治愈一整天。\n（感悟）其实快乐很简单，就藏在生活的细节里。\n（收尾）喜欢这种轻松日常的，记得关注我，每天分享一点小确幸！`};
return getter[type];

document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 口播脚本生成 | AgentGongju.com'))return;
const t=document.getElementById('topic').value.trim()||'这个话题';
