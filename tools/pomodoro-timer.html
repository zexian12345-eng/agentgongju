<script>

function update(){const m=Math.floor(remaining/60),s=remaining%60;document.getElementById('display').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
let timer=null;let remaining=25*60;let running=false;
document.getElementById('workLen').addEventListener('change',()=>{if(!running){remaining=parseInt(document.getElementById('workLen').value)*60;update()}});
document.getElementById('startBtn').addEventListener('click',()=>{
