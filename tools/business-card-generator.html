<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI商务名片文案生成器 | AgentGongju.com</title>
<meta name="description" content="输入职业与业务名片亮点，一键生成专业有记忆点的商务名片文案，含头衔、slogan、服务亮点，助力商务社交。">
<meta name="keywords" content="名片,商务,头衔,slogan,品牌,简介,社交,人脉">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
textarea,input[type=text],select{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.9;white-space:pre-wrap;font-size:.92rem;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.badge{display:inline-block;background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.3);color:#d8b4fe;border-radius:6px;padding:1px 8px;font-size:.75rem;margin-left:6px}
@media(max-width:600px){.param-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>💼 AI商务名片文案生成器</h1><p>一张名片一句话，让人快速记住你</p></div>

<div class="card">
<label>👤 你的职业/身份</label>
<input type="text" id="job" placeholder="例如：独立室内设计师">
<label>✨ 你的核心卖点（服务/产品/能力）</label>
<textarea id="selling" placeholder="例如：专注北欧风与日系原木风住宅设计，提供全案落地服务"></textarea>
<div class="param-grid">
<div><label>🎯 名片定位</label>
<select id="tone"><option>专业实力型</option><option>亲和友好型</option><option>高端大气型</option><option>创意个性型</option></select></div>
<div><label>📱 使用场景</label>
<select id="scene"><option>通用商务</option><option>创业老板</option><option>自由职业</option><option>企业高管</option></select></div>
</div>
<button class="btn-gen" id="genBtn">✨ 生成名片文案</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">💼 你的名片文案方案</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制文案</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const toneSlogan={
'专业实力型':['专业专注，值得托付','以实力说话，用结果证明'],
'亲和友好型':['用心服务，真诚相伴','有温度的服务，交心的伙伴'],
'高端大气型':['臻于至善，境无止境','匠心之作，气度非凡'],
'创意个性型':['不设限，才有趣','把想法做成现实']
};
const sceneNote={
'通用商务':'连接价值，共创未来',
'创业老板':'以创新驱动价值，与伙伴共赢未来',
'自由职业':'灵活高效，专才精作',
'企业高管':'战略视野，躬身笃行'
};
function pick(tone){return toneSlogan[tone][Math.floor(Math.random()*toneSlogan[tone].length)];}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI商务名片文案生成器 | AgentGongju.com'))return;
const job=document.getElementById('job').value.trim();
const selling=document.getElementById('selling').value.trim();
if(!job){alert('请先填写你的职业身份');return;}
const tone=document.getElementById('tone').value;
const scene=document.getElementById('scene').value;
const slogan=pick(tone);
const sellText=selling?selling:'专注于'+job+'领域的优质服务，用心满足每位客户需求。';
const out='【名片主信息】\n姓名：__________\n职业：'+job+'\n\n【名片Slogan】\n'+slogan+'\n\n【服务/能力亮点】\n· '+sellText+'\n· 品质有保障，沟通更高效\n· 欢迎随时交流合作\n\n【场景定位】\n'+sceneNote[scene]+'\n\n【自带流量的一句话（可选）】\n"'+job+'，'+slogan+'。交个朋友，有事您说话。"';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 名片文案已复制！'))}
</script>
</body>
</html>
