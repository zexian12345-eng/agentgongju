<script>
function pick(a){return a[Math.floor(Math.random()*a.length)];}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('直播开播前准备清单助手 | AgentGongju.com'))return;
const type=document.getElementById('type').value;
const topic=document.getElementById('topic').value.trim();
const scale=document.getElementById('scale').value;
const slot=document.getElementById('slot').value;
const pain=document.getElementById('pain').value.trim();
const small=scale.indexOf('刚起步')>-1;
let r='📡 直播检查表 · '+(topic||type==='带货/卖货'?'本场主推待定品':type)+'\n';
r+='类型：'+type+'｜时段偏好：'+slot+'｜场次：'+scale+'\n';
r+=(pain?'历史痛点提醒：'+pain+'\n':'');
r+='\n──────── 🕐 T-90分钟：设备与布景 ────────\n';
r+='□ 相机/手机电量满、存储清空；支架角度摆好（以自己坐姿为中心）\n□ 灯光三层：主光不刺眼、补光不晃屏、轮廓光让你的脸立体\n□ 连一次麦：网络延迟与回声测试OK，备用热点/备用机随时切\n□ 背景干净吸睛，试播录15秒看音画与构图\n□ 大场面字幕/提示板贴到位（价格、话术、关键词、本场节奏表）\n';
if(small)r+='□ (小场)提前发预告+剪2条预热短视频，为冷启动攒热度。\n';
r+='\n──────── 🕐 T-60分钟：货品与内容弹药 ────────\n';
r+=type==='带货/卖货'?'□ 全场品按顺序放旁边，每品的卖点/价格/库存/福利页在手边\n□ 起草并确认：开场钩子话术、每个品的1句"非买不可"理由、压轴话术\n□ 提前写好FAQ(尺寸、包邮、售后、退换)并放一个可查文档\n':'□ 主题大纲与关键知识点/流程写成一页提词，避免讲歪\n□ 准备3-5个互动问题与1-2个讲得意的小故事兜底冷场\n';
r+='□ 自查轻违禁：不承诺"绝对/第一/百分百/央视认证"等极端词；不留联系方式硬广(以平台规则为准)\n□ 定好本场的"黄金钩子"开场：'+(type==='带货/卖货'?'前5分钟快讲福利+互动扣1，别急着卖货':'先抛"今天一定帮大家解决XX"的一个提问，留住第一波流量')+'\n';
r+='\n──────── 🕐 T-15分钟：模拟彩排 ────────\n';
r+='□ 顺一遍开场白到第一个互动；把价格/数字大声念三遍（防口误）\n□ 播报镜调试，确认小黄车/商品/课程上架成功可点击\n□ 和场控对暗号：谁负责憋单、怎么抬氛围、冷场cue谁\n□ 深呼吸、喝口水、照一次镜子——你的状态是直播最好的滤镜\n';
r+='\n──────── 🟢 开播头10分钟：冷启动动作 ────────\n';
if(small)r+='□ 前半小时是人气爬坡期：建议喊话互动(让宝贝们扣"在/想要")、随机点名感谢，先别急着卖\n□ 每5分钟用一个"提问/投票"刷新停留，系统才愿意推更多流量给你\n';
else r+='□ 开场别急着讲干货/卖货，先花2分钟"无压力欢迎新来的朋友"留人\n□ 用预约人数/直播订阅引导加关注，为下一场蓄水\n';
r+='□ 破冰三连问：今天几点来的？从哪刷到的？在弹幕扣一下。\n\n';
r+='──────── 收尾（防止虎头蛇尾）────────\n□ 结尾总结今日高光 + 预告下一场固定时间(做"养成收看习惯")\n□ 提醒关注+预约下场；做最后5分钟的催单闭环\n□ (若讲错价格或忘词被喷)别硬刚——大方认错纠正，观众更爱真实的你胜过完美的你\n□ 下播后：导出本场数据(停留时长/转粉/转化)记进复盘表，明早看一眼。';
document.getElementById('outputBox').innerText=r;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 检查表已复制！'))}
