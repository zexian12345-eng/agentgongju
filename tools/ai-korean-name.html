<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 韩式名字生成器 | AgentGongju.com</title>
<meta name="description" content="一键生成好听又有韩剧感的韩式中文名，带寓意与韩语发音标注，适合网名、角色与昵称取名。">
<meta name="keywords" content="韩式起名,韩文名,韩剧名,昵称,起名生成器">
<link rel="stylesheet" href="../css/style.css"><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px;box-sizing:border-box}
select:focus,input:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.name-card{background:rgba(99,102,241,0.07);border:1px solid rgba(99,102,241,0.25);border-radius:12px;padding:18px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.name-card .hn{font-size:1.9rem;color:#fff;font-weight:700;letter-spacing:2px}
.name-card .pron{font-size:.85rem;color:#f0abfc;margin:4px 0}
.name-card .mean{font-size:.8rem;color:#94a3b8;line-height:1.6}
.copy-btn{margin:12px auto 0;padding:7px 18px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.35);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.82rem;font-family:inherit}
.copy-btn:hover{background:rgba(99,102,241,0.28)}
.hint{font-size:.78rem;color:#64748b;line-height:1.7;margin-top:14px;background:rgba(255,255,255,0.02);border-radius:10px;padding:10px 14px}
@media(max-width:600px){.param-row,.grid2{grid-template-columns:1fr}}
</style>
<script>
var _hmt = _hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";

</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🇰🇷 AI 韩式名字生成器</h1><p>生成韩剧感十足的好听名字，自带韩语发音与美好寓意</p></div>

<div class="card">
<label>🌱 姓氏搭配（可留空自动搭配热门韩系姓氏）</label>
<input type="text" id="surname" placeholder="例如：林、陈、金…（留空则随机）">
<div class="param-row">
<div><label>🎭 风格气质</label>
<select id="style">
<option value="清新温柔">清新温柔</option>
<option value="高冷气质">高冷气质</option>
<option value="元气可爱">元气可爱</option>
<option value="文艺古风">文艺古风</option>
<option value="坚强有力量">坚强有力量</option>
</select></div>
<div><label>📛 生成数量（3-6个）</label>
<input type="number" id="num" min="3" max="6" value="4">
</div>
</div>
<button class="btn-gen" id="genBtn">✨ 生成韩式名字</button>
</div>

<div class="result-area" id="resultArea">
<div style="color:#22c55e;font-weight:600;margin-bottom:14px">✅ 为你精选的韩式名字：</div>
<div class="grid2" id="namesBox"></div>
<div class="hint">💡 小贴士：这些名字按韩语音译自然组合，中文汉字可自由挑选同音字，例如「河恩」也可写作「荷恩」「河蒽」。用于网名、游戏角色、小说人物都很合适，也可作为宝宝小名的灵感参考。</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function rf(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// 每个名字：[韩语音节, 中文寓意标签, 发音]
const STYLE_POOL={
'清新温柔':[['하은','河恩 / 荷恩','ha-eun','恩泽如河，清澈温柔'],['서연','瑞妍','seo-yeon','吉祥端丽，明媚动人'],['소윤','素允','so-yun','纯粹信实，温婉大方'],['다은','多恩','da-eun','常怀感恩，福气满满'],['예린','艺琳','ye-rin','才华如琳琅美玉'],['수연','秀妍','su-yeon','秀丽娟好，如春水含烟']],
'高冷气质':[['은수','恩秀','eun-su','气质清冷，秀外慧中'],['서하','瑞下 / 西河','seo-ha','冷静理性，难掩锋芒'],['하린','河琳','ha-rin','清澈深远，神秘知性'],['고은','古恩','go-eun','遗世独立，沉静优雅'],['유진','由珍','yu-jin','通透珍贵，从容自信'],['슬아','瑟雅','seul-a','沉静高雅，不随波逐流']],
'元气可爱':[['보라','宝拉','bo-ra','浪漫烂漫，活泼明媚'],['초아','初芽','cho-a','天真烂漫，朝气蓬勃'],['유나','由娜','yu-na','灵动轻快，招人喜爱'],['슬기','瑟琪','seul-gi','机灵聪慧，元气满满'],['가은','佳恩','ga-eun','美好感恩，甜甜可爱'],['미소','微笑','mi-so','常带笑容，治愈人心']],
'文艺古风':[['연우','砚雨','yeon-u','砚台听雨，书卷气息'],['정원','庭园','jeong-won','庭院深深，静好雅致'],['가온','嘉温','ga-on','温和持重，腹有诗书'],['한별','韩星','han-byeol','夜空明星，清辉自赏'],['서진','瑞珍','seo-jin','祥瑞珍贵，内秀其心'],['지안','知安','ji-an','知书达理，安然自若']],
'坚强有力量':[['지호','智浩','ji-ho','睿智而浩荡，志存高远'],['도윤','道允','do-yun','品行端正，坚韧可靠'],['준서','俊书','jun-seo','才俊博学，坦荡磊落'],['시우','诗优','si-u','气度不凡，风骨傲然'],['민준','敏竣','min-jun','聪敏果敢，可担大任'],['정국','正国','jeong-guk','正气凛然，胸怀家国']]
};
const SUR=['金','李','朴','崔','郑','姜','林','权','申','柳','赵','韩'];
document.getElementById('genBtn').addEventListener('click',()=>{
const tool='AI 韩式名字生成器 | AgentGongju.com';
if(!Paywall.countUse(tool))return;
let sur=document.getElementById('surname').value.trim()||rf(SUR);
const style=document.getElementById('style').value;
let n=parseInt(document.getElementById('num').value||4);n=Math.max(3,Math.min(6,n));
const pool=shuffle(STYLE_POOL[style]);
const names=pool.slice(0,n);
const box=document.getElementById('namesBox');box.innerHTML='';
names.forEach(it=>{
const d=document.createElement('div');d.className='name-card';
d.innerHTML=`<div class="hn">${sur}${it[0].split(' ')[0]}</div><div class="pron">${it[2]}</div><div class="mean">${sur}${it[1]} · ${it[3]}</div><button class="copy-btn" onclick="copyN(this,'${sur}${it[0].split(' ')[0]}')">📋 复制名字</button>`;
box.appendChild(d);
});
document.getElementById('resultArea').classList.add('active');
document.getElementById('resultArea').scrollIntoView({behavior:'smooth',block:'start'});
});
function copyN(btn,t){navigator.clipboard.writeText(t).then(()=>{const o=btn.textContent;btn.textContent='✅ 已复制';setTimeout(()=>btn.textContent=o,1300);}).catch(()=>{prompt('复制失败，请手动复制：',t);});}
</script>
</body>
</html>
