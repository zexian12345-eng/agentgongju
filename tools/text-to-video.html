<div class="tool-container">
  <div class="tool-header">
    <h1>📝→🎬 AI 文生视频</h1>
    <p>输入文字描述，AI 自动生成匹配的视频画面</p>
  </div>

  <div class="card">
    <label>🎯 描述你想要的视频画面</label>
    <div class="prompt-tips">
      <strong>💡 提示技巧：</strong>
      <p>【主体】+【动作】+【场景】+【镜头】+【风格】</p>
      <p>例如：<span class="example-btn" onclick="fillExample(0)">日出海面 金色阳光</span>
      <span class="example-btn" onclick="fillExample(1)">未来城市 霓虹雨夜</span>
      <span class="example-btn" onclick="fillExample(2)">小猫窗台 午后阳光</span>
      <span class="example-btn" onclick="fillExample(3)">产品展示 旋转展示</span></p>
    </div>
    <textarea id="promptInput" placeholder="详细描述你想要的画面...&#10;例如：一只橘猫趴在窗台上，午后温暖的阳光洒进来，猫咪慵懒地眨眼睛，镜头缓慢推近"></textarea>
  </div>

  <div class="card">
    <label>🎨 风格</label>
    <div class="style-grid" id="styleOptions">
      <button class="style-btn active">写实</button>
      <button class="style-btn">动漫</button>
      <button class="style-btn">水墨</button>
      <button class="style-btn">赛博朋克</button>
      <button class="style-btn">吉卜力</button>
      <button class="style-btn">油画</button>
      <button class="style-btn">像素</button>
      <button class="style-btn">水彩</button>
    </div>

    <div class="param-grid">
      <div>
        <label style="color:#94a3b8;font-size:0.85rem;margin-bottom:4px;">时长</label>
        <select id="duration">
          <option value="5">5 秒</option>
          <option value="10" selected>10 秒</option>
          <option value="15">15 秒</option>
        </select>
      </div>
      <div>
        <label style="color:#94a3b8;font-size:0.85rem;margin-bottom:4px;">比例</label>
        <select id="aspectRatio">
          <option value="16:9">16:9 横屏</option>

<footer class="footer">

<script>
let currentStyle = '写实';
let history = JSON.parse(localStorage.getItem('videoHistory') || '[]');

document.querySelectorAll('.style-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentStyle = btn.textContent;
  });
});

const examples = [
  '金色阳光从海平面升起，波光粼粼的海面，海鸥飞过，广角全景，温暖色调',
  '霓虹灯闪烁的未来城市街道，雨夜，倒影在湿漉漉的地面，赛博朋克风格，慢镜头',
  '一只橘猫趴在木质窗台上，午后温暖的阳光洒进来，猫咪眯着眼睛，温馨宁静',
  '产品在白色背景上缓缓旋转，柔和的侧光，展示产品细节和质感'
];

function fillExample(idx) {
  document.getElementById('promptInput').value = examples[idx];
}

document.getElementById('generateBtn').addEventListener('click', async () => {
  const prompt = document.getElementById('promptInput').value.trim();
  if(!prompt) { alert('请输入视频描述！'); return; }

  const btn = document.getElementById('generateBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 正在生成...';

  try {
    const res = await fetch('/api/text-to-video', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        prompt,
        style: currentStyle,
        duration: document.getElementById('duration').value,
        aspect_ratio: document.getElementById('aspectRatio').value,
        quality: document.getElementById('quality').value
      })
    });
    const data = await res.json();

    if(data.success && data.video_url) {
      document.getElementById('resultArea').classList.add('active');
      document.getElementById('resultVideo').src = data.video_url;
      document.getElementById('downloadBtn').href = data.video_url;

      history.unshift({ prompt: prompt.substring(0, 40) + (prompt.length > 40 ? '...' : ''), style: currentStyle, url: data.video_url, time: new Date().toLocaleString() });
      if(history.length > 10) history.pop();
      localStorage.setItem('videoHistory', JSON.stringify(history));
      renderHistory();
    } else {
      alert('生成失败: ' + (data.error || '请稍后重试'));
    }
  } catch(err) {
    alert('网络错误: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '🎬 生成视频';
  }
});

function renderHistory() {
  if(history.length === 0) return;
  document.getElementById('historyArea').style.display = 'block';
  document.getElementById('historyList').innerHTML = history.map((item, i) =>
    '<div class="history-item"><span class="tag">' + item.style + '</span><span class="prompt-preview">' + item.prompt + '</span><span style="color:#64748b;font-size:0.8rem">' + item.time + '</span><span class="play-btn" onclick="playHistory(' + i + ')">▶ 播放</span></div>'
  ).join('');
}

function playHistory(i) {
  document.getElementById('resultArea').classList.add('active');
  document.getElementById('resultVideo').src = history[i].url;
  document.getElementById('downloadBtn').href = history[i].url;
  document.getElementById('resultVideo').scrollIntoView({ behavior: 'smooth' });
}

renderHistory();
</script>
