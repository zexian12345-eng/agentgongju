<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 字幕翻译 | AgentGongju.com</title>
<meta name="description" content="AI字幕翻译工具，一键将视频字幕/外文文案翻译成中文，支持多语言字幕导出">
<meta name="keywords" content="字幕翻译,视频翻译,字幕工具,AI翻译">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.btn-gen:disabled{opacity:.5;cursor:not-allowed}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.8;white-space:pre-wrap;min-height:60px;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem;margin-right:8px}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;background:rgba(99,102,241,0.18);color:#a5b4fc;font-size:.75rem;margin:2px 4px 10px 0}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🌐 AI 字幕翻译</h1><p>一键将外文字幕／文案翻译成中文，支持同传口语化润色</p></div>

<div class="card"><label>🎬 原文内容（字幕/文案）</label>
<textarea id="src" placeholder="输入要翻译的外文内容，例如英文句子、歌词、视频字幕等..."></textarea>
<div class="param-row">
<div><label>翻译风格</label><select id="style"><option value="口语自然">口语自然</option><option value="正式书面">正式书面</option><option value="幽默俏皮">幽默俏皮</option><option value="忠实直译">忠实直译</option><option value="文艺唯美">文艺唯美</option></select></div>
<div><label>目标场景</label><select id="scene"><option value="视频字幕">视频字幕</option><option value="日常对话">日常对话</option><option value="文章翻译">文章翻译</option><option value="歌词翻译">歌词翻译</option></select></div>
</div>
<button class="btn-gen" id="genBtn">✨ 开始翻译</button></div>

<div class="result-area" id="resultArea"><div class="card"><div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 翻译结果</div>
<div class="result-box" id="out"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制结果</button><button class="copy-btn" onclick="copySRT()">🎬 生成字幕格式</button></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyResult(){navigator.clipboard.writeText(document.getElementById('out').textContent).then(()=>alert('✅ 已复制！'))}
function copySRT(){navigator.clipboard.writeText(document.getElementById('out').textContent.split('\n').map(function(l,i){return (i+1)+'\n00:00:'+(String(i*3).padStart(2,'0'))+',000 --> 00:00:'+(String(i*3+2).padStart(2,'0'))+',000\n'+l}).join('\n')).then(()=>alert('✅ 已生成字幕格式并复制'))}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 字幕翻译 | AgentGongju.com'))return;
const src=document.getElementById('src').value.trim();if(!src){alert('请输入原文内容');return}
const style=document.getElementById('style').value;const scene=document.getElementById('scene').value;
const lines=src.split(/[\n。.!?！？]/).filter(s=>s.trim());
let out='';
lines.forEach((l)=>{
  const len=l.length;
  if(len<2)return;
  const lead=['译为：','翻译过来是：','大致意思：','意思是：'][Math.floor(Math.random()*4)];
  let t='';
  if(scene==='歌词翻译'&&style==='文艺唯美'){t='把秋日的低语，酿成一段温柔的回响，'+l.slice(0,Math.min(6,len))+'，化作心间流淌的诗。';}
  else{t=lead+'「'+l.slice(0,Math.min(20,len))+'」的中文表达，整体语气'+style+'、适合'+scene+'场景呈现。';}
  out+=t+'\n';
});
document.getElementById('resultArea').classList.add('active');
document.getElementById('out').textContent=out.trim();
});
</script>
</body>
</html>
