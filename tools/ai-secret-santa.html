<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神秘圣诞礼物配对助手 | AgentGongju.com</title>
<meta name="description" content="年会、办公室或好友聚会玩"神秘圣诞老人(Secret Santa)"？输入成员名单和预算，一键随机配对避免抽到自己、给出话题提示与礼物心愿卡模板。让交换礼物不尴尬、不撞雷。">
<meta name="keywords" content="神秘圣诞老人,Secret Santa,交换礼物,年会活动,礼物配对,圣诞活动策划">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
input[type=text],textarea,select{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s;margin-top:6px}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.95;white-space:pre-wrap;font-size:0.95rem;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.output-box{font-size:.9rem}}
</style>
<script>
var _hmt = _hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";
  var s = document.getElementsByTagName("script")[0];
  s.parentNode.insertBefore(hm, s);
})();
</script>
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🎁 神秘圣诞礼物配对助手</h1><p>不撞礼物、不抽到自己，交换礼物也能很好玩</p></div>

<div class="card">
<div><label>🧑‍🤝‍🧑 参与成员（每行一个名字，无需排序）</label>
<textarea id="members" placeholder="例如：
阿远
小美
大飞
糖糖"></textarea>
<div class="param-grid">
<div><label>💰 礼物预算范围</label>
<select id="budget"><option selected>50-100元</option><option>20-50元</option><option>100-200元</option><option>200元以上</option><option>自制/心意为主</option></select></div>
<div><label>🎄 活动类型</label>
<select id="scene"><option selected>公司/办公室年会</option><option>好友聚会</option><option>家庭团圆</option><option>线上云抽签</option></select></div>
</div>
<label>🧾 可选：写下每个人避开/s适合的信息（如"阿远怕猫"），没有可留空</label>
<textarea id="notes" placeholder="格式：名字，标签：怕猫 / 爱咖啡 / 已有某礼物…（每行一条）"></textarea>
<button class="btn-gen" id="genBtn">🎅 开始配对 & 生成心愿卡</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">🎁 配对结果 & 小建议</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制结果</button>
</div>
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">🖨 可打印抽签小纸条（发给每人）</div>
<div class="output-box" id="slipBox"></div>
<button class="copy-btn" onclick="copySlip()">📋 复制纸条</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const HINT={
'50-100元':['保温杯/马克杯加热垫套装','盲盒主题摆件','零食礼包+手写贺卡','香薰蜡烛/扩香石','毛绒小毯子'],
'20-50元':['桌面绿植+花盆','手机支架/数据线收纳','桌面日历','暖手宝/热水袋','精致钥匙扣/挂件'],
'100-200元':['蓝牙小音箱','保温随行杯','香薰机','机械键盘键帽套装','围巾/手套暖心礼盒'],
'200元以上':['电动牙刷','蓝牙耳机','便携咖啡机','香氛/香水旅行装组合','按摩仪'],
'自制/心意为主':['手写祝福信+照片','同款手作饼干点心','手工相册/拼图','一起吃饭看电影的券','手绘明信片册']
};
const ICE=['收到礼物的那一刻先别猜，留一句"拆到的朋友请分享名字来源"','抽到同事的同学请当场补一句夸TA的真心话再打开','拆完别急着拍照，先互相抱抱——气氛比礼物贵'];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('神秘圣诞礼物配对助手 | AgentGongju.com'))return;
const raw=document.getElementById('members').value.trim().split(/\n+/).map(s=>s.trim()).filter(Boolean);
if(raw.length<4){alert('请至少输入4位成员姓名，活动才转得动哦');return;}
// 成员去重、切手气
const uniq=[...new Set(raw)];
const pool=shuffle(uniq.slice()); // 送礼物顺序
// 固定偏移轮换实现"没人抽到自己"且尽量错开
let givers=shuffle(uniq.slice());
let best=null;
for(let tryN=0;tryN<500&&!best;tryN++){
  const g=shuffle(givers.slice());
  let ok=true;
  for(let i=0;i<g.length;i++){ if(g[i]===pool[i]){ok=false;break;} }
  if(ok)best=g;
}
const givOrder=best||shuffle(pool.slice());
// 解析避雷notes
const badMap={};
document.getElementById('notes').value.trim().split(/\n+/).forEach(l=>{
  const m=l.split(/[,，:：]/);
  if(m.length>=2)badMap[m[0].trim()]=(badMap[m[0].trim()]||'')+' '+m.slice(1).join(' ').trim();
});
const budget=document.getElementById('budget').value;
const scene=document.getElementById('scene').value;
const year=new Date().getFullYear();
let r='🧑‍🤝‍🧑 Secret Santa 配对结果（'+year+' · '+scene+'）\n\n';
for(let i=0;i<pool.length;i++){
  const giver=givOrder[i], recv=pool[i];
  const avoid=badMap[recv]?('（注意TA：'+badMap[recv]+'）'):'';
  const ideas=pick(HINT[budget]);
  r+='【'+giver+'】 ⟶ 送给 '+recv+'\n';
  r+='   💡 若没想法，「'+ideas+'」这类在这个预算里安全不踩雷'+avoid+'；\n';
  r+='   小纸条：你和TA共同点/趣事一句话随机 = '+pick(['都爱喝奶茶','同一星座','最近都在加班','都喜欢猫','都爱吃火锅','都爱刷短视频'])+'\n\n';
}
r+='────────\n游戏加分项：\n· '+pick(ICE)+'\n· 预算：'+budget+' 内自选，重点是"被记住名字"而不是"用价格标签"；\n· 建议组织者提前一周截止报名并抽签，避免临时没货。';
document.getElementById('outputBox').innerText=r;
document.getElementById('resultArea').classList.add('active');
// slip
let s='🎫 抽签专用纸条（裁剪后每人一张）\n\n';
for(let i=0;i<pool.length;i++){
  s+='────────────\n你要送礼物的对象：'+pool[i]+'\n预算：'+budget+'｜记得点心意不点负担～\n陪你抽签的快乐：'+givOrder[i]+'\n';
}
document.getElementById('slipBox').innerText=s;
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 配对结果已复制！'))}
function copySlip(){navigator.clipboard.writeText(document.getElementById('slipBox').innerText).then(()=>alert('✅ 抽签纸条已复制！'))}
</script>
</body>
</html>
