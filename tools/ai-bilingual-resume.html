function bullet(role, lvl, custom){
  const cur=DATA[role];
  let arr= (lvl==='sr')?cur.sr:(lvl==='mid'?cur.mid:cur.jr);
  let out=[];
  arr.forEach(it=>out.push(it));
  if(custom){
    const shapes={
      pm:["Directed the product for ",],
      tech:["Developed and shipped ",],
      data:["Analyzed data around ",],
      mkt:["Grew traction via ",],
      design:["Designed the journey for ",],
      hrfin:["Set up the process for ",]
    };
    const verb=(shapes[role]&&shapes[role][0])||"Owned ";
    out.unshift({e:verb+custom+". Please replace with your own English wording and add a [quantified result].",c:"这是根据你的亮点生成的一句话开头（参考引入语）。建议用一个动词开头，讲清你做了什么，并把[custom]再补成更精炼的英文 + 可量化结果，不要直译中文。"});
  }
  return {items:out,kw:cur.kw};
}

  const cus=document.getElementById("custom").value.trim();

  const box=document.getElementById("box");box.innerHTML="";
  r.items.forEach(function(it,i){
    const d=document.createElement("div");d.className="bullet";
    const en=document.createElement("div");en.className="en";en.textContent="• "+it.e;
    const cn=document.createElement("div");cn.className="cn";cn.textContent="中文参考： "+it.c;
    const bm=document.createElement("div");bm.className="bm";bm.textContent=i+1;
    const wrap=document.createElement("div");wrap.style.flex="1";wrap.appendChild(en);wrap.appendChild(cn);
    d.appendChild(bm);d.appendChild(wrap);box.appendChild(d);
  });
  const kd=document.createElement("div");kd.className="keywords";
  r.kw.forEach(function(k){var s=document.createElement("span");s.className="kw";s.textContent=k;kd.appendChild(s);});
  box.appendChild(kd);
  const note=document.createElement("div");note.className="custom-note";note.textContent="Job Keywords：上面的标签可作为英文简历、领英Profile的软技能词云。点下方可整份复制。";
  box.appendChild(note);
  document.getElementById("resultArea").classList.add("active");
  document.getElementById("resultArea").scrollIntoView({behavior:"smooth"});
};

}
