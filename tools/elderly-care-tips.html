<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 老人健康关怀助手 | AgentGongju.com</title>
<meta name="description" content="从饮食、运动、用药到体检与防跌倒，为老人定制科学健康的日常关怀计划，让孝心落到实处">
<meta name="keywords" content="老人健康,老年保健,老人护理,老人饮食,防跌倒,三高,老年健康管理">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;font-size:.92rem;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>
var _hmt = _hmt || [];

  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";

<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>❤️ AI 老人健康关怀助手</h1><p>把日常关怀落到实处，让爸妈健康安心</p></div>

<div class="card">
<div class="param-row">
<div><label>👴 老人年龄段</label>
<select id="age"><option value="55-64">55-64岁</option><option value="65-74" selected>65-74岁</option><option value="75+">75岁以上</option></select></div>
<div><label>💊 常见健康情况</label>
<select id="health"><option value="健康">基本健康</option><option value="高血压" selected>高血压</option><option value="糖尿病">糖尿病</option><option value="三高">三高（血压/血糖/血脂）</option><option value="骨质疏松">骨质疏松</option></select></div>
</div>
<div class="param-row">
<div><label>🏃 日常活动能力</label>
<select id="mobility"><option value="自理">完全自理</option><option value="部分自理" selected>部分需协助</option><option value="卧床">卧床/行动不便</option></select></div>
<div><label>👨‍👩‍👧 居住状况</label>
<select id="live"><option value="独居" selected>独居</option><option value="与子女">与子女同住</option><option value="养老机构">养老机构</option></select></div>
</div>
<label>📝 其他特殊情况（选填）</label>
<textarea id="extra" placeholder="如：独居，每天会走半小时，最近便秘比较严重…"></textarea>
<button class="btn-gen" id="genBtn">✨ 生成关怀计划</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#f87171;font-weight:600;margin-bottom:12px">💝 每日/每周关怀计划</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制计划</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const diet={
'健康':['每日：谷物+蔬菜+蛋奶+适量肉类','推荐：清淡少盐，每天1个鸡蛋+300g蔬菜','不吃或少吃：油炸食品、腌制品'],
'高血压':['低盐！每日盐<5g（约一小啤酒瓶盖）','多吃：香蕉/燕麦/深海鱼（富含钾和欧米伽3）','少吃：咸菜、腊肉、加工肉类'],
'糖尿病':['控制总热量，主食粗细搭配','低GI水果（苹果/梨/樱桃）','避免：含糖饮料、糕点、白米粥'],
'三高':['"三低"饮食：低盐低脂低糖','每日蔬菜≥500g，水果200g左右','控制：红肉、油炸、高嘌呤（海鲜内脏）'],
'骨质疏松':['高钙饮食：豆腐、牛奶（每日300ml）、绿叶菜','适量维生素D：晒太阳10-15分钟','少喝浓茶/咖啡，会影响钙吸收']
};
const exercise={
'自理':['快走/太极/广场舞每天30-40分钟','每周2次力量训练（踮脚、坐站交替）'],
'部分自理':['坐位体操（举臂/转肩）+每天户外晒15分钟太阳','每天扶着椅子做抬腿训练3组每组8次'],
'卧床':['家属帮助做被动关节活动（早晚各1次）','床上翻身每2小时1次，防压疮']
};
const safety={
'独居':['安装应急呼叫铃/手环，每天固定时间视频通话','房门钥匙放明显处备用，冰箱贴写好子女电话','每月检查一次药盒是否过期'],
'与子女':['在厨房/浴室地面铺防滑垫','给常用物品固定位置，避免老人弯腰去够'],
'养老机构':['每周探望1次以上','关注护理记录与本人口述状态是否一致']
};
const diseaseAdvice={
'高血压':{tips:['每天早晚各测一次血压并记录','遵医嘱勿自行停药，血压波动及时就医'],freq:'每3个月复查一次' },
'糖尿病':{tips:['每天测血糖记录','低血糖时准备糖果速救','定期检查眼底/足部'],freq:'每3-6个月复查HbA1c'},
'三高':{tips:['同时监测血压/血糖/血脂','所有用药遵医嘱，不可自行减量'],freq:'每3个月全面复查'},
'骨质疏松':{tips:['防跌倒！室内地面防滑、照明充足','补充钙剂+维D（咨询医生剂量）'],freq:'每年骨密度检查'},
'健康':{tips:['每年1次全面体检','关注体重变化，避免过瘦或超重'],freq:'每年体检+每半年量血压'}
};
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 老人健康关怀助手 | AgentGongju.com'))return;
const age=document.getElementById('age').value;
const health=document.getElementById('health').value;
const mobility=document.getElementById('mobility').value;
const live=document.getElementById('live').value;
const extra=document.getElementById('extra').value.trim();
const d=diet[health];
const e=exercise[mobility];
const s=safety[live];
const da=diseaseAdvice[health];
let out='【'+age+'岁 · '+(health=='健康'?'基本健康':health)+'· '+mobility+'】\n\n';
if(extra)out+='你的描述：「'+extra+'」\n（以下是基于你提供的健康情况的参考建议，具体请遵医嘱）\n\n';
out+='— 🥗 饮食建议 —\n'+d.join('\n')+'\n\n';
out+='— 🏃 运动建议 —\n'+e.join('\n')+'\n\n';
if(mobility==='部分自理')out+='（活动需量力而行，以不喘不累为准）\n\n';
out+='— 🚨 '+live+'安全问题 —\n'+s.join('\n')+'\n\n';
out+='— 💊 '+(health==='健康'?'健康管理':'慢病管理')+' —\n'+da.tips.join('\n')+'\n'+'复查频率：'+da.freq+'\n\n';
out+='— 📅 一周关怀清单 ——\n· 每天：量血压/测血糖 + 电话问候 1 次\n· 周一：提醒吃药+饮食记录\n· 周三：安排一次户外散步/晒太阳\n· 周五：检查一周药盒、过期食品\n· 周末：一起做顿健康餐\n\n⚠️ 声明：本工具提供生活参考与健康提醒，不替代医生诊断。如有不适请及时就医。';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 关怀计划已复制，随时提醒自己！'))}
</script>
</body>
</html>
