<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电商商品标题优化 | AgentGongju.com</title>
<meta name="description" content="淘宝、拼多多、抖音电商商品标题优化工具，自动补全卖点、属性、场景词提升搜索权重">
<meta name="keywords" content="淘宝标题,商品标题,电商标题,标题优化,SEO标题">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.8;white-space:pre-wrap;min-height:60px;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>
var _hmt = _hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";
  var s = document.getElementsByTagName("script")[0];
  s.parentNode.insertBefore(hm, s);

<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🛒 电商标题优化</h1><p>自动补全卖点·属性·场景词，提升搜索权重与转化</p></div>

<div class="card"><label>📦 商品名称（必填）</label>
<input type="text" id="product" placeholder="例如：无线蓝牙耳机">
<div class="param-row">
<div><label>商品类目</label><select id="cat"><option>数码3C</option><option>家居日用</option><option>服饰鞋包</option><option>美妆护肤</option><option>食品生鲜</option><option>母婴玩具</option></select></div>
<div><label>适用平台</label><select id="plat"><option>淘宝</option><option>拼多多</option><option>抖音小店</option><option>京东</option></select></div></div>
<div><label>核心卖点（选填，逗号分隔）</label><input type="text" id="points" placeholder="例如：降噪,长续航,佩戴舒适"></div>
<button class="btn-gen" id="genBtn">✨ 生成长标题</button></div>
<div class="result-area" id="resultArea"><div class="card"><div style="color:#22c55e;font-weight:600;margin-bottom:12px">🏆 优化后的商品标题</div><div class="result-box" id="out"></div><button class="copy-btn" onclick="copyResult()">📋 复制</button></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyResult(){navigator.clipboard.writeText(document.getElementById('out').textContent).then(()=>alert('✅ 已复制！'))}
const attrMap={
'数码3C':['官方正品','新款升级','Type-C快充','智能芯片','超长待机','便携','轻薄','高清分辨率','防水防尘','静音设计'],
'家居日用':['加厚升级','易清洗','环保材质','大容量','简约百搭','防滑','多功能','免安装','耐用','收纳神器'],
'服饰鞋包':['春夏新款','宽松版型','舒适透气','显瘦显高','百搭','防泼水','经典款','加绒保暖','弹力面料','小众设计'],
'美妆护肤':['正品保障','补水保湿','温和不刺激','提亮肤色','控油','敏感肌可用','精华级','旗舰款','淡纹抗老','持久不脱妆'],
'食品生鲜':['当季新鲜','现摘现发','无添加','产地直供','手工制作','口感细腻','真空包装','独立小袋','礼盒装','高蛋白'],
'母婴玩具':['环保材质','无味安全','易清洗','婴幼儿可用','加厚耐摔','早教益智','便携','可水洗','柔然亲肤','大牌同款']};
const sceneWords=['家用','送礼','学生党','上班族','出差旅行','宿舍','户外','厨房','办公室','居家必备'];
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('电商商品标题优化 | AgentGongju.com'))return;
const product=document.getElementById('product').value.trim();const cat=document.getElementById('cat').value;const plat=document.getElementById('plat').value;
if(!product){alert('请先输入商品名称～');return;}
const attr=attrMap[cat]||attrMap['数码3C'];const points=document.getElementById('points').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean);
const attrPick=[];const tmp=[...attr];while(tmp.length&&attrPick.length<4){attrPick.push(tmp.splice(Math.floor(Math.random()*tmp.length),1)[0]);}
const sc=sceneWords[Math.floor(Math.random()*sceneWords.length)];
const all=[...new Set([...points,...attrPick])];
let title=product+' '+all.slice(0,6).join(' ')+' '+sc+' '+plat+'热销爆款';
title=title.slice(0,58);
let out='【'+plat+' · '+cat+' 长标题】\n\n'+title+'\n\n';
out+='标题字数：'+title.length+' 字（建议30-60字）\n';
out+='✅ 已包含：产品词「'+product+'」、卖点词 '+all.slice(0,6).join('、')+'、场景词「'+sc+'」\n\n';
out+='💡 小贴士：主关键词前置，融入人群/场景/卖点词，避免堆砌和空格过多。';
document.getElementById('resultArea').classList.add('active');
document.getElementById('out').textContent=out;
});
</script>
</body>
</html>
