<div class="tool-header"><h1>🧧 AI 年终奖个税测算与发放建议</h1><p>单独计税 vs 并入综合所得，哪个更省钱</p></div>
<div class="card">
<div class="param-row">
<div><label>🧧 年终奖金额（元）</label><input type="number" id="bonus" value="30000" min="0" step="1000"></div>
<div><label>💼 全年工资收入（元，税前）</label><input type="number" id="salary" value="120000" min="0" step="1000"></div>
</div>
<div class="param-row">
<div><label>🏦 三险一金（全年，元）</label><input type="number" id="insurance" value="24000" min="0" step="500"></div>
<div><label>📉 专项附加扣除（全年，元）</label><input type="number" id="deduct" value="24000" min="0" step="500"></div>
</div>
<div class="param-row">
<div><label>👨‍👩‍👧 其他扣除（全年，元）</label><input type="number" id="other" value="0" min="0" step="500"></div>

<select id="focus"><option value="all" selected>哪种方式最省税（全面对比）</option><option value="critical">是否踩了临界点</option><option value="split">怎么发放更划算</option></select></div>
</div>
<div class="tips">💡 专项附加扣除包括子女教育、房贷利息、赡养老人、租房、继续教育、大病医疗、3 岁以下婴幼儿照护等，在个税 App 里能查到全年合计金额。</div>

<script>
// 年终奖单独计税速算表（月均应纳税所得额）
var BONUS_TABLE=[
{max:3000,rate:0.03,ded:0},
{max:12000,rate:0.10,ded:210},
{max:25000,rate:0.20,ded:1410},
{max:35000,rate:0.25,ded:2660},
{max:55000,rate:0.30,ded:4410},
{max:80000,rate:0.35,ded:7160},
{max:Infinity,rate:0.45,ded:15160}
];
// 综合所得年度税率表（应纳税所得额）
var COMP_TABLE=[
{max:36000,rate:0.03,ded:0},
{max:144000,rate:0.10,ded:2520},
{max:300000,rate:0.20,ded:16920},
{max:420000,rate:0.25,ded:31920},
{max:660000,rate:0.30,ded:52920},
{max:960000,rate:0.35,ded:85920},
{max:Infinity,rate:0.45,ded:181920}
];
function bonusTax(b){
if(b<=0)return 0;
var m=b/12;
for(var i=0;i<BONUS_TABLE.length;i++){
if(m<=BONUS_TABLE[i].max)return b*BONUS_TABLE[i].rate-BONUS_TABLE[i].ded;
}
return 0;
}
function compTax(x){
if(x<=0)return 0;
for(var i=0;i<COMP_TABLE.length;i++){
if(x<=COMP_TABLE[i].max)return x*COMP_TABLE[i].rate-COMP_TABLE[i].ded;
}
return 0;
}
function fmt(n){return n.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
// 年终奖临界点
var CRIT=[36000,144000,300000,420000,660000,960000];
function gen(){
var bonus=parseFloat(document.getElementById('bonus').value)||0;
var salary=parseFloat(document.getElementById('salary').value)||0;
var ins=parseFloat(document.getElementById('insurance').value)||0;
var ded=parseFloat(document.getElementById('deduct').value)||0;
var other=parseFloat(document.getElementById('other').value)||0;
var focus=document.getElementById('focus').value;
if(bonus<=0){alert('请输入年终奖金额');return '';}
var totalDed=60000+ins+ded+other;
var taxableNoBonus=salary-totalDed;       // 不含年终奖的应纳税所得额
var taxableWithBonus=salary+bonus-totalDed; // 并入后的应纳税所得额

// 方案A：单独计税 = 工资综合计税 + 年终奖单独计税
var taxA=compTax(taxableNoBonus)+bonusTax(bonus);
// 方案B：并入综合所得
var taxB=compTax(taxableWithBonus);

var out='════ 年终奖个税测算报告 ════\n\n';
out+='年终奖：'+fmt(bonus)+' 元\n全年工资：'+fmt(salary)+' 元\n';
out+='减除费用 60,000 + 三险一金 '+fmt(ins)+' + 专项附加 '+fmt(ded)+(other>0?' + 其他 '+fmt(other):'')+'\n';
out+='合计扣除：'+fmt(totalDed)+' 元\n\n';
out+='──── 📊 两种算法对比 ────\n';
out+='【方案一】年终奖单独计税\n';
out+='  工资部分应纳税所得额：'+fmt(Math.max(0,taxableNoBonus))+' 元 → 税 '+fmt(compTax(taxableNoBonus))+' 元\n';
out+='  年终奖部分：'+fmt(bonus)+' 元 → 税 '+fmt(bonusTax(bonus))+' 元\n';
out+='  合计个税：'+fmt(taxA)+' 元\n';
out+='  到手：'+fmt(salary+bonus-ins-ded-other-0-taxA)+' 元（约）\n\n';
out+='【方案二】并入综合所得计税\n';
out+='  应纳税所得额：'+fmt(Math.max(0,taxableWithBonus))+' 元\n';
out+='  合计个税：'+fmt(taxB)+' 元\n';
out+='  到手：'+fmt(salary+bonus-ins-ded-other-0-taxB)+' 元（约）\n\n';
var diff=Math.abs(taxA-taxB);
out+='──── 🏆 结论 ────\n';
if(Math.abs(taxA-taxB)<1){
out+='两种方式税负几乎相同，可任选。\n（通常发生在应纳税所得额较低或刚好卡在税率分界时）\n';
}else if(taxA<taxB){
out+='✅ 选【单独计税】更划算，少交 '+fmt(diff)+' 元个税。\n';
out+='原因：你的工资本身已在适用某档税率，年终奖单独计税按较低的\"月均摊\"税率计算，避免了并入后把整体税率推高一档。\n';
}else{
out+='✅ 选【并入综合所得】更划算，少交 '+fmt(diff)+' 元个税。\n';
out+='原因：你全年工资扣除后应纳税所得额较低（甚至为负），把年终奖并在里面可以充分利用未用完的扣除额和低税率档。\n';
}
out+='\n提示：年终奖单独计税优惠政策仍在延续执行，且每年只能对一笔年终奖使用\"单独计税\"。\n若一年内有多笔奖金，只有一笔可单独计税，其余必须并入综合所得。\n';
if(focus==='all'||focus==='critical'){
out+='\n──── ⚠️ 年终奖\"临界点陷阱\"（非常重要）────\n';
out+='这是年终奖特有的坑：因为单独计税用\"总额 × 税率 - 速算扣除数\"，而速算扣除数只按 1 个月算，\n所以在税率跳档点上，会出现\"多发 1 元，税多几千\"的反常现象。\n\n';
out+='关键临界点（发放金额不要刚超过）：\n';
out+='· 36,000 元 ｜ 超过后税负跳增约 2,310 元\n';
out+='· 144,000 元 ｜ 超过后税负跳增约 13,200 元\n';
out+='· 300,000 元 ｜ 超过后税负跳增约 13,750 元\n';
out+='· 420,000 元 ｜ 超过后税负跳增约 19,250 元\n';
out+='· 660,000 元 ｜ 超过后税负跳增约 30,250 元\n';
out+='· 960,000 元 ｜ 超过后税负跳增约 88,000 元\n\n';
out+='📌 你的年终奖 '+fmt(bonus)+' 元：\n';
var hit=null;
for(var i=0;i<CRIT.length;i++){
if(bonus>CRIT[i]&&bonus<CRIT[i]+3000){hit=CRIT[i];break;}
}
if(hit){
out+='🚨 危险！你刚好越过 '+fmt(hit)+' 元临界点附近！\n';
out+='建议把年终奖降到 '+fmt(hit)+' 元，或增加到约 '+fmt(hit+ (hit<50000?2500:30000))+' 元以上，否则可能\"多发反少拿\"。\n';
out+='推荐做法：超出的部分改以其他名义发放（如绩效、补贴），或递延到下一年度。\n';
}else{
var nextC=null;
for(var j=0;j<CRIT.length;j++){if(bonus<CRIT[j]){nextC=CRIT[j];break;}}
if(nextC&&(nextC-bonus)<3000){
out+='⚠️ 你距下一个临界点 '+fmt(nextC)+' 元只差 '+fmt(nextC-bonus)+' 元，谈年终奖时切忌\"刚好涨一点点\"跨过它。\n';
}else if(nextC){
out+='✅ 未踩临界点。距下一个临界点（'+fmt(nextC)+' 元）还有 '+fmt(nextC-bonus)+' 元空间。\n';
}else{
out+='✅ 未踩临界点。\n';
}
}
out+='\n临界点安全区间参考：\n3.6 万以内 / 3.6万-14.4万 / 14.4万-30万 / 30万-42万 / 42万-66万 / 66万-96万\n在每个区间的下边界附近\"刚好卡住\"是最优的。\n';
}
if(focus==='all'||focus==='split'){
out+='\n──── 🧮 发放方式建议 ────\n';
out+='① 只有一笔奖金可享受单独计税，若公司分\"年终奖 + 十三薪 + 绩效\"多笔发放，务必让财务把金额最大的那笔做成\"全年一次性奖金\"。\n';
out+='② 工资本身较低（全年应纳税所得额接近 0 或为负）的人，把年终奖并入更省；可以主动向财务提出。\n';
out+='③ 临界点附近，宁可少发 1 元也不要跨档，多余部分建议改为报销、补贴或递延发放。\n';
out+='④ 一年只能享受一次单独计税，跨年发放（12 月 vs 次年 1 月）会分属两个纳税年度，可以配合公司节奏规划。\n';
out+='⑤ 单独计税和并入综合所得的选择在次年个税汇算清缴时可以重新比较并更正，多交的税可以退回来。\n';
}
out+='\n──── ✅ 行动清单 ────\n';
out+='□ 在个税 App 里确认全年三险一金和专项附加扣除是否已如实填报（漏填等于多交税）\n';
out+='□ 把本报告结论告诉公司财务，请其选择更优的计税方式\n';
out+='□ 检查年终奖金额是否卡在临界点上，提出调整\n';
out+='□ 次年 3-6 月做年度汇算清缴，两种方式都试一遍，选最省的\n';
out+='\n⚠️ 本测算为简化模型，未考虑年终奖计入年度汇算的特殊退税情形、地方性政策及个人特殊扣除，实际以税务机关核定为准。';
return out;
}
</script>
<script>
document.getElementById('genBtn').addEventListener('click',function(){
if(!Paywall.countUse('AI 年终奖个税测算与发放建议 | AgentGongju.com'))return;
var t=gen();if(!t)return;
document.getElementById('outputBox').innerText=t;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(function(){alert('✅ 已复制！')})}
</script>
