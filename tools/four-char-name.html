<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI四字成语宝宝起名 | AgentGongju.com</title>
<meta name="description" content="从中华成语中提取唯美的字眼为宝宝起名，既有文化底蕴又好听好记。支持按性别、寓意筛选，自动拆解成语出处与寓意。">
<meta name="keywords" content="宝宝起名,成语起名,取名,名字寓意,名字出处,四字起名">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
input[type=text],select{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
input:focus,select:focus{border-color:#6366f1}
.param-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;font-size:.92rem;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem;margin-right:8px}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🏮 AI四字成语宝宝起名</h1><p>从千年成语里，挑出最动人的两个字</p></div>

<div class="card">
<label>👣 宝宝姓氏（选填）</label>
<input type="text" id="surname" placeholder="例如：李 / 王 / 张"></input>
<div class="param-grid">
<div><label>👧 性别</label>
<select id="gender"><option value="auto">不限定</option><option value="boy">男宝</option><option value="girl">女宝</option></select></div>
<div><label>💫 寓意偏好</label>
<select id="wish"><option value="wisdom">智慧文艺</option><option value="auspicious">吉祥福气</option><option value="noble">高洁雅致</option><option value="vigor">昂扬向上</option></select></div>
</div>
<button class="btn-gen" id="genBtn">🌿 生成成语好名字</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">🌿 为你挑选的好名字</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制名字</button><button class="copy-btn" onclick="regen()">🎲 换一批</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const data={
wisdom:[
 {c:'凌云',src:'壮志凌云',mean:'志向高远，如云般直上九霄',g:'boy'},
 {c:'文轩',src:'气宇轩昂',mean:'气度不凡，文采出众',g:'boy'},
 {c:'睿哲',src:'睿智明哲',mean:'聪明睿智，洞察事理',g:'boy'},
 {c:'书瑶',src:'瑶林琼树',mean:'如美玉般珍贵，才华横溢',g:'girl'},
 {c:'清越',src:'玉振金声',mean:'才学出众，声名清朗',g:'girl'},
 {c:'博文',src:'博学多文',mean:'学识广博，文采斐然',g:'boy'},
 {c:'慧之',src:'蕙质兰心',mean:'聪慧过人，心地纯良',g:'girl'},
 {c:'明轩',src:'轩然霞举',mean:'气宇轩昂，前程光明',g:'boy'}],
auspicious:[
 {c:'安澜',src:'河清海晏',mean:'生活安宁，波澜不惊',g:'auto'},
 {c:'瑞霖',src:'祥瑞甘霖',mean:'如甘霖润泽，福泽绵长',g:'boy'},
 {c:'悦然',src:'欣然自得',mean:'心情愉悦，一生顺遂',g:'auto'},
 {c:'景行',src:'高山景行',mean:'品行高尚，受人敬仰',g:'boy'},
 {c:'熙宁',src:'熙熙攘攘',mean:'光明温暖，宁静美好',g:'girl'},
 {c:'福临',src:'福至心灵',mean:'福气临门，心想事成',g:'boy'}],
noble:[
 {c:'清和',src:'清雅温和',mean:'气质清雅，性情温和',g:'girl'},
 {c:'瑾瑜',src:'怀瑾握瑜',mean:'品德如美玉般高洁',g:'auto'},
 {c:'竹筠',src:'翠竹凌云',mean:'如竹坚韧，虚心有节',g:'girl'},
 {c:'兰亭',src:'兰桂齐芳',mean:'温文尔雅，德才兼备',g:'auto'},
 {c:'瑶光',src:'瑶台琼室',mean:'光明璀璨，美好珍贵',g:'girl'}],
vigor:[
 {c:'浩然',src:'浩然正气',mean:'正气凛然，光明磊落',g:'boy'},
 {c:'凌霄',src:'直冲云霄',mean:'志向远大，气宇不凡',g:'boy'},
 {c:'振华',src:'振翅高飞',mean:'意气风发，光耀中华',g:'boy'},
 {c:'骄阳',src:'骄阳似火',mean:'阳光热烈，充满朝气',g:'auto'},
 {c:'长风',src:'长风破浪',mean:'乘风破浪，一往无前',g:'boy'}]
};
let lastSurname='';
function gen(){
const surname=document.getElementById('surname').value.trim();
const gender=document.getElementById('gender').value;
const wish=document.getElementById('wish').value;
const base=data[wish];
let pool=base.filter(x=>gender==='auto'||x.g===gender||x.g==='auto');
if(pool.length<3)pool=base;
// shuffle
for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
const picks=pool.slice(0,4);
lastSurname=surname;
let out='为你从「'+wishName(wish)+'」寓意中精选 4 个成语好名：\n\n';
picks.forEach((p,idx)=>{
  out+=(idx+1)+'. '+((surname?surname:'')+p.c)+'\n';
  out+='　源自成语：「'+p.src+'」\n';
  out+='　寓意：'+p.mean+'\n\n';
});
out+='💡 建议：名字搭配姓氏念一遍确保顺口，注意避开谐音歧义，可结合五行喜用再定夺。';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
}
function wishName(w){return {wisdom:'智慧文艺',auspicious:'吉祥福气',noble:'高洁雅致',vigor:'昂扬向上'}[w];}
document.getElementById('genBtn').addEventListener('click',()=>{if(!Paywall.countUse('AI四字成语宝宝起名 | AgentGongju.com'))return;gen();});
function regen(){gen();}
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 名字已复制！'))}
</script>
</body>
</html>
