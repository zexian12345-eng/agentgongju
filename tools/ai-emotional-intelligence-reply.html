<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;font-size:.92rem;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.tip{color:#94a3b8;font-size:.85rem;margin-bottom:12px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>

<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>💬 AI 高情商回复</h1><p>拿不准怎么回的话，AI帮你把分寸感拿捏到位</p></div>

<div class="card">
<label>🗣️ 对方说了什么 / 面临的局面</label>
<textarea id="scene" placeholder="例如：同事当众说我做的方案不行，我有点尴尬不知道怎么接。或：朋友老是找我借钱，我不想伤和气又不想借……"></textarea>
<div class="param-row">
<div><label>🎯 场景意图</label>
<select id="intent"><option value="应付" selected>🛡️ 得体应付</option><option value="婉拒">🙅 委婉拒绝</option><option value="化解尴尬">😅 化解尴尬</option><option value="安抚">🤗 安抚对方</option><option value="推进">📈 促成事情</option></select></div>
<div><label>👤 对方身份</label>
<select id="relation"><option value="同事" selected>👥 同事</option><option value="领导">💼 领导/上级</option><option value="朋友">🤝 朋友</option><option value="家人">🏠 家人</option><option value="恋人">💑 恋人</option><option value="客户">🧑‍💼 客户</option></select></div>
</div>
<label>🏷️ 语气偏好（选填）</label>
<select id="tone"><option value="自然" selected>自然真诚</option><option value="幽默">轻松幽默</option><option value="正式">正式克制</option></select>
<button class="btn-gen" id="genBtn">✨ 生成回复</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 高情商回复参考</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制回复</button>
<div class="tip" style="margin-top:12px">💡 小贴士：好的回复先接住情绪，再讲事实；面对刁难，不卑不亢、就事论事最显格局。</div>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const intentLib={
应付:{open:['理解你的关注','你说的有道理','我明白你的意思'],body:{to_friend:['下次咱们一起沟通清楚，我这边也会配合。','这事儿咱们找时间细聊，肯定能解决。'],to_leader:['感谢您的提醒，我记下了，会尽快落实改进。','您放心，我会把这块补到位并及时向您汇报。'],to_colleague:['感谢指出，我回头再仔细确认下。','咱们可以一起看下，取长补短把它做好。']}},
婉拒:{open:['特别感谢你的信任/好意','真的很抱歉，这次恐怕帮不上忙','我理解你的难处'],body:{to_friend:['不过这次我这边确实有点安排不开，实在不好意思。','要不你问问我认识的人里有没有更合适的？'],to_leader:['但这块超出了我目前能独立处理的范围，需要我们一起评估。','为了不耽误进度，建议咱们换个更稳妥的方案。'],to_colleague:['我手头项目也排得比较满，怕答应了反而耽误你。','咱们可以先看看有没有更合适的分工。']}},
化解尴尬:{open:['哈哈这个确实是我没考虑周全','被你说到点子上了','咱们还是回到正事上'],body:{to_colleague:['不过正好，咱们可以一起把它优化得更好。','谢谢提醒，接下来我会更注意细节。'],to_leader:['这也是个提醒，我争取下次做得更好。','感谢指正，我这就去完善。'],to_friend:['开玩笑归开玩笑，事情咱们还是认真对待哈。','下次我注意，别往心里去。']}},
安抚:{open:['别着急，咱们一步步来','我完全理解你现在的心情','你已经做得很不错了'],body:{to_friend:['有什么需要随时跟我说，我们一起想办法。','放轻松点，天大的事也能解决。'],to_colleague:['这事儿咱们一起分担，别一个人扛。','慢慢来，先理清重点再推进，效果更好。'],to_leader:['您的心情我能理解，我们马上梳理方案。','请您放心，我们会全力以赴保障好。']}},
推进:{open:['我觉得这事值得认真推进','咱们目标是一致的','与其纠结，不如先动起来'],body:{to_client:['那我们就按这个方向尽快出方案给您确认。','为了不耽误您的进度，建议今天先定几个关键点。'],to_leader:['我建议咱们给个明确的时间节点，我好安排资源。','您看是否可以先批一下启动，我们边做边优化。'],to_colleague:['要不咱们分工明确一下，效率更高？','先把第一步做了，后面就好推进了。']}}
};
const toneLib={幽默:['（开个玩笑，别当真哈）','要是能行个方便，我请你喝奶茶～'],正式:['以上是我的初步想法，请您斟酌。','如需进一步沟通，我随时配合。'],自然:['咱们多沟通，事情总会越来越好。','有需要随时说，我都在。']};
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI高情商回复 | AgentGongju.com'))return;
const scene=document.getElementById('scene').value.trim();
const intent=document.getElementById('intent').value;
const relation=document.getElementById('relation').value;
const tone=document.getElementById('tone').value;
if(!scene){alert('请先描述对方说的话或你的处境');return;}
const lib=intentLib[intent];
const key='to_'+relation.replace(/领导\//,'leader');
const open=lib.open[(scene.length)%lib.open.length];
const bodyArr=lib.body[key]||lib.body.to_colleague;
const body=bodyArr[(scene.length+7)%bodyArr.length];
const t=toneLib[tone][(scene.length)%toneLib[tone].length];
let out='【'+intent+' · 对方是'+relation+' · '+tone+'语气】\n\n';
out+='对方说：「'+scene.slice(0,40)+(scene.length>40?'…':'')+'」\n\n';
out+='━━ 推荐参考回复 ━━\n';
out+='版本一（稳妥型）：\n“'+open+'。'+body+'”\n';
const altOpen=(intent==='婉拒'?'坦白说，':intent==='化解尴尬'?'说实话，':'别误会，')+open.replace(/特别|真的/g,'');
out+='\n版本二（爽快型）：\n“'+altOpen+'。”'+body+'”\n';
out+='\n版本三（加分收尾）：\n“'+open+'。'+body+' '+t+'”\n';
out+='\n━━ 心法提示 ━━\n';
out+=(intent==='婉拒'?'· 婉拒不伤和气的关键是「先肯定对方 + 说清客观原因」；':intent==='化解尴尬'?'· 尴尬时轻轻带过、回归正事，别让话题扩大；':'· 多共情、少说教，把「你的感受」放在前面；')+'\n';
out+='· 真拿不准时，回一句「让我想想再答复你」也完全得体。';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 回复已复制！'))}
</script>
</body>
