<script>
const bank=[
{cat:'生活日常',diff:'入门搞笑',q:'什么东西越洗越脏？',a:'水。'},
{cat:'生活日常',diff:'进阶烧脑',q:'什么东西晚上才会长出12条腿？',a:'一张吃饭的桌子（桌腿+桌上的腿的人）。'},
{cat:'生活日常',diff:'入门搞笑',q:'小明考试时抄了同桌的试卷，为什么最后考了0分？',a:'因为同桌也抄了他的。'},
{cat:'动物植物',diff:'入门搞笑',q:'什么水果看不见？',a:'盲果（芒果）。'},
{cat:'动物植物',diff:'进阶烧脑',q:'长颈鹿什么时候脖子会变短？',a:'缩脖子的时候。'},
{cat:'动物植物',diff:'高手挑战',q:'什么动物你打死了它，却流了你的血？',a:'蚊子。'},
{cat:'文字语言',diff:'入门搞笑',q:'什么字人人都会念错？',a:'“错”字。'},
{cat:'文字语言',diff:'进阶烧脑',q:'“们”字去了一点是什么字？',a:'还是一点也不认得——其实是“门”字旁边没人，答案“佧”？——正确答案：还是“们”字看成“门”字。'},
{cat:'文字语言',diff:'高手挑战',q:'一口吃掉牛尾巴，猜一个字？',a:'告（口+牛去尾）。'},
{cat:'数学逻辑',diff:'进阶烧脑',q:'有一根10米长的绳子，每天剪掉一半，多少天剪完？',a:'永远剪不完（长度无限趋近0但始终有）。'},
{cat:'数学逻辑',diff:'高手挑战',q:'3个苹果分给4个人，每人至少一个还怎么分？',a:'榨成苹果汁分。'},
{cat:'生活日常',diff:'入门搞笑',q:'什么东西你越用它越少？',a:'肥皂。'},
{cat:'生活日常',diff:'进阶烧脑',q:'一个人掉进河里却不会游泳，为什么没淹死？',a:'因为河冻住了（冬天）。'},
{cat:'动物植物',diff:'入门搞笑',q:'青蛙为什么跳得比树高？',a:'因为树不会跳。'},
{cat:'文字语言',diff:'入门搞笑',q:'什么桥下没有水？',a:'天桥、立交桥。'},
{cat:'数学逻辑',diff:'达人',q:'1+1在什么情况下不等于2？',a:'算错的时候。'},
{cat:'生活日常',diff:'高手挑战',q:'什么东西早上四条腿、中午两条腿、晚上三条腿？',a:'人（婴儿爬→成人走→老人拄拐）。'},
{cat:'动物植物',diff:'入门搞笑',q:'大象的左边耳朵像什么？',a:'右边耳朵。'},
{cat:'文字语言',diff:'进阶烧脑',q:'什么动物没有方向感却永远走不丢？',a:'蜗牛（背着家走）。'},
{cat:'生活日常',diff:'入门搞笑',q:'什么东西你站得越高，它就离你越近？',a:'房顶/伞顶。'}
];
let curQ='',curA='';
function pick(){
const d=document.getElementById('diff').value;
const c=document.getElementById('cat').value;
let pool=bank;
if(c!=='随机混搭')pool=pool.filter(x=>x.cat===c);
if(pool.length===0)pool=bank.filter(x=>x.cat==='随机混搭').concat(bank,[bank[0]]);
// 优先匹配难度，找不到再放宽
let matched=pool.filter(x=>x.diff===d||d==='入门搞笑');
const item=pool[Math.floor(Math.random()*pool.length)];
curQ=item.q;curA=item.a;
document.getElementById('aBox').style.display='none';
document.getElementById('showAns').style.display='block';
}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI脑筋急转弯生成器 | AgentGongju.com'))return;
pick();
document.getElementById('qBox').innerText='❓ '+curQ;
document.getElementById('resultArea').classList.add('active');
});
document.getElementById('regenBtn').addEventListener('click',()=>{
pick();
document.getElementById('qBox').innerText='❓ '+curQ;
});
document.getElementById('showAns').addEventListener('click',()=>{
document.getElementById('aBox').innerText='💡 答案：'+curA+'\n\n（忍俊不禁，记得和身边人分享这份快乐～）';
document.getElementById('aBox').style.display='block';
document.getElementById('showAns').style.display='none';
});
</script>
