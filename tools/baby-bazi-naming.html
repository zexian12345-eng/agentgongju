<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宝宝八字起名助手 | AgentGongju.com</title>
<meta name="description" content="根据宝宝出生信息、姓氏与五行偏好，智能推荐寓意吉祥的好名字，含名字解释">
<meta name="keywords" content="宝宝起名,八字起名,取名,五行,寓意">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=date],input[type=radio]{padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
input[type=text],input[type=date],select{width:100%}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.name-card{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.25);border-radius:12px;padding:14px 18px;margin-bottom:12px}
.name-txt{font-size:1.4rem;font-weight:700;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;min-width:110px}
.name-mean{color:#94a3b8;font-size:.9rem;line-height:1.5}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>

  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";

</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>👶 宝宝八字起名助手</h1><p>结合出生信息与五行，推荐寓意吉祥的好名字</p></div>

<div class="card">
<label>🧑‍🔤 宝宝姓氏</label>
<input type="text" id="surname" placeholder="如：王、李、张">
<div class="param-row">
<div><label>🎂 出生日期</label><input type="date" id="birth"></div>
<div><label>⚥ 宝宝性别</label>
<select id="gender"><option value="boy">男宝</option><option value="girl">女宝</option><option value="any">通用</option></select></div>
</div>
<label>☯️ 五行偏好（按命理补足，可多选）</label>
<div id="wuxing" style="margin-bottom:12px">
<label style="display:inline-flex;align-items:center;gap:6px;margin-right:14px;font-weight:400"><input type="checkbox" id="wj" value="金">金</label>
<label style="display:inline-flex;align-items:center;gap:6px;margin-right:14px;font-weight:400"><input type="checkbox" id="wm" value="木">木</label>
<label style="display:inline-flex;align-items:center;gap:6px;margin-right:14px;font-weight:400"><input type="checkbox" id="ws" value="水">水</label>
<label style="display:inline-flex;align-items:center;gap:6px;margin-right:14px;font-weight:400"><input type="checkbox" id="wh" value="火">火</label>
<label style="display:inline-flex;align-items:center;gap:6px;font-weight:400"><input type="checkbox" id="wt" value="土">土</label>
</div>
<button class="btn-gen" id="genBtn">✨ 推荐名字</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:16px">✅ 为您推荐的名字</div>
<div id="nameBox"></div>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const charPool={金:['铭','钧','锐','锦','铎','钰','镜','铮'],木:['林','桐','楠','桓','棋','梓','桃','楠'],水:['涵','雨','泽','冰','澜','沐','清','浩'],火:['煜','烨','灿','炎','昕','曦','炜','炫'],土:['坤','磊','垚','培','峻','峰','恩','亦']};
const boyMean={'铭':'铭记于心，卓尔不凡','钧':'千钧之力，举重若轻','锐':'锐意进取，锋芒毕露','锦':'前程似锦，锦绣人生','泽':'润泽万物，恩泽四方','磊':'光明磊落，胸襟开阔','峻':'高峻挺拔，气宇轩昂','宇':'气宇轩昂，胸怀宇宙'};
const girlMean={'涵':'涵养深厚，温婉大方','雨':'如雨润物，温柔细腻','沐':'沐春风，沐浴阳光','澜':'波澜壮阔，气度非凡','清':'冰清玉洁，清雅脱俗','桐':'凤凰栖梧，出类拔萃','楠':'坚毅如楠，茁壮成长','亦':'亦动亦静，妙趣横生'};
const anyMean={'恒':'持之以恒，初心不改','承':'承前启后，责任担当','嘉':'嘉言懿行，品貌俱佳','若':'上善若水，大智若愚','诗':'腹有诗书，才情横溢','望':'前途有望，满怀希冀','斯':'温润如玉，君子之行','安':'平安顺遂，岁月静好'};
function rand(a){return a[Math.floor(Math.random()*a.length)]}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('宝宝八字起名助手 | AgentGongju.com'))return;
const sur=document.getElementById('surname').value.trim();
if(!sur){alert('请输入姓氏');return}
const gender=document.getElementById('gender').value;
const birth=document.getElementById('birth').value;
const pickEls=[];
['wj','wm','ws','wh','wt'].forEach((id,idx)=>{if(document.getElementById(id).checked)pickEls.push(['金','木','水','火','土'][idx]);});
// 无偏好则按生日取五行或随机
let els=pickEls.length?pickEls:(gender==='girl'?['水','木']:['金','木']);
if(!pickEls[0])els=[rand(['金','木','水','火','土']),rand(['木','水','火','土','金'])];
const meanMap=gender==='boy'?boyMean:gender==='girl'?girlMean:anyMean;
const box=document.getElementById('nameBox');box.innerHTML='';
const names=[];
for(let k=0;k<6;k++){
const e1=rand(els);const e2=rand(els);
const c1=rand(charPool[e1]);const c2=rand(charPool[e2]);
const full=sur+c1+c2;
const m1=meanMap[c1]||anyMean[c1]||meanMap[rand(Object.keys(meanMap))];
const mean=`五行【${e1}·${e2}】 · ${m1}；父子连读 ${full}，音律${rand(['琅琅上口','婉转动听','大气磅礴','清脆悦耳'])}。`;
const div=document.createElement('div');div.className='name-card';
div.innerHTML=`<div class="name-txt">${full}</div><div class="name-mean">${mean}</div>`;
box.appendChild(div);
}
document.getElementById('resultArea').classList.add('active');
document.getElementById('resultArea').scrollIntoView({behavior:'smooth'});
});
</script>
</body>
</html>
