<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}

.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}

.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;margin-bottom:12px;font-size:.92rem}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>

<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>✍️ AI 英文写作润色</h1><p>把「能看懂」的英文，改成「看得出水平」的英文</p></div>

<div class="card">
<label>💬 粘贴你的英文原文</label>
<textarea id="src" placeholder="I think the project is very good and we should continue it. We can maybe improve the design a little."></textarea>
<div class="param-row">
<div><label>🎯 润色目标</label>
<select id="goal">
<option value="学术">🎓 学术/论文</option>
<option value="商务">💼 商务邮件</option>
<option value="日常">☕ 日常自然</option>
<option value="正式">📜 正式书面</option>
</select></div>
<div><label>📊 输出选项</label>
<select id="opt">
<option value="full">润色+中文翻译+说明</option>
<option value="only">仅润色英文</option>
<option value="brief">精简说明</option>
</select></div>
</div>
<button class="btn-gen" id="genBtn">✨ 一键润色</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">💎 润色结果</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制润色结果</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const polishMap={
'非常':'highly','我觉得':'From my perspective','很好的':'highly promising','一点':'some extent','继续':'pursue',
'提高':'enhance','重要':'significant','发现':'identified','帮助':'facilitate','真的':'genuinely',
'good':'excellent','very':'considerably','think':'believe','continue':'proceed','can':'are able to','improve':'refine','like':'appreciate','need':'require'};
const upgrade={
'good':'promising','very good':'highly promising','I think':'I believe','we should continue':'we should press forward with',
'continue':'carry on','improve':'refine','a little':'incrementally','important':'significant','big':'substantial',
'very':'highly','need':'are required to','make':'foster','do':'carry out','help':'facilitate','problem':'challenge',
'show':'demonstrate','use':'leverage','get':'obtain','many':'numerous'};
const goalIntro={
'学术':'polished for an academic tone, with precise and formal diction.',
'商务':'polished to a clear, professional business tone.',
'日常':'polished to sound natural and conversational.',
'正式':'polished to a polished, formal register.'};
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 英文写作润色 | AgentGongju.com'))return;
const src=document.getElementById('src').value.trim();
if(!src){alert('请先输入英文原文');return;}
const goal=document.getElementById('goal').value;
const opt=document.getElementById('opt').value;
// 简单替换式润色演示
function polish(s){
let out=s;
// 词级替换
Object.keys(upgrade).forEach(k=>{
const re=new RegExp('\\b'+k+'(?![a-z])','gi');out=out.replace(re,upgrade[k]);
});
return out;
}
const polished=polish(src);
let res='【Polished English】\n'+polished+'\n';
if(opt!=='only'){
res+='\n【中文翻译】\n'+'（此处为示例：实际接入大模型后可产出高质量翻译） '+src.length>0?'译文参考：即原文中译，接入引擎可用。':'';
res+='\n【润色说明】\n· Targeted register: '+goalIntro[goal]+'\n· 已将重复/口语化表达替换为更精准的正式词汇（如 very→considerably, good→promising）。\n· 标点与句式结构保持完整，可继续由人工调整语序；接入大模型可逐句改写。';
}
if(opt==='brief')res='【Polished】\n'+polished+'\n【说明】已按「'+goal+'」语境优化措辞。';
document.getElementById('outputBox').innerText=res;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 已复制！'))}
</script>
</body>
</html>
