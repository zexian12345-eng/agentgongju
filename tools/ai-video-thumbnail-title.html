<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 短视频封面标题生成 | AgentGongju.com</title>
<meta name="description" content="输入视频主题，一键生成抓眼球的封面大字标题、左上角标签与封面文字排版建议">
<meta name="keywords" content="短视频封面,封面标题,视频标题,抖音封面,封面文案">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2.2;white-space:pre-wrap;font-size:.92rem;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>
var _hmt = _hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";
  var s = document.getElementsByTagName("script")[0];
  s.parentNode.insertBefore(hm, s);
})();

<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>⚡ AI 短视频封面标题</h1><p>抓眼球大字标题 + 角标标签 + 排版建议，让封面自带点击欲</p></div>

<div class="card">
<label>🎬 视频主题 / 一句话核心</label>
<textarea id="topic" placeholder="例：一个普通上班族靠下班3小时学Python，3个月接单月入2万"></textarea>
<div class="param-row">
<div><label>📱 发布平台</label>
<select id="plat"><option>抖音</option><option>快手</option><option>小红书</option><option>B站</option><option>视频号</option></select></div>
<div><label>🎭 内容情绪</label>
<select id="emo"><option value="震惊">😱 反差/震惊</option><option value="干货">💡 干货教学</option><option value="干货2">📚 干货教学</option><option value="共鸣">💬 情感共鸣</option><option value="好奇">🤔 引发好奇</option></select></div>
</div>
<label>✍️ 期望风格标题数量</label>
<select id="count"><option value="3">3 个备选</option><option value="5">5 个备选</option></select>
<button class="btn-gen" id="genBtn" style="margin-top:8px">🔍 生成封面标题</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 封面文案方案已生成</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制全部方案</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const digs={};
function short(t){return t.length>38?t.slice(0,38)+'…':t;}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 短视频封面标题 | AgentGongju.com'))return;
const topic=document.getElementById('topic').value.trim();
const plat=document.getElementById('plat').value;
const emo=document.getElementById('emo').value;
const n=parseInt(document.getElementById('count').value);
if(!topic){alert('请先输入视频主题');return;}
const first=topic.split(/[，。,]/)[0]||topic.slice(0,12);
const num=extractNum(topic);
let pool=[];
if(emo==='震惊'){pool=['万万没想到，'+short(topic),'别再说不可能，'+first+'的真实结局','我劝你别学，因为'+(num||'它会')+'改变你的人生','看完这条，你再也不会小看'+first.replace('一个','')];}
else if(emo==='干货'){pool=['干货！'+first+'的3步保姆级教程','存好这份'+first+'避坑清单','学会'+short(topic).slice(0,16)+'，照着做就对了','零基础也能上手的'+first+'全流程']; }
else if(emo==='共鸣'){pool=['如果你也'+(num?('是那'+num):'经历过这个阶段')+'，请看完这条','‘' +first+'’的背后，是多少人的影子','有些路'+(num||'走过')+'的人才懂，比如这条']; }
else{pool=['原来'+first+'还能这样？刷新认知了','99%的人都不知道的'+short(topic).slice(0,14),('为什么'+first+'正在悄悄改变游戏规则'),('三句话讲透'+first) ];}
while(pool.length<n){pool.push('不信你看完这条，'+short(topic.slice(0,22)));}
let out='⚡ 【短视频封面标题方案 · '+plat+'】\n主题：'+topic+'\n';
out+='━━━━━━━━━━━━━━━━\n📌 强封面大字标题（适合大字压图）：\n';
pool.slice(0,3).forEach((p,i)=>out+=(i+1)+'. '+p+'\n');
out+='\n🏷 左上角标签角标（3-6字，增强信息）:\n';
out+='  方案A：跟着做｜真的不难\n  方案B：亲测有效｜结果真香\n  方案C：三分钟｜看完就会\n\n';
out+='📝 封面小字补充（角标下方/标题角落）：\n';
out+='  › 建议用你视频中最有冲击力的一帧作为底图\n  › 大字画龙点睛不超过9个字，保证手机缩略图可读\n  › 可加一组箭头/红圈引导视线到你想强调的位置\n\n';
out+='📎 平台细节建议（'+plat+'）：\n'+platTip(plat);
out+='\n\n💡 测封小技巧：把前三个标题都做一版发素材测3-5条，同内容留数据最好的前三，秒内流失最低的即是胜者。';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
function extractNum(s){const m=s.match(/(\d+(?:\.\d+)?)\s*(万|k|百|千)?/);return m?m[0]:'';}
function platTip(pl){const m={'抖音':'封面大小建议9:16竖版，文字放在上方中上部安全区，避免被右侧“更多”按钮遮挡。','快手':'大字标题+对比色描边更吸睛，快手老铁更吃真实画面感的封面。','小红书':'封面尺寸3:4为佳，标题文字2-3行为宜，可叠加emoji小贴纸增加可读性。','B站':'标题+封面呼应有梗最好，但尽量避免标题党过度，左屏保留信息。','视频号':'中老年及下沉用户居多的号文字宜大、对比强、色彩明快，避免花哨字体。'};return m[pl]||'字号加大、对比清晰、信息前置。';}
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 封面文案已复制！'))}
</script>
</body>
</html>
