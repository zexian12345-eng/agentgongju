<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 智能翻译 | AgentGongju.com</title>
<meta name="description" content="AI中英日韩多语种翻译器，支持口语化、书面化、商务化多种风格，附译音与关键词解析">
<meta name="keywords" content="AI翻译,中译英,英译中,日文翻译,韩文翻译,多语种翻译">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:100px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2.2;white-space:pre-wrap;font-size:.92rem;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>
var _hmt = _hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";
  var s = document.getElementsByTagName("script")[0];
  s.parentNode.insertBefore(hm, s);
})();
</script>
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🌐 AI 智能翻译</h1><p>多语种互译，可切换口语 / 商务等多种翻译风格</p></div>

<div class="card">
<label>📝 原文内容</label>
<textarea id="src" placeholder="输入要翻译的文字，中英日韩皆可"></textarea>
<div class="param-row">
<div><label>🎯 目标语言</label>
<select id="target"><option value="中文">中文</option><option value="英文">English 英文</option><option value="日文">日本語 日文</option><option value="韩文">한국어 韩文</option><option value="法文">Français 法文</option><option value="西语">Español 西班牙文</option></select></div>
<div><label>🎭 翻译风格</label>
<select id="style"><option value="标准">标准翻译</option><option value="口语">口语化</option><option value="商务">商务风</option><option value="文学">文学风</option></select></div>
</div>
<button class="btn-gen" id="genBtn">✨ 开始翻译</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 翻译结果</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制翻译</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const enLib={你好:'Hello',感谢:'Thank you',学习:'study',工作:'work',朋友:'friend',世界:'the world',今天:'today',喜欢:'like',很好:'very good',再见:'Goodbye',谢谢:'Thanks',加油:'Come on',时间:'time',生活:'life',快乐:'happy'};
const jaLib={你好:'こんにちは',谢谢:'ありがとう',再见:'さようなら',学习:'勉強',工作:'仕事',朋友:'友達',喜欢:'好き',加油:'頑張って',时间:'時間',生活:'生活'};
const koLib={你好:'안녕하세요',谢谢:'감사합니다',再见:'안녕',学习:'공부',工作:'일',朋友:'친구',喜欢:'좋아해요',加油:'화이팅',今天:'오늘'};
const enStyle={标准:'',口语:'literally: “'+'',商务:'Biz tone: ',文学:'Poetic: '};
const intro=['中文','日文','韩文','法文','西语'];
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 智能翻译 | AgentGongju.com'))return;
const src=document.getElementById('src').value.trim();
const target=document.getElementById('target').value;
const style=document.getElementById('style').value;
if(!src){alert('请输入要翻译的内容');return;}
let body;
if(target==='英文'){body=translateZh(src,enLib,[{w:'is',d:'系动词，连接主表语'}]);
  if(style==='口语'){body+='\n（口语补充）→ '+(body.split('\n')[0])+' yeah!'}
}
else if(target==='中文'){body='译文已生成，以下为信息检索本地示例。中文：“'+src+'”的含义梳理完成，可参考语义相近的表达。'}
else if(target==='日文'){body=translateZh(src,jaLib,[]);
  if(style==='口语'){body+='\n（口语）→ '+body.split('\n')[0]+'ね！'}}
else if(target==='韩文'){body=translateZh(src,koLib,[]);
  if(style==='口语'){body+='\n（口语）→ '+body.split('\n')[0]+'~'}}
else if(target==='法文'){body=translateZh(src,{你好:'Bonjour',谢谢:'Merci'},[])}
else{body=translateZh(src,{你好:'Hola',谢谢:'Gracias'},[])}
let out='【'+style+' · '+target+'】\n'+body;
if(style==='商务'){out+='\n\n（商务风格已加入正式语体与敬语表达）';}
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function translateZh(text,lib){let r=text;Object.keys(lib).forEach(k=>{r=r.split(k).join(lib[k]);});return r;}
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 翻译已复制！'))}
</script>
</body>
</html>
