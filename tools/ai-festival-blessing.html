<script>
const FEST={
'中秋节':['月圆人圆事事圆，愿这捧桂香替你捎去牵挂，阖家安康常团圆。','把月饼分两次吃：一口给想你的人，一口留给自己慢慢甜。','海上生明月，愿你好梦都圆满。','月光会替我说：常联系，常回家看看。'],
'春节除夕':['爆竹声中辞旧岁，愿你新岁胜旧岁，朝朝如愿、岁岁平安。','此心安处是吾乡，新年快乐，把好运气都拥进怀里。','除夕围炉夜，愿烟火年年，岁岁常相见。','愿你以梦为马，来年一路生花，新年胜意。'],
'元宵节':['汤圆甜，灯笼红，愿你所求皆圆满，所行皆坦途。','把滚烫的祝福揉进元宵，一口一个软糯幸福。','上元灯火处，愿有人陪你共赏这一轮圆月。','愿日子像汤圆一样，甜在里头，圆圆满满。'],
'母亲节':['你曾把最好的都给了我，今天换我把浪漫与体贴都留给你。','妈妈，谢谢你用唠叨把我唠叨大，愿岁月对你温柔以待。','你的爱从不说教，都藏在每一顿热饭里。节日快乐，妈妈。','愿天上人间，您永远平安喜乐，被爱包围。'],
'父亲节':['你话不多，却把整个家扛成了我远行的底气。节日快乐，爸。','你的背影，是我这辈子翻山越岭的坐标。','小时候你驮我，长大后换我牵你。父亲节快乐。','愿你的脊背虽弯，笑得却比谁都松快。'],
'教师节':['一支粉笔两袖清风，愿桃李芬芳，恩师安康。','您把知识点亮成灯，照亮我们看过更远的世界。老师，辛苦了。','三寸讲台，一生守望，愿您岁月无恙，桃李满园。','谢谢您教会我奔跑，也教会我跌倒后起身。'],
'妇女节':['愿你生而不被定义，活得自由且尽兴，节日快乐。','愿你的美好，被全世界认真收藏。','身为四季都要可爱的你，妇女节快乐呀。','愿你成为自己的太阳，无需借谁的光。'],
'国庆节':['生在红旗下的浪漫，是无论多远，心都向着家国。节日快乐。','愿山河无恙，人间皆安，你我都有奔头。','把蛋糕分给岁月，把热爱留给家国。','此刻微风不燥，愿你我共享这举国同庆的红。'],
'情人节':['遇见你之后，节日都变成了日常，日常又都像节日。','我攒了很久的心跳，今天想一次性都给你。','愿岁岁年年，牵手的都是同一个人。','你是我平凡生活里，揉碎星空的那一点甜。'],
'端午节':['粽叶包裹的是情意，安康是对你最好的期许。端午安康。','愿这抹艾草香，为你驱走一整年的小烦扰。','把咸甜和安康，都包进这一颗粽子里送给你。','端午临中夏，愿你百毒不侵，诸事顺遂。'],
'重阳节':['九九重阳，愿长辈登高望远，身康体健，福寿绵长。','岁岁重阳今又重阳，愿您被岁月温柔以待。','遍插茱萸，情长意更长，重阳安康。','愿登高的人有远见，思念的人常团圆。'],
'立春':['立春到，冰雪消，愿你心里的春天也抢先一步发芽。','一年之计在于春，愿你从今天起，向阳生长。','把冬天的遗憾，都还给冬天，立春一过皆是新生。','春风十里，都不如你重新出发的勇气。'],
'立秋':['云天收夏色，木叶动秋声，愿你的这个秋，是收获也温柔。','一枕新凉一扇风，立秋愿你心静自然安。','夏天的事慢慢收尾，秋天的好事正在路上。','趁著秋风起，把日子过成喜欢的样子。'],
'二十四节气·通用':['顺应时节好好生活，愿你在每个节气里，都被自然温柔以待。','愿你循着二十四节气的节奏，把日子过得有滋有味。','此一刻天地交泰，愿你也顺天应时，岁岁常欢喜。','春有百花秋有月，愿你四季皆有可期。']
};
const WHO={
'长辈亲友':['提一句「阖家 / 安康 / 常回家看看」最戳心'],
'另一半':['带一点「遇见你 / 想 / 甜」的私语'],
'好朋友':['用「约饭 / 见面 / 一起」制造下一次见面盼头'],
'同事领导':['客气得体，「顺遂 / 顺利 / 共勉」为主'],
'客户伙伴':['强调「合作 / 双赢 / 期待继续」'],
'老师':['用「感谢 / 桃李 / 辛苦了」收尾'],
'自己(发朋友圈)':['写给自己，带一点自我鼓励与松弛感']
};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI节日节气祝福短句生成 | AgentGongju.com'))return;
const fest=document.getElementById('fest').value;
const wto=document.getElementById('to').value;
const name=document.getElementById('name').value.trim();
const target=name?name:(wto==='长辈亲友'?'你':(wto==='另一半'?'亲爱的':(wto==='老师'?'老师':'你')));
const pool=shuffle([...FEST[fest]]);
const pick2=pool.slice(0,2);
let r='【'+fest+' · 给'+target+'的祝福】\n\n';
pick2.forEach((s,i)=>{ r+=('✨ '+(i+1)+'. ')+ (name? s : s.replace(/你/g,target)) +'\n\n'; });
r+='──— 搭配建议 —──\n'+WHO[wto][0]+'。发微信前记得@对方大名，更显真诚。';
document.getElementById('outputBox').innerText=r;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 祝福已复制！'))}
</script>
