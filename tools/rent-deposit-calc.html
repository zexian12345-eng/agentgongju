<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>租房押金计算器 | AgentGongju.com</title>
<meta name="description" content="输入月租、押几付几、是否含水电网等，快速算清签约首笔支出、中介费、水电网预估与入住预算，帮你租房心里有数不踩坑。">
<meta name="keywords" content="租房,押金,付几押几,房租计算,租房预算,中介费,押一付三,房租">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
textarea,input[type=text],select,input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.sum-card{background:rgba(255,255,255,0.04);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:16px;text-align:center}
.sum-card .num{font-size:1.4rem;font-weight:700;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sum-card .lb{color:#94a3b8;font-size:.8rem;margin-top:4px}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;font-size:.92rem;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.param-grid,.summary{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🏠 租房押金计算器</h1><p>签约前先算清要掏多少钱，心里有数不踩坑</p></div>

<div class="card">
<div class="param-grid">
<div><label>💰 月租金(元)</label><input type="number" id="rent" value="3000" min="0"></div>
<div><label>📋 付款方式</label><select id="paytype"><option value="31">押一付三</option><option value="11">押一付一</option><option value="12">押一付二</option><option value="21">押二付一</option><option value="21m">押二付三</option></select></div>
</div>
<div class="param-grid">
<div><label>🏠 是否有中介费</label><select id="agent"><option value="0">无（直租/转租）</option><option value="50" selected>半个月房租</option><option value="100">一个月房租</option></select></div>
<div><label>🧾 水电燃气预估(元/月)</label><input type="number" id="utils" value="150" min="0"></div>
</div>
<button class="btn-gen" id="genBtn">🧮 计算首笔支出</button>
<label style="margin-top:12px;color:#64748b;font-size:.8rem">* 部分城市中介费费率不同，结果仅供参考</label>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">💳 签约首笔支出明细</div>
<div class="summary" id="summary"></div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制预算清单</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
document.getElementById('genBtn').addEventListener('click',function(){
if(!Paywall.countUse('租房押金计算器 | AgentGongju.com'))return;
const rent=parseFloat(document.getElementById('rent').value)||0;
const paytype=document.getElementById('paytype').value;
const agentOpt=document.getElementById('agent').value;
const utils=parseFloat(document.getElementById('utils').value)||0;
const [depositN,monthN]=paytype.split('m').length>1?[paytype.split('m')[0].split('')[1]||'1',paytype.split('m')[1]]:(paytype==='11'?['1','1']:paytype==='12'?['1','2']:paytype==='21'?['2','1']:paytype==='31'?['1','3']:['2','3']);
const deposit=rent*parseInt(depositN);
const months=parseInt(monthN);
const monthlyRent=rent*months;
const agent=agentOpt==='0'?0:rent*(agentOpt==='50'?0.5:1);
const total=deposit+monthlyRent+agent;
const firstMonthCost=deposit+rent*months+agent+utils;
const summary=document.getElementById('summary');summary.innerHTML='';
[['押金','¥'+deposit.toLocaleString()],['首期房租','¥'+monthlyRent.toLocaleString()],['中介费','¥'+agent.toLocaleString()],['首笔合计','¥'+firstMonthCost.toLocaleString()]].forEach(([k,v])=>{
summary.innerHTML+=`<div class="sum-card"><div class="num">${v}</div><div class="lb">${k}</div></div>`;
});
let out='【签约首笔支出明细】\n';
out+='· 月租金：¥'+rent.toLocaleString()+'\n';
out+='· 付款方式：押'+depositN+'付'+monthN+'\n';
out+='· 押金：'+depositN+'个月 = ¥'+deposit.toLocaleString()+'\n';
out+='· 首期房租：'+monthN+'个月 = ¥'+monthlyRent.toLocaleString()+'\n';
out+='· 中介费：'+(agent? '¥'+agent.toLocaleString() : '无')+'\n';
out+='· 水电燃气(首月预缴)：¥'+utils.toLocaleString()+'\n\n';
out+='【首月一次性支出】¥'+firstMonthCost.toLocaleString()+'（不含搬家、置物等）\n\n';
out+='【后续每月固定支出】\n';
out+='· 房租 ¥'+rent.toLocaleString()+' + 水电网约 ¥'+utils.toLocaleString()+' = 约 ¥'+(rent+utils).toLocaleString()+'/月\n\n';
out+='【租房温馨提醒】\n· 签约前确认押金退还规则与房屋设施清单，拍照留底。\n· 问清水电网费是民用还是商用电价，账单差距很大。\n· 转租/二房东需核实对方与房东的原始合同。\n· 警惕“先交定金再看房”的套路，正规都应先看房。';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){const el=document.getElementById('outputBox');const sum=document.getElementById('summary').innerText.replace(/¥/g,'¥ ');navigator.clipboard.writeText(sum+'\n'+el.innerText).then(()=>alert('✅ 预算清单已复制！'))}
</script>
</body>
</html>
