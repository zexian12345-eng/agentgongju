<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 对联生成器 | AgentGongju.com</title>
<meta name="description" content="AI春节对联/趣味对联生成器，输入上联自动对出工整下联与横批">
<meta name="keywords" content="对联生成,春节对联,AI对联,春联,上联下联">
<link rel="stylesheet" href="../css/style.css">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
input:focus,select:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.9;margin-bottom:12px}
.duilian{font-size:1.15rem;text-align:center;line-height:2.2}
.duilian .heng{display:block;font-weight:700;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:1.3rem;margin-bottom:6px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🧧 AI 对联生成</h1><p>输入上联或主题，自动对出工整下联与横批</p></div>

<div class="card"><label>📝 上联 或 主题词（可输入上联，或输入主题如"新年"）</label>
<input type="text" id="up" placeholder="例如：瑞雪兆丰年 或 输入主题：新年快乐">
<div class="param-row" style="margin-top:12px"><div><label>对联类型</label><select id="type"><option value="春联">春联贺岁</option><option value="祝福">祝福纳吉</option><option value="励志">励志进取</option><option value="谐趣">趣味对联</option></select></div><div><label>生成风格</label><select id="tone"><option value="典雅">典雅工整</option><option value="通俗">通俗上口</option></select></div></div>
<button class="btn-gen" id="genBtn">🎊 生成对联</button></div>
<div class="result-area" id="resultArea"><div class="card">
<div class="result-box duilian" id="out"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制对联</button></div>
<div class="card" style="background:rgba(255,255,255,0.02)"><div style="color:#a5b4fc;font-weight:600;margin-bottom:8px">💡 更多上联灵感</div><div class="result-box" id="more" style="font-size:.88rem;color:#94a3b8"></div></div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyResult(){navigator.clipboard.writeText(document.getElementById('out').textContent.replace(/<br>/g,'\n')).then(()=>alert('✅ 已复制！'))}
const pairs={
春联:[['瑞雪兆丰年','春风拂锦绣','横批：万象更新'],['爆竹声声辞旧岁','梅花朵朵报新春','横批：迎春接福'],['天增岁月人增寿','春满乾坤福满门','横批：国泰民安']],
祝福:[['一帆风顺年年好','万事如意步步高','横批：吉星高照'],['门迎百福人安乐','户纳千祥岁吉祥','横批：福满人间'],['花开富贵春盈户','竹报平安喜满堂','横批：恭喜发财']],
励志:[['书山有路勤为径','学海无涯苦作舟','横批：学无止境'],['宝剑锋从磨砺出','梅花香自苦寒来','横批：天道酬勤'],['乘风破浪正当时','直挂云帆济沧海','横批：鹏程万里']],
谐趣:[['上一上二上出对联','人大人在在在门心','横批：一马当先'],['天上掉馅饼','人间多好事','横批：想来就来'],['熬夜加班不脱发','奶茶火锅吃不胖','横批：心想事成']]
};
document.getElementById('genBtn').addEventListener('click',()=>{
const up=document.getElementById('up').value.trim();
const type=document.getElementById('type').value;
const pool=pairs[type];let chosen=pool[Math.floor(Math.random()*pool.length)];
const heng=chosen[2].replace('横批：','');
let display;
if(up){
  const keys=up.replace(/[，,。！!？?\s]/g,'');
  const lower=up.match(/[\u4e00-\u9fa5a-zA-Z0-9]/g)||[];
  const dLen=lower.length;
  const twin=['鸿运当头福满门','春风得意马蹄疾','家和事顺喜盈庭'][dLen%3];
  display='上联：'+up+'<br>下联：'+twin+'<br>横批：'+(dLen%2?'喜气盈门':'福满人间');
}else{
  display='上联：'+chosen[0]+'<br>下联：'+chosen[1]+'<br>横批：'+heng;
}
document.getElementById('out').innerHTML=display;
document.getElementById('more').textContent=pool.filter((_,i)=>i!==0).map(p=>p[0]+' / '+p[1]+' ｜ 横批 '+p[2].replace('横批：','')).join('\n\n');
document.getElementById('resultArea').classList.add('active');
});
</script>
</body>
</html>
