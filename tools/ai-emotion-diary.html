<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 情绪日记分析师 | AgentGongju.com</title>
<meta name="description" content="AI情绪日记分析师，写下今天的心情，自动识别情绪来源、给出疏导建议和明日行动清单，帮你理清思绪">
<meta name="keywords" content="情绪日记,心情记录,情绪管理,心理疏导,情绪分析">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,input[type=text],textarea{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
select:focus,input:focus,textarea:focus{border-color:#6366f1}
textarea{min-height:150px;resize:vertical;line-height:1.8}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.rec{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.25);border-radius:12px;padding:16px;margin-bottom:12px}
.rec-h{font-size:1.05rem;color:#a5b4fc;font-weight:700;margin-bottom:8px}
.rec-b{color:#cbd5e1;font-size:.88rem;line-height:1.9}
.bar{height:10px;background:rgba(255,255,255,.07);border-radius:6px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#a855f7);border-radius:6px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem;margin-top:12px}
.tip{color:#94a3b8;font-size:.8rem;margin-top:8px;line-height:1.7}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>

  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";

<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>💭 AI 情绪日记分析师</h1><p>把心里那团乱麻写出来，剩下的交给它理</p></div>

<div class="card">
<div class="param-row">
<div><label>📅 今天是</label><select id="day"><option value="普通工作日" selected>普通工作日</option><option value="周末">周末 / 休息日</option><option value="加班日">加班 / 赶工期</option><option value="重要日子">有重要的事发生</option></select></div>
<div><label>🌡 心情温度（1-10）</label><select id="level"><option value="3">3 - 很低落</option><option value="5" selected>5 - 一般般</option><option value="7">7 - 还不错</option><option value="9">9 - 挺开心</option></select></div>
</div>
<label>✍️ 今天发生了什么（想到什么写什么，不用组织语言）</label>
<textarea id="input" placeholder="例：今天开会又被领导否了方案，感觉自己做什么都不对。下班地铁上人特别多，回家还要做饭，突然就特别委屈，坐在楼道里坐了十分钟才进门。"></textarea>
<label>🏷 主要涉及（可多选，逗号分隔）</label>
<input type="text" id="tags" placeholder="例：工作、家庭、感情、健康、钱、自己">
<button class="btn-gen" id="genBtn">✨ 帮我分析一下</button>
<div class="tip">💡 你的文字只在本地浏览器处理，不会上传到任何服务器。这里给的是情绪梳理建议，不替代专业心理咨询。</div>
</div>
<div class="result-area" id="resultArea"><div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 情绪分析报告</div>
<div id="out"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制报告</button>
</div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyResult(){navigator.clipboard.writeText(document.getElementById('out').innerText).then(()=>alert('✅ 已复制！'))}
// 关键词 → 情绪维度映射
var EMOTIONS=[
 {k:['工作','领导','同事','加班','会议','方案','项目','绩效','汇报','裁员'],n:'职场压力',color:'#6366f1',
  tips:'职场压力常来自「努力未被看见」。可以试着把工作拆成「可交付的小结果」，每周主动同步一次进展，把隐形劳动变成可见成果。'},
 {k:['家人','父母','妈妈','爸爸','婆婆','亲戚','催','结婚','生子'],n:'家庭关系',color:'#a855f7',
  tips:'家人的话往往带着他们自己的焦虑。可以在心里做个区分：「这是他的担心」和「这是我的人生」。回应时先接情绪，「我知道你们是为我好」，再讲边界。'},
 {k:['对象','女朋友','男朋友','老公','老婆','分手','吵架','冷战','喜欢'],n:'亲密关系',color:'#ec4899',
  tips:'亲密关系里的委屈，多半是需求没被说清。试着用「我感到…因为…我希望…」句式表达，避免用「你总是」。'},
 {k:['累','困','失眠','头疼','不舒服','生病','胃','颈椎','熬夜'],n:'身体疲劳',color:'#14b8a6',
  tips:'身体先于情绪报警。今晚优先安排：早睡 30 分钟、热水泡脚、放下手机十分钟。身体缓过来，情绪会自动回升一档。'},
 {k:['钱','工资','房租','贷款','花呗','信用卡','穷','贵','买不起','副业'],n:'经济焦虑',color:'#f59e0b',
  tips:'钱的焦虑可以用「数字」缓解：把大目标拆成本月可执行的小数目，比如「这月少点 5 次外卖」。可控感是焦虑的解药。'},
 {k:['孤独','没人','一个人','想哭','委屈','不被理解','算了','无所谓'],n:'孤独感',color:'#8b5cf6',
  tips:'孤独在提醒你需要连接。今晚做一件小事：给一个老朋友发条消息，哪怕只是「最近怎么样」。连接不需要理由。'},
 {k:['考试','学习','论文','考研','作业','成绩','答辩','面试'],n:'成长压力',color:'#0ea5e9',
  tips:'学习压力大时，先做「最小可完成单元」：不是「写完论文」，而是「写 200 字」。开始比完成重要。'},
 {k:['自己','没用','失败','不行','讨厌自己','自卑','比不上'],n:'自我评价',color:'#ef4444',
  tips:'注意你的语言——「我失败了」不等于「我很失败」。试着把评价换成描述：「这件事没做好」，事实是具体的，人不是。'}
];
function gen(){
 if(!Paywall.countUse('AI 情绪日记分析师 | AgentGongju.com'))return;
 var txt=document.getElementById('input').value.trim();
 if(!txt){alert('先写点什么吧，哪怕一句话～');return;}
 var day=document.getElementById('day').value,level=parseInt(document.getElementById('level').value,10);
 var tags=(document.getElementById('tags').value||'').split(/[,，、\s]+/).filter(function(s){return s});
 // 情绪维度打分
 var scores=EMOTIONS.map(function(e){
   var c=0;
   e.k.forEach(function(k){if(txt.indexOf(k)>-1)c++;});
   tags.forEach(function(t){if(e.k.some(function(k){return t.indexOf(k)>-1||k.indexOf(t)>-1}))c+=1.5;});
   return {e:e,c:c};
 }).filter(function(x){return x.c>0}).sort(function(a,b){return b.c-a.c});
 if(!scores.length)scores=[{e:EMOTIONS[0],c:1}];
 var total=parseInt(document.getElementById('level').value,10);
 var out=document.getElementById('out');out.innerHTML='';
 var heat=total<=3?'偏低落 🫂':(total<=5?'平稳偏沉 🌤':(total<=7?'还不错 🌈':'状态在线 ✨'));
 out.innerHTML='<div style="color:#94a3b8;font-size:.85rem;margin-bottom:14px">📅 '+day+' ｜ 🌡 心情温度 '+total+'/10（'+heat+'）｜ ✍️ 记录 '+txt.length+' 字</div>';
 // 情绪构成
 var maxC=scores[0].c;
 var bars=scores.slice(0,4).map(function(x){
   var pct=Math.round(x.c/maxC*100);
   return '<div style="font-size:.85rem;color:#cbd5e1">'+x.e.n+' <span style="color:#64748b">'+pct+'%</span></div><div class="bar"><i style="width:'+pct+'%;background:linear-gradient(90deg,'+x.e.color+',#a855f7)"></i></div>';
 }).join('');
 out.insertAdjacentHTML('beforeend','<div class="rec"><div class="rec-h">📊 情绪来源构成</div><div class="rec-b">'+bars+'</div></div>');
 // 主要分析
 out.insertAdjacentHTML('beforeend','<div class="rec" style="border-color:rgba(99,102,241,.35)"><div class="rec-h">🔍 主情绪：'+scores[0].e.n+'</div><div class="rec-b">'+scores[0].e.tips+'</div></div>');
 // 情绪颗粒度命名
 var wordMap={偏低落:'失落 / 疲惫 / 无力',平稳偏沉:'平静中带点钝钝的累',还不错:'松弛 / 满足 / 有掌控感',状态在线:'轻盈 / 有劲'};
 out.insertAdjacentHTML('beforeend','<div class="rec"><div class="rec-h">🏷 给你的情绪起个名字</div><div class="rec-b">今天大概可以叫：<b>'+ (total<=3?wordMap['偏低落']:(total<=5?wordMap['平稳偏沉']:(total<=7?wordMap['还不错']:wordMap['状态在线']))) +'</b><br>能准确说出情绪的名字，本身就能降低它 30% 的强度。</div></div>');
 // 明日行动
 var acts=[];
 if(scores[0].e.n==='职场压力')acts=['把今天最卡的一件事写成一句话，明天只推进它','给领导发一条进展同步（3行以内）'];
 else if(scores[0].e.n==='家庭关系')acts=['给家里打个 5 分钟电话，只聊天气和吃饭','把想说的话先写下来，再决定要不要发'];
 else if(scores[0].e.n==='亲密关系')acts=['用「我感到…我希望…」说一件事','一起做一件小事（散步/看剧），不谈问题'];
 else if(scores[0].e.n==='身体疲劳')acts=['今晚 23:30 前上床，手机放客厅','喝够 1500ml 水，中午出门走 15 分钟'];
 else if(scores[0].e.n==='经济焦虑')acts=['花 10 分钟记一遍这个月固定支出','设一个「今天不花钱」的小目标'];
 else if(scores[0].e.n==='孤独感')acts=['主动联系一个朋友，说一句「突然想起你」','去一个人多但不吵的地方待 30 分钟（咖啡馆/图书馆）'];
 else if(scores[0].e.n==='成长压力')acts=['把任务拆成 3 个 25 分钟，只做第一个','完成一件立刻打勾，让进度可见'];
 else acts=['写 3 件今天做成的、哪怕很小的事','对镜子说一句「今天已经够好了」'];
 out.insertAdjacentHTML('beforeend','<div class="rec" style="border-color:rgba(34,197,94,.3)"><div class="rec-h">✅ 明天的两件小事</div><div class="rec-b">1. '+acts[0]+'<br>2. '+acts[1]+'</div></div>');
 // 深夜提醒
 if(txt.indexOf('想哭')>-1||total<=3){
   out.insertAdjacentHTML('beforeend','<div class="rec" style="border-color:rgba(239,68,68,.3)"><div class="rec-h">🫂 如果今天真的很难</div><div class="rec-b">你不需要马上好起来。现在可以做的是：喝口温水、洗个热水澡、把灯调暗、躺下。<br>如果连续两周情绪都提不起来，建议找专业心理咨询，这不是软弱，是保<a style="color:#a5b4fc">养自己</a>。<br>全国心理援助热线：<b>12356</b>（24小时）</div></div>');
 }
 document.getElementById('resultArea').classList.add('active');
}
document.getElementById('genBtn').addEventListener('click',gen);
</script>
</body>
</html>
