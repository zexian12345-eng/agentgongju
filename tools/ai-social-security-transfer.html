<div class="tool-header"><h1>🪪 AI 社保转移接续攻略</h1><p>养老/医疗/公积金跨省转移全流程</p></div>
<div class="card">
<div class="param-row">
<div><label>📦 要转移什么</label>
<select id="item">
<option value="all">养老＋医疗＋公积金都转</option>

</select></div>
<div><label>🧭 转移方向</label>
<select id="dir">
<option value="in">外地 → 本市（新入职）</option>
<option value="out">本市 → 外地（要走了）</option>
<option value="both">两地来回换过好几次</option>
</select></div>
</div>
<div class="param-row">
<div><label>👔 就业状态</label>
<select id="job"><option value="employed">已在新城市入职（单位缴）</option><option value="self">灵活就业/自己缴</option><option value="gap">暂时没工作</option><option value="retire">快退休了，要合并</option></select></div>
<div><label>⏳ 参保年限</label>
<select id="years"><option value="low">不满 5 年</option><option value="mid" selected>5-10 年</option><option value="high">10 年以上</option><option value="near">接近 15 年</option></select></div>
</div>
<button class="btn-gen" id="genBtn">📋 生成转移攻略</button>
<div class="tips">💡 社保转移是"跟着人走"的，多地参保不会作废，但退休前一定要合并到一处。</div>
</div>

<script>
var ITEM={
all:'养老保险＋医疗保险＋住房公积金（最常见组合）',
pension:'仅养老保险',
medical:'仅医疗保险',
fund:'仅住房公积金'
};
function gen(){
var item=ITEM[document.getElementById('item').value];
var dir=document.getElementById('dir').value;
var job=document.getElementById('job').value;
var years=document.getElementById('years').value;
var out='════ 社保转移接续攻略 ════\n\n';
out+='本次要办：'+item+'\n';
out+='\n──── 🧠 先搞懂 3 件事 ────\n';
out+='1. 养老保险：可以跨省转移，缴费年限累计计算，个人账户全额转移＋统筹部分按比例转移；\n';
out+='2. 医疗保险：可以转移，缴费年限累计，个人账户余额可随转移（部分地区需单独申请）；\n';
out+='3. 住房公积金：可以转移，余额全额随人走。\n';
out+='★ 关键：多地参保记录不会清零，最终退休时合并到待遇领取地即可。\n\n';
out+='──── 📱 办理入口（线上优先）────\n';
out+='· 国家社会保险公共服务平台（si.12333.gov.cn）→「社保转移申请」\n';
out+='· 「掌上 12333」App → 社保转移\n';
out+='· 电子社保卡（微信/支付宝小程序）→ 社保转移\n';
out+='· 医保：国家医保服务平台 App → 跨省转移接续\n';
out+='· 公积金：全国住房公积金小程序 → 转移接续（异地转移）\n\n';
out+='──── 🚶 具体流程 ────\n';
if(dir!=='out'){
out+='【外地 → 本市】\n';
out+='① 先在新城市正常参保（单位缴或自己缴），有参保记录才能发起转入；\n';
out+='② 打开掌上 12333 或国家社保平台，选择"社保转移申请"；\n';
out+='③ 填写原参保地与新参保地，提交申请；\n';
out+='④ 新参保地社保机构审核后，向原参保地发起联系函；\n';
out+='⑤ 原参保地办理转出并划转基金，全程线上，一般 15-45 个工作日；\n';
out+='⑥ 可在平台查询进度，无需两地跑。\n';
}
if(dir!=='in'){
out+=dir==='both'?'\n【多地来回换过】\n':'\n【本市 → 外地】\n';
out+='① 确认原单位已为你办理"停保"（离职当月通常次月停保）；\n';
out+='② 到新城市参保后，由新城市发起转入（如今基本不用自己跑原城市）；\n';
out+='③ 若新城市要求提供《参保缴费凭证》，可在原城市社保 App 自助打印；\n';
out+='④ 公积金离职后可选择"封存"，到新城市后办理异地转移即可，余额不会丢。\n';
}
out+='\n──── 📄 可能需要准备的材料 ────\n';
out+='· 身份证（原件或电子身份证）\n· 社保卡\n· 原参保地《基本养老保险参保缴费凭证》（部分地区已免）\n· 新单位劳动合同或参保记录\n· 公积金转移需提供新城市公积金账号\n';
out+='\n──── ⏳ 年限提醒（你的情况）────\n';
if(years==='low')out+='不满 5 年：年限较短，转移流程一样，但影响不大，可等工作稳定后再统一办。';
else if(years==='mid')out+='5-10 年：已经有相当积累，务必办理转移，别让年限断档。';
else if(years==='high')out+='10 年以上：年限价值很高，建议尽早合并，避免退休时才发现记录分散。';
else out+='接近 15 年：⚠️ 这是退休领养老金的最低门槛，务必确保年限连续、多地记录已合并，差 1 年都影响领取。';
out+='\n\n──── 👔 就业状态对应做法 ────\n';
if(job==='employed')out+='已入职：由新单位正常缴纳后，自己在线上发起转入申请即可，单位不会代办转移。';
else if(job==='self')out+='灵活就业：以个人身份在新城市参保（多数城市需本地户籍或居住证），参保后同样可申请转移。';
else if(job==='gap')out+='暂无工作：社保会中断，建议以灵活就业身份自缴，或找正规机构代缴（注意假代缴风险），别长时间断缴影响医保报销与购房资格。';
else out+='快退休：务必在退休前把所有参保地记录合并到待遇领取地（通常是户籍地或最后参保满 10 年的城市），可到社保局窗口办理"多地合并"。';
out+='\n\n──── ⚠️ 常见坑 ────\n';
out+='1. 医保断缴次月起可能无法报销，连续缴纳年限还会被清零（影响大病门诊额度）；\n';
out+='2. 部分城市购房、落户、摇号要求"连续缴纳"，一断就得重新计算；\n';
out+='3. 公积金转移需要新单位已开户并缴存，否则先封存；\n';
out+='4. 转移不需要"退保"，任何要求你先退保再重新缴的说法都是错的；\n';
out+='5. 跨省转移不用跑两趟，网上办理即可，收费代办基本都是骗钱。\n';
out+='\n☎️ 全国社保服务热线：12333　｜　公积金热线：12329\n';
return out;
}
</script>
