<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 智能标题生成 | AgentGongju.com</title>
<meta name="description" content="AI智能标题生成，输入文章或视频主题，一键生成高点击、有钩子的标题，公众号、短视频、知乎爆款标题必备">
<meta name="keywords" content="标题生成,爆款标题,文章标题,短视频标题,自媒体,内容创作">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.title-item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.25);border-radius:12px;padding:14px 18px;margin-bottom:12px}
.title-item .t{color:#e2e8f0;font-size:.95rem;flex:1}
.mini-copy{padding:6px 14px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.8rem;white-space:nowrap}
.mini-copy:hover{background:rgba(99,102,241,0.25)}
.labels{display:flex;gap:6px;margin-bottom:6px}
.lb{font-size:.7rem;color:#a855f7;background:rgba(168,85,247,0.12);padding:2px 8px;border-radius:12px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>
var _hmt = _hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";
  var s = document.getElementsByTagName("script")[0];
  s.parentNode.insertBefore(hm, s);
})();
</script>
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🔥 AI 智能标题生成</h1><p>给干货配一个让人忍不住点进去的好标题</p></div>

<div class="card">
<label>✨ 文章/视频的核心内容或主题</label>
<textarea id="topic" placeholder="例如：普通人如何利用下班后的2小时，通过AI副业赚到第一桶金"></textarea>
<div class="param-row">
<div><label>📱 发布平台</label>
<select id="platform">
<option value="公众号">📖 公众号</option>
<option value="短视频">🎬 短视频</option>
<option value="知乎">🧠 知乎</option>
<option value="头条">📰 今日头条</option>
<option value="小红书">📕 小红书</option>
</select></div>
<div><label>🎯 标题风格</label>
<select id="style">
<option value="悬念">❓ 悬念钩子</option>
<option value="干货">📚 干货清单</option>
<option value="反差">🎭 反差反转</option>
<option value="数字">🔢 数字冲击</option>
<option value="共鸣">💗 情感共鸣</option>
</select></div>
</div>
<button class="btn-gen" id="genBtn">✨ 生成标题</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:16px">🎯 推荐标题（点击即可复制）</div>
<div id="titlesBox"></div>
<div style="text-align:right;margin-top:8px"><button class="mini-copy" onclick="copyAll()">📋 复制全部标题</button></div>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function genTitles(topic,style,platform){
const t=topic.replace(/[。！？，,.]/g,'').trim();
const n1=Math.floor(Math.random()*5+7),n2=Math.floor(Math.random()*10+3);
const pool={
'悬念':[`关于${t}，这三个真相没人敢告诉你`, `为什么别人都能${t.replace(/如何|怎么/g,'')}，而你却总是踩坑？`, `看完这篇关于${t}的分析，我沉默了半小时`, `没想到${t}背后，藏着这样的底层逻辑`, `${t}，根本不是你以为的那样`],
'干货':[`一文讲透${t}：从入门到精通`, `${t}，看这一篇就够了（附方法）`, `${t}实操手册：5个步骤直接照抄`, `保姆级教程：${t}，零基础也能学会`],
'反差':[`别人都在${t.replace(/如何|怎么/g,'')}，我做对了一件事彻底反转`, `月薪3千和3万的人，${t.replace(/如何|怎么/g,'')}的最大区别`, `原以为${t}很难，结果上手后发现全是细节`],
'数字':[`${n1}个技巧搞定${t}，最后一个真香`, `${n2}天，我是如何从0到1完成${t}的`, `${t}的${n1}个坑，帮你全避开了`, `记住这${n2}点，${t}不再走弯路`],
'共鸣':[`经历过${t}的人，都懂那种心酸`, `成年人的${t}，从来都不是容易二字`, `关于${t}，我想对曾经迷茫的自己说`, `深夜破防：${t}，原来我们都在逞强`]};
return pool[style]||pool['悬念'];
}
function copyText(t){navigator.clipboard.writeText(t).then(()=>{const b=event.target;const old=b.textContent;b.textContent='✅ 已复制';setTimeout(()=>b.textContent=old,1200);});}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 智能标题生成 | AgentGongju.com'))return;
const topic=document.getElementById('topic').value.trim();
if(!topic){alert('请先输入内容主题');return;}
const style=document.getElementById('style').value;
const platform=document.getElementById('platform').value;
const box=document.getElementById('titlesBox');box.innerHTML='';
const arr=genTitles(topic,style,platform);
window._titles='';
arr.forEach(t=>{
const div=document.createElement('div');div.className='title-item';
div.innerHTML=`<div class="t">${t}</div><button class="mini-copy" onclick="copyText(this.dataset.t)">📋 复制</button>`;
div.querySelector('.mini-copy').dataset.t=t;
box.appendChild(div);
window._titles+=t+'\n';
});
document.getElementById('resultArea').classList.add('active');
});
function copyAll(){navigator.clipboard.writeText('【AI 标题】\n'+window._titles).then(()=>alert('✅ 全部标题已复制！'))}
</script>
</body>
</html>
