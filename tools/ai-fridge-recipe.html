.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem;margin-top:12px}
.tip{color:#94a3b8;font-size:.8rem;margin-top:8px;line-height:1.7}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}

<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🧊 AI 冰箱剩菜菜谱</h1><p>冰箱里有什么就做什么，不浪费还省一顿外卖钱</p></div>

<div class="card">
<label>🥬 冰箱里现有的食材（逗号或顿号分隔）</label>
<textarea id="ing" placeholder="例：鸡蛋、西红柿、半个洋葱、昨天剩的米饭、两根火腿肠、一点菠菜"></textarea>
<div class="param-row">
<div><label>🍳 想做的类型</label><select id="type"><option value="快手炒菜" selected>快手炒菜</option><option value="汤/羹">汤 / 羹</option><option value="主食">米饭/面条类主食</option><option value="凉拌">凉拌 / 小菜</option><option value="随便都行">我不挑，都行</option></select></div>
<div><label>🍽 几个人吃</label><select id="num"><option value="1人" selected>1 人</option><option value="2人">2 人</option><option value="3-4人">3-4 人</option></select></div>
</div>
<div class="param-row">
<div><label>🌶 口味偏好</label><select id="taste"><option value="家常清淡" selected>家常清淡</option><option value="重口下饭">重口下饭</option><option value="酸甜开胃">酸甜开胃</option><option value="少油少盐">少油少盐</option></select></div>
<div><label>⏱ 可花时间</label><select id="time"><option value="15分钟内" selected>15 分钟内</option><option value="30分钟内">30 分钟内</option><option value="慢慢做也行">慢慢做也行</option></select></div>
</div>
<button class="btn-gen" id="genBtn">✨ 生成菜谱</button>
<div class="tip">💡 剩菜安全提示：绿叶菜隔夜后亚硝酸盐升高，务必彻底加热；海鲜类隔夜最好不吃；剩饭冷藏别超过 24 小时。</div>
</div>
<div class="result-area" id="resultArea"><div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 推荐菜谱</div>
<div id="out"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制菜谱</button>
</div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyResult(){navigator.clipboard.writeText(document.getElementById('out').innerText).then(()=>alert('✅ 已复制！'))}
var DISHES=[
 {name:'西红柿炒鸡蛋',need:['西红柿','鸡蛋'],steps:'鸡蛋加一点盐打散，热油炒至凝固盛出；西红柿切块下锅炒出汁，加半勺糖；倒回鸡蛋翻匀，撒葱花出锅。',tag:'快手炒菜',taste:'家常清淡',time:15},
 {name:'洋葱火腿炒饭',need:['米饭','洋葱','火腿'],steps:'洋葱切丁炒香，火腿切丁同炒；下剩饭用铲子压散，淋一勺生抽；中火炒到粒粒分明，撒葱花。',tag:'主食',taste:'重口下饭',time:15},
 {name:'菠菜鸡蛋汤',need:['菠菜','鸡蛋'],steps:'水烧开下菠菜焯10秒捞出；重新烧水调味，淋入蛋液成蛋花；放回菠菜，滴两滴香油。',tag:'汤/羹',taste:'家常清淡',time:15},
 {name:'凉拌菠菜粉丝',need:['菠菜','粉丝'],steps:'粉丝温水泡软，菠菜焯水过凉；蒜末+生抽+香醋+一点糖+辣椒油调汁；拌匀冷藏10分钟更入味。',tag:'凉拌',taste:'酸甜开胃',time:15},
 {name:'西红柿鸡蛋面',need:['西红柿','鸡蛋','面条'],steps:'西红柿炒出沙，加水烧开；下面条煮软；淋蛋液成蛋花，加盐和一点点白胡椒。',tag:'主食',taste:'家常清淡',time:15},
 {name:'洋葱炒蛋',need:['洋葱','鸡蛋'],steps:'洋葱切丝炒到微透明发甜；倒入蛋液，中火慢慢推炒；出锅前撒黑胡椒。',tag:'快手炒菜',taste:'家常清淡',time:15},
 {name:'火腿菠菜炒蛋',need:['火腿','菠菜','鸡蛋'],steps:'菠菜焯水切段；火腿煸香；加蛋液炒散，最后放菠菜，翻炒10秒出锅。',tag:'快手炒菜',taste:'家常清淡',time:15},
 {name:'番茄火腿焗饭',need:['米饭','西红柿','火腿'],steps:'西红柿火腿切丁炒软；下米饭炒匀，加一勺番茄酱；铺上芝士，微波或烤箱焗到融化。',tag:'主食',taste:'酸甜开胃',time:30},
 {name:'洋葱鸡蛋汤',need:['洋葱','鸡蛋'],steps:'洋葱丝炒软出甜味；加水煮开转小火5分钟；淋蛋液，加盐和白胡椒。',tag:'汤/羹',taste:'少油少盐',time:15},
 {name:'菠菜火腿蛋饼',need:['菠菜','火腿','鸡蛋'],steps:'菠菜焯水切碎；所有材料加面粉两勺调成糊；平底锅小火两面煎金黄。',tag:'主食',taste:'家常清淡',time:30}
];
function gen(){
 if(!Paywall.countUse('AI 冰箱剩菜菜谱生成器 | AgentGongju.com'))return;
 var raw=document.getElementById('ing').value.trim();
 if(!raw){alert('先告诉我冰箱里有什么吧～');return;}
 var ings=raw.split(/[,，、;；\s]+/).filter(function(s){return s.length>0});
 var type=document.getElementById('type').value,num=document.getElementById('num').value,taste=document.getElementById('taste').value,time=document.getElementById('time').value;
 var maxT=time==='15分钟内'?15:(time==='30分钟内'?30:999);
 // 计算匹配度
 var scored=DISHES.map(function(d){
   var hit=0;
   d.need.forEach(function(n){if(ings.some(function(i){return i.indexOf(n)>-1||n.indexOf(i)>-1})){hit++;}});
   var cover=hit/d.need.length;
   var missing=d.need.filter(function(n){return !ings.some(function(i){return i.indexOf(n)>-1||n.indexOf(i)>-1})});
   return {d:d,score:cover,missing:missing};
 }).filter(function(x){return x.score>=0.5&&x.d.time<=maxT;});
 // 类型匹配优先
 var typed=scored.filter(function(x){return type==='随便都行'?true:(x.d.tag===type||x.d.tag.indexOf(type)>-1);});
 var list=(typed.length?typed:scored).sort(function(a,b){return b.score-a.score}).slice(0,4);
 var out=document.getElementById('out');out.innerHTML='';
 out.innerHTML='<div style="color:#94a3b8;font-size:.85rem;margin-bottom:14px">🥬 识别食材 '+ings.length+' 种：'+ings.join('、')+' ｜ 🍽 '+num+' ｜ 🌶 '+taste+' ｜ ⏱ '+time+'</div>';
 if(!list.length){
   out.insertAdjacentHTML('beforeend','<div class="rec"><div class="rec-h">😅 现有组合偏少</div><div class="rec-b">目前的食材搭配不出完整的菜。建议补一样基础食材再试：<br>👉 加「鸡蛋」→ 几乎所有蔬菜都能炒<br>👉 加「葱姜蒜」→ 提香全靠它<br>👉 加「生抽/蚝油」→ 调味万能底</div></div>');
 }else{
   list.forEach(function(x,i){
     var d=x.d;
     var miss=x.missing.length?('<span style="color:#f59e0b">（还差：'+x.missing.join('、')+'，可用现有食材替代）</span>'):'<span style="color:#22c55e">（食材齐全 ✅）</span>';
     var el=document.createElement('div');el.className='rec';
     el.innerHTML='<div class="rec-h">'+(i+1)+'. '+d.name+' '+(i===0?'<span style="font-size:.7rem;color:#22c55e;background:rgba(34,197,94,.12);border-radius:20px;padding:2px 10px">最推荐</span>':'')+'</div>'+
     '<div class="rec-b"><b>用料：</b>'+d.need.join('、')+'　'+miss+'<br><b>做法：</b>'+d.steps+'<br><b>耗时：</b>约 '+d.t+' 分钟 ｜ <b>口味：</b>'+d.taste+'</div>';
     out.appendChild(el);
   });
 }
 var tasteTip={家常清淡:'少放盐，用葱姜和食材本味提鲜，出锅前尝一次再补味。',重口下饭:'用生抽+蚝油+一点糖做底味，最后大火收汁，配饭最香。',酸甜开胃:'糖醋比例记住「1勺醋配1勺糖」，热油里先炒糖色更亮。',少油少盐:'用不粘锅+水炒法，先放一勺水再放油，能省一半用油量。'}[taste];
 var d2=document.createElement('div');d2.className='rec';d2.style.borderColor='rgba(34,197,94,.3)';
 d2.innerHTML='<div class="rec-h">🌶 '+taste+' 调味要点</div><div class="rec-b">'+tasteTip+'</div>';
 out.appendChild(d2);
 var d3=document.createElement('div');d3.className='rec';
 d3.innerHTML='<div class="rec-h">♻️ 减少浪费小技巧</div><div class="rec-b">1. 蔬菜剩余可以切碎冷冻，做蛋饼/炒饭时直接下锅。<br>2. 剩饭分装冷冻，微波前喷点水，口感接近新饭。<br>3. 洋葱、胡萝卜、芹菜边角料留着煮高汤，冻成冰块做菜时丢一块。<br>4. 买菜前先看冰箱，按「先吃易坏的」原则排菜单。</div>';
 out.appendChild(d3);
 document.getElementById('resultArea').classList.add('active');
}
document.getElementById('genBtn').addEventListener('click',gen);
</script>
</body>
