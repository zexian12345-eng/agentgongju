<script>
const fallback={};
// 常用中文表达 -> 地道英文
function translate(zh){
const map=[
['赶时间','I\'m in a hurry. Can you make it quick?'],['快点','Could you speed it up, please?'],
['打包','Could I get this to go, please?'],['带走','Take away, please.'],
['洗手间','Excuse me, is there a restroom nearby?'],['厕所','Where\'s the bathroom?'],
['便宜','Can you give me a better price?'],['打折','Any discounts?'],
['请假','I\'m not feeling well. I\'d like to take a day off.'],
['周末','I\'m usually busy during the week, so I just want to kick back and relax on weekends.'],
['谢谢','Thanks a lot! Really appreciate it.'],['对不起','Sorry about that. My bad.'],
['不认识','Sorry, I\'m not from around here.'],['迷路','I think I\'m lost. Can you help me?'],
['多少钱','How much is this?'],['点菜','Could I have the menu, please?'],
['等一下','Hang on a second.'],['好的','Sounds good.']
];
for(const [k,v] of map){
  if(zh.includes(k))return v;
}
// 兜底：口语化拼装
return 'I\'m not sure how to say that exactly, but I mean: "'+zh+'" (想寻求地道说法时，建议分短句表达更自然)';
}
document.getElementById('genBtn').addEventListener('click',function(){
if(!Paywall.countUse('AI日常英语口语 | AgentGongju.com'))return;
const zh=document.getElementById('zh').value.trim();
if(!zh){alert('请输入想说的中文');return;}
const en=translate(zh);
let out='中文：'+zh+'\n\n';
out+='地道英语：\n'+en+'\n\n';
out+='【发音提示】\n· 日常口语多用缩略形式（I\'m、don\'t、gonna），更自然。\n· 关键词重读，句子末尾语调上扬表疑问。\n\n【开口小贴士】\n· 别怕出丑，敢说是第一步。\n· 把常用句练熟，遇到场景脱口而出。\n· 每天读5遍，坚持一周就顺了。🗣';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function setTxt(t){document.getElementById('zh').value=t;}
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 已复制！'))}
</script>
