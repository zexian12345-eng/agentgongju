<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 旅行打包清单 | AgentGongju.com</title>
<meta name="description" content="根据出行天数、目的地类型与季节，智能生成个性化行李打包清单，重要物品一个不落">
<meta name="keywords" content="打包清单,旅行清单,行李清单,出行准备,旅行物品,出门必备">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.9;white-space:pre-wrap;font-size:.92rem;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>
var _hmt = _hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";
  var s = document.getElementsByTagName("script")[0];
  s.parentNode.insertBefore(hm, s);
})();
</script>
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🎒 AI 旅行打包清单</h1><p>出门前看一眼，重要物品一个不落</p></div>

<div class="card">
<label>🌏 出行天数</label>
<select id="days"><option value="1-3天">1-3 天</option><option value="4-7天" selected>4-7 天</option><option value="8天以上">8 天以上</option></select>
<div class="param-row">
<div><label>🏔 目的地类型</label>
<select id="dest"><option value="城市">🏙 城市观光</option><option value="海边" selected>🌊 海边度假</option><option value="山区">⛰ 山区/户外</option><option value="出国">🌍 出国游</option></select></div>
<div><label>☀️ 出行季节</label>
<select id="season"><option value="夏季" selected>☀️ 夏季</option><option value="冬季">❄️ 冬季</option><option value="春秋">🍂 春秋</option></select></div>
</div>
<label>👶 出行人群（勾选，选填）</label>
<input type="text" id="people" placeholder="如：带娃 / 带老人 / 商务出差">
<button class="btn-gen" id="genBtn">✨ 生成打包清单</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">🎒 你的打包清单</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制清单</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function cat(title,items){return '【'+title+'】\n'+items.map(i=>'▢ '+i).join('\n')+'\n\n';}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 旅行打包清单 | AgentGongju.com'))return;
const days=document.getElementById('days').value;
const dest=document.getElementById('dest').value;
const season=document.getElementById('season').value;
const people=document.getElementById('people').value.trim();
const d=(t,a,b,c)=>days==='1-3天'?t:(days==='4-7天'?a:b);
let out='🎒 '+days+' · '+dest+' · '+season+' 打包清单\n\n';
out+=cat('📄 证件票据（随身放）',['身份证/护照','手机+充电宝+数据线','银行卡+少量现金','交通票据/酒店确认单','（出国）签证材料+信用卡']);
// 衣服
const clothes=[];clothes.push(d('换洗衣物 1-2 套','换洗衣物 3-4 套','换洗衣物 5 套以上'));
clothes.push(season==='夏季'?(dest==='海边'?'泳衣/泳裤+防晒衣+凉拖':'轻薄T恤+防晒帽'):(season==='冬季'?'保暖内衣+羽绒服+手套围巾':'针织衫+薄外套+备雨具'));
if(dest==='山区')clothes.push('徒步鞋+雨衣+抓绒衣');
if(dest==='海边')clothes.push('沙滩巾+遮阳帽+墨镜');
if(people.indexOf('商务')>-1)clothes.push('商务正装各一件');
out+=cat('👕 衣物',clothes);
// 洗护
const wash=['洗漱用品（牙刷/毛巾）','护肤品+防晒霜'];
if(dest==='海边'||dest==='山区')wash.push('驱蚊液+晒后修复');
if(people.indexOf('婴')>-1||people.indexOf('带孩子')>-1)wash.push('婴儿湿巾+护臀膏');
out+=cat('🧴 洗护日用',wash);
// 电子
out+=cat('🔌 电子设备',['手机+相机','充电器+充电宝(不超过20000mAh)','（出国）转换插头']);
// 药品
const meds=['常备药（感冒/肠胃/止痛）','创可贴+消毒棉片'];
if(dest==='海边')meds.push('止泻药'),
meds.push('晕车药');
if(people.indexOf('老')>-1)meds.push('老人常用药/降压药（备足量）');
out+=cat('💊 药品健康',meds);
// 特殊
const sp=[];
if(dest==='出国')sp.push('随身WiFi/漫游卡','护照复印件','小额外币零钱');
if(people.indexOf('妈')>-1&&people.indexOf('怀孕')===-1&&people.indexOf('妇')>-1)sp.push('');
if(season==='夏季')sp.push('折叠伞+湿巾');
out+=cat('📌 行程备用品',sp.length?sp:['行程单/地图','纸巾+湿巾','保温杯']);
out+='📎 出行小贴士\n· 重要证件、现金、机票放随身小包，不离身\n· 常用物放行李箱上层，便于开箱取用\n· 提前一天查好目的地天气，临时调整外套\n· 所有电子设备出发前充满电，充电线备双份';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 打包清单已复制，祝你旅途愉快！'))}
</script>
</body>
</html>
