<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 起名助手 | AgentGongju.com</title>
<meta name="description" content="AI宝宝起名/网名起名，根据姓氏、性别、寓意与五行自动生成多个好听有内涵的名字建议">
<meta name="keywords" content="AI起名,宝宝起名,取名,姓名建议,网名生成,五行取名">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
input[type=text],input[type=number],select{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px;box-sizing:border-box}
input:focus,select:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.name-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:8px;margin-bottom:10px}
.name-item .nm{font-size:1.1rem;color:#a5b4fc;font-weight:600}
.name-item .mn{color:#94a3b8;font-size:.85rem}
.name-item .cp{cursor:pointer;color:#22c55e;font-size:.8rem}
.name-item .cp:hover{text-decoration:underline}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>
var _hmt = _hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";
  var s = document.getElementsByTagName("script")[0];
  s.parentNode.insertBefore(hm, s);
})();
</script>
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>👶 AI 起名助手</h1><p>按姓氏、性别与寓意，生成好听又有内涵的名字</p></div>

<div class="card">
<label>🈷️ 姓氏</label>
<input type="text" id="surname" placeholder="请输入姓氏，例如：李、王、陈">
<div class="param-row">
<div><label>🧑 性别</label>
<select id="gender"><option value="男孩">👦 男孩</option><option value="女孩">👧 女孩</option><option value="不限">✨ 不限</option></select></div>
<div><label>🎯 五行喜用（可选）</label>
<select id="wuxing"><option value="不限">不限</option><option value="金">金</option><option value="木">木</option><option value="水">水</option><option value="火">火</option><option value="土">土</option></select></div>
</div>
<label>🌟 期望寓意方向</label>
<select id="meaning" style="width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px"><option value="智慧才学">🧠 智慧才学</option><option value="健康平安">💪 健康平安</option><option value="富贵顺遂">💰 富贵顺遂</option><option value="温婉大气">🌸 温婉大气</option><option value="阳光活泼">☀️ 阳光活泼</option></select>
<label>🔢 生成数量</label>
<input type="number" id="count" value="8" min="4" max="12">
<button class="btn-gen" id="genBtn">✨ 生成名字</button>
</div>

<div class="result-area" id="resultArea"><div class="card"><div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 名字建议</div>
<div id="namesOut"></div></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const meaningDict={
'男孩':{'智慧才学':['思远','书墨','知远','梓铭','睿晟','博文','景行','修竹','明哲','启航'],'健康平安':['康安','泰然','怀安','靖平','颐安','康远','佑安','卓然'],'富贵顺遂':['伟业','承恩','锦程','纬业','鸿图','琅玕','荣轩','丰泽'],'温婉大气':['温润','谦谦','彦和','世安','志恒','彦博','景云','怀瑾'],'阳光活泼':['向阳','乐安','煜辰','晨熙','明昊','峻熙','远航','嘉乐']},
'女孩':{'智慧才学':['书妍','知微','诗涵','语嫣','慧心','梓琪','砚秋','洛书'],'健康平安':['安雅','沁怡','安之','清和','静宜','安然','栖月','穗芳'],'富贵顺遂':['锦瑟','婉宁','若曦','可心','如初','熙然','采薇','无双'],'温婉大气':['婉清','舒窈','雪容','语桐','惠妍','温言','慕青','思渺'],'阳光活泼':['乐瑶','星澜','悦然','澄心','熙妍','光凝','兮悦','笑颜']},
'不限':{'智慧才学':['思远','书然','知远','语萱','慧中','明扬'],'健康平安':['安正','泰之','怀瑾','安然','康达'],'富贵顺遂':['承泽','锦程','鸿飞','达观','嘉树'],'温婉大气':['清和','温润','彦和','静姝','怀瑾'],'阳光活泼':['向阳','乐之','晨光','熙和','悦心']}
};
const wuxingWords={金:['铭','锐','钧','锦'],木:['楠','柏','荣','桐'],水:['泽','涵','澄','沐'],火:['煜','灿','曦','炯'],土:['坤','宸','垚','培']};
const shu=['数','大','之','若','景','亦','元','子','以','尔','一','云','北','示','谷','之','川','成','弘','亦'];
function copyText(t){navigator.clipboard.writeText(t).then(()=>alert('✅ 已复制：'+t))}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 起名助手 | AgentGongju.com'))return;
const surname=document.getElementById('surname').value.trim();
const gender=document.getElementById('gender').value;
const wx=document.getElementById('wuxing').value;
const meaning=document.getElementById('meaning').value;
const n=Math.min(12,Math.max(4,parseInt(document.getElementById('count').value)||8));
if(!surname){alert('请先输入姓氏');return;}
const pool=meaningDict[gender][meaning];
const used=new Set();let html='';
const wxw=wx!=='不限'?wuxingWords[wx]:[];
for(let i=0;i<n;i++){
  let given;
  do{given=pool[Math.floor(Math.random()*pool.length)];if(Math.random()>0.5&&pool.length>2){given+=shu[Math.floor(Math.random()*shu.length)];}if(Math.random()>0.7&&wxw.length){given=(surname.length>1?'':wxw[Math.floor(Math.random()*wxw.length)])+given;}}while(used.has(surname+given));
  used.add(surname+given);
  const full=surname+given;
  const note=(meaning==='智慧才学'?'寄寓聪慧明达、才思敏捷':meaning==='健康平安'?'愿你一生平安顺遂':meaning==='富贵顺遂'?'寓意前程顺遂、富贵绵长':meaning==='温婉大气'?'气质温婉、落落大方':'阳光开朗、乐观向上')+(wx!=='不限'?('，补益'+wx+'行'):'');
  html+='<div class="name-item"><span class="nm">'+full+'</span><span class="mn">'+note+'</span><span class="cp" onclick="copyText(\''+full+'\')">复制</span></div>';
}
document.getElementById('resultArea').classList.add('active');
document.getElementById('namesOut').innerHTML=html;
});
</script>
</body>
</html>
