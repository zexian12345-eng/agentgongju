<div class="tool-header"><h1>🌋 AI 家庭避震应急手册</h1><p>按楼层生成避震方案＋应急包＋震后步骤</p></div>
<div class="card">
<div class="param-row">
<div><label>🏢 居住楼层</label>
<select id="floor"><option value="low">1-3 层</option><option value="mid" selected>4-10 层</option><option value="high">10 层以上</option><option value="house">自建房／平房</option></select></div>
<div><label>👨‍👩‍👧 家庭成员</label>
<select id="member"><option value="couple" selected>成年人为主</option><option value="kid">有小孩</option><option value="elder">有老人</option><option value="baby">有婴儿</option><option value="solo">独居</option></select></div>
</div>
<div class="param-row">
<div><label>📍 地震时你更可能在</label>
<select id="where"><option value="home" selected>家里</option><option value="office">办公室</option><option value="school">学校</option><option value="outdoor">户外／路上</option><option value="car">车里</option><option value="mall">商场／影院</option></select></div>
<div><label>🌊 是否临海/山区</label>
<select id="terrain"><option value="inland" selected>内陆城市</option><option value="coast">沿海（需防海啸）</option><option value="mountain">山区（需防滑坡）</option></select></div>

<script>
function gen(){
var floor=document.getElementById('floor').value;
var member=document.getElementById('member').value;
var where=document.getElementById('where').value;
var terrain=document.getElementById('terrain').value;
var out='════ 家庭避震应急手册 ════\n\n';
out+='⚡ 核心原则：震时就近躲避，震后迅速撤离。不要跳楼，不要乘电梯。\n\n';
out+='──── 📍 你在'+({home:'家里',office:'办公室',school:'学校',outdoor:'户外',car:'车里',mall:'商场/影院'}[where])+'怎么办 ────\n';
if(where==='home')out+='· 躲在承重墙墙角、卫生间（开间小、管道多，相对安全）或结实的桌子下；\n· 远离窗户、玻璃、吊灯、高柜、挂画；\n· 蹲下、掩护、抓牢——用手护住头颈；\n· 备好鞋和手电放在床边，玻璃碎片是震后最大伤害源；\n· 摇晃停止后，确认安全再考虑下楼。';
else if(where==='office')out+='· 躲到办公桌下或承重柱旁，护住头部；\n· 远离玻璃幕墙、吊顶、文件柜；\n· 不要涌向楼梯和电梯；\n· 震后走楼梯撤离，绝不乘电梯；\n· 到空旷集合点后清点人数。';
else if(where==='school')out+='· 听从老师指挥，躲到课桌下，护住头部；\n· 不要拥挤推搡往楼下冲，踩踏比地震更危险；\n· 按班级有序撤离到操场；\n· 家长不要冲向学校，等学校统一通知。';
else if(where==='outdoor')out+='· 立即远离建筑物、围墙、广告牌、电线杆、路灯；\n· 跑到空旷地带蹲下，护住头部；\n· 注意头上下落的物体（外墙皮、玻璃）；\n· 远离山体、河岸、陡坡。';
else if(where==='car')out+='· 缓慢靠边停车，避开立交桥、高架、电线杆、广告牌；\n· 留在车内系好安全带，等震动停止；\n· 不要停在桥下或隧道内；\n· 震后注意路面开裂与塌陷。';
else out+='· 躲在结实的座椅间或承重柱旁，护住头部；\n· 远离货架、玻璃、吊灯；\n· 不要涌向出口，避免踩踏；\n· 听从工作人员指挥，有序撤离。';
out+='\n\n──── 🚪 你在'+({low:'1-3 层',mid:'4-10 层',high:'10 层以上',house:'自建房/平房'}[floor])+'，撤离策略 ────\n';
if(floor==='low')out+='低楼层：震感强烈时，若能在 10 秒内跑到楼外空地，可果断跑出；但若摇晃已经很剧烈，先就近躲避，不要强行跑楼梯。';
else if(floor==='mid')out+='中楼层：⚠️ 不要试图在摇晃中跑楼梯！楼梯是建筑最易损部位之一。先就近躲避，等主震过去（通常几十秒）再走楼梯撤离。';
else out+='高楼层：绝对不能跳楼、不能乘电梯！主震时躲在结实家具旁，远离窗户。高层建筑抗剪设计较好，原地躲避通常比乱跑更安全。震后走楼梯下楼，注意余震。';
out+='\n\n──── 🎒 家庭应急包（放在门口、方便拿取）────\n';
out+='【求生类】\n□ 手电筒（含备用电池，或手摇发电款）\n□ 应急哨（吹哨比喊叫省力，便于搜救定位）\n□ 多功能工具刀\n□ 防尘口罩、手套、结实的鞋\n□ 应急保温毯\n';
out+='\n【饮用与食物】\n□ 瓶装水（人均 3 升，3 天量）\n□ 压缩饼干、能量棒、罐头\n□ 便携净水片\n';
out+='\n【医疗类】\n□ 急救包（消毒、止血、绷带）\n□ 常用药（慢性病药至少备 7 天量！）\n□ 个人特殊用药清单\n';
out+='\n【信息与证件】\n□ 充电宝（充满电）\n□ 现金（ATM 可能瘫痪）\n□ 身份证、社保卡复印件（防水袋装）\n□ 紧急联系人卡片（纸质，防手机没电）\n';
if(member==='kid')out+='\n【儿童专属】\n□ 儿童常用药、退烧药\n□ 奶粉/辅食、奶瓶\n□ 安抚玩具、小毯子（稳定情绪）\n□ 儿童防走失手环（写好家长电话）\n';
if(member==='elder')out+='\n【老人专属】\n□ 降压药、心脏药、胰岛素等（足量＋处方单）\n□ 老花镜、助听器备用电池\n□ 拐杖／助行器\n□ 写明病史与用药的卡片\n';
if(member==='baby')out+='\n【婴儿专属】\n□ 尿不湿、湿巾\n□ 奶粉、奶瓶、保温壶\n□ 婴儿背带（撤离时可空出双手）\n□ 婴儿睡袋/保暖包被\n';
out+='\n──── 🚨 震后行动步骤 ────\n';
out+='1. 确认自身与家人安全，检查有无受伤；\n';
out+='2. 关掉燃气阀门、电源总闸（防火灾，地震次生灾害中火灾最常见）；\n';
out+='3. 穿鞋、拿应急包，走楼梯有序撤离；\n';
out+='4. 到空旷地带（广场、操场），远离建筑物与电线；\n';
out+='5. 不要围观、不要返回取物，警惕余震；\n';
out+='6. 用短信报平安（短信比通话更容易接通）；\n';
out+='7. 听官方信息，不信谣不传谣。\n';
out+='\n──── 🌊 地形特殊提示 ────\n';
if(terrain==='coast')out+='沿海地区：若震感强烈且持续超过 30 秒，或海水异常退去，立即向高处撤离（至少 20 米以上或内陆 3 公里），海啸可能几分钟内抵达。';
else if(terrain==='mountain')out+='山区：警惕山体滑坡与落石，远离陡坡、河谷；不要在沟谷停留，震后强降雨时尤其危险。';
else out+='内陆城市：主要是建筑物倒塌与火灾风险，避免靠近老旧建筑、玻璃幕墙和燃气管道。';
out+='\n\n──── 📱 提前设置 ────\n';
out+='· 手机开启「地震预警」功能（多数国产手机在设置-安全里可开启）；\n';
out+='· 记住应急电话：110/119/120；\n';
out+='· 全家约定一个集合点和一个外地联系人（便于报平安）；\n';
out+='· 每半年检查一次应急包，更换过期药品与电池。\n';
return out;
}
</script>

document.getElementById('outputBox').innerText=gen();
document.getElementById('resultArea').classList.add('active');
});
