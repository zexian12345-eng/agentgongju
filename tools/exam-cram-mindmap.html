<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 考前冲刺思维导图 | AgentGongju.com</title>
<meta name="description" content="考前只剩几天，帮你把一门课的骨架一键搭成可背诵的思维导图框架：输入科目、考试重心与薄弱点，生成主干-分支提纲和每天的背诵安排，考前不慌">
<meta name="keywords" content="考试,冲刺,思维导图,复习,背诵,考前,提纲,学习">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
textarea{min-height:110px;resize:vertical}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:22px;color:#e2e8f0;line-height:2;white-space:pre-wrap;min-height:60px;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.hint{color:#94a3b8;font-size:.8rem;margin-top:-6px;margin-bottom:8px}
.hint2{color:#64748b;font-size:.82rem;text-align:center;margin-top:8px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>
var _hmt = _hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";

<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🌿 AI 考前冲刺思维导图</h1><p>把一整章浓缩成一页能背的骨架，考前一周也能稳住阵脚</p></div>

<div class="card">
<label>📚 科目名称</label><input type="text" id="subject" placeholder="例：马原 / 高数 / 教资综合素质 / 计算机二级" value="">
<div class="param-row">
<div><label>🎯 考试侧重</label><select id="focus">
<option value="concept">概念/背诵为主（文科记忆量大）</option>
<option value="calc" selected>计算/逻辑为主（要刷题）</option>
<option value="mixed">背+算都有</option>
</select></div>
<div><label>📅 距考试天数</label><select id="days"><option value="1">只剩1天</option><option value="3">2~3天</option><option value="7" selected>一周左右</option></select></div>
</div>
<label>🩹 你现在最薄弱/最没底的部分（重要，写具体点）</label>
<textarea id="weak" placeholder="例：第三章矩阵那堆公式老记混；简答题总答不全要点">第三章公式记不牢 简答题要点答不全</textarea>
<div class="param-row">
<div><label>⏳ 每天能投入的净学习时长</label><select id="hours"><option value="2">每天2小时</option><option value="4" selected>每天4小时</option><option value="6">每天6小时</option></select></div>
<div><label>✍️ 想导出的方式</label><select id="fmt"><option value="text">文字提纲便于记忆/手抄</option><option value="list">待办清单式（勾着打）</option></select></div>
</div>
<button class="btn-gen" id="genBtn">🌿 生成冲刺框架</button>
<div class="result-area" id="resultArea"><div class="card"><div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 冲刺框架已生成</div><div class="result-box" id="result"></div><button class="copy-btn" onclick="copyResult()">📋 复制提纲</button></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#94a3b8;text-align:center;padding:20px;font-size:.85rem">思维导图的骨架是\"你对知识结构自己梳一遍\"的过程——照抄没用，动手默写一遍主分支反而记得最牢。</p></div></footer>

<script>
document.getElementById('genBtn').addEventListener('click',function(){
 if(!Paywall.countUse('AI 考前冲刺思维导图 | AgentGongju.com'))return;
 var sub=document.getElementById('subject').value.trim()||'这门课';
 var focus=document.getElementById('focus').value;
 var days=parseInt(document.getElementById('days').value);
 var weak=document.getElementById('weak').value.trim()||'';
 var hours=document.getElementById('hours').value;
 var fmt=document.getElementById('fmt').value;
 var R=function(a){return a[Math.floor(Math.random()*a.length)];};
 var out=(fmt==='text'?'🌿 '+sub+' · 考前'+days+'天冲刺导图框架\n\n中央主题：'+sub+' 核心考点全图\n':'🎯 待办：'+sub+' 最后'+days+'天通关清单\n'); 
 out+='\n第一主干｜摸底&搭骨架（第1轮，1~2h）\n';
 out+='   · 翻开目录/PPT每章标题，用 5~8 个词把整章压成一个\"关键词点\"。\n';
 out+='   · 用一张纸画出这门课的\"总图\"：通常 4~6 个模块互相就串成网。\n';
 out+='   · 在你输入的字眼\"'+weak+'\"处打上❌红色标记，这就是主攻方向。\n';
 var branch;
 if(focus==='concept'){
   branch=[
    '第二主干｜概念速背（先抓\"踩分点\"）',
    '   · 每个概念拆成4要素：定义 + 关键字 + 2个出处/例子 + 一句容易混的\"坑\"。',
    '   · 用\"首字母口诀/画面联想\"给难背的词编个小故事，比死记牢。',
    '   · 简答题采分点有套路：分点列1.2.3.，每个点先给结论再补一句展开，答不全的问题一半是没按套路排。'];
 }else if(focus==='calc'){
   branch=[
    '第二主干｜题型拆解（先会\"看懂怎么套\"）',
    '   · 把历年题按\"题型\"归类，每种题型抄1道例题当模板，反复默写到闭卷能写。',
    '   · 公式别硬背：推导一遍+做3道同型题自然就记住，重点抓\"这题有没有坑/特殊条件\"。',
    '   · 计算题最容易丢分的是步骤不全/漏单位——平时就按\"写步骤\"练，别只看答案。'];
 }else{
   branch=[
    '第二主干｜背算双线（挑性价比最高的先啃）',
    '   · 概念计算都出的章节优先攻，纯背诵放后面；先保住\"基础必得分\"。',
    '   · 公式配例题默写，概念配简答要点联背，一次同时打通两种题型。'];
 }
 out+=branch.join('\n')+'\n\n';
 out+='第三主干｜按考点把整章\"默图画出来\"（考前第2~3天）\n';
 out+='   · 不看书写出主分支，卡壳的地方翻书补，这一遍才是真正过脑子。\n';
 out+=(days>=3?'   · 卡壳两次以上的点抄进\"考前小抄卡\"（一张A6写12条最密），随身带。':'   · 没时间了大纲默一遍即可，重点把❌处再各抄两遍。')+'\n\n';
 out+=(fmt==='text'?'📋 输出建议：把上面主干誊成一张A4思维导图（中心写'+sub+'，往外画3条主干），考前看它+默写，比翻书快10倍。':'✅ 勾选完成即通关：框架→默图→针对弱点→全真1套。')+'\n\n';
 out+='✨ 肥楠的小提醒：'+(focus==='calc'?'考前最后一天别再刷难题，把会做的基础分100%拿稳，比蒙对一道大题的期望高得多。':focus==='concept'?'背诵类考前\"睡前过一遍+早起默一遍\"，睡眠记忆最强，比通宵强10倍。':'最后一天回归框架默图和之前错题，稳住就是胜利。');
 document.getElementById('resultArea').classList.add('active');
 document.getElementById('result').textContent=out;
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('result').textContent).then(function(){alert('✅ 已复制！');});}
</script>
</body>
</html>
