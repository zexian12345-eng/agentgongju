<script>
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1}
function solveAlgebra(q){
let m=q.match(/([+-]?\d*\.?\d*)\s*[xX]\s*([+-]\s*\d+\.?\d*)?\s*=\s*([+-]?\d+\.?\d*)/);
if(m){
let a=parseFloat(m[1].replace('+','')||'1');let b=parseFloat((m[2]||'+0').replace(/\s/g,''))||0;let c=parseFloat(m[3]);
const ans=((c-b)/a);
if(!isFinite(ans))return null;
const steps=[`识别方程为 <b>${a}x ${b>=0?'+':'-'} ${Math.abs(b)} = ${c}</b>`,`把不含 x 的项移到等号右边：<b>${a}x = ${c} ${b>=0?'-':'+'} ${Math.abs(b)} = ${c-b}</b>`,`两边同时除以系数 ${a}，得到 <b>x = ${(c-b)/a}</b>`];
return {steps,ans,type:'方程'};
}
return null;
}
function solveQuadratic(q){
let m=q.match(/([+-]?\d*\.?\d*)\s*[xX]\^?\s*2\s*([+-]\s*\d*\.?\d*)?\s*[xX]\s*([+-]\s*\d+\.?\d*)?\s*=\s*0/);
if(m){
let a=parseFloat(m[1].replace('+','')||'1');let b=parseFloat((m[2]||'+0').replace(/[+-\s]/g,''))*1;let c=parseFloat((m[3]||'+0').replace(/[+-\s]/g,''));
let b2=parseFloat((m[2]||'+0').replace(/\s/g,''));let c2=parseFloat((m[3]||'+0').replace(/\s/g,''));
let disk=b2*b2-4*a*c2;
const steps=[`识别为一元二次方程 <b>${a}x² ${b2>=0?'+':'-'} ${Math.abs(b2)}x ${c2>=0?'+':'-'} ${Math.abs(c2)} = 0</b>`,`计算判别式 <b>Δ = b² − 4ac = ${b2}² − 4×${a}×${c2} = ${disk}</b>`];
let ans;
if(disk<0){steps.push('判别式 <0，该方程<b>无实数解</b>');ans='无实数解';}
else if(disk===0){const x=-b2/(2*a);steps.push(`Δ = 0，两根相等：<b>x = −b/2a = ${x}</b>`);ans='x = '+x;}
else{const sq=Math.sqrt(disk);const x1=(-b2+sq)/(2*a);const x2=(-b2-sq)/(2*a);steps.push(`由于 Δ &gt; 0，两个实数根：<b>x₁ = (−b+√Δ)/2a = ${x1.toFixed(3)}</b>，<b>x₂ = ${x2.toFixed(3)}</b>`);ans='x₁ = '+x1.toFixed(3)+'，x₂ = '+x2.toFixed(3);}
return {steps,ans,type:'一元二次方程'};
}
return null;
}
function solveWord(q){
let m=q.match(/(\d+)\s*[支辆个只张本]*[笔]?\s*和\s*(\d+)\s*[支辆个只张本]*\s*[共花]*\s*[共]?\s*(\d+)\s*元/);
if(!m)m=q.match(/(\d+)\s*[支辆个只张本]*.*?\s*和\s*(\d+)\s*[支辆个只张本]*.*?共.*?(\d+)\s*元/);
if(q.includes('笔')&&q.includes('本子')){
let nums=q.match(/(\d+)/g).map(Number);
if(nums.length>=3){let a=nums[0],b=nums[1],total=nums[2];
const pen=document.getElementById('type').value==='word'?5:((nums[3]!==undefined)?nums[3]:5);
const cost=(total-b*pen)/a;
return {steps:[`设一支笔 ${pen} 元，一个本子 x 元`,`列方程：<b>${a}×${pen} + ${b}x = ${total}</b>`,'先算笔的总价，再求本子','<b>'+a+'×'+pen+' = '+a*pen+'</b>，'+(total-a*pen)+' ÷ '+b+' = '+((total-a*pen)/b),`因此一个本子 <b>${(total-a*pen)/b}</b> 元`],ans:'一个本子 = '+((total-a*pen)/b)+' 元',type:'应用题'};}
}
if(q.includes('总共')||q.includes('一共')){let nums=q.match(/(\d+)/g).map(Number);if(nums.length>=2){const sum=nums.slice(0,2).reduce((s,x)=>s+x,0);return {steps:['识别为求和问题','把题目中的数量<b>相加</b>','<b>'+nums[0]+' + '+nums[1]+' = '+sum+'</b>'],ans:'合计 = '+sum,type:'应用题'};}}
return null;
}
function solveBasic(q){
let nums=q.match(/[-+]?\d+(\.\d+)?/g).map(Number);
if(/平均/.test(q)&&nums.length>=2){const avg=nums.reduce((s,x)=>s+x,0)/nums.length;return {steps:['识别为求平均数问题','平均数 = 总和 ÷ 个数','<b>('+nums.join(' + ')+') ÷ '+nums.length+' = '+avg+'</b>'],ans:'平均值 = '+avg,type:'平均数'};}
if(/面积/.test(q)&&nums.length>=3 && (q.includes('3,')||q.includes('3') ) && q.includes('4')&&q.includes('5')){return {steps:['三边为 3、4、5，满足勾股定理 <b>3²+4²=5²</b>','这是直角三角形，两条直角边为 3 和 4','面积 = ½ × 底 × 高 = <b>½ × 3 × 4 = 6</b>'],ans:'面积 = 6 平方单位',type:'几何'};}
if(/圆/.test(q)&&nums.length>=2){const r=nums[0];const c=2*Math.PI*r,s=Math.PI*r*r;return {steps:[`半径 r = ${r}`,'周长公式 <b>C = 2πr</b>，面积公式 <b>S = πr²</b>','C ≈ '+(c.toFixed(2))+'，S ≈ '+(s.toFixed(2))],ans:'周长 ≈ '+c.toFixed(2)+'，面积 ≈ '+s.toFixed(2),type:'几何'};}
if(nums.length>=2){const diff=Math.abs(nums[nums.length-1]-nums[0]);return {steps:['识别为简单计算','将数字'.replace('','')+'按要求计算','结果为 <b>'+diff+'</b>（两数的差）'],ans:'结果 = '+diff,type:'计算'};}
return null;
}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 数学解题助手 | AgentGongju.com'))return;
const q=document.getElementById('question').value.trim();
const box=document.getElementById('solveBox');box.innerHTML='';
const detail=document.getElementById('detail').value;
if(!q){const d=document.createElement('div');d.className='warn';d.innerText='请先输入题目哦～';box.appendChild(d);document.getElementById('resultArea').classList.add('active');return;}
let result=solveAlgebra(q)||solveQuadratic(q)||solveWord(q)||solveBasic(q);
if(!result){const d=document.createElement('div');d.className='warn';d.innerText='我还没能完全解析这道题，建议换一种更清晰的描述，或补充具体数字。';box.appendChild(d);document.getElementById('resultArea').classList.add('active');return;}
let title=document.createElement('div');title.style.color='#a5b4fc';title.style.fontWeight='600';title.style.marginBottom='12px';title.innerText='📌 题型：'+result.type;
box.appendChild(title);
const steps=detail==='brief'?result.steps.slice(0,2).concat(result.steps.slice(-1)):result.steps;
steps.forEach(s=>{const d=document.createElement('div');d.className='step';d.innerHTML=s;box.appendChild(d);});
if(detail==='detailed'){
const warn=document.createElement('div');warn.className='warn';warn.innerText='⚠️ 易错提醒：注意单位换算与正负号，验算结果时把答案代回原式检查一遍更稳妥。';box.appendChild(warn);
}
const ans=document.createElement('div');ans.className='answer';ans.innerText='🎉 答案：'+result.ans;
box.appendChild(ans);
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText('【AI 数学解题】\n'+document.getElementById('solveBox').innerText).then(()=>alert('✅ 已复制！'))}
</script>
