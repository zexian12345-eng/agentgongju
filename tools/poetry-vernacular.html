<span class="tag-btn" onclick="setPoem('春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少。')">《春晓》</span>

<script>
const commonWord={
'明月':'明亮的月亮','疑':'好像、仿佛','举头':'抬头','思':'想念','眠':'睡觉','闻':'听到、听见','啼':'叫、鸣叫','夜来':'夜里','知多少':'不知道有多少','把酒':'端着酒杯','青天':'蓝天','宫阙':'宫殿楼阁','今夕':'今晚','黄鹂':'黄莺鸟','翠柳':'嫩绿的柳树','白鹭':'白鹭鸟','窗含':'从窗口看到','千秋雪':'千年不化的积雪','门泊':'门前停泊着','行':'排'
};
const emotions=['淡淡的乡愁','闲适而宁静的心境','豁达与乐观旷达','对美好景物的喜爱','时光易逝的感慨','思念远方之人','对自然与生命的热爱','离别的依依不舍'];
document.getElementById('genBtn').addEventListener('click',function(){
if(!Paywall.countUse('古诗词白话翻译 | AgentGongju.com'))return;
const poem=document.getElementById('poem').value.trim();
if(!poem){alert('请先输入古诗原文');return;}
const lines=poem.split(/[，。；！？\n,.;!]/).filter(l=>l.trim().length>0);
let out='【原文】\n'+poem+'\n\n';
out+='【逐句白话】\n';
lines.slice(0,8).forEach((line,i)=>{
  out+='· '+line.trim()+'  →  ';
  let parts=[];
  for(const w in commonWord){if(line.includes(w))parts.push(w+'＝'+commonWord[w]);}
  out+=(parts.length?('（'+parts.slice(0,3).join('，')+'）')+' '+guessLine(line):'大意随上下文语境理解')+'\n';
});
out+='\n【整诗大意】\n';
out+=guessSummary(lines)+'\n\n';
out+='【所写景物/画面】\n'+guessScene(poem)+'\n\n';
out+='【情感倾向】\n'+(emotions[Math.floor(Math.random()*emotions.length)])+'。诗中多用'+(poem.includes('月')?'「月」':'自然景物')+'等意象，营造'+(poem.includes('月')?'清幽':'清新')+'的氛围，寄托作者'+(poem.includes('思')||poem.includes('故乡')?'对故乡亲人的思念':(poem.includes('不见')||poem.includes('落叶')?'对时光的感叹':'内心细腻的情思'))+'。\n\n';
out+='—— AI白话解读仅供学习参考 📖';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function guessLine(line){
  if(line.includes('举头')&&line.includes('低头'))return'抬头看明亮的月亮，低头便想起自己的故乡。';
  if(line.includes('明月')&&line.includes('光'))return'明亮的月光照在床前，仿佛地上铺了一层白霜。';
  if(line.includes('春眠'))return'春天里睡得香甜，不知不觉天都亮了。';
  if(line.includes('啼鸟'))return'醒来处处听到鸟儿的鸣叫，一片生机。';
  if(line.includes('花落'))return'经过一夜风雨，不知打落了多少花瓣。';
  if(line.includes('黄鹂'))return'两只黄鹂在翠绿的柳枝间欢快地鸣叫。';
  return'这句写的是'+(line)+'的情境，需结合全诗意境理解。';
}
function guessSummary(lines){
  const t=lines.join('');
  if(t.includes('故乡')||t.includes('思'))return'这是一首思念家乡的诗，通过寻常的月色描写，寄托了深切的乡愁。';
  if(t.includes('春眠'))return'这首诗写的是春天早晨醒来的见闻，字里行间透着对春光易逝的淡淡惜春之情。';
  if(t.includes('黄鹂'))return'这首诗描绘了一幅明丽的春日图景，通过远近景物的对比，展现作者开阔愉悦的心情。';
  return'这首诗借景抒情，通过'+(lines[0]||'眼前景物')+'展开，既有画面感又寄寓了作者的情感与感慨。';
}
function guessScene(poem){
  if(poem.includes('月'))return'月下的夜晚，月光如水，树影婆娑，营造出宁静清幽的画面。';
  if(poem.includes('春')||poem.includes('花'))return'春日的清晨，阳光、鸟鸣、雨后的落花，组成清新自然的春日图卷。';
  if(poem.includes('江')||poem.includes('舟'))return'江边或舟中的水景，远山近水，视野开阔而悠远。';
  return'以自然景物为主的画面，清新淡雅，富有诗意。';
}
function setPoem(v){document.getElementById('poem').value=v;}
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 解读已复制！'))}
</script>
