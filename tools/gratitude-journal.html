<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>感恩日记生成 | AgentGongju.com</title>
<meta name="description" content="AI感恩日记工具，记录生活的小确幸，帮你培养积极心态，提升幸福感">
<meta name="keywords" content="感恩日记,心情日记,积极心理,幸福感,日记">

<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.btn-gen:disabled{opacity:.5;cursor:not-allowed}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.journal{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:14px;padding:24px;line-height:1.9}
.journal .date{color:#94a3b8;font-size:.85rem;margin-bottom:12px;text-align:center}
.journal .line{margin:8px 0}
.journal .highlight{color:#86efac}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem;margin-top:14px}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.edit-hint{color:#64748b;font-size:.78rem;text-align:center;margin-top:12px;background:rgba(255,255,255,0.03);padding:10px;border-radius:8px}
</style>
<script>

  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";

<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🙏 感恩日记生成</h1><p>记录今天的小确幸，重建对生活的感知力与幸福感</p></div>

<div class="card"><label>📢 今天想对生活说的话（可选）</label>
<textarea id="mood" placeholder="例如：今天工作很顺利，同事帮了我一个大忙..."></textarea>
<div class="param-row">
<div><label>感恩条数</label><input type="number" id="num" value="3" min="2" max="6"></div>
<div><label>心情基调</label><select id="tone"><option value="平静">平静</option><option value="感恩知足">感恩知足</option><option value="元气满满">元气满满</option></select></div>
</div>
<button class="btn-gen" id="genBtn">📖 生成日记</button></div>

<div class="result-area" id="resultArea"><div class="card">
<div class="journal" id="out"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制日记</button>
<div class="edit-hint">💡 建议：把日记发到朋友圈，或记在小本本上，坚持21天你会发现心态大不同</div>
</div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyResult(){navigator.clipboard.writeText(document.getElementById('out').innerText).then(()=>alert('✅ 已复制！'))}
const GRAT=[
'今天有一个值得微笑的小瞬间',
'感谢身边一直默默支持我的人',
'今天又比昨天进步了一点点',
'一顿可口的饭菜犒劳了努力的自己',
'被某个人的温柔善意温暖到了',
'今天拥有了一段属于自己的安静时光',
'身体健健康康，平安度过了普通又美好的一天',
'今天解决问题的过程，让我更了解自己'];
const REFLECT=[
'我开始懂得，幸福往往藏在那些不被注意的日常里。',
'原来平凡的日子，也值得被认真地珍惜和记录。',
'怀着感恩的心，才发现生活处处是惊喜。',
'很多看似理所当然的事，其实都值得说一声谢谢。'];
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('感恩日记生成 | AgentGongju.com'))return;
const mood=document.getElementById('mood').value.trim();
const n=Math.min(6,Math.max(2,parseInt(document.getElementById('num').value)||3));
const tone=document.getElementById('tone').value;
const seeded=GRAT.slice().sort(()=>Math.random()-0.5).slice(0,n);
const now=new Date();const dateStr=now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日';
let html='<div class="date">'+dateStr+' · 感恩日记</div>';
let lines='';
seeded.forEach((g,i)=>{
  lines+=('<div class="line">'+(i+1)+'. 今天感恩：「'+g+'」</div>');
});
if(mood)lines+='<div class="line highlight">💭 今日心情：'+mood+'</div>';
lines+='<div class="line" style="margin-top:12px">'+REFLECT[Math.floor(Math.random()*REFLECT.length)]+'</div>'+'<div class="line">愿我们都能活在当下，用心感受每一份微小而确定的幸福。</div>';
html+=lines;
document.getElementById('resultArea').classList.add('active');
document.getElementById('out').innerHTML=html;
});
</script>
</body>
</html>
