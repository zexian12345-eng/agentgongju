<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 漫画头像生成 | AgentGongju.com</title>
<meta name="description" content="免费在线生成二次元漫画头像，支持多种画风和角色类型">
<meta name="keywords" content="AI漫画,漫画头像,二次元,卡通头像,AI绘画">
<link rel="stylesheet" href="../css/style.css">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:100px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.btn-gen:disabled{opacity:.5;cursor:not-allowed}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.8;white-space:pre-wrap;min-height:60px;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🎨 AI 漫画头像生成</h1><p>一键生成专属二次元漫画头像</p></div>

<div class="card"><label>🖌 画风</label>
<select id="style"><option value="日系动漫">日系动漫</option><option value="美式漫画">美式漫画</option><option value="赛博朋克">赛博朋克</option><option value="水墨国风">水墨国风</option><option value="萌系Q版">萌系Q版</option></select></div>
<div class="card"><div class="param-row"><div><label>👤 角色性别</label>
<select id="gender"><option value="女生">女生</option><option value="男生">男生</option><option value="无性别">无性别</option></select></div>
<div><label>🎨 主色调</label>
<select id="color"><option value="粉色">粉色</option><option value="蓝紫">蓝紫</option><option value="银白">银白</option><option value="金色">金色</option><option value="暗黑">暗黑</option></select></div></div></div>
<div class="card"><label>💬 角色特征描述（发型、表情、配饰等）</label>
<textarea id="desc" placeholder="例如：银色长发，紫色眼睛，戴耳机，微笑，猫耳..."></textarea>
<button class="btn-gen" id="genBtn">🎨 生成漫画头像描述</button></div>
<div class="result-area" id="resultArea"><div class="card"><div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ AI 绘图 Prompt 已生成</div>
<div class="result-box" id="result"></div><button class="copy-btn" onclick="copyResult()">📋 复制</button></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const styleEn={'日系动漫':'Japanese anime style','美式漫画':'American comic style','赛博朋克':'cyberpunk style','水墨国风':'Chinese ink painting style','萌系Q版':'chibi kawaii style'};
const colorEn={'粉色':'pink','蓝紫':'blue-purple','银白':'silver white','金色':'golden','暗黑':'dark'};
document.getElementById('genBtn').addEventListener('click',()=>{
const style=document.getElementById('style').value,g=document.getElementById('gender').value,c=document.getElementById('color').value,desc=document.getElementById('desc').value.trim()||'清新自然的表情';
const scene=['城市夜晚街灯','春日樱花树下','未来科技实验室','古风宫殿背景','星空下仰望','咖啡馆午后阳光'];
const s=scene[Math.floor(Math.random()*scene.length)];
const out='【二次元漫画头像 · '+style+'】\n\n🎨 Prompt（可复制到Midjourney/SD使用）:\n\n'+'anime '+styleEn[style]+' portrait of a '+g+' character with '+colorEn[c]+' color scheme, '+desc+', detailed hair, glowing eyes, high quality, 4k, background '+s+'\n\n——\n💡 参数建议:\n比例: 1:1 | 风格权重: 0.8 | 细节度: 高\n';
document.getElementById('resultArea').classList.add('active');document.getElementById('result').textContent=out;});
function copyResult(){navigator.clipboard.writeText(document.getElementById('result').textContent).then(()=>alert('✅ 已复制！'))}
</script>
</body>
</html>
