<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI每日早晚报三句话生成 | AgentGongju.com</title>
<meta name="description" content="不会写日报/晨会简报/下班小结？输入今天做了什么，AI帮你凝练成早报(今日重点)与晚报(今日复盘+明日预告)各三句，组长老板都爱看的高效沟通模板。">
<meta name="keywords" content="日报模板,晨会简报,工作日报,三句话总结,下班小结,汇报模板">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
input[type=text],textarea,select{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s;margin-top:6px}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.95;white-space:pre-wrap;font-size:0.95rem;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.output-box{font-size:.9rem}}
</style>
<script>
var _hmt = _hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";
  var s = document.getElementsByTagName("script")[0];
  s.parentNode.insertBefore(hm, s);

<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>📮 AI每日早晚报三句话生成</h1><p>晨会一句话，下班三行清，汇报从此不词穷</p></div>

<div class="card">
<div class="param-grid">
<div><label>🗂 你要写给谁 / 什么场景</label>
<select id="who"><option selected>晨会(报今日重点)</option><option>日报给直属主管</option><option>项目群同步进展</option><option>下班小结发朋友圈/自己复盘</option><option>给客户同步进度</option></select></div>
<div><label>✏️ 语气基调</label>
<select id="tone"><option selected>简洁干练</option><option>略带温度友好</option><option>正式专业</option><option>轻松不正经</option></select></div>
</div>
<div><label>📝 你今天做了哪几件事（用顿号/分号隔开都行）</label>
<textarea id="work" placeholder="例如：把新版本后端接口联调完 / 拉了客诉数据并看了趋势 / 排了明天的发布计划"></textarea></div>
<button class="btn-gen" id="genBtn">✨ 生成早晚报</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:10px">📮 三句话早晚报</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制全部</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const SCENE_HEAD={
'晨会(报今日重点)':['早报 · 今日三重点：','【今晨简报 | '],
'日报给直属主管':['主管，今天同步：','【今日日报 | '],
'项目群同步进展':['进展同步：','【项目同步 | '],
'下班小结发朋友圈/自己复盘':['今天又拿下了一天：','【今日小结 | '],
'给客户同步进度':['您好，今天进度同步：','【项目进度同步 | ']
};
const TONE_OPEN={
'简洁干练':['完成','推进了','搞定了','落地了'],
'略带温度友好':['顺利做完','又往前推了一步','舒舒服服收工','进展稳稳的'],
'正式专业':['已完成','按计划推进','达成既定节点','如期交付'],
'轻松不正经':['盘它盘好了','今日份KPI拿下','又卷赢一天','搞定收工，下班！']
};
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function todayStr(){const d=new Date();return (d.getMonth()+1)+'月'+d.getDate()+'日';}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI每日早晚报三句话生成 | AgentGongju.com'))return;
const who=document.getElementById('who').value;
const work=document.getElementById('work').value.trim();
if(!work){alert('先写写你今天做了啥');return;}
const items=work.split(/[，,；;。]/).map(s=>s.trim()).filter(Boolean);
const tmps=items.slice(0,5);
let r='';
// ---------- 早报（今日重点/开工规划）----------
r+='━━ 晨间 · 早报（上班/开工版）━━\n';
r+=(todayStr()+' '+who.slice(0,6))+'\n';
r+='1. 今日核心目标：把「'+colHead()+'」这件事办妥，'+(tmps[0]?('延续昨日进度继续推进「'+shorten(tmps[0],14)+'」'):'以便给到团队确定的结果')+'；\n';
r+='2. 需要我重点盯的风险/依赖：跟进「风险点」及相关方的反馈，避免影响交付；\n';
r+='3. 若无其它阻塞，将按计划推进以上项，预计下班前同步结果。\n\n';
// ---------- 晚报（复盘+明天）----------
r+='━━ 晚间 · 三句话晚报 ━━\n';
const summary=who;
r+=(TONE_HEAD())+'\n';
const lines=[
 '第一句·今日成果：今日完成「'+shorten(tmps[0]||work,20)+'」，期间把「'+(tmps[1]||'过程中的次要事项')+'」一并理顺，整体'+pick(TONE_OPEN[document.getElementById('tone').value])+'。',
 '第二句·卡点与求助：暂无明显阻塞；若有小疑虑已内部消化，属可控范围。',
 '第三句·明日预告：下一步聚焦「'+(tmps[2]||'收尾与复用沉淀')+'」，同步给相关方后推动落地，预计可闭环。'
];
function TONE_HEAD(){return (who==='下班小结发朋友圈/自己复盘'?'今天做了三件实事':'今日下班结汇报');}
lines.forEach(l=>{r+=l+'\n';});
r+='\n（以上为模板化输出，把第3句的“明日预告”填实更像真人汇报，效率直接翻倍。）';
document.getElementById('outputBox').innerText=r;
document.getElementById('resultArea').classList.add('active');
});
function colHead(){return '当日优先级最高事项';}
function shorten(s,n){s=(s||'').trim();return s.length>n?s.slice(0,n)+'…':s;}
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 早晚报已复制！'))}
</script>
</body>
</html>
