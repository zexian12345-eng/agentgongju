<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 简历优化优化器 | AgentGongju.com</title>
<meta name="description" content="AI简历优化优化器，输入你的工作经历，自动用STAR法则改写为量化、专业、高转化的简历描述，求职简历投递必备">
<meta name="keywords" content="AI简历,简历优化,简历修改,求职,STAR法则,面试">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.badge{padding:4px 12px;border-radius:20px;background:rgba(99,102,241,0.15);color:#a5b4fc;font-size:.78rem;border:1px solid rgba(99,102,241,0.25)}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;margin-bottom:12px;font-size:.92rem}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>📄 AI 简历优化</h1><p>用 STAR 法则，把平铺直叙的经历写成高转化的亮点</p></div>

<div class="card">
<label>💼 目标岗位</label>
<input type="text" id="job" placeholder="例如：高级数据分析师 / 产品运营 / Java开发工程师">
<div class="param-row">
<div><label>🧩 工作年限</label>
<select id="years">
<option value="应届">🎓 应届毕业生</option>
<option value="1-3年">🌱 1-3 年</option>
<option value="3-5年">🌳 3-5 年</option>
<option value="5年以上">🌲 5 年以上</option>
</select></div>
<div><label>🎯 优化重点</label>
<select id="focus">
<option value="量化成果">📈 突出量化成果</option>
<option value="技能匹配">🔧 强化技能匹配</option>
<option value="项目深度">🗂️ 突出项目深度</option>
<option value="领导力">👑 突出领导力</option>
</select></div>
</div>
<label>📝 原简历经历描述（越详细越好）</label>
<textarea id="exp" placeholder="例如：我在公司负责数据报表的工作，用Excel做各种统计，还帮业务部门处理过几次紧急需求，经常写SQL查询数据。"></textarea>
<button class="btn-gen" id="genBtn">🪄 开始优化</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div class="badges" id="badges"></div>
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">💎 优化后简历描述</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制优化结果</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const actVerbs=['主导','负责并推动','统筹策划','独立完成','协同推进','深度参与','牵头搭建','系统性优化','全流程管理'];
const achievements={量:['使核心指标环比提升 30%','将处理效率提高 40%','减少 50% 的人工工作量'],质:['获得业务方一致好评','零重大事故，稳定运行超 12 个月','上线后用户留存提升 15%'],速:['交付周期缩短 1/3','响应速度完全满足 99.9% SLA']};
const focusBonus={
'量化成果':['采用可量化表达，数字具体可信','运用"从…到…"展示成长幅度'],
'技能匹配':['突出与目标岗位强相关技能','点明工具链与行业方法论'],
'项目深度':['强调思考链路与方案取舍','体现从0到1的完整闭环'],
'领导力':['突出跨团队协调与决策担当','体现"带人带事"的管理潜力']};
const yearsStyle={
'应届':['扎实的理论基础','快速学习能力','参加过 XX 项目实践并沉淀方法论'],
'1-3年':['具备独立执行能力','参与核心模块建设并贡献关键思路'],
'3-5年':['能独立负责模块至系统级别','具备跨部门协调与方案决策能力'],
'5年以上':['具备技术前瞻与架构视野','能带领团队完成复杂系统交付']};
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 简历优化优化器 | AgentGongju.com'))return;
const job=document.getElementById('job').value.trim()||'目标岗位';
const years=document.getElementById('years').value;
const focus=document.getElementById('focus').value;
const exp=document.getElementById('exp').value.trim();
if(!exp){alert('请先填写原简历经历');return;}
const verb=actVerbs[Math.floor(Math.random()*actVerbs.length)];
const metric=Math.floor(Math.random()*30+15);
const metric2=Math.floor(Math.random()*20+10);
const sents=exp.split(/[。；;]/).filter(x=>x.trim()).slice(0,3);
const badges=['🎯 '+job,'🧩 '+years+'\u00A0经验','✨ 重点关注 · '+focus];
document.getElementById('badges').innerHTML=badges.map(b=>`<span class="badge">${b}</span>`).join('');
let out=`【个人总结 · 聚焦${job}】\n${yearsStyle[years][0]}；${focusBonus[focus][0]}。在日常工作中，注重${focusBonus[focus][1]}。\n\n`;
out+=`【核心经历（STAR 改写）】\n`;
sents.forEach((s,i)=>{
const clean=s.trim();
const obj=[`（场景）在部门例行业务梳理中，我关注到${clean.replace(/负责|做了|包括/g,'')}`,
`（任务）我需要系统性地解决该环节的低效与重复问题，为业务提供稳定支撑`,
`（行动）我${verb}了相关流程设计，梳理数据口径、建立标准化文档，并联动多个协作方逐项落地`,
`（结果）经一段周期运行，相关处理效率提升约 ${metric}%，交付质量显著改善，同时降低了 ${metric2}% 的沟通成本`].join('\n');
out+=`◆ 经历${i+1}：\n${obj}\n\n`;
});
out+=`【关键能力关键词】\n${yearsStyle[years][1]}，配合较强的执行力与复盘意识，能持续用数据驱动方案迭代。\n\n`;
out+=`💡 优化说明：本结果已将原文改写为 STAR 结构并补入量化数据占位（请替换为真实数字），突出与「${job}」的匹配度。`;
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 已复制！'))}
</script>
</body>
</html>
