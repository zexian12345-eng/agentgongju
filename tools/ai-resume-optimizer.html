<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 简历优化 | AgentGongju.com</title>
<meta name="description" content="AI简历优化助手，粘贴原始简历内容，智能润色、突出亮点、匹配岗位关键词，提升面试通过率">
<meta name="keywords" content="AI简历,简历优化,简历润色,求职,找工作,修改简历">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;font-size:.92rem;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.tip{color:#94a3b8;font-size:.85rem;margin-bottom:12px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>
var _hmt = _hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";
  var s = document.getElementsByTagName("script")[0];
  s.parentNode.insertBefore(hm, s);
})();
</script>
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>📄 AI 简历优化</h1><p>粘贴简历内容，智能润色用语、突出量化亮点</p></div>

<div class="card">
<label>📝 粘贴你的简历片段（工作经历 / 项目经验）</label>
<textarea id="content" placeholder="例如：负责公司APP的日常开发，写过首页功能，处理过线上bug，参与了需求评审"></textarea>
<div class="param-row">
<div><label>🎯 目标岗位</label>
<select id="job"><option value="软件开发">💻 软件开发</option><option value="产品经理">📱 产品经理</option><option value="运营">📈 运营</option><option value="市场">📣 市场</option><option value="设计">🎨 设计</option><option value="数据分析">📊 数据分析</option></select></div>
<div><label>🧩 润色风格</label>
<select id="depth"><option value="标准" selected>标准润色</option><option value="深度">深度包装</option><option value="精简">精简干练</option></select></div>
</div>
<button class="btn-gen" id="genBtn">✨ 优化我的简历</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 优化后的简历内容</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制优化结果</button>
<div class="tip" style="margin-top:12px">💡 小贴士：面试官平均只花 15 秒看简历，量化数字 + 主动动词 + 结果导向最吃香。</div>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const actionVerbs=['主导','负责','统筹','曾负责','深度参与','独立完成'];
const boosts={'软件开发':'重构核心模块，显著降低系统耦合度；引入自动化测试，有效减少回归问题','产品经理':'梳理用户痛点，输出高质量PRD并推动跨团队落地','运营':'制定精细化运营策略，显著提升用户活跃与留存','市场':'策划整合营销方案，有效扩大品牌声量','设计':'搭建组件化设计规范，大幅提升设计交付效率','数据分析':'搭建指标体系与分析看板，为业务决策赋能'};
const actMap={开发:['完成','实现'],'写':['独立完成'],处理:['及时修复'],修复:['快速定位并修复'],负责:['负责'],设计:['主导设计'],优化:['持续优化']};
const skillMap={'软件开发':['对工程化、性能优化有深入实践','具备良好的代码质量意识，注重可维护性'],'产品经理':['具备敏锐的用户洞察与跨团队协作能力'],'运营':['数据驱动，具备较强的活动策划与执行能力'],'市场':['熟悉内容营销与投放，具备增长思维'],'设计':['具备扎实的视觉功底与用户审美'],'数据分析':['熟练SQL与常用分析工具，擅长从数据中发现问题']};
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 简历优化 | AgentGongju.com'))return;
const content=document.getElementById('content').value.trim();
const job=document.getElementById('job').value;
const depth=document.getElementById('depth').value;
if(!content){alert('请先粘贴你的简历内容');return;}
const points=content.split(/[。;；\n，,]/).filter(x=>x.trim()&&!/^有|^会|^懂/.test(x.trim())&&x.trim().length>2);
const cleaned=points.length?points:content.split(/[，,。；;]/).filter(x=>x.trim());
let out='以下是优化后的简历描述（可直接替换原文）：\n\n';
if(depth!=='精简'){
out+='【个人总结】\n· '+job+'方向的专业人才，'+cleaned[0].trim()+'等相关工作有丰富经验，'+skillMap[job]+'。\n\n';
}
out+='【工作 / 项目经历】\n';
cleaned.slice(0,5).forEach(t=>{
const s=t.trim();
let h='· 负责「'+s+'」相关工作';
if(depth==='深度'){h='· '+actionVerbs[Math.floor(Math.random()*actionVerbs.length)]+'「'+s+'」相关工作，注重过程与结果并重';}
else{h='· '+actionVerbs[Math.floor(Math.random()*actionVerbs.length)]+'「'+s+'」相关工作';}
out+=h+'\n';
});
out+='\n· 亮点提升：'+boosts[job]+'。\n';
if(depth==='深度'){out+='· 协作层面：跨团队沟通顺畅，推动项目按计划推进落地。\n· 反思成长：乐于复盘沉淀，持续打磨专业能力。\n';}
out+='\n【关键词（供直接粘贴到简历技能栏）】\n· '+promptSkill(job);
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function promptSkill(job){const m={'软件开发':'Java/Python·微服务·系统设计·性能优化','产品经理':'PRD·需求分析·数据分析·跨团队协作','运营':'活动策划·数据运营·用户增长·内容运营','市场':'品牌营销·内容策划·广告投放·增长','设计':'UI/UX·Sketch/Figma·设计规范·动效','数据分析':'SQL·Excel·BI报表·A/B测试'};return m[job];}
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 简历已复制！'))}
</script>
</body>
</html>
