<div class="card">
<div class="param-row">
<div><label>👨‍👩‍👧 家庭成员</label>
<select id="member"><option value="baby">有 3 岁以下宝宝</option><option value="kid" selected>有学龄儿童</option><option value="elder">有 60 岁以上老人</option><option value="preg">有孕妇</option><option value="adult">都是成年健康人</option><option value="chronic">有慢性病/免疫力低</option></select></div>
<div><label>🏫 感染风险来源</label>
<select id="risk"><option value="school" selected>孩子在学校／幼儿园</option><option value="office">大人通勤上班</option><option value="hospital">常去医院</option><option value="home">主要在家</option></select></div>
</div>
<div class="param-row">
<div><label>📍 地区季节</label>
<select id="season"><option value="winter" selected>冬季高发期</option><option value="spring">春季</option><option value="autumn">秋冬交替</option><option value="summer">夏季（流感低发）</option></select></div>
<div><label>😷 当前情况</label>
<select id="status"><option value="prevent" selected>还没人得病，想预防</option><option value="one">家里有一人发烧</option><option value="several">多人陆续出现症状</option><option value="recover">刚病愈想防复发</option></select></div>
</div>

<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function gen(){
var m=document.getElementById('member').value;
var risk=document.getElementById('risk').value;
var season=document.getElementById('season').value;
var status=document.getElementById('status').value;
var out='════ 流感季家庭防护计划 ════\n\n';
out+='──── 💉 第一步：疫苗（最有效）────\n';
out+='· 流感疫苗每年都要打，因为病毒每年变异，去年的抗体今年基本无效；\n';
out+='· 最佳接种时间：9-11 月，抗体约需 2-4 周建立；\n';
out+='· 错过也可以补种，整个流行季接种都有效；\n';
if(m==='baby')out+='· 3 岁以下宝宝：6 个月以上可以接种，需遵医嘱；家人接种可形成"保护圈"；\n';
else if(m==='kid')out+='· 学龄儿童：优先接种，学校是主要传播场所；\n';
else if(m==='elder')out+='· 60 岁以上老人：优先接种，且建议同时接种肺炎疫苗；\n';
else if(m==='preg')out+='· 孕妇：可以接种灭活流感疫苗（不能接种减毒活疫苗），孕期感染流感风险更高，建议咨询产科医生；\n';
else if(m==='chronic')out+='· 慢性病患者：属于高危人群，强烈建议接种，接种前告知医生基础病情况；\n';
else out+='· 健康成年人：接种可减少患病与传播，家中有老人孩子的更建议全家接种；\n';
out+='\n──── 🧼 日常防护 ────\n';
out+='· 洗手：流水＋肥皂搓 20 秒，尤其外出回家、饭前、接触门把手后；\n';
out+='· 口罩：' + (risk==='school'?'孩子上学建议备两个口罩，人多密闭场所佩戴；':risk==='office'?'通勤地铁公交建议佩戴口罩；':risk==='hospital'?'去医院务必戴 N95/KN95；':'家人外出回家先洗手换衣再抱孩子；') + '\n';
out+='· 通风：每天开窗通风 2-3 次，每次 20-30 分钟，冬天可分时段短开；\n';
out+='· 少去人多密闭场所，尤其是流感高发期；\n';
out+='· 咳嗽打喷嚏用手肘遮挡，不共用毛巾水杯；\n';
out+='· 保证睡眠、均衡饮食，免疫力是最好的防线。\n';
out+='\n──── 🧴 家庭消毒 ────\n';
out+='· 高频接触面：门把手、开关、遥控器、手机、水龙头每天擦拭；\n';
out+='· 消毒剂：75% 酒精（擦拭，不喷洒空气）或含氯消毒液（按说明稀释）；\n';
out+='· 餐具：煮沸 15 分钟或消毒柜；\n';
out+='· 衣物床品：阳光下晾晒或 60℃ 以上水温清洗；\n';
out+='· 玩具：可水洗的用消毒液擦拭后冲净晾干；\n';
out+='· 注意：酒精和含氯消毒剂不可混用，会产生有毒气体。\n';
out+='\n──── 💊 用药常识（重要）────\n';
out+='· 流感是病毒，抗生素无效，不要自行吃头孢/阿莫西林；\n';
out+='· 抗病毒药（奥司他韦等）需在发病 48 小时内使用效果最好，且需医生处方；\n';
out+='· 退烧药：对乙酰氨基酚或布洛芬，二选一，不要交替乱用，间隔至少 4-6 小时；\n';
out+='· 儿童禁用阿司匹林（可能引发瑞氏综合征）；\n';
out+='· 复方感冒药不要叠加吃，避免同成分过量伤肝；\n';
out+='· 多喝水、多休息比一堆药更管用。\n';
out+='\n──── 🌡 什么时候必须就医 ────\n';
out+='出现以下任一情况，立即就医：\n';
out+='· 持续高热超过 3 天不退，或退烧后又反复；\n';
out+='· 呼吸困难、胸闷、气促；\n';
out+='· 精神萎靡、嗜睡、意识模糊；\n';
out+='· 抽搐、剧烈头痛、颈项强直；\n';
out+='· 严重呕吐腹泻导致脱水；\n';
out+='· 儿童拒食、尿量明显减少、口唇发紫；\n';
out+='· 老人原有慢性病明显加重。\n';
out+='\n──── 🚪 居家隔离方案 ────\n';
if(status==='prevent')out+='目前无人患病，重点做好预防：疫苗＋洗手＋通风，家里备好体温计、退烧药和口罩。';
else if(status==='one')out+='一人发病：\n· 尽量单独房间休息，使用独立餐具；\n· 照顾者佩戴口罩，接触后勤洗手；\n· 患者房间每天通风，门把手等重点消毒；\n· 其他家庭成员减少近距离接触，尤其是老人孩子；\n· 患者退烧后仍需观察 24-48 小时再恢复日常接触。';
else if(status==='several')out+='多人发病：\n· 分房休息，避免交叉感染（不同类型病毒可能叠加）；\n· 集中采购物资，减少外出；\n· 症状严重者优先就医，家中留人照顾；\n· 注意观察是否有人出现重症信号。';
else out+='刚病愈防复发：\n· 病后 1-2 周免疫力仍较低，注意休息别立刻恢复高强度工作；\n· 继续做好手卫生与通风；\n· 咳嗽可能持续 2-3 周属正常，但加重需就医。';
out+='\n\n──── 🎒 家庭应急物资清单 ────\n';
out+='□ 电子体温计（建议备两支）\n□ 退烧药：对乙酰氨基酚／布洛芬（儿童备混悬液）\n□ 医用口罩、N95\n□ 75% 酒精、含氯消毒片\n□ 血氧仪（有老人必备）\n□ 口服补液盐（防脱水）\n□ 生理盐水鼻喷／洗鼻器\n□ 独立餐具与垃圾袋\n';
out+='\n👨‍⚕️ 用药请遵医嘱，尤其是儿童和老人剂量需按体重/年龄调整。\n';
return out;
}
</script>

document.getElementById('outputBox').innerText=gen();

});
