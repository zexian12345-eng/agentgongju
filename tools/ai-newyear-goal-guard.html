.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}

.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}

<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🎯 年初Flag防倒塌校准助手</h1><p>三月不立"大而全"，把目标焊在日常生活里</p></div>

<div class="card">
<div class="param-grid">
<div><label>🎯 你的新年目标方向</label>
<select id="goalType"><option selected>健身/减肥</option><option>学英语/考试</option><option>读更多书/写作</option><option>存钱/理财</option><option>学一门技能(剪辑/编程等)</option><option>早睡早起/自律生活</option></select></div>
<div><label>🕐 每天大概能挤出的时间</label>
<select id="time"><option selected>20-30分钟</option><option>几乎没空(10分钟以内)</option><option>1小时</option><option>周末才有空</option></select></div>
</div>
<div><label>📝 具体一点的目标内容（越具体越好）</label>
<textarea id="goal" placeholder="例如：今年要瘦10斤 / 考过六级 / 读完12本书 / 存下3万 / 学会剪视频…"></textarea></div>
<div class="param-grid">
<div><label>🌀 最常让Flag倒下的是什么？</label>
<select id="enemy"><option selected>坚持不了几天就想放弃</option><option>没时间/太忙</option><option>成果太慢看不到进步</option><option>跟朋友一比就焦虑</option></select></div>
<div><label>🧪 去年失败时卡在哪一步？</label>
<select id="past"><option selected>停在"想"没开工</option><option>开了头三分钟热度</option><option>中断一次就全断</option><option>太追求完美反而不行动</option></select></div>
</div>
<button class="btn-gen" id="genBtn">🛠 出具"不倒翁"执行方案</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">🛡 你的防倒执行方案</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制方案</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function pick(a){return a[Math.floor(Math.random()*a.length)];}
const DIM={};
DIM['健身/减肥']={goal:'每周3次30分钟运动，+记录体重与围度',micro:'今天先完成"换上运动鞋+做5个深蹲"（5分钟也算开始）',measure:'每周上一次秤记一次，不看单日看趋势',win:'能穿回那条旧裤子'};
DIM['学英语/考试']={goal:'背词卡+每周2套真题并复盘错题',micro:'今天先"背10个/做一篇阅读"，先不追求正确率',measure:'每月做一次模考看涨跌',win:'稳过目标分数线'};
DIM['读更多书/写作']={goal:'每周固定读X分钟+输出1页卡片/随笔',micro:'今天先"翻开书读到第10页 + 写3行读后感"',measure:'每月末数篇数，行多于质先保量',win:'年底抽屉里有12本读完的书+'};
DIM['存钱/理财']={goal:'每月工资到账先定存/自动扣款',micro:'今天就先把"自动转账/记账"设好，先无痛跑起来',measure:'每月查看储蓄率,目标到X%',win:'数字在app里肉眼可见地涨'};
DIM['学一门技能(剪辑/编程等)']={goal:'每周2次小任务+1次整块练习，产出作品存档',micro:'今天先"打开软件照着教程做5分钟"就行',measure:'以"完成的作品数"记进度',win:'能拿出1段自己得意的成品'};
DIM['早睡早起/自律生活']={goal:'固定X点睡X点起，逐步提前15分钟',micro:'今天先"把手机放客厅充电+提前10分钟躺下"',measure:'记录睡眠时长连续性的断档天数',win:'睡醒不用闹钟也有精神'};
function enemyTip(enemy){
 return {
 '坚持不了几天就想放弃':'中断不可怕，先原谅自己再继续才关键——给自己设"重置日"而不是"末日"，停一天没关系，停两周才叫失败。',
 '没时间/太忙':'目标要配得上生活流速。方案里的微动作≤5分钟，忙到飞起时只做"最小的那一步"也算打卡。',
 '成果太慢看不到进步':'进步是被测量的，不是被感觉的。把"每周量一次"写进日历，让数据替你的努力说话。',
 '跟朋友一比就焦虑':'不要横向攀比进度。你的对手是上周的自己，进度条只跟自己的昨天比，别人晒的只是他想让你看到的。'
 }[enemy];
}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('年初Flag防倒塌校准助手 | AgentGongju.com'))return;
const goalType=document.getElementById('goalType').value;
const time=document.getElementById('time').value;
const goalTxt=document.getElementById('goal').value.trim();
const enemy=document.getElementById('enemy').value;
const past=document.getElementById('past').value;
const D=DIM[goalType];
let r='🎯 你的目标原文：'+(goalTxt||DIM[goalType].goal)+'\n';
r+='每日可支配：'+time+'\n';
r+='最怕的中途翻车点：'+enemy+'｜去年卡在：'+past+'\n\n';
r+='────────\n';
r+='■ 第1步｜把目标改小到"不会怕"\n';
r+='原本目标 × 拆成第一周只做一件事：\n· '+D.micro+'\n';
r+='先跑到 21 天再说"升级"。请把上面的目标写成一行贴在看得到的地方。\n\n';
r+='■ 第2步｜每周节奏表（防倒核心）\n';
r+='· 周一到周五：每日固定时段做日常，难度记作"轻"（'+(time.indexOf('周末')>-1?'周末集中，平日只做3分钟保底':'确保当天真的有那个时间段')+'）；\n';
r+='· 周六：奖励自己或休息半天；\n· 周日：花5分钟做「+1」周复盘——完成了几次？哪天的流程最容易断，下周怎么避开？\n\n';
r+='■ 第3步｜记录与可见反馈\n';
r+='· 用一张月历贴纸：做一次贴一颗，不许补；\n· 总目标进度用「'+D.measure+'」来量（减少虚无感）；\n· 预设"赢了"长这样：'+D.win+'。\n\n';
r+='■ 第4步｜针对你最容易倒的雷点，专治药方\n';
r+='雷点「'+enemy+'」：'+enemyTip(enemy)+'\n';
r+='去年卡在「'+past+'」的对策：'+(
 past.indexOf('想')>-1?'先做5分钟再决定要不要继续，最怕的是光想不做。': 
 past.indexOf('三分钟')>-1?'把难度主动降到"毫不费力"，先形成"每天到点就做"的肌肉记忆，再谈强度。':
 past.indexOf('中断')>-1?'中断=正常。提前定好"错过也不算失败，明天早起10分钟补回来"，不让一次断档带走全部。':
 '放下"最好再准备一下"的念头，今天就先做一个粗糙却真实的完成品，迭代比完美优先。')+'\n\n';
r+='────────\n一句话给自己：完成>完美，坚持>强度。把Flag从"愿望"调成"流程"，它就不会再三月而亡。';
document.getElementById('outputBox').innerText=r;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 防倒方案已复制！'))}
</script>
