<div class="tool-container">
<div class="tool-header"><h1>🏠 AI 租房押金退还助手</h1><p>判断房东扣款是否合法，生成退租验房清单＋要押金话术</p></div>
<div class="card">
<div class="param-row">
<div><label>💰 押金金额（元）</label><input type="number" id="deposit" value="4500" min="0" max="500000"></div>
<div><label>🗓 已租住时长（月）</label><input type="number" id="months" value="12" min="0" max="240"></div>
</div>
<div class="param-row">
<div><label>🏙 所在城市类型</label>
<select id="city"><option value="a" selected>一线城市（北上广深）</option><option value="b">二线城市</option><option value="c">三四线/县城</option></select></div>
<div><label>📄 是否签了书面合同</label>
<select id="contract"><option value="1" selected>签了正规租赁合同</option><option value="2">只有微信约定/口头</option><option value="3">和二房东/中介签的</option></select></div>
</div>
<div><label>🔍 房东要扣钱的理由（可多选，用逗号分隔的编号）</label>
<select id="reasons" multiple size="7" style="padding:10px">
<option value="1" selected>墙面有钉子孔/掉漆</option>
<option value="2">家具家电自然老化</option>
<option value="3">地毯/沙发正常使用污渍</option>
<option value="4">「房子要重新刷漆/保洁」</option>
<option value="5">「提前退租违约金」</option>
<option value="6">「押金抵最后一个月水电费」</option>
<option value="7">「合同写了不退押金」</option>
<option value="8">说不清理由，就是不想退</option>
</select>
<div class="tips">按住 Ctrl（Mac 用 ⌘）可多选</div></div>
<div class="param-row">
<div><label>🧾 房东能提供的证据</label>
<select id="proof"><option value="0" selected>没有任何证据/照片</option><option value="1">有入住和退房对比照片</option><option value="2">有第三方检测/维修报价单</option></select></div>
<div><label>💬 你的态度倾向</label>
<select id="tone"><option value="1" selected>先好好谈，不想闹大</option><option value="2">谈不拢就走法律程序</option><option value="3">金额不大，只想要回一部分</option></select></div>
</div>
<label>📝 补充情况（可选，越具体越准）</label>
<textarea id="note" placeholder="例：房东说要扣 2000 元刷墙费和 500 元保洁费，但我入住时墙就是旧的，合同里也没写这些，押金条我留着"></textarea>
<button class="btn-gen" id="genBtn">🏠 生成退押金方案</button>
<div class="tips">⚠️ 押金纠纷属民事纠纷，本工具依据《民法典》第 703-734 条及常见司法实践给出判断，仅供参考，不构成法律意见。</div>

<script>
function money(n){return Math.round(n*100)/100;}
function pick(id){
  var sel=document.getElementById(id), out=[];
  for(var i=0;i<sel.options.length;i++){ if(sel.options[i].selected) out.push(+sel.options[i].value); }
  return out;
}
function gen(){
  var dep=+document.getElementById('deposit').value||0;
  var months=+document.getElementById('months').value||0;
  var city=document.getElementById('city').value;
  var contract=document.getElementById('contract').value;
  var reasons=pick('reasons'); if(!reasons.length) reasons=[8];
  var proof=+document.getElementById('proof').value;
  var tone=+document.getElementById('tone').value;
  var note=document.getElementById('note').value.trim();

  var legal=[], illegal=[], partial=[];
  var has=function(r){return reasons.indexOf(r)>-1;};
  var lost=0;

  if(has(1)){ // 钉子孔等使用痕迹
    if(months>=12){ partial.push('墙面钉子孔/轻微掉漆：长期正常使用的痕迹，属于「合理损耗」，房东不能全额索赔。若确需修补，应按实际修补成本分摊，通常几十到几百元。'); lost+=Math.min(dep*0.05,300); }
    else { partial.push('墙面钉子孔/掉漆：短期租住若确有明显人为损坏，房东可要求合理修补费，但必须提供维修单据，且金额应等于实际支出。'); lost+=Math.min(dep*0.08,400); }
  }
  if(has(2)){ legal_free('家具家电自然老化：这是典型的自然损耗（《民法典》第 713 条），房屋及设施的自然损耗由出租人承担，不得扣押金。'); }
  if(has(3)){ partial.push('地毯/沙发的正常使用污渍：若属正常使用产生的磨损，房东不能扣；若可清洗还原，只能扣实际清洗费（一般 100-300 元）。'); lost+=Math.min(200,dep*0.05); }
  if(has(4)){ partial.push('「重新刷漆/整体保洁」：房东以「房子要翻新再出租」为由扣款几乎一定不成立——那是房东为下次出租投入的成本，与你的使用无关。最多扣实际发生的退租保洁费（约 100-300 元）。'); lost+=Math.min(300,dep*0.06); }
  if(has(5)){
    if(months>0){
      partial.push('「提前退租违约金」：违约金需合同明确约定，且一般不超过 1 个月租金。若你已找到接租人、或房东无实际损失，可主张减少；《民法典》第 585 条规定过分高于损失的违约金可请求调减。');
      lost+=Math.min(dep*0.25, 99999);
    }
  }
  if(has(6)){ legal_free('「押金抵最后水电费」：这部分是合理的——只要房东能提供水电燃气缴费凭证，按实际用量扣除即可，剩余的必须退还。'); }
  if(has(7)){ illegal.push('「合同写了押金不退」：此类条款属于免除出租方责任、加重承租方责任的不公平格式条款，依《民法典》第 497 条可主张无效。押金本质是担保，租客无违约时应当全额退还。'); }
  if(has(8)){ illegal.push('「说不清理由就是不退」：房东拒不退还押金且无正当理由，构成不当得利。你可依法主张返还本金，情节恶劣的还可主张占用期间的利息损失。'); }

  function legal_free(t){ legal.push(t); }

  var claimBack=Math.max(dep-lost,0);
  var out='════ 押金退还评估报告 ════\n\n';
  out+='押金总额：'+money(dep)+' 元\n';
  out+='已租住：'+months+' 个月\n';
  out+='合同形式：'+(contract==='1'?'正规书面租赁合同':contract==='2'?'仅微信/口头约定（法律上同样有效，但举证更难）':'与二房东/中介签订（注意其转租权）')+'\n';
  out+='房东举证情况：'+(proof===0?'无任何证据 —— 这对你非常有利':proof===1?'有入住/退房对比照片':'有第三方维修报价或检测单')+'\n\n';

  out+='──── 一、房东扣款合法性判定 ────\n';
  if(illegal.length){
    out+='🔴 以下扣款【违法/无效】，你可以拒付：\n';
    for(var i=0;i<illegal.length;i++) out+='   '+illegal[i]+'\n';
    out+='\n';
  }
  if(partial.length){
    out+='🟡 以下扣款【可争取】，通常只需承担一小部分：\n';
    for(var j=0;j<partial.length;j++) out+='   '+partial[j]+'\n';
    out+='\n';
  }
  if(legal.length){
    out+='🟢 以下扣款【合理】，一般难以追回：\n';
    for(var k=0;k<legal.length;k++) out+='   '+legal[k]+'\n';
    out+='\n';
  }

  out+='──── 二、金额测算 ────\n';
  out+='房东可能主张扣款：约 '+money(dep-claimBack)+' 元\n';
  out+='👉 你依法应能要回：约 '+money(claimBack)+' 元\n';
  out+='占比：'+Math.round(claimBack/dep*1000)/10+'%\n';
  if(proof===0) out+='💡 房东拿不出证据，实践中「谁主张谁举证」，扣款主张基本无法成立，你应主张【全额退还 '+money(dep)+' 元】。\n';
  out+='\n';

  out+='──── 三、核心法律依据（谈判时直接引用）────\n';
  out+='1. 《民法典》第 703 条：租赁合同是出租人将租赁物交付承租人使用、收益，承租人支付租金的合同。\n';
  out+='2. 《民法典》第 713 条：承租人在按约定的方法或租赁物性质使用租赁物，致使租赁物受到损耗的，不承担赔偿责任 —— 这就是「自然损耗不赔」。\n';
  out+='3. 《民法典》第 714 条：承租人应按约定方法使用租赁物；未按约定造成损失的，出租人可要求赔偿。举证责任在出租人。\n';
  out+='4. 《民法典》第 585 条：约定的违约金过分高于造成的损失的，可请求法院适当减少（常见标准：超过实际损失 30% 即为过高）。\n';
  out+='5. 《民法典》第 497 条：「押金一律不退」类加重承租人责任的格式条款无效。\n';
  out+='💡 押金不是罚款，是担保。房东想扣钱，必须证明「损失真实存在 + 金额有依据 + 是你造成的」，三者缺一不可。\n\n';

  out+='──── 四、退租验房清单（退租当天照着做）────\n';
  out+='□ 提前 1 周通知房东，微信文字约退房时间（留痕）\n';
  out+='□ 退房当天全程录像，从进门开始连续拍摄，拍摄日期要能体现\n';
  out+='□ 逐间拍照：墙面、地面、天花板、门窗、水龙头、马桶、热水器\n';
  out+='□ 家电通电测试并录像：空调制冷/热水器点火/冰箱制冷/洗衣机进水\n';
  out+='□ 抄录水表、电表、燃气表读数并拍照，当场结清水电\n';
  out+='□ 让房东当面签署《退房交接单》，写明「房屋状态已验收，无异议」\n';
  out+='□ 索要押金退还承诺：书面/微信文字写清退还金额和日期\n';
  out+='□ 交接钥匙时让房东签收，避免事后反咬「没还钥匙」\n';
  out+='□ 把自己的快递、物业登记、宽带户名全部迁走或注销\n\n';

  out+='──── 五、要回押金的行动路线 ────\n';
  out+='第 1 步｜微信文字正式主张（今天发）\n';
  out+='   直接发：「X 先生/女士，本月 X 日已退房并完成交接，房屋符合约定状态。押金 '+money(dep)+' 元请于 X 日内退至我的账户 xxx。如需扣款请提供维修发票或支出凭证，我们按实际金额结算。」\n';
  out+='   ⚠️ 关键：用文字沟通，别只打电话 —— 通话无法留证。\n\n';
  out+='第 2 步｜发《律师函》式正式通知（7 天后无果）\n';
  out+='   写明欠款金额、事实经过、法律依据、最后期限（一般给 7-15 天），声明逾期将向法院起诉并主张诉讼费、利息。\n\n';
  out+='第 3 步｜投诉施压（免费且见效快）\n';
  out+='   · 找中介公司总部投诉（若通过链家/贝壳/自如等平台租的，直接打总部客服，平台有押金监管义务）\n';
  out+='   · 拨打 12345 市民热线转住建部门，投诉租赁纠纷\n';
  out+='   · 若涉及二房东无转租权/违规隔断，可向住建局举报，房东往往秒退\n;\n';
  out+='第 4 步｜起诉（金额小、成本极低）\n';
  out+='   · '+(dep<=10000?'本案金额较小，走【小额诉讼程序】一审终审，诉讼费一般 25-50 元，可网上立案、可缺席审理，不用请律师。':'金额较大，建议准备好证据链，必要时咨询律师。')+'\n';
  out+='   · '+(city==='a'?'一线城市法院对租赁押金案件处理成熟，网上立案（人民法院在线服务小程序）当天就能提交，胜诉率很高。':city==='b'?'二线城市可先走社区调解或住建部门调解，不成再诉讼。':'小城市建议先找街道/社区调解，实在不行再起诉。')+'\n';
  out+='   · 管辖法院：房屋所在地法院（专属于不动产纠纷）\n\n';

  out+='──── 六、你的证据清单（现在就开始收集）────\n';
  out+='□ 租赁合同原件/照片（重点看押金条款、违约条款）\n';
  out+='□ 押金收据 / 转账记录（微信、支付宝、银行流水截图，带时间和对方账户名）\n';
  out+='□ 退房时的照片和视频（带拍摄日期）\n';
  out+='□ 与房东的全部聊天记录（导出备份，别删）\n';
  out+='□ 水电燃气缴费凭证\n';
  out+='□ 入住时的房屋照片（如当时拍过，能直接反证「你来时就是旧的」）\n\n';

  if(tone===1){ out+='──── 七、沟通策略（你选了「先好好谈」）────\n'; out+='· 立场要软、证据要硬。先表达理解，再明确说明哪些扣款缺乏依据，最后给一个「各让一步」的方案。\n'; out+='· 可以主动提出：「我接受扣除实际的保洁费 XXX 元，其余 '+money(claimBack)+' 元请退还，我们当天结清互不追究。」——给对方台阶下，往往比硬刚要得快。\n'; out+='· 但底线要守住：不要签任何写有「押金已结清、双方再无任何争议」的文件，除非钱已经到账。\n'; }
  else if(tone===2){ out+='──── 七、沟通策略（你选了「走法律程序」）────\n'; out+='· 直接启动第 1→2→4 步，跳过反复拉扯。诉讼时效为 3 年，但越早立案越好。\n'; out+='· 起诉前把请求权基础写清楚：不当得利返还 或 合同之债要求返还押金，二者可选，押金纠纷通常按合同纠纷主张。\n'; out+='· 数额小也不用怕，小额诉讼一审终审、网上立案，很多人半个月就拿回钱。\n'; }
  else { out+='──── 七、沟通策略（你选了「只要回一部分」）────\n'; out+='· 建议以「依法应退 '+money(claimBack)+' 元」为锚点开口，留出谈判空间，最终接受不低于 70% 的和解方案即可视为成功。\n'; out+='· 快速和解换取时间成本，是理性选择——但要确保钱到账再签结清协议。\n'; }

  if(note){
    out+='\n──── 针对你描述的情况 ────\n';
    out+='你说：'+note+'\n\n';
    if(/刷墙|翻新|重新装|墙皮/.test(note)) out+='· 「刷墙费」是退租扣款第一大坑。房子住久了墙自然会旧，房东为下次出租做的翻新是【他自己的经营成本】，不能转嫁给你。要求他提供「本次退租后实际发生的刷墙发票」，拿不出来就不认。\n';
    if(/保洁|打扫|卫生/.test(note)) out+='· 「保洁费」最多按实际发生的退租保洁支出扣，通常 100-300 元。房东随口报 500、800 的，一律要求提供保洁公司的收费凭证。\n';
    if(/押金条|押金收据|收据/.test(note)) out+='· 你保留了押金条，很好。押金条 + 转账记录 + 合同，构成完整证据链，证明「你交了这笔钱、对方欠这笔钱」。\n';
    if(/合同.*没写|没约定|合同里没有/.test(note)) out+='· 合同没约定的扣款项目，房东无权主张。「合同没写」对你是最强辩护，直接拿出来说。\n';
    if(/旧|原来就|本来就|入住时/.test(note)) out+='· 你能说明损坏是入住前就存在的，举证责任就移回房东身上——他要证明是你造成的，否则不能扣。\n';
    if(/二房东|转租/.test(note)) out+='· 二房东的风险点在于其转租权。若大房东未同意转租，你可以直接联系大房东说明情况，大房东往往会协助你，二房东也常因此迅速退钱。\n';
    if(/中介|平台|链家|贝壳|自如/.test(note)) out+='· 通过平台/中介租的，平台对押金通常有监管或先行赔付机制，直接打总部客服投诉比跟门店扯皮高效得多。\n';
    out+='· 总之：先固定证据 → 文字主张 → 施压投诉 → 小额诉讼，四步走完很少有人拿不回押金。\n';
  }
  out+='\n💡 一句话：押金是担保不是罚款。房东扣款必须「有依据、有凭证、是你造成的」，缺一条你就可以不认。\n';
  return out;
}
function copyResult(){
  var t=document.getElementById('outputBox').innerText;
  if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){alert('已复制到剪贴板 ✅');},function(){fallbackCopy(t);});}
  else fallbackCopy(t);
}
function fallbackCopy(t){
  var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');alert('已复制到剪贴板 ✅');}catch(e){alert('复制失败，请手动选中复制');}document.body.removeChild(ta);
}
document.getElementById('genBtn').addEventListener('click',function(){
  var box=document.getElementById('outputBox');
  box.textContent=gen();
  document.getElementById('resultArea').classList.add('active');
  document.getElementById('resultArea').scrollIntoView({behavior:'smooth',block:'start'});
});
</script>
