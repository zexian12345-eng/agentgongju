<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 工作总结 | AgentGongju.com</title>
<meta name="description" content="AI工作总结/述职报告生成器，输入工作内容自动生成季度、年度总结，含成绩、不足与规划">
<meta name="keywords" content="AI工作总结,年终总结,述职报告,季度总结,汇报,职场工具">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;font-size:.92rem;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🗂️ AI 工作总结</h1><p>零散工作变高分述职报告，成绩不足规划全都有</p></div>

<div class="card">
<label>🗒️ 简单描述这段时间的工作内容</label>
<textarea id="work" placeholder="例如：负责用户增长，做了两次大促活动，上线了新会员体系，处理客户投诉"></textarea>
<div class="param-row">
<div><label>📅 总结类型</label>
<select id="type"><option value="季度总结">季度总结</option><option value="半年总结">半年总结</option><option value="年度总结">年度总结</option><option value="项目总结">项目总结</option></select></div>
<div><label>👤 汇报对象</label>
<select id="aud"><option value="部门主管">部门主管</option><option value="老板">公司老板</option><option value="HR">HR 绩效</option></select></div>
</div>
<div class="param-row">
<div><label>🏆 主要成绩（可选）</label><input type="text" id="achieve" placeholder="例如：用户增长40%，转化率提升15%"></div>
<div><label>📝 篇幅</label>
<select id="len"><option value="精简">精简</option><option value="标准" selected>标准</option><option value="详细">详细</option></select></div>
</div>
<button class="btn-gen" id="genBtn">✨ 生成工作总结</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">✍️ 你的工作总结</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制总结</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const openers={部门主管:'敬爱的领导，现将近期工作情况汇报如下。',老板:'致老板，以下为本阶段工作总结。',HR:'结合绩效考核要求，陈述本阶段工作如下。'};
const closes={部门主管:'恳请领导批评指正，我将继续努力。',老板:'感谢老板关注，愿为公司创造更大价值。',HR:'以上为本阶段总结，请审阅。'};
const growth=['在复盘中发现，对自动化流程理解还需加深','跨团队沟通效率有提升空间','对行业新技术保持持续跟踪学习','在时间管理上可进一步优化','需加强数据复盘与沉淀能力'];
const plan=['聚焦核心目标，提高投入产出比','加强跨部门协作与对齐机制','持续迭代流程，沉淀可复用方法论','提升自身专业深度与行业视野','探索新增长点，为团队注入新动能'];
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 工作总结 | AgentGongju.com'))return;
const work=document.getElementById('work').value.trim();
const type=document.getElementById('type').value;
const aud=document.getElementById('aud').value;
const ach=document.getElementById('achieve').value.trim();
const len=document.getElementById('len').value;
if(!work){alert('请先填写工作内容');return;}
const arr=work.split(/[、，,；;。]/).filter(x=>x.trim());
const title={季度总结:'季度工作总结',半年总结:'半年度工作总结',年度总结:'年度工作总结',项目总结:'项目总结报告'}[type];
const g=growth[Math.floor(Math.random()*growth.length)];
const p=plan[Math.floor(Math.random()*plan.length)];
let out='【'+title+'】\n'+openers[aud]+'\n\n一、工作概述\n· 本阶段围绕核心目标开展工作，主要涉及：'+arr.slice(0,6).map(x=>'「'+x.trim()+'」').join('、')+'等事项。\n';
out+='\n二、主要成绩\n';
if(ach){out+='· '+ach+'，为核心目标达成作出积极贡献。\n';}
out+='· 各项目按计划推进，整体进展顺利，团队协作高效。\n· 及时响应并处理各类突发事项，保障业务平稳运行。\n';
if(len==='详细'){out+='· 通过流程优化，工作交付质量与效率得到明显提升。\n· 主动承担额外任务，协助团队解决关键问题。\n';}
out+='\n三、存在的不足\n· '+g+'。\n';
out+='\n四、下一阶段规划\n· '+p+'。\n';
out+='· 持续围绕部门目标，稳扎稳打，确保按期高质量交付。\n\n'+closes[aud];
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 总结已复制！'))}
</script>
</body>
</html>
