<div class="tool-header"><h1>🔑 密码生成器</h1><p>一键生成高强度随密码</p></div>

<div class="card"><div class="param-row"><div><label>密码长度</label><input type="number" id="len" value="16" min="8" max="64"></div></div>
<label style="margin:10px 0 5px">包含字符类型：</label>
<label style="display:flex;align-items:center;gap:8px;margin:4px 0"><input type="checkbox" id="upper" checked> 大写字母 (A-Z)</label>
<label style="display:flex;align-items:center;gap:8px;margin:4px 0"><input type="checkbox" id="num" checked> 数字 (0-9)</label>
<label style="display:flex;align-items:center;gap:8px;margin:4px 0"><input type="checkbox" id="sym" checked> 特殊字符 (!@#$)</label>
<button class="btn-gen" id="pwdBtn">🔑 生成密码</button></div>

<script>

document.getElementById('pwdBtn').addEventListener('click',()=>{
if(!Paywall.countUse('密码生成器 | AgentGongju.com'))return;
const len=parseInt(document.getElementById('len').value)||16;const includeUpper=document.getElementById('upper').checked;const includeNum=document.getElementById('num').checked;const includeSym=document.getElementById('sym').checked;
let chars='abcdefghijklmnopqrstuvwxyz';if(includeUpper)chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';if(includeNum)chars+='0123456789';if(includeSym)chars+='!@#$%^&*()_+-=[]{}';
let pwd='';const arr=new Uint32Array(len);crypto.getRandomValues(arr);for(let i=0;i<len;i++)pwd+=chars[arr[i]%chars.length];
const out='🔑 生成的强密码：\n\n'+pwd+'\n\n密码长度：'+len+' 位\n包含大写字母：'+includeUpper+'\n包含数字：'+includeNum+'\n包含特殊字符：'+includeSym+'\n\n⚠️ 请妥善保存！';
document.getElementById('resultArea').classList.add('active');document.getElementById('result').textContent=out;});
</script>
