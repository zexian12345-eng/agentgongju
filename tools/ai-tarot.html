<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.cards-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.tarot-card{background:rgba(255,255,255,0.04);border:1px solid rgba(99,102,241,0.35);border-radius:14px;padding:16px;text-align:center}
.tarot-card .pos{font-size:.8rem;color:#a855f7;font-weight:700;margin-bottom:8px}
.tarot-card .em{font-size:2rem;margin-bottom:6px}
.tarot-card .card-name{font-weight:700;color:#e2e8f0;margin-bottom:6px}
.tarot-card .card-desc{font-size:.82rem;color:#94a3b8;line-height:1.6}
.interpret{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-row,.cards-row{grid-template-columns:1fr}}
</style>

<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🔮 AI 塔罗占卜</h1><p>抽一张圣三角牌阵，聆听星空的低语</p></div>

<div class="card">
<label>✨ 你想占卜的问题</label>
<textarea id="question" placeholder="例如：我的事业近期会有转机吗？或 我和 TA 的感情发展如何？"></textarea>
<div class="param-row">
<div><label>🎯 主焦点</label>
<select id="focus">
<option value="爱情">💖 爱情</option>
<option value="事业">💼 事业</option>
<option value="财运">💰 财运</option>
<option value="学业">📚 学业</option>
<option value="综合">🌟 综合运势</option>
</select></div>
<div><label>🃏 牌阵风格</label>
<select id="style">
<option value="温柔">✨ 温柔治愈</option>
<option value="犀利">⚡ 犀利直白</option>
<option value="神秘">🌙 神秘诗意</option>
</select></div>
</div>
<button class="btn-gen" id="genBtn">🔮 开始占卜</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:16px">🔮 你的塔罗牌阵</div>
<div class="cards-row" id="cardsRow"></div>
<div class="interpret" id="interpretBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制占卜结果</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const deck=[
{name:'愚者',em:'🃏',desc:'新的开始与冒险',tarot:'正位象征无限可能，逆位则需谨慎冲动'},
{name:'魔术师',em:'✨',desc:'才华与创造力',tarot:'正位象征主动创造，逆位提示空想需落地'},
{name:'女祭司',em:'🌙',desc:'直觉与智慧',tarot:'正位象征静观其变，逆位提示勿凭直觉走偏'},
{name:'女皇',em:'🌷',desc:'丰盛与温柔',tarot:'正位象征丰收和爱，逆位提示勿过度依赖'},
{name:'皇帝',em:'👑',desc:'秩序与领导力',tarot:'正位象征权威掌控，逆位提示放下固执'},
{name:'教皇',em:'📜',desc:'遵循与传承',tarot:'正位象征贵人指引，逆位提示打破常规'},
{name:'恋人',em:'💞',desc:'抉择与结合',tarot:'正位象征灵魂契合，逆位提示面临选择考验'},
{name:'战车',em:'🌠',desc:'意志力与胜利',tarot:'正位象征掌控前行，逆位提示需稳住方向'},
{name:'力量',em:'🦁',desc:'勇气与耐心的力量',tarot:'正位象征以柔克刚，逆位提示勿陷入内耗'},
{name:'隐士',em:'🏮',desc:'独处与内省',tarot:'正位象征沉淀智慧，逆位提示别过度封闭'},
{name:'命运之轮',em:'🎡',desc:'转机与命运流转',tarot:'正位象征时来运转，逆位提示周期波动'},
{name:'正义',em:'⚖️',desc:'平衡与公正',tarot:'正位象征因果公正，逆位提示勿回避责任'},
{name:'倒吊人',em:'🤸',desc:'换个视角',tarot:'正位象征牺牲智慧，逆位提示停止拖延'},
{name:'死神',em:'🌑',desc:'终结与新生',tarot:'正位象征放下旧我，逆位提示拒绝改变会困住自己'},
{name:'节制',em:'💧',desc:'调和与耐心',tarot:'正位象征平衡适中，逆位提示控制过度欲望'},
{name:'恶魔',em:'😈',desc:'诱惑与束缚',tarot:'正位提示脱离执念，逆位提示认清欲望'},
{name:'高塔',em:'⚡',desc:'剧变与觉醒',tarot:'正位象征突遭巨变，逆位提示及时止损'},
{name:'星星',em:'⭐',desc:'希望与疗愈',tarot:'正位象征前路有光，逆位提示重拾信心'},
{name:'月亮',em:'🌕',desc:'潜意识与迷雾',tarot:'正位象征朦胧幻象，逆位提示拨开迷雾'},
{name:'太阳',em:'☀️',desc:'成功与喜悦',tarot:'正位象征大放异彩，逆位提示勿得意忘形'},
{name:'审判',em:'📯',desc:'觉醒与重生',tarot:'正位象征破茧成长，逆位提示直面过去'},
{name:'世界',em:'🌍',desc:'圆满与完成',tarot:'正位象征功德圆满，逆位提示尚未完结'}];
const focusTips={
'爱情':['坦诚沟通会让感情升温','翻篇旧账才能迎来新篇','把脆弱交给对的人，是勇气不是示弱','先爱自己，才有余力爱人'],
'事业':['机会藏在胆量里，勇敢争取','把眼前的项目做到极致，伯乐会看见','别因怕出错而不敢出手','方向比速度更重要，先定战略'],
'财运':['开源胜于节流，伺机而动','量入为出，拒绝冲动消费','把握最近的一波小机遇','稳健布局，收成在耐心后'],
'学业':['方法对了一半，行动补足另一半','把大目标拆成小甜头','苦读不如巧读，善用工具','保持好奇，学海自有舟渡'],
'综合':['这一周的运气整体偏上，保持从容','顺势而为，一切都恰到好处','留意身边的小惊喜','放平心态，好运自来']};
function rand(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 塔罗占卜 | AgentGongju.com'))return;
const q=document.getElementById('question').value.trim()||'关于未来的指引';
const focus=document.getElementById('focus').value;
const style=document.getElementById('style').value;
const pool=shuffle([...deck]).slice(0,3);
const positions=['过去 🌿','现在 🔥','未来 🌈'];
const styleOpen={温柔:'亲爱的，牌面为你带来了温柔的讯息。',犀利:'听好，牌面要给你最直接的提醒。',神秘:'月影筛落，牌阵透露着神秘的低语。'};
const box=document.getElementById('cardsRow');box.innerHTML='';
let interpret=styleOpen[style]+'\n\n';
pool.forEach((c,i)=>{
const rev=Math.random()<0.35;
const div=document.createElement('div');div.className='tarot-card';
div.innerHTML=`<div class="pos">${positions[i]}</div><div class="em">${c.em}</div><div class="card-name">${c.name}${rev?'（逆位）':''}</div><div class="card-desc">${c.desc}</div>`;
box.appendChild(div);
interpret+=`【${positions[i]}】${c.name}${rev?'（逆位）':''} — ${rev?c.tarot.split('正位')[1]||c.tarot:c.tarot.substr(0,14)}。\n`;
});
interpret+='\n针对「'+focus+'」的建议：'+rand(focusTips[focus]);
if(focus==='爱情')interpret+='\n💘 占卜之神寄语：心动都值得真诚相待，愿你被温柔以待。';
document.getElementById('interpretBox').innerText=interpret;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText('【AI 塔罗占卜】\n'+document.getElementById('interpretBox').innerText).then(()=>alert('✅ 已复制！'))}
</script>
