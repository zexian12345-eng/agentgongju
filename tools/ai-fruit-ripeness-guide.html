<div class="tool-container">
<div class="tool-header"><h1>🍉 AI 水果挑熟催熟指南</h1><p>怎么挑、怎么催、怎么存，一次说清</p></div>

<select id="feel">

<option value="soft">已经软了</option>

</select></div>
</div>

<script>
var DATA={
 watermelon:{name:'西瓜',pick:['看瓜脐（底部小圆点）：圈越小越好，说明皮薄肉多','看纹路：纹路清晰、颜色深、间隔宽的成熟度高','看瓜蒂：卷曲发黄的比直的熟，带绿叶的是新摘','拍一拍：声音"嘭嘭"低沉有回响是熟的，声音"当当"脆的是生瓜'],
 ripe:['西瓜不催熟：摘下来基本就定型了，买生西瓜放不甜','买回偏生的，切开后冷藏会略微变甜，但有限'],
 store:['整个西瓜：阴凉通风处放 3-7 天，别晒太阳','切开后：保鲜膜包严，冷藏 2 天内吃完','切开的瓜别超过 3 天，容易细菌超标']},
 mango:{name:'芒果',pick:['闻果柄（蒂头）：有浓郁果香的就是熟了','看颜色：青芒转黄/红晕扩散，但不是看红就熟，主要靠闻和摸','轻按：微微软陷是刚好的，硬邦邦是生的'],
 ripe:['常温 20-25℃ 放 2-4 天可自然熟','加速：和 1 个熟苹果或熟香蕉一起装纸袋，扎口放 1-2 天','千万别生芒果直接冷藏，低温会"冻伤"变黑且不再变甜'],
 store:['生芒果：常温阴凉处，别进冰箱','熟芒果：冷藏可放 3-5 天，用纸包一下别碰水','切开后：冷藏 1 天，尽快吃']},
 kiwi:{name:'猕猴桃',pick:['挑硬实的，回家自己催，软塌的可能已过熟','看表皮：绒毛完整、无皱、无黑斑','大小均匀的比畸形的好'],
 ripe:['最有效：和苹果/香蕉同装塑料袋，扎口，常温 2-4 天','捏两头（不是中间）微软就熟了，中间软往往是烂','一天检查一次，一熟就拿出来，不然全熟透'],
 store:['还没软：常温，别冷藏（会僵住不熟）','软了：冷藏可放 3-5 天','切开后：冷藏 1 天']},
 avocado:{name:'牛油果',pick:['看蒂头小柄：拔掉能看到绿色=熟，褐色=过熟，白色=生','轻按：微微软有弹性最好','太软发黑的别买'],
 ripe:['常温 20-25℃ 放 3-7 天','加速：纸袋 + 一个苹果/香蕉，2-4 天','冷藏会让它停止变熟，但熟后可冷藏保鲜'],
 store:['生的：常温，别冷藏','熟的：冷藏放 3-4 天','切开后：留核、淋柠檬汁、保鲜膜贴面冷藏，1-2 天']},
 banana:{name:'香蕉',pick:['看棱：圆润饱满少棱角的熟','闻香：有明显甜香','表皮有少量"芝麻点"是最甜的时候'],
 ripe:['香蕉自己就是催熟高手，通常不用催','想催：常温装袋即可（会更快）','想慢：单独挂起来，别和别的水果放一起'],
 store:['常温悬挂保存，避免压伤','想多放几天：把根部用保鲜膜包住，减少乙烯释放','放冰箱皮会变黑，但果肉仍可吃 2-3 天']},
 peach:{name:'桃子',pick:['闻香：果香浓郁的好','轻捏：微微软有弹性','看蒂：凹陷处发黄/发红的好'],
 ripe:['常温放 2-3 天变软变甜','装纸袋常温 1-2 天加快','别暴晒，容易蔫'],
 store:['硬桃：常温放软再冷藏','熟桃：冷藏 3-5 天，吃前提前取出回温更香','别洗了再存，吃前再洗']},
 pear:{name:'梨',pick:['看果脐：凹得深、周围圆润的甜','掂重：同大小越重水分越足','表皮有细沙感的粗皮梨往往更甜'],
 ripe:['常温放 3-7 天软化','和苹果同袋可加速','梨比想象中耐放'],
 store:['常温可放 1-2 周','冷藏用纸包好可放 3-4 周','有碰伤的挑出来先吃，会互相传染']},
 persimmon:{name:'柿子',pick:['脆柿：挑硬、颜色橙红均匀的','软柿：挑已经通体红软、蒂部发软的'],
 ripe:['涩柿子去涩：和苹果/香蕉同袋扎口放 2-4 天','白酒法：表皮擦白酒后装袋，3-5 天去涩','民间用温水（40℃）泡 24 小时也可'],
 store:['脆柿：常温 1 周','软柿：冷藏 3-5 天，软柿很容易压坏，单独放','别空腹吃、别和螃蟹同吃（易不适）']},
 pineapple:{name:'菠萝/凤梨',pick:['闻底部：有浓郁果香','看叶：叶子容易拔出的是熟果','掂重：重的汁多'],
 ripe:['菠萝摘后不再变甜，只变软','买回偏生：常温放 1-2 天再吃','切开后泡淡盐水 15-30 分钟可缓解扎嘴'],
 store:['整个：常温 2-3 天','切开：冷藏 2 天内','凤梨比菠萝更甜，可不泡盐水']},
 durian:{name:'榴莲',pick:['闻：浓烈榴莲香=熟，青草味=生，酒味=过熟','看裂口：微微开口最好，大裂口的可能已变质','摇：能听到果肉晃动声说明熟'],
 ripe:['常温放着自然熟，1-3 天','和苹果同袋可加速','闻到香味就每天检查，别放过头'],
 store:['没开壳：常温通风处','开壳后：冷藏 2-3 天，冷冻可放 1 个月','冷冻后口感像冰淇淋']},
 grape:{name:'葡萄',pick:['看白霜：表面有天然白霜是新鲜的','果梗：绿色新鲜的比褐色枯萎的好','轻抖：不掉粒的好'],
 ripe:['葡萄买来就已熟，不用催','不够甜是品种/采摘问题，放久了只会变软'],
 store:['别洗！吃前再洗','冷藏用保鲜袋装，可放 1 周','有坏粒立刻挑掉']},
 orange:{name:'橘子/橙子',pick:['掂重：越重越多汁','看皮：细密光滑、毛孔小的甜','捏：有弹性不塌陷'],
 ripe:['柑橘类离树后甜度基本固定','太酸的可以常温放 2-3 天让酸味降一点'],
 store:['常温阴凉处 1 周','冷藏可放 2-3 周','不要堆叠挤压']}
};
function gen(){
 var f=document.getElementById('fruit').value;
 var d=DATA[f];
 var feel=document.getElementById('feel').value;
 var when=document.getElementById('when').value;
 var temp=document.getElementById('temp').value;
 var buy=document.getElementById('buy').value;
 var problem=document.getElementById('problem').value;
 var out='════ '+d.name+' 挑熟催熟方案 ════\n\n';
 out+='──── 🔍 怎么挑（下次照着买）────\n';
 d.pick.forEach(function(t,i){out+='① ② ③ ④ ⑤ ⑥'[i]+' '+t+'\n';});
 out+='\n──── 🍯 催熟 / 变甜方法 ────\n';
 d.ripe.forEach(function(t){out+='· '+t+'\n';});
 out+='\n──── 📦 保存方法 ────\n';
 d.store.forEach(function(t){out+='· '+t+'\n';});
 out+='\n──── 🎯 针对你现在的情况 ────\n';
 var adv=[];
 if(feel==='hard'&&problem==='notsweet'){
   adv.push('硬且不甜：'+d.name+'完全没熟。按上面催熟法放，最快的方法是"纸袋 + 一个熟苹果/香蕉"，乙烯能明显加快成熟。');
 }else if(feel==='hard'){
   adv.push('还硬：别急着吃，也别冷藏（多数水果低温会"僵住"不再变熟），先常温催熟。');
 }
 if(feel==='soft'&&when==='week'){
   adv.push('已软却还要放一周：尽快冷藏，冷藏能大幅延缓过熟；但洗过或碰水会加速烂，保持干燥。');
 }
 if(feel==='soft'){adv.push('已经软了：说明成熟到位，2 天内吃完最好，再放会过熟发烂。');}
 if(problem==='overripe'){adv.push('快烂了：把完好的部分切掉（烂处要多切 1cm 以上），尽快做成水果汁/冰沙/果酱，别再放。');}
 if(problem==='keep'){adv.push('想多放：'+(f==='banana'?'包住根部、单独悬挂，' :'用纸单果包好再冷藏，')+'并且把熟苹果/香蕉从旁边拿走——它们释放的乙烯是"催熟剂"。');}
 if(temp==='hot'){adv.push('室温高（26℃+）：成熟速度会翻倍，检查频率要提高到每天一次，宁可早点冷藏。');}
 if(temp==='cold'){adv.push('室温低（10℃以下）：催熟会非常慢，可以放到温暖的室内角落，或适当延长等待时间。');}
 if(buy==='crate'){
   adv.push('整箱买的：不要一起催！分成 2-3 份，一份现在催、一份常温慢催、一份直接冷藏，错峰成熟才不会一次全烂。');
   adv.push('箱子里如有一个坏的，立刻捡出来，一颗坏果会带坏一整箱。');
 }
 if(buy==='gift'){adv.push('礼盒装：多半是七分熟采的（耐运输），基本都需要自己催熟 2-5 天，别开箱就吃。');}
 if(when==='today'&&feel==='hard'){
   adv.push('⚠️ 今天就吃但还硬：只能换吃法——切块加酸奶/蜂蜜/榨汁，或者做熟（烤菠萝、炖梨、芒果打冰沙）来掩盖硬涩。');
 }
 if(adv.length===0){adv.push('按上面的通用方法处理即可，注意"催熟靠常温、保鲜靠冷藏"这一条就够用。');}
 adv.forEach(function(t){out+='· '+t+'\n';});
 out+='\n──── 💡 万能口诀 ────\n';
 out+='· 不生吃就先常温催熟，熟了再冷藏；\n';
 out+='· 想快熟：纸袋 + 熟苹果/香蕉；想慢熟：单独放、包根部、冷藏；\n';
 out+='· 催熟靠"闻 + 轻按"，每天都摸一遍，宁早别晚；\n';
 out+='· 切开/洗过的水果，保质期立刻从"天"变成"小时"；\n';
 out+='· 一次别催太多，吃不完的烂得比熟得快。';
 return out;
}
</script>
