<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 客服话术生成 | AgentGongju.com</title>
<meta name="description" content="AI客服话术生成，输入客户问题或场景，自动生成礼貌得体、能解决问题的客服回复话术，电商、售后、售前客服必备">
<meta name="keywords" content="客服话术,客服回复,售前话术,售后话术,客服培训,电商客服">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;margin-bottom:12px;font-size:.92rem}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>
var _hmt = _hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";
  var s = document.getElementsByTagName("script")[0];
  s.parentNode.insertBefore(hm, s);
})();
</script>
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🎧 AI 客服话术生成</h1><p>再棘手的问题，也有得体又暖心的回应方式</p></div>

<div class="card">
<label>💬 客户的问题或场景描述</label>
<textarea id="ask" placeholder="例如：客人收到货发现有个小磕碰很不开心，想退货或补偿。"></textarea>
<div class="param-row">
<div><label>🗂️ 场景类型</label>
<select id="scene">
<option value="售后">📦 售后安抚</option>
<option value="售前">🛒 售前咨询</option>
<option value="退款">💰 退换货</option>
<option value="投诉">🔥 投诉处理</option>
<option value="催单">⏳ 物流/催单</option>
</select></div>
<div><label>🎭 品牌语气</label>
<select id="tone">
<option value="专业">💼 专业稳重</option>
<option value="亲切">😊 亲切温暖</option>
<option value="年轻">✨ 年轻网感</option>
</select></div>
</div>
<div class="param-row">
<div><label>🏷️ 产品名（可选）</label>
<input type="text" id="product" placeholder="例如：保温杯"></div>
<div><label>📦 处理方案倾向（可选）</label>
<input type="text" id="solution" placeholder="例如：可补偿优惠券或免费换新"></div>
</div>
<button class="btn-gen" id="genBtn">🎬 生成客服话术</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">🎧 客服回复话术</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制话术</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const sceneTpl={
'售后':{open:['非常理解您的心情，给您带来不愉快的体验真的很抱歉。','很抱歉给您添麻烦了，您的感受我们特别重视。'],mid:'我们一定会为您妥善处理，请放心。',end:'感谢您的理解与包容，也谢谢您愿意告诉我们真实感受。'},
'售前':{open:['您好呀，很高兴为您服务！','欢迎咨询，您有眼光！'],mid:'您放心，我们的产品口碑一直很不错。',end:'若有任何细节想了解，随时问我哦。'},
'退款':{open:['完全不怪您，确实是我们这边考虑不周。','非常抱歉给您带来困扰。'],mid:'退款流程我们会优先为您处理，第一时间到账。',end:'再次致歉，期盼下次给您更好的体验。'},
'投诉':{open:['实在非常抱歉，给您造成这样的困扰。','您说的这个问题我们高度重视。'],mid:'我已将情况记录并向相关部门反馈，会尽快给您明确答复。',end:'我们一定引以为戒，感谢您的监督与指正。'},
'催单':{open:['让您久等了，非常抱歉！','不好意思让您等待了。'],mid:'我这就帮您查询物流最新状态，并联系仓配加急处理。',end:'一旦有进展第一时间同步给您，感谢耐心等待。'}};
const toneTag={'专业':'您的反馈我们已收悉，将按规范流程为您处理。','亲切':'放心交给我们，一定会帮您办得妥妥的～','年轻':'收到收到，这就给你安排明明白白！'};
function rand(a){return a[Math.floor(Math.random()*a.length)]}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 客服话术生成 | AgentGongju.com'))return;
const ask=document.getElementById('ask').value.trim();
if(!ask){alert('请先描述客户问题或场景');return;}
const scene=document.getElementById('scene').value;
const tone=document.getElementById('tone').value;
const product=document.getElementById('product').value.trim()||'我们的产品';
const solution=document.getElementById('solution').value.trim()||'由我们承担，为您妥善处理';
const t=sceneTpl[scene];
let out=`【${product} · 客服回复】\n\n`;
out+=`${rand(t.open)}\n`;
out+=`关于您提到的问题（${ask.length>40?ask.slice(0,40)+'…':ask}），我已记录并升级处理。\n`;
out+=`${t.mid}\n`;
if(scene==='售后'||scene==='投诉'||scene==='退款'){
out+=`处理方案：${solution}，这是我们能为客户做到的诚意。\n`;
}
out+=`${toneTag[tone]}\n`;
out+=`\n${t.end}`;
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 话术已复制！'))}
</script>
</body>
</html>
