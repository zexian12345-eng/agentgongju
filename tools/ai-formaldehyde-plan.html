<meta name="keywords" content="甲醛检测,除甲醛,新房除味,甲醛超标,装修污染,空气治理">

.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,input[type=text],input[type=number],textarea{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px;box-sizing:border-box}
textarea{min-height:90px;resize:vertical;line-height:1.7}
select:focus,input:focus,textarea:focus{border-color:#6366f1}

.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}

.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}

@media(max-width:600px){.param-row,.param-row3{grid-template-columns:1fr}}

<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🧪 AI 甲醛检测与除醛方案</h1><p>输入房屋情况，生成检测建议＋除醛方案＋预算清单</p></div>
<div class="card">
<div class="param-row">
<div><label>🏠 建筑面积（㎡）</label><input type="number" id="area" value="90" min="10" max="500"></div>
<div><label>📐 户型</label>
<select id="layout"><option value="1.0">两居及以下</option><option value="1.15" selected>三居</option><option value="1.3">四居及以上/复式</option></select></div>
</div>
<div class="param-row">
<div><label>⏳ 装修完工时间</label>
<select id="age"><option value="0">还没完工/正在通风</option><option value="1">1 个月内</option><option value="3" selected>1-3 个月</option><option value="6">3-6 个月</option><option value="12">半年以上</option></select></div>
<div><label>🌬 通风条件</label>
<select id="vent"><option value="1.15">南北通透、风大</option><option value="1.0" selected>普通开窗</option><option value="0.85">单面采光、通风差</option></select></div>
</div>
<div class="param-row">
<div><label>🪵 板材/家具用量</label>
<select id="board"><option value="0.85">少（成品家具为主）</option><option value="1.0" selected>中等</option><option value="1.25">多（全屋定制/榻榻米）</option></select></div>
<div><label>🧒 居住人群</label>
<select id="who"><option value="1.0">成年人</option><option value="1.2">孕妇</option><option value="1.25" selected>有婴幼儿/老人</option></select></div>
</div>
<div class="param-row">
<div><label>🌡 是否已开暖气/空调高温闷放</label>
<select id="heat"><option value="0">否，常温通风</option><option value="1" selected>是，已闷放升温</option></select></div>
<div><label>📟 已做检测？</label>
<select id="tested"><option value="0" selected>没测过，靠闻味</option><option value="1">找过机构检测</option><option value="2">用自测盒/仪器</option></select></div>
</div>
<label>📝 补充情况（异味来源、家人症状等，可选）</label>
<textarea id="note" placeholder="例：主卧衣柜味道最重，孩子早上起来总咳嗽，通风一个月了还是刺鼻"></textarea>
<button class="btn-gen" id="genBtn">🧪 生成除醛方案</button>
<div class="tips">⚠️ 本方案为生活建议，不构成专业检测结论。儿童、孕妇、老人对甲醛更敏感，若出现持续咳嗽、眼睛刺痛、皮疹等症状，请尽快就医并做 CMA 认证检测。</div>
</div>
<div class="result-area" id="resultArea">
<div class="card"><div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制方案</button></div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function gen(){
var area=+document.getElementById('area').value||90;
var layout=+document.getElementById('layout').value;
var age=+document.getElementById('age').value;
var vent=+document.getElementById('vent').value;
var board=+document.getElementById('board').value;
var who=+document.getElementById('who').value;
var heat=+document.getElementById('heat').value;
var tested=+document.getElementById('tested').value;

// 风险评分：面积/户型/板材/人群/通风/时间
var risk=100*board*who/(vent*layout);
if(age<=1)risk*=1.35;else if(age<=3)risk*=1.15;else if(age>=12)risk*=0.7;
var pct=Math.min(99,Math.round(risk*0.62));

var level,ldesc,color;
if(pct<35){level='🟢 甲醛风险较低';ldesc='当前条件下的挥发已进入衰减期，保持通风基本够用，重点盯主卧和定制柜。';}
else if(pct<55){level='🟡 中度风险，需主动治理';ldesc='板材释放仍在高峰期，靠"闻不到味"判断不可靠，建议检测＋持续通风。';}
else if(pct<72){level='🟠 风险偏高';ldesc='板材用量大或通风不足，仅靠开窗很难在短期内降下来，需要组合手段。';}
else {level='🔴 高风险（有敏感人群更危险）';ldesc='当前是典型的超标高发配置。不要急着入住，先检测再治理，敏感人群务必延后。';}

var out='════ 甲醛风险初评与除醛方案 ════\n\n';
out+='建筑面积：'+area+'㎡　｜　风险指数：'+pct+'/100\n';
out+='评估结果：'+level+'\n'+ldesc+'\n\n';

out+='──── 一、先说检测：别靠鼻子判断 ────\n';
if(tested===0){out+='你现在是"靠闻味"，这是最常见的误区。甲醛在 0.1mg/m³ 以下人基本闻不到，但已接近国标限值（0.08mg/m³ 为 GB/T 18883 建议值）。\n';}
else if(tested===1){out+='已做机构检测很棒。注意认准 CMA 资质，且检测前按标准封闭 12 小时（GB/T 18883），开窗测出的数据没有意义。\n';}
else {out+='自测盒/电化学仪器只能做趋势参考，误差大。数值偏高时再用 CMA 机构复测一次才准。\n';}
out+='· 推荐做法：入住前做一次 CMA 检测，重点点位＝主卧＋儿童房＋定制柜最密集的房间。\n';
out+='· 自行初筛：买电化学甲醛仪（百元级）在同一房间多点位测，看趋势即可，别迷信绝对值。\n\n';

out+='──── 二、核心手段（按性价比排序）────\n';
out+='1️⃣ 持续通风（最有效、最便宜）\n';
out+='   每天开窗形成对流至少 2 次、每次 30 分钟以上。'+(vent<1?'你家是单面采光通风差，建议加装一台换气扇或在窗上装排风扇制造对流。':'你家通风条件不错，把柜门、抽屉全部打开一起吹效果翻倍。')+'\n';
if(heat){out+='   ✅ 你已在做高温闷放：先关门关窗闷 6-8 小时让甲醛加速释放，再开窗猛吹，循环往复效率最高。\n';}
else{out+='   💡 建议尝试"闷放法"：白天关窗升温闷放，晚上开窗通风，比 24 小时开窗更快。\n';}
out+='2️⃣ 活性炭/炭包（辅助除味）\n';
out+='   每 10㎡ 放 1-2 包，重点塞进抽屉、柜内、床底。⚠️ 炭包会饱和，每 2-3 周暴晒或更换，否则会把吸附的甲醛再吐出来。\n';
out+='3️⃣ 空气净化器（选带除醛滤芯的）\n';
out+='   认准夹炭量大的除醛滤网或分解型滤芯，CADR 值按房间体积 ×5 选择。'+(who>1.2?'有婴幼儿建议卧室 24 小时低档常开，夜间关窗时尤其有用。':'')+'\n';
out+='4️⃣ 光触媒/除醛喷剂（谨慎）\n';
out+='   短期有效，但需要专业施工且会反弹；劣质产品反而二次污染。若请公司治理，务必签"复检不达标退款"条款。\n';
out+='5️⃣ 绿植/柚子皮/茶叶（无效）\n';
out+='   绿植除醛效率极低（一盆吊兰只能管 1㎡ 以内），柚子皮只是用香味盖住味道，会让你更麻痹。❌ 不推荐作为主力。\n\n';

out+='──── 三、预算清单（面积 '+area+'㎡ 估算）────\n';
var fan=Math.max(1,Math.round(area/40));
var items=[
['电化学甲醛检测仪（自用）','💰 80-200 元','1 台','买回来随时复测，比反复请人测划算'],
['CMA 机构检测（入住前）','💰 300-600 元/点位','2-3 个点位',''+(who>1.2?'有敏感人群必做，这是唯一有法律效力的数据':'可做可不做，求安心建议做')],
['活性炭包','💰 5-15 元/包','约 '+Math.round(area*0.8)+' 包','每 10㎡ 1-2 包，含柜内'],
['换气扇/排风扇','💰 100-300 元',''+fan+' 台',''+(vent<1?'你家通风差，强烈建议':'辅助夜间通风')],
['除醛空气净化器','💰 1500-4000 元','1 台','放卧室或儿童房，看除醛 CADR'],
['专业除醛施工（选做）','💰 25-60 元/㎡','约 '+(area*30)+'-'+(area*60)+' 元','预算 '+(area*30)+'-'+(area*60)+' 元，务必签复检条款']
];
items.forEach(function(it){
out+='· '+it[0]+'　'+it[1]+'　×'+it[2]+'\n';
if(it[3])out+='    → '+it[3]+'\n';
});
out+='\n';
out+='💵 极简方案（通风＋炭包＋仪器）：约 '+(Math.round(area*0.6*10)+150)+'-'+(Math.round(area*0.9*10)+320)+' 元\n';
out+='💵 安心方案（加净化器＋检测）：约 '+(Math.round(area*0.6*10)+2100)+'-'+(Math.round(area*0.9*10)+4700)+' 元\n';
out+='💵 全包方案（加专业治理）：约 '+(Math.round(area*0.6*10)+2100+area*25)+'-'+(Math.round(area*0.9*10)+4700+area*60)+' 元\n\n';

out+='──── 四、时间表 & 入住建议 ────\n';
var wait;
if(age===0)wait='刚完工，至少再通风 3 个月，且必须过第一个夏天后再入住。';
else if(age<=1)wait='刚通风 '+(age*30)+' 天左右，建议再通风 2 个月以上，检测合格再搬。';
else if(age<=3)wait='已通风 1-3 个月，继续通风 1-2 个月，入住前务必测一次。';
else if(age<=6)wait='已通风 3-6 个月，'+(pct>55?'条件偏险，建议先测再定。':'基本可以安排入住，入住前测一次。');
else wait='通风已超半年，挥发大幅衰减，测一次达标即可入住。';
out+='· '+wait+'\n';
if(who>1.2)out+='· ⚠️ 家中有婴幼儿/老人/孕妇：即使检测达标，也建议多通风 1-2 个月，儿童房优先处置。\n';
out+='· 🌞 关键节点：甲醛释放随温度升高而加剧，务必经历过一个完整夏季高温后再判断是否安全。\n\n';

out+='──── 五、马上能做的 5 件事 ────\n';
out+='① 今天就把所有柜门、抽屉、床板打开，别让柜子密闭。\n';
out+='② 买一个电化学甲醛仪，记录每个房间读数做对比。\n';
out+='③ 卧室、儿童房各放一个除醛净化器或加倍炭包。\n';
out+='④ 安排一次 CMA 检测（提前封闭 12 小时）。\n';
out+='⑤ 制定入住前的最晚期限，检测不合格就果断延后，别赌身体。\n\n';

var note=document.getElementById('note').value.trim();
if(note){
out+='──── 六、针对你的情况 ────\n';
out+='你提到：'+note+'\n';
out+='处理建议：\n';
if(/咳|嗓|眼睛|流泪|头痛|痒|皮疹|过敏/.test(note)){
out+='· 家人已出现疑似刺激症状，请优先让敏感成员搬离或住通风好的房间，并尽快就医说明装修时间。\n';
}
if(/衣柜|柜|榻榻米|定制|橱柜/.test(note)){
out+='· 定制柜是重灾区：人不在时全部柜门敞开，可用工业风扇对着柜内吹，快速置换空气。\n';
}
if(/床|主卧|儿童房/.test(note)){
out+='· 卧室是停留时间最长的空间，检测与治理优先安排在这两个房间，标准要比客厅更严。\n';
}
if(/刺鼻|味道|异味/.test(note)){
out+='· 味道重不一定只是甲醛，可能是 TVOC/苯系物，检测时请一并测 TVOC，别只盯甲醛一项。\n';
}
out+='· 建议按上面"核心手段"1→3 顺序执行，先通风＋检测拿到数据，再决定要不要花钱请公司。\n\n';
}
out+='💡 一句话总结：甲醛治理没有捷径，通风是王道，检测是眼睛，'+(who>1.2?'敏感人群宁可晚住三个月，也别拿健康试。':'别信"一次治理终身有效"的话术。');
return out;
}
function copyResult(){
var t=document.getElementById('outputBox').innerText;
if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){alert('已复制到剪贴板 ✅');},function(){fallbackCopy(t);});}
else fallbackCopy(t);
}
function fallbackCopy(t){
var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');alert('已复制到剪贴板 ✅');}catch(e){alert('复制失败，请手动选中复制');}document.body.removeChild(ta);
}
document.getElementById('genBtn').addEventListener('click',function(){
var box=document.getElementById('outputBox');
box.textContent=gen();
document.getElementById('resultArea').classList.add('active');
document.getElementById('resultArea').scrollIntoView({behavior:'smooth',block:'start'});
});
</script>
