<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 话题标签生成器 | AgentGongju.com</title>
<meta name="description" content="输入内容主题，批量生成小红书、微博、抖音等平台的精准话题标签，帮你获得更多流量曝光">
<meta name="keywords" content="话题标签,Hashtag,小红书,微博,#话题,涨粉,流量">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#a5b4fc;line-height:2.2;white-space:pre-wrap;font-size:.92rem;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>
var _hmt = _hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";
  var s = document.getElementsByTagName("script")[0];
  s.parentNode.insertBefore(hm, s);

</script>
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>#️⃣ AI 话题标签生成器</h1><p>精准话题标签，让内容被更多人看见</p></div>

<div class="card">
<label>📝 你的内容主题（一句话描述）</label>
<textarea id="topic" placeholder="例如：分享自己省钱存钱三个月的心得"></textarea>
<div class="param-row">
<div><label>📱 目标平台</label>
<select id="platform"><option value="小红书">🌸 小红书</option><option value="微博">📡 微博</option><option value="抖音">🎬 抖音</option><option value="通用">🌐 通用</option></select></div>
<div><label>🔢 生成数量</label>
<select id="count"><option value="6">6 个</option><option value="10" selected>10 个</option><option value="15">15 个</option></select></div>
</div>
<label>🎯 细分领域（选填，如：健身、穿搭、职场）</label>
<input type="text" id="field" placeholder="如：理财 / 运动 / 美食">
<button class="btn-gen" id="genBtn">✨ 生成话题标签</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">🏷 推荐话题标签</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制全部标签</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const city=['北京','上海','广州','深圳','成都','杭州','重庆','西安'];
const moodTags=['日常','分享','干货','Vlog','成长','避坑','经验帖','宝藏','新手必看','测评','种草','攻略'];
const tips=['『'+['首图清晰、标签放前 3 个最关键','大账号选题库常搜：入门、进阶、避坑','周末发布流量更稳，晚 8 点到 10 点较佳','标签 2-3 个字为宜，读起来更顺口','加一个城市标签能获得同城流量','别用生僻词当标签，搜索量低'].join(' ｜ ')+'』'];
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 话题标签生成器 | AgentGongju.com'))return;
const topic=document.getElementById('topic').value.trim();
const platform=document.getElementById('platform').value;
const num=parseInt(document.getElementById('count').value);
const field=document.getElementById('field').value.trim();
if(!topic){alert('请先输入你的内容主题');return;}
const words=[topic];
if(field)words.push(field);
const seed=words.join('');
const baseTags=['每日分享','生活记录','好物推荐','干货分享','经验总结','打工人日记','自律打卡','快乐分享','避坑指南','涨知识'];
const fieldMap={健身:'健身日常',穿搭:'穿搭灵感',美食:'美食打卡',职场:'职场干货',理财:'理财笔记',旅游:'旅行日记',学习:'学习方法',母婴:'育儿经验'};
const hasField=field&&fieldMap[field]?fieldMap[field]:null;
const pool=[seed];if(hasField)pool.push(hasField);
const tags=[];
// 核心标签
tags.push(seed.replace(/\s/g,''));
if(platform==='小红书')tags.push('小红书热门','今日分享','女生视角');
else if(platform==='微博')tags.push('日常','随手一拍','分享生活');
else if(platform==='抖音')tags.push('涨知识','科普','热门话题');
else tags.push('日常','分享');
if(hasField)tags.push(hasField);
if(topic.length>=4)tags.push(topic.slice(0,4)+'经验');
// 用池子补充
let i=0;
while(tags.length<num){
  let mid=moodTags[(i*3+ (seed.length%moodTags.length))%moodTags.length];
  let cand=mid;
  if(field)cand=field+mid;
  if(!tags.includes(cand))tags.push(cand);
  i++;
  if(i>20)break;
}
tags.length=Math.min(tags.length,num);
const cityTag=city[seed.length%city.length];
let out='# '+platform+' 推荐话题（按建议顺序排列）\n\n';
tags.forEach((t,k)=>{out+=(k+1)+'. '+t+'  #'+t+'\n';});
out+='\n📌 高曝光组合建议\n';
out+='· 首行：#'+tags[0]+'   #'+tags[1]+'   #'+tags[2]+'\n';
out+='· 中间穿插定位：#'+cityTag+'  #本地生活\n';
out+='· 收尾：#你拍到的日常 #自由自在的万物\n\n';
out+='💡 运营小贴士\n· '+tips[0]+'\n· 标签数量过多会被限流，建议正式发布控制在 5-8 个。\n';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 话题标签已复制！'))}
</script>
</body>
</html>
