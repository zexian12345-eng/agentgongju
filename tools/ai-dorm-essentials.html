<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}

.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}

select:focus{border-color:#6366f1}

.result-area{display:none;margin-top:20px}
.result-area.active{display:block}

.item{color:#cbd5e1;font-size:.9rem;line-height:2;padding-left:4px}

<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🎒 AI 宿舍必备清单</h1><p>开学打包不踩坑，该带的一个不落</p></div>

<div class="card">
<label>🎓 学校所在地区</label>
<select id="region"><option value="北方">北方（干燥、冬季冷）</option><option value="南方" selected>南方（潮湿、湿热）</option><option value="沿海">沿海（潮湿多风）</option></select>
<label>🛏 宿舍条件</label>
<select id="cond"><option value="四人间">四人间（常见）</option><option value="六人间">六人间（拥挤）</option><option value="两人间">两人间（宽敞）</option></select>
<div class="param-row">
<div><label>🏠 是否有独立卫浴</label><select id="bath"><option value="yes">有独立卫浴</option><option value="no" selected>公共卫浴</option></select></div>
<div><label>🧑 学生性别</label><select id="gender"><option value="不指定">不指定</option><option value="女生">女生</option><option value="男生">男生</option></select></div>
</div>
<button class="btn-gen" id="genBtn">📦 生成必备清单</button>
<div class="tip">💡 大部分日用品校内超市都能买，别一次性全扛过去，先带"到了就必须用"的。</div>
</div>
<div class="result-area" id="resultArea"><div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 清单已生成</div>
<div id="out"></div>
<button class="copy-btn" onclick="copyResult()" style="margin-top:14px">📋 复制清单</button>
</div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyResult(){navigator.clipboard.writeText(document.getElementById('out').innerText).then(()=>alert('✅ 已复制！'))}
function gen(){
if(!Paywall.countUse('AI 大学宿舍必备清单生成器 | AgentGongju.com'))return;
var region=document.getElementById('region').value,cond=document.getElementById('cond').value,bath=document.getElementById('bath').value,gender=document.getElementById('gender').value;
var must=['身份证、录取通知书、一寸照片（多备几张）','充电器、充电宝、数据线（备2根）','换洗衣物、拖鞋、睡衣','洗漱包：牙刷杯、毛巾、沐浴露、洗发水','常用药：感冒药、肠胃药、创可贴、驱蚊水','雨伞（结实的）、水杯/保温杯','床单被套（确认床尺寸再买）','插线板（带USB口，宿舍插座永远不够）','耳塞+眼罩（宿舍必备神器）','小锁（锁衣柜）、挂钩若干、收纳盒'];
var regionAdd={北方:['加湿器 / 润唇膏（冬季暖气太干）','厚被子、加绒床垫','保暖内衣、暖手宝'],南方:['除湿盒/干燥剂（衣柜必放）','凉席、空调被','雨鞋/速干鞋（梅雨季救命）','防霉条、密封食品罐'],沿海:['防潮箱、密封袋','防风外套','晾衣夹（大风天衣服会飞）']};
var bathAdd={yes:['马桶刷、洁厕灵','浴室置物架、防滑垫','自己的洗发护发（公用易混）'],no:['防水洗漱包（拎着去澡堂）','速干浴巾','浴室拖鞋（防滑，别穿人字拖）']};
var condAdd={四人间:['床帘（遮光+隐私）','小台灯（夹床头的）'],六人间:['壁挂收纳袋（省空间）','折叠小桌板'],两人间:['小型收纳柜','桌面增高架']};
var genderAdd={女生:['化妆镜、化妆包、卸妆用品','卫生巾（备足）、暖宫贴','卷发棒/吹风机（查宿舍功率）'],男生:['剃须刀、洗面奶','运动装备、护腕','备用耳机（打游戏/学习）'],'不指定':['按个人习惯补充护理用品']};
var tech=['笔记本电脑 + 散热支架','U盘/移动硬盘（交作业用）','有线耳机（图书馆网课必备）','转换插头（如有多个设备）'];
function sec(t,arr){return '<div class="cat-t">'+t+'</div>'+arr.map(x=>'<div class="item">☐ '+x+'</div>').join('')}
var html=sec('🔴 必须带（到校即用）',must)+sec('🌡 按地区补充（'+region+'）',regionAdd[region])+sec('🛁 卫浴相关',bathAdd[bath])+sec('🛏 按宿舍人数（'+cond+'）',condAdd[cond])+sec('🧑 个人护理',genderAdd[gender])+sec('💻 学习数码',tech);
var budget={四人间:'约 600-1000 元（不含电脑）',六人间:'约 500-900 元（不含电脑）',两人间:'约 700-1200 元（不含电脑）'}[cond];
html+='<div class="cat-t">💰 预算参考</div><div class="item">'+budget+'，可分两批买：入学前带必需品，到校后再补齐。</div>';
html+='<div class="cat-t">⚠️ 避坑提示</div><div class="item">• 大功率电器（电饭锅、电磁炉）多数宿舍禁用，别买<br>• 床帘先确认学校是否允许，有些学校查得严<br>• 别囤太多纸巾洗衣液，宿舍空间比你想的小<br>• 贵重物品随身带，第一周是丢东西高发期</div>';
document.getElementById('out').innerHTML=html;
document.getElementById('resultArea').classList.add('active');
}
document.getElementById('genBtn').addEventListener('click',gen);
</script>
