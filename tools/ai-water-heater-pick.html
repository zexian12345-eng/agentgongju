<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🚿 AI 热水器选购助手</h1><p>按人数和户型推荐类型、容量与预算</p></div>
<div class="card">
<div class="param-row">
<div><label>👨‍👩‍👧 家庭人数</label>
<select id="people"><option value="1">1-2 人</option><option value="3" selected>3 人</option><option value="4">4 人</option><option value="5">5 人以上</option></select></div>
<div><label>🏠 户型</label>
<select id="house"><option value="small">小户型一厨一卫</option><option value="mid" selected>两卫 / 三居</option><option value="big">大平层 / 别墅</option></select></div>
</div>
<div class="param-row">
<div><label>🔥 有无燃气管道</label>
<select id="gas"><option value="yes" selected>有天然气</option><option value="no">没有，只能用瓶装/通电</option><option value="unknown">不清楚</option></select></div>
<div><label>🛁 使用习惯</label>
<select id="habit"><option value="shower" selected>淋浴为主</option><option value="bath">常泡澡 / 大浴缸</option><option value="multi">多卫生间同时用</option><option value="kitchen">同时用热水洗菜</option></select></div>
</div>
<div class="param-row">
<div><label>💰 预算</label>
<select id="budget"><option value="low">1500 元以内</option><option value="mid" selected>1500-3500 元</option><option value="high">3500 元以上</option></select></div>
<div><label>🧱 安装条件</label>
<select id="cond"><option value="balcony">阳台/厨房可外墙排气</option><option value="inner">只能装在卫生间内</option><option value="nocond">还没确定</option></select></div>
</div>

</div>

<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function gen(){
var p=+document.getElementById('people').value;
var house=document.getElementById('house').value;
var gas=document.getElementById('gas').value;
var habit=document.getElementById('habit').value;
var budget=document.getElementById('budget').value;
var cond=document.getElementById('cond').value;
var out='════ 热水器选购方案 ════\n\n';
out+='──── 🔍 类型怎么选 ────\n';
if(gas==='yes'){
out+='✅ 推荐：燃气热水器（恒温型）\n';
out+='理由：即开即热、不用等、不用储水，适合大多数城市家庭，是首选方案。\n';
out+='· 你的条件有天然气，优先考虑燃气；\n';
out+='· 注意必须是强排式或平衡式（可装室内但需外墙排气）；\n';
out+='· 别买直排式（国家已禁止销售，有中毒风险）。\n';
}else if(gas==='no'){
out+='✅ 推荐：储水式电热水器 或 空气能热水器\n';
out+='理由：无天然气条件下，电热最稳妥；如阳台空间大有预算，空气能更省电。\n';
out+='· 电热：安装简单、价格低，但要提前加热，需要预留容量；\n';
out+='· 空气能：一次投入高（5000+），但省电约 70%，适合长期居住；\n';
out+='· 即热式电热水器功率 6-8kW，老房子电线通常带不动，慎选。\n';
}else{
out+='⚠️ 先确认是否已通天然气（看厨房有没有燃气表/管道）。\n· 有 → 燃气热水器\n· 无 → 储水式电热水器\n';
}
out+='\n──── 📐 升数怎么选 ────\n';
var l,el;
if(habit==='bath'||habit==='multi'){l=16;el=80;}
else if(p>=4){l=16;el=80;}
else if(p===3){l=13;el=60;}
else {l=12;el=50;}
if(house==='big'){l=Math.max(l,20);el=Math.max(el,100);}
out+='· 燃气热水器推荐：'+l+' 升（升数=升温 25℃ 时每分钟出水量）\n';
out+='· 电热水器推荐：'+el+' 升容量\n';
out+='· 参考：单人淋浴 8-10 升/次，泡澡 150 升以上，多卫同时用要加 3-5 升\n';
out+='· 若两个卫生间同时洗澡，燃气建议 16 升以上，否则水温会忽冷忽热\n';
out+='\n──── 💰 预算匹配 ────\n';
if(budget==='low')out+='1500 元内：可选基础款燃气（12-13 升）或 50 升电热。够用但恒温精度一般，冬季可能忽冷忽热。';
else if(budget==='mid')out+='1500-3500 元：主流价位，可以买到带水量伺服器的恒温燃气机（13-16 升），或 60-80 升带速热的电热。这是性价比最高的区间。';
else out+='3500 元以上：可以上高端恒温燃气（零冷水、智能联动）、进口品牌电热，或空气能。建议优先把钱花在"恒温能力"而不是花哨功能上。';
out+='\n\n──── 🔧 安装条件检查 ────\n';
if(cond==='balcony')out+='阳台/厨房可排气：太好了，燃气热水器随便选，注意烟管出口要避开邻居窗户和新风口。';
else if(cond==='inner')out+='只能装卫生间内：⚠️ 燃气热水器必须选"平衡式"（双层烟管，同轴进排气），否则禁止装在浴室内，有中毒风险。更稳妥的选择是电热水器。';
else out+='还没确定安装位置：优先规划在阳台或厨房外墙可排气的墙面，燃气机型选择面最广。';
out+='\n\n──── ⚠️ 避坑要点 ────\n';
out+='1. 燃气热水器必须找有资质的师傅安装，切勿自己接燃气管；\n';
out+='2. 老房子加装燃气机，要先确认燃气公司和物业是否允许；\n';
out+='3. 冬天水温上不去，往往是"升数不够"，而不是机器坏了；\n';
out+='4. 电热水器要定期更换镁棒（1-2 年一次），否则内胆腐蚀漏水；\n';
out+='5. 恒温能力看"是否带水量伺服器"，比"几段火力"重要得多；\n';
out+='6. 别忽略电费：电热一年电费可能比燃气高几百到上千；\n';
out+='7. 零冷水机型方便但耗气，且需要预埋回水管，装修前要规划。\n';
out+='\n──── 🛒 下单前确认清单 ────\n';
out+='□ 燃气类型（天然气12T / 液化气20Y）是否匹配\n';
out+='□ 安装位置是否允许排气\n';
out+='□ 是否包安装、包辅材（烟管、角阀、软管常另收费）\n';
out+='□ 保几年、上门维修是否免费\n';
out+='□ 是否有以旧换新补贴（很多地区有）\n';
return out;
}
</script>
