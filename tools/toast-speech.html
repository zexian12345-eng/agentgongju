<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>应酬敬酒词生成 | AgentGongju.com</title>
<meta name="description" content="职场应酬敬酒词/祝酒词生成器，酒桌饭局得体话术，敬领导、敬同事、敬长辈、敬朋友">
<meta name="keywords" content="敬酒词,祝酒词,应酬话术,酒桌文化,饭局敬酒">
<link rel="stylesheet" href="../css/style.css">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.8;white-space:pre-wrap;min-height:60px;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🍻 敬酒词生成器</h1><p>酒桌应酬得体话术，敬领导、敬同事、敬长辈、敬朋友</p></div>

<div class="card"><div class="param-row">
<div><label>敬谁</label><select id="who"><option>领导</option><option>同事</option><option>长辈</option><option>朋友</option><option>合作伙伴</option><option>全班/全桌</option></select></div>
<div><label>场合</label><select id="occ"><option>公司聚餐</option><option>商务宴请</option><option>婚宴喜事</option><option>家庭聚会</option><option>朋友小聚</option></select></div></div>
<div><label>对方称呼（选填）</label>
<input type="text" id="name" placeholder="例如：王总、李哥、张叔"></div>
<div class="param-row">
<div><label>说话风格</label><select id="style"><option>正式得体</option><option>真诚走心</option><option>幽默轻松</option><option>简短干练</option></select></div>
<div><label>关键祝福方向（选填）</label><select id="wish"><option>身体健康</option><option>事业顺利</option><option>财源广进</option><option>万事如意</option><option>早生贵子/成家</option></select></div></div>
<button class="btn-gen" id="genBtn">🍀 生成敬酒词</button></div>
<div class="result-area" id="resultArea"><div class="card"><div style="color:#22c55e;font-weight:600;margin-bottom:12px">🍷 为你准备的敬酒词</div><div class="result-box" id="out"></div><button class="copy-btn" onclick="copyResult()">📋 复制</button></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyResult(){navigator.clipboard.writeText(document.getElementById('out').textContent).then(()=>alert('✅ 已复制！'))}
const bank={
'领导':['感谢您一直以来的栽培和指导','跟着您学到了很多，收获满满','您辛苦了，这杯敬您的信任','在您带领下，我们都成长了不少'],
'同事':['工作这几年多亏大家照应','平时一起加班奋斗的情谊都在酒里','感谢各位搭档的鼎力支持','一起共事的缘分很珍贵'],
'长辈':['祝您身体健康、笑口常开','感谢您一直以来的关爱与照顾','祝您福寿安康、万事顺遂','您永远是我们的榜样'],
'朋友':['感谢这么多年一直陪着我','咱俩的情谊都在这杯里了','愿你越来越好，事事顺心','有你在的日子总是很暖'],
'合作伙伴':['感谢贵司一路以来的信任','合作共赢，期待更多精彩','愿咱们携手走得更远','祝咱们的合作节节高'],
'全班/全桌':['感谢今天各位赏脸相聚','祝大家都有美好的未来','这杯先干为敬','难得相聚，我敬大家']};
const endings={'健康':'身体健康、万事顺遂','事业':'工作顺利、心想事成','财运':'财源广进、生意兴隆','万事':'天天开心、诸事顺遂','喜事':'喜事连连、顺心如意'};
const opener={'正式得体':'我敬大家，','真诚走心':'来，我敬各位，','幽默轻松':'那我也来凑个热闹，','简短干练':'话不多说，'};
document.getElementById('genBtn').addEventListener('click',()=>{
const who=document.getElementById('who').value;const occ=document.getElementById('occ').value;const name=document.getElementById('name').value.trim();const style=document.getElementById('style').value;const wish=document.getElementById('wish').value;
const pool=bank[who]||bank['朋友'];
const line=pool[Math.floor(Math.random()*pool.length)];
const tgt=name?name:(who==='全班/全桌'?'大家':'您');
const e=endings[wish]||endings['万事'];
let out='【敬'+who+' · '+occ+' · '+style+'】\n\n';
out+=opener[style]+tgt+'，'+line+'。\n';
out+='我祝愿'+tgt+'（或大家）'+e+'，\n';
if(who==='领导'||who==='合作伙伴')out+='也祝咱们团队/合作越来越红火，\n';
out+='感情到位，酒水随意，我先干为敬！🍻';
document.getElementById('resultArea').classList.add('active');
document.getElementById('out').textContent=out;
});
</script>
</body>
</html>
