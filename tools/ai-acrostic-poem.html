<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}

.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,input[type=text],textarea{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
select:focus,input:focus,textarea:focus{border-color:#6366f1}
textarea{min-height:80px;resize:vertical;line-height:1.8}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.poem{background:linear-gradient(135deg,rgba(99,102,241,.1),rgba(168,85,247,.08));border:1px solid rgba(99,102,241,.3);border-radius:16px;padding:24px;margin-bottom:16px}
.poem .t{color:#a5b4fc;font-weight:700;font-size:.9rem;margin-bottom:14px;letter-spacing:1px}
.poem .l{font-size:1.15rem;color:#e2e8f0;letter-spacing:4px;line-height:2.3;font-family:'KaiTi','STKaiti','PingFang SC',serif}
.poem .l em{color:#f472b6;font-style:normal;font-weight:700}
.poem .note{color:#94a3b8;font-size:.8rem;line-height:1.85;margin-top:12px;letter-spacing:0;font-family:inherit}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.tip{color:#94a3b8;font-size:.8rem;margin-top:8px;line-height:1.7}
@media(max-width:600px){.param-row{grid-template-columns:1fr}.poem .l{font-size:.98rem;letter-spacing:2px}}
</style>

<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🖋 AI 藏头诗生成器</h1><p>把名字藏进诗里，比任何礼物都用心</p></div>

<div class="card">
<label>✨ 要藏的字（2-8 个字，如名字、词语、祝福）</label>
<input type="text" id="word" placeholder="例：李思远 或 生日快乐" maxlength="16">
<div class="param-row">
<div><label>📜 诗体</label><select id="form"><option value="七言绝句" selected>七言绝句（4句）</option><option value="五言绝句">五言绝句（4句）</option><option value="七言律诗">七言律诗（8句）</option></select></div>
<div><label>🎨 风格</label><select id="style"><option value="婉约深情" selected>婉约深情</option><option value="豪迈大气">豪迈大气</option><option value="清新自然">清新自然</option><option value="励志祝愿">励志祝愿</option></select></div>
</div>
<div class="param-row">
<div><label>🔀 藏字位置</label><select id="pos"><option value="藏头" selected>藏头（首字）</option><option value="藏尾">藏尾（末字）</option><option value="藏中">藏中（第二字）</option></select></div>
<div><label>🎯 用途（可选）</label><select id="use"><option value="送朋友" selected>送朋友 / 同学</option><option value="表白">表白 / 送恋人</option><option value="生日">生日祝福</option><option value="节日">节日祝福</option><option value="自己收藏">自己收藏</option></select></div>
</div>
<button class="btn-gen" id="genBtn">✨ 生成藏头诗</button>
<div class="tip">💡 诗句由程式化意象组合生成，属于「可用级」创作；想更精妙可以把生成结果发给 AI 再润色。</div>
</div>
<div class="result-area" id="resultArea"><div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 生成结果</div>
<div id="out"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制全部</button>
</div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyResult(){navigator.clipboard.writeText(document.getElementById('out').innerText).then(()=>alert('✅ 已复制！'))}
// 意象词库
var IMG={
 '婉约深情':{
   head:['春风','明月','细雨','清风','夜色','流水','花香','柳影','灯火','轻云','疏星','落梅'],
   mid:['拂过','轻抚','映照','浸润','携来','漫卷','低垂','暗送','悄落','浅映'],
   tail:['入梦来','寄相思','绕心间','满画楼','染衣袖','伴君行','照归途','落满怀','动柔情','湿青衫'],
   mood:'情意绵绵，如细雨润物，含蓄而深长。'},
 '豪迈大气':{
   head:['长风','苍山','万里','浩瀚','铁马','旭日','大江','雷霆','巍峨','天穹','惊涛','孤峰'],
   mid:['横贯','直上','踏破','掀开','劈开','席卷','笑傲','纵览','驰骋','傲立'],
   tail:['动九州','贯长虹','志四方','震八荒','破沧溟','凌九霄','展宏图','定乾坤','壮山河','歌未央'],
   mood:'气吞山河，格局开阔，宜赠有志之人。'},
 '清新自然':{
   head:['青山','溪水','新绿','晨露','野花','竹影','微雨','草色','鸟鸣','云白','田垄','青苔'],
   mid:['倒映','点亮','染透','轻沾','摇曳','拂开','唤醒','铺满','低语','漫溢'],
   tail:['满山冈','入画来','映日红','润如酥','自成诗','过短墙','送清香','染天青','伴人行','共春长'],
   mood:'清朗明净，如雨后天青，读之令人心静。'},
 '励志祝愿':{
   head:['少年','宝剑','韶华','锋刃','前程','星火','破晓','汗水','山海','梦想','跬步','展翼'],
   mid:['不负','磨砺','照亮','铸成','劈出','照亮','踏平','浇灌','跨越','点亮'],
   tail:['终有期','自成锋','不可轻','破万难','皆可期','向朝阳','赴远方','待花开','越千山','上青云'],
   mood:'积极昂扬，寄寓祝愿与勉励。'}
};
function gen(){
 if(!Paywall.countUse('AI 藏头诗生成器 | AgentGongju.com'))return;
 var word=document.getElementById('word').value.trim().replace(/\s/g,'');
 if(!word){alert('先输入要藏的字吧，比如名字～');return;}
 if(word.length<2){alert('至少要 2 个字才有藏头效果哦～');return;}
 var chars=word.split('');
 var form=document.getElementById('form').value,style=document.getElementById('style').value,pos=document.getElementById('pos').value,use=document.getElementById('use').value;
 var need=form==='七言律诗'?8:4;
 var perLine=form==='五言绝句'?5:7;
 // 若字数不够，循环补齐
 while(chars.length<need)chars=chars.concat(word.split(''));
 chars=chars.slice(0,need);
 var lib=IMG[style];
 var pick=function(arr,seed){return arr[(seed*7+3)%arr.length]};
 // 逐句生成
 var lines=[];
 for(var i=0;i<need;i++){
   var c=chars[i];
   var head=pick(lib.head,i+1),mid=pick(lib.mid,i*2+1),tail=pick(lib.tail,i*3+2);
   var body=head+mid+tail; // 5字：头2中2尾1？调整长度
   var line;
   if(pos==='藏头')line=c+body.slice(0,perLine-1);
   else if(pos==='藏尾')line=body.slice(0,perLine-1)+c;
   else line=head.slice(0,1)+c+body.slice(1,perLine-1);
   // 保证长度
   while(line.length<perLine)line+=mid.slice(0,1);
   line=line.slice(0,perLine);
   lines.push(line);
 }
 // 高亮藏字
 function render(ls){
   return ls.map(function(l,i){
     var cs=chars[i];
     var idx=pos==='藏头'?0:(pos==='藏尾'?l.length-1:1);
     var head=l.slice(0,idx),c2=l[idx]||'',tail2=l.slice(idx+1);
     return head+'<em>'+c2+'</em>'+tail2;
   }).join('<br>');
 }
 var out=document.getElementById('out');out.innerHTML='';
 out.innerHTML='<div style="color:#94a3b8;font-size:.85rem;margin-bottom:16px">✨ 藏字：'+chars.join(' ')+' ｜ 📜 '+form+' ｜ 🎨 '+style+' ｜ 🔀 '+pos+' ｜ 🎯 '+use+'</div>';
 var el=document.createElement('div');el.className='poem';
 el.innerHTML='<div class="t">📜 诗成</div><div class="l">'+render(lines)+'</div>'+
   '<div class="note">🎨 风格意象：'+lib.mood+'<br>🔍 藏字位置：'+pos+'（'+chars.join('、')+'）</div>';
 out.appendChild(el);
 // 解析
 var note={送朋友:'适合写在卡片或扉页上。送朋友可以在末尾加一句「愿友谊如诗，历久弥香」。',表白:'表白用藏头诗，含蓄又不失心意。建议手写，比打印更有分量。',生日:'生日送藏头诗，可以把「生日快乐」四字藏进去，再配一张照片。',节日:'节日祝福建议配合节气意象（如春节用梅花、中秋用明月）更应景。',自己收藏:'留作纪念，多年后翻出来会很有意思。'}[use];
 out.insertAdjacentHTML('beforeend','<div class="poem" style="border-color:rgba(34,197,94,.3)"><div class="t">💡 使用建议（'+use+'）</div><div class="note" style="margin-top:0">'+note+'<br><br>📝 可读性提示：本工具生成的是意象组合诗，语句通顺但不一定符合严格格律。若要求高，可把结果发给 AI 对话工具要求「改成符合平仄的七言绝句」，效果会更好。</div></div>');
 // 赠送文案
 out.insertAdjacentHTML('beforeend','<div class="poem" style="border-color:rgba(99,102,241,.35)"><div class="t">💌 附赠一句话</div><div class="note" style="margin-top:0">「'+chars.join('')+'」，把你写进诗里，也写进心里。—— 送你一首独一无二的诗。</div></div>');
 document.getElementById('resultArea').classList.add('active');
}
document.getElementById('genBtn').addEventListener('click',gen);
</script>
</body>
