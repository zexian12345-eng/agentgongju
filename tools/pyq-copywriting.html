<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 朋友圈文案生成 | AgentGongju.com</title>
<meta name="description" content="AI朋友圈文案生成器，按场景风格生成配图建议与走心文案">
<meta name="keywords" content="朋友圈文案,AI文案,发圈文案,社交媒体文案">
<link rel="stylesheet" href="../css/style.css">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:100px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.8;white-space:pre-wrap;min-height:60px;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.tip-box{background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.25);border-radius:10px;padding:14px;color:#4ade80;font-size:.85rem;margin-bottom:12px}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>💬 AI 朋友圈文案</h1><p>按场景与心情生成走心发圈文案和配图建议</p></div>

<div class="card"><label>📌 使用场景</label>
<select id="scene"><option value="旅行出游">旅行出游</option><option value="美食探店">美食探店</option><option value="心情分享">心情分享</option><option value="工作日常">工作日常</option><option value="健身打卡">健身打卡</option><option value="节日祝福">节日祝福</option><option value="晒娃萌宠">晒娃萌宠</option><option value="读书学习">读书学习</option></select>
<div class="param-row" style="margin-top:12px"><div><label>文案风格</label><select id="tone"><option value="文艺">文艺清新</option><option value="幽默">轻松幽默</option><option value="治愈">温暖治愈</option><option value="高冷">简约高冷</option></select></div><div><label>生成数量</label><input type="number" id="count" value="3" min="2" max="5"></div></div>
<textarea id="topic" placeholder="可选：补充你的具体内容，例如：今天去了海边看日落（留空则自动生成）"></textarea>
<button class="btn-gen" id="genBtn">✨ 生成朋友圈文案</button></div>
<div class="result-area" id="resultArea">
<div class="tip-box">💡 小贴士：请补充真实细节，文案会更加真实生动，减少AI感。</div>
<div id="listOut"></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyText(id){const t=document.getElementById(id).innerText;navigator.clipboard.writeText(t).then(()=>alert('✅ 已复制！'))}
const pool={
'旅行出游':{文艺:'把脚步交给山河，把心事留给风。',幽默:'今日步数超标，全凭风景续命～',治愈:'在路上，才发现世界比想象中辽阔。',高冷:'行止随心，见山见海。'},
'美食探店':{文艺:'人间烟火气，最抚凡人心。',幽默:'吃到嘴里的，才是真·心动信号。',治愈:'好好吃饭，才是对生活最大的敬意。',高冷:'今日份甜度，爆表。'},
'心情分享':{文艺:'情绪在杯底沉淀，日子在星光里放晴。',幽默:'心情加载中…请稍候（大概率是loading不出来的那种）',治愈:'阴天也记得给自己暖暖光。',高冷:'今日心情：不上头。'},
'工作日常':{文艺:'把热爱做成事业，每一刻都算数。',幽默:'打工人的快乐，就是下班后的自由。',治愈:'认真工作的人，眼里有光。',高冷:'今日KPI，达成。'},
'健身打卡':{文艺:'汗水是写给身体的情书。',幽默:'今天的我，比昨天的我优秀（以及更能吃）。',治愈:'坚持，是看得见的自律。',高冷:'第N天，练。'},
'节日祝福':{文艺:'愿岁岁常欢愉，年年皆胜意。',幽默:'节日快乐！今天我最大（指胃口）。',治愈:'把祝福装满行囊，愿你一路顺遂。',高冷:'祝：如愿。'},
'晒娃萌宠':{文艺:'你一笑，世界都亮了。',幽默:'今日份可爱超标，请自行充值笑容。',治愈:'小小的你，是时间给的最好的礼物。',高冷:'随手一拍，皆是大片。'},
'读书学习':{文艺:'书页翻动，是灵魂在行走。',幽默:'知识进入大脑，快乐从我脸上溢出。',治愈:'每一次阅读，都是一场与自己的和解。',高冷:'开卷，即有所获。'}
};
const imgMap={'旅行出游':'🏔️ 风景大片 ×1｜人物剪影 ×1','美食探店':'🍜 美食特写 ×3-4 拼图','心情分享':'☕ 饮品 + 窗边光影','工作日常':'💻 桌面专注感 + 城市夜景','健身打卡':'💪 训练照片 + 汗湿感','节日祝福':'🎉 节日氛围 + 礼物细节','晒娃萌宠':'🐱 萌宠/宝宝抓拍九宫格','读书学习':'📚 书页 + 手写笔记特写'};
document.getElementById('genBtn').addEventListener('click',()=>{
const sc=document.getElementById('scene').value;const tone=document.getElementById('tone').value;
const topic=document.getElementById('topic').value.trim();
const n=Math.min(5,Math.max(2,parseInt(document.getElementById('count').value)||3));
const base=pool[sc][tone];let html='';
for(let i=0;i<n;i++){
  const line=(topic?topic+'，':'')+base+(i%2===0?'\n\n#'+sc.replace(/[^\u4e00-\u9fa5]/g,'')+' #记录生活':'');
  html+='<div class="card"><div style="color:#22c55e;font-weight:600;margin-bottom:8px">📝 文案 '+(i+1)+'</div><div class="result-box" id="copy'+i+'">'+line+'</div><div style="color:#94a3b8;font-size:.85rem;margin-bottom:12px">📷 建议配图：'+imgMap[sc]+'</div><button class="copy-btn" onclick="copyText(\'copy'+i+'\')">📋 复制文案</button></div>';
}
document.getElementById('listOut').innerHTML=html;
document.querySelector('.result-area').classList.add('active');
});
</script>
</body>
</html>
