<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 智能聊天 | AgentGongju.com</title>
<meta name="description" content="AI在线聊天模拟器，选择角色即聊即回，陪伴你的每一次对话">
<meta name="keywords" content="AI聊天,智能对话,聊天机器人,在线聊天">
<link rel="stylesheet" href="../css/style.css">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.chatbox{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:20px;min-height:200px;max-height:340px;overflow-y:auto;margin-bottom:16px}
.msg{margin-bottom:14px;display:flex}
.msg .bubble{max-width:75%;padding:11px 15px;border-radius:14px;line-height:1.7;font-size:.92rem}
.msg.bot .bubble{background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-bottom-left-radius:4px}
.msg.user{justify-content:flex-end}
.msg.user .bubble{background:linear-gradient(135deg,#6366f1,#a855f7);color:white;border-bottom-right-radius:4px}
.chat-input{display:flex;gap:10px}
.chat-input input{flex:1;margin-bottom:0}
.btn-send{padding:12px 22px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:10px;color:white;font-weight:600;cursor:pointer;white-space:nowrap}
.role-chip{color:#a5b4fc;font-size:.8rem;margin-bottom:10px}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>💬 AI 智能聊天</h1><p>选个角色，聊你想聊的</p></div>

<div class="card"><label>🤖 选择聊天角色</label>
<select id="role"><option>知心朋友</option><option>专业顾问</option><option>幽默段子手</option><option>暖心树洞</option><option>职场导师</option></select>
<div class="role-chip" id="roleChip">很高兴认识你，有什么想聊的都可以告诉我～</div>
<div class="chatbox" id="chatbox"></div>
<div class="chat-input"><input type="text" id="input" placeholder="输入你的问题，按回车或点击发送..."><button class="btn-send" id="sendBtn">发送</button></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const greet={'知心朋友':'嗨，我是你的知心朋友，今天过得怎么样？','专业顾问':'您好，我是专业顾问，请问有什么可以帮您？','幽默段子手':'哟，来了？想听段子还是想吐槽？','暖心树洞':'这里是树洞，你可以放心说出你的心事。','职场导师':'你好，我是职场导师，有什么职业困惑咱们聊聊。'};
const replies={
'知心朋友':['我懂你的感受，慢慢说，我都在听。','听起来确实不容易，但你已经很棒了。','换个角度想，这也是个成长的机会呀。','不论怎样，我永远站你这边！'],
'专业顾问':['根据您的情况，我建议先明确核心目标。','这个问题可以从数据角度进一步分析。','您提到的情况，通常有几个可行的方案。','建议分步骤执行，并及时复盘调整。'],
'幽默段子手':['哈哈，这问题问得好，就像问初恋为什么分手——说不清但好笑。','兄弟，这事我可太有经验了，上次我就...算了不说了，怕你笑死。','人生就像手机电量，你以为满了，其实后台在耗电！'],
'暖心树洞':['嗯，我在，你慢慢说。','抱抱你，一切都会好起来的。','谢谢你愿意告诉我这些，我很珍惜。','记得对自己温柔一点呀。'],
'职场导师':['这是常见瓶颈，建议先把手头做得好的点放大。','沟通上可以试试主动同步进度，减少猜疑。','你的优势很明显，缺的是把它讲出来。','下个阶段建议聚焦一两个关键目标。']};
let role='知心朋友';
document.getElementById('role').addEventListener('change',e=>{
role=e.target.value;document.getElementById('roleChip').textContent=greet[role];resetChat();
const chat=document.getElementById('chatbox');
chat.appendChild(msg('bot',greet[role]));
});
function msg(who,text){const d=document.createElement('div');d.className='msg '+who;const b=document.createElement('div');b.className='bubble';b.textContent=text;d.appendChild(b);return d}
function resetChat(){const c=document.getElementById('chatbox');c.innerHTML=''}
const chat=document.getElementById('chatbox');chat.appendChild(msg('bot',greet[role]));
function send(){const v=document.getElementById('input').value.trim();if(!v)return;chat.appendChild(msg('user',v));document.getElementById('input').value='';
const pool=replies[role]||replies['知心朋友'];const reply=pool[Math.floor(Math.random()*pool.length)];
setTimeout(()=>{chat.appendChild(msg('bot',reply));chat.scrollTop=chat.scrollHeight;},400);chat.scrollTop=chat.scrollHeight;}
document.getElementById('sendBtn').addEventListener('click',send);
document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
