<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;font-size:.92rem;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.tip{color:#94a3b8;font-size:.85rem;margin-bottom:12px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>
var _hmt = _hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";

  s.parentNode.insertBefore(hm, s);

<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🕹️ AI 像素画提示词生成</h1><p>给它一个主题，还你一段能出图的高级像素风提示词</p></div>

<div class="card">
<label>🎨 想画什么？（主题描述）</label>
<textarea id="topic" placeholder="例如：一只捧着咖啡的可爱柴犬、雨天里撑伞的少女站在霓虹街角、赛博朋克风格的机械猫…"></textarea>
<div class="param-row">
<div><label>👾 画风年代</label>
<select id="era"><option value="8bit" selected>🎮 8-bit 复古</option><option value="16bit">🕹️ 16-bit 精细</option><option value="现代">✨ 现代霓虹</option></select></div>
<div><label>🖼️ 画面氛围</label>
<select id="mood"><option value="温暖" selected>🌅 温暖治愈</option><option value="梦幻">🌌 梦幻奇幻</option><option value="酷炫">⚡ 赛博酷炫</option><option value="清新">🍃 清新简约</option></select></div>
</div>
<div class="param-row">
<div><label>📐 视角构图</label>
<select id="view"><option value="平视" selected>👁️ 平视</option><option value="俯视">🔽 俯视</option><option value="特写">🔍 特写</option><option value="场景">🌆 大全景</option></select></div>
<div><label>🌍 语言</label>
<select id="lang"><option value="双语" selected>🇨🇳🇬🇧 中英双语</option><option value="英文">🇬🇧 English only</option></select></div>
</div>
<button class="btn-gen" id="genBtn">✨ 生成提示词</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 你的像素画提示词</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制提示词</button>
<div class="tip" style="margin-top:12px">💡 小贴士：可直接用于 Midjourney、Stable Diffusion、DALL·E 等工具；把主题替换成想画的内容即可。</div>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const eraTag={'8bit':'8-bit pixel art, retro game style, chunky pixels, limited color palette, NES style','16bit':'16-bit pixel art, detailed sprite, smooth shading, RPG style, vibrant colors','现代':'modern pixel art, neon glow, high detail isometric, cyberpunk aesthetic, crisp pixels'};
const moodTag={温暖:'warm cozy atmosphere, golden hour lighting, soft pastel tones',梦幻:'dreamy fantasy mood, magical sparkles, ethereal glow',酷炫:'cyberpunk neon lights, dramatic contrast, electric colors',清新:'clean minimalist design, fresh light colors, simple background'};
const viewTag={平视:'front view, centered composition',俯视:'top-down view, isometric angle',特写:'close-up shot, detailed subject, blurred pixel background',场景:'wide establishing shot, detailed environment'};
const themeKeywords={温暖:'sunny vibe',梦幻:'magical aura',酷炫:'futuristic glow',清新:'calm atmosphere'};
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI像素画提示词生成 | AgentGongju.com'))return;
const topic=document.getElementById('topic').value.trim();
const era=document.getElementById('era').value;
const mood=document.getElementById('mood').value;
const view=document.getElementById('view').value;
const lang=document.getElementById('lang').value;
if(!topic){alert('请先输入主题');return;}
const cnText='一幅'+era+'风格的像素画，内容是：'+topic+'。氛围'+mood+'，采用'+view+'的视角，像素颗粒感清晰，色彩丰富有层次，游戏截图质感。';
const enPrompt=eraTag[era]+', '+moodTag[mood]+', '+viewTag[view]+', '+themeKeywords[mood]+', '+(topic.length>30?topic.slice(0,30):topic)+' pixel art, high quality, game sprite, detailed, best quality';
let out='【像素画提示词 · '+era+' · '+mood+'氛围】\n\n';
out+='主题：'+topic+'\n\n';
if(lang==='中文'){out+='━━ 中文提示词 ━━\n'+cnText+'\n\n';}
out+='━━ English Prompt ━━\n'+enPrompt+'\n';
out+='\n━━ 进阶参数（可选附加）━━\n';
out+='· Midjourney：--ar 1:1 --q 2  （正方形、高质量）\n';
out+='· SD 负向提示词：blurry, low quality, photorealistic, 3d render\n';
out+='· 常用分辨率：512×512（像素画建议方形尺寸）\n';
out+='\n【💡 使用技巧】\n· 在主题里加入具体颜色（如"红色小店"）效果更可控；\n· 觉得太简单可自行追加 "with detailed shadows and highlights"。';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 提示词已复制！'))}
</script>
</body>
</html>
