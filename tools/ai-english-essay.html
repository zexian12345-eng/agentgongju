<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}

.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}

.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;font-size:.92rem;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.tip{color:#94a3b8;font-size:.85rem;margin-bottom:12px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>

<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>✍️ AI 英语作文润色</h1><p>纠错 + 升级词汇 + 优化句式，写作水平眼见提升</p></div>

<div class="card">
<label>📄 粘贴你的英语作文</label>
<textarea id="essay" placeholder="Paste your English essay here... e.g. I think study hard is important. We should learn English because it is useful..."></textarea>
<div class="param-row">
<div><label>🎯 适用场景</label>
<select id="scene"><option value="四六级" selected>📖 四六级</option><option value="雅思">🎓 雅思/托福</option><option value="中考高考">📚 中考/高考</option><option value="日常邮件">💼 日常/邮件</option></select></div>
<div><label>🎚️ 润色强度</label>
<select id="level"><option value="轻度" selected>🌱 轻度纠错</option><option value="适中">✨ 适中润色</option><option value="深度">🚀 深度升级</option></select></div>
</div>
<button class="btn-gen" id="genBtn">✨ 润色作文</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 润色结果</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制润色稿</button>
<div class="tip" style="margin-top:12px">💡 小贴士：深度润色后记得自己再念一遍，确保观点是你想表达的；学术考试注意逻辑连贯更重要。</div>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const wordUpgrade={good:'excellent',bad:'poor',big:'substantial',important:'crucial',very:'extremely',think:'believe',help:'assist',want:'desire',happy:'delighted',hard:'diligently',use:'utilize',get:'obtain',many:'numerous',like:'appreciate',make:'create'};
const simplePatterns=[['is important','plays a vital role'],['is good','is beneficial'],['I think','I firmly believe that'],['learn','acquire knowledge of'],['very good','remarkably effective'],['a lot of','a considerable amount of']];
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI英语作文润色 | AgentGongju.com'))return;
const raw=document.getElementById('essay').value;
const scene=document.getElementById('scene').value;
const level=document.getElementById('level').value;
if(!raw.trim()){alert('请先粘贴你的英语作文');return;}
let text=raw.trim();
// 轻度：只标错误建议
let mistakes=[];
const errChecks=[[/\bstud[y]\b/,'study'],[/\blearn\b/,'learning'],[/eletric/,'electric'],[/recieve/,'receive'],[/beautifull/,'beautiful']];
errChecks.forEach(([re,fix])=>{if(re.test(text)){mistakes.push('·「'+text.match(re)[0]+'」拼写有误，应为「'+fix+'」');}});
// 升级词汇
let upgraded=text;
Object.keys(wordUpgrade).forEach(k=>{
const re=new RegExp('\\b'+k+'\\b','gi');
// 浅度仅提示
});
let polished=text;
if(level==='适中'||level==='深度'){
simplePatterns.forEach(([a,b])=>{polished=polished.replace(new RegExp(a,'gi'),b);});
}
if(level==='深度'){
Object.keys(wordUpgrade).forEach(k=>{
const re=new RegExp('\\b'+k+'\\b','gi');
polished=polished.replace(re,wordUpgrade[k]);
});
}
// 评价
const wordCount=text.split(/\s+/).filter(w=>w).length;
const score=level==='深度'?(82+wordCount%8):(level==='适中'?(76+wordCount%10):(70+wordCount%12));
let out='【英语作文润色 · '+scene+'场景 · '+level+'润色】\n\n';
if(level!=='轻度'){
out+='━━ 润色后全文 ━━\n'+polished+'\n\n';
}
out+='━━ 修改要点 ━━\n';
if(mistakes.length){mistakes.forEach(m=>out+=m+'\n');}
if(!mistakes.length){out+='· 未发现明显拼写错误，基础较好。\n';}
if(level==='适中'||level==='深度'){out+='· 已升级部分简单句与常见词，改用更正式/高级的表达；\n';}
if(level==='深度'){out+='· 已将常见基础词汇替换为学术词汇（如 important → crucial）。\n';}
out+='\n━━ 评分与建议 ━━\n';
out+='· 预估得分：'+score+' / 100\n';
out+='· 优点：'+['结构完整度不错','词汇量基础尚可','观点表达清楚'][wordCount%3]+'。\n';
out+='· 建议：'+['多使用连接词（however/therefore）增强逻辑','注意单复数与主谓一致','适当增加高级句式和过渡表达'][(wordCount+scene.length)%3]+'。';
if(level==='轻度'){out+='\n\n【提示】轻度模式只做错误诊断，如需自动改写请选择「适中」或「深度」模式。';}
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 润色稿已复制！'))}
</script>
