<select id="art"><option selected>国风水墨</option><option>工笔重彩</option><option>写意山水</option><option>赛博国风</option><option>厚涂插画</option><option>浮世绘</option></select></div>
<div><label>🌗 画面情绪</label>
<select id="mood"><option selected>苍凉辽阔</option><option>清幽静谧</option><option>热闹繁华</option><option>怅惘思念</option><option>淡雅温润</option><option>禅意空灵</option></select></div>

<script>
const MOOD_C={
'苍凉辽阔':['低饱和大地色与青灰','大留白、远山淡影','寒色调，一线孤帆或飞鸟点破空旷','天空占2/3呼应苍茫'],
'清幽静谧':['月白、黛青、竹绿','月下、池边、山间小景','弱对比柔光，透气安静','点缀一盏孤灯或淡淡雾气'],
'热闹繁华':['朱红、鎏金、湖蓝撞色','市井街市、华灯初上','密集但有序的细节','暖调光源，人影憧憧具生活气'],
'怅惘思念':['灰蓝、藕荷、冷月色','凭栏、远望、雨窗','留白制造孤寂','人物背影或空楼传递情绪'],
'淡雅温润':['米白、浅杏、柔青绿','书斋、花影、窗前','柔和漫射光','纸墨般的颗粒与晕染感'],
'禅意空灵':['大量留白的单色素墨','孤山、孤舟、独坐、层云','一墨到底少用彩色','构图极简像一首话少却深的禅偈']
};
const ART_STYLE={
'国风水墨':['wet ink wash, sumi-e, ink on rice paper, flowing negative space','宣纸肌理、浓淡干湿的墨色层次'],
'工笔重彩':['gongbi fine-brush painting, mineral pigments, meticulous detailed','细腻勾勒、矿物色的厚重与精致的细节'],
'写意山水':['xieyi freehand landscape, brush energy, ink splashes','大写意笔触、豪放的皴法与晕染'],
'赛博国风':['cyberpunk chinoiserie, neon + ink fusion, high contrast','山水与霓虹叠加、荧光点缀的黑金红'],
'厚涂插画':['digital painting, heavy impasto, rich volumetric','体积感强的厚涂、冷暖光的高级塑造'],
'浮世绘':['ukiyo-e woodblock print, flat bold color blocks','木版画感、平涂图案与浪花纹样']
};
function pick(a){return a[Math.floor(Math.random()*a.length)];}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI古诗词插画提示词生成器 | AgentGongju.com'))return;
const shi=document.getElementById('shi').value.trim();
if(!shi){alert('请先粘贴一句诗词');return;}
const art=document.getElementById('art').value;
const mood=document.getElementById('mood').value;
const pal=MOOD_C[mood];
const ast=ART_STYLE[art];
let r='【诗意还原 · “'+shi+'”】\n\n';
r+='—— ① 意象拆解（给AI的构图语言） ——\n';
r+=imgTree(shi)+'\n\n';
// 意象词提取做画面
const ikeys=shi.replace(/[\s，。！？、]/g,'');
const scene=['将「'+ikeys+'」转化为一个具象可懂的中景场景，主体明确、可读'];
r+='—— ② 配色与情绪设定 ——\n';
pal.forEach(p=>{r+='· '+p+'\n';});
r+='\n—— ③ 画风 ——\n使用「'+art+'」：'+ast[1]+'。\n\n';
r+='—— ④ 可直接用的English提示词 ——\n';
r+=englishPrompt(shi,art,ast[0],mood);
document.getElementById('outputBox').innerText=r;
document.getElementById('resultArea').classList.add('active');
});
function imgTree(s){
  // 粗暴但有用的分镜化
  const parts=s.split(/[，。！？]/).filter(Boolean);
  if(parts.length>1){return '上句(远景气氛)：'+parts[0]+'；下句(主体细节)：'+parts[1]+' —— 按“大环境在前、主体在后”排出景深，前景放点睛小物增加故事感。';}
  return '整句做“远景气氛+近景主体”双层次：前半渲染环境，后半突出细节，前景安排一个可识别的点睛物。';
}
function englishPrompt(s,a,astStyle,mood){
  const base='Classical Chinese poetry scene of "'+s+'", '+a+', mood: '+mood+', '+astStyle+', misty atmosphere, artistic composition, high detail, masterpiece --ar 16:9 --v 6';
  return base;
}
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 提示词已复制！'))}
</script>
