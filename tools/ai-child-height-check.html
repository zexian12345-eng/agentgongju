function pctLevel(v,row){
 var names=['P3','P10','P25','P50','P75','P90','P97'];
 var vals=row.slice(1);
 if(v<vals[0])return{txt:'低于 P3',idx:-1};
 if(v>vals[6])return{txt:'高于 P97',idx:7};
 for(var i=0;i<6;i++){if(v>=vals[i]&&v<=vals[i+1])return{txt:'约 '+names[i]+'~'+names[i+1]+' 之间',idx:i+1};}
 return{txt:'约 P50 附近',idx:3};
}
function gen(){
 var sex=document.getElementById('sex').value;
 var age=parseFloat(document.getElementById('age').value)||0;
 var h=parseFloat(document.getElementById('h').value)||0;
 var w=parseFloat(document.getElementById('w').value)||0;
 var fh=parseFloat(document.getElementById('fh').value)||0;
 var mh=parseFloat(document.getElementById('mh').value)||0;
 var sleep=document.getElementById('sleep').value;
 var sport=document.getElementById('sport').value;
 var diet=document.getElementById('diet').value;
 var table=(sex==='m'?HB:HG);
 var ai=Math.round(Math.max(2,Math.min(18,age)))-2;
 if(ai<0)ai=0; if(ai>table.length-1)ai=table.length-1;
 var row=table[ai];
 var out='════ 生长发育参考评估 ════\n\n';
 out+='性别：'+(sex==='m'?'男孩':'女孩')+' ｜ 年龄：'+age+' 周岁\n';
 out+='身高：'+h+' cm ｜ 体重：'+w+' kg\n\n';
 var lv=pctLevel(h,row);
 var p50=row[4];
 out+='──── 📐 身高评估 ────\n';
 out+='该年龄段身高参考中位数（P50）：'+p50+' cm\n';
 out+='你家孩子身高所处水平：'+lv.txt+'\n';
 var diff=(h-p50).toFixed(1);
 out+='与中位数相差：'+(diff>=0?'+':'')+diff+' cm\n\n';
 var flag='';
 if(lv.idx===-1){flag='low';out+='⚠️ 低于 P3：属于同龄中偏矮，建议尽早在儿童保健科/内分泌科做一次专业评估（含生长曲线追踪、必要时骨龄检测）。\n';}
 else if(lv.idx<=1){flag='lowmid';out+='🟡 处于 P3-P25：偏矮区间。不一定是问题，但值得重点关注和干预，先看增长速度。\n';}
 else if(lv.idx>=7){out+='✅ 高于 P97：明显高个。多数是好事，但如果年增长突然异常加速，也建议查一下。\n';}
 else{out+='✅ 处于正常范围（P25-P97）：不用焦虑，保持现有节奏即可。\n';}
 out+='\n──── 📈 比"排位"更重要的是"增长速度" ────\n';
 out+='· 3 岁到青春期前：每年应长 5-7 cm；\n';
 out+='· 青春期猛长期：每年 7-10 cm；\n';
 out+='· 如果连续 1 年增长不足 5 cm，即使身高还在正常范围，也应就医排查。\n';
 out+='💡 建议每 3 个月固定时间（早晨）量一次并记录，画出自己的生长曲线，比单位百分位更有意义。\n\n';
 if(fh>0&&mh>0){
   var th=(fh+mh+(sex==='m'?13:-13))/2;
   out+='──── 🧬 遗传身高参考 ────\n';
   out+='按父母身高估算的遗传靶身高：约 '+th.toFixed(1)+' cm（±5 cm 属正常波动）\n';
   out+='这只是"潜力区间"的中位估计，后天环境决定能兑现多少。\n';
   if(h<p50-6&&th>p50+3)out+='👀 注意：遗传潜力不低，但当前身高明显落后，说明后天因素（睡眠/营养/疾病）可能在拖后腿，值得重视。\n';
   else if(h>=th-2)out+='👏 当前身高已接近或达到遗传潜力水平，说明养育得当。\n';
   out+='\n';
 }
 out+='──── 🎯 针对性建议 ────\n';
 if(sleep==='lt8'){out+='😴 睡眠：这是最关键的短板！生长激素分泌高峰在夜间 22:00-2:00 的深睡期。学龄儿童应保证 9-11 小时睡眠，尽量 21:30 前上床入睡。\n';}
 else if(sleep==='8_9'){out+='😴 睡眠：基本达标但可以再早一点。学龄期理想是 9-10 小时，试着把入睡时间提前 30 分钟，效果可能比补营养更明显。\n';}
 else{out+='😴 睡眠：达标，继续保持。作息规律（固定时间睡起）比单纯睡够更重要。\n';}
 if(sport==='rare'){out+='🏃 运动：太少了。跳跃类纵向运动对身高促进最直接——跳绳（每天 1000-1500 个）、摸高、打篮球、羽毛球。每天至少 1 小时中等强度活动。\n';}
 else if(sport==='some'){out+='🏃 运动：建议增加到每周 3-5 次，重点是跳绳/摸高一类的纵向弹跳运动，而不是只做跑步。\n';}
 else{out+='🏃 运动：很棒。跳绳 + 摸高 + 篮球的组合，是性价比最高的"助长运动"，注意别过量（每天 60-90 分钟足够）。\n';}
 if(diet==='picky'){out+='🍚 饮食：挑食要重点解决。保证每天 300-500ml 奶制品、1 个鸡蛋、手掌大小的肉，蛋白质和钙是长高的原料。缺锌会明显影响食欲，长期挑食可查一下微量元素。\n';}
 else if(diet==='much'){out+='🍚 饮食：注意别让孩子"横向发展"。要警惕含糖饮料、油炸和过量主食——肥胖会让骨龄提前，反而压缩长高时间（性早熟风险）。\n';}
 else{out+='🍚 饮食：正常即可。记住"奶、蛋、肉、豆、深色蔬菜"每天都要有，不必迷信增高药、增高贴、保健品，没有科学依据。\n';}
 out+='\n──── ⚠️ 什么情况必须去医院 ────\n';
 out+='· 身高长期低于 P3 或明显落后同龄；\n';
 out+='· 连续一年增长不足 5 cm；\n';
 out+='· 明显比同龄人早发育（女孩 8 岁前乳房发育、男孩 9 岁前睾丸增大）；\n';
 out+='· 身高远超同龄且增长突然加速（排查性早熟/内分泌问题）。\n';
 out+='检查科室：儿童保健科或儿科内分泌科，通常查生长曲线、骨龄片、生长激素激发试验等。\n\n';
 out+='💡 骨龄是判断"还能长多久"的金标准。青春期前干预空间大，别等到闭合才着急。\n\n';
 out+='──── 📌 免责声明 ────\n';
 out+='本工具基于公开的儿童生长发育参考值做估算，仅供参考，不能代替医生面诊和临床检查。如有疑虑请及时就医。';
 return out;
}
