var KW_LINES=['家','和','春','福','财','兴','安','乐','顺','吉'];
function gen(){
var scene=document.getElementById('scene').value;
var len=+document.getElementById('len').value;
var style=document.getElementById('style').value;
var num=+document.getElementById('num').value;
var kw=document.getElementById('kw').value.trim();
var base=POOL[scene];
var list=[];
var shuffled=base.slice().sort(function(){return Math.random()-0.5;});
for(var i=0;i<num;i++)list.push(shuffled[i%shuffled.length]);
var sceneName={spring:'春节春联',open:'开业庆典',wedding:'婚庆喜联',move:'乔迁新居',birthday:'祝寿贺岁',study:'书房励志'}[scene];
var styleName={classic:'典雅庄重',simple:'通俗喜庆',literary:'文人雅致'}[style];
var out='═══ '+sceneName+' · '+styleName+' · '+({5:'五',7:'七',8:'八',9:'九'}[len])+'言 ═══\n\n';
list.forEach(function(p,i){
var up=p[0],dn=p[1],hp=p[2];
if(kw){
var k=kw;
if(up.indexOf(k)===-1)up=up.slice(0,len-k.length>0?len-k.length:len-1)+k;
if(dn.indexOf(k)===-1)dn=dn.slice(0,len-k.length>0?len-k.length:len-1)+k;
}
out+='【第 '+(i+1)+' 副】\n';
out+='　　　　'+up+'　　\n';
out+='　　　　'+dn+'　　\n';
out+='　　横批：'+hp+'\n\n';
if(i<list.length-1)out+='─ ─ ─ ─ ─ ─ ─ ─\n\n';
});
out+='═══ 使用贴士 ═══\n';
out+='1. 传统贴法：面向大门，上联在右、下联在左（横批从左往右读的现代写法则相反）；\n';
out+='2. 上下联区分：看末字声调，上联多为仄声（三、四声），下联多为平声（一、二声）；\n';
out+='3. 字数为奇数的联句更显活泼，偶数庄重，正式场合可选七言或九言；\n';
