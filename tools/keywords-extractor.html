<script>
// 通用中文停用词
const stop=new Set(['的','了','和','在','是','我','你','他','与','及','或','而','把','被','会','能','要','到','对','但','这','那','也','都','还','就','并','及','从','向','以','为','等','让','给','有','个','等','上','中','下','它','们','其','之','所','于','一','二','三','不','没','很','更','最','只','被','应','该','过','着','呢','吗','啊','吧','哦','哦','时候','因为','所以','而且','但是','如果','虽然','这些','那些','一些','各种','进行','通过','对于']);
function analyze(text,qty){
// 按标点切词，统计两字以上词频
const cleaned=text.replace(/[0-9A-Za-z]/g,'').replace(/[^\u4e00-\u9fa5]/g,' ');
const stripped=text;
// 用简单的窗口统计：取高频2-4字片段
const freq={};
const n=stripped.length;
for(let i=0;i<n-1;i++){
for(let len=2;len<=4 && i+len<=n;len++){
const w=stripped.substr(i,len);
if(stop.has(w))continue;
if(/[^\u4e00-\u9fa5]/.test(w))continue;
freq[w]=(freq[w]||0)+1;
}
}
let arr=Object.entries(freq).filter(([w,c])=>c>=2).sort((a,b)=>b[1]-a[1]);
// 去重：若长词被短词包含且频率接近，保留更有意义的
const picked=[];
for(const [w,c] of arr){
if(picked.some(p=>w.includes(p)||p.includes(w)))continue;
picked.push(w);
if(picked.length>=Number(qty))break;
}
// 如果不够，补低频词
if(picked.length<Number(qty)){
arr.forEach(([w,c])=>{
if(!picked.includes(w)&&picked.length<Number(qty))picked.push(w);
});
}
return picked;
}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI文章关键词提取器 | AgentGongju.com'))return;
const text=document.getElementById('text').value.trim();
if(!text){alert('请先粘贴文章内容');return;}
const qty=document.getElementById('qty').value.replace('个','');
const field=document.getElementById('field').value;
const words=analyze(text,qty);
const tags=words.map(w=>w).join(' ');
let fieldMsg={};
fieldMsg={
'健康养生':'「养生/健康/疫苗/防护/饮食」等高话题度字眼','科技数码':'「数码/手机/智能/AI/测评」','财经职场':'「职场/理财/效率/成长」','美食生活':'「美食/家常/好物/生活」','教育学习':'「学习/考试/方法/成长」','通用':'相关主题词'
}[field];
const out='【核心关键词】\n'+words.join('、')+'\n\n【话题标签】\n'+tags+'\n\n【SEO建议】\n· 标题首段植入前3个关键词，提升搜索命中。\n· 该领域可拓展'+fieldMsg+'相关内容，形成话题矩阵。\n【摘要建议】\n'+text.slice(0,60)+'…';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 结果已复制！'))}
</script>
