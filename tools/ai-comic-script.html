<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 漫画分镜脚本生成器 | AgentGongju.com</title>
<meta name="description" content="AI漫画分镜脚本生成器，输入剧情一句话，自动生成分镜脚本、对白与分镜提示词，适合漫画创作者使用">
<meta name="keywords" content="AI漫画,分镜脚本,漫画对白,漫画编剧,分镜提示词">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.shot{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.25);border-radius:12px;padding:16px;margin-bottom:14px}
.shot .shot-head{color:#a855f7;font-weight:700;margin-bottom:8px;font-size:.9rem}
.shot .shot-line{color:#e2e8f0;line-height:1.9;font-size:.88rem;white-space:pre-wrap}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>💥 AI 漫画分镜脚本生成器</h1><p>一句话剧情，焕活整页分镜与人气对白</p></div>

<div class="card">
<label>🎬 一句话故事梗概</label>
<textarea id="story" placeholder="例如：一个怕打雷的实习程序员，在台风夜发现公司服务器竟连接着另一个世界的网络"></textarea>
<div class="param-row">
<div><label>🎭 漫画风格</label>
<select id="style">
<option value="热血少年">🔥 热血少年</option>
<option value="治愈日常">🍵 治愈日常</option>
<option value="校园恋爱">💘 校园恋爱</option>
<option value="悬疑惊悚">🔪 悬疑惊悚</option>
<option value="搞笑无厘头">😂 搞笑无厘头</option>
<option value="科幻冒险">🚀 科幻冒险</option>
</select></div>
<div><label>📄 分镜数量</label>
<select id="num">
<option value="4">4 格</option>
<option value="6" selected>6 格</option>
<option value="8">8 格</option>
</select></div>
</div>
<div class="param-row">
<div><label>👤 主要角色名</label>
<input type="text" id="char" placeholder="例如：小北"></div>
<div><label>🎯 剧情基调</label>
<select id="tone">
<option value="轻松">😊 轻松</option>
<option value="燃">🔥 燃</option>
<option value="催泪">😭 催泪</option>
<option value="反转">🌀 反转</option>
</select></div>
</div>
<button class="btn-gen" id="genBtn">📝 生成分镜脚本</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:16px">📖 《{title}》—— 分镜脚本</div>
<div id="shotsBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制全部脚本</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function rand(a){return a[Math.floor(Math.random()*a.length)]}
const openings=['在一个平凡的午后，','大雨倾盆的深夜，','阳光正好的周末，','人潮汹涌的街角，','风雨欲来的黄昏，'];
const actions=['推开门的一瞬间，','手机突然震动，','远处传来一声异响，','主角缓缓抬起头，','一阵风卷起落叶，','灯光忽明忽暗，'];
const twists=['原来这一切的背后，','而真相，却出乎所有人意料——','就在这时，画风骤变，','可接下来发生的事，','没有人预料到的是，','而命运，才刚刚开始——'];
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 漫画分镜脚本生成器 | AgentGongju.com'))return;
const story=document.getElementById('story').value.trim();
if(!story){alert('请先输入故事梗概');return;}
const style=document.getElementById('style').value;
const num=parseInt(document.getElementById('num').value);
const ch=document.getElementById('char').value.trim()||'主角';
const tone=document.getElementById('tone').value;
const box=document.getElementById('shotsBox');box.innerHTML='';
const title=ch+'的冒险日记';
const shotDesc=[
['开篇定场',openings[0]+story+'。镜头拉开，交代环境与人物。'],
['人物特写',ch+'初登场，表情带着[情绪]，「'+ch+'」心里默念：这一天，注定不寻常。'],
['事件起势',twists[0]+'一幕令人屏息的画面出现，气氛骤然紧张。'],
['冲突爆发','矛盾被点燃，'+ch+'必须做出抉择——是逃避，还是迎难而上？'],
['动作高潮',actions[0]+ch+'咬紧牙关，拼尽全力冲向目标，动作干净利落。'],
['情绪低谷','一切看似要失败，'+ch+'眼角泛光，声音哽咽：「难道就这样了吗…」'],
['峰回路转',twists[1]+'一条线索浮出水面，局势瞬间逆转。'],
['收尾定格',ch+'站在[地点]，回望来路，嘴角扬起。旁白：真正的冒险，才刚开始。']];
const styleFlavor={
'热血少年':'喊出这句台词时，画面加入冲击波与速度线。',
'治愈日常':'用柔和光线温暖收束，空气中弥漫着暖意。',
'校园恋爱':'微风拂过发梢，只留下心跳的声音。',
'悬疑惊悚':'留白处阴影渐浓，最后一格落到一只睁大的眼睛。',
'搞笑无厘头':'角色表情夸张变形，配吐槽字幕引爆笑点。',
'科幻冒险':'背景切换至辽阔星海，飞船引擎微微轰鸣。'};
const toneFlavor={'轻松':'整体节奏明快，对白逗趣。','燃':'情绪层层推高，压迫感十足。','催泪':'配乐舒缓，泪点藏在细节里。','反转':'埋下两处伏笔，结尾炸裂。'};
let full='【'+style+' · '+tone+'】'+story+'\n';
for(let i=0;i<num;i++){
const s=shotDesc[i];
const div=document.createElement('div');div.className='shot';
div.innerHTML=`<div class="shot-head">第 ${i+1} 格 · ${s[0]}</div><div class="shot-line">${s[1]}</div>`;
box.appendChild(div);
full+=(i+1)+'. '+s[0]+'：'+s[1]+'\n';
}
// 补充分镜AI绘画提示词
const aiHint=styleFlavor[style]+toneFlavor[tone];
const extra=document.createElement('div');extra.className='shot';
extra.innerHTML=`<div class="shot-head">🎨 分镜绘画提示词参考</div><div class="shot-line">${aiHint}\n推荐引擎：将每格文字翻译为英文后，配合角色形象描述输入 Midjourney / NovelAI 即可出图。</div>`;
box.appendChild(extra);
full+='\n🎨 绘画提示：'+aiHint;
window._fullScript='【AI 漫画分镜脚本】\n'+full;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(window._fullScript||document.body.innerText).then(()=>alert('✅ 已复制！'))}
</script>
</body>
</html>
