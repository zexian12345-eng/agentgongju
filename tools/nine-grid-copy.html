<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>📸 AI 朋友圈九宫格文案</h1><p>拍好照片不知配什么字？AI 帮你一句话出圈</p></div>

<div class="card">
<label>🖼️ 照片主题</label>
<input type="text" id="theme" placeholder="例如：海边日落、娃的第一口辅食、加班到深夜…">
<div class="param-row">
<div><label>🎨 文案风格</label>
<select id="style"><option value="俏皮">😜 俏皮可爱</option><option value="治愈" selected>🌿 治愈温暖</option><option value="酷飒">😎 酷飒高级</option><option value="低调">🙈 低调凡尔赛</option></select></div>
<div><label>😊 此刻心情</label>
<select id="mood"><option value="开心">🥳 超开心</option><option value="小确幸" selected>✨ 小确幸</option><option value="疲惫">😮‍💨 有点累</option><option value="分享">🙌 单纯想分享</option></select></div>
</div>
<label>📝 想补充的话（选填）</label>
<textarea id="extra" placeholder="例如：第一次来这个城市，坐标厦门"></textarea>
<button class="btn-gen" id="genBtn">💬 生成朋友圈文案</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">✍️ 为你写的朋友圈文案</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制文案</button>
<div class="tip" style="margin-top:12px">💡 小贴士：文案配图用九宫格，中间那张放最满意的，或留空给评论区互动更自然。</div>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const draft={
俏皮:{开心:['今天的快乐超标啦','朋友圈先吃，你们看','开心到模糊也要拍','这世界很大，但我很快乐'],'小确幸':['小日子有小日子的甜','细节里的浪漫最动人','今天也有被温柔以待','简单的快乐最上头'],疲惫:['别问，问就是累并快乐着','加班人的倔强','坚持一下，快乐在前面','努力搬砖的人最可爱'],分享:['好东西当然要分享啦','第一次尝试，求夸','主打一个真实记录','日常碎片收好咯']},
治愈:{开心:['阳光正好，心情正好','把日子过成诗','温柔的时光都值得收藏','愿每一天都闪闪发光'],'小确幸':['生活中的小确幸','被温柔照顾的日常','万物可爱，人间值得','攒下的小幸福'],疲惫:['累了就停下来看看','慢慢来，比较快','给自己一场深呼吸','生活有苦也有糖'],分享:['想把这一刻的美好寄给你','山河远阔，人间烟火','值得记录的好时光','和光同尘，与时舒卷']},
酷飒:{开心:['快乐是我的主场','气场全开的今天','做自己的光','人间清醒，快乐至上'],'小确幸':['质感生活进行时','从容且有态度','懂生活的人才配谈快乐','从容不迫的高级感'],疲惫:['熬出头就是星辰大海','不声张的坚持最酷','扛过去就赢了','独处的力量']},
低调:{开心:['平平无奇的快乐','也就亿点点开心','还行还行，不值得夸','普通人普通的一天'],'小确幸':['就……还行吧','低调的幸福，懂得都懂','一般般啦，也就这样','你们别太羡慕'],疲惫:['工作而已，不必矫情','假装不在意的累','朴实无华的每一天','习惯了就好']}
};
const tags=['#今日份快乐','#记录生活','#朋友圈先吃','#日常生活','#小确幸','#今日份温柔','#开心的每一天'];
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 朋友圈九宫格文案 | AgentGongju.com'))return;
const theme=document.getElementById('theme').value.trim();
const style=document.getElementById('style').value;
const mood=document.getElementById('mood').value;
const extra=document.getElementById('extra').value.trim();
if(!theme){alert('请先输入照片主题');return;}
const opts=draft[style][mood];
let out='📷 '+theme+'\n\n';
out+=opts[Math.floor(Math.random()*opts.length)]+'\n\n';
if(extra){out+=extra+'\n\n';}
out+=tags.slice(0,3).join(' ');
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 朋友圈文案已复制！'))}
</script>
