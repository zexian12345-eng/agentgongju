suspect:'若怀疑被盗：保留「查找设备」定位截图，直接报警，警方可凭定位协助查找。',
done:['补办 SIM 卡（运营商营业厅，本人持身份证，可原号补办）','恢复通讯录与照片（iCloud / 华为云 / 小米云备份）','解绑/重新登录常用 App']},

suspect:'身份证被冒用注册公司/网贷风险较高，建议到派出所备案留记录。',

key:{name:'钥匙/门禁卡',urgent:['联系物业或房东，确认是否需要立即换锁','若为车钥匙，联系 4S 店或汽修厂做钥匙注销'],
suspect:'若怀疑被偷：钥匙与住址一起丢失，务必当天换锁芯。',
done:['配新钥匙 / 补办门禁卡','换锁芯（成本几十到几百元不等）','登记备用钥匙交给可信赖的人']},

suspect:'若被盗：立即报警，提供序列号（SN）与购买发票，二手市场可查。',

suspect:'若被盗：报警立案，提供车辆照片、车架号、购车发票。',

suspect:'若怀疑被抱走：调监控、报警，并在宠物平台（如"找宠网"）登记。',

transit:'地铁：找车站客服中心或拨打地铁失物招领电话；公交：拨 12345 或公交集团客服；出租车：凭发票上的车牌号联系；网约车：App 内「行程」→ 联系客服→报失',

var st=document.getElementById('stolen').value;
var out='════ 找回行动表：'+i.name+' ════\n\n';
out+='⏰ 黄金时间提醒：'+(when==='1'?'刚丢不久，找回概率最高，立刻行动！':when==='6'?'几小时内，仍在黄金窗口，抓紧联系相关方。':when==='24'?'已过 1 天，重点是挂失止损＋持续追踪。':'时间较久，主要靠挂失补办与监控追查，别放弃登记。')+'\n\n';
out+='──── 第一步：立即要做（0-30 分钟）────\n';
i.urgent.forEach(function(x,n){out+=(n+1)+'. '+x+'\n';});
out+='\n──── 第二步：现场找回线索 ────\n';
out+=place+'\n';
out+='\n──── 第三步：报警与责任 ────\n';
out+=st==='yes'?('【怀疑被盗】'+i.suspect+'\n报案材料：本人身份证、物品购买凭证/发票、物品照片、监控线索。\n'):('目前看是遗失，暂无需报警；但若涉及身份证被冒用或金额较大，仍建议到派出所备案。\n'+i.suspect+'\n');
out+='\n──── 第四步：补办与善后 ────\n';
i.done.forEach(function(x,n){out+=(n+1)+'. '+x+'\n';});
out+='\n──── 防丢小贴士 ────\n';
out+='· 手机开启「查找设备」并记住账号密码，是最有效的找回手段；\n';
out+='· 证件与银行卡分开放，不要全塞一个钱包；\n';
out+='· 出门给随身包拍照，丢了能快速描述；\n';
out+='· 重要证件留电子扫描件存云盘，补办时省事；\n';
out+='· 电动车、宠物加装定位设备，找回率大幅提高。\n';
return out;
}
