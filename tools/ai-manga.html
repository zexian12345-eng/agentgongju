<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 漫画生成 | AgentGongju.com</title>
<meta name="description" content="AI漫画分镜生成，输入剧情一键生成漫画脚本与画面提示词">
<meta name="keywords" content="AI漫画,漫画生成,分镜脚本,漫画提示词">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:100px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.btn-gen:disabled{opacity:.5;cursor:not-allowed}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.8;white-space:pre-wrap;min-height:60px;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
.panel-item{margin-bottom:18px;padding:16px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:10px}
.panel-item h4{color:#a5b4fc;margin-bottom:8px}
.panel-item p{color:#94a3b8;font-size:.88rem;margin-bottom:6px}
.panel-item .prompt{color:#e2e8f0;font-size:.85rem}
</style>
<script>
var _hmt = _hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";
  var s = document.getElementsByTagName("script")[0];
  s.parentNode.insertBefore(hm, s);

<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🎨 AI 漫画生成</h1><p>输入剧情，一键生成漫画分镜脚本与画面提示词</p></div>

<div class="card"><label>📖 漫画剧情</label>
<textarea id="story" placeholder="输入故事剧情，例如：一个少年在深夜的便利店捡到一只会说话的猫，从此开始了一段奇幻冒险..."></textarea></div>
<div class="card"><label>🎴 画面风格</label>
<select id="style"><option value="日式热血">日式热血漫</option><option value="治愈日常">治愈日常漫</option><option value="少女梦幻">少女梦幻漫</option><option value="暗黑悬疑">暗黑悬疑漫</option><option value="国风水墨">国风水墨漫</option></select>
<div class="param-row" style="margin-top:12px"><div><label>分镜数量</label><input type="number" id="panels" value="4" min="2" max="8"></div><div><label>画面风格细节</label><input type="text" id="det" placeholder="可补充细节，如：赛博朋克背景"></div></div>
<button class="btn-gen" id="genBtn">🎬 生成漫画分镜</button></div>
<div class="result-area" id="resultArea"><div class="card"><div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 分镜脚本已生成</div>
<div id="panelsOut"></div><button class="copy-btn" onclick="copyResult()">📋 复制全部</button></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyResult(){navigator.clipboard.writeText(document.getElementById('panelsOut').textContent).then(()=>alert('✅ 已复制！'))}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 漫画生成 | AgentGongju.com'))return;
const story=document.getElementById('story').value.trim();if(!story){alert('请输入剧情');return}
const style=document.getElementById('style').value;const det=document.getElementById('det').value.trim();
const n=Math.min(8,Math.max(2,parseInt(document.getElementById('panels').value)||4));
const shots=['开场远景','中景近写','特写镜头','转场空镜','对话分镜','动作高潮','情绪特写','结尾定格'];
const acts=['起因铺垫','冲突升级','关键转折','情绪爆发'];
let html='';
for(let i=1;i<=n;i++){
  const act=acts[Math.min(i-1,acts.length-1)];
  html+='<div class="panel-item"><h4>分镜 '+i+' · '+shots[(i-1)%shots.length]+' · ['+act+']</h4><p>镜头：「'+story.slice(0,12)+'...」第'+i+'幕 — '+det+'</p><div class="prompt">🎨 提示词：masterpiece, best quality, '+style+' style, '+shots[(i-1)%shots.length]+', '+ (det||'detailed scene') +', scene '+i+', dramatic lighting, high detail</div></div>';
}
document.getElementById('resultArea').classList.add('active');
document.getElementById('panelsOut').innerHTML=html;
});
</script>
</body>
</html>
