<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 护肤方案定制 | AgentGongju.com</title>
<meta name="description" content="根据肤质、年龄、环境等定制个性化护肤方案，明确早晚护肤流程与成分建议，科学护肤不走弯路">
<meta name="keywords" content="护肤品,护肤方案,肤质检测,成分护肤,早C晚A,补水保湿">
<link rel="stylesheet" href="../css/style.css">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.8;white-space:pre-wrap;margin-bottom:12px;font-size:.92rem}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.tip{color:#94a3b8;font-size:.8rem;line-height:1.8;margin-top:6px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🧴 AI 护肤方案定制</h1><p>读懂你的肤质，定制科学护肤流程</p></div>

<div class="card">
<div class="param-row">
<div><label>🧑 你的肤质</label>
<select id="skin">
<option value="干性">干性肌肤</option>
<option value="油性">油性肌肤</option>
<option value="混合性">混合性肌肤</option>
<option value="敏感肌">敏感肌</option>
<option value="中性">中性肌肤</option>
</select></div>
<div><label>🎂 年龄段</label>
<select id="age">
<option value="18-25">18-25 岁</option>
<option value="26-35">26-35 岁</option>
<option value="36-45">36-45 岁</option>
<option value="46+">46 岁以上</option>
</select></div>
</div>
<div class="param-row">
<div><label>🌏 所处环境</label>
<select id="env">
<option value="干燥">干燥多风</option>
<option value="潮湿">湿热潮湿</option>
<option value="空调房">长期空调房</option>
<option value="户外">常户外/日晒</option>
</select></div>
<div><label>🎯 主要诉求</label>
<select id="goal">
<option value="保湿">补水保湿</option>
<option value="美白">提亮美白</option>
<option value="抗老">抗老淡纹</option>
<option value="控油">控油祛痘</option>
<option value="修护">舒缓修护</option>
</select></div>
</div>
<label>💬 其他说明（可选）</label>
<input type="text" id="note" placeholder="例如：有轻微泛红、易长闭口、预算一般等">
<button class="btn-gen" id="genBtn">✨ 生成护肤方案</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">🧖 你的专属护肤方案</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制方案</button>
<div class="tip">⚠️ 提示：本方案仅供参考，不构成医疗建议。敏感肌或特殊皮肤问题请先咨询皮肤科医生。</div>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const GOAL={
'保湿':{core:'透明质酸、神经酰胺、泛醇B5',ing:'玻尿酸精华+保湿面霜',tip:'每天早晚坚持涂抹，秋冬可叠加护肤油'},
'美白':{core:'烟酰胺、维生素C、熊果苷',ing:'VC精华+含烟酰胺乳液',tip:'美白必先防晒，日间务必涂足防晒霜'},
'抗老':{core:'视黄醇、胜肽、玻色因',ing:'A醇晚霜+胜肽精华',tip:'视黄醇需建立耐受，从低浓度隔天用起'},
'控油':{core:'水杨酸、PCA锌、烟酰胺',ing:'水杨酸精华+控油乳',tip:'避免过度清洁，注重水油平衡'},
'修护':{core:'积雪草、角鲨烷、神经酰胺',ing:'修护霜+屏障乳',tip:'精简护肤，减少刺激成分叠加'}};
const AGE={
'18-25':'年轻肌，重点保湿与防晒，打好底色，无需过早抗老',
'26-35':'初老预警，加强抗氧化与基础抗老，眼周需重视',
'36-45':'进阶抗老，关注紧致淡纹，配合医美类产品更佳',
'46+':'深度抗老与屏障修护并重，注重滋润与弹性提升'};
const ENV={
'干燥':'重点加强补水和封闭保湿，室内可用加湿器',
'潮湿':'以清爽质地为主，减少厚重封闭性产品',
'空调房':'随身保湿喷雾+加强晚间补水面膜',
'户外':'硬核防晒是第一位，勤补涂并做好晒后修护'};
const SKINTEXT={
'干性':'干皮易缺水紧绷，需重补水+强封闭保湿，洁面选温和氨基酸',
'油性':'油皮易出油长痘，需清爽控油+疏通毛孔，避免厚重面霜',
'混合性':'T区油两颊干，分区护理为佳，爽肤控油+面颊保湿',
'敏感肌':'屏障较脆弱，优先修护维稳，避开酒精香精与强酸猛药',
'中性':'肤质均衡，做好基础保湿与防晒即可'};
document.getElementById('genBtn').addEventListener('click',()=>{
const skin=document.getElementById('skin').value;
const age=document.getElementById('age').value;
const env=document.getElementById('env').value;
const goal=document.getElementById('goal').value;
const note=document.getElementById('note').value.trim();
const g=GOAL[goal];
const out=`【肤质判定】${skin} — ${SKINTEXT[skin]}
【年龄阶段】${age} — ${AGE[age]}
【环境要点】${ENV[env]}

————— 早晚护肤流程 —————
🌅 早晨流程：
洁面（${skin==='干性'||skin==='敏感肌'?'温和的氨基酸洁面':'清爽控油洁面'}）→ 精华水 → ${g.ing} → 保湿乳/面霜 → 防晒霜（重中之重）

🌙 晚间流程：
卸妆/洁面 → 精华水 → ${g.core.split('、').slice(0,2).join('、')}精华 → ${g.ing} → 修护面霜

————— 核心推荐成分 —————
关键成分：${g.core}
功课要点：${g.tip}
${note?'\n💬 你的补充说明：「'+note+'」已纳入考量，建议结合预算与耐受适度取舍。':''}

坚持 4 周以上可见肤质改善，护肤贵在规律与耐心。${ENV[env].slice(0,12)}，防晒是性价比最高的抗老投资。`;
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 护肤方案已复制！'))}
</script>
</body>
</html>
