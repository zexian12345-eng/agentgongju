<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI高效会议议程＋纪要生成 | AgentGongju.com</title>
<meta name="description" content="开会前没头绪、开完会记不住重点？输入会议主题与参会背景，AI帮你排议事议程、设时间颗粒度，并生成可直接抄进文档的会议纪要结构与待办清单。">
<meta name="keywords" content="会议议程,会议纪要模板,高效开会,会议流程,待办清单,会前准备">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
input[type=text],textarea,select{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s;margin-top:6px}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.95;white-space:pre-wrap;font-size:0.95rem;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-grid{grid-template-columns:1fr}}
</style>
<script>
var _hmt = _hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";
  var s = document.getElementsByTagName("script")[0];
  s.parentNode.insertBefore(hm, s);

<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🗓 AI高效会议议程＋纪要生成</h1><p>会前有谱，会中有据，会后有果子</p></div>

<div class="card">
<div class="param-grid">
<div><label>🧩 会议类型</label>
<select id="type"><option selected>项目周会</option><option>需求评审会</option><option>复盘会</option><option>跨部门对齐会</option><option>方案决策会</option><option>全员/早会</option><option>对外拜访/合作会</option></select></div>
<div><label>⏱ 预计时长</label>
<select id="dur"><option>15分钟</option selected>30分钟</option><option>45分钟</option><option>1小时</option><option>90分钟</option></select></div>
</div>
<div><label>📌 会议主题 / 要解决的问题</label>
<textarea id="topic" placeholder="例如：新版本发布在即，如何收敛需求范围并排期风险 / 本月转化率下滑的原因分析与举措…"></textarea></div>
<button class="btn-gen" id="genBtn">🎯 生成议程＋纪要</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">🗓 会议包（议程＋纪要模板＋待办）</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制会议包</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const TYPE_AGENDA={
'项目周会':{goal:'对齐进度、暴露风险、明确本周分工',chain:['■ 10% 一言进度同步（每人30秒，只讲进展与阻塞）','■ 40% 主线：风险与依赖问题讨论','■ 30% 本周冲刺范围与分工确认','■ 20% 沉淀待办与下站检查点']},
'需求评审会':{goal:'就需求范围、可行性与优先级达成共识',chain:['■ 10% 会议目标与需求背景一句话','■ 40% 逐条过需求：价值/成本/边界','■ 30% 优先级与风险拍板','■ 20% 收录修订项与排期预案']},
'复盘会':{goal:'用事实复盘得失，沉淀成下次的行动',chain:['■ 15% 目标回看与数据晾晒','■ 40% 做得好的/不好的归因讨论','■ 25% 形成改进措施清单','■ 20% 明确责任人+时间，防复盘变诉苦']},
'跨部门对齐会':{goal:'消除信息差，明确责任边界',chain:['■ 10% 问题与各自诉求口头同步','■ 40% 共同盘点现状与依赖卡点','■ 30% 明确每一环的owner与接口人','■ 20% 输出跨部门行动条款与check时间']},
'方案决策会':{goal:'在选项上收敛结论，给出可执行决定',chain:['■ 10% 决策议题与老板期望结论','■ 40% 关键方案利弊逐项透传','■ 25% 讨论并暴露反对意见','■ 25% 举手表决+明确落地责任人和deadline']},
'全员/早会':{goal:'信息透明、士气同步、问题快速暴露',chain:['■ 顶层业务/重大事项通报','■ 各板块一句话同步','■ 开放提问与风险曝光','■ 今日重点/To-do收尾']},
'对外拜访/合作会':{goal:'摸清需求、建立信任、推动合作',chain:['■ 破冰+我方背景一条','■ 深入了解对方痛点与目标','■ 呈现方案与价值匹配','■ 明确下一步与对接人']}
};
const NOTE={
'项目周会':'【会议纪要框架】\n一、结论速览（<3行）\n二、每项议题->被处：已决策/需再议/搁置\n三、本周分工表：事项|Owner|deadline\n四、风险与升级路径',
'需求评审会':'【纪要框架】\n一、评审结论：通过/待补/驳回\n二、各需求卡评审意见与修订点\n三、优先级排序结果\n四、需补充的信息与责任人',
'复盘会':'【纪要框架】\n一、数据结论一句话\n二、做得好的经验（可复制项）\n三、问题归因（分内因/外因）\n四、Let\u2019s stop / start / continue 三栏措施',
'跨部门对齐会':'【纪要框架】\n一、各方已sync的信息\n二、card点与障碍清单\n三、责任矩阵：事项|owner部门|关联方|时间\n四、下次对表安排',
'方案决策会':'【纪要框架】\n一、决策结果（选A/B/待定）及理由\n二、通过方案拆解\n三、反对意见记录（留档）\n四、落地owner与验收标准',
'全员/早会':'【纪要框架】\n一、管理层信息（转达别遗漏）\n二、各板块进展速览\n三、需全员配合的事项\n四、明日预告',
'对外拜访/合作会':'【纪要框架】\n一、对方核心诉求提炼\n二、我方提供价值与匹配点\n三、达成的共同意向\n四、下一步动作与我方负责人'
};
const TODO=['把「会前3分钟发议程、材料置顶」固化为习惯','指定一名记录员，同步共享文档现场写结论','每个待办都明确到人+到日期，会后发给全员'],
      ISOL={'15分钟':'会议宜严格守时，超时请果断后排','30分钟':'30分钟内给每项议题预留≤8分钟讨论','45分钟':'45分钟重点议题不宜超过3个','1小时':'60分钟请在中点设一次节奏刹车检查','90分钟':'90分钟长会请在第45分钟强制中场休息5分钟'};
function pick(a){return a[Math.floor(Math.random()*a.length)];}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI高效会议议程＋纪要生成 | AgentGongju.com'))return;
const type=document.getElementById('type').value;
const dur=document.getElementById('dur').value;
const topic=document.getElementById('topic').value.trim();
if(!topic){alert('请填写会议主题');return;}
const A=TYPE_AGENDA[type];
let r='【会议类型：'+type+' | 预计时长 '+dur+'】\n';
r+='目标（一句话）：'+A.goal+'\n\n';
r+='━━━ 会前·拟发议程 ━━━\n';
r+='主题：'+topic+'　\n请各参会方会前更新下列材料：\n· 相关数据/进度截图；\n· 想拿到结论的“具体问题”提前贴进共享文档；\n· 明确本场自己要贡献/拍板的角色。\n\n';
r+='━━━ 会中·议程排布（'+dur+'）━━━\n'+A.chain.join('\n');
r+= '\n\n(时间分配灵感：'+ISOL[dur]+')\n';
r+='\n━━━ 会中·纪要速记框架 ━━━\n'+NOTE[type];
r+='\n\n━━━ 会后·待办清单 ━━━\n';
const t=[['把本次会议结论与分工当天同步到群/文档'],['① '+pick(TODO)],['② '+pick(TODO)],['③ 在下次'+type+'前一天回收一下各待办进度']];
t.forEach(x=>{r+='· '+x[0]+'\n';});
r+='\n（以上议程/时间为参考，请按实际参会人来微调）';
document.getElementById('outputBox').innerText=r;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 会议包已复制！'))}
</script>
</body>
</html>
