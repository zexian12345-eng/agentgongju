<div class="card">

<select id="age"><option value="幼" selected>3-6岁(幼儿园)</option><option value="小低">小学低年级(6-9岁)</option><option value="小高">小学高年级(9-12岁)</option><option value="青">青少年(12岁+)</option></select>

<div><label>🗂 主要用途场景</label><select id="use"><option value="零食玩具" selected>零食/玩具</option><option value="文具书籍">文具/书籍</option><option value="充值游戏">手机游戏/短视频充值处</option><option value="综合">综合学习用品+玩具</option></select></div>
</div>
<label>🎯 你最想培养的习惯</label>
<select id="goal"><option value="储蓄" selected>储蓄意识</option><option value="预算">会做预算不超额</option><option value="需要想要">分清“需要”与“想要”</option><option value="付出赚钱">理解赚钱不易</option></select>

<script>
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('亲子财商启蒙课'))return;
const age=document.getElementById('age').value,amt=+document.getElementById('amt').value,use=document.getElementById('use').value,goal=document.getElementById('goal').value;
let out='【零花钱财商小课堂 · 适合'+({幼:'3-6岁',小低:'6-9岁',小高:'9-12岁',青:'12岁+'}[age])+'】\n\n';
out+='━━ ① 跟孩子这样说「钱是什么」 ━━\n';
out+=age==='幼'?'· 用实物硬币游戏教认钱币大小，玩“商店老板”角色扮演\n· 把“想买的东西”贴纸贴到储蓄罐上，看得见目标才愿意存'
:age==='小低'?'· 一起数清每月约定¥'+amt+'怎么来的，对应要付出的小家务\n· 教三种罐子：花掉/存起来/分享给他人'
:age==='小高'?'· 引导自己做简单记账本，学会算结余与比价\n· 引入“想要vs需要”清单，为一件大件目标分期攒'
:'· 聊利率、单利/复利雏形与理性广告观，可给一张专属储蓄卡\n· 约定大额消费需“冷静期”(例如隔一夜再决定)';
out+='\n\n━━ ② '+({储蓄:'存钱',预算:'做预算',需要想要:'分清需要想要',付出赚钱:'体会赚钱'}[goal])+'的现成方法 ━━\n';
out+='✔ '+({储蓄:'“先给自己发工资”——每月零花钱一到，先拿出约30%放进“存钱罐/小金库”，剩下才自由花',预算:'给零花钱分装成几叠信封(零食/文具/存钱)，哪叠花完这月不再补，自然学会规划',需要想要:'购物前问两句魔法话：这是“需要”还是“想要”？等3天还想要再买吗',付出赚钱:'用“专职小家务”赚零花(整理房间这类义务不算)，做得好有额外任务卡可获得奖励'}[goal])+'\n';
out+='\n━━ ③ 全家可执行的零花钱契约(建议打印) ━━\n\n《家庭零花钱契约书》\n1. 甲方(孩子)每月可领零花钱 ¥'+amt+'，于每月1日发放。\n2. 用途约定：'+use+'；其中储蓄部分建议不低于总额的'+({储蓄:'40',预算:'20',需要想要:'25',付出赚钱:'30'}[goal])+'%。\n3. 其他规则：\n   · 超额不预支；(小高以上)大件消费有1晚冷静期；\n   · 乱花钱不斥责，但下次商量如何避免；\n   · 义务家务与零花钱无关，额外服务可赚节日费。\n4. 家长承诺：尊重孩子支配权，不克扣、不事后指责；每月陪孩子对一次账(15分钟)。\n签名：孩子______  家长______   日期______\n';
out+='\n━━ ④ 给家长的话 ━━\n· 犯错是孩子最好的老师，偶尔一次花光买来教训远比说教有效。\n· 别用零花钱奖惩成绩，会把“金钱”和“爱/自尊”混为一谈。\n· '+'🧧 压岁钱建议：和孩子约定「存多少/花多少/做多少」，顺势开启储蓄与礼仪双课。\n\n【陪孩子学会和钱做朋友 🌱】';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 契约已复制，可粘贴打印！'))}
</script>
