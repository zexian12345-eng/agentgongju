<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.btn-eg{width:100%;padding:10px;margin-top:8px;background:rgba(255,255,255,0.05);border:1px dashed rgba(148,163,184,0.4);border-radius:10px;color:#94a3b8;font-size:.9rem;cursor:pointer}
.btn-eg:hover{border-color:#6366f1;color:#a5b4fc}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.9;white-space:pre-wrap;margin-bottom:12px;font-size:.9rem;font-family:ui-monospace,Menlo,monospace;word-break:break-all}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.tip{color:#94a3b8;font-size:.85rem;margin-top:12px;line-height:1.7}
.chip{display:inline-block;padding:5px 12px;margin:0 6px 6px 0;background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.3);border-radius:20px;color:#a5b4fc;font-size:.8rem;cursor:pointer}
.chip:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>

<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🔣 AI 正则表达式生成器</h1><p>用大白话说需求，自动生成能跑的正则</p></div>

<div class="card">
<label>💬 描述你要匹配什么</label>
<textarea id="desc" placeholder="例如：匹配中国大陆手机号，11位，以1开头，第二位是3-9"></textarea>
<label>📚 常用模板（点击快速填入）</label>
<div>
<span class="chip" onclick="fill('手机号')">手机号</span>
<span class="chip" onclick="fill('邮箱')">邮箱</span>
<span class="chip" onclick="fill('身份证')">身份证号</span>
<span class="chip" onclick="fill('日期')">日期 YYYY-MM-DD</span>
<span class="chip" onclick="fill('URL网址')">网址 URL</span>
<span class="chip" onclick="fill('中文')">纯中文</span>
<span class="chip" onclick="fill('密码强度')">强密码</span>
<span class="chip" onclick="fill('邮编')">6位邮编</span>
<span class="chip" onclick="fill('车牌')">车牌号</span>
<span class="chip" onclick="fill('银行卡')">银行卡号</span>
</div>
<div class="param-row" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px">
<div><label>⚙️ 匹配模式</label>
<select id="mode">
<option value="整体">整段精确匹配</option>
<option value="查找">从文本中查找</option>
</select></div>
<div><label>🔤 语言风格</label>
<select id="lang">
<option value="javascript">JavaScript</option>
<option value="python">Python</option>
<option value="java">Java</option>
<option value="php">PHP</option>
</select></div>
</div>
<button class="btn-gen" id="genBtn">✨ 生成正则表达式</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 生成结果</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制正则</button>
<div class="tip">💡 提示：不同语言的正则语法略有差异，Java 中反斜杠需写成 \\\\ ，Python 建议使用 r"..." 原始字符串。</div>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
var LIB={
'手机号':{re:'^1[3-9]\\d{9}$',note:'1 开头，第二位 3-9，后面 9 位数字，共 11 位。'},
'邮箱':{re:'^[\\w.\\-]+@[\\w\\-]+(\\.[\\w\\-]+)+$',note:'用户名允许字母数字下划线点，@ 域名，支持多级后缀。'},
'身份证':{re:'^[1-9]\\d{5}(19|20)\\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\\d|3[01])\\d{3}[\\dXx]$',note:'18 位，含地区码、出生日期合法性、顺序码与校验位 X。'},
'日期':{re:'^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])$',note:'YYYY-MM-DD，月份 01-12，日期 01-31。若需严格校验闰年建议用日期库。'},
'URL网址':{re:'^https?:\\/\\/[\\w\\-]+(\\.[\\w\\-]+)+(\\/[\\w\\-./?%&=]*)?$',note:'匹配 http/https 开头的网址，允许路径与查询串。'},
'中文':{re:'^[\\u4e00-\\u9fa5]+$',note:'匹配常用汉字区间，不含标点与生僻扩展区。'},
'密码强度':{re:'^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[!@#$%^&*]).{8,20}$',note:'至少 8 位，含大小写字母、数字、特殊符号各一。'},
'邮编':{re:'^[1-9]\\d{5}$',note:'6 位数字，首位不为 0。'},
'车牌':{re:'^[京津沪渝冀豫云辽黑湘皖鲁新苏浙赣鄂桂甘晋蒙陕吉闽贵粤青藏川宁琼][A-HJ-NP-Z][A-HJ-NP-Z0-9]{4,5}[A-HJ-NP-Z0-9挂学警港澳]$',note:'省份简称 + 字母(不含I/O) + 5-6 位，覆盖普通与新能源车牌。'},
'银行卡':{re:'^\\d{16,19}$',note:'16-19 位数字，普通借记卡/信用卡长度范围。'}
};
function fill(k){
const item=LIB[k];
if(item){document.getElementById('desc').value='匹配'+k;window._hint=k;}
}
document.getElementById('genBtn').addEventListener('click',function(){
if(!Paywall.countUse('AI 正则表达式生成器 | AgentGongju.com'))return;
var d=document.getElementById('desc').value.trim();
if(!d){alert('请先描述你要匹配的内容');return;}
var mode=document.getElementById('mode').value;
var lang=document.getElementById('lang').value;
var item=null;
for(var k in LIB){ if(d.indexOf(k.replace('网址',''))>-1||d.indexOf('匹配'+k)>-1){ item=LIB[k]; break; } }
var re,note,tag;
if(item){
re=item.re;note=item.note;tag='已匹配到内置规则库';
}else{
// 简单规则推断
var body='';
if(/手机|电话/.test(d)){body='1[3-9]\\d{9}';note='手机号：11 位，1 开头。';}
else if(/邮箱|mail/i.test(d)){body='[\\w.\\-]+@[\\w\\-]+\\.[\\w.]+';note='邮箱：本地名@域名。';}
else if(/数字|整数/.test(d)){body='\\d+';note='匹配连续数字。';}
else if(/字母/.test(d)){body='[A-Za-z]+';note='匹配连续英文字母。';}
else if(/汉字|中文/.test(d)){body='[\\u4e00-\\u9fa5]+';note='匹配连续汉字。';}
else if(/空格|空白/.test(d)){body='\\s+';note='匹配一个或多个空白字符。';}
else {body='.*';note='未能识别具体规则，已给出通用通配写法，请手动调整。';}
re=(mode==='整体'?'^':'')+body+(mode==='整体'?'$':'');
tag='根据描述推断生成';
}
var out='【正则表达式】\n'+re+'\n\n【规则说明】\n'+note+'\n\n【生成方式】'+tag+'\n【匹配模式】'+(mode==='整体'?'整体精确匹配（^...$）':'文本查找（不加首尾锚点）');
var code='';
if(lang==='javascript'){code='const re = /'+re.replace(/^\^|\$$/g,'').replace(/\\\\/g,'\\')+'/'+(mode==='整体'?'':'g')+';\nconsole.log(re.test("测试文本"));';}
else if(lang==='python'){code='import re\npattern = r"'+re.replace(/\\\\/g,'\\')+'"\nprint(re.match(pattern, "测试文本"))';}
else if(lang==='java'){code='Pattern p = Pattern.compile("'+re.replace(/\\/g,'\\\\')+'");\nMatcher m = p.matcher("测试文本");\nSystem.out.println(m.matches());';}
else{code='$pattern = \'/'+re+'/\';\nif (preg_match($pattern, $str)) {\n    echo "匹配成功";\n}';}
out+='\n\n【'+lang+' 用法】\n'+code;
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(function(){alert('✅ 已复制！')})}
</script>
</body>
</html>
