<script>
const CN=['零','壹','贰','叁','肆','伍','陆','柒','捌','玖'];
const U=['','拾','佰','仟'];
const UNIT=['','万','亿','万亿'];
// 把 4 位段转成中文（忽略前导零，段内零只补一次）
function segToCn(seg){
  if(seg===0)return '';
  const s=('0000'+seg).slice(-4);
  let out='',seen=false,pending=false;
  for(let i=0;i<4;i++){
    const d=+s[i];
    if(d===0){ pending=seen; }
    else{
      if(pending)out+='零';
      pending=false;
      out+=CN[d]+U[3-i];
      seen=true;
    }
  }
  return out;
}
function intToCn(n){
  if(n===0)return '零';
  const chunks=[];let v=n;
  while(v>0){chunks.push(v%10000);v=Math.floor(v/10000);}
  let out='',needZero=false;
  for(let gi=chunks.length-1;gi>=0;gi--){
    const seg=chunks[gi];
    if(seg===0){ if(out!=='')needZero=true; continue; }
    const inner=segToCn(seg);
    if(needZero){ out+='零'; needZero=false; }
    else if(out!==''&&seg<1000){ out+='零'; }
    out+=inner+UNIT[gi];
  }
  return out;
}
document.getElementById('egBtn').addEventListener('click',()=>{
  const r=()=>[0,1,2,3,20,90][Math.floor(Math.random()*6)];
  const amt=(Math.floor(Math.random()*900000)+100)+'.'+r()+r();
  document.getElementById('num').value=amt;
});
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('人民币金额大写转换 | AgentGongju.com'))return;
const raw=document.getElementById('num').value.trim().replace(/,/g,'');
if(!raw){alert('请先输入金额');return;}
if(!/^\d+(\.\d{1,2})?$/.test(raw)){alert('请输入正确金额，最多两位小数：如 3867.50');return;}
const parts=raw.split('.');
const yi=intToCn(parseInt(parts[0],10));
const f=parts.length>1?parts[1]:'';
const j= f?parseInt((f+'0').slice(0,2)[0]||'0',10):0;
const s= f?parseInt((f+'0').slice(0,2)[1]||'0',10):0;
let head, tail;
if(parts.length===1||f===''){
  // 纯整数输入：无小数
  head= yi==='零' ? '人民币零元' : '人民币'+yi+'元';
  tail='整';
}else if(j===0&&s===0){
  // 小数全为 0（如 100.00 或 .00）
  head= yi==='零' ? '人民币零元' : '人民币'+yi+'元';
  tail='整';
}else{
  head= yi==='零' ? '人民币' : '人民币'+yi+'元';
  if(j>0&&s>0){ tail=CN[j]+'角'+CN[s]+'分'; }
  else if(j>0){ tail=CN[j]+'角'; }
  else { tail=(yi==='零'?'':'零')+CN[s]+'分'; }
}
const up=head+tail;
document.getElementById('outputBox').innerText='大写金额：\n'+up;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 已复制！'))}
</script>
