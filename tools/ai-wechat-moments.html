var IMG={

function gen(){
var scene=document.getElementById('scene').value;
var tone=document.getElementById('tone').value;
var len=document.getElementById('len').value;
var num=+document.getElementById('num').value;
var detail=document.getElementById('detail').value.trim();
var pool=POOL[scene][tone]||POOL[scene].gentle;
var out='════ 朋友圈文案 ════\n';
out+='场景：'+scene.replace('travel','旅行').replace('food','美食').replace('work','工作').replace('daily','日常').replace('festival','节日').replace('fitness','健身').replace('pet','宠物').replace('study','学习').replace('family','家庭').replace('rain','雨天');
out+='　|　基调：'+({gentle:'温柔文艺',fun:'幽默自嘲',cool:'高冷简约',warm:'温暖治愈',real:'真实接地气'}[tone])+'\n\n';
var picks=pool.slice().sort(function(){return Math.random()-0.5;}).slice(0,num);
picks.forEach(function(p,i){
var txt=p;
if(detail){
var d=detail.length>12?detail.slice(0,12):detail;
if(len==='long')txt=p+'。'+d+'。';
else if(len==='mid')txt=p+'，'+d+'。';
else txt=d+'。'+p;
}else{
if(len==='long')txt=p+'。今天也想认真记录一下。';
else if(len==='mid')txt=p+'，今天也想记下来。';
}
out+=(i+1)+'. '+txt+'\n\n';
});
out+='════ 配图建议 ════\n';
out+='主图：'+IMG[scene]+'\n';
out+='张数：1 张图更有留白感，3 张图更有生活感，9 宫格适合记录流水日常；\n';
out+='调色：统一色调（暖黄 / 冷调胶片）比单张精修更耐看；\n';
out+='避雷：别发产品截图、二维码、敏感定位，避免被同事和客户过度解读。\n';
out+='\n════ 发圈小建议 ════\n';
out+='1. 一天最多 1-2 条，频率太高容易被折叠或屏蔽；\n';
out+='2. 文案里少用"求赞求关注"，自然内容更容易获得互动；\n';
out+='3. 带定位能增加生活感，但家庭住址、孩子学校建议不定位；\n';
out+='4. 真正的加分项是照片里的情绪，文案只是配角。\n';
return out;
}
