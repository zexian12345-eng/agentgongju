<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>💬 AI漫画分镜对白设计师</h1><p>给角色一张嘴，让台词有性格、分镜有张力</p></div>

<div class="card">
<div class="param-grid">
<div><label>🕴 反派人设</label>
<select id="typeA"><option selected>冷酷反派</option><option>温柔腹黑</option><option>热血主角</option><option>呆萌天然</option><option>高冷傲娇</option><option>阳光话痨</option></select></div>
<div><label>🤺 对话对象</label>
<select id="typeB"><option selected>热血主角</option><option>冷酷反派</option><option>青梅竹马</option><option>师父长辈</option><option>宿敌对手</option><option>软萌队友</option></select></div>
</div>
<div><label>⚔️ 场景冲突</label>
<select id="scene"><option selected>生死决战</option><option>初次相遇</option><option>误会背叛</option><option>诀别告别</option><option>实力被质疑</option><option>夕阳下的坦白</option></select></div>
<div><label>✍️ 角色名 / 补充设定（可选）</label>
<input type="text" id="note" placeholder="例如：主角叫阿诚，反派叫夜枭，两人曾为兄弟…"></input>
<button class="btn-gen" id="genBtn">✨ 生成分镜对白</button>
</div>

<div style="color:#a855f7;font-weight:600;margin-bottom:12px">💬 分镜对白脚本</div>

<button class="copy-btn" onclick="copyResult()">📋 复制脚本</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const PERSONA={
'冷酷反派':{tone:['字短句冷，句尾收得利落','常带命令与审视语气','情绪压到最低，越愤怒越平静'], tagline:['这世界，从没打算温柔待我，我又何必。','挡我路的人，从来只有一个下场。','你不懂我，又凭什么评判我。']},
'温柔腹黑':{tone:['语气越温柔，危险越大','喜欢先夸再下套','笑里藏着机锋'], tagline:['你这么单纯，我怎么舍得骗你呢……才怪。','有时候，笑到最后的人看起来最无辜。','你猜，我是真心的，还是在装？']},
'热血主角':{tone:['像孩子一样直接喊出来','有冲劲，容易被激将','把信念放在嘴边不害羞'], tagline:['我可是要成为最强的人啊！','就算只有我一个人，我也要打到底！','输了也没关系，站起来接着打！']},
'呆萌天然':{tone:['简单直球表达','常常答非所问惹人笑','善良到让人没脾气'], tagline:['啊？你刚才说的是什么意思呀？','可是肚子饿了，就得吃饭呀。','没关系啦，我相信你！']},
'高冷傲娇':{tone:['口是心非先说难听的话','语气别扭，转身却心软','用冷哼掩盖关心'], tagline:['才、才不是担心你呢！','哼，谁要管你啊……那边很危险。','我可没说要帮你，只是顺路。']},
'阳光话痨':{tone:['一口气说一大串','爱开玩笑缓解气氛','热情得刹不住车'], tagline:['别板着脸嘛，笑一个，世界多美好！','说吧说吧，我全都要听，少一个字都不行！','遇到我就算你有救啦！']}
};
const SCENE={
'生死决战':{desc:'刀光剑影对峙的高潮分镜，背景留白放大杀意',beats:['黑白底稿，双方面部大特写交错定格','武器碰撞迸发火星的一格长条','各自说出坚持的理由后，眼神变化，出招定格']},
'初次相遇':{desc:'轻松带一点戏剧性的登场分镜',beats:['远景切入两人第一次对视','一方带着试探靠近','另一方略带戒备却忍不住回应的特写']},
'误会背叛':{desc:'情绪爆发的内心戏分镜',beats:['误会发生那一刻的震惊定格','低头沉默的留白小格','最终把心结说破的大特写爆发']},
'诀别告别':{desc:'温柔惆怅的氛围分镜，多用留白',beats:['侧影相对而立的远景','转身欲言又止的半格','最后回头一笑的定格']},
'实力被质疑':{desc:'低气压到反击的节奏变化',beats:['旁人不屑的眼神与冷语','主角低头不语、握拳蓄势特写','抬头反击的气势分镜对冲']},
'夕阳下的坦白':{desc:'温暖治愈的独白分镜',beats:['并肩坐在夕阳下的全景','各自侧脸放空的中景','把心里话说完后并肩看天的定格']}
};
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(ar){for(let x=ar.length-1;x>0;x--){const y=Math.floor(Math.random()*(x+1));[ar[x],ar[y]]=[ar[y],ar[x]];}return ar;}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI漫画分镜对白设计师 | AgentGongju.com'))return;
const typeA=document.getElementById('typeA').value;
const typeB=document.getElementById('typeB').value;
const scene=document.getElementById('scene').value;
const note=document.getElementById('note').value.trim();
const A=PERSONA[typeA], B=PERSONA[typeB];
const SC=SCENE[scene];
const nameA=note?note.split(/[,，]/)[0]||'角色A':typeA;
const nameB=note?note.split(/[,，]/)[1]||'对方':typeB;
const beats=shuffle([...SC.beats]);
let r='【分镜对白 · '+scene+'】\n场景氛围：'+SC.desc+'\n\n';
r+='（第1格 · '+beats[0]+'）\n';
r+='◆ '+nameA+'（'+typeA+'）："'+pick(A.tagline)+'"\n';
r+='◇ '+nameB+'（'+typeB+'）："'+pick(B.tagline)+'"\n\n';
r+='（第2格 · '+beats[1]+'）\n';
r+='◆ 画外独白 · '+nameA+'：'+pick(A.tone)+'。内心："这一格表情要冷，字越少越有分量。"\n';
r+='◇ 动作提示：'+picks(beats[1])+'\n\n';
function picks(k){return k;}
r+='（第3格 · '+(beats[2]||'收尾定格')+'）\n';
r+='◆ '+nameA+'："'+pick(A.tagline)+'" \u2014 台词情绪按「'+pick(A.tone)+'」处理\n';
r+='◇ '+nameB+'收束回应：镜头切远景给情绪留白，结束一句点题更耐看。\n\n';
r+='—— 台词设计小贴士 ——\n';
r+=(note?'你补充的设定「'+note+'」已并入角色关系；\n':'');
r+='· '+typeA+'说话习惯：'+pick(A.tone)+'，可用语气词区别口癖；\n· 反派与主角对白避免同字数句式，长短交错更有节奏感；\n· 情绪最关键的一格，台词越短越好。';
document.getElementById('outputBox').innerText=r;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 脚本已复制！'))}
</script>
