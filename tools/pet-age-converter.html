<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI宠物年龄换算与健康建议 | AgentGongju.com</title>
<meta name="description" content="把宠物年龄换算成人类年龄，并根据品种给出喂养、疫苗、体检等对应生命阶段的健康建议。">
<meta name="keywords" content="宠物,猫,狗,年龄换算,人类年龄,健康,疫苗,喂养">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
input[type=text],select{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
input:focus,select:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;font-size:.92rem;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.param-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🐾 AI宠物年龄换算与健康建议</h1><p>看懂毛孩子的"人类年龄"</p></div>

<div class="card">
<div class="param-grid">
<div><label>🐕 宠物类型</label><select id="pet"><option value="cat">猫咪</option><option value="dog">狗狗</option></select></div>
<div><label>📏 体型（狗狗用）</label><select id="size"><option value="small">小型犬</option><option value="mid">中型犬</option><option value="big">大型犬</option></select></div>
</div>
<div class="param-grid">
<div><label>🎂 实际年龄（岁）</label><input type="text" id="age" placeholder="例：3"></div>
<div><label>🐾 是否绝育</label><select id="spay"><option value="yes">已绝育</option><option value="no">未绝育</option></select></div>
</div>
<button class="btn-gen" id="genBtn">🧮 换算年龄</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">🐾 换算与健康建议</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制结果</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function catAge(y){y=Math.max(0,y);if(y<=0)return 0;if(y===1)return 15;if(y===2)return 24;return 24+(y-2)*4;}
function dogAge(y,size){y=Math.max(0,y);const m={small:1,mid:1,big:1.5}[size];if(y<=0)return 0;if(y===1)return 15;if(y===2)return 24;return Math.round(24+(y-2)*4*m);}
function stage(hAge){
if(hAge<1)return 'baby';if(hAge<30)return 'young';if(hAge<60)return 'mature';return 'senior';
}
const stageAdvice={
baby:{t:'幼年/幼崽',adv:'· 注意按时打针（第一针约2-3月龄开始），驱虫要跟上。\n· 幼宠吃专用幼年粮，少食多餐，别喂人食。\n· 多陪伴做社会化训练，性格会更稳定。'},
young:{t:'青壮年',adv:'· 精力旺盛，保证每天运动/互动，防止拆家。\n· 定期体检+按时疫苗加强，驱虫按季。\n· '},mature:{t:'中年',adv:'· 代谢变慢，注意控制体重，防止肥胖。\n· 每年至少一次全面体检，重点查口腔、关节。\n· 可换老年/中年配方粮，逐渐减少高热量。'},
senior:{t:'老年',adv:'· 动作变缓，减少剧烈运动，防摔倒。\n· 增加关怀，注意牙口、视力、关节和器官功能。\n· 体检频率提高到半年一次，及时调整用药。'}
};
document.getElementById('genBtn').addEventListener('click',function(){
if(!Paywall.countUse('AI宠物年龄换算与健康建议 | AgentGongju.com'))return;
const pet=document.getElementById('pet').value;
const size=document.getElementById('size').value;
const age=parseFloat(document.getElementById('age').value);
const spay=document.getElementById('spay').value;
if(isNaN(age)||age<0){alert('请正确填写宠物年龄');return;}
const hAge=Math.round(pet==='cat'?catAge(age):dogAge(age,size));
const st=stage(hAge);
const sd=stageAdvice[st];
let out='【宠物年龄换算】\n';
out+='🐕 '+pet==='cat'?'猫咪':'狗狗'+(pet==='dog'?'（'+({small:'小型犬',mid:'中型犬',big:'大型犬'}[size])+'）':'')+'｜实际 '+age+' 岁\n';
out+='🧓 相当于人类约 '+hAge+' 岁\n\n';
out+='【当前阶段】'+sd.t+'（人类'+hAge+'岁左右）\n\n';
out+='【健康建议】\n'+sd.adv;
out+=(spay==='yes'?'\n· 已绝育：注意控制食量防肥胖，关节和代谢再留意些。':'\n· 未绝育：如暂不繁殖，建议咨询兽医做绝育，可降低部分疾病风险。');
out+='\n\n【喂养提醒】\n· 勿喂葡萄、巧克力、洋葱等宠物禁食项。\n· 保持洁净饮水，口腔卫生定期清理。\n· 观察便便、食欲和精神，异常及时就医。🐾';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 结果已复制！'))}
</script>
</body>
</html>
