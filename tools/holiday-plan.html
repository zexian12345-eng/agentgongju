<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI假期计划生成器 | AgentGongju.com</title>
<meta name="description" content="AI假期/旅行计划生成器，根据自己的预算、天数和偏好自动生成个性化安排">
<meta name="keywords" content="假期计划,旅行计划,旅游攻略,行程安排,度假计划">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.8;white-space:pre-wrap;min-height:60px;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🏖️ AI假期计划生成器</h1><p>按天数、预算和旅行偏好，自动生成个性化行程安排</p></div>

<div class="card"><div class="param-row">
<div><label>目的地（选填）</label><input type="text" id="city" placeholder="例如：云南大理"></div>
<div><label>游玩天数</label><select id="days"><option value="1">1天</option><option value="2">2天</option><option value="3" selected>3天</option><option value="5">5天</option><option value="7">7天</option></select></div></div>
<div class="param-row">
<div><label>预算档位</label><select id="budget"><option>经济实惠</option><option>舒适轻奢</option><option>高端享受</option></select></div>
<div><label>旅行偏好</label><select id="pref"><option>美食打卡</option><option>自然风光</option><option>历史文化</option><option>休闲度假</option><option>购物体验</option></select></div></div>
<div><label>同行人员</label><select id="who"><option>独自旅行</option><option>情侣二人</option><option>家庭亲子</option><option>朋友结伴</option></select></div>
<button class="btn-gen" id="genBtn">🗺️ 生成行程</button></div>
<div class="result-area" id="resultArea"><div class="card"><div style="color:#22c55e;font-weight:600;margin-bottom:12px">🗓️ 你的个性化旅行计划</div><div class="result-box" id="out"></div><button class="copy-btn" onclick="copyResult()">📋 复制</button></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyResult(){navigator.clipboard.writeText(document.getElementById('out').textContent).then(()=>alert('✅ 已复制！'))}
const acts={
'美食打卡':['当地人气早市/早餐','地道特色餐厅','网红甜品店','夜市小吃巡礼','本地招牌菜一条街'],
'自然风光':['核心景区漫步','日出/日落观景点','森林公园徒步','湖畔/海边放松','观景台看全景'],
'历史文化':['博物馆参观','古街古镇游览','文化遗址打卡','传统手作体验','城市历史街区'],
'休闲度假':['惬意慢逛市区','咖啡店发呆','温泉/SPA放松','骑行或散步','躺平式放空'],
'购物体验':['购物商圈血拼','特色伴手礼店','文创集市','免税/大牌店','本地特产采购']};
const budgetNote={'经济实惠':'住青旅/经济型，地铁+公交出行','舒适轻奢':'住中高端酒店，打车+高铁出行','高端享受':'住度假酒店，包车/头等出行'};
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI假期计划生成器 | AgentGongju.com'))return;
const city=document.getElementById('city').value.trim()||'目的地';const days=parseInt(document.getElementById('days').value);const budget=document.getElementById('budget').value;const pref=document.getElementById('pref').value;const who=document.getElementById('who').value;
const pool=acts[pref]||acts['休闲度假'];
let out='【'+city+' · '+days+'天'+who+' · '+budget+'】\n\n';
out+='🚗 交通住宿：'+budgetNote[budget]+'\n\n';
for(let d=1;d<=days;d++){
out+='第'+d+'天 行程：\n';
const items=[];const t=[...pool];for(let i=0;i<3&&t.length;i++){items.push(t.splice(Math.floor(Math.random()*t.length),1)[0]);}
const times=['上午','下午','晚上'];
items.forEach((a,i)=>{out+='  · '+times[i]+'：'+a+'\n';});
out+='\n';
}
out+='📌 出行小贴士：\n· 提前预订门票与住宿，热门景点错峰出行\n· 随身带好证件，留意天气变化\n· 行程别排太满，留出机动时间慢慢享受\n· '+who+'出行注意兼顾彼此的节奏';
document.getElementById('resultArea').classList.add('active');
document.getElementById('out').textContent=out;
});
</script>
</body>
</html>
