.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}

.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}

.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,input[type=text],input[type=number],textarea{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px;box-sizing:border-box}

<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🛒 AI 社区团购比价助手</h1><p>按品类比单价，生成最优下单组合</p></div>
<div class="card">
<label>📝 输入你要买的东西和价格（每行一条，格式：品名 平台 价格 规格）</label>
<textarea id="list" placeholder="例如：
鸡蛋 多多买菜 12.9 30枚
鸡蛋 美团优选 13.5 30枚
五花肉 盒马 29.9 500g
白菜 多多买菜 3.9 1kg"></textarea>
<div class="param-row">
<div><label>📍 主要平台</label>
<select id="plat"><option value="multi" selected>多平台都有用</option><option value="dd">主要用多多买菜</option><option value="mt">主要用美团优选</option><option value="hm">主要用盒马/叮咚</option></select></div>
<div><label>💰 本次预算（元，选填）</label>
<input type="text" id="budget" placeholder="例如：80"></div>
</div>
<button class="btn-gen" id="genBtn">📊 开始比价</button>
<div class="tips">💡 格式越规范，比价越准。规格写清重量或数量，才能算出真实单价。</div>
</div>
<div class="result-area" id="resultArea">
<div class="card"><div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制比价表</button></div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function parseSpec(spec){
var s=spec.replace(/\s/g,'').toLowerCase();
var m=s.match(/^([\d.]+)(g|kg|ml|l|枚|个|只|斤|包|袋|瓶|盒)$/);
if(!m)return null;
var v=parseFloat(m[1]),u=m[2];
var per=1;
if(u==='kg'||u==='l')per=1000;
else if(u==='斤')per=500;
else per=1;
return {base:v*per,unit:(u==='kg'||u==='g'||u==='斤')?'g':'个'};
}
function gen(){
var raw=document.getElementById('list').value.trim();
if(!raw){alert('请先输入要比价的商品');return '';}
var lines=raw.split('\n').filter(function(x){return x.trim();});
var groups={};
var bad=[];
lines.forEach(function(line){
var parts=line.trim().split(/[\s,，]+/);
if(parts.length<4){bad.push(line.trim());return;}
var price=parseFloat(parts[2]);
var spec=parts.slice(3).join('');
if(isNaN(price)){bad.push(line.trim());return;}
var g=parts[0];
var base=null,unit='';
var sp=parseSpec(spec);
if(sp){base=sp.base;unit=sp.unit;}
else{
var num=parseFloat(spec);
if(!isNaN(num)){base=num;unit='个';}
}
if(!groups[g])groups[g]=[];
groups[g].push({plat:parts[1],price:price,spec:spec,base:base,unit:unit,raw:line.trim(),unitPrice:base?price/base:null});
});
var out='════ 社区团购比价结果 ════\n\n';
var saveTotal=0,items=0;
Object.keys(groups).forEach(function(g){
var arr=groups[g];
var valid=arr.filter(function(a){return a.unitPrice!==null;});
var sorted=valid.length?valid.slice().sort(function(a,b){return a.unitPrice-b.unitPrice;}):arr.slice().sort(function(a,b){return a.price-b.price;});
var cheapest=sorted[0];
var most=sorted[sorted.length-1];
out+='【'+g+'】\n';
sorted.forEach(function(a,i){
var flag=i===0?'✅ 最划算':'　　';
var up=a.unitPrice!==null?('　单价 '+a.unitPrice.toFixed(3)+' 元/'+a.unit):'';
out+=flag+' '+a.plat+'：'+a.price+' 元（'+a.spec+'）'+up+'\n';
});
if(valid.length>1&&cheapest&&most){
var diff=most.price-cheapest.price;
out+='　→ 建议在「'+cheapest.plat+'」买，比最贵的省 '+diff.toFixed(1)+' 元\n';
items++;saveTotal+=diff;
}else if(sorted.length>1){
out+='　→ 单位不统一，只能比总价，建议选「'+cheapest.plat+'」\n';
}
out+='\n';
});
out+='════ 汇总建议 ════\n';
out+='· 按最优选择下单，本次可省约 '+saveTotal.toFixed(1)+' 元\n';
if(bad.length){out+='\n⚠️ 以下内容格式不规范，未能参与比价（请补全平台与规格）：\n';bad.forEach(function(b){out+='　· '+b+'\n';});}
var bud=parseFloat(document.getElementById('budget').value);
if(!isNaN(bud))out+='\n💰 预算 '+bud+' 元，根据比价结果可优先购买价差最大的品类。\n';
out+='\n──── 🧠 团购平台选购策略 ────\n';
out+='1. 鸡蛋、牛奶、米面油：标品价差小，哪个便宜买哪个；\n';
out+='2. 蔬菜水果：重点看新鲜度评价，团购次日达通常不如当日达新鲜；\n';
out+='3. 肉类：注意看是"净重"还是"含包装重"，差 50g 单价就变了；\n';
out+='4. 大件囤货：选有"免运费"和"坏损包赔"的平台；\n';
out+='5. 新人优惠、满减券记得叠，通常能再省 5-15 元；\n';
out+='6. 提货点选择离家最近的，取货成本也是成本。\n';
out+='\n──── ⚠️ 常见套路 ────\n';
out+='· 标价便宜但规格缩水（比如"1 斤"实际 450g）；\n';
out+='· 首单特价，第二单恢复原价；\n';
out+='· 拼团价需要拉人，实际到手并不便宜；\n';
out+='· 坏损理赔要拍照＋限时申请，过期不给赔。\n';
return out;
}
</script>
<script>
document.getElementById('genBtn').addEventListener('click',function(){
if(!Paywall.countUse('AI 社区团购比价助手 | AgentGongju.com'))return;
document.getElementById('outputBox').innerText=gen();
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(function(){alert('✅ 已复制！')})}
</script>
