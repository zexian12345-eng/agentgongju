<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI宠物健康自查 | AgentGongju.com</title>
<meta name="description" content="把你的毛孩子症状、吃喝拉撒和精神状态填进来，AI帮你判断哪些常见问题要注意、什么情况该尽快就医，给出日常护理建议。">
<meta name="keywords" content="宠物健康,宠物症状,猫狗生病,宠物自查,犬猫健康,宠物呕吐,宠物拉稀,宠物就医">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
textarea,input[type=text],select,input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:100px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;font-size:.92rem;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.sev{background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.3);border-radius:12px;padding:14px;color:#fecdd3;font-size:.9rem;line-height:1.9;margin-bottom:14px}
.mid{background:rgba(250,204,21,.1);border:1px solid rgba(250,204,21,.3);border-radius:12px;padding:14px;color:#fde68a;font-size:.9rem;line-height:1.9;margin-bottom:14px}
@media(max-width:600px){.param-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🐾 AI宠物健康自查</h1><p>描述你家毛孩子的状态，快速判断要不要去医院</p></div>

<div class="card">
<div class="param-grid">
<div><label>🐶 宠物类型</label><select id="pettype"><option value="dog">狗狗</option><option value="cat">猫咪</option></select></div>
<div><label>📏 年龄</label><select id="age"><option value="baby">幼年</option><option value="adult">成年</option><option value="old">老年</option></select></div>
<div><label>🍽 近期食欲</label><select id="appetite"><option value="normal">正常</option><option value="less">减退</option><option value="none">完全不进食</option></select></div>
</div>
<label>🩹 描述症状/异常（越具体越好）</label>
<textarea id="symptom" placeholder="例如：从昨天开始呕吐了3次，还有点拉稀，精神萎靡，不怎么吃粮，鼻头有点干…"></textarea>
<button class="btn-gen" id="genBtn">🔍 健康自查</button>
<label style="margin-top:12px;color:#64748b;font-size:.8rem">* 自查仅供参考，不能替代执业兽医，紧急情况请立即就医</label>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">🩺 健康自查结果</div>
<div id="sevBox"></div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制自查结果</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function has(text,kws){return kws.some(k=>text.includes(k))}
document.getElementById('genBtn').addEventListener('click',function(){
if(!Paywall.countUse('AI宠物健康自查 | AgentGongju.com'))return;
const text=document.getElementById('symptom').value.trim();
if(!text){alert('请描述一下宠物的症状');return;}
const type=document.getElementById('pettype').value;
const age=document.getElementById('age').value;
const appetite=document.getElementById('appetite').value;
const sevBox=document.getElementById('sevBox');
const p=type==='dog'?'毛孩子':'主子';
// 严重度判断
const red=['抽搐|癫痫','血便|便血|拉血','呼吸困难|喘不上|张口呼吸','误食|中毒|吞了|吃了.*异物|撞|摔','昏迷|不省人事','精神极度萎靡|趴着不动|叫不应','呕吐物有血|呕血','明显脱水'];
let sev=0;red.forEach(r=>{if(has(text,r.split('|')))sev=1;});
const orange=['呕吐|吐了','拉稀|腹泻|水样便','发烧|发热|体温高','抽搐','精神萎靡|没精神','不进食|停止进食','皮毛异常|掉毛|瘙痒','尿频|血尿'];
let sep=false;orange.forEach(o=>{if(has(text,o.split('|')))sep=true;});
let isHosp=false;
if(appetite==='none')sep=true;
if(sev===1){
isHosp=true;
sevBox.innerHTML='<strong>🚨 紧急！</strong> 你描述的情况可能存在<a>致命风险</a>，请<strong>立即就近联系宠物医院或送医</strong>，途中保持安抚，不要自行投药。<br>就医时可带上：<strong>疑似误食物品、呕吐物样本（可拍照）、既往病历</strong>。';
}else if(sep){
sevBox.innerHTML='<strong>⚠️ 建议尽快就医</strong> 根据描述存在需要兽医判断的异常（'+ (appetite==='none'?'且已经停止进食，风险较高':'') +'）。建议今天内预约宠物医院做基础检查，避免拖延加重。';
}else{
sevBox.innerHTML='<strong>🟡 暂可观察</strong> 症状偏轻度、单一，精神食欲尚可时，可以暂时在家观察24小时，但仍需密切留意变化。';
}
let out='【宠物健康自查】\n宠物：'+(type==='dog'?'犬':'猫')+'｜年龄段：'+ageLabel(age)+'｜食欲：'+appLabel(appetite)+'\n\n';
out+='【症状分析】\n';
if(has(text,['呕吐','吐']))out+='· 呕吐：单次偶发可暂观察；<strong>反复呕吐、呕吐物带血或伴精神障碍需立即就医</strong>。先禁食4-6小时观察，少量喂水，若持续请送医。\n';
if(has(text,['拉稀','腹泻','水样']))out+='· 腹泻：轻者暂禁食观察补水；若水样明显、带血或反复，警惕细小/肠胃炎，需尽快就医。\n';
if(has(text,['没精神','萎靡','趴着']))out+='· 精神萎靡：食欲差+没精神往往提示身体不适，结合其他症状评估就医必要性。\n';
if(has(text,['掉毛','瘙痒','皮']))out+='· 皮肤异常：可能是寄生虫、过敏或真菌，建议带去排查，别乱用人类药膏。\n';
if(has(text,['咳嗽','打喷嚏','鼻'])){
out+='· 呼吸道：轻微打喷嚏可观察，持续咳嗽/精神差可能患呼吸道疾病，老年宠物更要注意。\n';}
if(has(text,['不吃饭','不吃','拒绝']))out+='· 厌食：超过24小时不进食有脂肪肝风险（尤其猫），应及时就诊。\n';
if(!has(text,['呕吐','拉稀','没精神','掉毛','咳嗽','不吃饭','抽搐','血','呼吸'])){
out+='· 你描述的症状较轻微/不典型，目前未见明确危险信号，建议继续观察并补充更多细节。\n';}
out+='\n【自助护理】\n· 保证干净饮水，观察排泄是否正常。\n· 不明原因<strong>别乱喂人用消炎药/止痛药</strong>——很多对人安全对宠物剧毒。\n· 就医前测一下体重和体温，方便医生判断。\n\n';
out+='【重要声明】\n· 本工具为科普参考，不能替代执业兽医诊断。\n'+(isHosp?'· 你目前的情况建议尽快就医，请勿仅依赖本工具拖延。':'· 若症状加重或出现新的异常，请及时就医。');
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function ageLabel(a){return{baby:'幼年',adult:'成年',old:'老年'}[a]}
function appLabel(a){return{normal:'正常',less:'减退',none:'完全不进食'}[a]}
function copyResult(){const el=document.getElementById('outputBox');const sev=document.getElementById('sevBox').innerText.replace(/<[^>]+>/g,'');navigator.clipboard.writeText(sev+'\n'+el.innerText).then(()=>alert('✅ 自查结果已复制！'))}
</script>
</body>
</html>
