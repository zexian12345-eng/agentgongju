<!DOCTYPE html>

<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
textarea,input[type=text],select{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;font-size:.92rem;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.sev-3{background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.4);border-radius:12px;padding:16px;color:#fecdd3;line-height:1.9;font-size:.95rem;margin-bottom:14px;font-weight:600}
.sev-2{background:rgba(250,204,21,.1);border:1px solid rgba(250,204,21,.35);border-radius:12px;padding:16px;color:#fde68a;line-height:1.9;font-size:.95rem;margin-bottom:14px;font-weight:600}
.sev-1{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:12px;padding:16px;color:#86efac;line-height:1.9;font-size:.95rem;margin-bottom:14px;font-weight:600}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🛡 AI防诈骗检测</h1><p>遇到可疑消息先别慌，粘进来让 AI 帮你把把关</p></div>

<div class="card">
<label>💬 粘贴可疑短信/聊天记录/电话内容</label>
<textarea id="text" placeholder="例如：恭喜您抽中iPhone大奖，点击链接领取;或是自称淘宝客服退款要验证码;或是让您转账到安全账户……"></textarea>
<button class="btn-gen" id="genBtn">🔍 检测风险</button>
<label style="margin-top:12px;color:#64748b;font-size:.8rem">* 本工具为智能识别参考，涉及转账请务必通过官方渠道核实</label>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">🛡 检测结果</div>
<div id="sevBox"></div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function has(t,kws){return kws.some(k=>t.toLowerCase().includes(k))}
document.getElementById('genBtn').addEventListener('click',function(){
if(!Paywall.countUse('AI防诈骗检测 | AgentGongju.com'))return;
const text=document.getElementById('text').value.trim();
if(!text){alert('请粘贴内容');return;}
const t=text.toLowerCase();
let hits=[],score=0;
// 高危特征
const red=[
['转账|汇款|安全账户|保证金',20,'要求转账到“安全账户”是典型诈骗话术（公检法不会让你转钱）'],
['验证码|短信验证码|卡号|密码|身份证号|银行卡',18,'索要验证码/密码/卡号是高风险信号，任何机构都无权索要'],
['链接|网址|http',10,'内容含链接，需警惕钓鱼网址，不点击陌生链接'],
['中奖|抽奖|免费|奖品|返现|红包|佣金',14,'中奖/免费/返现类通常是诱饵，诱导你交“手续费”或“押金”'],
['下载app|安装|屏幕共享|远程协助',16,'诱导下载不明APP或开屏幕共享=把账户拱手相让'],
['恢复出厂|不配合就|冻结|封号|追责|影响征信|违法',16,'以“冻结/封号/影响征信/违法”施压，制造恐慌逼你就范'],
['高回报|稳赚|利润|理财|数字货币|炒币|内幕',16,'高回报稳赚项目=庞氏骗局/杀猪盘特征'],
['垫资|刷单|兼职|任务单',18,'刷单垫资是高频骗局，先小利后大坑'],
['客服|退款|理赔|扣款|升级会员',10,'冒充客服退款/理赔是常见套路，勿信退款到“安全账户”']];
red.forEach(([kw,scr,note])=>{if(has(t,kw.split('|'))){hits.push(note);score+=scr;}});
const sev=score>=45?3:score>=20?2:score>0?1:0;
const sevBox=document.getElementById('sevBox');
if(sev===3)sevBox.innerHTML='🚨 <strong>高度疑似诈骗</strong>｜风险指数 '+Math.min(100,score)+'/100';
else if(sev===2)sevBox.innerHTML='⚠️ <strong>存在明显风险特征</strong>｜风险指数 '+score+'/100';
else if(sev===1)sevBox.innerHTML='🟡 <strong>有可疑迹象</strong>，建议谨慎核实｜风险指数 '+score+'/100';
else sevBox.innerHTML='🟢 <strong>未识别到明显诈骗特征</strong>，但仍请保持警惕';
let out='【检测分析】\n';
if(hits.length){hits.forEach((h,i)=>out+='✦ '+(i+1)+'. '+h+'\n');}
else out+='目前未匹配到典型诈骗关键词，但骗术日新月异，仍需综合判断。\n';
out+='\n【应对建议】\n';
out+='· 涉及转账/验证码，一律先挂断，通过官方渠道（官网/客服电话）主动核实。\n';
out+='· 不点击陌生链接、不下载不明APP、不开屏幕共享。\n';
out+='· 公检法不会通过电话/威信让您转钱到“安全账户”。\n';
out+='· 索要验证码=默认同意交易，绝不出示。\n';
out+=(sev>=2?'· 建议向当地反诈中心核实，或拨打96110咨询，必要时报警。\n':'· 若已被诱导转账，请立刻拨打110/96110紧急止付。\n');
out+='\n【重要声明】\n智能识别基于常见诈骗模式，不能覆盖所有新型套路；凡是要钱、要码、要信息的，多留个心眼就对了。';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('sevBox').innerText+'\n'+document.getElementById('outputBox').innerText).then(()=>alert('✅ 结果已复制！'))}
</script>
</body>
</html>
