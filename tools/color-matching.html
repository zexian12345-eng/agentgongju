<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 色彩搭配方案 | AgentGongju.com</title>
<meta name="description" content="AI色彩搭配师，输入主色调自动生成家居或穿搭的协调配色方案">
<meta name="keywords" content="色彩搭配,配色方案,装修配色,穿搭配色">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;min-height:60px;margin-bottom:12px}
.swatches{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0}
.swatch{width:64px;height:64px;border-radius:12px;border:1px solid rgba(255,255,255,0.15);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:.7rem;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>

</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🎨 AI 色彩搭配</h1><p>按主色调生成和谐耐看的配色方案，适合家居与穿搭</p></div>

<div class="card"><label>🎯 主色调</label>
<select id="color"><option>暖橙</option><option>雾霾蓝</option><option>莫兰迪灰</option><option>抹茶绿</option><option>奶油白</option><option>复古棕</option><option>樱花粉</option></select>
<div class="param-row">
<div><label>使用场景</label><select id="scene"><option>家居装修</option><option>日常穿搭</option><option>婚礼现场</option><option>品牌设计</option></select></div>
<div><label>方案数量</label><select id="count"><option value="3">3 套</option><option value="4">4 套</option></select></div></div>
<button class="btn-gen" id="genBtn">🌈 生成配色</button></div>
<div class="result-area" id="resultArea"><div class="card"><div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 配色方案已生成</div><div class="result-box" id="out"></div><button class="copy-btn" onclick="copyResult()">📋 复制方案</button></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const hexes={'暖橙':['#F97316','#FDBA74','#FFF7ED','#9A3412','#FDE68A'],'雾霾蓝':['#64748B','#93C5FD','#EFF6FF','#475569','#BFDBFE'],'莫兰迪灰':['#A8A29E','#E7E5E4','#F5F5F4','#78716C','#D6D3D1'],'抹茶绿':['#4D7C0F','#A3E635','#ECFCCB','#365314','#D9F99D'],'奶油白':['#FEF3C7','#FDE68A','#FFF7E6','#D97706','#FFFBEB'],'复古棕':['#92400E','#D6A05B','#F5E7D3','#6B3410','#E8D3B0'],'樱花粉':['#F9A8D4','#FBCFE8','#FFF0F6','#DB2777','#FDE7F0']};
const hints={'家居装修':'大面积用浅色打底，重点饰面用主色，金属件点睛。','日常穿搭':'上浅下深不易出错，主色做点缀，避免一身纯色堆砌。','婚礼现场':'以白色为主舞台，主色做花艺与桌布点缀，浪漫又高级。','品牌设计':'主色占 Logo，辅助色做背景，点缀色提亮，保持对比度。'};
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 色彩搭配方案 | AgentGongju.com'))return;
const color=document.getElementById('color').value;const scene=document.getElementById('scene').value;const count=parseInt(document.getElementById('count').value);
let out='🌈 【'+color+' · '+scene+'】配色方案\n\n';
for(let s=1;s<=count;s++){
const pal=[...hexes[color]].sort(()=>Math.random()-0.5);
out+='—— 方案'+s+' ——\n主色 '+pal[0]+' ／ 辅助 '+pal[1]+' ／ 辅助 '+pal[2]+' ／ 强调 '+pal[3]+' ／ 点缀 '+pal[4]+'\n\n';
}
out+='🎨 搭配思路：'+hints[scene];
document.getElementById('resultArea').classList.add('active');
document.getElementById('out').textContent=out;
});
</script>
</body>
</html>
