<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 表情包生成 | AgentGongju.com</title>
<meta name="description" content="AI表情包文案生成器，生成文字图片和表情包文案创意，聊天斗图必备">
<meta name="keywords" content="表情包生成,斗图,表情包文案,趣图">
<link rel="stylesheet" href="../css/style.css">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
input:focus,select:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.9;margin-bottom:12px}
.emo-item{display:flex;align-items:center;justify-content:space-between;padding:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:10px;margin-bottom:10px}
.emo-item .txt{color:#e2e8f0;font-size:1rem}
.emo-item .cp{cursor:pointer;color:#22c55e;font-size:.8rem}
.emo-item .cp:hover{text-decoration:underline}
.tag{color:#fbbf24;font-size:.8rem;margin-right:8px}
.meme-big{font-size:1.6rem;letter-spacing:2px;text-align:center;margin:10px 0}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>😂 AI 表情包生成</h1><p>斗图文案 · 文字表情包 · 聊天回复创意一键生成</p></div>

<div class="card"><label>💭 场景 / 心情（可选输入，如：被老板催进度）</label>
<input type="text" id="scene" placeholder="例如：被老板催进度 / 今天不想上班 / 追剧上头">
<div class="param-row" style="margin-top:12px"><div><label>类型</label><select id="type"><option value="斗图">斗图文案</option><option value="文字">文字表情</option><option value="回复">聊天神回复</option></select></div><div><label>生成数量</label><input type="number" id="count" value="5" min="3" max="8"></div></div>
<button class="btn-gen" id="genBtn">😂 生成表情包</button></div>
<div class="result-area" id="resultArea"><div class="card"><div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 表情包创意已生成</div><div id="listOut"></div></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyText(t){navigator.clipboard.writeText(t).then(()=>alert('✅ 已复制：'+t))}
const douTu=['你礼貌吗？','这话我没法接','但凡有点用也不至于没用','笑死，根本笑不死','我谢谢你全家','离谱他妈给离谱开门','这也太会了','我直接一个好家伙'];
const textEmo=['[捂脸][捂脸][捂脸]','[流泪]但是我没哭','[裂开]','[跪了]','[狗头]保命','[旺柴]','比了个耶[耶]','我就静静看着[微笑]'];
const replies=['好好好，你说的都对','确实，但下次别这样了','这不是巧了吗这不是','有没有一种可能……','嗯，很有道理，下次别说了','要不先这样吧','懂了，这就去做','你开心就好'];
document.getElementById('genBtn').addEventListener('click',()=>{
const scene=document.getElementById('scene').value.trim();
const type=document.getElementById('type').value;
const n=Math.min(8,Math.max(3,parseInt(document.getElementById('count').value)||5));
const pool=type==='斗图'?douTu:type==='文字'?textEmo:replies;
const sceneTxt=scene?'「'+scene.slice(0,10)+'」场景：':'通用场景：';
let html='';
for(let i=0;i<n;i++){
  const item=pool[(Math.floor(Math.random()*pool.length))];
  const label=type==='斗图'?'💬 斗图':'✍️ 表情文字';
  html+='<div class="emo-item"><span class="txt"><span class="tag">'+label+'</span>'+item+'</span><span class="cp" onclick="copyText(\''+item+'\')">复制</span></div>';
}
html+='<div class="meme-big">😅 一大波表情包来袭，斗图不虚！</div>';
document.getElementById('resultArea').classList.add('active');
document.getElementById('listOut').innerHTML=('<div style="color:#94a3b8;font-size:.85rem;margin-bottom:12px">'+sceneTxt+'已为你生成 '+n+' 条创意，点击复制即可直接用。</div>')+html;
});
</script>
</body>
</html>
