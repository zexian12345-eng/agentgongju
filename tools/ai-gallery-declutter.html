<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手机相册断舍离分拣助手 | AgentGongju.com</title>
<meta name="description" content="相册里有几万张截图、表情包、废片存着不敢删？选一个你的整理目标，自动给你一套"分批处理-分类归档-放心删除"的执行清单，并给出实用工具搭配建议。一次断舍离，释放的不只是存储空间。">
<meta name="keywords" content="手机相册,整理相册,断舍离,清理照片,存储空间,iCloud,截图管理">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
input[type=text],textarea,select{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s;margin-top:6px}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.95;white-space:pre-wrap;font-size:0.95rem;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.output-box{font-size:.9rem}}
</style>
<script>
var _hmt = _hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";
  var s = document.getElementsByTagName("script")[0];
  s.parentNode.insertBefore(hm, s);

<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>📱 手机相册断舍离分拣助手</h1><p>一次性理清上万张照片，大脑和手机一起清爽</p></div>

<div class="card">
<div class="param-grid">
<div><label>📷 相册大概有多少张</label>
<select id="size"><option selected>几千张(<5000)</option><option>上万张</option><option>2万张以上</option></select></div>
<div><label>😵‍💫 最想先清理哪部分</label>
<select id="focus"><option selected>截图/长截图太多</option><option>自拍/生活废片太多</option><option>表情包/网图</option><option>都乱，想系统重理</option></select></div>
</div>
<div class="param-grid">
<div><label>⏱ 每次愿花多少时间</label>
<select id="session"><option selected>15-30分钟/天</option><option>1小时大片</option><option>碎片5分钟/次</option></select></div>
<div><label>🎯 是否有强迫症想要"全部分类"</label>
<select id="ocd"><option selected>不用，实用优先</option><option>要 分得很细才舒服</option></select></div>
</div>
<div><label>📝 其它顾虑（如"怕误删重要的"）</label>
<textarea id="note" placeholder="例如：里面有过世亲人/孩子的照片不敢碰 / 截图里有些是工作要用的…"></textarea>
<button class="btn-gen" id="genBtn">🗂 给我一套整理流程</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">🧹 你的分拣执行手册</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制手册</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function pick(a){return a[Math.floor(Math.random()*a.length)];}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('手机相册断舍离分拣助手 | AgentGongju.com'))return;
const size=document.getElementById('size').value;
const focus=document.getElementById('focus').value;
const session=document.getElementById('session').value;
const ocd=document.getElementById('ocd').value;
const note=document.getElementById('note').value.trim();
let r='📱 整理作业设计：当前相册约'+size+'，优先解「'+focus+'」，每次'+session+'。\n'+(note?'专项提醒：'+note+'\n':'')+'\n';
r+='──────── 第0步｜先"建三个文件夹"兜底 ────────\n';
r+='· 「✅确定删」：等删区（放那些拍糊、闭眼、无意按到的）；\n· 「📥待归档」：可能有用但当下不看；\n· 「❤️必留」：仅放舍不得+真正想要的那一类。\n';
r+=ocd.indexOf('不用')>-1?'分三类已足够你安心，别为"完美的分类"过度消耗意志力。\n':'（你偏好精细，可在❤️必留下再建"生活/工作/家人/旅行"子夹）\n';
r+='\n──────── 第一步｜先清"零价值区"（快、爽、有成就感）────────\n';
if(focus.indexOf('截图')>-1){
 r+='□ 全选所有截图，逐个扫一眼：\n  · 已读送的拼单/验证码截图 → 删\n  · 收藏内容截图 → 放进待归档，用完不用留\n  · 重要信息截图 → 迁移到备忘录或同步盘，再删原图\n□ 长截图尤其占空间，能读完即删或归档为一篇笔记。\n';
} else if(focus.indexOf('自拍')>-1||focus.indexOf('生活废片')>-1){
 r+='□ 自拍连拍的：一组只留最棒1-2张，其余删\n□ 同景同速拍的风景/食物串：每串留1张精品，删除其余\n□ 糊掉/闭眼/意外按到的：直接送进✅确定删\n';
} else if(focus.indexOf('表情包')>-1){
 r+='□ 表情包若想留，建议迁移到表情收藏夹/专门的工具App，别占用宝贵相册空间\n□ 网图/壁纸存过下载链接的，基本可删；（要好看的存一个收藏夹）\n';
} else {
 r+='□ 用上面的"三夹法"先把明显废的挑出来删，再从旧到新一批批过\n';
}
r+='\n──────── 第二步｜把"可能要但怕删错"的 → 归档 ────────\n';
r+='□ 建一个“归档目录”（云盘/硬盘/专用相册都行）\n□ 工作类、证件类：原图上传到一个不容易误删的地方，相册里的反而可以删掉留个手不抖\n□ '+pick(['一年前的旅行/聚会照只挑有代表性的归档','孩子的照片按"成长节点"挑经典张归档','亲人旧照务必先原图备份到至少两个地方再整理'])+'\n□ 记住：整理目标是"删得安心"，不是"一个都不能落下"\n';
r+='\n──────── 第三步｜形成"随手可维护"的习惯 ────────\n';
r+=session.indexOf('碎片')>-1?'· 每天只处理1分钟：挑最容易的"截图区/昨天拍的"随手删几个即可\n':'· 每3-7天来一场"限定20分钟"整理局，只处理一类（今天只清截图/明天只清自拍）\n';
r+=(ocd.indexOf('不用')>-1?'· 给自己留白：不用逼自己全清完，1-2周一眼能看过来的水平就很健康。\n':'· 每周一次小回顾，别让"整理"成为新的压力源。\n');
r+='\n──────── 好用的现实补充建议 ────────\n';
r+='· iPhone用户可善用"最近删除"当第二道缓冲(清之前再多活30天)；\n· 云同步记得确认"已成功同步"再删本地，避免清完云端也空哦；\n· 怕误删最重要：养成每月把"必留"手动备份一套到本地硬盘/网盘的习惯，比事后抢救轻松一百倍。\n';
r+='\n一句话收尾：相册是回忆，不是仓库——留得住心动的，删得掉累赘的，这台手机才真正是你的。';
document.getElementById('outputBox').innerText=r;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 整理手册已复制！'))}
</script>
</body>
</html>
