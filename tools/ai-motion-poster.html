<script>
const CAM=['大远景固定机位延时推近','低机位仰拍缓慢环绕','由极近特写拉远成大远景，景别开合','手持轻微晃动的跟拍特写','上帝视角俯瞰慢慢旋转降落','沿滑轨横向移动过主体'];
const MOVEMENT={
'悬疑张力':['逆光剪影缓缓逼近镜头','阴影中只露出半张脸与一片霓虹光','雨滴落在镜头的微距特写','主体回眸，发丝被风与光定格'],
'治愈清新':['一缕晨光斜照在窗台与绿植','主角抬头望天的柔和逆光','花瓣随风轻旋贴着镜头漂过','海风拂过发梢的慢动作侧写'],
'燃动热血':['镜头快速由慢到快地冲刺加速','火花与尘埃在逆光中飞扬','仰角极致构图、主体压低重心蓄力','冲破画面的高速运动轨迹'],
'科幻未来':['全息数据在空间中流动环绕','飞船划过天际线的低空掠影','机械臂细节与轨道光在暗处延伸','巨大城市倒影悬浮于超现实水面'],
'国风古意':['水墨山峦之间一叶孤舟缓行','衣袂与灯笼的火光共舞','雨打芭蕉的屋檐特写','青烟缭绕中伊人款款而至'],
'都市温度':['地铁车窗倒影交叠的城市夜','转角路灯下两人相遇的一瞬','写字楼落地窗前的一杯热咖啡','夜色霓虹中单车压过积水']
};
const VIBE_DESC={
'悬疑张力':'低饱和冷调+高对比霓虹，颗粒噪点，J-cut硬切节奏',
'治愈清新':'高明度奶油色系，柔和自然光，呼吸感留白',
'燃动热血':'高饱和橙红对撞，强体积光影，节奏踩点收紧',
'科幻未来':'克莱因蓝紫未来色，全息光效，机械科技细节',
'国风古意':'绢本宣纸质感，朱砂与黛青点缀，气韵留白',
'都市温度':'胶片暖调，自然混合光源，生活化真实颗粒'
};
const TIME=['0-3s 开场建立氛围','3-6s 情绪推进','6-9s 转折与高潮反拍','9-12s 定格收尾出正文'];

if(!Paywall.countUse('AI分镜动态海报提示词 | AgentGongju.com'))return;
const idea=document.getElementById('idea').value.trim();
if(!idea){alert('请先输入画面主题构思');return;}
const use=document.getElementById('use').value;
const feel=document.getElementById('feel').value;
const note=document.getElementById('note').value.trim();
const cards=MOVEMENT[feel];
let r='【'+use+' · '+feel+'情绪】\n主题：'+idea+'\n\n';
// 生成3组镜头
const chosen=['极近','远景','中景'];// 用数量
let shots=[];
// 打乱卡片取3张做主体动作
const used=shuffle([...cards]).slice(0,3);
let i=0;
r+='——— 逐镜头生成 ———\n';
for(const cam of pickCameras(used.length)){
  const act=used[i%used.length];
  r+='\n■ '+TIME[i%TIME.length]+'\n';
  r+='[机位运镜] '+cam+'\n';
  r+='[画面内容] '+idea+'；'+act+'\n';
  r+='[色调氛围] '+VIBE_DESC[feel]+'\n';
  r+=note?('[补充] '+note+'\n'):'';
  r+='[AI绘图提示词] Cinematic still, '+act+' '+idea+', '+feel+' mood, '+VIBE_DESC[feel]+', '+cam.slice(0,cam.indexOf(' ')+6)+' shot, 4k, masterpiece --ar 16:9\n';
  i++;
}
function shuffle(ar){for(let x=ar.length-1;x>0;x--){const y=Math.floor(Math.random()*(x+1));[ar[x],ar[y]]=[ar[y],ar[x]];}return ar;}
function pickCameras(n){const c=shuffle([...CAM]).slice(0,3);return c;}
r+='\n——— 后期建议 ———\n';
r+='· 叠加轻微胶片颗粒与暗角增强电影感；\n· 首尾镜头衔接处做一帧色彩闪白衔接；\n· 正文/标题建议在第3镜高潮定格后弹出。';
document.getElementById('outputBox').innerText=r;
document.getElementById('resultArea').classList.add('active');
});
