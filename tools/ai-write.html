<select id="scene"><option>小红书种草文案</option><option>抖音短视频脚本</option><option>朋友圈推广文案</option><option>公众号文章</option><option>产品描述</option><option>SEO文章</option><option>标题创作</option><option>文案改写/润色</option></select>
</div>
<div class="card">
<label>✏️ 输入主题或要求</label>
<textarea id="contentInput" placeholder="请描述你想写的内容主题和要求...&#10;&#10;例如：写一篇关于失眠的公众号文章，目标受众是25-35岁的上班族，语气温暖治愈"></textarea>
</div>
<button class="btn-generate" id="generateBtn">✍️ 开始写作</button>

<div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 写作完成</div>

<script>
document.getElementById('generateBtn').addEventListener('click', async ()=>{
if(!Paywall.countUse('AI写作助手 - 免费在线AI文案生成 | AgentGongju.com'))return;
const scene=document.getElementById('scene').value;const content=document.getElementById('contentInput').value.trim();
if(!content){alert('请输入写作主题！');return}
const btn=document.getElementById('generateBtn');btn.disabled=true;btn.textContent='⏳ 写作中...';
try{
const res=await fetch('/api/ai-write',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({scene,content})});
const data=await res.json();
if(data.success&&data.text){document.getElementById('resultArea').classList.add('active');document.getElementById('resultContent').textContent=data.text;}
else alert('生成失败: '+(data.error||'请重试'));
}catch(err){alert('网络错误: '+err.message);}
finally{btn.disabled=false;btn.textContent='✍️ 开始写作';}
});
function copyResult(){const text=document.getElementById('resultContent').textContent;navigator.clipboard.writeText(text).then(()=>alert('✅ 已复制到剪贴板！'));}
</script>
