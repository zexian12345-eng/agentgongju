<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,input[type=text],input[type=number],textarea{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px;box-sizing:border-box}
textarea{min-height:110px;resize:vertical;line-height:1.7}
select:focus,input:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;margin-bottom:12px;font-size:.92rem}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tips{color:#64748b;font-size:.8rem;line-height:1.7;margin-top:6px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>

<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>💇 AI 理发沟通话术生成器</h1><p>把需求说清楚，避免剪完想哭</p></div>
<div class="card">
<div class="param-row">
<div><label>🧑 脸型</label>
<select id="face"><option value="round">圆脸</option><option value="oval" selected>鹅蛋脸 / 标准脸</option><option value="long">长脸</option><option value="square">方脸 / 国字脸</option><option value="heart">心形脸</option><option value="unknown">不太确定</option></select></div>
<div><label>💇 发质</label>
<select id="hair"><option value="thin">细软塌</option><option value="normal" selected>普通</option><option value="thick">粗硬多</option><option value="curly">自然卷 / 沙发</option><option value="damaged">受损毛躁</option></select></div>
</div>
<div class="param-row">
<div><label>🎯 想剪成</label>
<select id="want"><option value="short">短发（齐耳/超短）</option><option value="bob" selected>中短发（锁骨发/波波头）</option><option value="medium">中长发（及胸）</option><option value="long">长发只修型</option><option value="bangs">主要想剪刘海</option></select></div>
<div><label>😰 最怕什么</label>
<select id="fear"><option value="tooshort">剪太短</option><option value="noface">显脸大</option><option value="old">显老气</option><option value="flat">显头大/贴头皮</option><option value="price">被推销加项目</option></select></div>
</div>
<button class="btn-gen" id="genBtn">💬 生成沟通话术</button>
</div>
<div class="result-area" id="resultArea">
<div class="card"><div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制话术</button></div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
var FACE={
round:'圆脸：重点是"增加纵向线条、避免横向扩张"。适合八字刘海＋层次感中短发，避免齐下巴波波头（会把脸框成圆形）和厚重齐刘海。',
oval:'鹅蛋脸：几乎百搭，重点是保持发型的蓬松度和发尾的轻盈感，避免过于厚重的齐刘海遮住脸型优势。',
long:'长脸：重点是"增加两侧宽度、缩短视觉长度"。适合有弧度的刘海（法式/空气刘海）和两侧有蓬松度的中短发，避免中分长发贴脸。',
square:'方脸：重点是"柔化下颌角"。适合大卷、层次长发或斜刘海，避免齐耳短发和小卷（会强调棱角）。',
heart:'心形脸：重点是"平衡额头与下巴"。适合有重量感的发尾和偏分刘海，避免头顶过蓬、把额头显更宽。',
unknown:'不确定脸型：直接跟发型师说"帮我看看脸型，剪一个能修饰我脸型轮廓、好打理的发型"，让他先给建议再动手。'
};
var HAIR={
thin:'细软塌：最大痛点是"剪完就贴头皮"。要求：不要打太薄（越薄越塌），保留一点长度做空气感，建议提醒发型师做层次提蓬，并考虑烫根或蓬松喷雾。',
normal:'普通发质：多数发型都能驾驭，重点说清长度和厚薄需求即可。',
thick:'粗硬多：要点是"打薄＋减少发量感"。要求用打薄剪处理内部，别在外层打薄（会炸毛），长度不要太短否则显硬。',
curly:'自然卷/沙发：别硬剪短发！要求：留一定长度用重量压住卷度，或考虑做直处理；剪之前一定要湿剪后吹干确认效果。',
damaged:'受损毛躁：优先修剪分叉，别做大面积烫染。要求：只剪掉受损部分，保留健康长度，后续做护理修复。'
};
var WANT={
short:'短发：明确说"我要遮住耳朵/露出耳朵"、"后面要不要推"、"打薄到什么程度"，这三个问题不问清，剪出来差很多。',
bob:'中短发：明确锁骨位置还是下巴位置，发尾要"内扣还是外翻"，两侧长度要不要对称，齐不齐。',
medium:'中长发：主要是修层次和发尾形状，明确"要不要层次"、"发尾打薄还是保留厚度"。',
long:'长发：只修型的话，强调"只剪 2-3 厘米，主要修发尾和层次"，并当场确认剪下来的长度。',
bangs:'刘海：明确三件事——厚薄（空气/法式/厚齐）、长度（到眉毛/眼睛）、形状（弧形/直/斜）。'
};
var FEAR={
tooshort:'怕剪太短：动手前明确说"先剪一点，剪完我看一下再继续"，并用手比出你能接受的最短位置。绝对不要一次剪到位。',
noface:'怕显脸大：要求两侧保留"修饰发"（不要全部打薄），刘海做成"中间薄两边长"的八字形，能有效收窄视觉脸宽。',
old:'怕显老：避免烫小卷、烫发根过高、太短太蓬的造型。选择自然大卷或微卷，颜色选暖棕系更减龄。',
flat:'怕贴头皮：要求做层次提蓬＋发尾保留厚度，别全头打薄；可以加烫发根或学会自己吹蓬。',
price:'怕被推销：一坐下就说清预算和项目，明确说"今天只剪，不做烫染护理"，中途提价要立刻拒绝。'
};
function gen(){
var f=FACE[document.getElementById('face').value];
var h=HAIR[document.getElementById('hair').value];
var w=WANT[document.getElementById('want').value];
var fear=FEAR[document.getElementById('fear').value];
var out='════ 理发沟通话术 ════\n\n';
out+='──── 🗣 可以直接照着说 ────\n';
out+='"你好，我想剪一个'+({short:'短发',bob:'中短发',medium:'中长发',long:'只修型的长发',bangs:'带刘海'}[document.getElementById('want').value])+'。\n';
out+='我的发质是'+({thin:'细软容易塌',normal:'比较普通',thick:'偏粗硬发量多',curly:'自然卷有点沙发',damaged:'受损偏毛躁'}[document.getElementById('hair').value])+'，\n';
out+='我最在意的是不要' + ({tooshort:'剪太短',noface:'显脸大',old:'显老气',flat:'贴头皮',price:'被加项目'}[document.getElementById('fear').value]) + '。\n';
out+='麻烦你先帮我看一下脸型和发质，说说你的建议，我们再确定长度。"\n\n';
out+='──── 🧠 脸型建议 ────\n'+f+'\n';
out+='\n──── ✂️ 发质建议 ────\n'+h+'\n';
out+='\n──── 📏 长度与形状 ────\n'+w+'\n';
out+='\n──── 😰 你担心的问题 ────\n'+fear+'\n';
out+='\n──── ✅ 进店必问 5 句 ────\n';
out+='1. "剪完大概多长？能先比给我看吗？"（用手比位置）\n';
out+='2. "这个发型我这种发质能打理出来吗？"（避免剪完自己吹不出效果）\n';
out+='3. "今天总共多少钱？包含洗吹吗？"（先定价格，防加项）\n';
out+='4. "先剪一点我看下，可以再继续吗？"（分两次剪，最保险）\n';
out+='5. "这个长度我多久需要回来修一次？"（评估维护成本）\n';
out+='\n──── 🚫 避坑清单 ────\n';
out+='· 别只说"修剪一下"，这句话等于放弃所有主导权；\n';
out+='· 不要因为发型师说"你发质不适合"就随便改主意，先问为什么；\n';
out+='· 烫染前先问清药水品牌和价格，警惕"免费护理"套路；\n';
out+='· 带上喜欢的参考照片，比语言描述准 10 倍；\n';
out+='· 拒绝在你看不清后脑勺的情况下说"后面剪好了"；\n';
out+='· 剪完不满意当天就提，离店后再找基本没用。\n';
out+='\n──── 💡 拍照存证小技巧 ────\n';
out+='剪之前让朋友帮你从正面、侧面、背面各拍一张；剪完再拍一组对比，下次换发型师时直接拿照片沟通。\n';
return out;
}
</script>
<script>
document.getElementById('genBtn').addEventListener('click',function(){
if(!Paywall.countUse('AI 理发沟通话术生成器 | AgentGongju.com'))return;
document.getElementById('outputBox').innerText=gen();
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(function(){alert('✅ 已复制！')})}
</script>
