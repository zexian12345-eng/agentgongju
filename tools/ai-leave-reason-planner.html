<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 请假理由与年假规划助手 | AgentGongju.com</title>
<meta name="description" content="不知道请什么假、理由怎么写？输入请假场景和天数，自动判断该请哪类假（年假/事假/病假/调休），生成规范请假话术和剩余年假规划建议。">
<meta name="keywords" content="请假理由,请假话术,年假规划,事假病假,带薪年假,调休,请假条">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,input[type=text],input[type=number],textarea{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px;box-sizing:border-box}
select:focus,input:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;margin-bottom:12px;font-size:.92rem}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chk{display:flex;align-items:center;gap:8px;color:#e2e8f0;font-size:.9rem;margin-bottom:10px}
.chk input{width:auto;margin:0}
.tips{color:#64748b;font-size:.8rem;line-height:1.7;margin-top:6px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>
var _hmt = _hmt || [];
(function() { var hm = document.createElement("script"); hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949"; var s = document.getElementsByTagName("script")[0]; s.parentNode.insertBefore(hm, s); })();

<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>📅 AI 请假理由与年假规划助手</h1><p>该请哪种假、理由怎么说、年假怎么排，一次搞定</p></div>
<div class="card">
<div class="param-row">
<div><label>🎯 请假场景</label>
<select id="scene">
<option value="rest" selected>想休息几天，调整状态</option>
<option value="travel">错峰出游 / 拼假旅行</option>
<option value="family">家里有事 / 陪家人</option>
<option value="wedding">结婚 / 参加婚礼</option>
<option value="sick">身体不适，需要就医</option>
<option value="move">搬家 / 处理个人事务</option>
<option value="pet">照顾宠物 / 宠物看病</option>
</select></div>
<div><label>📆 计划请假天数</label><input type="number" id="days" value="3" min="0.5" step="0.5"></div>
</div>
<div class="param-row">
<div><label>🧮 你的年假情况</label>
<select id="annual">
<option value="full" selected>本年度年假还没怎么用</option>
<option value="half">用掉一半左右</option>
<option value="none">年假已用完</option>
<option value="unknown">不清楚自己有多少天</option>
</select></div>
<div><label>🏢 公司氛围</label>
<select id="culture">
<option value="normal" selected>一般，正常走流程即可</option>
<option value="strict">比较严格，理由要说得过去</option>
<option value="loose">很宽松，跟主管说一声就行</option>
</select></div>
</div>
<div><label>🧩 你的额外情况（可多选）</label>
<div class="chk"><input type="checkbox" id="x1" checked><span>手头工作可以提前交接</span></div>
<div class="chk"><input type="checkbox" id="x2"><span>请假期间有同事能顶班</span></div>
<div class="chk"><input type="checkbox" id="x3"><span>想连休周末拼长假</span></div>
<div class="chk"><input type="checkbox" id="x4"><span>想请半天 / 弹性上下班</span></div>
</div>
<div class="tips">💡 职工累计工作满 1 年不满 10 年享 5 天年假，满 10 年不满 20 年享 10 天，满 20 年享 15 天，年假是法定权利。</div>
<button class="btn-gen" id="genBtn">🔍 生成请假方案</button>
</div>
<div class="result-area" id="resultArea">
<div class="card"><div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制结果</button></div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyResult(){
var t=document.getElementById('outputBox').innerText;
navigator.clipboard.writeText(t).then(function(){alert('已复制到剪贴板');},function(){alert('复制失败，请手动选择');});
}
var sceneName={rest:'休息调整',travel:'错峰出游',family:'家庭事务',wedding:'婚假事宜',sick:'身体不适',move:'搬家/个人事务',pet:'照顾宠物'};
function gen(){
var scene=document.getElementById('scene').value;
var days=parseFloat(document.getElementById('days').value)||1;
var annual=document.getElementById('annual').value;
var culture=document.getElementById('culture').value;
var x1=document.getElementById('x1').checked,x2=document.getElementById('x2').checked,x3=document.getElementById('x3').checked,x4=document.getElementById('x4').checked;

var out='════ 请假方案与话术 ════\n\n';
out+='场景：'+sceneName[scene]+'　计划请假：'+days+' 天\n\n';

out+='【一、该请哪种假】\n';
if(scene==='sick'){
out+='✅ 首选：病假（带薪或按比例计薪，需提供就医凭证）\n';
out+='· 提供医院挂号单/病历/病假条更规范\n· 短期不适也可先用年假顶上，避免记录\n';
}else if(scene==='wedding'){
out+='✅ 首选：婚假（多数地区 3 天起步，部分省份 10~30 天）\n';
out+='· 需提供结婚证，法定婚假期间工资照发\n· 具体天数看所在省市规定\n';
}else if(annual==='full'||annual==='half'){
out+='✅ 首选：年假（带薪，无需理由，是法定权利）\n';
out+='· 年假是你应得的，理由可以最简单\n· 若天数超过年假余额，超出部分用事假\n';
}else if(annual==='none'){
out+='⚠️ 年假已用完，可选：\n';
out+='· 调休（如果之前加过班、有调休余额）\n· 事假（无薪，但最灵活，一般都能批）\n';
out+='· 病假（如确实身体不适，需凭证）\n';
}else{
out+='💡 你还不清楚年假天数，先算一下：\n';
out+='· 工作满 1 年不满 10 年：5 天/年\n· 满 10 年不满 20 年：10 天/年\n· 满 20 年以上：15 天/年\n';
out+='先确认余额，优先用年假（带薪），再考虑事假。\n';
}

out+='\n【二、请假理由这么说】\n';
if(scene==='rest'){
out+='最稳妥的版本：\n"主管您好，我想申请 X 月 X 日至 X 月 X 日休年假'+days+'天，\n近期项目密集，想利用这几天调整状态，回来后状态更好。\n手头工作我会提前整理交接清单，有急事随时电话联系我。"\n';
}else if(scene==='travel'){
out+='可以直说的版本（提前规划更显专业）：\n"主管您好，我计划 X 月 X 日至 X 月 X 日休年假'+days+'天，\n行程早已订好。工作方面我会在出发前完成 XX 事项，\n并与 XX 同事做好交接，紧急情况可电话联系。"\n';
}else if(scene==='family'){
out+='体现责任感且真实：\n"主管您好，家里有些事情需要我回去处理，\n想申请 X 月 X 日至 X 月 X 日请假'+days+'天。\n手头 XX 工作我会提前完成或交给 XX 同事跟进。"\n';
}else if(scene==='wedding'){
out+='规范正式：\n"主管您好，我计划于 X 月 X 日举办婚礼，\n申请婚假'+days+'天（X 月 X 日至 X 月 X 日），\n结婚证稍后提供人事备案，工作已做好交接。"\n';
}else if(scene==='sick'){
out+='简洁合规：\n"主管您好，我身体有些不适，需要就医休息，\n申请病假'+days+'天（X 月 X 日至 X 月 X 日），\n就医凭证我会及时提交，工作已交代给 XX。"\n';
}else if(scene==='move'){
out+='轻松易批：\n"主管您好，我近期需要处理搬家/个人事务，\n想申请'+days+'天年假（X 月 X 日至 X 月 X 日），\n已安排好工作交接，不会有影响。"\n';
}else{
out+='体贴且真实：\n"主管您好，家里宠物生病需要照顾，\n想申请'+days+'天年假（X 月 X 日至 X 月 X 日），\n工作我会提前处理好，谢谢理解。"\n';
}
if(culture==='strict'){
out+='⚠️ 公司氛围较严，建议：\n· 提前 3~5 天申请，别临时通知\n· 一定要附上交接方案，这是最容易获批的关键\n· 理由尽量正式、可验证\n';
}else if(culture==='loose'){
out+='✅ 氛围宽松：微信一句"主管我想请 X 天假，工作已安排"，\n然后同步在系统里提交流程即可。\n';
}else{
out+='💡 建议提前 2~3 天申请，走 OA 流程并口头同步主管。\n';
}

out+='\n【三、加分动作（大幅提高通过率）】\n';
if(x1){out+='✅ 提前做交接清单：把待办、进度、对接人写成一页纸发在群里\n';}
if(x2){out+='✅ 明确顶班同事：主动问"XX 同事已答应帮忙看 XX 事项"\n';}
out+='✅ 避开业务高峰：尽量不选项目上线、月末结算、季度末\n';
out+='✅ 设置自动回复：邮箱/企微设置"请假期间，急事请联系 XX"\n';
out+='✅ 体现可联系：说明"重要事情随时电话我"，反而更容易批\n';

out+='\n【四、拼假技巧】\n';
if(x3){
out+='🔥 你想连休周末，推荐打法：\n';
out+='· 请周三到周五 + 周末 = 连休 5 天，只用 3 天年假\n';
out+='· 请周一、周二 + 周末 = 4 天，只用 2 天年假\n';
out+='· 遇法定节假日：节前节后各请 2 天，可拼出 9~10 天长假\n';
out+='· 最优原则：让"请假天数"尽量夹在周末和节假日中间\n';
}else{
out+='· 把年假安排在周中，用最少的假换最长的休息\n';
}
if(x4){
out+='· 半天假也很香：周五下午请假，等于多出一个小长假\n';
out+='· 弹性上下班：申请"早上晚到 1 小时"往往比请整天更容易批\n';
}

out+='\n【五、年假使用规划建议】\n';
out+='· 年假原则上当年有效，部分单位可协商延至次年一季度，别拖到年底作废\n';
out+='· 未休年假离职时应折算为工资补偿（200% 日工资）\n';
out+='· 建议上半年用掉 1/3，留足下半年应急和年底拼假\n';
out+='· 记住：年假是法定权利，不需要"求"人，正常申请即可\n';

out+='\n【六、请假条模板（可直接复制）】\n';
out+='请假条\n';
out+='姓名：XXX　　部门：XXX　　岗位：XXX\n';
out+='请假类型：'+(annual==='none'?'事假':'年假')+'\n';
out+='请假时间：X 月 X 日 至 X 月 X 日，共 '+days+' 天\n';
out+='请假事由：'+sceneName[scene]+'\n';
out+='工作交接：XX 事项 → XX 同事；XX 事项 → XX 同事（已附交接清单）\n';
out+='联系方式：手机 XXX（保持畅通）\n';
out+='申请人：XXX　　日期：X 月 X 日\n';

out+='\n⚠️ 以上话术可根据你和主管的沟通习惯调整，真诚+交接到位，基本都能批。';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
document.getElementById('resultArea').scrollIntoView({behavior:'smooth'});
}
document.getElementById('genBtn').addEventListener('click',gen);
</script>
</body>
</html>
