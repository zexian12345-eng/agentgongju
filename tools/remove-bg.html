<body><div style="background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;text-align:center;padding:12px 20px;font-size:0.9rem;position:relative;z-index:99">

<div class="tool-container">
<div class="tool-header"><h1>✂️ AI 在线抠图</h1><p>一键去除图片背景，免费、快速、精准</p></div>
<div class="card">
<div class="upload-area" id="uploadArea">
<div class="upload-icon">🖼️</div>
<div style="color:#94a3b8">点击上传图片或拖拽到此区域</div>
<div style="color:#64748b;font-size:0.8rem;margin-top:6px">支持 JPG / PNG，建议 500KB 以上</div>
<input type="file" id="fileInput" accept="image/jpeg,image/png" style="display:none">
</div>
<div class="compare-grid" id="compareGrid">
<div class="compare-item"><img id="originalImg"><div class="label">原始图片</div></div>
<div class="compare-item"><img id="resultImg"><div class="label">抠图结果</div></div>
</div>
<button class="btn-generate" id="generateBtn">✂️ 一键去除背景</button>
<div id="downloadArea" style="text-align:center;display:none;margin-top:12px">
<a class="btn-download" id="downloadBtn" download="removebg.png">⬇️ 下载透明背景图片</a></div></div></div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const uploadArea=document.getElementById('uploadArea');const fileInput=document.getElementById('fileInput');
uploadArea.addEventListener('click',()=>fileInput.click());
uploadArea.addEventListener('dragover',e=>{e.preventDefault();uploadArea.style.borderColor='#6366f1'});
uploadArea.addEventListener('drop',e=>{e.preventDefault();handleFile(e.dataTransfer.files[0])});
fileInput.addEventListener('change',e=>{if(e.target.files[0])handleFile(e.target.files[0])});
let currentFile=null;
function handleFile(file){if(!file.type.match('image.*')){alert('请上传图片');return}
currentFile=file;const reader=new FileReader();reader.onload=e=>{document.getElementById('originalImg').src=e.target.result;document.getElementById('compareGrid').classList.add('active')};reader.readAsDataURL(file)}
document.getElementById('generateBtn').addEventListener('click',async()=>{
if(!currentFile){alert('请先上传图片！');return}
const btn=document.getElementById('generateBtn');btn.disabled=true;btn.textContent='⏳ 处理中...';
try{
const formData=new FormData();formData.append('image',currentFile);
const res=await fetch('/api/remove-bg',{method:'POST',body:formData});
const data=await res.json();
if(data.success&&data.result_url){document.getElementById('resultImg').src=data.result_url;document.getElementById('downloadBtn').href=data.result_url;document.getElementById('downloadArea').style.display='block';}
else alert('处理失败: '+(data.error||'请重试'));
}catch(err){alert('网络错误: '+err.message);}
finally{btn.disabled=false;btn.textContent='✂️ 一键去除背景';}});
</script>
</body>
