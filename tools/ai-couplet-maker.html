<script>
function copyResult(){navigator.clipboard.writeText(document.getElementById('out').innerText).then(()=>alert('✅ 已复制！'))}
// 词库：按场合和字数组织
var LIB={
 '春节':{5:[['春回大地','福满人间'],['一元复始','万象更新'],['年年如意','岁岁平安'],['花开富贵','竹报平安'],['天增岁月','春满乾坤']],
        7:[['天增岁月人增寿','春满乾坤福满门'],['爆竹声中一岁除','春风送暖入屠苏'],['一年好景随春到','四季财源滚滚来'],['喜气盈门迎百福','祥光满院纳千祥'],['红梅点点报春讯','绿柳丝丝织锦图']],
        9:[['辞旧岁前程似锦','迎新春万事如意'],['好日子年年红火','新生活岁岁平安'],['春风送暖千门喜','政策归心万户春']],
        hp:['新春大吉','福满人间','万象更新','迎春接福','五福临门']},
 '开业':{5:[['生意兴隆','财源广进'],['客似云来','货如轮转'],['门迎百福','户纳千祥']],
        7:[['生意兴隆通四海','财源茂盛达三江'],['门迎晓日财源广','户纳春风吉庆多'],['今日开张迎贵客','明朝致富纳千祥'],['货好赢得三江客','店雅招来四海宾']],
        9:[['一帆风顺年年好','万事如意步步高'],['开门迎客客常满','进店如家家更兴']],
        hp:['开业大吉','财源广进','生意兴隆','开业大酬宾']},
 '结婚':{5:[['百年好合','五世其昌'],['同心永结','恩爱长存']],
        7:[['百年好合情似海','永结同心爱如山'],['喜今日银河初渡','愿明年玉树生枝'],['红妆带绾同心结','绿叶交陈合蒂花'],['花好月圆人长久','情投意合爱永存']],
        9:[['同心同德结连理','相亲相爱到白头'],['良辰美景配佳偶','花好月圆结同心']],
        hp:['百年好合','永结同心','新婚大喜','鸾凤和鸣']},
 '乔迁':{5:[['门迎百福','户纳千祥'],['新居落成','福地人杰']],
        7:[['迁入新居迎百福','住进华厦纳千祥'],['新居落成千般好','吉日迁居万事兴'],['燕喜新居春正暖','莺迁乔木日初长']],
        9:[['择吉日迁居宝地','逢良辰入主新宅'],['新居新邻新风尚','好山好水好人家']],
        hp:['乔迁之喜','新居大吉','紫气东来']},
 '寿宴':{5:[['福如东海','寿比南山'],['岁岁平安','年年有今日']],
        7:[['福如东海长流水','寿比南山不老松'],['天增岁月人增寿','寿满乾坤福满门'],['酒盈玉盏人增寿','花满琼枝岁有余']],
        9:[['花甲初度庆有余','古稀双庆祝无疆'],['喜逢盛世增福寿','乐享天伦庆有余']],
        hp:['寿比南山','福寿双全','松鹤长春']},
 '升学':{5:[['书山有路','学海无涯'],['勤能补拙','学可医愚']],
        7:[['书山有路勤为径','学海无涯苦作舟'],['宝剑锋从磨砺出','梅花香自苦寒来'],['十年寒窗终有报','一举成名天下知']],
        9:[['黑发不知勤学早','白首方悔读书迟'],['少年辛苦终身事','莫向光阴惰寸功']],
        hp:['金榜题名','学业有成','捷报频传']},
 '书房':{5:[['读万卷书','行万里路'],['静以修身','俭以养德']],
        7:[['腹有诗书气自华','胸藏文墨怀若谷'],['几番琢磨方成器','十载耕耘自见功'],['窗竹影摇书案上','野泉声入砚池中']],
        9:[['立志欲坚不欲锐','成功在久不在速'],['板凳要坐十年冷','文章不写一句空']],
        hp:['天道酬勤','厚积薄发','宁静致远']}
};
function gen(){
 if(!Paywall.countUse('AI 对联生成器 | AgentGongju.com'))return;
 var scene=document.getElementById('scene').value,len=document.getElementById('len').value,style=document.getElementById('style').value,num=parseInt(document.getElementById('num').value,10);
 var kw=(document.getElementById('kw').value||'').split(/[,，、\s]+/).filter(function(s){return s});
 var lib=LIB[scene],pairs=lib[len]||lib[7];
 var hps=lib.hp;
 var out=document.getElementById('out');out.innerHTML='';
 out.innerHTML='<div style="color:#94a3b8;font-size:.85rem;margin-bottom:16px">🎊 '+scene+' ｜ ✒️ '+len+'言 ｜ 🎨 '+style+' ｜ 🔢 '+num+' 副'+(kw.length?' ｜ 🎯 关键词：'+kw.join('、'):'')+'</div>';
 for(var i=0;i<Math.min(num,pairs.length);i++){
   var p=pairs[i];
   var up=p[0],down=p[1],hp=hps[i%hps.length];
   // 关键词嵌入：若提供关键词，尝试替换对应用字（演示性处理）
   if(kw.length){
     kw.forEach(function(k){
       if(k.length===1){
         if(scene==='春节'&&up.indexOf('春')>-1&&k!=='春'){up=up.replace('春',k);down=down.replace('春',k);}
       }
     });
   }
   var el=document.createElement('div');el.className='couplet';
   el.innerHTML='<div class="hengpi">'+hp+'</div>'+
     '<div class="line">'+up+'</div><div class="line right">'+down+'</div>'+
     '<div class="meta">上联：'+up+' ｜ 下联：'+down+' ｜ 横批：'+hp+'</div>';
   out.appendChild(el);
 }
 var lastUp=pairs[Math.min(num,pairs.length)-1][0];
 out.insertAdjacentHTML('beforeend','<div class="couplet" style="border-color:rgba(99,102,241,.4);background:rgba(99,102,241,.08)"><div class="line right" style="font-size:.95rem;letter-spacing:2px">📐 平仄与对仗检查</div><div class="meta" style="letter-spacing:0;line-height:1.9;font-size:.85rem">上联末字「'+lastUp.slice(-1)+'」参考仄声（三四声），下联末字「'+pairs[pairs.length-1][1].slice(-1)+'」参考平声（一二声），符合「仄起平收」。<br>贴法：面对门，上联贴右边，下联贴左边，横批贴门上方居中。<br>字数一致、词性相对即为合格对联，无需强求古人原句。</div></div>');
 document.getElementById('resultArea').classList.add('active');
}
document.getElementById('genBtn').addEventListener('click',gen);
</script>
