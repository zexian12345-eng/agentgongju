<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>周会发言稿生成 | AgentGongju.com</title>
<meta name="description" content="周会/晨会发言稿生成器，输入本周工作和下周计划，一键生成得体发言稿">
<meta name="keywords" content="周会发言,会议发言稿,周报发言,工作总结,晨会">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.8;white-space:pre-wrap;min-height:60px;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>
var _hmt = _hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";
  var s = document.getElementsByTagName("script")[0];
  s.parentNode.insertBefore(hm, s);
})();
</script>
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🗣️ 周会发言稿生成</h1><p>输入本周工作与下周计划，一键生成得体发言稿</p></div>

<div class="card"><div class="param-row">
<div><label>会议类型</label><select id="mt"><option>周会</option><option>晨会</option><option>项目例会</option></select></div>
<div><label>发言风格</label><select id="style"><option>简洁干练</option><option>详实细致</option><option>积极进取</option></select></div></div>
<div><label>本周完成的工作（选填）</label>
<textarea id="done" placeholder="例如：完成了首页改版上线，解决了3个bug，推进了活动物料"></textarea>
<div><label>下周计划 / 需要协调（选填）</label>
<textarea id="plan" placeholder="例如：准备上线新功能，申请设计支持"></textarea>
<button class="btn-gen" id="genBtn">📝 生成发言稿</button></div>
<div class="result-area" id="resultArea"><div class="card"><div style="color:#22c55e;font-weight:600;margin-bottom:12px">📣 你的发言稿</div><div class="result-box" id="out"></div><button class="copy-btn" onclick="copyResult()">📋 复制</button></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyResult(){navigator.clipboard.writeText(document.getElementById('out').textContent).then(()=>alert('✅ 已复制！'))}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('周会发言稿生成 | AgentGongju.com'))return;
const mt=document.getElementById('mt').value;const style=document.getElementById('style').value;const done=document.getElementById('done').value.trim();const plan=document.getElementById('plan').value.trim();
const open={'简洁干练':'大家早上好，我简单汇报一下。','详实细致':'各位好，下面我详细汇报本周进展。','积极进取':'大家好，本周整体推进顺利，我来做个汇报。'};
const clos = {'简洁干练':'以上是我的汇报，谢谢大家。','详实细致':'以上就是详细情况，有问题欢迎会后交流。','积极进取':'我们会继续加油，争取下周有更大突破，谢谢。'};
let out='【'+mt+'发言稿 · '+style+'】\n\n';
out+=open[style]+'\n\n';
out+='一、本周工作总结\n';
if(done){const items=done.split(/[;\n。]/).map(s=>s.trim()).filter(Boolean);out+=renderList(items);}else{out+='· 本周按计划完成了既定工作任务，进展顺利。\n';}
out+='\n二、下周计划与安排\n';
if(plan){const items=plan.split(/[;\n。]/).map(s=>s.trim()).filter(Boolean);out+=renderList(items);}else{out+='· 下周将继续推进在办事项，确保按节点交付。\n';}
out+='\n三、需要协调支持\n· 如有需要，希望相关部门给予配合，谢谢。\n\n'+clos[style];
function renderList(arr){return arr.slice(0,6).map(x=>'· '+x.replace(/^[•·\-\d.、]+/,'')+'\n').join('');}
document.getElementById('resultArea').classList.add('active');
document.getElementById('out').textContent=out;
});
</script>
</body>
</html>
