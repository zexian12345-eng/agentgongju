<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宠物起名生成器 | AgentGongju.com</title>
<meta name="description" content="宠物起名生成器，为猫咪、狗狗、仓鼠等萌宠一键生成好记又有趣的名字，支持多种风格寓意">
<meta name="keywords" content="宠物起名,猫咪名字,狗狗名字,宠物名,萌宠,取名">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.8;white-space:pre-wrap;margin-bottom:12px;font-size:.92rem}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.tip{color:#94a3b8;font-size:.8rem;line-height:1.8;margin-top:6px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🐾 宠物起名生成器</h1><p>给毛孩子取个好记又贴切的名字</p></div>

<div class="card">
<div class="param-row">
<div><label>🐱 宠物类型</label>
<select id="pet">
<option value="猫">🐱 猫咪</option>
<option value="狗">🐶 狗狗</option>
<option value="仓鼠">🐹 仓鼠/龙猫</option>
<option value="兔子">🐰 兔子</option>
<option value="鸟">🐦 鸟类</option>
</select></div>
<div><label>🚻 宠物性别</label>
<select id="gender">
<option value="未知">未知</option>
<option value="公">公</option>
<option value="母">母</option>
</select></div>
</div>
<div class="param-row">
<div><label>🎨 名字风格</label>
<select id="style">
<option value="可爱">🍬 可爱卖萌</option>
<option value="文艺">📖 文艺气质</option>
<option value="吃货">🍜 吃货有趣</option>
<option value="霸气">🦁 霸气威风</option>
<option value="可爱谐音">😄 谐音梗</option>
</select></div>
<div><label>🔢 名字数量</label>
<select id="count">
<option value="10">10 个</option>
<option value="20">20 个</option>
<option value="30">30 个</option>
</select></div>
</div>
<label>💡 提示关键词（可选）</label>
<input type="text" id="keyword" placeholder="例如：白色、粘人、黑色、活泼、圆滚滚">
<button class="btn-gen" id="genBtn">✨ 生成名字</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">📛 为它挑一个吧</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制全部名字</button>
<div class="tip">💡 提示：名字建议用叠字或双音节，宠物更好识别、更易叫唤。</div>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const POOL={
'可爱':['汤圆','团子','布丁','奶昔','糯米','芝士','豆包','年糕','薯条','泡芙','果冻','麻薯'],
'文艺':['青黛','南风','拾光','知微','云舒','晚棠','初见','白露','星野','安然','清欢','闲云'],
'吃货':['奶茶','布丁','芋圆','煎饼','肉夹','寿司','火锅','饺子','蛋挞','烤串','汉堡','糖心'],
'霸气':['将军','大圣','虎王','雷神','旋风','司令','霸主','金角','烈火','山大王','铁头','威猛'],
'可爱谐音':['不发财','来福','旺财','小确幸','财神','锦鲤','发发','吉祥','如意','招财','富贵','圆梦']};
const PETTAIL={
'猫':['喵','咪','精','团子'],'狗':['旺','宝','子','仔'],
'仓鼠':['糍','团','球','圆'],'兔子':['哒','绒','宝','雪'],
'鸟':['啾','羽','儿','雀']};
function pick(a){return [...a][Math.floor(Math.random()*a.length)];}
function shuffle(a){let r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('宠物起名生成器 | AgentGongju.com'))return;
const pet=document.getElementById('pet').value;
const gender=document.getElementById('gender').value;
const style=document.getElementById('style').value;
const count=parseInt(document.getElementById('count').value);
const kw=document.getElementById('keyword').value.trim();
const tail=PETTAIL[pet];
const base=shuffle(POOL[style]);
let names=[];
const lim=Math.max(count*3,base.length*3);
for(let i=0;i<lim&&names.length<count;i++){
let n=pick(base);
if(Math.random()<0.45&&tail.length){n=n+pick(tail);}
else if(Math.random()<0.3){n=pick(base)+pick(base);}
if(names.indexOf(n)===-1)names.push(n);
}
while(names.length<count){let n=pick(base)+pick(tail);if(names.indexOf(n)===-1)names.push(n);}
names=names.slice(0,count);
const gendBlock=gender==='公'?'（可参考：适合男孩子的名字）':(gender==='母'?'（可参考：适合女孩子的名字）':'');
let out=`为你${gender==='公'?'他':(gender==='母'?'她':'的宠物')}挑的名字 · ${style}风格 ${gendBlock}\n\n`;
names.forEach((n,i)=>{out+=String(i+1).padStart(2,'0')+' · '+n+(kw?'（适合'+kw+'的气质）':'')+'\n';});
out+='\n💡 小贴士：'+((kw?'结合「'+kw+'」特征精心挑选，':'')+'取名宜朗朗上口，叫起来顺口最重要。');
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 宠物名字已复制！'))}
</script>
</body>
</html>
