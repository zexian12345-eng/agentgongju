const themeTail={
'祝福励志':['愿向青云步步高，前程万里自逍遥。','长风破浪会有时，直挂云帆济沧海。','人生何处不春风，得意还须趁早行。'],

'事业前程':['鸿鹄之志在青云，骏马奔腾万里春。','事业如虹步步升，宏图大展任君行。','乘势而上展宏才，锦绣前程指日开。'],
'离别思念':['此后山高水又长，愿君珍重莫相忘。','临别依依话不尽，惟盼他乡早重逢。','离别不是长久事，来日方长再举杯。'],
'友谊长存':['桂花煮酒话当年，友谊长馨岁岁延。','高山流水知音在，海内存君不孤单。','携手同行万里路，情谊绵绵永不休。']
};
function getWord(ch,pos){
  const pool=dict[ch];
  if(!pool)return null;
  const line=pool[Math.floor(Math.random()*pool.length)];
  return line;
}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI藏头诗生成器 | AgentGongju.com'))return;
const head=document.getElementById('head').value.trim();
if(!head){alert('请先输入藏头文字');return;}
const unit=parseInt(document.getElementById('style').value);
const theme=document.getElementById('theme').value;
const chars=head.split('');
const tail=themeTail[theme][Math.floor(Math.random()*themeTail[theme].length)];
let poem='`藏头诗 · '+head+'`\n\n';
for(let i=0;i<chars.length;i++){
  const c=chars[i];
  let firstClause=dict[c]?dict[c][Math.floor(Math.random()*dict[c].length)]:null;
  if(!firstClause){
    firstClause=c+'（此字暂缺词库，可稍后人工润色）';
  }
  // 第二句按行数生成
  const secondClause=buildSecond(i,chars.length,theme);
  if(unit===7){
    poem+=firstClause+'，'+secondClause+'\n';
  }else{
    poem+=firstClause.split('，')[0]&&false?'':'';
    // 五言：截取前半句，并进行补全
    const fiveFirst=firstClause.length>5?firstClause.slice(0,5):firstClause.padEnd(5,'　');
    const fiveSecond=secondClause.length>5?secondClause.slice(0,5):secondClause.padEnd(5,'　');
    poem+=fiveFirst+'，'+fiveSecond+'\n';
  }
}
poem+='\n'+tail;
document.getElementById('outputBox').innerText=poem;
document.getElementById('resultArea').classList.add('active');
});
function buildSecond(i,total,theme){
  const t=themeTail[theme];
  const base=t[i%t.length]||'愿将心意寄云端，祝福常伴君左右。';
  // 简单拆分,取后半句作为第二句
  const parts=base.split('，');
  return parts[1]||parts[0]||'祝福常伴君左右。';
}
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 诗句已复制！'))}
