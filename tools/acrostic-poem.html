<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI藏头诗生成器 | AgentGongju.com</title>
<meta name="description" content="AI藏头诗生成器，输入名字或词语，自动生成押韵的七言藏头诗">
<meta name="keywords" content="藏头诗,诗词生成,藏头诗生成,藏尾诗,姓名诗">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px;color-scheme:dark}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2.2;white-space:pre-wrap;min-height:60px;margin-bottom:12px;font-size:1.05rem;text-align:center}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>✒️ AI藏头诗生成器</h1><p>输入名字或任意词语，为你生成唯美的七言藏头诗</p></div>
<div class="card"><label>📝 藏头内容（姓名/祝福语/任意词）</label>
<input type="text" id="words" placeholder="例如：李小白 / 生日快乐 / 事业有成">
<div class="param-row">
<div><label>诗歌风格</label><select id="style">
<option value="豪迈壮阔">豪迈壮阔</option>
<option value="婉约唯美">婉约唯美</option>
<option value="励志昂扬">励志昂扬</option>
<option value="田园闲适">田园闲适</option>
<option value="古风典雅">古风典雅</option>
<option value="深情浪漫">深情浪漫</option>
</select></div>
<div><label>诗体形式</label><select id="form"><option value="七言绝句">七言绝句</option><option value="四字短句">四字短句</option></select></div>
</div>
<button class="btn-gen" id="genBtn">📜 生成藏头诗</button></div>
<div class="result-area" id="resultArea"><div class="card"><div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 诗词已生成</div>
<div class="result-box" id="out"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制诗句</button></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyResult(){navigator.clipboard.writeText(document.getElementById('out').textContent).then(()=>alert('✅ 已复制！'))}
const LH=['长','江','山','风','月','云','花','雨','星','天','春','秋','龙','鹏','鹤','舟'];
const CONT={
'豪迈壮阔':['凌云壮志冲霄汉','挥斥方遒气如虹','仗剑天涯心向远','俯仰天地自从容'],
'婉约唯美':['轻舟已过万重山','烟雨朦胧忆江南','红袖添香心自暖','月下花前共清欢'],
'励志昂扬':['奋发图强志更高','鲲鹏展翅上九霄','披荆斩棘无所惧','直挂云帆步云霄'],
'田园闲适':['采菊东篱沐晚风','闲看云卷与云舒','一壶清酒伴明月','淡泊悠然乐自如'],
'古风典雅':['玉砌雕栏金作台','诗书满腹气自华','清风徐来水波兴','翰墨飘香在君家'],
'深情浪漫':['心若琉璃映月明','此情可待共此生','星沉海底当窗见','为你写下永恒名']};
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI藏头诗生成器 | AgentGongju.com'))return;
let words=document.getElementById('words').value.trim();
if(!words){alert('请输入藏头内容');return}
if(words.length>8)words=words.substring(0,8);
const st=document.getElementById('style').value;
const form=document.getElementById('form').value;
const base=CONT[st];
const chars=words.split('');
let title=words+'·藏头诗';
let lines=chars.map((c,i)=>{
const bank=base[i%base.length].match(/[\u4e00-\u9fa5]/g)||[];
const mid=bank.slice(1,bank.length-1);
let line=c+mid.join('');
if(line.length<7){while(line.length<7)line+=LH[Math.floor(Math.random()*LH.length)];}
return line;
});
while(lines.length<4){
lines.push(('').slice(0,0)+base[Math.floor(Math.random()*base.length)]+LH[Math.floor(Math.random()*LH.length)]);
}
const last=lines[lines.length-1];
const lastChar=last.charAt(last.length-1);
let out='《'+title+'》\n\n';
if(form==='七言绝句'){
lines.forEach((l,i)=>{out+=l+(i<lines.length-1?'\n':'');});
}else{
out=lines.join('　');
}
out+='\n\n—— 七言'+(form==='七言绝句'?'绝句':'短句')+'·'+st+'风';
document.getElementById('resultArea').classList.add('active');
document.getElementById('out').textContent=out;
});
</script>
</body>
</html>
