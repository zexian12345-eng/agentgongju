<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 婚礼策划清单 | AgentGongju.com</title>
<meta name="description" content="根据婚期与预算，快速生成婚礼筹备全流程清单，含时间线、预算分配与注意事项，帮你稳稳落地每一场婚礼">
<meta name="keywords" content="婚礼策划,婚礼清单,筹备婚礼,结婚,婚礼流程,备婚">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.9;white-space:pre-wrap;font-size:.92rem;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>
var _hmt = _hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";
  var s = document.getElementsByTagName("script")[0];
  s.parentNode.insertBefore(hm, s);
})();
</script>
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>💍 AI 婚礼策划清单</h1><p>备婚不再手忙脚乱，一表掌握所有细节</p></div>

<div class="card">
<label>💍 婚期（格式：2026-10-01 或 年份）</label>
<input type="text" id="date" placeholder="例如：2026-10-01">
<div class="param-row">
<div><label>💰 婚礼预算</label>
<select id="budget"><option value="5万以内">¥ 5万以内（简约温馨）</option><option value="10万左右" selected>¥ 10万左右（中档舒适）</option><option value="20万以上">¥ 20万以上（隆重气派）</option></select></div>
<div><label>👫 计划桌数</label>
<select id="tables"><option value="10桌以下">10桌以内</option><option value="15-20桌" selected>15-20桌</option><option value="25桌以上">25桌以上</option></select></div>
</div>
<label>📝 特别要求（选填）</label>
<textarea id="special" placeholder="如：草坪婚礼 / 中式汉婚 / 一定要有长辈上台……"></textarea>
<button class="btn-gen" id="genBtn">✨ 生成筹备清单</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">📋 你的婚礼筹备清单</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制清单</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const phases=[
['提前 6-12 个月','确定婚期、预算与大致桌数；挑选婚宴场地；订婚庆/婚拍/化妆/司仪并签订合同；拍婚纱照预约'],
['提前 3-6 个月','确定宾客名单初稿；定制请柬；选购喜糖、伴手礼；确定婚车与婚宴布置方案；预订酒店试菜'],
['提前 1-3 个月','发放请柬并统计回执；确定座位表；确认婚纱礼服及改衣；安排伴郎伴娘分工；.确定菜单与酒水'],
['提前 1 个月','核对宾客最终人数；婚礼彩排安排；确认司仪流程台本；准备致辞与感谢信；检查各项定金尾款'],
['提前 1-2 周','领取/定制婚戒；安排婚房布置；酒水礼盒采购；确认摄影摄像团队；打印席位卡与引导牌'],
['婚礼当天','按时间轴执行：接亲/迎宾/典礼/敬酒/送客；指定专人盯场与收礼金；预留应急备用金']
];
function monthDiff(d1,d2){const a=new Date(d1),b=new Date(d2);return Math.round((b-a)/(1000*60*60*24*30));}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 婚礼策划清单 | AgentGongju.com'))return;
const dateStr=document.getElementById('date').value.trim();
const budget=document.getElementById('budget').value;
const tables=document.getElementById('tables').value;
const special=document.getElementById('special').value.trim();
let wedding=new Date();
if(dateStr){
const p=dateStr.split('-');
if(p.length>=2){wedding=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]||'1'));}
}
let out='💍 婚礼筹备总清单\n';
out+='婚期：'+(dateStr||'未定')+'　预算：'+budget+'　规模：'+tables+'\n';
if(special)out+='特别要求：'+special+'\n';
out+='\n【预算分配建议】（按'+budget+'）\n';
const bMap={'5万以内':{婚宴:'40%',布置:'15%',摄影:'12%',化妆:'8%',婚纱:'10%',其他:'15%'},'10万左右':{婚宴:'45%',布置:'15%',摄影:'12%',化妆:'7%',婚纱:'8%',其他:'13%'},'20万以上':{婚宴:'45%',布置:'18%',摄影:'12%',化妆:'6%',婚纱:'8%',其他:'11%'}};
const bm=bMap[budget];
out+='· 婚宴('+bm['婚宴']+') · 场地布置('+bm['布置']+') · 摄影摄像('+bm['摄影']+') · 化妆('+bm['化妆']+') · 婚纱礼服('+bm['婚纱']+') · 其他('+bm['其他']+')（含婚车、喜糖、司仪等）\n\n';
out+='【分阶段时间线】\n';
const now=new Date();
const diff=monthDiff(now,wedding);
out+='（距婚期约 '+(diff>0?diff+' 个月 或 '+Math.ceil(diff*4.3)+' 周':'不足1个月')+'）\n\n';
phases.forEach(([timeline,items])=>{
out+='━━ '+timeline+' ━━\n';
out+='· '+items.split('；').join('\n· ')+'\n\n';
});
out+=special?'【特别关注】\n· 根据「'+special+'」，建议单列专项负责人并预留专款预算。\n\n':'';
out+='📌 贴心提醒\n· 婚宴菜品建议试菜后再定，饮料酒水按桌数×1.2备量\n· 尽早确认摄影团队档期，好团队婚礼季档期很紧张\n· 安排一位全程盯场的“婚礼总管”，当天只对接他一人';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 婚礼清单已复制！'))}
</script>
</body>
</html>
