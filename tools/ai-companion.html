<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🤖 AI智能聊天助手</h1><p>选择你喜欢的人设，和AI畅聊解闷、倾诉烦恼</p></div>
<div class="card"><label>🎭 选择AI人设</label><select id="persona">
<option value="知心好友">💛 知心好友</option>
<option value="幽默段子手">😂 幽默段子手</option>
<option value="温柔树洞">🌳 温柔树洞</option>
<option value="职场导师">💼 职场导师</option>
<option value="元气少女">🌸 元气少女</option>
<option value="哲学大师">🧠 哲学大师</option>
</select>
<div class="chat-box" id="chat"></div>
<div class="input-row"><input type="text" id="inp" placeholder="输入你想说的话，回车发送…" onkeydown="if(event.key==='Enter')send()"><button class="send-btn" onclick="send()">发送</button></div>
<button class="reset-btn" onclick="resetChat()">🔄 重新开始对话</button></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const PERSONAS={
'知心好友':['（认真听完）我懂你的感受，不管发生什么我都站你这边。','慢慢聊，我在听呢。','有时候说出来就已经好了一半了，你做得很好。','不管怎样，记得先照顾好自己，然后我们再想办法。'],
'幽默段子手':['哈哈哈哈，你这个说法绝了！','（憋笑）我知道你很想严肃，但真的太好笑了。','生活不就是这样嘛，边笑边过。','笑一笑十年少，看你也变年轻啦！'],
'温柔树洞':['（轻声）你的心事我都收下了，安心交给这里吧。','没关系，慢慢说，时间还很多。','抱抱你，你辛苦了。','有些情绪说出来就轻了，我在听。'],
'职场导师':['这个问题关键是要先理清目标和优先级。','先别急着动手，把思路想清楚再执行会更高效。','在职场上，学会向上管理同样重要，点赞你的主动。','建议你把问题拆解成三步，一步一步来就不慌了。'],
'元气少女':['哇！听到你说这个我也超开心的！','加油加油加油！你一定可以的！（握拳）','嘿嘿，今天的你也要元气满满哦！','放心啦，有我在，什么问题都不是问题！'],
'哲学大师':['万物皆可思考，你问出了很好的问题。','也许答案不在于得到，而在于寻找的过程。','向内求索，方能见真我。']};
const OPENERS={
'知心好友':'嗨～我在这儿呢，最近过得怎么样？',
'幽默段子手':'嘿朋友！今天有啥乐子吗？来唠两句！',
'温柔树洞':'（安静地等待着）想说什么都可以，我听着呢。',
'职场导师':'你好，有什么工作上的困扰想聊聊吗？',
'元气少女':'嗨嗨！今天也要元气满满哦！找我聊什么呀？',
'哲学大师':'欢迎，你心中是否也有未解之惑？'};
function addMsg(text,who){
const box=document.getElementById('chat');
const div=document.createElement('div');
div.className='msg '+who;
div.textContent=text;
box.appendChild(div);
box.scrollTop=box.scrollHeight;
}
function resetChat(){
document.getElementById('chat').innerHTML='';
const p=document.getElementById('persona').value;
addMsg(OPENERS[p],'ai');
}
function send(){
if(!Paywall.countUse('AI智能聊天助手 | AgentGongju.com'))return;
const inp=document.getElementById('inp');
const text=inp.value.trim();
if(!text)return;
addMsg(text,'user');
inp.value='';
const p=document.getElementById('persona').value;
const pool=PERSONAS[p];
let reply=pool[Math.floor(Math.random()*pool.length)];
if(text.includes('?')||text.endsWith('吗'))reply=reply+'（关于你说的这个话题，我也可以再展开聊聊～）';
if(text.length>40)reply+='\n（你说了好多内容，我慢慢消化，咱们继续聊～）';
setTimeout(()=>{addMsg(reply,'ai');},400);
}
resetChat();
</script>
