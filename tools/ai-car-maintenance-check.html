<div class="tool-header"><h1>🚗 AI 汽车保养项目该不该做</h1><p>4S 店推荐一堆项目，帮你逐项判断该不该掏钱</p></div>
<div class="card">
<div class="param-row">
<div><label>🚙 车型</label>
<select id="cartype">
<option value="gas" selected>燃油车（普通家用）</option>

<option value="mix">一半市区一半高速</option>

</select></div>

<label style="display:inline-block;margin-right:18px;font-weight:400"><input type="checkbox" id="p_air" checked style="width:auto;margin-right:6px">空气/空调滤芯</label>

<label style="display:inline-block;margin-right:18px;font-weight:400"><input type="checkbox" id="p_spark" style="width:auto;margin-right:6px">火花塞</label>

<label style="display:inline-block;margin-right:18px;font-weight:400"><input type="checkbox" id="p_inject" style="width:auto;margin-right:6px">清洗喷油嘴</label>
<label style="display:inline-block;margin-right:18px;font-weight:400"><input type="checkbox" id="p_engine" style="width:auto;margin-right:6px">发动机清洗/积碳清理</label>
<label style="display:inline-block;margin-right:18px;font-weight:400"><input type="checkbox" id="p_align" style="width:auto;margin-right:6px">四轮定位</label>
<label style="display:inline-block;margin-right:18px;font-weight:400"><input type="checkbox" id="p_tire" style="width:auto;margin-right:6px">换轮胎</label>
<label style="display:inline-block;margin-right:18px;font-weight:400"><input type="checkbox" id="p_battery" style="width:auto;margin-right:6px">换蓄电池</label>

<script>
var RULES={
 oil:{n:'换机油机滤',must:'必做（核心保养）'},
 air:{n:'空气/空调滤芯'},
 brake:{n:'刹车油'},
 coolant:{n:'防冻液'},
 trans:{n:'变速箱油'},
 spark:{n:'火花塞'},
 throttle:{n:'清洗节气门'},
 inject:{n:'清洗喷油嘴'},
 engine:{n:'发动机清洗/积碳清理'},
 align:{n:'四轮定位'},
 tire:{n:'换轮胎'},
 battery:{n:'换蓄电池'},
 pad:{n:'换刹车片'},
 ac:{n:'空调清洗除菌'},
 add:{n:'添加剂/保护剂'}
};
function gen(){
 var ct=document.getElementById('cartype').value;
 var km=parseFloat(document.getElementById('km').value)||0;
 var age=parseFloat(document.getElementById('age').value)||0;
 var road=document.getElementById('road').value;
 var oil=document.getElementById('oil').value;
 var price=parseFloat(document.getElementById('price').value)||0;
 var out='════ 汽车保养项目判断清单 ════\n\n';
 var oilKm={full:'1 万公里 / 1 年',semi:'7500 公里 / 9 个月',mineral:'5000 公里 / 6 个月',unknown:'按说明书（通常 5000-10000 公里）'}[oil];
 out+='当前状态：'+km+' 万公里 ｜ 车龄 '+age+' 年 ｜ '+({city:'市区拥堵',mix:'市区+高速',highway:'高速为主',dust:'灰尘大'}[road])+' 路况\n';
 out+='机油类型：'+({full:'全合成',semi:'半合成',mineral:'矿物油',unknown:'不明确'}[oil])+'（建议更换周期：'+oilKm+'）\n\n';
 out+='──── ✅ 逐项判断 ────\n\n';
 function line(cb,title,verdict,why){
   var e=document.getElementById(cb);
   if(!e||!e.checked)return;
   out+='【'+title+'】 → '+verdict+'\n  '+why+'\n\n';
 }
 var hard=road==='dust'||road==='city';
 line('p_oil','换机油机滤','✅ 该做','这是唯一每次都值得做的基础项目。换油必须同时换机滤，单独换油等于白换。');
 line('p_air','空气/空调滤芯','✅ 该做','单价便宜（几十到一百多）。空调滤芯自己网上买也能换，10 分钟搞定，能省一半的钱。');
 var brakeDue=(km>=4||age>=3);
 line('p_brake','刹车油','🟡 '+(brakeDue?'接近该换':'可以先拖'),'刹车油吸潮，一般 2 年或 4 万公里换。含水率超过 3% 才必须换，可以让师傅用检测笔测一下含水率给你看数据。');
 var coolDue=(km>=6||age>=5);
 line('p_coolant','防冻液','🟡 '+(coolDue?'该检查/更换':'不急'),'主流长效防冻液 4-10 年或 6-10 万公里。颜色没变浑浊、液位正常就先不换，只补充就行。');
 var transDue=km>=8||age>=6;
 line('p_trans','变速箱油','🟡 '+(transDue?'可以考虑':'可以先不换'),'手动挡一般 8-10 万公里；自动挡 6-8 万公里（不同厂家差异大，以说明书为准）。'+(transDue?'可以考虑换。':'你现在里程还不到，没必要提前换——这是 4S 店最爱推的高价项目之一。'));
 var sparkDue=ct==='gas'?(km>=8||age>=6):(km>=10);
 line('p_spark','火花塞','🟡 '+(sparkDue?'该换':'不用换'),'镍合金约 3 万公里，铱金/铂金约 8-10 万公里。'+(sparkDue?'按周期换。':'还没到周期，除非出现怠速抖动、油耗上升、加速无力才需要检查。'));
 if(ct==='ev'){
   out+='【清洗节气门 / 喷油嘴 / 积碳清理】 → ❌ 你不能做\n  纯电动车没有节气门、喷油嘴、发动机，推荐这类项目的门店建议直接换一家。\n\n';
 }else{
   line('p_throttle','清洗节气门','🟡 '+(hard?'可以考虑，但要拆洗':'通常不需要'),'只有当怠速不稳、抖动、油耗明显上升时才必要。清洗一定要"拆下来洗"，免拆打吊瓶效果差。');
   line('p_inject','清洗喷油嘴','❌ 基本可拒绝','正常加油、用正规油品就不需要。这是典型的"感觉赚钱"项目，200-600 元花得没感觉。');
   line('p_engine','发动机清洗/积碳清理','❌ 基本可拒绝','除非确实有抖动/动力下降且检测出积碳，否则就是纯创收。'+(ct==='turbo'?'涡轮直喷车更易积碳，但也要以实际检测为准，别按销售推荐做。':''));
 }
 var alignDue=false;
 line('p_align','四轮定位','🟡 看情况','只有当出现跑偏、方向不回正、轮胎单边磨损时才需要。换轮胎不一定要做定位，但做个动平衡是有必要的。');
 line('p_tire','换轮胎','🟡 看胎不看公里','判断标准：胎纹深度 < 1.6mm，或胎侧有鼓包/裂纹，或生产日期超过 5-6 年（胎侧 4 位数字如 2324 = 24 年第 23 周）。没到就别换。');
 line('p_battery','换蓄电池','🟡 看检测','正常寿命 3-5 年。可以让师傅测电压和健康度（SOH），低于 60% 或冷启动无力才换。'+(age>=4?'你的车已 '+age+' 年，确实进入更换区间，但也要以检测数据为准。':''));
 line('p_pad','换刹车片','🟡 看厚度','刹车片厚度低于 3mm 必须换。让师傅给你看实测厚度，别只听"该换了"。前片磨损通常比后片快。');
 line('p_ac','空调清洗除菌','🟡 看味道','开空调有霉味再洗。日常换个空调滤芯 + 定期开大风量吹 5 分钟，比花钱杀菌实在。');
 line('p_add','添加剂/保护剂','❌ 建议拒绝','机油添加剂、燃油宝、抗磨剂……绝大多数是纯利润项目，正规机油本身就含添加剂，加了反而可能破坏配方平衡。');
 out+='──── 💰 花费参考 ────\n';
 if(price>0){out+='本次报价：'+price+' 元\n';}
 out+='小额保养（机油+机滤+滤芯）：300-800 元（视车型和机油等级）\n大保养（含变速箱油等）：1500-4000 元\n一般来说，4S 店相同项目比独立修理厂贵 30%-100%，出保后完全可以去靠谱的独立店。\n\n';
 out+='──── 🛡 防忽悠三句话 ────\n';
 out+='① "麻烦给我看一下检测数据/实测厚度"——要数据，不要结论；\n';
 out+='② "这个项目不在厂家保养手册里，我先不做"——以手册为准，不以销售推荐为准；\n';
 out+='③ "能不能只做手册要求的项目"——把主动权拿回来。\n\n';
 out+='──── 📖 最该做的一件事 ────\n';
 out+='翻出你车里的《保养手册》（或厂家 App 里的电子版），上面按里程列的项目才是唯一权威标准。4S 店的"推荐项目表"通常比手册多出 3-5 倍。\n';
 out+='把手册要求的做了，其余的一项项问"不做会怎样"，答不出来就不做。\n\n';
 out+='──── ⚠️ 免责提示 ────\n';
 out+='以上为通用经验参考，不同品牌/车型差异较大，具体以厂家保养手册及专业检测为准。涉及安全的刹车、轮胎项目，宁可多花点钱检查。';
 return out;
}
</script>

if(!Paywall.countUse('AI 汽车保养项目该不该做 | AgentGongju.com'))return;
document.getElementById('outputBox').innerText=gen();
document.getElementById('resultArea').classList.add('active');
});
