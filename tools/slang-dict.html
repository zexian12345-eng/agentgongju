<script>
const dict={fyp:['For You Page，即短视频推荐页','“这条最好能上fyp让更多人看到”'],yyds:['永远的神，表示极好的东西','“这个螺蛳粉yyds！”'],栓q:['Thank you 的谐音“栓Q”，表示无语或真心感谢（常反讽）','“被老板气到栓Q”'],破防:['心理防线被击穿，情绪崩溃或实感动','“听到那番话直接破防了”'],画饼:['给人开出空头承诺，兑现遥遥无期','“老板又在给员工画饼了”'],绝绝子:['太绝了、非常棒，或讽刺的很无语','“这家店的环境绝绝子”'],emo:['情绪低落、伤感的状态','“深夜emo中，别打扰我”'],摆烂:['既然做不好就干脆不管、放任不管','“这季业绩太难了，干脆摆烂”'],内卷:['无意义的竞争内耗','“大家整天加班就是卷”'],e人:['外向性格的人（对应i人内向）','“我是e人，社交对我就是充电”'],i人:['内向性格的人','“我是i人，聚会太耗神了”'],xql:['小情侣的缩写','“xql又去旅游了”'],打工人:['自嘲的上班族','“打工人，打工魂”'],雨女无瓜:['“与你无关”的谐音（雨女无瓜）','“这是我的事，雨女无瓜”'],夺笋:['“多损”的谐音，形容很损','“你这话说得太夺笋了”']};
const hotList=['yyds','栓q','破防','画饼','emo','摆烂','内卷','e人','i人','打工人','夺笋','绝绝子'];
document.getElementById('hot').innerHTML=hotList.map(w=>'<span onclick="pick(\''+w+'\')">'+w+'</span>').join('');
function pick(w){document.getElementById('kw').value=w;}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('网络流行语解释器 | AgentGongju.com'))return;
let kw=document.getElementById('kw').value.trim().toLowerCase().replace(/\s/g,'');
if(!kw){alert('请输入要解释的词');return;}
document.getElementById('word').textContent=kw;
let d=dict[kw];
if(d){document.getElementById('result').textContent='【含义】\n'+d[0]+'\n\n【例句】\n“'+d[1]+'”\n\n有时候语境不同意思会有细微差别，你可以在具体聊天场景里感受一下～';}
else {document.getElementById('result').textContent='【未收录】\n抱歉，这个词目前不在我们的词库里。\n\n它可能是：\n• 新出现的网络热词\n• 特定圈子的黑话缩写\n可以尝试换个词，或稍后再来看看，我们会持续更新词库！';}
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('word').textContent+'\n'+document.getElementById('result').textContent).then(()=>alert('✅ 已复制！'))}
</script>
