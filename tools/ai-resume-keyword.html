<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 简历关键词优化器 | AgentGongju.com</title>
<meta name="description" content="提取岗位JD中的关键词，一键优化简历描述，让简历更贴合目标岗位，提升通过筛选概率">
<meta name="keywords" content="AI简历优化,简历关键词,岗位匹配,求职,简历润色,ATS">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.btn-gen:disabled{opacity:.5;cursor:not-allowed}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.panel{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.25);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.panel-line{font-size:.88rem;color:#cbd5e1;line-height:1.8}
.panel-line b{color:#a855f7}
.kw{background:rgba(34,197,94,0.15);color:#86efac;padding:1px 6px;border-radius:6px;font-weight:600}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.match-bar{height:8px;background:rgba(255,255,255,0.06);border-radius:6px;overflow:hidden;margin:10px 0}
.match-fill{height:100%;background:linear-gradient(135deg,#6366f1,#a855f7);border-radius:6px;transition:width .5s}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>📄 AI 简历关键词优化器</h1><p>提炼岗位JD关键词，让简历一击即中</p></div>

<div class="card">
<label>🖥 目标岗位JD（粘贴招聘要求）</label>
<textarea id="jd" placeholder="例如：本科以上学历；3年Java开发经验；熟悉Spring Cloud、微服务架构；具备良好的团队协作与沟通能力；有高并发项目经验者优先"></textarea>
<label>✍️ 你的工作经历/项目描述</label>
<textarea id="exp" placeholder="例如：负责公司电商平台的开发，参与订单系统设计和实现，修复线上bug，和同事配合完成新版上线"></textarea>
<button class="btn-gen" id="genBtn">🔍 优化简历</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 简历优化结果</div>
<div id="box"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制优化稿</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function kwsFrom(text){return (text.match(/[\u4e00-\u9fa5A-Za-z0-9]{2,}/g)||[]).filter(s=>!/^(本科|大专|以上|学历|相关|以及|我们|负责|优先)$/.test(s));
}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 简历关键词优化器 | AgentGongju.com'))return;
let jd=document.getElementById('jd').value.trim();
let exp=document.getElementById('exp').value.trim();
if(!jd){alert('请输入岗位JD');return}
if(!exp){alert('请输入你的工作经历');return}
// 提取JD关键词
const stop=['以上','学历','相关','优先','热爱','具备','良好','拥有','负责','本科','专科','能够','进行','以及','和'];
const words=jd.split(/[；;，,\s\n。.、()（）]+/).flatMap(s=>{
const tags=[];
if(/[\u4e00-\u9fa5]{2,}/.test(s)){
// 提取标点前短语
const m=s.match(/[\u4e00-\u9fa5A-Za-z0-9+\-]{3,}/g);
if(m)tags.push(...m);
}
return tags.filter(w=>!stop.includes(w));
});
const uniq=[...new Set(words)].slice(0,10);
const hint=`建议在简历中突出以下关键词：${uniq.slice(0,8).map(w=>`「${w}」`).join(' ')}`;
// 用这些词润色经历
const better=exp.replace(/(了|完成|做好|做完)/g,'').split(/[，。；,;]/).filter(Boolean).map(s=>`· ${s.replace(/我/g,'').trim()}`).slice(0,6);
const box=document.getElementById('box');box.innerHTML='';
const div=document.createElement('div');div.className='panel';
div.innerHTML=`<div class="panel-line"><b>🎯 建议突出的关键词：</b><br>${uniq.slice(0,8).map(w=>`<span class="kw">${w}</span>`).join(' ')}</div>`;
const div2=document.createElement('div');div2.className='panel';
div2.innerHTML=`<div class="panel-line"><b>📝 优化后的经历描述（可直接替换）：</b><br>${better.map(s=>s).join('<br>')}<br><br><span style="color:#64748b">💡 小贴士：将JD中高亮词自然融入每条经历，使用「主导/负责/提升/优化」等强动词更有说服力。</span></div>`;
box.appendChild(div);box.appendChild(div2);
});setTimeout(()=>{},0);
function copyResult(){let out=document.getElementById('box').innerText.replace(/\n{3,}/g,'\n\n');navigator.clipboard.writeText(out).then(()=>alert('✅ 已复制！'))}
</script>
</body>
</html>
