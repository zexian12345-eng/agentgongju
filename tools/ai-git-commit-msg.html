<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Git 提交信息生成器 | AgentGongju.com</title>
<meta name="description" content="把本次代码改动描述转成规范的 Git commit message，遵循 Conventional Commits 规范，自动判断 type 并可生成中文或英文版本。">
<meta name="keywords" content="git commit,提交信息,commit message,conventional commits,代码规范,程序员工具">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.9;white-space:pre-wrap;margin-bottom:12px;font-size:.9rem;font-family:ui-monospace,Menlo,monospace;word-break:break-word}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
</style>
<script>
var _hmt = _hmt || [];
(function() { var hm = document.createElement("script"); hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949"; var s = document.getElementsByTagName("script")[0]; s.parentNode.insertBefore(hm, s); })();
</script>
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🌿 AI Git 提交信息生成器</h1><p>傻瓜式看懂你的改动，写出规范 commit</p></div>

<div class="card">
<label>📝 描述这次代码改了什么</label>
<textarea id="desc" placeholder="例如：修复了登录页面点击按钮没反应的问题，改了 login.vue 和 auth.js"></textarea>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
<div><label>🗣️ 输出语言</label>
<select id="lang">
<option value="cn">中文</option>
<option value="en">English</option>
<option value="both">中英双语</option>
</select></div>
<div><label>📐 规范类型</label>
<select id="style">
<option value="conventional">Conventional Commits</option>
<option value="gitmoji">Gitmoji 表情版</option>
<option value="simple">简洁中文版</option>
</select></div>
</div>
<div><label>🔗 关联 Issue 号（可选）</label>
<input type="text" id="issue" placeholder="例如：PROJ-128（可不填）">
<button class="btn-gen" id="genBtn">✨ 生成提交信息</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 生成结果</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制提交信息</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function detectType(d){
if(/修复|fix|bug|报错|错误|崩溃|异常/i.test(d))return {t:'fix',cn:'修复'};
if(/文档|readme|注释/i.test(d))return {t:'docs',cn:'文档'};
if(/样式|css|ui|界面|排版/i.test(d))return {t:'style',cn:'样式'};
if(/重构|优化结构|重写/i.test(d))return {t:'refactor',cn:'重构'};
if(/性能|加速|优化加载/i.test(d))return {t:'perf',cn:'性能'};
if(/测试|test/i.test(d))return {t:'test',cn:'测试'};
if(/删除|移除|清理/i.test(d))return {t:'chore',cn:'杂项'};
if(/新增|添加|增加|实现|功能/i.test(d))return {t:'feat',cn:'新功能'};
return {t:'chore',cn:'杂项'};
}
document.getElementById('genBtn').addEventListener('click',function(){
if(!Paywall.countUse('AI Git 提交信息生成器 | AgentGongju.com'))return;
var d=document.getElementById('desc').value.trim();
if(!d){alert('请先描述代码改动');return;}
var info=detectType(d);
var lang=document.getElementById('lang').value;
var style=document.getElementById('style').value;
var issue=document.getElementById('issue').value.trim();
var clean=d.replace(/[。；;]/g,'，').split(/[，,]/)[0].trim();
var scope='';
var fileMatch=d.match(/[\w.-]+\.(vue|js|ts|py|java|go|css|html|jsx|tsx)/i);
if(fileMatch)scope=fileMatch[1];
var subjCn=info.cn+'：'+clean;
var subjEn=info.t+': '+clean;
var emoji={fix:'🐛',feat:'✨',docs:'📝',style:'💄',refactor:'♻️',perf:'⚡',test:'✅',chore:'🔧'}[info.t];
var head='';
if(style==='conventional')head=info.t+(scope?'('+scope+')':'')+': '+clean;
else if(style==='gitmoji')head=emoji+' '+clean;
else head='['+info.cn+'] '+clean;
var body='';
if(lang==='cn'||lang==='both')body+='\n\n说明：'+clean+'。';
if(lang==='en'||lang==='both')body+='\n\n'+(lang==='both'?'--- English ---\n':'')+info.t+': '+clean;
if(issue)body+='\n\nRefs: #'+issue.replace(/^#/,'');
var out='【推荐提交信息】\n'+head+body;
out+='\n\n【完整模板】\n'+info.t+(scope?'('+scope+')':'')+': concise description\n\n<optional body>\n\n'+(issue?'Refs: #'+issue:'');
out+='\n\n【类型对照】\nfeat 新功能 · fix 修复 · docs 文档 · style 样式 · refactor 重构 · perf 性能 · test 测试 · chore 杂项';
out+='\n\n【命令示例】\ngit commit -m "'+head.split('\n')[0]+'"';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(function(){alert('✅ 已复制！')})}
</script>
</body>
</html>
