<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI PPT 大纲生成 | AgentGongju.com</title>
<meta name="description" content="输入主题、场景与页数，自动生成一份可直接使用的 PPT 大纲，含每页标题、要点与配图建议。">
<meta name="keywords" content="PPT大纲,演示文稿,汇报提纲,幻灯片,PPT结构,汇报材料">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,input[type=text],input[type=number],textarea{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:90px;resize:vertical;line-height:1.8}
select:focus,input:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;margin-bottom:12px;font-size:.92rem}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>
var _hmt = _hmt || [];
(function() { var hm = document.createElement("script"); hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949"; var s = document.getElementsByTagName("script")[0]; s.parentNode.insertBefore(hm, s); })();

</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>📊 AI PPT 大纲生成</h1><p>先有骨架再动手，做 PPT 不再对着空白页发呆</p></div>

<div class="card">
<label>🎯 PPT 主题</label>
<input type="text" id="topic" placeholder="例如：Q3 销售复盘与下季度计划">
<div class="param-row">
<div><label>📍 使用场景</label>
<select id="scene">
<option value="work" selected>工作汇报</option>
<option value="proposal">方案提案 / 招商</option>
<option value="pitch">项目路演</option>
<option value="train">培训分享</option>
<option value="school">课程/答辩演示</option>
<option value="product">产品介绍</option>
</select></div>
<div><label>📄 页数</label>
<select id="pages"><option value="8">8 页左右</option><option value="12" selected>12 页左右</option><option value="16">16 页左右</option><option value="20">20 页以上</option></select></div>
</div>
<div class="param-row">
<div><label>👀 听众</label>
<select id="audience"><option value="boss" selected>上级 / 老板</option><option value="client">客户 / 合作方</option><option value="team">团队成员</option><option value="public">公开听众</option></select></div>
<div><label>🎨 表达风格</label>
<select id="tone"><option value="data" selected>数据严谨</option><option value="story">故事叙述</option><option value="simple">简洁有力</option></select></div>
</div>
<label>🔑 必须包含的关键信息（选填）</label>
<textarea id="key" placeholder="例如：营收 1200 万、同比增长 35%、新增客户 60 家、下季度重点开拓华南市场"></textarea>
<button class="btn-gen" id="genBtn">📝 生成大纲</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制大纲</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
var SCENE_OUT={
work:{pages:[
['封面','标题 + 副标题 + 汇报人/日期','简洁背景图，主题色大字标题'],
['本次汇报要点','用 3 条列出今天的核心结论（先给结果）','三个并排卡片图标'],
['背景与目标','为什么做这件事，当初定了什么目标','时间轴或目标对比图'],
['关键数据概览','3-5 个核心数字，越大越好','数字大字 + 趋势箭头'],
['进展与成果','分模块说明完成了什么，配量化结果','进度条 / 对比柱状图'],
['遇到的问题','客观陈述困难，不推责','分类列表 + 影响程度标记'],
['解决方案','针对每个问题给出对策与所需支持','左右对照：问题→对策'],
['经验与反思','做对了什么、下次怎么改进','要点列表'],
['下阶段计划','按时间排布的重点任务与里程碑','甘特图 / 路线图'],
['需要的支持','明确要人、要钱、要资源','申请清单表格'],
['风险与应对','可能出现的风险及备案','风险等级矩阵'],
['总结','一句话重申核心结论','居中大字'],
['Q&A','感谢 + 联系方式','留白页'],
['附录','详细数据表、原始记录','表格截图']
]},
proposal:{pages:[
['封面','方案名称 + 一句话价值主张 + 提案方','品牌视觉背景'],
['我们理解的问题','对方当前面临的核心痛点（复述确认）','痛点图标 + 一句话'],
['市场/行业洞察','用数据说明这个机会有多大','市场数据图表'],
['我们的方案','一句话概括方案核心','方案示意图'],
['方案拆解','分 3 个模块说明怎么落地','三栏结构图'],
['差异化优势','为什么是我们而不是别人','竞品对比表'],
['案例验证','已成功的类似案例与数据','案例截图 + 数字'],
['实施路径','分阶段时间表与关键节点','甘特图'],
['投入与回报','预算明细与预期收益测算','投入产出一览表'],
['团队介绍','核心成员与相关经验','团队照片 + 履历'],
['合作模式','合作方式、结算与权责边界','流程图'],
['下一步','明确的行动邀约与时间点','行动清单'],
['致谢','联系方式','简洁结束页']
]},
pitch:{pages:[
['封面','项目名 + 一句话定位 + 融资轮次','产品主视觉'],
['痛点','用户正在经历什么痛苦，用真实场景说','场景照片'],
['解决方案','你的产品如何解决它','产品界面截图'],
['产品演示','核心功能 3 张图讲清楚','界面流程'],
['市场规模','TAM/SAM/SOM 测算','市场规模漏斗图'],
['商业模式','怎么赚钱，客单价与毛利','收入结构饼图'],
['增长数据','用户数、留存、复购等关键指标','增长曲线'],
['竞争格局','对比竞品的差异化定位','象限图'],
['壁垒','技术 / 数据 / 供应链 / 品牌壁垒','壁垒示意'],
['团队','创始人背景与互补性','团队介绍'],
['融资计划','融资金额、用途分配、里程碑','资金用途饼图'],
['愿景','3 年后我们要成为什么','愿景大字页']
]},
train:{pages:[
['封面','课程名称 + 讲师 + 时长','主题视觉'],
['你会学到什么','3 条学习目标','目标清单'],
['为什么重要','不学这个会付出什么代价','对比画面'],
['基础概念','先把关键名词讲清楚','概念图示'],
['核心方法（一）','第一个要点 + 案例','步骤图'],
['核心方法（二）','第二个要点 + 案例','步骤图'],
['核心方法（三）','第三个要点 + 案例','步骤图'],
['实操演练','现场练习指引与示例','练习模板'],
['常见误区','新手最容易踩的坑','误区×3'],
['工具与模板','可以直接拿去用的东西','工具清单'],
['延伸学习','推荐书单/课程/社区','资源列表'],
['总结与答疑','要点回顾 + 提问环节','回顾大字'],
['课后作业','具体任务与提交方式','作业卡']
]},
school:{pages:[
['封面','课题名称 + 姓名 + 学号 + 日期','简洁学术封面'],
['研究背景','为什么选这个题目','背景图示'],
['研究问题','明确要回答的核心问题','问题陈述'],
['文献综述','前人做了什么，缺口在哪','文献脉络图'],
['研究方法','用了什么方法、样本、工具','方法流程图'],
['数据分析','主要发现与数据支撑','图表展示'],
['讨论','结果说明了什么，与文献的呼应','讨论要点'],
['结论','回答了什么问题，有什么意义','结论摘要'],
['局限与展望','研究不足与未来方向','列表'],
['参考文献','规范引用格式','文献列表'],
['致谢','感谢师长同学','结束页']
]},
product:{pages:[
['封面','产品名 + Slogan + 主视觉','产品渲染图'],
['用户痛点','用户现在是怎么凑合解决的','场景对比'],
['产品是什么','一句话说清楚，不用术语','产品全景图'],
['核心功能','3-5 个卖点，每个配图','功能卡片'],
['使用场景','谁在什么时候用它','场景故事图'],
['技术亮点','技术上的硬实力','架构/参数图'],
['与竞品对比','客观对比表','对比表'],
['价格与版本','不同套餐的差异','价格表'],
['用户评价','真实好评与数据','评价截图'],
['服务保障','售后、质保、培训支持','服务清单'],
['购买方式','渠道、优惠、联系方式','二维码页'],
['FAQ','常见问题解答','问答列表']
]}
};
function gen(){
var topic=document.getElementById('topic').value.trim()||'我的演示主题';
var scene=document.getElementById('scene').value;
var pages=+document.getElementById('pages').value;
var audience=document.getElementById('audience').value;
var tone=document.getElementById('tone').value;
var key=document.getElementById('key').value.trim();
var tpl=SCENE_OUT[scene].pages.slice();
var out='════ PPT 大纲：'+topic+' ════\n';
out+='场景：'+({work:'工作汇报',proposal:'方案提案',pitch:'项目路演',train:'培训分享',school:'课程答辩',product:'产品介绍'}[scene]);
out+='　|　听众：'+({boss:'上级/老板',client:'客户/合作方',team:'团队成员',public:'公开听众'}[audience]);
out+='　|　风格：'+({data:'数据严谨',story:'故事叙述',simple:'简洁有力'}[tone])+'\n';
out+='总页数：'+tpl.length+' 页（建议实际控制在 '+pages+' 页内，删减非核心页）\n';

var keyArr=key?key.split(/[,，、\n]+/).filter(function(x){return x.trim();}):[];
if(keyArr.length){
out+='\n【需重点呈现的信息】\n';
keyArr.forEach(function(k,i){if(k.trim())out+=(i+1)+'. '+k.trim()+'　→ 至少在一页中用大字或图表突出\n';});
}

out+='\n════ 逐页大纲 ════\n\n';
tpl.forEach(function(p,i){
out+='第 '+(i+1)+' 页　【'+p[0]+'】\n';
out+='　内容：'+p[1]+'\n';
out+='　视觉建议：'+p[2]+'\n';
if(tone==='data'&&i>0&&i<tpl.length-1)out+='　数据要求：本页至少出现 1 个具体数字或图表\n';
if(tone==='story'&&i>0&&i<tpl.length-1)out+='　叙述提示：用"当时我们遇到……后来发现……结果是……"的句式\n';
if(tone==='simple')out+='　精简提示：单页文字不超过 6 行，每行不超过 12 字\n';
out+='\n';
});

out+='════ 制作建议 ════\n';
out+='1. 先写大纲再做设计，顺序反了会反复推翻重做；\n';
out+='2. 一页只讲一个观点，标题就直接写结论（结论式标题比"现状分析"信息量大得多）；\n';
out+='3. 数据用图表、关系用图示、只有对比才用表格，别全篇都是文字；\n';
out+='4. 全场配色不超过 3 种，字体不超过 2 种，显得专业；\n';
out+='5. 汇报前用手机试看一遍，手机上看不清的字，投影上也看不清。\n';
return out;
}
</script>
<script>
document.getElementById('genBtn').addEventListener('click',function(){
if(!Paywall.countUse('AI PPT 大纲生成 | AgentGongju.com'))return;
document.getElementById('outputBox').innerText=gen();
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(function(){alert('✅ 已复制！')})}
</script>
</body>
</html>
