<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 起名测字 | AgentGongju.com</title>
<meta name="description" content="AI姓名测字打分，分析五行、笔画、寓意吉凶，帮你起名改名">
<meta name="keywords" content="测名字,姓名打分,起名,五行测试">
<link rel="stylesheet" href="../css/style.css">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
input:focus,select:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.9;margin-bottom:12px}
.score-big{font-size:2.5rem;font-weight:700;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tag{display:inline-block;padding:3px 10px;border-radius:16px;font-size:.78rem;margin:2px 4px}
.tag.gold{background:rgba(217,164,32,0.15);color:#d9a420}
.tag.red{background:rgba(239,68,68,0.15);color:#f87171}
.tag.blue{background:rgba(99,102,241,0.15);color:#a5b4fc}
@media(max-width:600px){.score-big{font-size:2rem}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🔠 AI 起名测字</h1><p>姓名五行 · 笔画吉凶 · 综合打分</p></div>

<div class="card"><label>👤 姓名</label>
<input type="text" id="name" placeholder="请输入姓名，例如：张伟">
<label>🌿 出生年（用于五行参考，可选）</label>
<input type="text" id="year" placeholder="例如：1992（可选）">
<button class="btn-gen" id="genBtn">🔮 开始测名</button></div>
<div class="result-area" id="resultArea">
<div class="card">得分 <span class="score-big" id="score">0</span><span class="tag gold" id="lvlTag"></span>
<div class="result-box" id="detail"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制结果</button></div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyResult(){navigator.clipboard.writeText(document.getElementById('detail').textContent).then(()=>alert('✅ 已复制！'))}
const wuxingChars={'木':['林','森','梓','荣','楠','楷','柏'],'火':['炎','煜','烨','熙','煊','烁'],'土':['坤','垚','培','峰','岚','嵩'],'金':['鑫','锐','铭','钧','锋','钧'],'水':['淼','霖','涵','泽','浩','清']};
function charWuxing(c){for(const k in wuxingChars){if(wuxingChars[k].includes(c))return k}return ['木','火','土','金','水'][Math.floor(Math.random()*5)]}
document.getElementById('genBtn').addEventListener('click',()=>{
const name=document.getElementById('name').value.trim();if(!name||name.length<2){alert('请输入至少两个字的名字');return}
const year=document.getElementById('year').value.trim();const chars=name.split('');
const strokes=chars.map(c=>{let s=0;for(const ch of c){s+=(ch.charCodeAt(0)%15)+5}return s});
const totalStrokes=strokes.reduce((a,b)=>a+b,0);
const score=70+Math.min(29,(totalStrokes%9)*3+ (name.length===2&&name.length>0?4:name.length===3?7:5));
const lvl=score>=95?'极佳':score>=85?'上佳':score>=75?'良好':score>=65?'中等':'需斟酌';
const wxList=chars.map(charWuxing);
const wxSet=[...new Set(wxList)];
let wx='';
wxList.forEach((w,i)=>{const count=wxList.filter(x=>x===w).length;let detail='行';const hints={木:'仁厚通达',火:'热情果敢',土:'稳重可靠',金:'刚毅果决',水:'聪慧灵动'};wx+='「'+chars[i]+'」五行属'+w+'，主'+hints[w]+'；'});wx=wx.slice(0,-1);
const yearNote=year?('，出生年 '+year+' 属'+(['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'][(parseInt(year)+8)%12])+'')+'，与姓氏五行宜生助':'';
document.getElementById('score').textContent=score;
document.getElementById('lvlTag').textContent=('评级：'+lvl);
document.getElementById('lvlTag').style.cssText='background:rgba(217,164,32,0.15);color:#d9a420';
document.getElementById('detail').innerHTML=
'<b>总笔画：</b>'+strokes.join(' + ')+' = '+totalStrokes+' 画<br><br>'+
'<b>五行分析：</b>'+wx+'<br><br>'+
'<b>音韵节奏：</b>'+name.length+'字名，读来'+(name.length===3?'朗朗上口，起伏有致':'简洁有力')+'，易于记忆与传播<br><br>'+
'<b>寓意解读：</b>'+['寓意积极向上，寄予父母美好期许','气质沉稳大气，透着书香气息','取名不着俗套，别具一格','音形义俱佳，适合各年龄段'][(totalStrokes%4)]+'<br><br>'+
'<b>综合建议：</b>'+(score>=85?'此名整体不错'+yearNote+'，可放心使用。':'此名中规中矩'+yearNote+'，可适当参考笔画与五行调整，例如补一个属'+(wxSet[0]||'木')+'的字会更好。');
document.getElementById('resultArea').classList.add('active');
});
</script>
</body>
</html>
