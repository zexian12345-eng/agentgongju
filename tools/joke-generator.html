<script>
let cur='谐音梗';
document.querySelectorAll('.tag').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tag').forEach(x=>x.classList.remove('sel'));t.classList.add('sel');cur=t.getAttribute('data');});
const jokes={
'谐音梗':['为什么数学书总是很忧郁？因为它有很多问题。','你愿意做我的太阳能电池吗？我一看到你就充满了电。','你知道企鹅为什么住南极吗？因为北极被熊 "冰" 霸了。# 谐音梗','我买了一个很贵的保温杯，回家发现它不保暖，原来是我的心凉了。','为什么吃了感冒药会觉得困？因为它是 "睡" 药，不是 "醒" 药。'],
'生活吐槽':['今天决定早睡早起，结果睡是睡了，起倒是没起来。','我现在码字打工人三件套：保温杯、枸杞、黑眼圈。','我的钱不是大风刮来的，但确实是被大风刮走的。','说好一起胖的，你偷偷瘦了，这友谊没得做。','当代人的一天：白天困成狗，晚上精神得像夜猫子。'],
'动物脑洞':['为什么猫总是喜欢坐在键盘上？因为它在给主人 "发明" 代码。','鱼说：我也有压力，水底下太 "深" 了。','乌龟问兔子：你为什么跑那么快？兔子说：赶着回家给龟儿子写作业。','小鸟对电线杆说：咱俩这关系咋形容？电线杆说：就叫 "搭伙" 过日子吧。','长颈鹿为什么脖子长？因为低头久了容易得颈椎病。'],
'程序员':['程序员最怕的三个字不是 "我爱你"，而是 "改需求"。','问：为什么程序员分不清万圣节和圣诞节？答：因为 Oct 31 == Dec 25。','程序员去相亲，自我介绍：我精通各种语言。对方：哦，翻译？','代码写多了，做梦都在找 bug。','改别人代码一时爽，一直改别人代码一直爽——直到被拉黑。'],
'童言无忌':['小朋友问妈妈：为什么大人总说 "小孩子不要说话"？妈妈说：因为大人的话比较 "值钱"。','老师问：太阳为什么这么亮？小明答：因为它在 "上班" 啊。','女儿指着月亮说：那是谁的灯笼？妈妈说：是宇宙挂在天上的夜灯。','小朋友问爸爸：你为什么叫爸爸？爸爸：这叫 "职称"。']};
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 冷笑话生成器 | AgentGongju.com'))return;
const pool=jokes[cur]||jokes['谐音梗'];
const j=pool[Math.floor(Math.random()*pool.length)];
const box=document.getElementById('result');box.classList.add('active');box.textContent='🤣 '+j;
document.getElementById('copyBtn').style.display='inline-block';
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('result').textContent).then(()=>alert('✅ 已复制！'))}
</script>
