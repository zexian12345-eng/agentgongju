<select id="age"><option value="2">2-3 岁</option><option value="4" selected>4-5 岁</option><option value="6">6-8 岁</option><option value="9">9-10 岁</option><option value="11">11 岁以上</option></select></div>

<select id="scene">
<option value="refuse">想要东西没满足，当众打滚</option>
<option value="homework">不想写作业 / 拒绝学习</option>
<option value="share">和小朋友抢玩具 / 打架</option>
<option value="screen">不给玩手机平板</option>
<option value="bath">不肯刷牙洗澡睡觉</option>
<option value="talk">顶嘴、说不听、故意对着干</option>
<option value="school">不想上学 / 怕去幼儿园</option>
</select></div>
</div>

<div><label>📍 场合</label>

</div>

<script>
var AGE={
'2':{name:'2-3 岁',tip:'这个年龄大脑前额叶还没发育好，讲道理基本无效，靠"转移注意力＋简短指令"。',ph:'「妈妈知道你很想要，现在不能拿。我们去看那个小火车好不好？」'},
'4':{name:'4-5 岁',tip:'开始有自尊心和"我说了算"的需求，给他有限选择权最有效。',ph:'「你可以现在收玩具，或者再过 3 分钟收，你选哪个？」'},
'6':{name:'6-8 岁',tip:'能理解规则和后果，可以沟通但需要先共情。',ph:'「你现在很生气，先深呼吸一下，等你准备好我们再聊这件事。」'},
'9':{name:'9-10 岁',tip:'重视公平与尊重，最忌讳当众训斥。',ph:'「我尊重你的想法，但我们需要一个双方都能接受的方案。」'},
'11':{name:'11 岁以上',tip:'青春期开始，情绪大但不愿被当小孩，给空间＋平等对话。',ph:'「我不逼你现在说，等你想聊的时候我都在。」'}
};
var SCENE={
refuse:{do_:['蹲下来与孩子平视，不要站着俯视说教','用一句话确认情绪："你很想要，被拒绝了很生气对吗？"','说明规则且不妥协："今天不买，这是早就说好的。"','给出替代选择："我们可以把它拍下来，下次生日再考虑。"'],
dont:['不要当众威胁"再哭就不要你了"','不要因为怕丢脸就立刻妥协买','不要边哄边骂"哭什么哭"']},
homework:{do_:['先接情绪："作业又多又难，谁都会烦。"','把任务切小："先写 3 道题，写完休息 5 分钟。"','给主动权："你想先写数学还是先写语文？"','共担责任："你写的时候我坐旁边看书陪你。"'],
dont:['不要说"别人都能写完就你不行"','不要在情绪上冲突时继续加作业','不要在作业上讨价还价到无限让步']},
share:{do_:['先分开两人，让各自情绪降下来','不急着判对错，先听孩子版本','帮他说出感受："玩具被抢走，你很委屈。"','一起想办法："下次可以说——我在玩，等我玩完给你。"'],
dont:['不要强迫道歉（敷衍的道歉没意义）','不要当众说"你怎么这么小气"','不要只批评自家孩子或只护短']},
screen:{do_:['提前约定时间，用闹钟而不是你来叫停','时间到执行约定，语气平静不辩论','提供替代活动："我们来搭乐高/下楼骑车。"','家长自己先放下手机'],
dont:['不要用"再玩就把手机砸了"威胁','不要时间随心情忽长忽短','不要自己刷手机却要求孩子不玩']},
bath:{do_:['把流程变成游戏："小恐龙要去洗澡啦"','给选择权："你先刷牙还是先洗脚？"','正向预告："再玩 5 分钟就要去洗澡咯。"','完成后及时肯定："你自己刷的牙，很认真。"'],
dont:['不要突然中断游戏强行抱走','不要用"不洗澡就让医生打针"吓唬','不要拖着不处理直到大人崩溃']},
talk:{do_:['先停 10 秒，别在气头上回应','说出他的感受："你觉得自己被冤枉了，所以顶嘴。"','只针对行为不针对人格："刚才那句话让我很难受，我们换个说法。"','事后单独聊，别当众斗气'],
dont:['不要用"你怎么这么没教养"贴标签','不要用权威压制"我是你妈你就得听"','不要翻旧账']},
school:{do_:['倾听具体原因，是怕老师、怕同学还是分离焦虑','共情："离开妈妈确实会想，这很正常。"','给确定性："放学前我一定第一个在校门口等你。"','和老师沟通，请老师在校内多给正向关注'],
dont:['不要说"再哭就不要你了"或偷偷溜走','不要说"上学有什么好怕的，胆小鬼"','不要因为哭就同意今天不去（会强化哭=有效）']}
};
var PLACE={
public:'公共场所优先"撤离现场"：抱起孩子走到安静角落，不围观不表演，人少了他更容易冷静。',
home:'家里相对安全，可以允许他哭一会儿，你在旁边安静陪着，别走开也别劝个不停。',
relative:'先带孩子离开饭桌/客厅，避免长辈插手护短，回家后再复盘。',
school:'校门口尽量短平快，不拖成拉锯战；和老师打个招呼，请他帮忙接手安抚。'
};
var MOOD={
calm:'保持现在的状态，你的平静就是孩子最好的稳定器。',
tired:'你累了，先照顾好自己：可以把孩子交给家人 5 分钟，深呼吸再上场。',
angry:'你已经发过火了，先修复关系："刚才妈妈大声了，对不起，我们都冷静一下再说。"承认情绪不丢人，是榜样。'
};
function gen(){
var a=AGE[document.getElementById('age').value];
var s=SCENE[document.getElementById('scene').value];
var p=PLACE[document.getElementById('place').value];
var m=MOOD[document.getElementById('mood').value];
var out='════ 应对方案（'+a.name+'）════\n\n';
out+='🧠 这个年龄的特点\n'+a.tip+'\n';
out+='💬 万能开口句\n'+a.ph+'\n\n';
out+='──── 具体怎么说、怎么做 ────\n';
s.do_.forEach(function(x,n){out+=(n+1)+'. '+x+'\n';});
out+='\n──── 千万不要做 ────\n';
s.dont.forEach(function(x){out+='✗ '+x+'\n';});
out+='\n──── 场合提示 ────\n'+p+'\n';
out+='\n──── 关于你自己的状态 ────\n'+m+'\n';
out+='\n──── 通用四步法（记住这个就够用）────\n';
out+='① 停：自己先闭嘴 10 秒，不吼不威胁\n② 接：说出他的情绪（"你很生气/很委屈"）\n③ 界：温和但坚定地守住规则\n④ 选：给他两个你能接受的选项\n';
out+='\n──── 事后复盘（情绪过去 1 小时后）────\n';
out+='· 描述事实不说教："今天在商场你躺在地上哭了 10 分钟。"\n';
out+='· 一起想办法："下次很想要东西的时候，可以怎么做？"\n';
out+='· 提前约定："下次去商场我们只说好买一样，好吗？"\n';
out+='\n⚠️ 若长期出现打人、自伤、拒学、失眠等，建议咨询儿童心理科或家庭教育指导师。\n';
return out;
}
</script>

document.getElementById('outputBox').innerText=gen();
