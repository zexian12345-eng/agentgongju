<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.btn-gen:disabled{opacity:.5;cursor:not-allowed}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.meal{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:16px;margin-bottom:12px}
.meal h4{color:#a5b4fc;margin-bottom:8px}
.meal p{color:#e2e8f0;line-height:1.8}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>

<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🥗 健康餐盘搭配</h1><p>按 211 法则（2份蔬菜+1份蛋白+1份主食）科学搭配健康三餐</p></div>

<div class="card"><label>🎯 你的目标</label>
<select id="goal"><option value="均衡健康">均衡健康</option><option value="减脂">减脂塑形</option><option value="增肌">增肌增重</option></select>
<div class="param-row">
<div><label>偏好口味</label><select id="taste"><option value="清淡">清淡</option><option value="家常">家常</option><option value="轻辣">微辣</option></select></div>
<div><label>忌口（可选）</label><input type="text" id="avoid" placeholder="如：不吃香菜/海鲜"></div>
</div>
<button class="btn-gen" id="genBtn">🍱 生成健康餐单</button></div>

<div class="result-area" id="resultArea"><div class="card"><div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 今日健康餐单</div>
<div id="out"></div>
<button class="copy-btn" onclick="copyAll()">📋 复制餐单</button></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyAll(){let t='';document.querySelectorAll('#out .meal').forEach(el=>t+=el.innerText+'\n');navigator.clipboard.writeText(t.trim()).then(()=>alert('✅ 已复制'))}
const VEG={清淡:['清炒西兰花','白灼菜心','凉拌黄瓜','蒜蓉菠菜'],家常:['番茄炒蛋','香菇油菜','地三鲜','干煸四季豆'],轻辣:['虎皮青椒','麻婆豆腐','辣炒藕丁','剁椒娃娃菜']};
const PROTEIN={减脂:['香煎鸡胸肉','清蒸鲈鱼','水煮虾仁','卤牛肉'],增肌:['黑椒牛排','蒜蓉大虾','蒸鸡腿','红烧牛肉'],均衡健康:['清蒸鱼','白灼虾','卤鸡腿','肉末豆腐']};
const STAPLE={清淡:['杂粮饭','藜麦饭','玉米','红薯'],家常:['米饭','面条','馒头'],轻辣:['米饭','炒河粉','拌面']};
const MEALS=['早餐','午餐','晚餐'];
const SUPP=['水果一份（苹果/蓝莓）','一小把坚果（核桃/杏仁）','牛奶或酸奶一杯','无糖豆浆一杯'];
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('健康餐盘搭配 | AgentGongju.com'))return;
const goal=document.getElementById('goal').value;
const taste=document.getElementById('taste').value;
const avoid=document.getElementById('avoid').value.trim();
const veg=VEG[taste], pro=PROTEIN[goal], sta=STAPLE[taste];
let html='';
MEALS.forEach((m,i)=>{
  let v=veg[Math.floor(Math.random()*veg.length)],p=pro[Math.floor(Math.random()*pro.length)],s=sta[Math.floor(Math.random()*sta.length)];
  if(avoid){const av=avoid.replace('不吃','').replace(/海鲜/g,'虾|鱼'); if(new RegExp(av).test(v+p)){p='豆腐';}}
  const extra=i===0?'+ 水煮蛋1个 + '+SUPP[Math.floor(Math.random()*4)]:i===1?'+ 汤品(紫菜蛋花汤)':'+ '+SUPP[Math.floor(Math.random()*4)];
  const ratio='🥬 蔬菜×2　🍗 蛋白×1　🍚 主食×1';
  html+='<div class="meal"><h4>🍽 '+m+'</h4><p>主菜：'+p+'\n蔬菜：'+v+'\n主食：'+s+' '+extra+'\n<div style="color:#64748b;font-size:.78rem;margin-top:6px">'+ratio+'</div></p></div>';
});
document.getElementById('resultArea').classList.add('active');
document.getElementById('out').innerHTML=html;
});
</script>
</body>
</html>
