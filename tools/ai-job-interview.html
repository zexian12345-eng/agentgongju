<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 面试模拟与问答 | AgentGongju.com</title>
<meta name="description" content="选择岗位与面试轮次，生成高频面试题及高分回答思路，帮你提前演练，临场不慌。">
<meta name="keywords" content="面试模拟,面试题目,面试技巧,求职,面试准备,回答思路,找工作">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
select:focus,input:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;margin-bottom:12px;font-size:.92rem}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>
var _hmt = _hmt || [];

<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🎤 AI 面试模拟与问答</h1><p>提前把问题过一遍，面试现场就不慌了</p></div>

<div class="card">
<div class="param-row">
<div><label>💼 岗位类型</label>
<select id="role">
<option value="tech" selected>技术 / 研发</option>
<option value="product">产品 / 运营</option>
<option value="sales">销售 / 市场</option>
<option value="design">设计 / 内容</option>
<option value="admin">行政 / 人事 / 财务</option>
<option value="fresh">应届生 / 实习</option>
</select></div>
<div><label>📊 面试轮次</label>
<select id="round">
<option value="hr" selected>HR 初面</option>
<option value="lead">业务主管面</option>
<option value="boss">总监 / 老板面</option>
<option value="final">终面 / 谈薪</option>
</select></div>
</div>
<label>🏢 目标公司 / 岗位名称（选填）</label>
<input type="text" id="target" placeholder="例如：字节跳动 后端开发工程师">
<label>❓ 已知道会被问的问题（选填，逗号分隔）</label>
<input type="text" id="known" placeholder="例如：为什么离职、职业规划">
<button class="btn-gen" id="genBtn">🎯 生成面试问题</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制题目</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
var Q={
hr:[
["请做一个自我介绍","别背简历。用「我是谁＋我做过什么＋为什么来这儿」三段式，控制在 90 秒：一句定位、两件量化成果、一句与该岗位的匹配点。"],
["你为什么想加入我们公司","展现你做过功课：提一句公司的业务/产品/近期动态，再说明你的能力正好能补上哪块。避免只说「公司平台大」。"],
["你最大的缺点是什么","选一个真实但不致命的缺点，重点讲你如何改进。例如「我不太擅长同时推进多条线，所以现在会用待办清单排优先级」。"],
["为什么从上一家公司离职","只说事实、不说情绪：发展方向不同、想接触更完整的业务链路。绝对不要吐槽前领导或同事。"],
["你的职业规划是什么","分近期（1 年站稳岗位）和中长期（3 年能独立负责某方向），让对方看到你稳定且有进取心。"],
["期望薪资是多少","先问清薪资结构再报价，给一个区间而非单点，并说明依据：市场行情＋你的经验＋岗位职责范围。"]
],
lead:[
["讲一个你最有成就感的项目","用 STAR 结构：背景-任务-行动-结果，重点讲你个人做了哪些关键决策，结果尽量带数字。"],
["遇到过最难的问题是什么，怎么解决的","突出解决问题的思路而非结果本身：怎么定位问题、试过哪些方案、为什么最后选了这个。"],
["如果资源和时间都只有一半，你怎么完成这个项目","考察优先级判断。回答框架：先砍非核心需求，把资源押在能验证价值的环节，并明确向上沟通预期。"],
["你和同事发生分歧时怎么处理","举实例：先对齐目标而非争论方案，用数据或小范围试验来决定，最后服从一致结论并全力执行。"],
["你怎么看待加班","不表态极端。可以说「关键节点愿意投入，同时希望通过流程优化减少无效加班」，展现职业性。"],
["你未来半年最想补齐的能力是什么","选一个与岗位强相关的能力，并说清你打算怎么学、用什么衡量效果。"]
],
boss:[
["你觉得我们这个行业未来 3 年会怎么变","给出你的判断＋依据＋对你岗位的影响。不必唱赞歌，有独立观点更容易被记住。"],
["如果让你负责一块新业务，你会怎么切入","讲框架：先定义成功指标，再找最小验证路径，小成本试错，跑通了再放量。"],
["你希望公司给你什么支持","要资源不要承诺：清晰的权责边界、必要的预算或人手、能被及时反馈的沟通机制。"],
["你怎么看自己的价值和公司的价值","把个人产出和公司目标挂钩，说明你创造的价值如何被衡量，而不是只谈个人成长。"],
["如果入职后发现和预期不符怎么办","展现成熟度：先沟通确认信息差，再用小范围成果争取调整，避免情绪化辞职。"]
],
final:[
["薪资结构的细节怎么谈","逐项问清：基本工资、绩效占比与发放方式、年终奖计算口径、股权/期权行权条件、调薪周期。"],
["什么时候能到岗","实话实说，但给对方明确的确定日期。如果有多个 offer，可以礼貌表达但不要用来施压过度。"],
["你还有什么想问我们的","准备 3 个问题：团队现在最大的挑战是什么、这个岗位半年内的考核标准、部门今年的重点方向。"],
["如果同时拿到其他 offer，你怎么选","正面回应但不透露细节：说明你更看重岗位成长空间和团队匹配度，让对方感受到诚意。"]
]
};
var ROLE_TIP={
tech:['能否介绍一下这个系统的整体架构？你负责哪一层？','线上出现性能问题你会怎么排查？','你最近在学什么技术，为什么学它？'],
product:['请拆解一个你常用的 App，说说它的核心功能闭环。','怎么判断一个需求该不该做？','你怎么衡量一次改版是否成功？'],
sales:['请现场模拟一次电话开场白。','客户说「太贵了」你怎么回应？','你上个月的业绩目标完成率是多少，怎么做到的？'],
design:['展示作品集时，你会先讲哪一件，为什么？','设计师和产品经理意见不一致时怎么办？','你常用哪些工具，效率提升体现在哪？'],
admin:['你如何处理多件紧急事项同时压过来？','跨部门协作时怎么推进别人配合你？','你在上一份工作中最大的流程改进是什么？'],
fresh:['你大学里最有收获的一段经历是什么？','为什么选择这个行业而不是本专业？','你觉得自己相比其他应届生的优势在哪？']
};
function gen(){
var role=document.getElementById('role').value;
var round=document.getElementById('round').value;
var target=document.getElementById('target').value.trim();
var known=document.getElementById('known').value.trim();
var roleName={tech:'技术/研发',product:'产品/运营',sales:'销售/市场',design:'设计/内容',admin:'行政/人事/财务',fresh:'应届生/实习'}[role];
var roundName={hr:'HR 初面',lead:'业务主管面',boss:'总监/老板面',final:'终面/谈薪'}[round];
var out='════ 面试准备方案 ════\n';
out+='岗位方向：'+roleName+'　|　轮次：'+roundName+'\n';
if(target)out+='目标：'+target+'\n';
out+='以下 '+ (Q[round].length + (ROLE_TIP[role]?ROLE_TIP[role].length:0)) +' 道题建议每道都写一遍提纲，不要只在大脑里过。\n';
out+='\n──── 通用高频题 ────\n';
Q[round].forEach(function(q,i){
out+='\nQ'+(i+1)+'. '+q[0]+'\n💡 回答思路：'+q[1]+'\n';
});
if(ROLE_TIP[role]){
out+='\n──── 岗位专业题 ────\n';
ROLE_TIP[role].forEach(function(q,i){ out+='\nQ'+(i+1)+'. '+q+'\n💡 回答思路：结合你真实做过的案例来讲，有细节、有数字、有你的个人动作。\n';});
}
if(known){
out+='\n──── 你已知的问题 ────\n';
known.split(/[,，、\s]+/).forEach(function(k,i){ if(k) out+=(i+1)+'. '+k+'　→ 提前准备好 2 分钟版本的完整回答，并录音回听一次。\n';});
}
out+='\n════ 面试当天清单 ════\n';
out+='□ 提前 15 分钟到，线上面试提前 10 分钟调设备、测网络；\n';
out+='□ 打印/准备 3 份纸质简历，带笔和本子；\n';
out+='□ 准备 3 个故事（成就、冲突、失败），大部分问题都能套进去；\n';
out+='□ 每个回答控制在 2 分钟内，先给结论再展开；\n';
out+='□ 结束时主动问 2-3 个问题，并确认后续流程时间节点。\n';
out+='\n════ 谈薪三个原则 ════\n';
out+='1. 不要在面试中途主动报价，等对方确认要你之后再谈；\n';
out+='2. 报区间不报单点，且区间下限是你真实可接受的数字；\n';
out+='3. 除工资外把绩效、年终、补贴、假期、成长空间一起纳入比较。\n';
return out;
}
</script>
<script>
document.getElementById('genBtn').addEventListener('click',function(){
if(!Paywall.countUse('AI 面试模拟与问答 | AgentGongju.com'))return;
document.getElementById('outputBox').innerText=gen();
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(function(){alert('✅ 已复制！')})}
</script>
</body>
