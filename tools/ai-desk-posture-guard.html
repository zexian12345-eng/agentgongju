<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 久坐工位·拉伸计划生成 | AgentGongju.com</title>
<meta name="description" content="上班族久坐自救：根据你的屏幕使用、工位时间和酸痛部位，生成一张每天能坚持的拉伸/活动闹钟表与跟练动作清单。">
<meta name="keywords" content="久坐缓解,肩颈酸痛,办公拉伸,坐姿提醒,工间操">
<link rel="stylesheet" href="../css/style.css"><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:34px}
.tool-header h1{font-size:2.15rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:26px;margin-bottom:16px}
label{display:block;color:#cbd5e1;font-weight:600;margin-bottom:6px;font-size:.9rem}
select,input{width:100%;box-sizing:border-box;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,.1);border-radius:9px;color:#e2e8f0;font-family:inherit;font-size:.9rem;padding:11px 13px;outline:none;margin-bottom:13px}
.chk{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.chk span{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.03);padding:8px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.08);color:#cbd5e1}
.chk input{width:auto;margin:0}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:#fff;font-weight:700;font-size:1.02rem;cursor:pointer}
.result-area{display:none}
.result-area.show{display:block}
.part{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.part h4{margin:0 0 10px;color:#e9d5ff;font-size:.95rem}
ul{margin:0;padding-left:18px;color:#d9e2f1;line-height:1.9;font-size:.9rem}
.hint{color:#64748b;font-size:.76rem;margin-top:14px;line-height:1.8}
.time-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.time-grid input[type=checkbox]{display:none}
.time-grid label{text-align:center;padding:8px 2px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#94a3b8;font-size:.8rem;font-weight:400}
.time-grid input:checked+label{background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff}
.week{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.week span{font-size:.72rem;color:#64748b;background:rgba(255,255,255,.03);padding:2px 8px;border-radius:10px}
@media(max-width:600px){.time-grid{grid-template-columns:repeat(3,1fr)}.time-grid label{font-size:.75rem}}
</style>

<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🧘 AI 久坐工位 · 拉伸计划</h1><p>把“站起来动一动”变成你能坚持的日程表</p></div>
<div class="card">
<label>每天坐班时长</label>
<select id="hours"><option value="4">半天以内 ≤4h</option><option value="6" selected>标准 6h</option><option value="8">较长 8h</option><option value="10">超长 10h+</option></select>
<label>午休后我会站起来活动吗?</label>
<select id="lunch"><option value="y">会，午休走动一下</option><option value="n">基本不动</option></select>
<label>你最容易酸痛/紧张的地方(可多选)</label>
<div class="chk" id="pains">
 <span><input type="checkbox" value="neck" checked>颈肩</span><span><input type="checkbox" value="back">腰背</span><span><input type="checkbox" value="eyes" checked>眼睛干涩</span><span><input type="checkbox" value="wrist">手腕</span><span><input type="checkbox" value="leg">久坐下肢</span>
</div>
<label>每天可接受的“动一下”时间段(建议挑3-5个点，其余靠久坐提醒)</label>
<div class="time-grid" id="tg">
 <input type="checkbox" id="t930" value="09:30" checked><label for="t930">9:30</label>
 <input type="checkbox" id="t1100" value="11:00" checked><label for="t1100">11:00</label>
 <input type="checkbox" id="t1430" value="14:30" checked><label for="t1430">14:30</label>
 <input type="checkbox" id="t1600" value="16:00" checked><label for="t1600">16:00</label>
 <input type="checkbox" id="t1730" value="17:30"><label for="t1730">17:30</label>
</div>
<button class="btn-gen" id="gen">🗓️ 生成我的工位拉伸表</button>
</div>
<div class="result-area" id="resultArea"><div class="card" id="res"></div>
<div class="hint">📌 请记住：任何“计划”都敌不过“提醒+2分钟轻启动”。建议配一个番茄钟每45分钟响一次，响后做1页里任选2个动作即可。若职业病已有明显刺痛/麻木，请先看医生，不要硬扛拉伸。</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com</p></div></footer>
<script>
document.getElementById('gen').addEventListener('click',function(){
 if(!Paywall.countUse('AI 久坐工位·拉伸计划生成 | AgentGongju.com'))return;
 const hours=document.getElementById('hours').value;
 const lunch=document.getElementById('lunch').value;
 const pains=[...document.querySelectorAll('#pains input:checked')].map(x=>x.value);
 const times=[...document.querySelectorAll('#tg input:checked')].map(x=>x.value);
 const box=document.getElementById('res');box.innerHTML='';
 const seg=(title,items)=>{const d=document.createElement('div');d.className='part';d.innerHTML='<h4>'+title+'</h4><ul>'+items.map(i=>'<li>'+i+'</li>').join('')+'</ul>';box.appendChild(d);};
 // 由小时定频次
 let slotCount=times.length||4;
 const freq = hours>=8? '约每 60-75 分钟' : (hours>=6?'约每 90 分钟':'约每 2 小时');
 seg('⏱️ 你有没有一台能坚持的“提醒排班”',[
  '· 设一个可穿透勿扰的番茄/提醒：每 '+freq+' 提醒一次「起身」，共覆盖 '+slotCount+' 个时段的微活动点：'+times.join('、')+'，尽量落到散会/接水的空档。',
  '· 落杯法：把水杯放远一两米，每天走几步去接水，顺便强制离座（比硬提醒更润物细无声）。',
  '· 电脑抬平：屏幕顶缘与视线齐平，若低头可垫高显示器，减少颈椎受力。'
 ]);
 // 选动作
 const acts={neck:['抬头看天花板 x3 并缓慢左右转头各5次（缓解低头族）','靠墙收下巴，后脑勺贴墙保持15秒×3，矫正头前伸'],back:['站姿向后伸懒腰+双手扶腰轻后仰三次','猫式撑桌：双手掌扶桌沿弓背-塌腰来回10次'],eyes:['20-20-20：每20分钟看20英尺外20秒','热敷或闭眼转动眼球各方向停2秒（省流护眼）'],wrist:['伸展手腕：手掌上抬与下压各保持15秒×3','手指开合/弹钢琴式在空中敲20下，放松鼠标手'],leg:['踮脚站起踝关节转动左右各10下','原地高抬腿或深蹲起身5-8次，激活臀部']};
 const chose={};
 pains.forEach(p=>{if(acts[p])chose[p]=acts[p].slice(0,3);});
 // 组装每时段动作轮换（午饭午休敏感）
 const setAt=function(i){
  const pool=pains.map(p=>chose[p]||[]).flat();
  if(!pool.length)return ['站起来伸个懒腰，走动去接一杯水。'];
  const cut=i%pool.length;
  return [pool[cut],pool[(cut+3)%pool.length]];
 };
 const partT=list=>{const d=document.createElement('div');d.className='part';d.innerHTML='<h4>随点随做 · 全套动作清单(按你选的痛点)</h4><ul>'+list.map(i=>'<li>'+i+'</li>').join('')+'</ul>';box.appendChild(d);};
 const full=[];Object.keys(chose).forEach(k=>full.push(...chose[k]));
 partT(full);
 // 午休 & 工作型提示
 const extra=[];
 if(lunch==='n')extra.push('午休建议：饭后站10分钟或散个步，减少整个下午的连续久坐积压。');
 if(pains.includes('eyes'))extra.push('给显示器常年开“夜间/暖色模式”，并把亮度降到最低舒适档。');
 if(extra.length)seg('🍱 小贴士',extra.map(e=>'· '+e));
 // 排班表卡片
 const card=document.createElement('div');card.className='part';
 card.innerHTML='<h4>📋 我给你排的表（存手机/贴显示器下沿即可）</h4><ul>'+
  times.map((tm,i)=>{const n=setAt(i);return '<li>'+tm+' → '+n[0]+'（若时间赶可只做第②个：'+n[1]+'）</li>';}).join('')+'</ul>';
 box.appendChild(card);
 document.getElementById('resultArea').classList.add('show');
 document.getElementById('resultArea').scrollIntoView({behavior:'smooth'});
});
</script>
</body>
</html>
