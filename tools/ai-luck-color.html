 green:{name:'绿色系 · 生机青翠',hex:'#22c55e',ele:'木',tip:'旺事业与成长，求职亮眼',outfits:['墨绿衬衫','军绿工装外套','牛油果绿上衣']},
 blue:{name:'蓝色系 · 沉稳藏青',hex:'#2563eb',ele:'水',tip:'利口才灵感，适合创作表达',outfits:['雾霾蓝毛衣','藏青西装','海蓝休闲卫衣']},
 red:{name:'红色系 · 热情中国红',hex:'#ef4444',ele:'火',tip:'增益人气与桃花，带来行动力',outfits:['酒红外套','砖红格子裙','CHERRY红包点缀']},
 white:{name:'白色系 · 洁净明亮',hex:'#e2e8f0',ele:'金',tip:'清爽招贵人，减负转运',outfits:['纯白衬衫','奶白半裙','浅灰开衫']}};
const eleOf=['木','火','土','金','水']; //阳历序天干简化
//生肖五行(简表)
const zodiacEle={'鼠':'水','牛':'土','虎':'木','兔':'木','龙':'土','蛇':'火','马':'火','羊':'土','猴':'金','鸡':'金','狗':'土','猪':'水'};
const sceneAdvice={
 '职场':{gold:'谈判桌上以米金领带/丝巾点睛，沉稳又提气场。',green:'面试选墨绿细节，显得可靠有生机。',blue:'藏青是职场经典安全色，稳妥不出错。',red:'想被记住可在耳饰/鞋面用一点红破沉闷。',white:'白衬衫+深色下装 = 干练不出错公式。'},
 '约会':{gold:'暖杏色针织配温柔笑容，亲和力拉满。',green:'牛油果色约会装，青春减龄。',blue:'雾霾蓝毛衣气质耐看，显软糯。',red:'适当一点红，桃花运与存在感兼备。',white:'奶白裙装温婉又显气色，约会首选。'},
 '休闲':{gold:'焦糖色系休闲装，慵懒又显高级。',green:'军绿工装休闲外套，时髦不挑人。',blue:'简蓝卫衣+牛仔裤是周末轻松密码。',red:'砖红卫衣拍照上镜，红运随身。',white:'清爽白T叠搭，怎么穿都干净。'},
 '谈判':{gold:'金色腕表/腰带在细节处显分量。',green:'军绿风衣给人"稳中带锋芒"之感。',blue:'藏青正装构成可信赖气场。',red:'谈判忌大面积红，作点缀提升气势即可。',white:'奶白点缀中和攻击性，促成对话。'}};
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 今日幸运色穿搭 | AgentGongju.com'))return;
const d=new Date(document.getElementById('cdate').value||new Date());
const dateStr=(document.getElementById('cdate').value||new Date().toISOString().slice(0,10));
const z=document.getElementById('zodiac').value;
const scene=document.getElementById('scene').value;
const wish=document.getElementById('wish').value;
//加权选色：日期序号 + 生肖五行 + wish
const day=(d.getTime()/86400000|0);
let main,aux;
if(wish==='财富运'){} 
if(wish==='财运'){const set=['gold','white','red'];main=(day%2===0)?'gold':'white';aux='red';}
else if(wish==='桃花'){const set=['red','green','white'];main=(day%2===0)?'red':'white';aux='green';}
else if(wish==='事业'){main=(day%3===0)?'green':'blue';aux='gold';}
else{const c=Object.keys(colors);main=c[day%c.length];aux=c[(day+2)%c.length];}
const M=colors[main],A=colors[aux];
let out='🎨 【今日幸运色穿搭 · '+dateStr+'】\n';
out+='生肖：'+z+'属相　场景：'+scene+'　开运侧重：'+(wish==='桃花'?'🌹桃花人缘':wish==='财运'?'💰财运':wish==='事业'?'🚀事业':'综合旺运')+'\n';
out+='━━━━━━━━━━━━━━━━\n';
out+='🟡 今日主色：'+M.name+'\n　色盘：'+M.hex+'　五行属：'+M.ele+'　寓意：'+M.tip+'\n';
out+='🔶 搭配次选：'+A.name+'\n\n';
out+='👕 今日穿搭建议：\n';
O(M,aux);

out+='　次色点缀：选用'+A.outfits[M.outfits.length-1]+'做小面积提亮\n\n';
out+='📍 场景细节：\n　'+sceneAdvice[scene][main]+'\n';
out+='　'+sceneAdvice[scene][(main==='blue'?'gold':main)]+'\n\n';
out+='💫 生活小Tip：把主色用在"靠近脸的上装"+次色用在鞋包，既显气色又不夺整体主调。祝'+z+'属的你今日衣品在线、好运随身！';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
function O(){/*noop*/}
});
