<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="keywords" content="宽带套餐,宽带选择,多少兆,宽带办理,融合套餐,网速,家庭网络">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
input:focus,select:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;margin-bottom:12px;font-size:.92rem}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>

<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>📶 宽带套餐挑选助手</h1><p>别再被“千兆”忽悠，按需求选够用就好</p></div>

<div class="card">
<div class="param-row">
<div><label>👨‍👩‍👧 常驻上网人数</label>
<select id="people">
<option value="1">1 人</option>
<option value="2" selected>2-3 人</option>
<option value="4">4-5 人</option>
<option value="6">6 人以上</option>
</select></div>
<div><label>💻 主要用途</label>
<select id="use">
<option value="basic">刷视频、聊天、办公</option>
<option value="hd" selected>看 4K、网课、多人同时用</option>
<option value="game">打游戏、直播、剪片上云</option>
</select></div>
</div>
<div class="param-row">
<div><label>💰 月预算</label>
<select id="budget">
<option value="50">50 元以内</option>
<option value="80" selected>50-100 元</option>
<option value="130">100-150 元</option>
<option value="200">150 元以上</option>
</select></div>
<div><label>📱 手机号绑定</label>
<select id="bond">
<option value="no" selected>不想绑定手机号</option>
<option value="yes">可以绑手机号（融套餐）</option>
</select></div>
</div>
<label>🏠 其他要求（可选）</label>
<input type="text" id="extra" placeholder="例如：要装监控、需要公网IP、租房只能短签、老小区">
<button class="btn-gen" id="genBtn">✨ 生成选套餐建议</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">📶 你的宽带选择建议</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制建议</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
document.getElementById('genBtn').addEventListener('click',function(){
if(!Paywall.countUse('宽带套餐挑选助手 | AgentGongju.com'))return;
var pp=document.getElementById('people').value;
var use=document.getElementById('use').value;
var bud=document.getElementById('budget').value;
var bond=document.getElementById('bond').value;
var extra=document.getElementById('extra').value.trim();
var mb,reason;
if(use==='game'){mb=1000;reason='游戏/直播/剪片对上行速度和延迟敏感，建议千兆，且关注“上行带宽”而非只看下行。';}
else if(use==='hd'){mb=pp>=4?500:300;reason='多人 4K 与网课并发，300-500M 足够流畅，500M 性价比更高。';}
else {mb=pp>=4?300:200;reason='日常刷视频、办公，200-300M 完全够用，没必要上千兆。';}
var out='【推荐带宽】\n'+(mb>=1000?'1000M（千兆）':mb+'M')+'\n判断理由：'+reason+'\n\n';
out+='【套餐类型建议】\n';
if(bond==='yes')out+='· 可以绑手机号的话，优先考虑“宽带+手机套餐”融合套餐：\n  通常月费与单宽带接近，但能省下手机流量费，综合更划算；\n· 注意合约期（一般 1-2 年），中途退订可能有违约金。\n';
else out+='· 不想绑手机号，选“单宽带”纯宽带即可，避免被家庭成员手机号绑死；\n· 纯宽带一般贵一点，但灵活、到期可随时换运营商。\n';
out+='\n【价格参考区间】\n';
if(bud==='50')out+='· 50 元以内：多为 100-200M 单宽带或低档融合，够轻度使用；\n';
else if(bud==='80')out+='· 50-100 元：可拿到 300-500M，是性价比最高的区间；\n';
else if(bud==='130')out+='· 100-150 元：可上 500M-1000M 融合套餐，含手机流量；\n';
else out+='· 150 元以上：可看千兆+大流量手机卡+IPTV 全家桶，注意是否真用得上。\n';
out+='\n【办理避坑要点】\n';
out+='1. “千兆”要看是否有千兆光猫和千兆路由器，否则照样跑不满；\n2. 问清上行带宽：玩游戏、开直播、传文件主要看上行；\n3. 确认合约期与违约金，别被“免费送设备”绑死三年；\n4. IPTV、摄像头等增值服务到期后会自动扣费，记得问清；\n5. 老小区线路老，实际速度可能打折，可先办低档试用再升级；\n6. 网上办（官方 App/公众号）通常比营业厅便宜，还常有新装礼。\n';
out+='\n【设备建议】\n· 500M 以上建议配 Wi-Fi 6 路由器，摆放别放弱电箱里；\n· 大户型加一个 Mesh 子路由，比换更贵的套餐更管用；\n· 光猫改桥接+自备路由，稳定性和体验会明显提升（需操作能力）。\n';
if(extra)out+='\n【针对你的要求】\n'+extra.split(/[，,、]/).join('\n· ')+'\n如需公网 IP、监控回传，办理时一定确认运营商是否支持，部分需额外申请。\n';
out+='\n💡 一句话结论：'+(mb>=1000?'网络重度用户，千兆值得上。':mb>=300?'选 300-500M 融合套餐最划算。':'你家用量不大，200M 左右就够，别多花冤枉钱。');
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(function(){alert('✅ 已复制！')})}
</script>
</body>
</html>
