<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 品牌起名 | AgentGongju.com</title>
<meta name="description" content="AI品牌起名，输入行业/产品类型，生成有记忆点、有寓意、可注册的品牌名，附域名与寓意说明，创业开店起名必备">
<meta name="keywords" content="品牌起名,店铺起名,公司起名,商标,创意命名,创业">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.name-card{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.25);border-radius:12px;padding:18px;margin-bottom:14px}
.name-card .nm{font-size:1.35rem;font-weight:700;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.name-card .en{color:#94a3b8;font-size:.85rem;margin-bottom:8px}
.name-card .means{color:#e2e8f0;line-height:1.9;font-size:.9rem}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🏷️ AI 品牌起名</h1><p>有记忆点、有寓意、好注册，为你的产品点个亮</p></div>

<div class="card">
<label>🚀 行业 / 产品类型</label>
<input type="text" id="industry" placeholder="例如：智能咖啡机、国风茶饮店、母婴玩具、科技公司">
<div class="param-row">
<div><label>🎨 命名风格</label>
<select id="style">
<option value="大气">🏔️ 大气国际化</option>
<option value="国风">🏮 国风诗意</option>
<option value="潮流">⚡ 潮流网感</option>
<option value="简约">⬜ 简约现代</option>
<option value="吉祥">🍀 吉祥寓意</option>
</select></div>
<div><label>🌍 是否需要英文名</label>
<select id="en">
<option value="yes">需要中英对照</option>
<option value="no">仅中文</option>
</select></div>
</div>
<button class="btn-gen" id="genBtn">✨ 生成品牌名</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:16px">🏆 推荐品牌名方案</div>
<div id="namesBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制全部方案</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const stylePool={
'大气':[['云途','Yuntu','志在云端，征途远大'],['宏图','Hongtu','宏大蓝图，格局开阔'],['启越','Qiyue','启程超越，锐意进取'],['星瀚','Xinghan','如星辰浩瀚，胸有丘壑']],
'国风':[['墨梧','Mowu','墨香如梧，雅致有节'],['青栀','Qingzhi','青春如栀，清新隽永'],['拾光集','Shiguang','拾取时光里的美好'],['南枝','Nanzhi','南枝和暖，温润有度']],
'潮流':[['泡个社','PaoGe','潮玩社区，轻松有趣'],['不太卷','BuTaiJuan','拒绝内卷，松弛接住生活'],['冲鸭','ChongYa','冲劲十足，年轻有态度'],['社牛','SheNiu','闪亮社交，自带气场']],
'简约':[['简一','Jianyi','大道至简，始终如一'],['觅本','Miben','寻回本真，纯粹自然'],['一隅','Yiyu','安放于一隅的美好'],['白屿','Baiyu','纯净如岛屿，安静有力量']],
'吉祥':[['瑞丰','Ruifeng','祥瑞丰盈'],['悦和','Yuehe','喜悦和顺'],['满堂','Mantang','福气满堂'],['安泰','Antai','平安顺泰']]};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function slug(en){return en.toLowerCase();}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 品牌起名 | AgentGongju.com'))return;
const industry=document.getElementById('industry').value.trim();
if(!industry){alert('请先填写行业/产品类型');return;}
const style=document.getElementById('style').value;
const needEn=document.getElementById('en').value==='yes';
const pool=shuffle(stylePool[style].slice()).slice(0,4);
const box=document.getElementById('namesBox');box.innerHTML='';
window._brand='';
pool.forEach((n,i)=>{
const div=document.createElement('div');div.className='name-card';
const domain=slug(n[1])+'.com';
div.innerHTML=`<div class="nm">${n[0]}</div>${needEn?`<div class="en">英文：${n[1]} ｜ 建议域名：${domain}</div>`:`<div class="en">拼音标识：${n[1]}</div>`}<div class="means">寓意：${n[2]}。适合「${industry}」情境。</div>`;
box.appendChild(div);
window._brand+=`${i+1}. ${n[0]}（${n[1]}）：${n[2]}\n`;
});
const tip=document.createElement('div');tip.className='name-card';
tip.innerHTML=`<div class="means">💡 拟定名建议：<br>· 用「${pool[0][0]}」或「${pool[1][0]}」配合您的行业词组成双字/四字名，更有辨识度。<br>· 正式启用前请在国家知识产权局商标检索处做查重，并核对域名与社交媒体账号是否可用。</div>`;
box.appendChild(tip);
window._brand+='\n提示：使用前请做商标查重与域名核验。';
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText('【AI 品牌起名】\n'+window._brand).then(()=>alert('✅ 已复制！'))}
</script>
</body>
</html>
