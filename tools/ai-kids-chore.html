<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 儿童家务任务表生成器 | AgentGongju.com</title>
<meta name="description" content="AI儿童家务任务表生成器，按年龄生成适合孩子的家务清单与奖励机制，培养责任感与独立性">
<meta name="keywords" content="儿童家务,家务表,育儿,责任感培养,亲子教育">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
select:focus,input:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(255,255,255,0.03);border-radius:10px;margin-bottom:8px;font-size:.92rem;color:#cbd5e1}
.row .box{width:18px;height:18px;border:1.5px solid #6366f1;border-radius:5px;flex-shrink:0}
.row .star{color:#f59e0b;margin-left:auto;font-size:.8rem;white-space:nowrap}
.day{color:#a5b4fc;font-weight:600;margin:16px 0 8px;font-size:.95rem}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.tip{color:#94a3b8;font-size:.8rem;margin-top:8px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>
var _hmt = _hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";
  var s = document.getElementsByTagName("script")[0];
  s.parentNode.insertBefore(hm, s);
})();
</script>
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🧸 AI 儿童家务任务表</h1><p>从小做家务的孩子，长大更有底气</p></div>

<div class="card">
<label>👶 孩子年龄</label>
<select id="age">
<option value="3-4">3-4 岁</option>
<option value="5-6" selected>5-6 岁</option>
<option value="7-9">7-9 岁</option>
<option value="10-12">10-12 岁</option>
</select>
<label>🎁 激励机制（可选）</label>
<input type="text" id="reward" placeholder="例如：集满10颗星去游乐场 / 一周完成奖励30元零花钱">
<div class="param-row">
<div><label>📅 任务周期</label><select id="cycle"><option value="daily">每日任务</option><option value="weekly" selected>每周任务</option></select></div>
<div><label>🎯 培养重点</label><select id="focus"><option value="生活自理">生活自理</option><option value="责任感">责任感</option><option value="时间管理">时间管理</option><option value="关爱家人">关爱家人</option></select></div>
</div>
<button class="btn-gen" id="genBtn">✨ 生成任务表</button>
<div class="tip">💡 别把家务和惩罚挂钩，也别事事给钱。做完说声"谢谢你帮了家里大忙"比奖励更管用。</div>
</div>
<div class="result-area" id="resultArea"><div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 任务表已生成</div>
<div id="out"></div>
<button class="copy-btn" onclick="copyResult()" style="margin-top:14px">📋 复制任务表</button>
</div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyResult(){navigator.clipboard.writeText(document.getElementById('out').innerText).then(()=>alert('✅ 已复制！'))}
var TASK={
'3-4':['把自己的玩具放回收纳箱','把脏衣服放进洗衣篮','帮忙拿轻便的东西（如纸巾）','自己穿鞋袜（大人可协助）','给植物浇水（少量）'],
'5-6':['自己整理床铺（被子铺平即可）','把碗筷拿到厨房','擦自己的小桌子','给宠物喂食加水','把干净的袜子配对收好'],
'7-9':['饭后收拾自己的碗筷并擦桌','整理书包和第二天要带的东西','自己叠衣服并放进衣柜','倒垃圾并套新垃圾袋','扫地/用吸尘器清理自己房间'],
'10-12':['自己洗袜子/内衣','负责一次简单的早餐（如煮蛋）','拖地或擦地','整理冰箱里的过期食品','管理自己的零花钱记账']
};
function gen(){
if(!Paywall.countUse('AI 儿童家务任务表生成器 | AgentGongju.com'))return;
var age=document.getElementById('age').value,reward=document.getElementById('reward').value.trim();
var cycle=document.getElementById('cycle').value,focus=document.getElementById('focus').value;
var list=TASK[age].slice();
var focusTask={生活自理:'今天自己决定穿什么衣服并搭配好',责任感:'负责家里一项"专属任务"（如每天喂鱼）',时间管理:'在约定时间内完成自己的书包整理',关爱家人:'帮家人做一件小惊喜（倒杯水/捶背）'}[focus];
list.push('【'+focus+'】'+focusTask);
var days=cycle==='daily'?['周一','周二','周三','周四','周五','周六','周日']:['本周目标'];
var html='';
if(cycle==='daily'){
html+='<div class="day">每日固定任务</div>'+list.map(t=>'<div class="row"><div class="box"></div><span>'+t+'</span><span class="star">⭐</span></div>').join('');
html+='<div class="day">一周打卡表</div>';
days.forEach(d=>{html+='<div class="row" style="justify-content:space-between"><span>'+d+'</span><span style="letter-spacing:8px;color:#475569">☐ ☐ ☐ ☐ ☐</span></div>';});
}else{
html+='<div class="day">本周任务清单</div>'+list.map((t,i)=>'<div class="row"><div class="box"></div><span>'+t+'</span><span class="star">'+(i<3?'⭐ 每周2次':'⭐ 每周1次')+'</span></div>').join('');
}
html+='<div class="day">奖励规则</div><div class="row" style="line-height:1.9;display:block">'+(reward?('🎁 '+reward):'⭐ 集满 5 颗星：一次亲子活动时间\n⭐⭐ 集满 10 颗星：一次小愿望\n⭐⭐⭐ 连续 4 周全勤：一次特别奖励')+'</div>';
html+='<div class="day">给家长的话</div><div class="row" style="line-height:1.9;display:block">• 每天固定时间提醒，形成习惯<br>• 过程比完成度重要，多鼓励少挑剔<br>• 别因为考试临近就取消家务，责任感是练出来的<br>• 全家一起做，孩子才愿意做</div>';
document.getElementById('out').innerHTML=html.replace(/\n/g,'<br>');
document.getElementById('resultArea').classList.add('active');
}
document.getElementById('genBtn').addEventListener('click',gen);
</script>
</body>
</html>
