<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单位换算器 | AgentGongju.com</title>
<meta name="description" content="免费单位换算工具，支持长度重量温度面积体积数据">
<meta name="keywords" content="单位换算,长度换算,重量换算,温度换算">
<link rel="stylesheet" href="../css/style.css">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:100px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.btn-gen:disabled{opacity:.5;cursor:not-allowed}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.8;white-space:pre-wrap;min-height:60px;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🔄 单位换算器</h1><p>六大类单位一键换算</p></div>

<div class="card"><div class="param-row">
<div><label>单位类型</label><select id="unitType"><option>长度</option><option>重量</option><option>温度</option><option>面积</option><option>体积</option><option>数据</option></select></div></div>
<div class="param-row">
<div><label>数值</label><input type="number" id="value" placeholder="输入数值"></div></div>
<div class="param-row">
<div><label>从</label><select id="fromUnit"></select></div>
<div><label>到</label><select id="toUnit"></select></div></div>
<button class="btn-gen" id="convertBtn">🔄 换算</button></div>
<div class="result-area" id="resultArea"><div class="card"><div class="result-box" id="result"></div></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>

const convTable={'长度':{'毫米':1,'厘米':10,'米':1000,'千米':1000000,'英寸':25.4,'英尺':304.8},
'重量':{'克':1,'千克':1000,'吨':1000000,'斤':500,'磅':453.592,'盎司':28.3495},
'温度':{'celsius':0,'fahrenheit':1,'kelvin':2},
'面积':{'平方米':1,'平方千米':1000000,'亩':666.667,'公顷':10000,'平方英尺':0.0929},
'体积':{'毫升':1,'升':1000,'立方米':1000000,'加仑':3785.41,'立方英尺':28316.8},
'数据':{'字节':1,'KB':1024,'MB':1048576,'GB':1073741824,'TB':1099511627776}};
document.getElementById('unitType').addEventListener('change',updateUnits);
function updateUnits(){const type=document.getElementById('unitType').value;const units=Object.keys(convTable[type]);const opts=units.map(u=>`<option>${u}</option>`).join('');document.getElementById('fromUnit').innerHTML=opts;document.getElementById('toUnit').innerHTML=opts;document.getElementById('toUnit').selectedIndex=1;}
updateUnits();
document.getElementById('convertBtn').addEventListener('click',()=>{
const type=document.getElementById('unitType').value;const val=parseFloat(document.getElementById('value').value);if(isNaN(val)){alert('请输入数值');return}
const from=document.getElementById('fromUnit').value;const to=document.getElementById('toUnit').value;
let result;
if(type==='温度'){let c;if(from==='celsius')c=val;else if(from==='fahrenheit')c=(val-32)*5/9;else c=val-273.15;
if(to==='celsius')result=c;else if(to==='fahrenheit')result=c*9/5+32;else result=c+273.15;result=parseFloat(result.toFixed(4));}
else{const base=convTable[type][from];const target=convTable[type][to];result=parseFloat((val*base/target).toFixed(6));}
document.getElementById('resultArea').classList.add('active');document.getElementById('result').textContent=val+' '+from+' = '+result+' '+to;});

</script>
</body>
</html>
