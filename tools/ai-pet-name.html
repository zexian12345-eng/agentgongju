<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI宠物名字助手 | AgentGongju.com</title>
<meta name="description" content="输入宠物种类、性别与性格，AI为你的猫猫狗狗生成可爱又好记的名字，含英文名与昵称。">
<meta name="keywords" content="宠物名字,猫名字,狗名字,起名,宠物,喵,汪,取名">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:50px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;font-size:.92rem;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.tip{color:#94a3b8;font-size:.85rem;margin-bottom:12px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🐾 AI 宠物名字助手</h1><p>物种 + 性格 + 喜好，帮你的毛孩子起个暖心好名</p></div>

<div class="card">
<div class="param-row">
<div><label>🐶 宠物种类</label>
<select id="pet"><option value="猫" selected>🐱 猫</option><option value="狗">🐶 狗</option><option value="兔子">🐰 兔子</option><option value="仓鼠">🐹 仓鼠/小宠</option><option value="其他">🐾 其他</option></select></div>
<div><label>🎀 宠物性别</label>
<select id="sex"><option value="男" selected>👦 弟弟</option><option value="女">👧 妹妹</option></select></div>
</div>
<label>😺 性格 / 特点（选填）</label>
<textarea id="personality" placeholder="例如：特别黏人、贪吃、爱睡觉、活泼好动、有点高冷…"></textarea>
<div class="param-row">
<div><label>🎨 名字风格</label>
<select id="style"><option value="可爱" selected>🎀 软萌可爱</option><option value="霸气">🦁 霸气有范</option><option value="文艺">🌿 文艺雅致</option><option value="搞笑">😂 搞笑谐音</option></select></div>
<div><label>🔢 数量</label>
<select id="num"><option value="5" selected>5 个</option><option value="8">8 个</option></select></div>
</div>
<button class="btn-gen" id="genBtn">✨ 生成名字</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 为你的毛孩子选的名字</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制名字</button>
<div class="tip" style="margin-top:12px">💡 小贴士：好叫的名字要音节短、开口音多，叫起来响亮又亲切；先在家叫几天，看毛孩子对哪个更有反应。</div>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const pools={
猫:{可爱:['团团','糯米','奶糖','布丁','汤圆','球球'],霸气:['煤球','大王','阿霸','虎啸','镖爷','尊上'],文艺:['玄墨','云舒','青黛','雪梨','拾光','初霁'],搞笑:['饭团','主子','喵总','秃头','胖橘','二哈喵']},
狗:{可爱:['豆豆','旺财','棉花','卷卷','果冻','年糕'],霸气:['将军','雷神','黑龙','金刚','神犬','狼王'],文艺:['如山','江月','清风','山楂','晚风','知夏'],搞笑:['二狗','汪财','吃货','地瓜','泥鳅','哈士奇'],},
兔子:{可爱:['雪球','棉花糖','小萝卜','跳跳','云朵','白兔'],霸气:['闪电兔','兔王','霹雳','炮弹','撸神','兔霸'],文艺:['玉兔','月白','芦苇','竹影','山岚','苏叶'],搞笑:['胡萝卜','呆兔','蹦迪','瑞幸兔','草包','萝卜头']},
仓鼠:{可爱:['汤圆','瓜子','糯米','小软','汤包','栗子'],霸气:['仓霸','滚爷','暴走','突突','铁仓','老仓'],文艺:['麦芽','粟米','青柠','木樨','溪客','南风'],搞笑:['鼠条','陀螺','球王','干饭鼠','跑轮侠','胖墩']},
其他:{可爱:['毛毛','豆豆','糖糖','布丁','小乖','团子'],霸气:['老大','阿王','霸王','战神','铁哥','主上'],文艺:['阿泽','小满','栀夏','晚晴','浅川','子白'],搞笑:['老六','饭桶','二哈','沙雕','呆瓜','皮蛋']}
};
const nickCat={可爱:'小喵喵/乖乖',霸气:'大侠/族长',文艺:'小文艺',搞笑:'小戏精'};
const nickDog={可爱:'汪汪/卡哇伊',霸气:'铁血/大哥大',文艺:'书卷气',搞笑:'整活王'};
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI宠物名字助手 | AgentGongju.com'))return;
const pet=document.getElementById('pet').value;
const sex=document.getElementById('sex').value;
const personality=document.getElementById('personality').value.trim();
const style=document.getElementById('style').value;
const num=parseInt(document.getElementById('num').value);
const pool=pools[pet]||pools['其他'];
const cands=shuffle(pool[style]).slice(0,num);
let out='【'+pet+' · '+sex+'宝贝 · '+style+'风名字】\n\n';
cands.forEach((n,i)=>{
out+='【'+(i+1)+'】'+n+'\n';
out+='· 由来：'+n+' 读起来'+['软糯香甜','简洁响亮','清雅耐听','谐趣好记'][i%4]+'，'+(personality?('很配它「'+personality.slice(0,12)+'」的性格。'):'寓意美好又招人喜欢。')+'\n';
out+='· 英文/小名：'+(pet==='猫'?nickCat:nickDog)[style]||'亲昵小名：'+n+n+'\n\n';
});
out+='【🌱 选名建议】\n· 优先选 1-2 个音节的叠字名，好记易喊；\n· 正式名之外可以配一个日常小名，喊起来更亲切。';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 名字已复制！'))}
</script>
</body>
</html>
