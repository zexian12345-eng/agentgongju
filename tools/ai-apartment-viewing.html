<script>
document.getElementById('genBtn').addEventListener('click',function(){
if(!Paywall.countUse('租房看房避坑清单 | AgentGongju.com'))return;
var type=document.getElementById('type').value;
var focus=document.getElementById('focus').value;
var extra=document.getElementById('extra').value.trim();
var out='【看房必备清单 · '+type+'】\n（建议现场逐项打钩，拍照留证）\n\n';
out+='一、水与热水 ⭐必查\n□ 打开每个水龙头，看水压是否够、出水是否发黄\n□ 热水器出水温度与等待时间（燃气/电，几秒出热水）\n□ 马桶冲水是否顺畅，有无返味\n□ 下水道、地漏排水速度，闻有没有臭味\n\n';
out+='二、电与网络 ⭐必查\n□ 试所有插座是否通电（带个手机充电器）\n□ 空调、洗衣机、冰箱能否正常启动\n□ 电表位置、是否独立电表，电价怎么算\n□ 宽带是否已入户，运营商可选哪家\n\n';
out+='三、墙面与防潮 ⭐必查\n□ 天花板、墙角有无霉斑、水渍、脱皮\n□ 卫生间、厨房墙面是否有渗水痕迹\n□ 阳台、飘窗下雨会不会进水\n\n';
if(type==='老破小'||type==='整租'){
out+='四、安全与门窗\n□ 门锁是否好用，是否可自换锁芯\n□ 窗户能否锁紧，纱窗是否完好\n□ 楼道、消防通道是否通畅\n□ 有没有燃气报警、烟感装置\n\n';
}
if(type==='合租'||type==='公寓'){
out+='四、合租特别项\n□ 公共区域卫生谁负责，有无保洁\n□ 室友作息、性别、是否抽烟养宠\n□ 水电燃气怎么分摊，有无公摊乱收费\n□ 厕所、洗衣机使用是否要排队\n\n';
}
out+='五、周边与通勤\n□ 实测到地铁/公交站步行时间\n□ 早晚高峰通勤耗时（按你的'+focus+'需求重点看）\n□ 楼下有无菜场、便利店、外卖可达\n□ 夜间噪音：临街、临工地、临商铺\n\n';
out+='六、合同与费用 ⚠️最容易被坑\n□ 押金几个月，退还条件是否写清\n□ 是否收中介费、服务费、维修费\n□ 物业费、取暖费谁承担\n□ 提前退租违约金怎么算\n□ 房东是否本人，房产证与身份证是否核验\n□ 所有口头承诺写进合同，别只靠微信聊天\n\n';
if(extra)out+='七、你的特别关注\n□ '+extra.split(/[，,、]/).join('\n□ ')+'\n\n';
out+='【砍价与留证建议】\n1. 看房拍视频存证，尤其发现问题的地方；\n2. 报出小毛病（霉斑、水压不足）作为议价理由；\n3. 谈妥后立刻签合同，别口头锁房不给凭证；\n4. 转账备注“房租+月份”，保留付款记录。';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(function(){alert('✅ 已复制！')})}
