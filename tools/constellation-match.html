<option value="巨蟹">巨蟹座</option><option value="狮子">狮子座</option><option value="处女">处女座</option>

<script>
const TRAIT={
'白羊':'热情直接、行动力强','金牛':'踏实稳重、看重安全感','双子':'机灵善变、爱交流','巨蟹':'心思细腻、重感情',
'狮子':'自信大方、有领导力','处女':'追求完美、细致靠谱','天秤':'优雅友善、重视平衡','天蝎':'深情专注、洞察力强',
'射手':'开朗乐观、爱自由','摩羯':'务实自律、有担当','水瓶':'独立创新、思想前卫','双鱼':'温柔浪漫、想象力丰富'};
const ADV={
'恋人':['浪漫保鲜要靠小惊喜','多沟通别把话憋在心里','给对方留足个人空间','一起规划未来更重要'],
'朋友':['多些真诚的分享','尊重彼此的节奏','是你低谷时的靠山','默契都在日常细节里'],
'暗恋':['多点主动制造独处时刻','真诚比套路更打动人','适时表达心意更勇敢','从他爱好处拉近距离'],
'同事':['分工清楚避免内耗','把共同目标放在首位','沟通勤快效率翻倍','互补优势能事半功倍']};
const SUM={
'恋人':['互补又合拍','性格火花四溅','是彼此的小幸运','天生一对的缘分','需要用心经营','默契十足惹人羡慕'],
'朋友':['相见恨晚的知己','能玩到一起去','关键时刻靠得住','灵魂共鸣的搭子','气氛担当组合','值得深交'],
'暗恋':['有戏！多主动准没错','默契很不错，大胆点','适合日久生情','需要更多相处机会','他/她在意你的话早该发现','把握当下勇敢出击'],
'同事':['黄金搭档组合','配合起来很顺手','能擦出业务火花','适合一起搞事情','互相成就的搭档','配合默契效率高']};
const PICK=[
'正向能量满满，能给彼此鼓劲','三观合拍，聊得来','愿意为彼此改变与成长','懂得表达，让爱看得见',
'偶尔小摩擦，但都是甜味','越磨合越有默契','能读懂对方的欲言又止','是彼此的加分项'];
function pick(a){return a[Math.floor(Math.random()*a.length)];}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('星座婚配指数测试 | AgentGongju.com'))return;
const a=document.getElementById('z1').value;
const b=document.getElementById('z2').value;
const rel=document.getElementById('rel').value;
const mode=document.getElementById('mode').value;
const times=mode==='三次'?3:1;
let out=`💞 ${a} × ${b} — ${rel}默契指数\n\n`;
for(let r=0;r<times;r++){
const score=Math.floor(58+Math.random()*40);
const hearts=Math.round(score/20);
const bar='❤'.repeat(hearts)+'🤍'.repeat(5-hearts);
out+=`【第 ${r+1} 次测算】\n`;
out+=`默契指数：${score} / 100　${bar}\n`;
out+=`· ${a}：${TRAIT[a]}\n`;
out+=`· ${b}：${TRAIT[b]}\n`;
out+=`· 判定：${pick(SUM[rel])}\n`;
out+=`· 相处锦囊：${pick(ADV[rel])}；${pick(PICK)}\n\n`;
}
out+='☁️ 以上内容为 AI 趣味测算，仅供娱乐，真心相处才最珍贵～';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 结果已复制！'))}
</script>
