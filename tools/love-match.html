<script>

document.getElementById('matchBtn').addEventListener('click',()=>{
if(!Paywall.countUse('情侣缘分测试 | AgentGongju.com'))return;
const name1=document.getElementById('name1').value.trim();const name2=document.getElementById('name2').value.trim();
if(!name1||!name2){alert('请输入双方名字');return}
let hash=0;const s=name1+name2;for(let i=0;i<s.length;i++){hash=(hash*31+s.charCodeAt(i))%1000}
const score=55+(hash%45);
const verdict=score>=90?'天作之合，绝配！':(score>=80?'非常般配，天生一对！':(score>=70?'很配哦，要珍惜对方！':(score>=60?'不错的配对，多沟通会更好！':'需要多磨合，用心经营也会幸福！')));
const tags=['默契十足','互补性格','心有灵犀','志趣相投','欢喜冤家','细水长流','甜蜜满分','共同成长'];
const t1=tags[hash%8],t2=tags[(hash*7)%8];
const out='[缘分测试] '+name1+' x '+name2+'\n\n缘分指数：'+score+'%\n'+'*'.repeat(Math.ceil(score/10))+'\n\n'+verdict+'\n 性格互补：'+t1+'\n 相处关键词：'+t2+'\n\n(仅供娱乐)';
document.getElementById('resultArea').classList.add('active');document.getElementById('result').textContent=out;});
