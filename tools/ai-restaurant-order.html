<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI宴请点菜搭配 | AgentGongju.com</title>
<meta name="description" content="根据宴请人数、场景和口味偏好，AI帮你搭配一桌荤素得当、有荤有素有汤、体面又不浪费的菜单，无论是请客、家庭聚餐还是公司团建都适用。">
<meta name="keywords" content="点菜,宴请,菜单搭配,请客吃饭,家庭聚餐,团建,食谱搭配">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
textarea,input[type=text],select{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;font-size:.92rem;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.param-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🍽 AI宴请点菜搭配</h1><p>点菜不踩坑，请客更有面子</p></div>

<div class="card">
<div class="param-grid">
<div><label>👥 就餐人数</label><select id="people"><option value="2">2-3人</option><option value="4">4-6人</option><option value="6">6-8人</option><option value="10">10人以上</option></select></div>
<div><label>🎉 宴请场景</label><select id="occasion"><option value="business">商务宴请</option><option value="family">家庭聚餐</option><option value="friends">朋友聚会</option><option value="team">公司团建</option></select></div>
</div>
<label>🌶 口味偏好</label>
<select id="taste"><option value="balanced">清淡为主</option><option value="spicy">偏辣</option><option value="seafood">喜海鲜</option><option value="meat">无肉不欢</option></select>
<label>📝 预算或忌口（可选）</label>
<input type="text" id="extra" placeholder="例如：人均200以内，有人不吃牛羊肉">
<button class="btn-gen" id="genBtn">🍽 生成菜单搭配</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">🍽 推荐菜单搭配</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制菜单</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const cold=['凉拌黄瓜','口水鸡','凉拌木耳','夫妻肺片','凉拌海蜇丝','白切鸡'];
const hot=['红烧肉','宫保鸡丁','清蒸鲈鱼','蒜蓉虾','回锅肉','麻婆豆腐','水煮鱼','番茄牛腩','糖醋排骨','清炒时蔬'];
const soup=['番茄蛋汤','冬瓜排骨汤','菌菇汤','酸辣汤','老鸭汤','紫菜蛋花汤'];
const staple=['米饭','扬州炒饭','手工水饺','葱油拌面'];
const perDish={2:3,4:5,6:7,10:9}; // 冷热+汤大致道数
document.getElementById('genBtn').addEventListener('click',function(){
if(!Paywall.countUse('AI宴请点菜搭配 | AgentGongju.com'))return;
const people=document.getElementById('people').value;
const occasion=document.getElementById('occasion').value;
const taste=document.getElementById('taste').value;
const extra=document.getElementById('extra').value.trim();
const dishN=perDish[people]||6;
const shuffle=a=>{let arr=a.slice();for(let i=arr.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;};
const colds=shuffle(cold).slice(0,Math.max(1,Math.round(dishN*0.25)));
const hots=shuffle(hot).slice(0,dishN-colds.length);
const soupPick=soup[(Math.random()*soup.length)|0];
const staplePick=staple[(Math.random()*staple.length)|0];
let out='【'+occasionName(occasion)+'菜单搭配】人数：'+peopleName(people)+'｜口味：'+tasteName(taste)+'\n\n';
out+='🧊 凉菜'+(colds.length)+'道：\n'+colds.map(c=>'· '+c).join('\n')+'\n\n';
out+='🍲 热菜'+hots.length+'道：\n'+hots.map(h=>'· '+h).join('\n')+'\n\n';
out+='🥣 汤：'+soupPick+'\n';
out+='🍚 主食：'+staplePick+'\n\n';
if(extra)out+='【备注】'+extra+'\n· 点单前请向服务员确认忌口与菜品分量。\n';
out+='\n【点菜小技巧】\n· 荤素比例建议荤:素≈2:1，冷热搭配、有汤有主食。\n· 商务宴请再加1-2道"看家菜"体面镇场。\n· 菜品别多点，一般人数+2道热菜左右即可，避免浪费。\n· 先点硬菜主食，再加凉菜小食补漏。🍽';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function occasionName(o){return{business:'商务宴请',family:'家庭聚餐',friends:'朋友聚会',team:'公司团建'}[o];}
function peopleName(p){return{2:'2-3人',4:'4-6人',6:'6-8人',10:'10人以上'}[p];}
function tasteName(t){return{balanced:'清淡为主',spicy:'偏辣',seafood:'喜海鲜',meat:'无肉不欢'}[t];}
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 菜单已复制！'))}
</script>
</body>
</html>
