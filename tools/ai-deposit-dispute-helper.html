<meta name="keywords" content="租房押金,押金不退,退租纠纷,房东扣押金,租房维权,12345投诉">

<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,input[type=text],input[type=number],textarea{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px;box-sizing:border-box}
select:focus,input:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;margin-bottom:12px;font-size:.92rem}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chk{display:flex;align-items:center;gap:8px;color:#e2e8f0;font-size:.9rem;margin-bottom:10px}
.chk input{width:auto;margin:0}
.tips{color:#64748b;font-size:.8rem;line-height:1.7;margin-top:6px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>

<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🏠 AI 租房押金退还维权助手</h1><p>被扣押金别忍气，话术+渠道+依据一次给全</p></div>
<div class="card">
<div class="param-row">
<div><label>💰 押金金额（元）</label><input type="number" id="deposit" value="3000" min="0" step="100"></div>
<div><label>🏷 房东/中介名称（可留空）</label><input type="text" id="landlord" placeholder="如 张先生 / 某某公寓"></div>
</div>
<div class="param-row">
<div><label>📌 扣款理由</label>
<select id="reason">
<option value="normal" selected>正常退租，房东无理由不退</option>
<option value="clean">说卫生没打扫干净</option>
<option value="damage">说家具家电损坏</option>
<option value="early">说我提前退租违约</option>
<option value="fee">说还有水电物业费没交</option>
</select></div>
<div><label>🧭 目前阶段</label>
<select id="stage">
<option value="talk" selected>刚提出退押金，还在沟通</option>
<option value="refuse">明确拒绝退还，沟通破裂</option>
<option value="delay">一直拖，说"再等等"</option>
<option value="blocked">已被拉黑，联系不上</option>
</select></div>
</div>
<div><label>🧩 你手上有哪些证据（可多选）</label>
<div class="chk"><input type="checkbox" id="e1" checked><span>租赁合同（纸质或电子）</span></div>
<div class="chk"><input type="checkbox" id="e2" checked><span>押金支付记录（转账/收据）</span></div>
<div class="chk"><input type="checkbox" id="e3"><span>交房时的照片/视频</span></div>
<div class="chk"><input type="checkbox" id="e4" checked><span>微信/短信聊天记录</span></div>
<div class="chk"><input type="checkbox" id="e5"><span>水电燃气缴费凭证</span></div>
</div>
<div class="tips">💡 押金的本质是担保，除合同约定的合理损失外，房东无权随意扣留。举证责任在主张扣款的一方。</div>
<button class="btn-gen" id="genBtn">🔍 生成维权方案</button>
</div>
<div class="result-area" id="resultArea">
<div class="card"><div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制结果</button></div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyResult(){
var t=document.getElementById('outputBox').innerText;
navigator.clipboard.writeText(t).then(function(){alert('已复制到剪贴板');},function(){alert('复制失败，请手动选择');});
}
function gen(){
var dep=parseFloat(document.getElementById('deposit').value)||0;
var landlord=document.getElementById('landlord').value.trim()||'房东/中介';
var reason=document.getElementById('reason').value;
var stage=document.getElementById('stage').value;
var e1=document.getElementById('e1').checked,e2=document.getElementById('e2').checked,e3=document.getElementById('e3').checked,e4=document.getElementById('e4').checked,e5=document.getElementById('e5').checked;
if(dep<=0){alert('请输入押金金额');return;}

var out='════ 押金维权行动方案 ════\n\n';
out+='争议押金：'+dep.toFixed(0)+' 元\n对方主体：'+landlord+'\n\n';

out+='【一、对方扣款的合法性分析】\n';
if(reason==='normal'){
out+='你的情况：无理由不退押金。\n✅ 结论：这是最典型的违约，法律上你几乎必然胜诉。\n· 合同到期正常退租，押金应当全额返还\n· 房东若主张扣款，必须举证实际损失，否则无权扣留\n';
}else if(reason==='clean'){
out+='你的情况：以"卫生不达标"为由扣款。\n⚠️ 结论：可扣但必须合理、且需证明。\n· 清洁费一般以实际发生为准，通常几十到两百元\n· 房东不能以此为由全额没收押金\n· 合同若无明确约定清洁标准，扣款依据薄弱\n';
}else if(reason==='damage'){
out+='你的情况：以"物品损坏"为由扣款。\n⚠️ 结论：需要区分自然损耗与人为损坏。\n· 家具家电的正常老化、磨损属于自然损耗，不能算你头上\n· 房东需提供损坏照片、维修报价或发票\n· 无证据的估价扣款，你有权拒绝\n';
}else if(reason==='early'){
out+='你的情况：以"提前退租违约"为由扣款。\n⚠️ 结论：需看合同约定的违约金条款。\n· 违约金一般不超过 1 个月租金，且不能既收违约金又扣全部押金\n· 若合同约定过高，可主张调减\n· 若房东已另行出租、无实际损失，主张全额违约金较难被支持\n';
}else{
out+='你的情况：以"欠缴水电物业费"为由扣款。\n✅ 结论：这部分是合理的，但需提供账单。\n· 要求对方出具缴费凭证和明细\n· 只能是实际欠缴金额，不能顺手多扣\n· 结清后剩余押金必须退还\n';
}

out+='\n【二、证据自检】\n';
if(e1){out+='✅ 有合同 → 重点看押金条款、违约金条款、清洁/损坏约定\n';}else{out+='❌ 缺合同 → 尽快找房东要复印件或拍照片，聊天记录里提到租金的也可佐证\n';}
if(e2){out+='✅ 有支付记录 → 这是证明押金存在的关键，务必截图保存\n';}else{out+='❌ 缺支付凭证 → 查微信/支付宝/银行流水，找当初的转账记录\n';}
if(e3){out+='✅ 有交房照片 → 证明入住时状态，最有力的反证\n';}else{out+='⚠️ 无交房照片 → 用入住时的聊天记录、朋友圈等间接证明房屋原状\n';}
if(e4){out+='✅ 有聊天记录 → 不要删！这是证明对方拒绝退还的直接证据\n';}
if(e5){out+='✅ 有缴费凭证 → 可证明不欠费\n';}
out+='💡 所有证据立刻做三份备份：手机截图、发到自己邮箱、存网盘。\n';

out+='\n【三、第一步：正式沟通话术】\n';
out+='（可直接复制发给 '+landlord+'，语气平和但立场明确）\n\n';
out+='您好，我是'+landlord+'处 XX 房的租客，已于 X 月 X 日办理退租并交还钥匙。\n';
out+='按合同约定，押金 '+dep.toFixed(0)+' 元应在退租后 X 日内返还。\n';
if(reason!=='fee'){
out+='您提到的扣款理由，我这边有交房照片和聊天记录可以核对。\n';
out+='如确属我造成的损失，请提供维修发票或收费凭证，我愿意承担合理部分；\n';
}else{
out+='如确有欠费，请提供水电/物业的缴费凭证，我核对后立即结清；\n';
}
out+='除此之外的押金，请在 3 个工作日内退还至我的账户：\n';
out+='收款人：XXX  账号：XXX  开户行：XXX\n';
out+='逾期未退，我将通过 12345 和住建部门投诉，并保留诉讼权利。谢谢配合。\n';

out+='\n【四、第二步：投诉渠道（按顺序推进）】\n';
out+='1️⃣ 12345 市民热线 —— 说明"租赁押金纠纷"，会转住建/房管部门\n';
out+='2️⃣ 当地住房和城乡建设局 / 房屋租赁管理所 —— 中介违规可吊销备案\n';
out+='3️⃣ 12315 市场监管 —— 针对中介公司的服务纠纷\n';
out+='4️⃣ 全国住房租赁服务平台 —— 线上提交投诉\n';
out+='5️⃣ 人民法院在线服务小程序 —— 直接网上立案，小额诉讼成本低\n';
if(stage==='blocked'){
out+='⚠️ 你已被拉黑：不必再等，直接进入投诉+立案流程，同时向派出所反映"恶意占有"情况。\n';
}else if(stage==='delay'){
out+='⚠️ 对方在"拖"：固定证据后书面催告（微信邮件皆可），催告满 15 日仍不退即可投诉。\n';
}
out+='\n【五、第三步：法律依据（投诉时可直接引用）】\n';
out+='· 《民法典》第 703 条：租赁合同应约定押金，无约定或约定不明应按交易习惯返还\n';
out+='· 《民法典》第 577 条：一方不履行合同义务，应承担继续履行、赔偿损失等违约责任\n';
out+='· 《民法典》第 721 条：承租人按约定使用租赁物致损耗的，不承担赔偿责任\n';
out+='· 各地住房租赁条例：中介/房东不得无故扣留押金\n';

out+='\n【六、时间表建议】\n';
out+='第 1~3 天：正式书面沟通，留痕\n';
out+='第 4~10 天：未回应则投诉 12345 + 住建\n';
out+='第 11~20 天：仍无果则法院网上立案（'+dep.toFixed(0)+' 元可用小额诉讼，一审终审）\n';
out+='第 20 天后：判决生效可申请强制执行\n';

out+='\n⚠️ 温馨提醒：金额再小也值得主张，实践中多数房东收到 12345 工单后就会主动退款。\n';
out+='本方案为自助维权参考，具体以实际合同和当地法规为准。';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
document.getElementById('resultArea').scrollIntoView({behavior:'smooth'});
}
document.getElementById('genBtn').addEventListener('click',gen);
</script>
