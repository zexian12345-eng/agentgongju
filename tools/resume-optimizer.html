<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 简历优化 | AgentGongju.com</title>
<meta name="description" content="AI简历优化工具，将大白话工作经历改写成专业量化表达，提升求职竞争力">
<meta name="keywords" content="简历优化,求职简历,AI改简历,简历润色">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:100px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.8;white-space:pre-wrap;min-height:60px;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
.score{display:inline-block;background:rgba(34,197,94,0.15);color:#4ade80;padding:4px 12px;border-radius:20px;font-size:.85rem;font-weight:600;margin-left:8px}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>📄 AI 简历优化</h1><p>把大白话经历改写成专业量化的简历表达</p></div>

<div class="card"><label>💼 求职方向 / 目标岗位</label>
<input type="text" id="job" placeholder="例如：产品经理 / 运营 / Java开发 / 市场营销">
<label>📝 原始经历（每行一条，用大白话描述即可）</label>
<textarea id="exp" placeholder="例如：
我负责公司的公众号运营，写了挺多文章
做过一些活动的策划和执行
日常维护几个用户群，回答用户问题"></textarea>
<div class="param-row"><div><label>简历风格</label><select id="tone"><option value="量化">量化结果导向</option><option value="专业">专业稳重</option><option value="简洁">极简精炼</option></select></div><div><label>目标级别</label><select id="lvl"><option value="初级">初级岗位</option><option value="中级">中级岗位</option><option value="高级">高级岗位</option></select></div></div>
<button class="btn-gen" id="genBtn">✨ 优化简历经历</button></div>
<div class="result-area" id="resultArea"><div class="card"><div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 优化后的经历表达</div>
<div id="outBox"></div></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyResult(){navigator.clipboard.writeText(document.getElementById('outBox').textContent).then(()=>alert('✅ 已复制！'))}
const gold=['主导','负责','统筹','落地','产出','搭建','优化','复盘','赋能','驱动'];
const verbs={运营:'负责公众号日常运营，持续输出高质量内容，阅读量稳定提升20%+',活动:'统筹策划系列活动并推进落地，单场参与人次超预期达成目标',用户:'搭建并维护核心用户社群，通过精细化运营提升用户活跃与转介绍率'};
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 简历优化 | AgentGongju.com'))return;
const job=document.getElementById('job').value.trim()||'目标岗位';
const exp=document.getElementById('exp').value.trim();if(!exp){alert('请输入原始经历');return}
const tone=document.getElementById('tone').value;const lvl=document.getElementById('lvl').value;
const lines=exp.split('\n').filter(l=>l.trim());let html='';
lines.forEach((line,i)=>{
  const kw=line.includes('公众号')?'运营':line.includes('活动')?'活动':line.includes('用户')||line.includes('群')?'用户':(line.length>8?'运营':'活动');
  const template=verbs[kw]||verbs.运营;
  const factor=(i%3===0?'20%+ ':i%3===1?'30%+ ':'两倍 ');
  const quant=tone==='量化'?'（'+factor+'左右）':'';
  const lead=tone==='专业'?gold[i%gold.length]+'团队':'深入参与推进';
  html+='<div class="result-box"><span style="color:#a5b4fc">▪ 负责事项：</span>「'+line.trim()+'」<br><br><span style="color:#22c55e">✔ 优化表达（'+lvl+' · '+tone+'）：</span><br>'+lead+'相关业务，'+template+quant+'。<br><br><span style="color:#94a3b8">💡 建议补充：具体数据、周期、可量化成果，示例中的数字请替换为你的真实结果。</span></div>';
});
document.getElementById('resultArea').classList.add('active');
document.getElementById('outBox').innerHTML=html;
});
</script>
</body>
</html>
