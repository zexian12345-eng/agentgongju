<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 合租账单结算计算器</title>
<meta name="description" content="合租/聚会对账工具：房租、水电燃气、公共费用与押金按房间占比与人头自动均摊，并给出最少笔互相转账方案。">
<meta name="keywords" content="合租对账,AA制,房租分摊,水电计算,账单结算">
<meta name="robots" content="index,follow">
<link rel="stylesheet" href="../css/style.css"><script src="../js/paywall.js"></script>
<style>
body{background:#0f0a1a;color:#e2e8f0}
.tool-container{max-width:780px;margin:40px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:32px}
.tool-header h1{font-size:2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:24px;margin-bottom:18px}
.card h3{font-size:1rem;margin-top:0;color:#e9d5ff}
.field input,.field select,.field > div{padding:10px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:9px;color:#e2e8f0;font-size:.88rem;font-family:inherit;width:100%;box-sizing:border-box}
.field input:focus,.field select:focus{outline:none;border-color:#6366f1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g4{display:grid;grid-template-columns:2fr 1fr 2fr;gap:10px;margin-bottom:10px}
.addline{width:100%;padding:9px;border:1px dashed #7c3aed;background:rgba(124,58,237,.08);color:#c4b5fd;border-radius:9px;cursor:pointer;font-family:inherit;font-size:.9rem;text-align:center}
.addline:hover{background:rgba(124,58,237,.18)}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:#fff;font-weight:700;font-size:1rem;cursor:pointer;margin-top:6px}
.btn-gen:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(99,102,241,.35)}
.result-area{display:none;margin-top:10px}
.result-area.show{display:block}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{color:#a5b4fc;text-align:left;padding:8px;border-bottom:1px solid rgba(99,102,241,.25);font-weight:600}
td{color:#e6e6ea;padding:8px;border-bottom:1px solid rgba(255,255,255,.05)}
.total-row td{color:#fff;font-weight:700;border-bottom:none;background:rgba(99,102,241,.12)}
.flow{margin-top:14px;background:rgba(168,85,247,.08);border:1px solid rgba(168,85,247,.3);border-radius:12px;padding:16px;color:#f5d0fe;font-size:.92rem;line-height:2}
.flow b{color:#fff}
.hint{font-size:.76rem;color:#94a3b8;margin-top:12px;line-height:1.8}
.rm{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);color:#fca5a5;border-radius:8px;height:38px;width:38px;cursor:pointer;font-size:1.1rem;font-family:inherit}
.rm:hover{background:rgba(239,68,68,.25)}
@media(max-width:600px){.g2,.g4{grid-template-columns:1fr}}
</style>
<script>

<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🧾 合租账单结算计算器</h1><p>房租按房间、水电按人头，押金另算，自动生成谁转谁</p></div>
<div class="card">
<h3>🏠 房间与室友</h3>
<div id="rooms"></div>
<button class="addline" id="addRoom">＋ 添加一间房</button>
</div>
<div class="card">
<h3>💵 本期账单</h3>
<div id="bills"></div>
<label style="color:#94a3b8;font-size:.8rem">勾选“含押金”后会在结果里把押金按房间平分</label>
<div id="billRows"></div>
<button class="btn-gen" id="gen">开始结算</button>
</div>
<div class="result-area" id="out">
 <div class="card">
  <div id="tbl"></div>
  <div id="flow"></div>
 </div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function rmRow(btn){const c=btn.closest('.row');c&&c.remove();rebuild();}
function rebuild(){
  // 若无房，给提示
}
function addRoomRow(){
  const g=document.getElementById('rooms');
  const d=document.createElement('div');d.className='g4 row';
  d.innerHTML=`<input class="rn" placeholder="姓名/昵称" value="室友${g.children.length+1}">
   <input class="pp" type="number" min="1" value="1" title="建筑面积?实际住几人" placeholder="几人住">
   <select class="sm"><option value="people">水电按人头</option><option value="room">水电按房间</option></select>
   <button class="rm" onclick="rmRow(this)">✕</button>`;
  g.appendChild(d);
}
[1,2,3].forEach(addRoomRow);
document.getElementById('addRoom').onclick=function(){addRoomRow();};
// 账单默认行
function addBillRow(name,val,kind){
  const c=document.createElement('div');c.style.cssText='display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;margin-bottom:10px';
  c.className='row';
  c.innerHTML=`<input class="bn" placeholder="项目(如电费)" value="${name}"><input class="bv" type="number" value="${val}">
   <select class="bk"><option value="util" ${kind==='util'?'selected':''}>公共(水电宽带)</option><option value="rent" ${kind==='rent'?'selected':''}>房租</option><option value="dep" ${kind==='dep'?'selected':''}>押金</option></select>
   <button class="rm" onclick="rmRow(this)">✕</button>`;
  document.getElementById('billRows').appendChild(c);
}
addBillRow('房租',4600,'rent');addBillRow('水电燃气',420,'util');addBillRow('押金',4600,'dep');
document.getElementById('gen').addEventListener('click',function(){
  if(!Paywall.countUse('AI 合租账单结算计算器'))return;
  const rms=[...document.querySelectorAll('#rooms .row')];
  const billEls=[...document.querySelectorAll('#billRows .row')];
  if(!rms.length||!billEls.length){alert('至少保留一间房和一条账目');return;}
  const rooms=rms.map(r=>({name:(r.querySelector('.rn').value.trim())||'室友',people:parseInt(r.querySelector('.pp').value)||1,mode:r.querySelector('.sm').value}));
  const bills=billEls.map(b=>({n:b.querySelector('.bn').value||'项目',v:parseFloat(b.querySelector('.bv').value)||0,k:b.querySelector('.bk').value}));
  // 校验
  const depTotal=bills.filter(b=>b.k==='dep').reduce((s,b)=>s+b.v,0);
  // 累计每个房间应付
  const n=rooms.length;
  const totPeople=rooms.reduce((s,r)=>s+r.people,0);
  const utilByKind={ 'people':0,'room':0 };
  rooms.forEach(r=>{ const key=r.mode==='room'?'room':'people'; utilByKind[key]+=0;});
  // 计算每房
  const amounts=rooms.map(r=>{
    const shares=bills.map(function(b){
      if(b.k==='rent')return {name:b.n,per:r.rentShare?0:0,v:b.v/n};
      if(b.k==='dep')return {name:b.n,per:0,v:b.v/n};
      // util
      if(r.mode==='room')return {name:b.n,per:0,v:b.v/n};
      return {name:b.n,per:1,v:b.v*(r.people/totPeople)};
    });
    // 汇总
    let total=shares.reduce((s,x)=>s+x.v,0);
    return {name:r.name,mode:r.mode,people:r.people,total:rnd(total),parts:shares};
  });
  // 展示
  const tot=amounts.reduce((s,a)=>s+a.total,0);
  let h='<table><tr><th>室友</th><th>分摊规则</th><th>应付</th></tr>';
  amounts.forEach(a=>{h+=`<tr><td>${a.name}</td><td style="font-size:.78rem;color:#94a3b8">${a.mode==='room'?'水电按房间':'水电按人头'} · ${a.people}人</td><td><b style="color:#a855f7">¥${a.total}</b></td></tr>`;});
  h+=`<tr class="total-row"><td colspan="2">合计</td><td>¥${rnd(tot)}</td></tr></table>`;
  document.getElementById('tbl').innerHTML=h;
  // 最少转账: 取人均，正为应收组合给出
  const avg=tot/n;
  const ds=amounts.map(a=>({name:a.name,total:a.total,delta:rnd(a.total-avg)}));
  const owe=ds.filter(x=>x.delta>0);const recv=ds.filter(x=>x.delta<0);
  recv.forEach(r=>r.left=rnd(-r.delta));
  let text='';
  owe.forEach(o=>{let remain=o.delta;
    recv.forEach(r=>{if(remain<=0.01||r.left<=0.01)return;const pay=rnd(Math.min(remain,r.left));r.left=rnd(r.left-pay);remain=rnd(remain-pay);if(pay>0.01)text+=`${o.name}  → 给 ${r.name}  ¥${pay}\n`;});
  });
  const fl=document.createElement('pre');fl.style.cssText='white-space:pre-wrap;font-family:inherit;color:#f0abfc;line-height:1.9';
  fl.textContent=text.length?('建议相互转账（人均分摊后差额）:\n'+text):'大家刚好扯平，无需转账 ✅';
  document.getElementById('flow').innerHTML='';document.getElementById('flow').appendChild(fl);
  document.getElementById('out').classList.add('show');
  document.getElementById('out').scrollIntoView({behavior:'smooth'});
});
function rnd(x){return Math.round(x*100)/100;}
</script>
</body>
</html>
