out+='━━ 整体概况 ━━\n'+zodiac+'的你自带「'+trait+'」的气质，'+span+'整体能量偏'+['上行','平稳','充满机遇','起伏中前行'][(new Date().getDay()+zodiac.length)%4]+'，适合以「'+keyword+'」的态度去推进手头事务。\n\n';
