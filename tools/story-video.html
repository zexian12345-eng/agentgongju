<style>
.tool-container { max-width: 1000px; margin: 100px auto 60px; padding: 0 20px; }
.tool-header { text-align: center; margin-bottom: 40px; }
.tool-header h1 { font-size: 2.2rem; background: linear-gradient(135deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
.tool-header p { color: #94a3b8; }
.card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 30px; margin-bottom: 24px; }
.card label { display: block; color: #e2e8f0; margin-bottom: 8px; font-weight: 500; }
textarea { width: 100%; min-height: 100px; padding: 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #e2e8f0; font-size: 0.95rem; resize: vertical; outline: none; font-family: inherit; }
textarea:focus { border-color: #6366f1; }
textarea::placeholder { color: #64748b; }
.upload-imgs { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
.upload-imgs .img-box { width: 80px; height: 80px; border-radius: 8px; border: 2px dashed rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; cursor: pointer; color: #64748b; font-size: 1.5rem; transition: all 0.2s; overflow: hidden; }
.upload-imgs .img-box:hover { border-color: #6366f1; }
.upload-imgs .img-box img { width: 100%; height: 100%; object-fit: cover; }
.upload-imgs .img-box .del { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; background: #ef4444; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; cursor: pointer; }
.param-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
select { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #e2e8f0; font-size: 0.9rem; outline: none; }
select:focus { border-color: #6366f1; }
.style-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.style-btn { padding: 8px 14px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.03); color: #cbd5e1; border-radius: 8px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
.style-btn:hover { border-color: #6366f1; background: rgba(99,102,241,0.1); }
.style-btn.active { border-color: #6366f1; background: rgba(99,102,241,0.2); color: #a5b4fc; }
.btn-generate { width: 100%; padding: 14px; background: linear-gradient(135deg, #6366f1, #a855f7); border: none; border-radius: 12px; color: white; font-size: 1.05rem; font-weight: 600; cursor: pointer; transition: all 0.3s; }
.btn-generate:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(99,102,241,0.3); }
.btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }
/* 流程步骤 */
.process-area { display: none; margin-top: 30px; }
.process-area.active { display: block; }
.process-step { display: flex; align-items: center; gap: 16px; padding: 16px 20px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 10px; margin-bottom: 8px; opacity: 0.4; transition: all 0.3s; }
.process-step.active { opacity: 1; border-color: rgba(99,102,241,0.3); background: rgba(99,102,241,0.05); }
.process-step.done { opacity: 0.8; border-color: rgba(34,197,94,0.3); background: rgba(34,197,94,0.05); }
.process-step .icon { font-size: 24px; width: 40px; text-align: center; }
.process-step .info { flex: 1; }
.process-step .info .title { color: #e2e8f0; font-weight: 500; }
.process-step .info .desc { color: #94a3b8; font-size: 0.85rem; }
.process-step .status-icon { font-size: 20px; }
.result-area { display: none; margin-top: 30px; }
.result-area.active { display: block; }
.result-video { width: 100%; max-height: 450px; border-radius: 12px; background: #000; }
.result-actions { display: flex; gap: 12px; margin-top: 15px; }
.result-actions a { flex: 1; text-align: center; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: 500; }
.btn-download { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; }
@media (max-width: 768px) { .param-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<nav class="navbar">
  <div class="nav-inner">
    <a href="../" class="logo">🛠 AgentGongju</a>
    <div class="nav-links">
      <a href="../">首页</a>
      <a href="../#tools">工具</a>
      <a href="image-to-video.html">图转视频</a>
      <a href="text-to-video.html">文生视频</a>
    </div>
  </div>
</nav>

<div class="tool-container">
  <div class="tool-header">
    <h1>📖→🎬 AI 故事视频生成器</h1>
    <p>输入故事文案或上传图片，自动生成完整的视频故事（含画面 + BGM + 配音）</p>
  </div>

  <div class="card">
    <label>📝 故事文案（或图片描述）</label>
    <textarea id="storyInput" placeholder="写一段故事或文案，AI 会帮你分镜并制作成视频...&#10;&#10;例如：&#10;在一个宁静的小镇，每天清晨阳光都会洒在古老的石板路上。&#10;一位老爷爷在街角的茶馆里泡茶，茶香飘满了整条街道..."></textarea>
  </div>

  <div class="card">
    <label>🖼️ 上传图片（可选）</label>
    <div class="upload-imgs" id="uploadImgs">
      <div class="img-box" id="addImgBtn" style="position:relative">+</div>
    </div>
    <input type="file" id="imgInput" accept="image/jpeg,image/png" multiple style="display:none">
    <div class="param-row">
      <div>
        <label style="color:#94a3b8;font-size:0.85rem;margin-bottom:4px;">🎨 风格</label>
        <select id="styleSelect">
          <option value="写实">写实</option>
          <option value="动漫">动漫</option>
          <option value="吉卜力">吉卜力</option>
          <option value="赛博朋克">赛博朋克</option>
          <option value="水彩">水彩</option>
          <option value="油画">油画</option>
        </select>
      </div>
      <div>
        <label style="color:#94a3b8;font-size:0.85rem;margin-bottom:4px;">⏱ 视频时长</label>
        <select id="duration">
          <option value="24">24 秒（4 段）</option>
          <option value="48" selected>48 秒（8 段，推荐）</option>
          <option value="72">72 秒（12 段）</option>
        </select>
      </div>
    </div>
  </div>

  <button class="btn-generate" id="generateBtn">🎬 生成故事视频</button>

  <!-- 生成流程 -->
  <div class="process-area" id="processArea">
    <div class="process-step" id="step1">
      <div class="icon">📝</div>
      <div class="info"><div class="title">生成故事脚本</div><div class="desc">AI 分析内容，生成分镜脚本</div></div>
      <div class="status-icon">⏳</div>
    </div>
    <div class="process-step" id="step2">
      <div class="icon">🎨</div>
      <div class="info"><div class="title">生成画面帧</div><div class="desc">为每个分镜生成画面</div></div>
      <div class="status-icon">⏳</div>
    </div>
    <div class="process-step" id="step3">
      <div class="icon">🎬</div>
      <div class="info"><div class="title">生成视频片段</div><div class="desc">将画面转为动态视频</div></div>
      <div class="status-icon">⏳</div>
    </div>
    <div class="process-step" id="step4">
      <div class="icon">🎵</div>
      <div class="info"><div class="title">添加背景音乐</div><div class="desc">自动匹配风格 BGM</div></div>
      <div class="status-icon">⏳</div>
    </div>
    <div class="process-step" id="step5">
      <div class="icon">🔗</div>
      <div class="info"><div class="title">合成最终视频</div><div class="desc">画面 + BGM + 配音合成</div></div>
      <div class="status-icon">⏳</div>
    </div>
  </div>

  <div class="result-area" id="resultArea">
    <div class="card">
      <div style="text-align:center;margin-bottom:15px;color:#22c55e;font-weight:600;font-size:1.1rem">✅ 故事视频制作完成！</div>
      <video class="result-video" id="resultVideo" controls></video>
      <div class="result-actions">
        <a class="btn-download" id="downloadBtn" download="story-video.mp4">⬇️ 下载视频</a>
        <a class="btn-download" style="background:linear-gradient(135deg,#f59e0b,#eab308)" href="javascript:void(0)" onclick="alert('📱 扫码关注公众号，获取更多免费AI工具！')">📱 更多工具</a>
      </div>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="footer-inner">
    <p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p>
  </div>
</footer>

<script>
let uploadedImages = [];

document.getElementById('addImgBtn').addEventListener('click', () => document.getElementById('imgInput').click());
document.getElementById('imgInput').addEventListener('change', e => {
  for(const file of e.target.files) {
    if(uploadedImages.length >= 9) break;
    const reader = new FileReader();
    reader.onload = ev => {
      uploadedImages.push(ev.target.result);
      renderImages();
    };
    reader.readAsDataURL(file);
  }
});

function renderImages() {
  const container = document.getElementById('uploadImgs');
  container.innerHTML = uploadedImages.map((src, i) =>
    '<div class="img-box" style="position:relative;border-style:solid;border-color:rgba(99,102,241,0.3)">'
    + '<img src="' + src + '">'
    + '<div class="del" onclick="removeImage(' + i + ')">✕</div>'
    + '</div>'
  ).join('');
  container.innerHTML += '<div class="img-box" id="addImgBtn" style="position:relative">+</div>';
  document.getElementById('addImgBtn').addEventListener('click', () => document.getElementById('imgInput').click());
}

function removeImage(i) {
  uploadedImages.splice(i, 1);
  renderImages();
}

let currentStep = 0;
function updateStep(n, status) {
  const step = document.getElementById('step' + n);
  if(!step) return;
  step.className = 'process-step ' + status;
  const icon = step.querySelector('.status-icon');
  if(status === 'active') icon.textContent = '⏳';
  else if(status === 'done') icon.textContent = '✅';
}

document.getElementById('generateBtn').addEventListener('click', async () => {
if(!Paywall.countUse('AI故事视频生成器 - 文字图片一键成片 | AgentGongju.com'))return;
  const story = document.getElementById('storyInput').value.trim();
  if(!story && uploadedImages.length === 0) { alert('请输入故事文案或上传图片！'); return; }

  const btn = document.getElementById('generateBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 故事视频制作中...';
  document.getElementById('processArea').classList.add('active');

  // 模拟流程
  currentStep = 0;
  const steps = ['step1','step2','step3','step4','step5'];
  const delay = ms => new Promise(r => setTimeout(r, ms));

  for(let i = 0; i < steps.length; i++) {
    updateStep(i+1, 'active');
    await delay(1500 + Math.random() * 2000);
    updateStep(i+1, 'done');
  }

  try {
    const res = await fetch('/api/story-video', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        story,
        images: uploadedImages,
        style: document.getElementById('styleSelect').value,
        duration: parseInt(document.getElementById('duration').value)
      })
    });
    const data = await res.json();

    if(data.success && data.video_url) {
      document.getElementById('resultArea').classList.add('active');
      document.getElementById('resultVideo').src = data.video_url;
      document.getElementById('downloadBtn').href = data.video_url;
    } else {
      alert('生成失败: ' + (data.error || '请稍后重试'));
    }
  } catch(err) {
    alert('网络错误: ' + err.message + '\n（提示：本功能为预览版，正式版即将上线）');
  } finally {
    btn.disabled = false;
    btn.textContent = '🎬 生成故事视频';
  }
});
</script>
</body>
</html>
