.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}

.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}

.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,input[type=text],input[type=number],textarea{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px;box-sizing:border-box}
select:focus,input:focus,textarea:focus{border-color:#6366f1}

<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>📱 AI 手机话费套餐体检</h1><p>算清单位成本，看你的套餐是不是该换了</p></div>
<div class="card">
<div class="param-row">
<div><label>💰 每月实际话费（元）</label><input type="number" id="fee" value="99" min="0" step="1"></div>
<div><label>📶 每月用掉的流量（GB）</label><input type="number" id="data" value="15" min="0" step="1"></div>
</div>
<div class="param-row">
<div><label>📞 每月通话时长（分钟）</label><input type="number" id="voice" value="100" min="0" step="10"></div>
<div><label>🏢 运营商</label>
<select id="isp"><option value="mobile">中国移动</option><option value="unicom" selected>中国联通</option><option value="telecom">中国电信</option><option value="virtual">虚拟运营商（京东/阿里等）</option></select></div>
</div>
<div class="param-row">
<div><label>📅 当前套餐用了多久</label>
<select id="age"><option value="lt6">不到半年</option><option value="6_24" selected>半年到 2 年</option><option value="2_5">2-5 年</option><option value="gt5">5 年以上没动过</option></select></div>
<div><label>🎯 主要用途</label>
<select id="use"><option value="normal" selected>日常通勤刷手机</option><option value="video">重度刷视频/直播</option><option value="game">打游戏，在意延迟</option><option value="hotspot">经常开热点给电脑用</option><option value="elder">主要是家人用，很少上网</option></select></div>
</div>
<div><label>📊 流量够用吗？</label>
<select id="enough"><option value="tight" selected>经常不够，要买加油包</option><option value="just">刚刚好，月底有点紧</option><option value="extra">用不完，剩很多</option></select></div>
<div class="tips">💡 数据可在运营商 App「已订业务 / 账单」里查看，用最近 3 个月平均值最准。</div>
<button class="btn-gen" id="genBtn">🔍 生成体检报告</button>
</div>
<div class="result-area" id="resultArea">
<div class="card"><div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制报告</button></div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function gen(){
var fee=parseFloat(document.getElementById('fee').value)||0;
var data=parseFloat(document.getElementById('data').value)||0;
var voice=parseFloat(document.getElementById('voice').value)||0;
var isp=document.getElementById('isp').value;
var age=document.getElementById('age').value;
var use=document.getElementById('use').value;
var enough=document.getElementById('enough').value;
var ispName={mobile:'中国移动',unicom:'中国联通',telecom:'中国电信',virtual:'虚拟运营商'}[isp];
var perG=data>0?(fee/data).toFixed(1):'—';
var perMin=voice>0?(fee/voice).toFixed(2):'—';
var out='════ 手机话费套餐体检报告 ════\n\n';
out+='运营商：'+ispName+'\n';
out+='月费：'+fee+' 元 ｜ 流量：'+data+' GB ｜ 通话：'+voice+' 分钟\n\n';
out+='──── 📐 单位成本分析 ────\n';
out+='每 GB 流量成本：'+perG+' 元/GB\n';
out+='每分钟通话成本：'+perMin+' 元/分钟\n';
out+='年支出估算：'+(fee*12).toFixed(0)+' 元\n\n';
if(perG!=='—'&&parseFloat(perG)>6){
out+='⚠️ 你的流量单价偏高（>6 元/GB）。目前市场主流套餐流量单价在 1-3 元/GB，说明你多半在为\"闲置的通话分钟\"或\"老旧套餐结构\"多付钱。\n';
}else if(perG!=='—'&&parseFloat(perG)<=2&&data>=20){
out+='✅ 流量单价很划算（≤2 元/GB），属于大流量套餐，别轻易动。\n';
}else if(perG!=='—'){
out+='🟡 流量单价处于中等水平，可以再优化，但不是特别亏。\n';
}
out+='\n──── 🧮 你的用量画像 ────\n';
if(data<=5&&voice<=50)out+='低用量型：你其实只需要\"保号 + 小额流量包\"。\n💡 建议方向：8 元保号套餐 + 单独买流量包/流量卡，月支出可压到 20-30 元。\n';
else if(data>=30)out+='大流量型：你的核心需求是流量。\n💡 建议方向：直接找运营商在售的 29-39 元大流量套餐（100GB 左右），或办第二张纯流量卡专供上网。\n';
else if(voice>300)out+='语音为主型：通话量大且月费高的话，考虑商务套餐或企业号。\n💡 建议方向：运营商的\"语音包\"单价通常比套餐外 0.15-0.25 元/分钟便宜不少。\n';
else out+='标准用量型：流量和通话都不极端，适合选\"均衡套餐\"（如 39-59 元含 30GB+300 分钟）。\n';
out+='\n──── 🔄 关于换套餐 ────\n';
if(age==='gt5'||age==='2_5'){
out+='⏰ 你的套餐已经用了很久，这是最大的问题：老用户套餐往往比新用户贵且流量少。\n';
out+='运营商的新优惠通常只给\"新入网用户\"，老用户不主动问就不会给。\n';
}else if(age==='lt6'){
out+='刚办不久的话，违约金可能还没到期，先确认合约期再动。\n';
}else out+='用了 1-2 年，是可以考虑比较新套餐的时点了。\n';
out+='\n──── 💡 实操省钱四步 ────\n';
out+='① 打客服电话，直接说三句话：\n';
out+='   \"我想看看有没有更适合我的在售套餐\"\"帮我查一下合约期\"\"如果不改套餐有没有老用户优惠\"\n';
out+='   —— 这一步往往能直接拿到流量翻倍或 10-30 元减免。\n';
out+='② 谈不下来就说\"考虑携号转网\"，大概率会被转接\"挽留专席\"，优惠力度通常更大。\n';
out+='③ 合约到期就换：把主卡降到最低保号套餐（8-19 元），另办一张纯流量卡上网。这是目前最主流的省钱组合。\n';
out+='④ 查\"隐形扣费\"：在运营商 App 的\"已订业务\"里，把彩铃、沃家云盘、天气短信、会员包等不需要的统统退掉，每月能省 10-30 元。\n';
out+='\n──── 🎯 针对你的用途建议 ────\n';
if(use==='video')out+='重度刷视频：优先选大流量套餐；也可以看看运营商的\"定向流量包\"（很多视频 App 免流），但你现在的月费若已超 60 元，直接换大流量套餐更简单。';
else if(use==='game')out+='打游戏：别只看流量大小，也要看信号覆盖。换运营商前先借朋友同运营商的卡在你常待的地方测速看延迟，否则省钱换网却卡顿得不偿失。';
else if(use==='hotspot')out+='经常开热点：热点极其耗流量，务必选\"热点不限量/大流量\"套餐。部分低价流量卡会在热点共享上有限制，办卡前一定问清楚。';
else if(use==='elder')out+='家人用、少上网：直接降级到 8-19 元保号套餐最划算，长辈根本用不到大流量。';
else out+='日常通勤：注意家里和公司有没有 WiFi，两点一线都有 WiFi 的话流量需求其实很小，可以放心降档。';
out+='\n\n──── ✅ 本月行动清单 ────\n';
out+='□ 打开运营商 App 查\"已订业务\"，退掉不需要的增值服务\n';
out+='□ 记录近 3 个月平均流量和通话用量（截图留证）\n';
out+='□ 打客服问在售套餐 + 合约到期时间\n';
out+='□ 谈不拢就提\"携号转网\"\n';
out+='□ 对比一家以上运营商的同价位套餐\n';
out+='\n──── ⚠️ 避坑提醒 ────\n';
out+='· \"免费送流量\"多半捆绑 12-24 个月合约，中途退要付违约金；\n';
out+='· 低价流量卡（19 元 100GB 之类）通常有\"前 N 个月优惠价\"，之后涨价，看清长期价格；\n';
out+='· 携号转网有条件（无欠费、无在网合约、有实名），办理前先确认自己是否符合；\n';
out+='· 转网后原运营商的积分、会员权益会失效，先兑换掉。\n';
if(enough==='tight')out+='\n📶 你经常要买加油包：加油包单价通常 5-10 元/GB，是套餐内单价的 3-5 倍，长期买等于白送钱，务必直接升级套餐或换流量卡。';
else if(enough==='extra')out+='\n📉 流量用不完：说明你套餐档次偏高，降一档通常能省 20-40 元/月，一年就是几百块。';
return out;
}
</script>
<script>
document.getElementById('genBtn').addEventListener('click',function(){
if(!Paywall.countUse('AI 手机话费套餐体检 | AgentGongju.com'))return;
document.getElementById('outputBox').innerText=gen();
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(function(){alert('✅ 已复制！')})}
</script>
