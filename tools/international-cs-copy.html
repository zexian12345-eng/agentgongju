<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI跨境电商客服话术助手 | AgentGongju.com</title>
<meta name="description" content="针对海外买家常见的物流、退换、质量、砍价等问题，生成中英双语、礼貌专业的客服回复话术。">
<meta name="keywords" content="跨境电商,客服话术,英文客服,亚马逊,TikTok,虾皮,海外买家,售后话术">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
textarea,input[type=text],select{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;font-size:.92rem;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.param-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🌍 AI跨境电商客服话术</h1><p>买家问题秒回，中英双语更专业</p></div>

<div class="card">
<label>📮 买家咨询类型</label>
<select id="type"><option value="logistics">物流/迟迟未收到</option><option value="return">退换货要求</option><option value="quality">质量/色差问题</option><option value="price">砍价/折扣</option><option value="size">尺码/规格咨询</option><option value="custom">自定义场景</option></select>
<label>💬 买家原话（可粘贴原文）</label>
<textarea id="buyerMsg" placeholder="粘贴买家的原文消息，选"自定义场景"时必填…"></textarea>
<div class="param-grid">
<div><label>🛒 销售平台</label><select id="platform"><option value="amazon">Amazon</option><option value="shopee">Shopee</option><option value="tiktok">TikTok Shop</option><option value="etsy">Etsy/独立站</option></select></div>
<div><label>语气风格</label><select id="tone"><option value="warm">热情友好</option><option value="formal">专业正式</option><option value="concise">简洁高效</option></select></div>
</div>
<button class="btn-gen" id="genBtn">✍️ 生成回复话术</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">🌍 双语回复话术</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制话术</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const en={
logistics:'Thank you for your message. We sincerely apologize for the delay. Your order is on its way and the tracking shows it is currently in transit. In most cases, international parcels arrive within 10-20 days. If it doesn\'t arrive soon, we\'ll be happy to resend or refund. Please kindly reply with your order number so we can check right away.',
return:'We\'re sorry to hear about the issue. We definitely want you to be happy with your purchase. Please share a few photos and your order number, and we\'ll arrange a return, exchange or refund for you right away. Rest assured we provide 30-day after-sales support.',
quality:'Thank you for reaching out. We\'re truly sorry the item didn\'t meet your expectation. Could you kindly send a couple of photos so we can verify? We\'ll either resend a replacement or issue a refund, whichever you prefer.',
price:'Thank you for your interest! We\'ve already set a competitive price, but as a special thanks we can offer you a 5% coupon for this order. Please let us know if there\'s anything else we can help with!',
size:'Thanks for asking! This item runs true to size. Please check the size chart in the listing to find the best fit. If you\'re between sizes, we\'d suggest sizing up. Feel free to ask for more details!',
custom:'Thank you for contacting us! We\'ve received your message and will look into it right away. Please rest assured we\'ll get back to you as soon as possible.'};
const cn={
logistics:'感谢您的留言，非常抱歉让您久等了。您的订单正在运输途中，国际件一般在10-20天内送达。若长时间未收到，我们会为您补发或退款，请您回复一下订单号，我们马上核实。',
return:'很抱歉给您带来不好的体验，我们非常希望您满意。麻烦您提供几张照片和订单号，我们会立即为您安排退换货或退款，并保证30天内售后服务。',
quality:'感谢反馈，非常抱歉商品未达到您的预期。麻烦您发一两张照片帮我们核实，我们将为您补发新品或退款，您可以选择更合适的方式。',
price:'感谢您的关注！我们已给出非常有竞争力的价格，为表感谢可为您提供本单5%的优惠券。如需其他帮助也欢迎随时联系！',
size:'谢谢您的咨询！本商品尺码标准，可按商品页尺码表选购。若您夹在两个码之间，建议选大一码。如需更多详情请随时提问！',
custom:'感谢您的联系！我们已收到您的留言，会尽快为您处理，请您放心，我们会在最短时间内回复。'};
const opener={amazon:'Dear Customer,',shopee:'Hi there!',tiktok:'Hello friend!',etsy:'Hi! Thank you for reaching out.'};
document.getElementById('genBtn').addEventListener('click',function(){
if(!Paywall.countUse('AI跨境电商客服话术助手 | AgentGongju.com'))return;
const type=document.getElementById('type').value;
const platform=document.getElementById('platform').value;
const tone=document.getElementById('tone').value;
const buyer=document.getElementById('buyerMsg').value.trim();
let out='【客服话术】场景：'+type+'｜平台：'+platform+'｜语气：'+tone+'\n\n';
out+='━━ English ━━\n'+opener[platform]+'\n'+(buyer?'Regarding your message: "'+buyer.slice(0,80)+'" —\n':'')+en[type]+'\n\n';
out+='━━ 中文版 ━━\n'+(buyer?'关于您的问题："'+buyer.slice(0,60)+'"，'+'\n':'')+cn[type]+'\n\n';
out+='【客服小建议】\n· 回复时效：尽量2小时内响应，可显著提升好评率。\n· 遇到情绪激动买家，先道歉共情再解决问题；涉及退款先内部确认再承诺。\n· 统一保存聊天记录，售后有据可依。';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 话术已复制！'))}
</script>
</body>
</html>
