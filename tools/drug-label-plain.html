<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
textarea,input[type=text],select{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}

.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;font-size:.92rem;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.param-grid{grid-template-columns:1fr}}
</style>

<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>💊 AI药品说明书通俗解读</h1><p>把专业术语翻译成大白话，安全用药看得懂</p></div>

<div class="card">
<label>🧑 用药人群</label>
<select id="who"><option value="adult">成人</option><option value="child">儿童</option><option value="elder">老年人</option><option value="preg">孕期/哺乳期</option><option value="chronic">有慢性病</option></select>
<label>📝 药品说明书关键内容（粘贴或简述）</label>
<textarea id="drugText" placeholder="粘贴说明书上的【适应症】【用法用量】【禁忌】【注意事项】等原文…"></textarea>
<label>❓ 你想重点确认什么</label>
<div class="param-grid">
<div><label>💡 用法用量</label><input type="checkbox" id="cDose" checked></div>
<div><label>🚫 禁忌禁忌</label><input type="checkbox" id="cContra" checked></div>
</div>
<div class="param-grid" style="margin-top:10px">
<div><label>⚠️ 副作用</label><input type="checkbox" id="cSide" checked></div>
<div><label>🧊 保存方法</label><input type="checkbox" id="cStorage"></div>
</div>
<button class="btn-gen" id="genBtn">🔍 生成通俗解读</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">💊 通俗解读结果</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制解读</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const whoTip={
adult:'成人',child:'儿童（用药需按体重/年龄严格换算，务必遵医嘱，不可自行加量）',elder:'老年人（肝肾功能下降，多数药需从小剂量开始，警惕多药同服）',preg:'孕期/哺乳期（部分成分对胎儿有影响，必须由医生评估后才能用）',chronic:'慢性病患者（注意与长期用药的相互作用，用药前咨询医生）'
};
document.getElementById('genBtn').addEventListener('click',function(){
if(!Paywall.countUse('AI药品说明书通俗解读 | AgentGongju.com'))return;
const who=document.getElementById('who').value;
const txt=document.getElementById('drugText').value.trim();
let out='【药品说明书通俗解读】适用人群：'+whoTip[who]+'\n\n';
out+='一、我该怎么吃药（用法用量大白话）\n· 严格按说明书或医嘱剂量服用，别随意加量、漏服不要随意加倍。\n· 注意是饭前/饭后/随餐服用，"每日几次"是均分间隔，不是一口气吃完。\n';
if(document.getElementById('cContra').checked)out+='\n二、什么情况不能吃（禁忌）\n· 对本品成分过敏者禁用；说明书列明的特殊人群（小儿、孕妇、严重肝肾疾病等）禁用。\n· 正在服用说明书注明"相互作用"的其他药时，务必告知医生。\n';
if(document.getElementById('cSide').checked)out+='\n三、可能有什么副作用\n· 常见如胃肠道不适、头晕等多为轻度，几天内可缓解。\n· 若出现皮疹、呼吸困难、胸闷等严重过敏反应，立即停药并就医。\n';
if(document.getElementById('cStorage').checked)out+='\n四、怎么保存\n· 多数药品需避光、密封、阴凉干燥处保存，别放浴室或高温汽车内。\n· 注意是否需要冷藏（2-8℃），开封后效期会缩短，过期药一律丢弃。\n';
out+='\n五、给你的用药提醒\n· 你粘贴/简述的说明书内容较为关键，重点核对【剂量】【次数】【禁忌】【有效期】四项。\n· 如有具体过敏史或多病共服，请以医生/药师当面指导为准。\n';
out+='\n【重要提示】本解读仅供科普参考，不能替代专业医嘱。用药请遵医嘱或咨询药师。💊';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 解读已复制！'))}
</script>
