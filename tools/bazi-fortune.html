<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>八字命理测算 | AgentGongju.com</title>
<meta name="description" content="AI八字命理测算，输入出生信息自动生成四柱、五行分析、性格与运势解读">
<meta name="keywords" content="八字测算,命理,五行,四柱,生辰八字">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number],input[type=date]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px;color-scheme:dark}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.btn-gen:disabled{opacity:.5;cursor:not-allowed}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.9;white-space:pre-wrap;min-height:60px;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
.pill{display:inline-block;padding:3px 12px;border-radius:20px;background:rgba(99,102,241,0.18);color:#a5b4fc;font-size:.8rem;margin:2px 4px}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>☯️ 八字命理测算</h1><p>输入出生信息，自动生成四柱与五行分析（仅供娱乐参考）</p></div>

<div class="card"><label>👤 出生信息</label>
<div class="param-row">
<div><label>出生日期</label><input type="date" id="date" value="2000-01-01"></div>
<div><label>性别</label><select id="gender"><option value="男">男</option><option value="女">女</option></select></div>
</div>
<button class="btn-gen" id="genBtn">🔮 开始测算</button></div>

<div class="result-area" id="resultArea"><div class="card"><div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 测算完成（娱乐参考）</div>
<div class="result-box" id="out"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制报告</button></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyResult(){navigator.clipboard.writeText(document.getElementById('out').textContent).then(()=>alert('✅ 已复制！'))}
const GAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const ZH=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const ELEM_GAN=['木','木','火','火','土','土','金','金','水','水'];
const ELEM_ZH=['水','土','木','木','土','火','火','土','金','金','土','水'];
const TRAITS=['木主仁，为人正直向上，有同情心与责任心','火主礼，热情主动，行动力强，性格外向','土主信，沉稳踏实，讲信用，重承诺','金主义，刚毅果断，重情重义，原则性强','水主智，聪明灵活，善于变通，适应力强'];
const LUCK=['今年整体运势稳中有升，注意把握好理财机会','近期人际关系升温，宜广结善缘，事业可遇贵人','当前处于调整期，静待时机，不宜冒进','学业事业运势上升，适合制定新的目标和计划','注意劳逸结合，健康方面多加调理','财运渐入佳境，适合稳健投资积累财富'];
const ELEM_NAME=['木','火','土','金','水'];
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('八字命理测算 | AgentGongju.com'))return;
const d=document.getElementById('date').value;if(!d){alert('请选择出生日期');return}
const gender=document.getElementById('gender').value;
const dt=new Date(d);const y=dt.getFullYear();const m=dt.getMonth()+1;
const yg=GAN[(y-4)%10], yz=ZH[(y-4)%12];
const mg=GAN[((m)+1)%10], mz=ZH[(m+2)%12];
const dg=GAN[(dt.getDate()+y)%10], dz=ZH[(dt.getDate()+m)%12];
const yearEle=ELEM_GAN[(y-4)%10], monthEle=ELEM_GAN[((m)+1)%10];
// 统计五行
let counts={木:0,火:0,土:0,金:0,水:0};
[ELEM_GAN[(y-4)%10],ELEM_GAN[((m)+1)%10],ELEM_GAN[(dt.getDate()+y)%10],ELEM_ZH[(y-4)%12]].forEach(e=>counts[e]++);
// 确定命主五行(日主)
const lordElem=ELEM_GAN[(dt.getDate()+y)%10];
const trait=TRAITS[ELEM_NAME.indexOf(lordElem)];
const luck=LUCK[Math.floor(Math.random()*LUCK.length)];
const balance=Object.keys(counts).filter(k=>counts[k]>=1).join('、')||'需补充';
let out='【四柱八字】（娱乐测算）\n\n';
out+='年柱　'+yg+yz+'（'+yearEle+'）\n';
out+='月柱　'+mg+mz+'（'+monthEle+'）\n';
out+='日柱　'+dg+dz+'（日主五行：'+lordElem+'）\n\n';
out+='【五行分布】\n';
ELEM_NAME.forEach(k=>out+=k+'：'+counts[k]+'  ');
out+='\n\n【性格解读】\n'+trait+'。结合命局分析，您'+(gender==='男'?'为人讲义气、有担当':'心思细腻、外柔内刚')+'，'+(gender==='男'?'做事果断':'处事周到')+'。\n\n';
out+='【流年运势】\n'+luck+'。\n\n';
out+='【开运建议】\n1. 命主五行属'+lordElem+'，喜用色可参考对应颜色；\n2. 日常佩戴与五行相合的水晶配饰可加分；\n3. 保持积极心态，运势自然顺遂。\n\n※ 以上为AI娱乐测算，仅供休闲参考，请理性看待。';
document.getElementById('resultArea').classList.add('active');
document.getElementById('out').textContent=out;
});
</script>
</body>
</html>
