<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 绩效评估发言 | AgentGongju.com</title>
<meta name="description" content="根据岗位、成绩与不足，快速生成结构化绩效自评或对下属的评估反馈发言，专业得体不失温度">
<meta name="keywords" content="绩效评估,绩效面谈,工作总结,自评,述职,绩效发言">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;font-size:.92rem;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>📊 AI 绩效评估发言</h1><p>把成绩与成长讲得专业又有温度</p></div>

<div class="card">
<label>🎯 场景</label>
<select id="scene"><option value="个人自评" selected>🙋 个人绩效自评</option><option value="对下属评估">👥 对下属评估反馈</option><option value="团队总结">🏢 团队绩效总结</option></select>
<label>📌 职务/团队名称</label>
<input type="text" id="role" placeholder="例如：产品经理 / 市场部 / 后端组">
<label>🏆 本阶段主要成绩</label>
<textarea id="achieve" placeholder="例如：完成3个重点项目，部门业绩提升30%"></textarea>
<label>🔧 存在的不足或改进计划（选填）</label>
<textarea id="weakness" placeholder="例如：跨部门沟通效率有待提升"></textarea>
<button class="btn-gen" id="genBtn">✨ 生成评估发言</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">📊 绩效评估发言</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制发言稿</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const opens=['回望这一阶段，我/我们始终把目标放在心上，一步步把计划变成了结果。','这段时间是忙碌而充实的，很多工作从想法真正落了地。','站在总结的节点上，我/我们想把做对的事、待改进的事，都拿出来复盘一遍。'];
const goodLead=['成绩方面，我/我们主要收获有三点','亮点可以概括为','这一阶段最值得肯定的是'];
const plan=['针对不足，我/我们认为当前最值得改进的方向是','把短板理清楚，下一步就有方向了','对不完善的地方，已经有了明确的提升思路'];
const closes=['感谢团队的信任与支持，也感谢每一位伙伴的付出。','绩效不是终点，而是下一段旅程的起点，期待和大家一起继续成长。','希望带着这次的收获，在下个阶段取得更扎实的进展。'];
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 绩效评估发言 | AgentGongju.com'))return;
const scene=document.getElementById('scene').value;
const role=document.getElementById('role').value.trim();
const achieve=document.getElementById('achieve').value.trim();
const weakness=document.getElementById('weakness').value.trim();
if(!achieve){alert('请先填写本阶段主要成绩');return;}
const o=opens[Math.floor(Math.random()*opens.length)];
const g=goodLead[Math.floor(Math.random()*goodLead.length)];
const pl=plan[Math.floor(Math.random()*plan.length)];
const cl=closes[Math.floor(Math.random()*closes.length)];
const we=scene==='个人自评'?'我':(scene==='团队总结'?'我们':'ta');
let out='【'+(scene==='个人自评'?'个人绩效自评':scene==='团队总结'?'团队绩效总结':'下属绩效评估反馈')+'】'+(role?'（'+role+'）':'')+'\n\n';
out+=o+'\n\n';
out+='一、本阶段成绩\n'+g+'：\n· '+achieve.replace(/[，。；;]/g,'\n· ')+'\n\n';
out+='二、存在的不足\n· '+((weakness||'在部分常规工作的细节与沟通协同上，还有进一步优化的空间').replace(/[，。；;]/g,'\n· '))+'\n\n';
out+='三、改进计划\n'+pl+'：\n· 将'+(weakness?'重点投入「'+weakness.split(/[，,。]/)[0]+'」的专项提升':'针对上述短板制定专项改进与定期复盘')+'\n· 下阶段设定可量化的阶段性目标，每两周对齐一次进展\n\n';
out+='四、下阶段目标展望\n· '+(scene==='对下属评估'?'期待看到ta把优势继续放大，也希望公司能给到更多成长机会。':'希望继续保持优势，同时把改进计划扎实落地，贡献更大价值。')+'\n\n';
out+=cl+'\n\n';
out+=(scene==='对下属评估'?'（评估人：直属主管）':'')+'　日期：'+new Date().getFullYear()+' 年 '+(new Date().getMonth()+1)+' 月';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 评估发言已复制！'))}
</script>
</body>
</html>
