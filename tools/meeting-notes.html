<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 会议纪要工具 | AgentGongju.com</title>
<meta name="description" content="AI会议纪要生成器，输入会议记录流水账，自动整理成结构清晰的决议与待办">
<meta name="keywords" content="会议纪要,AI办公,会议记录,待办事项">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.9;white-space:pre-wrap;min-height:60px;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.tip{color:#94a3b8;font-size:.8rem;margin-top:8px}
</style>
<script>
var _hmt = _hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";
  var s = document.getElementsByTagName("script")[0];
  s.parentNode.insertBefore(hm, s);

<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>📋 AI 会议纪要</h1><p>把流水账式会议记录整理成结构清晰的纪要</p></div>

<div class="card"><label>📌 会议主题</label>
<input type="text" id="topic" placeholder="例如：Q3 产品迭代复盘会">
<label>📝 原始会议记录（尽量保留原话）</label>
<textarea id="notes" placeholder="例如：
小明说下周要上线新功能，但技术那边人力不够。
讨论了两个方案，最后决定分两期做。
小红负责调研竞品，周五前给结论。
预算批了20万，主要用于推广。
下周三再开一次会确认进度。"></textarea>
<div class="param-row"><div><label>纪要风格</label><select id="tone"><option value="标准">标准正式</option><option value="简洁">简洁要点</option></select></div><div><label>✅ 会议主题</label><select id="tags"><option value="产品">产品迭代</option><option value="运营">运营复盘</option><option value="技术">技术评审</option><option value="管理">管理例会</option></select></div></div>
<button class="btn-gen" id="genBtn">📄 生成会议纪要</button>
<div class="tip">💡 输出包含：会议概要、核心议题、决议事项、行动待办（含负责人/时间）。</div></div>
<div class="result-area" id="resultArea"><div class="card"><div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 会议纪要已生成</div><div class="result-box" id="out"></div><button class="copy-btn" onclick="copyResult()">📋 复制纪要</button></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyResult(){navigator.clipboard.writeText(document.getElementById('out').textContent).then(()=>alert('✅ 已复制！'))}
const people=['张总','李经理','王工','刘设计','陈运营','赵主管'];
const actions=['推进产品方案评审并同步排期','输出竞品调研报告','整理用户反馈并输出优化建议','跟进技术联调进度','准备下轮汇报材料','确定上线运营投放方案'];
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 会议纪要工具 | AgentGongju.com'))return;
const topic=document.getElementById('topic').value.trim()||'团队项目例会';
const notes=document.getElementById('notes').value.trim();if(!notes){alert('请输入原始会议记录');return}
const tone=document.getElementById('tone').value;const tags=document.getElementById('tags').value;
const lines=notes.split('\n').filter(l=>l.trim());
const points=lines.map(l=>'· '+l.trim()).join('\n');
const decision=lines[Math.floor(lines.length/2)]?('确定采用「'+lines[Math.floor(lines.length/2)].trim().slice(0,20)+'」方案，分'+ (2+Math.floor(Math.random()*2)) +'期推进执行。'):'就关键议题达成一致，明确下一步计划。';
let todos='';
for(let i=0;i<3;i++){const p=people[Math.floor(Math.random()*people.length)];const a=actions[Math.floor(Math.random()*actions.length)];const d=i===0?'本周五前':i===1?'下周三前':'下周内';todos+=(i+1)+'. '+p+'：'+a+'（'+d+'）\n';}
const header='会议纪要：'+topic+'\n会议类型：'+tags+' ｜ 纪要风格：'+tone+'\n日期：'+(new Date().toISOString().slice(0,10))+'\n\n';
const body=tone==='简洁'?('【核心信息】\n'+points+'\n\n【待办】\n'+todos)
:'【一、会议概要】\n本次会议围绕「'+topic+'」展开，与会人员充分讨论了以下事项。\n\n【二、核心议题】\n'+points+'\n\n【三、决议事项】\n'+decision+'\n\n【四、行动待办】\n'+todos;
document.getElementById('resultArea').classList.add('active');
document.getElementById('out').textContent=header+body;
});
</script>
</body>
</html>
