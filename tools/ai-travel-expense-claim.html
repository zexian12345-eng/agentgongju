<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>差旅报销清单助手 | AgentGongju.com</title>
<meta name="description" content="出差回来最烦贴报销单？输入出差地、天数与花销类别，一键生成可提交的标准报销清单(交通/住宿/餐补/市内交通),附发票tips和催款跟进邮件话术。财务零返工。">
<meta name="keywords" content="差旅报销,报销单,财务报销,出差补贴,报销发票,差旅费">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
input[type=text],textarea,select{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s;margin-top:6px}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.95;white-space:pre-wrap;font-size:0.95rem;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:600px){.output-box{font-size:.9rem}.grid-3{grid-template-columns:1fr}}
</style>
<script>
var _hmt = _hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";
  var s = document.getElementsByTagName("script")[0];
  s.parentNode.insertBefore(hm, s);

<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🧾 差旅报销清单助手</h1><p>发票别再皱巴巴，报销一次过</p></div>

<div class="card">
<div class="param-grid">
<div><label>📍 出差目的地（城市）</label><input type="text" id="city" placeholder="如：上海"></div>
<div><label>🗓 出差起止（如 9.3-9.5）</label><input type="text" id="dates" placeholder="2026-09-03 ~ 2026-09-05"></div>
</div>
<div class="param-grid">
<div><label>🚄 出差事由</label>
<select id="reason"><option selected>商务拜访客户</option><option>参加外部会议/展会</option><option>项目驻场/评审</option><option>公司团建/出差培训</option></select></div>
<div><label>🌆 城市等级</label>
<select id="citylevel"><option selected>一线城市（北上广深）</option><option>二线及省会</option><option>三线及以下</option></select></div>
</div>
<div class="grid-3">
<div><label>✈ 机票/高铁</label><input type="number" id="traffic" placeholder="0" value="0"></div>
<div><label>🏨 住宿</label><input type="number" id="hotel" placeholder="0" value="0"></div>
<div><label>🚕 市内打车</label><input type="number" id="cab" placeholder="0" value="0"></div>
</div>
<div><label>📋 备注/其他特殊费用（可空）</label>
<textarea id="extra" placeholder="例如：客户餐费一起报？有无招待标准？"></textarea>
<button class="btn-gen" id="genBtn">🧮 生成可提交报销单</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#a855f7;font-weight:600;margin-bottom:12px">📎 报销清单 & 跟进话术</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制报销单</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function n2(x){return (isNaN(x)||x<=0)?0:Number(x);}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('差旅报销清单助手 | AgentGongju.com'))return;
const city=document.getElementById('city').value.trim()||'出差地';
const dates=document.getElementById('dates').value.trim()||'__至__';
const reason=document.getElementById('reason').value;
const lvl=document.getElementById('citylevel').value;
const traffic=n2(document.getElementById('traffic').value);
const hotel=n2(document.getElementById('hotel').value);
const cab=n2(document.getElementById('cab').value);
const extra=document.getElementById('extra').value.trim();
// 建议餐补(参考额,请按司规)
const meal={'一线城市（北上广深）':150,'二线及省会':120,'三线及以下':100}[lvl];
const total=traffic+hotel+cab;
const rawD=dates.split(/[~～]/)[0];
let days=2;
const dm=dates.match(/\d{1,2}月?\s?\d{1,2}/g);
// 粗算天数：取日分量差+1
const dNow=new Date();
let dayStart=parseInt(dates.match(/(\d{4}-)?(\d{1,2})-(\d{1,2})/)?.[3]||Math.max(1,dNow.getDate()));
if(dates.indexOf('~')>-1){
 const parts=dates.split(/[~～]/);
 const A=parts[0].match(/(\d{4}[-/])?(\d{1,2})[-/]?(\d{1,2})/);
 const B=parts[1].match(/(\d{4}[-/])?(\d{1,2})[-/]?(\d{1,2})/);
 if(A&&B&&A[1]===B[1]){ days=Math.abs(parseInt(B[2])-parseInt(A[2]))+1; }
}
let r='🧾 差旅费用报销申请清单\n';
r+='出差地点：'+city+'（'+lvl+'）\n出差时间：'+dates+' · 共约 '+days+' 天\n出差事由：'+reason+'\n\n';
r+='一、费用明细\n';
if(traffic>0)r+='· 交通费（机票/高铁/汽车）  ￥'+traffic.toFixed(2)+'\n';
if(hotel>0)r+='· 住宿费                    ￥'+hotel.toFixed(2)+'\n';
if(cab>0)r+='· 市内交通（打车/地铁）     ￥'+cab.toFixed(2)+'\n';
r+='· 出差餐补（'+lvl+'标准约'+meal.toFixed(0)+'元/天 ×'+days+'天，按公司制度核对） 待财务核定\n';
if(extra)r+='· 特殊费用/备注：'+extra+'\n';
r+='────────────────\n'+(extra?'以上合计金额请以发票与财务实际核定为准。\n':'以上常规项合计 ￥'+(total).toFixed(2)+'（不含餐补，餐补以制度为准）\n');
r+='\n二、粘贴发票提醒\n· 火车票/打车发票左下角二维码完好，别对折；\n· 打车需点选"开出商务行程发票"，抬头用公司税号+全称；\n· 酒店如离职不可退，留存水单(POS小票)一起贴。\n\n三、若被退回 / 想催一下进度，可直接用：\n【跟进邮件/IM】您好，X月X日提交的出差费用报销单（事项：'+reason+'，地点'+city+'）想确认一下目前审核进度，如有缺发票或信息差漏随时告诉我，辛苦啦～\n【追问话术】Hi财务姐姐/哥，上一篇报销预计这周能过系统吗？我这边的发票都是电子原件的，若有问题我立刻红冲重开最快可当日处理。';
document.getElementById('outputBox').innerText=r;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 报销清单已复制！'))}
</script>
</body>
</html>
