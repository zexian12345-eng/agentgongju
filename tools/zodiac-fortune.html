<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
input:focus,select:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.9;margin-bottom:12px}
.score-bar{height:10px;background:rgba(255,255,255,0.08);border-radius:8px;overflow:hidden;margin-top:8px}
.score-fill{height:100%;background:linear-gradient(135deg,#6366f1,#a855f7);border-radius:8px}
.star{color:#fbbf24;letter-spacing:2px}
.tag{display:inline-block;padding:3px 10px;border-radius:16px;font-size:.78rem;margin-right:6px}
.tag.good{background:rgba(34,197,94,0.15);color:#4ade80}
.tag.mid{background:rgba(217,164,32,0.15);color:#fbbf24}
@media(max-width:600px){.btn-gen{font-size:.95rem}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🔮 星座运势</h1><p>每日星座运势 · 塔罗占卜 · 趣味天机</p></div>

<div class="card"><label>♈ 选择星座</label>
<select id="sign"><option value="白羊座">♈ 白羊座</option><option value="金牛座">♉ 金牛座</option><option value="双子座">♊ 双子座</option><option value="巨蟹座">♋ 巨蟹座</option><option value="狮子座">♌ 狮子座</option><option value="处女座">♍ 处女座</option><option value="天秤座">♎ 天秤座</option><option value="天蝎座">♏ 天蝎座</option><option value="射手座">♐ 射手座</option><option value="摩羯座">♑ 摩羯座</option><option value="水瓶座">♒ 水瓶座</option><option value="双鱼座">♓ 双鱼座</option></select>
<div class="param-row" style="margin-top:12px"><div><label>占卜内容</label><select id="type"><option value="daily">今日综合运势</option><option value="love">🎯 今日爱情运</option><option value="money">💰 今日财运</option><option value="career">💼 今日事业运</option></select></div><div><label>🍀 今日塔罗</label><select id="tarot"><option value="y">随机抽一张牌</option><option value="n">不抽牌</option></select></div></div>
<button class="btn-gen" id="genBtn">🔮 查看今日运势</button></div>
<div class="result-area" id="resultArea">
<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><span style="color:#a5b4fc;font-weight:600" id="signtitle"></span><span class="star" id="stars"></span></div>
<div class="score-bar"><div class="score-fill" id="fill"></div></div>
<div class="result-box" id="taro" style="margin-top:14px"></div>
<div class="result-box" id="main"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制运势</button></div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyResult(){navigator.clipboard.writeText(document.getElementById('signtitle').textContent+'\n'+(document.getElementById('taro').textContent||'')+'\n'+document.getElementById('main').textContent).then(()=>alert('✅ 已复制！'))}
const cards=['正位 太阳','逆位 月亮','正位 星星','正位 恋人','逆位 隐士','正位 命运之轮','正位 力量','逆位 倒吊人','正位 世界','正位 皇后'];
const cardMean={};
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('星座运势测试 | AgentGongju.com'))return;
const sign=document.getElementById('sign').value;const type=document.getElementById('type').value;const wantTaro=document.getElementById('tarot').value;
const score=55+Math.floor(Math.random()*45);
const star='★★★★★'.slice(0,Math.round(score/20));
document.getElementById('signtitle').textContent=sign+' · 今日运势';
document.getElementById('stars').textContent=star+' '+score+'分';
document.getElementById('fill').style.width=score+'%';
let taro='';
if(wantTaro==='y'){const c=cards[Math.floor(Math.random()*cards.length)];const good=c.startsWith('正位')&&c!=='正位 命运之轮'?'good':c.includes('星')?'good':'mid';taro='🍀 今日塔罗：'+c+' — '+ (c.includes('逆位')?'提示你放慢脚步，谨慎前行。':'带来积极能量，宜把握良机。');}
const mean={daily:'整体节奏平稳，心态平和的一天。适合推进重要事务，也别忘了给自己留点喘息的空间。贵人运不错，多与人交流会有收获。',love:'今天是经营感情的好时机，主动表达心意会得到不错的回应。单身者可能在社交场合遇到令你心动的人。',money:'今日财运中上，正财稳定，或有意外的小惊喜。投资理财宜稳健为主，不宜冒进。',career:'工作中思路清晰，效率颇高，容易得到认可。把握今天，勇敢表达你的想法，机会就在眼前。'};
document.getElementById('taro').textContent=taro;
document.getElementById('main').textContent='【'+sign+' · '+document.getElementById('type').selectedOptions[0].text+'】\n\n'+mean[type]+'\n\n💡 温馨提示：运势内容仅供娱乐与参考，真正的把握其实始终握在自己手中。';
document.getElementById('resultArea').classList.add('active');
});
</script>
</body>
</html>
