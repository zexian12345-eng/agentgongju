// 流年神煞（以流年支+命局年支/日支起）
function flowShensha(lz, bazi){
  const yz=bazi.pillars.year.z, dz=bazi.pillars.day.z;
  const out=[];
  const hongluan={子:"卯",丑:"寅",寅:"丑",卯:"子",辰:"亥",巳:"戌",午:"酉",未:"申",申:"未",酉:"午",戌:"巳",亥:"辰"};
  if(hongluan[yz]===lz) out.push("红鸾");
  const taohua={"申子辰":"酉","寅午戌":"卯","巳酉丑":"午","亥卯未":"子"};
  const grp=sanheGroup(yz);
  if(grp&&taohua[grp]===lz) out.push("桃花");
  const yima={"申子辰":"寅","寅午戌":"申","巳酉丑":"亥","亥卯未":"巳"};
  if(grp&&yima[grp]===lz) out.push("驿马");
  const sm=ZHI[(zhiIndex(yz)+2)%12], dk=ZHI[(zhiIndex(yz)+10)%12];
  if(lz===sm) out.push("丧门");
  if(lz===dk) out.push("吊客");
  const yangren={甲:"卯",丙:"午",戊:"午",庚:"酉",壬:"子"};
  if(yangren[bazi.pillars.day.g]===lz) out.push("羊刃");
  const tianyi={甲:["丑","未"],戊:["丑","未"],庚:["丑","未"],乙:["子","申"],己:["子","申"],丙:["亥","酉"],丁:["亥","酉"],壬:["卯","巳"],癸:["卯","巳"],辛:["午","寅"]};
  if((tianyi[bazi.pillars.day.g]||[]).includes(lz)) out.push("天乙贵人");
  const huagai={"申子辰":"辰","寅午戌":"戌","巳酉丑":"丑","亥卯未":"未"};
  if(grp&&huagai[grp]===lz) out.push("华盖");
  return out;
}

// 大运主题
function dayunTheme(ssG, ssZ){
  const g = ssG||"", z = ssZ||"";
  const s = g+z;
  if(s.includes("正官")||s.includes("七杀")) return "事业运：职位、名望、责任压力成为主线，宜进取亦需稳健";
  if(s.includes("正财")||s.includes("偏财")) return "财运年段：财星当运，收入机会增多，理财与开源是重点";
  if(s.includes("正印")||s.includes("偏印")) return "学习贵人运：文书、证书、房产、长辈助力明显，宜进修沉淀";
  if(s.includes("食神")||s.includes("伤官")) return "才艺输出运：才华展现、创作表达、子女缘分，注意口舌";

  return "平稳过渡期：运势平顺，按部就班积累";
}

// 单流年分析
function analyzeYear(yy, bazi, step){
  const gender = bazi.gender;
  const dayG = bazi.pillars.day.g;
  const [lg, lz] = decodeGZ(yearGZ(yy, false));
  const ss = shishen(dayG, lg);
  const yz=bazi.pillars.year.z, mz=bazi.pillars.month.z, dz=bazi.pillars.day.z, hz=bazi.pillars.hour.z;
  const sig = {year:yy, gz:lg+lz, ss, bases:[], points:{}};
  const add = (cat, w, desc) => { sig.points[cat]=(sig.points[cat]||0)+w; sig.bases.push({cat,desc}); };
  // 1. 流年天干十神信号
  const ssEvents = {
    "正财": [["得财",2,"正财透干，收入/财运信号"],["婚恋",1,"男命正财主妻缘"]],
    "偏财": [["偏财",2,"偏财透干，意外之财或投资机遇"],["婚恋",1,"异性缘/父亲相关"]],
    "正官": [["事业",2,"正官当值，职位名声相关"],["官非",1,"官星受制则防官非"]],
    "七杀": [["事业",1,"七杀主压力竞争"],["伤病",1,"七杀无制防伤病"],["官非",1,"七杀攻身防是非"]],
    "正印": [["学业",2,"正印主文书证书学业"],["置业",1,"印主房产"]],
    "偏印": [["学业",1,"偏印主偏门学问技能"]],
    "食神": [["才华",1,"食神主才华输出"],["子女",1,"食神主子女缘分"]],
    "伤官": [["才华",1,"伤官主创意表达"],["口舌",1,"伤官易惹口舌是非"]],
    "比肩": [["人际",1,"比肩主朋友合伙"]],
    "劫财": [["破财",2,"劫财主破财损耗"],["人际",1,"劫财主竞争"]]
  };
  if(ssEvents[ss]) for(const [cat,w,d] of ssEvents[ss]) add(cat,w,d);
  // 2. 流年支与命局地支关系
  const pillarsZ = [["年支",yz],["月支",mz],["日支",dz],["时支",hz]];
  for(const [name, z] of pillarsZ){
    if(LIUCHONG[lz]===z) add("变动",2, `流年${lz}冲${name}${z}，主变动`);
    if(LIUHE[lz]===z) add("和合",1, `流年${lz}合${name}${z}，主和合`);
    if((XING[lz]||"").includes(z)) add("摩擦",1, `流年${lz}刑${name}${z}，主摩擦`);
    if((HAI[lz]||"").includes(z)) add("暗耗",1, `流年${lz}害${name}${z}，主暗耗`);
  }
  // 配偶宫（日支）动 → 婚恋
  if(LIUCHONG[lz]===dz) add("婚恋",2, "冲日支配偶宫，婚恋感情易有变动");
  if(LIUHE[lz]===dz) add("婚恋",2, "合日支配偶宫，婚恋缘分显现");
  // 3. 流年神煞
  const fss = flowShensha(lz, bazi);

// 主分析：按大运分段
function analyzeLife(bazi){
  const birthYear = bazi.birthYear;
  const sections = [];
  const dayG = bazi.pillars.day.g;
  for(const step of bazi.dayun.steps){
    const sG = step.gz[0], sZ = step.gz[1];
    const ssG = shishen(dayG, sG);
    const ssZ = shishen(dayG, CANG[sZ][0]);   // 地支取主气藏干论十神
    const theme = dayunTheme(ssG, ssZ);
    const startAge = Math.floor(step.start);
    const endAge = Math.ceil(step.end);
    const yearEvents = [];
    for(let age = startAge; age < endAge && age < 90; age++){
      const yy = birthYear + age;
      const sig = analyzeYear(yy, bazi, step);
      sig.age = age;
      yearEvents.push(sig);
    }
    sections.push({gz:step.gz, start:step.start, end:step.end, ssG, ssZ, theme, yearEvents, startYear: birthYear+startAge});
  }
  return sections;
}

// 聚合每步大运的事件（选高分类别）
function aggregateSection(sec, bazi){
  const catScore = {};
  const catBases = {};
  const catYears = {};
  const ageStart = sec.start;
  for(const ye of sec.yearEvents){
    for(const [cat, score] of Object.entries(ye.points)){
      // 年龄过滤：未成年人不上婚恋/破财/官非等成人事件
      if(ye.age < 16 && (cat==="婚恋"||cat==="破财"||cat==="官非")) continue;
      if(ye.age < 20 && cat==="丧事") continue;
      catScore[cat] = (catScore[cat]||0) + score;
      catBases[cat] = catBases[cat]||[];
      for(const b of ye.bases) if(b.cat===cat) catBases[cat].push({year:ye.year, gz:ye.gz, desc:b.desc});
      catYears[cat] = catYears[cat]||[];
      catYears[cat].push(ye.year);
    }
  }
  // 按分数排序
  const cats = Object.entries(catScore).sort((a,b)=>b[1]-a[1]);
  const result = [];
  const catLabel = {
    "得财":"💰 财运提升", "偏财":"🎲 偏财机遇", "事业":"🏢 事业进展", "学业":"📚 学业文书",
    "置业":"🏠 置业安家", "婚恋":"💕 婚恋感情", "变动":"🔄 人生变动", "破财":"⚠️ 破财损耗",
    "伤病":"🏥 健康注意", "口舌":"🗣️ 口舌是非", "官非":"⚖️ 官非纠纷", "丧事":"🕯️ 六亲事务",
    "贵人":"🤝 贵人相助", "人际":"👥 人际合作", "独处":"🧘 静思沉淀", "六亲":"👪 六亲事务",
    "和合":"🤗 人际和合", "摩擦":"😤 摩擦口角", "暗耗":"🌫️ 暗耗谨防"
  };
  for(const [cat, score] of cats){
    if(score < 3) continue;
    const years = catYears[cat].slice(0,5);
    const bases = catBases[cat].slice(0,4);
    const conf = score >= 8 ? "高" : score >= 5 ? "中" : "参考";
    result.push({
      cat, label: catLabel[cat]||cat, score, conf,
      years: years.slice(0,4),
      bases: bases.map(b=>b.year+"年("+b.gz+") "+b.desc),
      phrase: eventPhrase(cat, bases, null, bazi.gender)
    });
  }
  // 取前 5 条
  return result.slice(0,5);
}

// 五行旺衰简评 + 喜用神（简化规则：按月令旺相休囚死 + 得地通根）
function strengthAnalysis(bazi){
  const dg = bazi.pillars.day.g;
  const dw = WX_GAN[dg];
  const mz = bazi.monthZhi;
  const mw = {寅:"木",卯:"木",巳:"火",午:"火",申:"金",酉:"金",亥:"水",子:"水",辰:"土",戌:"土",丑:"土",未:"土"}[mz];
  const sheng = {木:"水",火:"木",土:"火",金:"土",水:"金"}; // 生我
  const order = {木:["木","火","土","金","水"],火:["火","土","金","水","木"],土:["土","金","水","木","火"],金:["金","水","木","火","土"],水:["水","木","火","土","金"]};
  const seasonRank = order[dw].indexOf(mw); // 0=当令最强
  const roots = [bazi.pillars.year.z,bazi.pillars.month.z,bazi.pillars.day.z,bazi.pillars.hour.z].filter(z=>WX_GAN[z]===dw || CANG[z].some(c=>WX_GAN[c]===dw)).length;
  let score = (seasonRank===0?4:seasonRank===1?2:seasonRank===2?0:-2) + roots*1.5;
  let strong = score >= 4;
  // 同党（印比）异党（财官食伤）数量
  const sameWx = ["比肩","劫财","正印","偏印"];
  let same=0, diff=0;
  for(const p of [bazi.pillars.year,bazi.pillars.month,bazi.pillars.day,bazi.pillars.hour]){
    const s1 = shishen(dg, p.g);
    if(sameWx.includes(s1)) same++; else diff++;
  }
  const verdict = strong ? "偏强" : "偏弱";
  const xi = strong ? "克泄耗（官杀、食伤、财星）" : "生扶（印星、比劫）";
  const ji = strong ? "印比" : "财官食伤";
  return {score, strong, verdict, xi, ji, same, diff, season: mw, seasonRank};
}
// 五行缺补
function wuxingStats(bazi){
  const cnt = {金:0,木:0,水:0,火:0,土:0};
  for(const p of [bazi.pillars.year,bazi.pillars.month,bazi.pillars.day,bazi.pillars.hour]){
    cnt[WX_GAN[p.g]]++;
    for(const c of CANG[p.z]) cnt[WX_GAN[c]] += 0.6;
  }
  return cnt;
}

      h.push(`<div class="ev-head"><span class="ev-cat">${ev.label}</span><span class="${confCls}" style="font-size:.78rem">置信度：${ev.conf}</span></div>`);
      h.push(`<div class="ev-year">关键年份：${ev.years.map(y=>y+"年").join("、")}</div>`);
      h.push(`<div class="ev-base">${ev.phrase}。${ev.bases.map(b=>"<br>· "+b).join("")}</div>`);
      h.push(`</div>`);
    }
  }
  h.push(`</div>`);

  // 关键流年
  h.push(`<div class="rp-card"><h2>📅 关键流年速览 <span class="tag">全生命周期高信号年份</span></h2>`);
  const allYears = [];
  for(const sec of sections){
    for(const ye of sec.yearEvents){
      const total = Object.values(ye.points).reduce((a,b)=>a+b,0);
      if(total >= 6) allYears.push({year: ye.year, gz: ye.gz, ss: ye.ss, total, cats: Object.entries(ye.points).sort((a,b)=>b[1]-a[1]).slice(0,3)});
    }
  }
  if(allYears.length){
    const sorted = allYears.sort((a,b)=>b.total-a.total).slice(0,12);
    h.push(`<div style="display:flex;flex-wrap:wrap;gap:8px">`);
    for(const y of sorted){
      h.push(`<span class="flow-year"><b>${y.year}年</b> ${y.gz}（${y.ss}）<br><span style="font-size:.7rem;color:#94a3b8">${y.cats.map(c=>c[0]).join("·")}</span></span>`);
    }
    h.push(`</div>`);
  } else {
    h.push(`<div style="color:#64748b;font-size:.85rem">未发现高信号年份。</div>`);
  }
  h.push(`</div>`);

  // 免责
  h.push(`<div class="rp-card"><h2>📖 说明</h2>`);
  h.push(`<div class="disclaimer">
① 排盘算法：节气采用 VSOP87 高精度天文算法（误差约1分钟内，已含ΔT时差修正），真太阳时含经度修正（每度4分钟，以东经120°为基准）与均时差，日柱以儒略日推算，年柱以立春为界、月柱以节气为界、时柱五鼠遁。
② 若出生时刻恰逢节气交界（前后数分钟），月柱/年柱可能受影响，请核对出生证明时间。
③ 事件推断基于传统命理规则（十神事象、宫位、神煞、刑冲合害）的统计性提示，仅供文化娱乐与自我参考，切勿作为决策依据。
④ 本工具不涉及任何医疗、法律、投资建议。
</div>`);
  h.push(`</div>`);

  document.getElementById("resultArea").innerHTML = h.join("");
  document.getElementById("resultArea").classList.add("active");
  document.getElementById("resultArea").scrollIntoView({behavior:"smooth"});
}

function run(){
  try{
    if (window.Paywall && !Paywall.countUse('八字命理详批')) return;
    const name = document.getElementById("inName").value.trim();
    const gender = document.getElementById("inGender").value;
    const calendar = document.getElementById("inCalendar").value;
    const dateStr = document.getElementById("inDate").value;
    const timeStr = document.getElementById("inTime").value;
    const cityInput = document.getElementById("inCity").value;
    const lon = parseFloat(document.getElementById("inLon").value);
    const tz = parseFloat(document.getElementById("inTz").value);
    const useTrueSolar = document.getElementById("optTrueSolar").checked;
    const lateZishi = document.getElementById("optZishi").checked;
    if(!dateStr || !timeStr){ alert("请填写出生日期和时间"); return; }
    if(isNaN(lon)){ alert("请选择出生地或填写经度"); return; }
    const [yy, mm, dd] = dateStr.split("-").map(Number);
    const [hh, mi] = timeStr.split(":").map(Number);
    let solar = {y:yy, m:mm, d:dd};
    if(calendar === "lunar"){
      const leap = document.getElementById("inLunarLeap").value === "1";
      const g = lunarToGregorian(yy, mm, dd, leap);
      if(!g){ alert("农历日期转换失败，请检查日期是否正确"); return; }
      solar = {y:g.y, m:g.m, d:g.d};
    }
    const cityName = cityInput.replace(/（.*/,"").trim();
    const bazi = buildBazi({y:solar.y, m:solar.m, d:solar.d, h:hh, mi:mi}, lon, tz, gender, useTrueSolar, lateZishi);
    renderReport(bazi, {name, gender, calendar, dateStr, timeStr, city: cityName||"自定义", lon, tz, useTrueSolar, lateZishi});
  }catch(e){
    console.error(e);
    alert("排盘出错：" + e.message);
  }
}

</script>
</body>
</html>
