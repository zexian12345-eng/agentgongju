// 调候用神分析：返回该日主此月需要的调候用神、命局带/缺情况与大白话提示
function tiaohouInfo(bazi){
  const dg = bazi.pillars.day.g;
  const mz = bazi.monthZhi;
  const need = (TIAOHOU[dg]||{})[mz] || "";
  if(!need) return null;
  const ganList = [bazi.pillars.year.g, bazi.pillars.month.g, bazi.pillars.day.g, bazi.pillars.hour.g];
  const zhiList = [bazi.pillars.year.z, bazi.pillars.month.z, bazi.pillars.day.z, bazi.pillars.hour.z];
  const present = []; // 命局天干/地支藏干里出现的调候用神
  for(const c of need){
    if(ganList.includes(c)) present.push(c);
    else if(zhiList.some(z => (CANG[z]||[]).includes(c))) present.push(c);
  }
  const missing = [...need].filter(c => !present.includes(c));
  // 寒暖燥湿定性（据《穷通宝鉴》总论：寒需暖、暖需寒、燥需润、湿需燥）
  const coldMonths = ["亥","子","丑","寅"];
  const hotMonths = ["巳","午","未"];
  let season = "平";
  if(coldMonths.includes(mz)) season = "寒";
  else if(hotMonths.includes(mz)) season = "热";
  // 调候首字五行决定大白话方向（首字即《穷通宝鉴》最先需要的字）
  const firstWx = {丙:"火",丁:"火",壬:"水",癸:"水",甲:"木",乙:"木",庚:"金",辛:"金",戊:"土",己:"土"}[need[0]];
  const plainByWx = {
    "火": season==="寒" ? "你生在寒月，最需要火来暖局：适合往南方、靠暖气的地方发展，多晒太阳、多跟热情的人打交道，越暖越顺。" : "调候首取火：你天生需要热情和光明，适合往南方、明亮热闹的环境发展，越有干劲越旺。",
    "水": season==="热" ? "你生在热月，最需要水来润局：适合往北方、近水的地方发展，多补水、多静心，越冷静越有财。" : "调候首取水：你天生需要冷静和流动，适合往北方、近水的地方发展，多接触新事物，越灵活越顺。",
    "木": "调候首取木：你天生需要生长和疏通，适合多学习、多接触新事物，往东方、绿色环境发展有利，越舒展越旺。",
    "金": "调候首取金：你天生需要磨练和规整，适合做需要干脆利落、有章法的事，往西方、金属器械类环境发展有利。",
    "土": "调候首取土：你天生需要稳定和承载，适合按部就班、稳住根基，在本乡本地发展有利，越踏实越旺。"
  };
  let plain = plainByWx[firstWx] || (season==="寒" ? "你生在寒月，注意保暖御寒，多晒太阳、多运动，心情暖了运势就暖。" : season==="热" ? "你生在热月，注意防燥降火，多喝水、多静心，心静自然凉。" : "你生在不冷不热的平月，调候压力不大，按部就班发展即可。");

    "火": season==="寒" ? "Born in a cold month, your chart runs cold and most needs fire to warm it: develop southward or in warm surroundings; more sun and warm company — the warmer, the smoother." : "First adjustor is fire: you naturally need warmth and light — develop southward or in bright, lively settings; the more drive, the better.",
    "水": season==="热" ? "Born in a hot month, your chart runs dry and most needs water to moisten it: develop northward or near water; stay hydrated and calm — the cooler the head, the richer the luck." : "First adjustor is water: you naturally need calm and flow — develop northward or near water, seek new things; the more flexible, the smoother.",

  const tianyi={甲:["丑","未"],戊:["丑","未"],庚:["丑","未"],乙:["子","申"],己:["子","申"],丙:["亥","酉"],丁:["亥","酉"],壬:["卯","巳"],癸:["卯","巳"],辛:["午","寅"]};

// 格局判定：月令本气藏干透干优先，不透则本气兜底；另判从格
function gejuAnalysis(bazi){
  const dg = bazi.pillars.day.g;
  const mz = bazi.monthZhi;
  const cang = CANG[mz] || [];
  if(!cang.length) return null;
  const stems = [bazi.pillars.year.g, bazi.pillars.month.g, bazi.pillars.hour.g];
  let geSS = null, geGan = null, viaTou = false;
  for(const c of cang){ // 本气→中气→余气
    if(stems.includes(c)){ geSS = shishen(dg, c); geGan = c; viaTou = true; break; }
  }
  if(!geSS){ geSS = shishen(dg, cang[0]); geGan = cang[0]; }
  // 从格判定：日主无根、无比劫帮身、无印星生扶 → 从财/从官/从杀/从儿
  const dw = WX_GAN[dg];
  const roots = [bazi.pillars.year.z, bazi.pillars.month.z, bazi.pillars.day.z, bazi.pillars.hour.z].filter(z => CANG[z].some(c => WX_GAN[c] === dw)).length;
  const stemSS = stems.map(g => shishen(dg, g));
  const noBang = !stemSS.some(s => s === "比肩" || s === "劫财");
  const noYin = !stemSS.some(s => s === "正印" || s === "偏印");
  const sa = strengthAnalysis(bazi);
  let cong = null;
  if(roots === 0 && noBang && noYin && sa.score <= -3){
    const mzSS = shishen(dg, cang[0]);
    if(mzSS === "正财" || mzSS === "偏财") cong = "从财格";
    else if(mzSS === "正官" || mzSS === "七杀") cong = mzSS === "正官" ? "从官格" : "从杀格";
    else if(mzSS === "食神" || mzSS === "伤官") cong = "从儿格";
  }
  const info = GE_INFO[geSS] || GE_INFO["比肩"];
  return {geSS, geGan, viaTou, cong, name: info.name, xi: info.xi, ji: info.ji, plain: info.plain, en: info.en, mz, cang};
}

  // 5. 专项事件：车祸/出轨/当兵/转业/二次择业
  const fss2 = flowShensha(lz, bazi);
  const yangrenHit = fss2.includes("羊刃"), yimaHit = fss2.includes("驿马"), jiangHit = fss2.includes("将星");
  const chongDay = LIUCHONG[lz]===dz, chongMonth = LIUCHONG[lz]===mz, chongYear = LIUCHONG[lz]===yz;
  // 车祸/血光意外：羊刃+驿马、或羊刃+冲、或七杀+羊刃
  if(age>=16){
    const carScore = (yangrenHit?1:0)+(yimaHit?1:0)+((chongDay||chongMonth)?1:0)+(ss==="七杀"?1:0)+(ss==="劫财"?0.5:0);
    if(carScore>=3.5) add("车祸意外",3, "血光信号强（羊刃逢冲带驿马/七杀）：这一年出门开车、骑车、走路都要格外当心，防磕碰、交通意外，凡事慢半拍。","羊刃+驿马+冲/七杀",16);
    else if(carScore>=2.5 && yangrenHit) add("车祸意外",2, "羊刃发动：防意外磕碰、皮外伤，注意交通安全，别开快车、别疲劳驾驶。","羊刃逢值",16);
  }
  // 出轨/感情越轨：桃花+劫财/偏财/伤官/七杀，或+冲日支；或六合日支+命带桃花（校准：2007亥年合日支寅出轨）
  if(age>=25&&age<=60){
    const mingTaoHua = Object.entries(bazi.shensha).some(([k])=>k.includes("桃花"));
    const gui = (fss2.includes("桃花")?1:0)+((ss==="劫财"||ss==="偏财"||ss==="伤官"||ss==="七杀")?1:0)+(chongDay?1:0);
    const guiHe = (LIUHE[lz]===dz?1:0)+(mingTaoHua?1:0);

      add("出轨",2, gPlain, "桃花+财杀/冲日支/合日支",25,60);
    }

  // 当兵入伍：七杀/正官+将星/羊刃/驿马+冲年，或大运七杀/偏印加成，16-24岁；或伏吟日柱+命带羊刃将星（校准：1998寅年伏吟日柱参军）
  if(age>=16&&age<=24){
    const stepSS = shishen(dayG, step.gz[0]);

    else if(junScore===3) add("当兵入伍",2, "官杀+羊刃驿马，又逢七杀/偏印大运：有参军、考军校、入警队的机会或想法。","官杀+羊刃驿马",16,24);

  }
  // 二次择业/换行业：冲月柱（事业宫）+偏印/伤官/正财
  if(age>=25&&age<=50&&chongMonth&&(ss==="偏印"||ss==="伤官"||ss==="正财")){

  return sig;
}

// 主分析：按大运分段
function analyzeLife(bazi){
  const birthYear = bazi.birthYear;
  const sections = [];
  const dayG = bazi.pillars.day.g;
  let ageFrom = 0;
  for(const step of bazi.dayun.steps){
    const sG = step.gz[0], sZ = step.gz[1];
    const ssG = shishen(dayG, sG);
    const ssZ = shishen(dayG, CANG[sZ][0]);
    const theme = dayunTheme(ssG, ssZ);
    const startAge = Math.floor(step.start);
    const endAge = Math.ceil(step.end);
    const yearEvents = [];
    const from = Math.max(startAge, ageFrom);
    for(let age = from; age < endAge && age < 90; age++){
      const yy = birthYear + age;
      const sig = analyzeYear(yy, bazi, step, age);
      sig.age = age;
      yearEvents.push(sig);
    }
    ageFrom = endAge;
    sections.push({gz:step.gz, start:step.start, end:step.end, ssG, ssZ, theme, yearEvents, startYear: birthYear+startAge});
  }
  postProcess(sections, bazi);
  return sections;
}

// 后处理：当兵→转业链（当兵后 1-15 年逢财/食伤/印星 + 冲月柱/驿马/破月支/合年支 → 转业）
function postProcess(sections, bazi){
  const dayG = bazi.pillars.day.g;
  const junYears = [];
  for(const sec of sections) for(const ye of sec.yearEvents) if(ye.points["当兵入伍"]) junYears.push(ye);
  if(!junYears.length) return;
  for(const jy of junYears){
    let best = null;
    for(const range of [[8,20],[2,7]]){  // 优先长期服役转业，其次短期退伍
      for(let k=range[0]; k<=range[1]; k++){
        const age = jy.age + k;
        const sec2 = sections.find(s=>age>=Math.floor(s.start)&&age<Math.ceil(s.end));
        if(!sec2) continue;
        const ye = sec2.yearEvents.find(y=>y.age===age);
        if(!ye) continue;
        const yy = bazi.birthYear + age;
        const [lg,lz] = decodeGZ(yearGZ(yy,false));
        const ss = shishen(dayG, lg);
        const yz=bazi.pillars.year.z, mz=bazi.pillars.month.z;
        const yima={"申子辰":"寅","寅午戌":"申","巳酉丑":"亥","亥卯未":"巳"};
        const grp=["申子辰","寅午戌","巳酉丑","亥卯未"].find(g=>g.includes(yz));
        const yimaHit = grp && yima[grp]===lz;
        const chongMonth = LIUCHONG[lz]===mz;
        const chongYear = LIUCHONG[lz]===yz;
        const poMonth = PO[lz]===mz;
        const heYear = LIUHE[lz]===yz;
        const ssOK = ["正财","偏财","食神","伤官","正印","偏印"].includes(ss) || (chongYear && (ss==="比肩"||ss==="劫财"));
        const relOK = chongMonth||yimaHit||poMonth||heYear||chongYear;
        // 冲羊刃（年支为日主羊刃/将星，如庚日主酉）→ 离开军旅之象，转业加分
        const yangRenOf = {甲:"卯",乙:"寅",丙:"午",丁:"巳",戊:"午",己:"巳",庚:"酉",辛:"申",壬:"子",癸:"丑"};
        const chongYangRen = chongYear && yangRenOf[dayG]===yz;
        if(ssOK && relOK){
          const score = (chongMonth?2:0)+(poMonth?2:0)+(yimaHit?1:0)+(heYear?1:0)+(chongYangRen?3:0)+(["正财","偏财","食神","伤官"].includes(ss)?1.5:1);
          if(!best || score>best.score) best = {age, ye, score};
        }
      }
      if(best && range[0]===8) break; // 8-20 内有候选即用它
    }
    if(best && !best.ye.points["转业"]){
      best.ye.points["转业"]=2;
      best.ye.bases.push({sub:"转业", plain:"当兵多年后逢印星/财星发动，又遇冲、破、驿马：这是离开部队、转业回地方工作的信号，转业后重新择业，方向反而对路，是人生一个转折点。", desc:"当兵→转业链"});
    }
  }
}

// 未来12个节气月的流月列表：{gz, mz, ss, d0, d1, notes[], shen[]}
function liuyueList(bazi, tzOffset, count){
  count = count || 12;
  const now = new Date();
  const nowJd = jdn(now.getFullYear(), now.getMonth()+1, now.getDate()) - 0.5 + (now.getHours() + now.getMinutes()/60)/24.0;
  const Y = now.getFullYear();
  const jtMap = {};
  for(const yy of [Y-1, Y, Y+1, Y+2]) jtMap[yy] = jieqiTimes(yy);
  const timeline = [];
  for(const yy of [Y-1, Y, Y+1, Y+2])
    for(let i=0;i<12;i++) timeline.push({jd: jtMap[yy][JIE_LIST[i]] + (tzOffset||8)/24.0, z: JIE_MONTH_ZHI[i]});
  timeline.sort((a,b)=>a.jd-b.jd);
  let idx = 0;
  for(let i=0;i<timeline.length-1;i++){ if(nowJd >= timeline[i].jd && nowJd < timeline[i+1].jd){ idx = i; break; } }
  const out = [];
  const dayG = bazi.pillars.day.g;
  const yz=bazi.pillars.year.z, mm=bazi.pillars.month.z, dz=bazi.pillars.day.z, hz=bazi.pillars.hour.z;
  for(let k=1;k<=count;k++){
    const seg = timeline[idx+k], nxt = timeline[idx+k+1];
    if(!seg || !nxt) break;
    const mz = seg.z;
    // 流年干支：找到满足 立春(yy) <= seg.jd < 立春(yy+1) 的 yy（节气月所属流年）
    let ly = Y-1;
    for(const yy of [Y-1, Y, Y+1]){
      const lc = jtMap[yy]["立春"] + (tzOffset||8)/24.0;
      const lcNext = jtMap[yy+1] ? jtMap[yy+1]["立春"] + (tzOffset||8)/24.0 : lc + 365.25;
      if(seg.jd >= lc && seg.jd < lcNext){ ly = yy; break; }
    }
    const yearIdx = yearGZ(ly, false);
    const monthIdx = monthGZ(yearIdx, mz);
    const [mg] = decodeGZ(monthIdx);
    const ss = shishen(dayG, mg);
    const lyZ = decodeGZ(yearIdx)[1];
    const notes = [];
    const pillarsZ = [["年支",yz,"长辈家宅","elders/home"],["月支",mm,"事业家宅","career/home"],["日支",dz,"感情自身","romance/self"],["时支",hz,"子女晚年","children/later years"]];
    const nameEn = {"年支":"year branch","月支":"month branch","日支":"day branch","时支":"hour branch"};
    for(const [name, z, scope, scopeEn] of pillarsZ){
      if(LIUCHONG[mz]===z) notes.push(["冲"+name+"："+scope+"易有变动，宜稳", "Clashes "+nameEn[name]+": "+scopeEn+" may shift — stay steady"]);
      if(LIUHE[mz]===z) notes.push(["合"+name+"："+scope+"之事顺遂，有助力", "Combines "+nameEn[name]+": "+scopeEn+" goes smoothly, with support"]);
      if((XING[mz]||"").includes(z)) notes.push(["刑"+name+"：防口舌小摩擦", "Punishes "+nameEn[name]+": mind small disputes"]);
      if((HAI[mz]||"").includes(z)) notes.push(["害"+name+"：防暗耗、防小人", "Harms "+nameEn[name]+": guard against hidden loss & schemers"]);
    }
    if(LIUCHONG[mz]===lyZ) notes.push(["冲流年支：本月是全年主题变动的关口，大事宜缓", "Clashes the year branch: a turning point for the year's theme — postpone big moves"]);
    if(LIUHE[mz]===lyZ) notes.push(["合流年支：本月顺应全年大势，办事顺", "Combines the year branch: aligned with the year's trend — smooth sailing"]);
    const shen = flowShensha(mz, bazi);
    out.push({gz: mg+mz, mz, ss, d0: dtFromJd(seg.jd), d1: dtFromJd(nxt.jd), notes, shen});
  }
  return out;
}

    }

  // 五行所缺提示：缺的若是用神五行，更需主动补足
  const wx = wuxingStats(bazi);
  const missing = Object.entries(wx).filter(x=>x[1]<0.5).map(x=>x[0]);

    noteEn += "Your chart lacks "+mainWx+" (which is also favorable) — actively engage "+mainWx+"-element fields to compensate.";
  }
  return {mainWx, altWx, reasonZh, reasonEn, noteZh, noteEn, tiaohouWx};
}

const CAT_GROUP = {
  "升职加薪":"事业","工作变动":"事业","创业契机":"事业","口舌官非":"事业","当兵入伍":"事业","转业":"事业","二次择业":"事业",

};
const CAT_ORDER = ["事业","财运","感情","健康","家庭"];
const CAT_NAME = {事业:"💼 事业",财运:"💰 财运",感情:"❤️ 感情",健康:"🏥 健康",家庭:"🏠 家庭",其他:"📌 其他"};
// 低价值小事件：不进大运主列表（只在逐年细说里出现）
const MINOR_EVENTS = ["和合","摩擦口角","暗耗谨防","人际应酬","进修独处"];

// 聚合每步大运的事件：按五大类分组，每类只报信号最强的那一年
function aggregateSection(sec, bazi){
  const SPECIAL = ["当兵入伍","转业","二次择业","车祸意外","出轨"];
  const subBest = {};
  for(const ye of sec.yearEvents){
    for(const [sub, score] of Object.entries(ye.points)){
      if(ye.age < 16 && (sub==="婚喜"||sub==="恋爱缘"||sub==="出轨")) continue;
      if(ye.age < 23 && sub==="怀孕生子") continue;
      if(ye.age < 20 && sub==="婚喜") continue;
      if(ye.age > 68 && (sub==="婚喜"||sub==="恋爱缘")) continue;
      if(ye.age > 60 && sub==="婚喜") continue;
      if(ye.age > 55 && sub==="恋爱缘") continue;
      if(ye.age > 50 && sub==="怀孕生子") continue;
      if(ye.age < 25 && sub==="丧事") continue;
      if(ye.age < 25 && sub==="出轨") continue;
      if(ye.age > 70 && sub==="感情波动") continue;
      const base = ye.bases.find(b=>b.sub===sub);
      const conf = SPECIAL.includes(sub) ? (score>=6?"高":score>=3?"中":"参考") : (score>=9?"高":score>=5?"中":"参考");
      const cur = subBest[sub];
      if(!cur || score > cur.score){
        subBest[sub] = {score, year: ye.year, age: ye.age, plain: base?base.plain:"", desc: base?base.desc:"", conf};
      }
    }
  }
  const groups = {};
  for(const [sub, info] of Object.entries(subBest)){
    if(MINOR_EVENTS.includes(sub)) continue;
    if(info.score < (SPECIAL.includes(sub)?2:3)) continue;
    const cat = CAT_GROUP[sub]||"其他";
    (groups[cat] = groups[cat]||[]).push({sub, label: SUBCAT[sub]||sub, ...info});
  }
  const result = [];
  for(const cat of CAT_ORDER){
    if(groups[cat]) result.push({cat, items: groups[cat].sort((a,b)=>b.score-a.score).slice(0,2)});
  }
  const others = (groups["其他"]||[]).sort((a,b)=>b.score-a.score).slice(0,2);
  if(others.length) result.push({cat:"其他", items: others});
  let count = 0;
  const trimmed = [];
  for(const g of result){
    const items = g.items.filter(i=>{ if(count>=8) return false; count++; return true; });
    if(items.length) trimmed.push({cat:g.cat, items});
  }
  return trimmed;
}

// 用户输入事件关键词 → 事件类型（中英文）
function mapUserEvent(text){
  const t = String(text||"");
  if(/恋爱|谈恋爱|处对象|拍拖|搞对象|找对象|脱单|相亲|女友|女朋友|男朋友|dating|girlfriend|boyfriend|romance|fall in love/.test(t)) return "恋爱缘";
  if(/参军|入伍|当兵|军校|警队|从军|army|military|enlist|joined|join the|conscription|draft/.test(t)) return "当兵入伍";
  if(/转业|退伍|退役|复员|discharge|transfer (from|out)|veteran|leave the (army|military|service)/.test(t)) return "转业";
  if(/结婚|领证|成家|订婚|marry|marriage|wedding|engaged|got married/.test(t)) return "婚喜";
  if(/生|孩子|女儿|儿子|添丁|二胎|生育|怀孕|birth|baby|child|pregnan|daughter|son|born/.test(t)) return "怀孕生子";
  if(/换工作|跳槽|转行|换行|换行业|调岗|调动|换岗|job change|switch job|new job|changed job|career change|transfer/.test(t)) return "工作变动";
  if(/升职|晋升|提拔|提干|升官|升迁|promot|raise|advance/.test(t)) return "升职加薪";
  if(/破财|亏|损失|投资失败|赔|money loss|lost money|investment fail|loss|bankrupt|broke/.test(t)) return "破财";
  if(/病|住院|手术|受伤|伤|hospital|surgery|injur|sick|illness/.test(t)) return "伤病";
  if(/车祸|事故|撞|accident|crash/.test(t)) return "车祸意外";
  if(/买房|置业|购房|安家|house|property|apartment|bought a house|home/.test(t)) return "置业买房";
  if(/搬家|迁居|换城市|搬迁|move|relocat/.test(t)) return "出行迁居";
  if(/创业|开店|开公司|办厂|business|startup|company|entrepreneur/.test(t)) return "创业契机";
  if(/考试|升学|高考|考研|考证|exam|study|university|college|graduate|school/.test(t)) return "考试升学";
  return null;
}

// 解析用户输入"年份+事件"文本（支持换行/逗号/顿号/分号/空格分隔，支持"1998参军 2005结婚"、"1998 参军"、"2005年1月25日结婚"等写法）
function parseUserEvents(text){
  const out = [];
  const parts = String(text||"").split(/[\n,，、;；|。\s]+/).map(s=>s.trim()).filter(Boolean);
  let pendingYear = null;
  for(const part of parts){
    const m = part.match(/(\d{4})/);
    const sub = mapUserEvent(part);
    if(m && sub){ out.push({year:+m[1], sub, raw: part}); pendingYear = null; }
    else if(m && !sub){ pendingYear = +m[1]; } // 纯年份段：等下一段事件词
    else if(!m && sub && pendingYear != null){ out.push({year:pendingYear, sub, raw: pendingYear+" "+part}); pendingYear = null; }
  }
  return out;
}

// 核验：用户事件年份 ±1 年内是否有对应命理信号
function verifyUserEvents(bazi, userEvents){
  const sections = analyzeLife(bazi);
  const yearMap = {};
  for(const sec of sections) for(const ye of sec.yearEvents) yearMap[ye.year] = ye;
  const results = [];
  for(const ue of userEvents){
    let best = null, bestGap = 99;
    const tryMatch = (subList) => {
      for(const want of subList){ // 按顺序优先：前面的 sub 在同 gap 时胜出
        for(let g=-1; g<=1; g++){
          const ye = yearMap[ue.year+g];
          if(!ye) continue;
          for(const [sub, score] of Object.entries(ye.points)){
            if(sub !== want) continue;
            if(score < 2) continue;
            const gap = Math.abs(g);
            if(gap < bestGap){
              bestGap = gap;
              best = {year: ye.year, sub, score, plain: ((ye.bases.find(b=>b.sub===sub))||{}).plain||"", all: Object.entries(ye.points).map(([s,v])=>[s,v]).sort((a,b)=>b[1]-a[1]).slice(0,4)};
            }
          }
        }
      }
    };
    tryMatch([ue.sub]);
    // 恋爱容错：该年婚喜/感情波动信号强，也算恋爱缘分到位（婚喜文案优先，更贴切）
    if(!best && ue.sub==="恋爱缘") tryMatch(["婚喜","感情波动"]);
    results.push({...ue, matched: !!best, match: best});
  }
  return results;
}

// 一生大事列表：按时间排序，每年最多2件大事，全生命周期取信号最强的
function buildLifeEvents(bazi, userEventsText){
  const sections = analyzeLife(bazi);
  const MAJOR_W = {"婚喜":1.4,"怀孕生子":1.4,"当兵入伍":1.3,"转业":1.3,"车祸意外":1.3,"破财":1.15,"升职加薪":1.15,"置业买房":1.1,"二次择业":1.1,"工作变动":1.0,"恋爱缘":1.1,"出行迁居":0.9,"创业契机":1.1,"伤病":1.05,"偏财进账":0.8,"岁运并临":1.3,"伏吟":0.8};
  const SPECIAL = ["当兵入伍","转业","二次择业","车祸意外","出轨"];
  const ageOK = {"婚喜":[20,60],"怀孕生子":[22,50],"当兵入伍":[16,24],"转业":[20,45],"二次择业":[25,55],"工作变动":[18,60],"恋爱缘":[16,55],"升职加薪":[18,65],"创业契机":[20,65],"置业买房":[20,70],"破财":[18,75],"偏财进账":[18,75],"伤病":[0,99],"车祸意外":[16,80],"出行迁居":[0,99],"岁运并临":[18,99],"伏吟":[18,99]};
  // 用户确认的事件加权，确保出现在列表里
  const boost = {};
  for(const ue of parseUserEvents(userEventsText)) boost[ue.year+"_"+ue.sub] = true;
  const all = [];
  for(const sec of sections){
    for(const ye of sec.yearEvents){
      for(const [sub, score] of Object.entries(ye.points)){
        if(!MAJOR_W[sub]) continue;
        const boosted = !!boost[ye.year+"_"+sub];
        if(score < (SPECIAL.includes(sub)?1.8:2.2) && !boosted) continue;
        const [aMin, aMax] = ageOK[sub]||[0,99];
        if(ye.age < aMin || ye.age > aMax) continue;
        const base = ye.bases.find(b=>b.sub===sub);
        let sc = score*MAJOR_W[sub];
        if(boost[ye.year+"_"+sub]) sc *= 2.5;
        all.push({year:ye.year, age:ye.age, sub, score: sc, raw: score, plain: base?base.plain:"", desc: base?base.desc:""});
      }
    }
  }
  // 每个事件类型取最强2年，整体按分数取 top18
  const subTop = {};
  for(const n of all.sort((a,b)=>b.score-a.score)){
    if(!subTop[n.sub]) subTop[n.sub] = [];
    if(subTop[n.sub].length < 2) subTop[n.sub].push(n);
  }
  let picked = Object.values(subTop).flat().sort((a,b)=>b.score-a.score).slice(0,18);
  const byYear = {};
  for(const n of picked){
    (byYear[n.year] = byYear[n.year]||[]).push(n);
  }
  const events = [];
  for(const [year, list] of Object.entries(byYear)){
    list.sort((a,b)=>b.score-a.score);
    events.push({year:+year, list: list.slice(0,2)});
  }
  return events.sort((a,b)=>a.year-b.year);
}

// 卦名查找：上卦先天数、下卦先天数 → HEX索引
function hexIndex(upper, lower){
  return (XT[upper]-1)*8 + (XT[lower]-1) + 1;
}
function hexByTrigrams(upper, lower){
  return HEX[hexIndex(upper, lower)];
}

function mingGua(year, gender){
  let y = year % 100, r;
  if(gender==="男"){
    r = (year<2000 ? (100-y) : (99-y)) % 9;
  } else {
    r = (year<2000 ? (y-4) : (y+6)) % 9;
  }
  if(r===0) r = 9;
  if(r===5) return gender==="男" ? "坤" : "艮";
  return MINGGUA_NAME[r];
}

// 年飞星：以九星配年，2000年八白入中。顺飞用洛书轨迹
const FEIXING_TRAIL = [5,6,7,8,9,1,2,3,4]; // 中宫→乾→兑→艮→离→坎→坤→震→巽
function yearFlyingStar(year){
  // 年数 mod 9：2000年=八白入中
  let n = ((year - 2000) % 9 + 9) % 9;   // 2000→0
  let zhong = (8 + n) % 9; if(zhong===0) zhong=9;
  const pos = {};
  let idx = FEIXING_TRAIL.indexOf(zhong);
  const grid = ["中","乾","兑","艮","离","坎","坤","震","巽"];
  for(let i=0;i<9;i++){
    const star = (zhong + i - 1) % 9 + 1;
    pos[grid[i]] = star;
  }
  return {zhongStar: zhong, pos};
}

// ---------- 姓名起卦（梅花易数姓名法） ----------
// 姓笔画数（康熙字典）→上卦，名笔画数→下卦，总笔画→动爻
const KX_STROKE = {}; // 康熙笔画表，常用字内置，未知字用简体笔画兜底
function nameHex(name){
  if(!name) return null;
  const chars = name.trim().split("");
  if(chars.length < 2) return null;
  const surname = chars[0], given = chars.slice(1).join("");
  const sSt = strokeOf(surname), gSt = strokeOf(given);
  if(!sSt || !gSt) return null;
  const upper = XT_NAME[((sSt-1)%8)+1], lower = XT_NAME[((gSt-1)%8)+1];
  const dong = ((sSt+gSt-1)%6)+1;
  return {upper, lower, sSt, gSt, dong, hex: hexByTrigrams(upper, lower)};
}
function strokeOf(ch){
  if(KX_STROKE[ch]) return KX_STROKE[ch];
  // 兜底：用 Unicode 码位粗算笔画（仅作参考）
  return (ch.codePointAt(0) % 20) + 1;
}

// 农历取数：年支序(子1..亥12) + 月数 + 日数 → 上卦；加时支序 → 下卦；总 → 动爻
function timeHex(birthY, birthM, birthD, birthH){
  // 农历
  let lm = birthM, ld = birthD, ly = birthY;
  try{
    const lun = gregorianToLunar(birthY, birthM, birthD);
    if(lun){ lm = lun.lunarM; ld = lun.lunarD; ly = lun.lunarY; }
  }catch(e){}
  const yearZhiIdx = ((ly - 4) % 12 + 12) % 12; // 0=子
  const zhiN = yearZhiIdx + 1;
  const hourZhi = ((birthH + 1) % 24) >> 1;      // 23-1=子... 时支序
  const hourN = hourZhi + 1;
  const upN = (zhiN + lm + ld) % 8;
  const downN = (zhiN + lm + ld + hourN) % 8;
  const dong = ((zhiN + lm + ld + hourN) % 6) + 1;
  const upper = XT_NAME[upN===0?8:upN], lower = XT_NAME[downN===0?8:downN];
  return {upper, lower, dong, hex: hexByTrigrams(upper, lower), lunar:{y:ly,m:lm,d:ld}, hourN};
}

// 流年卦：以流年干支序 + 年龄起卦
function yearHex(lunarYear, age){
  const gzIdx = ((lunarYear - 4) % 60 + 60) % 60;   // 1984甲子=0
  const zhiN = ((lunarYear - 4) % 12 + 12) % 12 + 1;
  const upN = (gzIdx + zhiN + age) % 8;
  const downN = (gzIdx + age) % 8;
  const dong = ((gzIdx + age + zhiN) % 6) + 1;
  const upper = XT_NAME[upN===0?8:upN], lower = XT_NAME[downN===0?8:downN];
  return {upper, lower, dong, hex: hexByTrigrams(upper, lower)};
}

// 卦的吉凶基调→权重系数（用于给八字事件加权）
function guaWeight(hex){
  if(!hex) return 1;
  const t = hex.tone;
  if(t==="大吉") return 1.25;
  if(t==="吉") return 1.1;
  if(t==="中平") return 1.0;
  if(t==="凶") return 0.85;
  return 1;
}
function guaIsWarning(hex){
  return hex && (hex.tone==="凶" || hex.warn && hex.warn.indexOf("警示")===0);
}

// 姓名五行与八字喜忌配合提示
function nameWxHint(bazi, nameHexInfo){
  if(!nameHexInfo) return "";
  const upper = nameHexInfo.upper, lower = nameHexInfo.lower;
  const wxU = TRIGRAM_WX[upper], wxL = TRIGRAM_WX[lower];
  return `${upper}（${wxU}）＋${lower}（${wxL}）`;
}

// 主入口：融合分析
function yijingJiugongAnalysis(bazi, input){
  const out = {benmingGua:null, nameGua:null, mingGua:null, yun:null, feixing:null,
               liunianGua:[], majorEvents:[], pastReview:[], hints:[]};
  const ts = bazi.trueSolar;
  const gender = input.gender==="male" ? "男" : "女";
  const birthYear = ts.y, birthMonth = ts.m, birthDay = ts.d, birthHour = ts.h;

  // 1. 本命卦（出生时间起卦）
  out.benmingGua = timeHex(birthYear, birthMonth, birthDay, birthHour);

  // 2. 姓名卦
  if(input.name) out.nameGua = nameHex(input.name);

  // 3. 八宅命卦
  out.mingGua = mingGuaText(mingGua(birthYear, gender));

  // 4. 三元九运（当前年份）
  const now = new Date();
  out.yun = currentYun(now.getFullYear());

  // 5. 年飞星（当前年份）
  out.feixing = yearFlyingStar(now.getFullYear());
  const fx = out.feixing.pos;
  // 找出凶星方位
  out.badStars = [];
  for(const dir in fx){
    const s = STAR_JX[fx[dir]];
    if(s.tone==="凶" || s.tone==="大凶") out.badStars.push({dir, star:s.name, tone:s.tone, desc:s.desc});
  }
  out.goodStars = [];
  for(const dir in fx){
    const s = STAR_JX[fx[dir]];
    if(s.tone==="吉" || s.tone==="大吉") out.goodStars.push({dir, star:s.name, tone:s.tone, desc:s.desc});
  }

  // 6. 大运信息（用于年龄换算）
  const steps = (bazi.dayun && bazi.dayun.steps) || [];
  const startYear = birthYear - 1; // 近似（虚岁1岁起点）
  const today = new Date();
  const curAge = today.getFullYear() - birthYear + 1;

  // 7. 流年卦：近5年（回顾）+ 未来15年（预判）
  const spanStart = Math.max(1, curAge - 5);
  for(let age = spanStart; age <= curAge + 15; age++){
    const y = startYear + age;
    const g = yearHex(y, age);
    out.liunianGua.push({year:y, age, ...g});
  }

  // 8. 重大事件融合：八字事件引擎 + 卦象交叉验证
  const baziEvents = (typeof buildLifeEvents === "function") ? buildLifeEvents(bazi, (input.userEvents||"")) : [];
  // 流年卦映射 year→hex
  const guaByYear = {};
  for(const g of out.liunianGua) guaByYear[g.year] = g;

  // 八字引擎事件 → 融合卦象加权，并附卦象佐证
  const fused = [];
  for(const ev of baziEvents){
    for(const item of (ev.list||[])){
      const gg = guaByYear[ev.year];
      const w = guaWeight(gg ? gg.hex : null);
      const warn = gg && guaIsWarning(gg.hex);
      let level = (item.score||0) * w;
      if(warn && (item.sub==="破财"||item.sub==="车祸意外"||item.sub==="伤病"||item.sub==="丧事"||item.sub==="口舌官非")) level *= 1.4;
      fused.push({
        year: ev.year, age: item.age, sub: item.sub, level,
        baziPlain: item.plain, guaName: gg ? gg.hex.name : "",
        guaTone: gg ? gg.hex.tone : "", guaWarn: warn,
        guaPlain: gg ? gg.hex.plain : ""
      });
    }
  }
  fused.sort((a,b)=>b.level-a.level);
  const seen = {};
  const majors = [];
  for(const f of fused){
    const key = f.year+"_"+f.sub;
    if(seen[key]) continue;
    seen[key] = true;
    if(majors.length >= 16) break;
    majors.push(f);
  }
  out.majorEvents = majors.sort((a,b)=>a.year-b.year);

  // 9. 过往回顾：八字引擎的过去事件 + 当年卦象
  for(const ev of out.majorEvents){
    if(ev.year <= today.getFullYear()) out.pastReview.push(ev);
  }

  return out;
}

// 五行旺衰简评 + 喜用神（简化规则：按月令旺相休囚死 + 得地通根）
function strengthAnalysis(bazi){
  const dg = bazi.pillars.day.g;
  const dw = WX_GAN[dg];
  const mz = bazi.monthZhi;
  const mw = {寅:"木",卯:"木",巳:"火",午:"火",申:"金",酉:"金",亥:"水",子:"水",辰:"土",戌:"土",丑:"土",未:"土"}[mz];
  const sheng = {木:"水",火:"木",土:"火",金:"土",水:"金"}; // 生我
  const order = {木:["木","火","土","金","水"],火:["火","土","金","水","木"],土:["土","金","水","木","火"],金:["金","水","木","火","土"],水:["水","木","火","土","金"]};
  const seasonRank = order[dw].indexOf(mw); // 0=当令最强
  const roots = [bazi.pillars.year.z,bazi.pillars.month.z,bazi.pillars.day.z,bazi.pillars.hour.z].filter(z=>WX_GAN[z]===dw || CANG[z].some(c=>WX_GAN[c]===dw)).length;
  let score = (seasonRank===0?4:seasonRank===1?2:seasonRank===2?0:-2) + roots*1.5;
  let strong = score >= 4;
  // 同党（印比）异党（财官食伤）数量
  const sameWx = ["比肩","劫财","正印","偏印"];
  let same=0, diff=0;
  for(const p of [bazi.pillars.year,bazi.pillars.month,bazi.pillars.day,bazi.pillars.hour]){
    const s1 = shishen(dg, p.g);
    if(sameWx.includes(s1)) same++; else diff++;
  }
  const verdict = strong ? (LANG==="zh"?"偏强":"Slightly Strong") : (LANG==="zh"?"偏弱":"Slightly Weak");
  const xi = strong ? (LANG==="zh"?"克泄耗（官杀、食伤、财星）":"Draining elements (Officer, Output, Wealth)") : (LANG==="zh"?"生扶（印星、比劫）":"Supporting elements (Resource, Peer)");
  const ji = strong ? (LANG==="zh"?"印比":"Resource & Peer") : (LANG==="zh"?"财官食伤":"Wealth, Officer & Output");
  return {score, strong, verdict, xi, ji, same, diff, season: mw, seasonRank};
}
// 五行缺补
function wuxingStats(bazi){
  const cnt = {金:0,木:0,水:0,火:0,土:0};
  for(const p of [bazi.pillars.year,bazi.pillars.month,bazi.pillars.day,bazi.pillars.hour]){
    cnt[WX_GAN[p.g]]++;
    for(const c of CANG[p.z]) cnt[WX_GAN[c]] += 0.6;
  }
  return cnt;
}

function run(){
  try{
    if (window.Paywall && !Paywall.countUse('八字命理详批')) return;
    const name = document.getElementById("inName").value.trim();
    const gender = document.getElementById("inGender").value;
    const calendar = document.getElementById("inCalendar").value;
    const dateStr = document.getElementById("inDate").value;
    const timeStr = document.getElementById("inTime").value;
    const cityInput = document.getElementById("inCity").value;
    const lon = parseFloat(document.getElementById("inLon").value);
    const tz = parseFloat(document.getElementById("inTz").value);
    const useTrueSolar = document.getElementById("optTrueSolar").checked;
    const lateZishi = document.getElementById("optZishi").checked;
    if(!dateStr || !timeStr){ alert(T("请填写出生日期和时间")); return; }
    if(isNaN(lon)){ alert(T("请选择出生地或填写经度")); return; }
    const [yy, mm, dd] = dateStr.split("-").map(Number);
    const [hh, mi] = timeStr.split(":").map(Number);
    let solar = {y:yy, m:mm, d:dd};
    if(calendar === "lunar"){
      const leap = document.getElementById("inLunarLeap").value === "1";
      const g = lunarToGregorian(yy, mm, dd, leap);
      if(!g){ alert(T("农历日期转换失败，请检查日期是否正确")); return; }
      solar = {y:g.y, m:g.m, d:g.d};
    }
    let cityName = cityInput.replace(/（.*|\(.*/,"").trim();
    if(!CITIES.find(x=>x.name===cityName)){
      const cn = Object.keys(CITY_EN).find(k=>CITY_EN[k].toLowerCase()===cityName.toLowerCase());
      if(cn) cityName = cn;
    }
    const bazi = buildBazi({y:solar.y, m:solar.m, d:solar.d, h:hh, mi:mi}, lon, tz, gender, useTrueSolar, lateZishi);
    const userEventsText = (document.getElementById("inEvents")||{}).value||"";
    window.__lastBazi = bazi;
    window.__lastInput = {name, gender, calendar, dateStr, timeStr, city: cityName||T("自定义"), lon, tz, useTrueSolar, lateZishi, userEvents: userEventsText};
    renderReport(bazi, window.__lastInput);
  }catch(e){
    console.error(e);
    alert(T("排盘出错：") + e.message);
  }
}

    h.push(`<div style="line-height:1.9"><b>🔴 凶星方位（宜避）：</b>${yj.badStars.map(s=>`${s.dir}（${s.star}${s.tone==="大凶"?"‼":""}：${s.desc}）`).join("；")}</div>`);
    h.push(`<div style="line-height:1.9"><b>🟢 吉星方位（宜用）：</b>${yj.goodStars.map(s=>`${s.dir}（${s.star}：${s.desc}）`).join("；")}</div>`);
    h.push(`<div style="line-height:1.9;color:#64748b">流年方位提示：凶星方少动土、装修、长期坐卧；吉星方宜办公、会客、布置旺位。</div>`);
    h.push(`</div>`);
  }

  // 5. 重大事件融合（八字事件 + 流年卦印证）
  if(yj.majorEvents.length){
    h.push(`<div class="section-title">🔮 重大事件 · 八字与卦象双重印证</div>`);
    h.push(`<div style="color:#64748b;font-size:.8rem;margin-bottom:6px">下面的年份，八字事件引擎有信号，同时当年的流年卦也在说同一件事（卦名＋卦辞附后）——两套体系指向同一件事的年份，可信度最高。⚠️ 凶卦年份（凶/警示）会加重破财、伤病、官非类事件的权重。</div>`);
    const nowYear = new Date().getFullYear();
    for(const ev of yj.majorEvents){
      const isPast = ev.year <= nowYear;
      const toneCls = ev.guaTone==="大吉"?"conf-high":(ev.guaTone==="凶"?"conf-ref":"conf-mid");
      h.push(`<div class="ev-item">`);
      h.push(`<div class="ev-head"><span class="ev-cat">${subLabel(ev.sub)}</span><span style="font-size:.78rem">${isPast?"<span style='color:#10b981'>已过</span>":"<span style='color:#f59e0b'>未来</span>"} · 八字把握${ev.level>=7?"高":ev.level>=4.5?"中":"参考"}</span></div>`);
      h.push(`<div class="ev-when">🎯 ${zh?`${ev.year}年（${ev.age}岁）`:`${ev.year} (age ${ev.age})`}${ev.guaName?` · 流年卦 <b>${ev.guaName}</b> <span class="${toneCls}">${ev.guaTone}</span>`:""}</div>`);
      if(ev.baziPlain) h.push(`<div class="ev-plain">八字依据：${ev.baziPlain}</div>`);
      if(ev.guaName) h.push(`<div class="ev-plain" style="color:#0f766e">卦象印证：${ev.guaPlain}</div>`);
      h.push(`</div>`);
    }
    h.push(`</div>`);
  }

  // 6. 流年卦细表（近5年+未来15年）
  if(yj.liunianGua.length){
    h.push(`<div class="section-title">📜 逐年卦象（近5年回顾＋未来15年预判）</div>`);
    h.push(`<div style="overflow-x:auto"><table class="dayun-table" style="font-size:.8rem">`);
    h.push(`<tr><th>年份</th><th>岁数</th><th>卦名</th><th>吉凶</th><th>这一年卦象在说什么</th></tr>`);
    for(const g of yj.liunianGua){
      const hex = g.hex;
      const nowYear = new Date().getFullYear();
      const mark = g.year===nowYear?" ← 今年":(g.year<nowYear?"":"");
      h.push(`<tr><td>${g.year}${mark}</td><td>${g.age}</td><td><b>${hex.name}</b></td><td>${hex.tone}</td><td style="max-width:340px">${hex.plain}${hex.tone==="凶"?" ⚠️":""}</td></tr>`);
    }
    h.push(`</table></div>`);
    h.push(`<div style="color:#94a3b8;font-size:.75rem;margin-top:6px">注：流年卦按梅花易数取数（流年干支＋年龄起卦），与八字大运、流年神煞相互独立、互相印证。</div>`);
  }

  h.push(`</div>`);
  return h.join("");
}

applyLang();
</script>
</body>
</html>
