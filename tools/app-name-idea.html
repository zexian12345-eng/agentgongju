<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.name-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:16px 18px;margin-bottom:10px}
.name-card .main{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.name-card .nm{font-size:1.25rem;font-weight:700;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.name-card .dom{font-size:.82rem;color:#94a3b8}
.name-card .mean{font-size:.85rem;color:#cbd5e1;line-height:1.6}
.copy-btn{padding:6px 14px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.82rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>

</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>📱 AI 应用产品起名</h1><p>让好产品配上好名字，开创新品牌</p></div>

<div class="card">
<label>🤖 产品类型</label>
<select id="type">
<option value="工具">🛠 效率工具类</option>
<option value="社交">💬 社交社区类</option>
<option value="电商">🛒 电商购物类</option>
<option value="教育">📚 学习教育类</option>
<option value="健康">💪 健康运动类</option>
<option value="娱乐">🎮 娱乐媒体类</option>
<option value="AI">🤖 AI智能类</option>
<option value="生活">🏠 生活应用类</option>
</select>
<label>🧩 核心功能简述（选填）</label>
<input type="text" id="func" placeholder="例如：AI简历优化、宠物社交、零基础学英语、冥想助眠">
<button class="btn-gen" id="genBtn">🚀 生成名字</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:16px">✅ 为你推荐的产品名</div>
<div id="nameBox"></div>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const pool={
'工具':[['灵犀','LinkHive.com','寓意灵感相通，效率连接'],['拾光','Timepick.com','把握每一刻时间价值'],['速成','QuickDone.com','高效处理日常任务'],['简行','SimpleGo.com','化繁为简'],
['脉动','PulsePro.com','推进节奏，提效利器'],['闪记','FlashNote.com','一闪而过的灵感都记下']],
'社交':[['遇见','MeetYou.app','遇见有趣的灵魂'],['莓语','BerryTalk.com','轻社交，说心里话'],['同频','SoulMate.app','找到同频的人'],['灵犀圈','CircleIn.app','兴趣同好聚集地'],
['小叙','Chatter.id','轻松聊天，交到朋友'],['暖场','WarmDay.app','让交流不再冷场']],
'电商':[['优选','BestChoice.cn','精选好物一站购'],['闪淘','FlashCart.com','潮流好物即时抢'],['拾货','PickGoods.app','发现生活小确幸'],['惠购','SavingsBuy.com','省钱又省心'],
['好物集','GoodCase.app','好物聚集地'],['鲜购','FreshGo.com','新鲜直达到家']],
'教育':[['知了','Known.top','知识一学就懂'],['学芽','LearnBud.com','让学习像发芽般自然'],['拾课','PickClass.app','精选好课随心学'],['笃学','SteadyLearn.cn','踏实学习每一步'],
['慧读','WiseRead.app','高效阅读成长'],['启点','StartPoint.cn','每个起点都精彩']],
'健康':[['跃动','JumpFit.app','动起来更健康'],['轻体','LiteBody.cn','科学管理好状态'],['元气','VigorUp.app','元气满满每一天'],['舒眠','SleepEase.app','安心入眠好梦'],
['健步','StepZen.com','日常步行计时'],['养草','GreenBio.app','由内而外的养护']],
'娱乐':[['趣漫','FunManga.app','漫画追不停'],['乐享','JoyPlay.tv','快乐即刻出发'],['奇遇','WonderX.io','精彩内容不设限'],['微音','MicroSound.app','听点不一样的声音'],
['悦咔','Yueka.app','卡片记录快乐'],['影间','MovieNook.com','私人观影空间']],
'AI':[['智造','AICraft.dev','用AI创造价值'],['灵界','BoundAI.app','AI的无限可能'],['慧脑','SmartMind.cn','聪明决策好帮手'],['启智','AIStartHub.ai','开启智能助手'],
['元算','MetaCal.com','精准计算洞察'],['深绘','DeepDraw.ai','AI赋能创意']],
'生活':[['栖居','NestLife.cn','安顿日常美好'],['甜点时光','SweetCore.app','每日加点甜'],['拾味','TastePick.com','吃喝玩乐指南'],['乐居','HappyHome.cn','把日子过成诗'],
['小满','GoodEnough.app','小满胜万全'],['拾暖','WarmPick.com','生活中的小温暖']]};
function rand(a){return a[Math.floor(Math.random()*a.length)]}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 应用产品起名 | AgentGongju.com'))return;
const type=document.getElementById('type').value;
const func=document.getElementById('func').value.trim();
const arr=pool[type];
const used=[];
const box=document.getElementById('nameBox');box.innerHTML='';
for(let i=0;i<6;i++){
const item=rand(arr);
if(used.includes(item[0])){i--;continue;}
used.push(item[0]);
const mean=func?item[2]+'，契合「'+func+'」':item[2];
const card=document.createElement('div');card.className='name-card';
card.innerHTML=`<div class="main">
<div><div class="nm">✦ ${item[0]}</div><div class="dom">推荐域名/ID：${item[1]}</div></div>
<button class="copy-btn" onclick="copyN('${item[0]}')">复制</button>
</div>
<div class="mean">💡 ${mean}；名字朗朗上口，适合年轻化品牌调性。</div>`;
box.appendChild(card);
}
document.getElementById('resultArea').classList.add('active');
});
function copyN(n){navigator.clipboard.writeText(n).then(()=>alert('✅ 已复制：'+n))}
</script>
</body>
</html>
