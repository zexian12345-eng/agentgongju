<select id="type"><option value="li">锂电池</option><option value="lead" selected>铅酸电池</option><option value="unknown">不知道 / 看车型</option></select></div>

<select id="freq"><option value="daily" selected>每天通勤（10-30km）</option><option value="short">偶尔骑（每周 1-2 次）</option><option value="long">跑外卖/长途（50km+）</option><option value="rare">基本闲置</option></select></div>
</div>

<select id="issue"><option value="new">刚买，想用得久一点</option><option value="short">续航明显变短了</option><option value="charge">充电变慢/充不满</option><option value="winter">冬天掉电特别快</option><option value="swell">电池鼓包/发烫</option></select></div>

<script>
function gen(){
var type=document.getElementById('type').value;
var freq=document.getElementById('freq').value;
var climate=document.getElementById('climate').value;
var issue=document.getElementById('issue').value;
var isLi=type==='li';
var out='════ 电动车电池保养方案 ════\n\n';
out+='──── 🔋 你的电池：'+(isLi?'锂电池':type==='lead'?'铅酸电池':'类型待确认')+' ────\n';
if(type==='unknown')out+='判断方法：看充电器铭牌——写"锂离子电池充电器"是锂电；写"铅酸蓄电池充电器"是铅酸。也可以问卖车门店。\n';
if(isLi)out+='锂电池特点：寿命长（约 800-1500 次循环）、重量轻、无记忆效应，但对温度敏感，且过度充放电伤害大。\n';
else if(type==='lead')out+='铅酸电池特点：便宜、耐操，但重、寿命短（约 300-500 次循环），怕深放电和长期亏电。\n';
out+='\n──── ⚡ 充电规范（最重要）────\n';
if(isLi){
out+='· 电量降到 20%-30% 就要充，别用到自动断电；\n';
out+='· 日常充到 80%-90% 即可，不必每次都 100%；\n';
out+='· 充满后及时拔掉，避免长时间浮充（锂电浮充会加速老化）；\n';
out+='· 用原装或同规格充电器，别乱用快充；\n';
out+='· 充电时不要在密闭高温环境，电池别放阳光下。\n';
}else{
out+='· 尽量随用随充，别等完全没电再充（深放电最伤）；\n';
out+='· 铅酸电池要"充满即止"，一般充电 6-8 小时；\n';
out+='· 天冷充电时间可适当延长 1-2 小时；\n';
out+='· 每周至少充满一次，避免欠充导致硫化；\n';
out+='· 别用大电流快充，铅酸最怕这个。\n';
}
out+='\n──── 🅿️ 存放建议 ────\n';
if(freq==='rare')out+='基本闲置：⚠️ 这是最伤电池的情况！\n· 锂电池：保持 50% 左右电量存放，每 2-3 个月补一次电；\n· 铅酸：每月至少充一次，否则会硫化报废；\n· 存放温度 0-25℃ 最理想，避免暴晒或严寒。';
else if(freq==='daily')out+='每天通勤：晚上回家就充，早上出发前拔掉。这样能避开高温充电，也避免整夜浮充。';
else if(freq==='long')out+='跑外卖/长途：一天可能充 2 次，建议两班倒用车时中间让电池冷却 20 分钟再充，避免电池过热。';
else out+='偶尔骑：每次用完就补电，别拖到要用时才发现没电。';
out+='\n\n──── 🌡 气候对应措施 ────\n';
if(climate==='north')out+='北方冬季：\n· 气温低时续航掉 30%-50% 属正常物理现象，不是电池坏了；\n· 冬天把电池拆下拿进屋里充电，充电效率更高；\n· 骑行前可先"预热"——低速骑几分钟让电池升温；\n· 铅酸电池在零下会更明显掉电，建议冬季缩短单次骑行距离。';
else if(climate==='south')out+='南方潮湿：\n· 雨天注意防水，电池仓接口易氧化，定期擦干；\n· 高温天避免正午暴晒后立刻充电，先冷却 30 分钟；\n· 潮湿季节可用防潮垫，防止触点生锈导致接触不良。';
else out+='中部四季分明：\n· 夏季避高温充电，冬季避低温存放；\n· 换季时（3 月、11 月）做一次完整充放电校准。';
out+='\n\n──── 🩺 你的具体问题 ────\n';
if(issue==='short')out+='续航变短：\n可能原因：① 电池老化（铅酸 1.5-2 年、锂电 2-3 年后性能下降）② 长期深放电 ③ 冬季低温 ④ 轮胎气压不足/刹车拖滞等车辆问题\n建议：先检查轮胎气压和刹车，再测电池电压，最后考虑换电池。';
else if(issue==='charge')out+='充电慢/充不满：\n· 先换一个同规格充电器测试，排除充电器故障；\n· 检查充电口是否氧化、松动；\n· 铅酸电池出现充不满且发烫，多半是电池老化需更换；\n· 锂电充不满可能是保护板问题，建议送检。';
else if(issue==='winter')out+='冬天掉电快：\n这是低温导致的正常现象，回暖后会恢复。可以：\n· 进屋充电；\n· 出发前先低速骑行预热；\n· 减少急加速（急加速电流大，低温下更耗电）；\n· 到目的地立即充电，趁电池还热效率更高。';
else if(issue==='swell')out+='🚨 电池鼓包/发烫：非常危险！\n· 立即停止使用，不要充电；\n· 鼓包的锂电池有起火爆炸风险，绝对不能继续用；\n· 送到正规门店或电池回收点处理，不要自行拆解；\n· 铅酸鼓包同样需要更换，多半是过充导致。';
else out+='新电池想用得更久：\n· 前 3 次充电充 8-10 小时（激活），但不要超过 12 小时；\n· 之后按正常规范充电；\n· 避免亏电存放，那是对新电池最大的伤害。';
out+='\n\n──── ✅ 每月自检清单 ────\n';
out+='□ 检查充电器线缆是否破损、发热\n□ 检查电池外壳有无鼓包、变形、漏液\n□ 检查充电口是否氧化、松动\n□ 轮胎气压是否正常（气压低会大幅增加耗电）\n□ 刹车是否拖滞（捏不动或一直摩擦都是问题）\n□ 记录续航变化，突然掉 30% 以上要送检\n';
out+='\n──── 💰 关于更换 ────\n';
out+='· 铅酸：一般 1.5-2 年更换，以旧换新通常抵 80-150 元；\n';
out+='· 锂电：2-3 年或容量掉到 70% 以下更换；\n';
out+='· 更换时认准电压和容量完全一致（如 48V20Ah 换 48V20Ah）；\n';
out+='· 不要为了便宜买"翻新电池"，寿命往往只有半年。\n';
return out;
}
</script>
