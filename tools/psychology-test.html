{title:'🦁 选一种动物，测你的能量来源',opts:['🦁 狮子','🐬 海豚','🦊 狐狸','🐢 乌龟'],
res:['狮子型：你的能量来自"被需要"与"被认可"。你天生有领导力，站上舞台就发光。记住：真正的强大，是既能带领别人，也懂照顾自己。',

{title:'🏠 选一座房子，测你的生活状态',opts:['🏡 温馨小院','🏰 童话城堡','🏙️ 高层公寓','🏕️ 森林木屋'],

'柠檬型：你近期需要一点"清凉提神"，运势平稳中带波动。适合低调积累、先处理好眼前事，谨慎会让你避开小坑。',

let sel=null;
function render(focus){
const t=tests[focus];
let html=`<div style="color:#e2e8f0;font-weight:600;margin:16px 0 8px">${t.title}</div>`;
t.opts.forEach((o,i)=>{
html+=`<label class="opt" id="opt${i}"><input type="radio" name="q" value="${i}" style="display:none">${o}</label>`;
});
document.getElementById('qArea').innerHTML=html;
document.querySelectorAll('.opt').forEach((el,idx)=>{
el.addEventListener('click',()=>{
sel=idx;
document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
el.classList.add('sel');
});
});
}
render(0);
document.getElementById('choice').addEventListener('change',e=>{sel=null;render(parseInt(e.target.value));});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 已复制！'))}
document.getElementById('genBtn').addEventListener('click',()=>{

const t=tests[qi];
let out=`🔮 趣味心理测试\n题目：${t.title}\n你的选择：${t.opts[sel]}\n\n✨ 结果解析\n${t.res[sel]}\n\n💡 温馨提示\n本测试仅供参考与娱乐，结果只代表一种视角。此刻的你就是最好的你。\n\n#心理测试 #趣味测试 #我的性格底色`;

});
</script>
