<script>
const data={
fb:{title:'爸爸的兄弟',names:{m:'伯伯（比爸大）/ 叔叔（比爸小）',f:'伯伯/叔叔（配偶称婶婶/伯母）',old:'伯父（比爸爸年长的哥哥）',young:'叔父（比爸爸小的弟弟）'},extra:'爸爸的哥哥叫"伯伯/伯父"，弟弟叫"叔叔"，其妻分别称"伯母/婶婶"。'},
fs:{title:'爸爸的姐妹',names:{m:'（姑姑，随男性示例改用）',f:'姑姑（比爸大）/小姑（比爸小）',old:'大姑姑',young:'小姑姑'},extra:'爸爸的姐妹通称"姑姑"，其丈夫叫"姑父"。'},
mb:{title:'妈妈的兄弟',names:{m:'舅舅',f:'舅妈（舅舅的妻子）',old:'大舅',young:'小舅'},extra:'妈妈的哥哥弟弟都叫"舅舅"，舅舅的妻子叫"舅妈"。'},
ms:{title:'妈妈的姐妹',names:{m:'（姨，随女性示例）',f:'姨妈/小姨',old:'大姨（比妈大）',young:'小姨（比妈小）'},extra:'妈妈的姐妹通称"姨妈/小姨"，其丈夫叫"姨父/姨夫"。'},
fbf:{title:'爸爸的爸爸（爷爷辈）',names:{m:'爷爷（父亲的父亲）/祖父',f:'奶奶（父亲的母亲）/祖母',old:'爷爷（北方）',young:'阿公/爷爷（南方）'},extra:'爸爸的爸爸称"爷爷/祖父"，妈妈称呼为"外公/姥爷"（看地区）。'},
fbw:{title:'爸爸兄弟的妻子',names:{m:'（随丈夫称谓）',f:'伯母（哥哥的妻子）/婶婶（弟弟的妻子）',old:'伯母',young:'婶婶'},extra:'爸爸哥哥的妻子叫"伯母"，爸爸弟弟的妻子叫"婶婶"。'},
msh:{title:'妈妈姐妹的丈夫',names:{m:'姨父/姨夫',f:'（随妻子称谓）',old:'大姨父',young:'小姨夫'},extra:'妈妈的姐妹的丈夫叫"姨父/姨夫"。'},
cousin:{title:'堂/表兄弟姐妹',names:{m:'堂哥/堂弟（爸爸兄弟的孩子）；表哥/表弟（姑姑或妈妈姐妹的孩子）',f:'堂姐/堂妹；表姐/表妹',old:'堂哥/表哥（比你大）',young:'堂弟/表弟（比你小）'},extra:'爸爸兄弟的孩子叫"堂"系，姑姑或妈妈这边姐妹的孩子叫"表"系；姑舅姨的孩子都属"表"。'}
};
document.getElementById('genBtn').addEventListener('click',function(){
if(!Paywall.countUse('AI家族称呼计算器 | AgentGongju.com'))return;
const rel=document.getElementById('relation').value;
const g=document.getElementById('gender').value;
const region=document.getElementById('region').value;
const d=data[rel];
const name=d.names[g];
let out='【称呼计算】\n你问的关系：'+d.title+'\n\n';
out+='🎯 应该称呼：'+name+'\n';
if(g==='m'&&(rel==='fs'||rel==='ms'))out+='（对方是"姐妹"一般用女性称呼，男性示例仅供参考）\n';
if(g==='old'||g==='young')out+='（已按长幼帮你排了①优先说法）\n';
out+='\n📖 称呼原理\n'+d.extra+'\n';
out+=(region==='north'?'\n【北方叫法】多用"伯、叔、姑、舅、姨"+长幼，重礼数。':region==='south'?'\n【南方叫法】部分地方称父亲"阿爸/阿公"，族内排行称呼较多。':'\n【通用做法】当面不确定时，笑着喊句"叔叔/阿姨好，我是您家XX家的孩子"最稳妥不尴尬。');
out+='\n\n【加分小技巧】\n· 实在拿不准，先叫"长辈好"再随大家口吻，基本不会错。\n· 各地方言差异大，入乡随俗最保险。👨‍👩‍👧‍👦';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 结果已复制！'))}
</script>
