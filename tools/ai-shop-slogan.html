function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI店铺开业Slogan标语生成器 | AgentGongju.com'))return;
const ind=document.getElementById('industry').value;
const sel=document.getElementById('selling').value;
const store=document.getElementById('store').value.trim();
const indPool=shuffle([...IDF[ind]]).slice(0,3);
const selLines=shuffle([...SELL[sel]]).slice(0,2);
let r=(store?'【'+store+' · 开业标语集】\n\n':'【开业标语集】\n\n');
r+='★ 适合招牌 / 开业横幅：\n';
indPool.forEach((s,i)=>{r+=(i+1)+'. '+s+'\n';});
r+='\n★ 主打「'+sel+'」的补充句：\n';
selLines.forEach((s,i)=>{r+='· '+s+'\n';});
r+='\n★ 朗朗上口短句版：\n';
const short=makeShort(ind);
short.forEach((s,i)=>{r+='· '+s+'\n';});
r+='\n———— 小贴士 ————\n';
r+=(store?('已把店名「'+store+'」的意境铺进备选，正式使用可再微调谐音或嵌入店名：\n'):'建议把店名、地址写进标语，更有独家感：\n');
r+='· 开店横幅用「短句+情绪词」最戳人；\n· 菜单/价签旁可放一句延伸文案做彩蛋。';
document.getElementById('outputBox').innerText=r;
document.getElementById('resultArea').classList.add('active');
});

function makeShort(ind){return SHORT[ind]||['客来客往，都是缘','你开心就好','今天也要来坐坐']; }
