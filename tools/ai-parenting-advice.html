<div class="card">
<div class="param-row">
<div><label>👶 孩子年龄</label>
<select id="age"><option value="2">2-3 岁（幼儿）</option><option value="4">4-6 岁（学龄前）</option><option value="7" selected>7-9 岁（小学低年级）</option><option value="10">10-12 岁（小学高年级）</option><option value="13">13-15 岁（青春期）</option><option value="16">16-18 岁（高中）</option></select></div>
<div><label>😤 主要难题</label>
<select id="issue"><option value="homework">不写作业/拖拉</option><option value="tantrum">发脾气/哭闹</option><option value="talkback">顶嘴/不听话</option><option value="phone">沉迷手机</option><option value="lie">撒谎</option><option value="shy">胆小/不爱社交</option><option value="school">不想上学</option><option value="sibling">和兄弟姐妹争抢</option></select></div>

<div><label>🎯 沟通风格</label>
<select id="style"><option value="gentle">温和坚定</option><option value="firm">明确有界限</option><option value="play">轻松幽默</option></select></div>
</div>

<script>
var issueData={
homework:{name:'不写作业/拖拉',reason:['任务看起来太大，孩子不知道从哪开始，于是本能逃避','拖延往往不是懒，而是怕做不好，完美主义带来的回避','没有时间概念，孩子的"一会儿"和大人不一样','作业之后的自由时间被进一步压缩，做快也没好处'],
action:['把作业拆成 3-4 个小块，每完成一块打一个勾，让他看见进度','用计时器代替催促："我们试试 15 分钟能不能做完第 1 页"','把"写完作业才能玩"改成"写完作业后有两小时自由时间，写得越快玩得越多"','写作业前先花 3 分钟一起列清单，让他自己决定先做哪科'],
say:['"我看你坐了很久还没开始，是这道题太难了吗？"','"你先挑一个最容易的，做完我陪你休息五分钟。"','"作业是你的事，我负责提醒时间，不负责催你。"','"今天比昨天快了 10 分钟，这是你自己努力的结果。"']},
tantrum:{name:'发脾气/哭闹',reason:['孩子大脑中负责情绪控制的部分发育还不成熟，情绪一上来就压不住','哭闹经常是"说不清楚需求"的替代表达','如果哭闹总能换来妥协，这个行为会被不断强化','生理因素：饿了、困了、累了，情绪阈值会大幅降低'],
action:['先处理情绪，再处理事情。抱一抱或安静陪着，不急着讲道理','蹲下来平视，说出他的感受："你很生气，因为积木倒了对吗？"','用"可以……但不能……"替代直接拒绝："可以生气，但不能打人"','情绪平复后再复盘，绝不在崩溃时讲道理'],
say:['"你现在很生气，我在旁边等你，等你好一点我们再聊。"','"我知道你很难过。难过可以哭，我陪着你。"','"你可以说‘我很生气’，但不可以扔东西。"','"刚才发生了什么？我们下次可以怎么做？"']},
talkback:{name:'顶嘴/不听话',reason:['孩子在练习"我有自己的想法"，这是独立意识发展的正常表现','命令式的沟通会本能激起对抗，无论大人小孩都一样','可能是在模仿家里的沟通方式','被长期否定后，用顶嘴来维护自尊'],
action:['把命令改成选择："你想现在洗还是十分钟后洗？"','只说一次，说过的规则不重复第三遍，用行动代替唠叨','给有限度的自主权，在小事上让他赢','避免当众批评，青春期的面子比道理重要'],
say:['"我不接受这种语气，但我愿意听你的想法，你重新说一次。"','"这件事我说了算，其他事你可以自己决定。"','"你刚才那句话说得很冲，是有什么事让你不舒服吗？"','"我们可以意见不同，但要好好说话。"']},
phone:{name:'沉迷手机',reason:['手机提供的即时反馈，远强于学习和现实活动的反馈','现实生活里缺少更有吸引力的替代选项','家长自己也在刷手机，规则失去说服力','用手机逃避压力：作业难、人际不顺、被批评'],
action:['全家一起定规则，包括大人，写下来贴在墙上','用"结界"代替没收：吃饭时手机放客厅固定位置','和孩子一起找替代活动，运动、乐高、球场，要具体可执行','不要突然断网没收，容易引发极端对抗，要逐步减量'],
say:['"手机不是敌人，但我们要给使用定个规矩，一起定。"','"你玩了 40 分钟了，按约定现在该收了，你自己关还是我帮你关？"','"我注意到你最近玩得比较多，是有什么不开心的事吗？"','"这一小时我们一起出去走走，手机都放家里。"']},
lie:{name:'撒谎',reason:['怕被惩罚是最主要的原因，说得越重他越不敢说真话','分不清想象和现实，小年龄孩子常见','为了维护自尊，不想让父母失望','如果诚实总是换来批评，说谎就是理性选择'],
action:['第一次先处理事实，不纠缠"你怎么能撒谎"，避免逼他继续圆谎','让说真话的代价小于说谎的代价，真话之后不要立刻暴怒','区分"编故事"和"有目的撒谎"，前者不用上纲上线','示范承认错误，大人也要说"对不起，是我错了"'],
say:['"我更在意的是发生了什么，不是你有没有错。"','"如果你说了实话，我们一起想办法解决，我不会先发火。"','"你说的是真的吗？你可以想好了再告诉我。"','"谢谢你告诉我实话，这需要勇气。"']},
shy:{name:'胆小/不爱社交',reason:['慢热是气质类型，不是缺陷，不是所有孩子都天生外向','被贴"胆小"标签后，孩子会真的照着标签走','有过不愉快的社交经历，被嘲笑或被拒绝','家长过度代劳，孩子缺少独立社交的练习机会'],
action:['不强迫打招呼，改成"点点头也可以"','提前预告场景："待会儿会有 5 个小朋友，我们玩一小时就走"','创造小范围低压力社交，一对一比一群更容易','事后肯定具体行为，而不是"你今天真棒"'],
say:['"没关系，你可以先看着，准备好了再加入。"','"你刚刚主动把玩具给他了，我看到你其实很想交朋友。"','"紧张是正常的，我小时候也这样。"','"如果不想说话，笑一下也是在打招呼。"']},
school:{name:'不想上学',reason:['学业挫败感，长期跟不上会形成习得性无助','人际关系问题：被孤立、被欺负、和老师冲突','分离焦虑，尤其低龄或刚转学、刚换班','身体症状（肚子疼、头疼）往往是心理压力的表现'],
action:['先排除霸凌和校园伤害，这是第一优先级','别急着说"上学有什么好怕的"，先接住情绪','和老师沟通了解在校表现，很多问题在学校有迹可循','先解决具体困难（某科跟不上、座位问题），而不是泛泛鼓励'],
say:['"你最近不太想去学校，是发生什么事了吗？我认真听。"','"不上学这件事我们不能答应，但你的困难我们一起解决。"','"你说肚子疼，我们先去医院看看，同时我也想听听学校里的事。"','"不管发生什么，我都会站在你这边。"']},
sibling:{name:'和兄弟姐妹争抢',reason:['争抢的背后往往是争夺关注，而不是争那个玩具','"大的要让小的"会积累强烈的不公平感','年龄差距导致需求不同，用同一套规则会失效','孩子会观察家长的反应来判断自己的重要性'],
action:['不做法官判对错，做调解员处理需求','给每个孩子专属的独处时间，哪怕每天 15 分钟','规则按年龄分开定，但解释清楚为什么不一样','争抢激烈时先把两人分开，冷静后再一起复盘'],
say:['"我不判断谁先动手，我只想知道你们各自想要什么。"','"这是你的东西，你有权决定要不要分享。"','"妹妹小所以她先睡，等你这么大时，你的规则也是这样。"','"你们两个我都很爱，爱不会因为多一个人就变少。"']}};

var styleWord={gentle:'温和坚定',firm:'明确有界限',play:'轻松幽默'};
function gen(){
var age=document.getElementById('age').value;
var issue=document.getElementById('issue').value;
var role=document.getElementById('role').value;
var style=document.getElementById('style').value;
var desc=document.getElementById('desc').value.trim();
var d=issueData[issue];
var ageName=document.getElementById('age').selectedOptions[0].text;

var out='════════ 育儿应对建议 ════════\n';
out+='孩子：'+ageName+'　|　难题：'+d.name+'　|　沟通风格：'+styleWord[style]+'\n';
if(desc)out+='情况：'+desc.slice(0,120)+(desc.length>120?'…':'')+'\n';
out+='\n';

out+='———— 一、先理解：为什么会这样 ————\n';
d.reason.forEach(function(r,i){out+=(i+1)+'. '+r+'\n';});
out+='\n💡 重要提醒：行为是信号，不是问题本身。孩子表现出来的每个"毛病"，背后几乎都有一个没被满足的需求。\n\n';

out+='———— 二、具体怎么做 ————\n';
d.action.forEach(function(a,i){out+=(i+1)+'. '+a+'\n';});
out+='\n';

out+='———— 三、可以直接说的话术 ————\n';
d.say.forEach(function(s,i){out+=(i+1)+'. '+s+'\n';});
out+='\n（'+styleWord[style]+'风格提示：'+(style==='gentle'?'语气放软，态度不变。允许情绪，坚持规则。':(style==='firm'?'规则说一次就够，剩下的交给行动和后果，不要靠音量取胜。':'用玩笑化解对抗，但要让孩子清楚底线在哪里。'))+'）\n\n';

out+='———— 四、千万不要做的事 ————\n';
out+='✗ 不要当众批评或拿孩子和别人比较，伤害远大于教育效果；\n';
out+='✗ 不要在他情绪崩溃时讲道理，那时他听不进去；\n';
out+='✗ 不要说"你再这样我就不要你了"这类抛弃式威胁；\n';
out+='✗ 不要朝令夕改，今天可以明天不行，规则就失效了；\n';
out+='✗ 不要翻旧账，就事论事，一次解决一个问题。\n\n';

out+='———— 五、两周观察记录建议 ————\n';
out+='· 记录频率：每天简单记，什么时候发生、之前发生了什么、你怎么回应、结果如何；\n';
out+='· 关注趋势而不是单次表现，孩子的行为改善是螺旋式的；\n';
out+='· 如果两周内明显好转，说明方法有效，继续保持；\n';
out+='· 如果毫无变化甚至恶化，可能是判断错了原因，换个角度再看。\n\n';

out+='———— 六、什么时候需要专业帮助 ————\n';
out+='· 出现自伤、攻击他人、长期拒绝上学等严重情况；\n';
out+='· 情绪低落、睡眠饮食明显异常持续两周以上；\n';
out+='· 家庭已尝试多种方法无效，亲子关系持续紧张。\n';
out+='可以寻求儿童心理科或家庭教育指导师的帮助，这不代表孩子有问题，只代表需要更专业的方法。\n\n';
out+='⚠ 本建议基于常见育儿经验生成，不构成医学或心理诊断。\n';
return out;
}
</script>
<script>
document.getElementById('genBtn').addEventListener('click',function(){
if(!Paywall.countUse('AI 育儿难题应对建议 | AgentGongju.com'))return;
var out=gen();
if(!out)return;
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(function(){alert('✅ 已复制！')})}
</script>
