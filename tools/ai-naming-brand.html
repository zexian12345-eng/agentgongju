<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 品牌起名 | AgentGongju.com</title>
<meta name="description" content="AI品牌名/公司名生成器，按行业自动生成多个好听有寓意的备选名称">
<meta name="keywords" content="AI起名,品牌起名,公司起名,名字生成">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>">
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text],input[type=number]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
input:focus,select:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.8;margin-bottom:12px}
.name-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:8px;margin-bottom:10px}
.name-item .nm{font-size:1.05rem;color:#a5b4fc;font-weight:600}
.name-item .mn{color:#94a3b8;font-size:.85rem}
.name-item .cp{cursor:pointer;color:#22c55e;font-size:.8rem}
.name-item .cp:hover{text-decoration:underline}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>
var _hmt = _hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";

  s.parentNode.insertBefore(hm, s);

<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🏷️ AI 品牌起名</h1><p>按行业与寓意自动生成好听有格调的品牌名</p></div>

<div class="card"><label>🏢 所属行业</label>
<select id="industry"><option value="互联网科技">互联网科技</option><option value="餐饮美食">餐饮美食</option><option value="美妆护肤">美妆护肤</option><option value="教育培训">教育培训</option><option value="服装服饰">服装服饰</option><option value="家居生活">家居生活</option><option value="健康养生">健康养生</option><option value="文创设计">文创设计</option></select>
<div class="param-row" style="margin-top:12px"><div><label>名称风格</label><select id="tone"><option value="大气">大气国际化</option><option value="文艺">文艺古风</option><option value="可爱">可爱亲和</option><option value="极简">极简现代</option></select></div><div><label>生成数量</label><input type="number" id="count" value="8" min="4" max="12"></div></div>
<button class="btn-gen" id="genBtn">✨ 生成品牌名</button></div>
<div class="result-area" id="resultArea"><div class="card"><div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 品牌名建议</div>
<div id="namesOut"></div></div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
const dict={
'互联网科技':['云枢','智联','极客','数川','灵犀','星跃','码动','光点','纬创','启智'],
'餐饮美食':['食光','味蕾','悦膳','香满','暖胃','鲜语','锅物语','稻香','饕小满','逸味'],
'美妆护肤':['悦颜','花肌','初雪','镜花','焕彩','凝香','玉容','素妍','梦颜','雾柔'],
'教育培训':['启航','学舟','知涯','思远','博雅','星程','慧言','明心','育才','致远'],
'服装服饰':['衣慕','裳语','云袖','潮流','织造','棉语','锦年','映裳','霓光','芯服'],
'家居生活':['居尚','暖居','筑境','光栖','简舍','木语','栖居','宜家','静隅','筑梦'],
'健康养生':['颐养','康宁','元气','养心','清源','臻康','衡养','润泽','泰和','怡然'],
'文创设计':['墨白','造物','灵犀','拾光','艺研','匠心','观澜','织梦','方寸','野趣']
};
const toneMap={大气:['际','鼎','盛','宏'],文艺:['墨','溪','云','舟'],可爱:['小','萌','乐','豆'],极简:['一','新','简','本']};
function copyText(t){navigator.clipboard.writeText(t).then(()=>alert('✅ 已复制：'+t))}
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 品牌起名 | AgentGongju.com'))return;
const ind=document.getElementById('industry').value;const tone=document.getElementById('tone').value;
const n=Math.min(12,Math.max(4,parseInt(document.getElementById('count').value)||8));
const pool=dict[ind];const sfx=toneMap[tone];let html='';const used=new Set();
for(let i=0;i<n;i++){
  let name;
  do{name=pool[Math.floor(Math.random()*pool.length)];if(Math.random()>0.5)name+=sfx[Math.floor(Math.random()*sfx.length)];}while(used.has(name));
  used.add(name);
  const meaning=name.length>2?'寓意：'+(['创新进取','美好丰盈','简洁致用','品质传承'][Math.floor(Math.random()*4)]):'双字易记，气韵流畅';
  html+='<div class="name-item"><span class="nm">'+name+'</span><span class="mn">'+meaning+'</span><span class="cp" onclick="copyText(\''+name+'\')">复制</span></div>';
}
document.getElementById('resultArea').classList.add('active');
document.getElementById('namesOut').innerHTML=html;
});
</script>
</body>
</html>
