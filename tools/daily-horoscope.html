<script>
const traitMap={
'鼠':'机敏灵活','牛':'踏实稳重','虎':'果敢有魄力','兔':'温和细腻','龙':'气场强大','蛇':'睿智沉着','马':'奔放进取','羊':'善良随和','猴':'机智幽默','鸡':'认真细致','狗':'忠诚可靠','猪':'豁达宽厚'
};
const consMap={
'白羊座':'行动力强','金牛座':'务实坚韧','双子座':'灵活多思','巨蟹座':'细腻感性','狮子座':'自信大方','处女座':'严谨追求完美','天秤座':'平衡得体','天蝎座':'洞察力强','射手座':'乐观自由','摩羯座':'目标导向','水瓶座':'特立独行','双鱼座':'浪漫富有想象'
};
const careerGood=['适合推进重要事项，宜主动表达自己的想法','沟通顺畅，与合作方的洽谈会有不错进展','灵感涌动，适合产出创意、敲定方案','贵人运在线，本职工作之外或有机会收获认可'];
const careerMid=['进展平缓，按部就班推进即可，不必急于求成','注意细节与文档核对，避免忙中出错','计划可能临时调整，保持灵活应对'];
const moneyGood=['正财稳定，或有小惊喜入账','适合做理性理财规划，稳健为上','消费注意克制，但可适当犒劳拼搏的自己'];
const loveGood=['适合制造小浪漫，表达心意易有感','多与伴侣沟通，关系会更融洽','单身者今天社交运旺，或许会有心动相遇'];
const healthTip=['注意作息，早点休息给身体充电','多喝水、适当运动，保持轻盈状态','情绪平稳是今天的养生关键'];
const yi=['宜表达','宜行动','宜整理','宜联络故人','宜专注手头事'];
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI生肖星座每日运势 | AgentGongju.com'))return;
const z=document.getElementById('zodiac').value;
const c=document.getElementById('constellation').value;
const today=new Date();
const dstr=today.getMonth()+1+'月'+today.getDate()+'日';
const comp=82+Math.floor(Math.random()*14);
const careerScore=76+Math.floor(Math.random()*22);
const moneyScore=72+Math.floor(Math.random()*26);
const loveScore=75+Math.floor(Math.random()*23);
const healthScore=74+Math.floor(Math.random()*24);
const starRank=['★★★★★','★★★★','★★★★','★★★','★★★★'];
const cg=Math.random()>0.4?careerGood[Math.floor(Math.random()*careerGood.length)]:careerMid[Math.floor(Math.random()*careerMid.length)];
const mg=moneyGood[Math.floor(Math.random()*moneyGood.length)];
const lg=loveGood[Math.floor(Math.random()*loveGood.length)];
const hg=healthTip[Math.floor(Math.random()*healthTip.length)];
const luckyNum=Math.floor(Math.random()*30)+1;
const luckyColor=['紫色','青色','暖橙','浅蓝','象牙白'][Math.floor(Math.random()*5)];
const luckyDir=['东南','正西','正北','西南'][Math.floor(Math.random()*4)];
const pick2=(arr)=>{const a=arr.slice().sort(()=>Math.random()-0.5);return a.slice(0,2).join('、');};
let out='『'+z+'年属相 · '+c+'　'+dstr+' 运势』\n\n';
out+='【综合指数】'+comp+'/100　'+star(sc(comp))+'\n';
out+='你'+traitMap[z]+'的性格底色，叠加'+consMap[c]+'的今日能量，整体状态稳中有进。\n\n';
out+='【事业运】'+careerScore+'/100\n'+cg+'\n\n';
out+='【财物运】'+moneyScore+'/100\n'+mg+'\n\n';
out+='【爱情运】'+loveScore+'/100\n'+lg+'\n\n';
out+='【健康运】'+healthScore+'/100\n'+hg+'\n\n';
out+='【今日宜忌】\n宜：'+pick2(yi)+'\n忌：'+pick2(['忌冲动决策','忌拖延','忌熬夜','忌口舌之争'])+'\n\n';
out+='【幸运签】幸运数字 '+luckyNum+'　幸运色 '+luckyColor+'　幸运方位 '+luckyDir+'\n';
out+='—— 运势每日一签，仅供娱乐参考，愿你元气满满 ✨';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function sc(n){return n>=90?5:n>=80?4:n>=70?3:2;}
function star(n){return '★'.repeat(n)+'☆'.repeat(5-n);}
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 运势已复制！'))}
</script>
