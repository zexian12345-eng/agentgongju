<script>
const lib={
'子时':['墨守成规中带锋芒','夜猫型内核，独处充电','直觉敏锐，第六感强','适合策划、科研、创意岗'],
'丑时':['沉稳内敛，深思熟虑','越挫越勇，抗压极强','重情重义，值得托付','适合管理、金融、土木岗'],
'寅时':['敢想敢干，行动派先锋','精力旺盛，开拓精神足','脾气大但走得快','适合创业、销售、体育'],
'卯时':['温和谦逊，人缘极好','作息自律，像晨光一样干净','善解人意，倾听者','适合教育、公关、客服'],
'辰时':['自信开朗，自带光环','条理清晰，天生领导者','略爱面子，要强','适合管理、主持、公务员'],
'巳时':['聪明灵活，点子多','能言善辩，感染力强','心思活络，易三分钟热度','适合传媒、设计、营销'],
'午时':['热情如火，正气凛然','行动速度快，直来直往','太阳性格，藏不住情绪','适合警察、医生、运动员'],
'未时':['温厚包容，慢热但长情','讲究生活品质','看似慵懒实则靠谱','适合文艺、养生、服务'],
'申时':['头脑转得快，机灵鬼','社交破冰高手','自尊心强，爱比较','适合IT、跑业务、法律'],
'酉时':['爱美重形象，审美在线','务实精明，过日子好手','外冷内热，慢热','适合美容、时尚、财会'],
'戌时':['忠诚可靠，守成稳重','责任心爆棚','略保守恋旧','适合后勤、社区、兽医'],
'亥时':['想象力天马行空','轻松随缘，不拧巴','夜猫达人、灵感夜发','适合写作、音乐、电商']};
document.getElementById('genBtn').addEventListener('click',()=>{
if(!Paywall.countUse('AI 出生时辰性格分析 | AgentGongju.com'))return;
const date=document.getElementById('bdate').value;
const raw=document.getElementById('btime').value;
const seg=raw.replace('时段','');
const zi=raw.startsWith('早')?seg:seg;
const focus=document.getElementById('focus').value;
const key=Object.keys(lib).find(k=>raw.includes(k))||'子时';
const d=lib[key];
const who=document.getElementById('name').value.trim()?('亲爱的'+document.getElementById('name').value.trim()):'你';
let out='🌅 【'+who+' · 时辰性格报告】\n';
out+='出生：'+date+'　时段：'+raw+'\n';
out+='━━━━━━━━━━━━━━━━\n';
out+='✨ 时辰气质：'+seg+'属于【'+key+'】。'+d[0]+'，'+d[1]+'，'+d[2]+'。\n\n';
out+='💼 事业能量（基于你'+raw+'出生的能量场映射）：\n'+'  天赋对应岗位方向：'+d[3]+'。\n  建议：把精力放在需要稳定输出的板块，避免被临时琐事打散节奏。\n\n';
out+='🤝 人际与情感：\n  你在亲密关系里属于'+d[2].split('，')[0]+'型，靠近你的人往往觉得安全踏实；社交上宜少而精，不必勉强自己成为人群焦点。\n\n';
out+='🌙 深夜提醒（'+(focus==='事业'?'事业向':'综合向')+'）：\n  时辰特质只是底色，真正塑造你的永远是后天的每一次选择与坚持。愿你把自己的时辰过成最动人的时区。';
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(()=>alert('✅ 报告已复制！'))}
</script>
