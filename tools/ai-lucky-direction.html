<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 每日幸运方位查询 | AgentGongju.com</title>
<meta name="description" content="AI每日幸运方位查询，根据生肖与日期推算当日幸运方位、宜忌方位与出行建议，供娱乐参考">
<meta name="keywords" content="幸运方位,每日运势,方位吉凶,生肖运势,风水方位">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:800px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
select:focus,input:focus{border-color:#6366f1}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.compass{position:relative;width:220px;height:220px;margin:0 auto 20px;border:2px solid rgba(99,102,241,.4);border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,.12),transparent 70%)}
.dir{position:absolute;color:#94a3b8;font-size:.85rem;font-weight:600}
.d-n{top:8px;left:50%;transform:translateX(-50%)}.d-s{bottom:8px;left:50%;transform:translateX(-50%)}
.d-e{right:10px;top:50%;transform:translateY(-50%)}.d-w{left:10px;top:50%;transform:translateY(-50%)}
.d-ne{top:32px;right:38px}.d-nw{top:32px;left:38px}.d-se{bottom:32px;right:38px}.d-sw{bottom:32px;left:38px}
.needle{position:absolute;top:50%;left:50%;width:4px;height:80px;background:linear-gradient(180deg,#22c55e,#6366f1);border-radius:2px;transform-origin:bottom center;transform:translate(-50%,-100%) rotate(0deg);transition:transform 1s cubic-bezier(.4,1.6,.5,1)}
.center{position:absolute;top:50%;left:50%;width:12px;height:12px;background:#a855f7;border-radius:50%;transform:translate(-50%,-50%)}
.hl{color:#22c55e;font-weight:700}
.result-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;margin-bottom:12px}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.tip{color:#94a3b8;font-size:.8rem;margin-top:8px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>

  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949";

<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🧭 每日幸运方位</h1><p>今天往哪走，运气会好一点</p></div>

<div class="card">
<label>🐉 你的生肖</label>
<select id="zodiac">
<option>鼠</option><option>牛</option><option>虎</option><option>兔</option><option>龙</option><option>蛇</option>
<option>马</option><option>羊</option><option>猴</option><option>鸡</option><option>狗</option><option>猪</option>
</select>
<div class="param-row">
<div><label>📅 查询日期</label><select id="day"><option value="today">今天</option><option value="tomorrow">明天</option><option value="week">未来一周</option></select></div>
<div><label>🎯 用途</label><select id="use"><option value="综合运势">综合运势</option><option value="求财">求财 / 谈生意</option><option value="求缘">感情 / 社交</option><option value="考试">考试 / 面试</option><option value="出行">出行 / 搬家</option></select></div>
</div>
<button class="btn-gen" id="genBtn">🧭 查询幸运方位</button>
<div class="tip">💡 方位之说源于传统民俗，仅供生活趣味参考，做事还是要靠努力哦。</div>
</div>
<div class="result-area" id="resultArea"><div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 查询结果</div>
<div class="compass" id="compass">
<span class="dir d-n">北</span><span class="dir d-s">南</span><span class="dir d-e">东</span><span class="dir d-w">西</span>
<span class="dir d-ne">东北</span><span class="dir d-nw">西北</span><span class="dir d-se">东南</span><span class="dir d-sw">西南</span>
<div class="needle" id="needle"></div><div class="center"></div>
</div>
<div class="result-box" id="out"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制结果</button>
</div></div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function copyResult(){navigator.clipboard.writeText(document.getElementById('out').textContent).then(()=>alert('✅ 已复制！'))}
var DIRS=[
{n:'北',deg:0,use:'思维清晰，适合做规划、写方案、与上级沟通。'},
{n:'东北',deg:45,use:'利学习进修，适合备考、看书、请教前辈。'},
{n:'东',deg:90,use:'生机勃勃，利开新局、谈新合作、启动计划。'},
{n:'东南',deg:135,use:'财气位，利求财、谈钱、签合同。'},
{n:'南',deg:180,use:'名气位，利社交、展示自己、见重要的人。'},
{n:'西南',deg:225,use:'人缘位，利感情、家庭、与长辈相处。'},
{n:'西',deg:270,use:'收敛位，利复盘总结、整理物品、冷静思考。'},
{n:'西北',deg:315,use:'贵人位，利求助、找资源、见领导。'}
];
var ZH={'鼠':1,'牛':2,'虎':3,'兔':4,'龙':5,'蛇':6,'马':7,'羊':8,'猴':9,'鸡':10,'狗':11,'猪':12};
function gen(){
if(!Paywall.countUse('AI 每日幸运方位查询 | AgentGongju.com'))return;
var z=document.getElementById('zodiac').value,day=document.getElementById('day').value,use=document.getElementById('use').value;
var d=new Date();
if(day==='tomorrow')d.setDate(d.getDate()+1);
var seed=(ZH[z]+d.getFullYear()+ (d.getMonth()+1)*3 + d.getDate()*(day==='week'?7:1))%8;
var pick=DIRS[seed];
var ghost=DIRS[(seed+4)%8];
document.getElementById('needle').style.transform='translate(-50%,-100%) rotate('+pick.deg+'deg)';
var dateStr=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';
var luck=['★★★★★ 大吉','★★★★☆ 吉','★★★★☆ 吉','★★★☆☆ 平','★★★☆☆ 平','★★☆☆☆ 小凶','★★★★☆ 吉','★★★★★ 大吉'][seed];
var useTip={
综合运势:'今天整体状态不错，按自己的节奏走，遇事稍作停顿再决定，会更顺。',
求财:'谈钱谈合作优先考虑'+pick.n+'方向的位置，见面选在那个方向的咖啡厅或会议室更有利。',
求缘:'想认识新朋友或推进感情，往'+pick.n+'方向的活动、聚会更容易有缘。',
考试:'考场或自习座位尽量选'+pick.n+'朝向，进考场前深呼吸三次，稳住节奏。',
出行:'出行、搬家以'+pick.n+'方向为先，避开来程'+ghost.n+'方向的绕路。'
}[use];
var out='【'+z+' · '+dateStr+'】\n\n🧭 今日幸运方位：'+pick.n+'（'+luck+'）\n'+pick.use+'\n\n⚠️ 今日相冲方位：'+ghost.n+'，重要事情尽量避开此方向安排。\n\n🎯 '+use+'建议：\n'+useTip+'\n\n🕐 幸运时段：上午 9-11 点，下午 15-17 点\n🎨 幸运色：'+(['深蓝','墨绿','正红','奶白','暖黄','紫色','银色','米金'][seed])+'\n🔢 幸运数字：'+((seed*3+7)%9+1)+' 和 '+((seed*5+2)%9+1);
document.getElementById('resultArea').classList.add('active');
document.getElementById('out').textContent=out;
}
document.getElementById('genBtn').addEventListener('click',gen);
</script>
</body>
</html>
