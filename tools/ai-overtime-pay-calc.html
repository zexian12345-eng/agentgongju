<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 加班费与调休计算器 | AgentGongju.com</title>
<meta name="description" content="输入加班时长和月薪，自动算出平时加班1.5倍、休息日2倍、法定节假日3倍的加班费金额，判断公司是用调休还是必须给钱，并给出维权依据。">
<meta name="keywords" content="加班费计算,加班工资,1.5倍,2倍,3倍,调休,法定节假日,劳动法加班">
<link rel="stylesheet" href="../css/style.css" /><script src="../js/paywall.js"></script>
<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,input[type=text],input[type=number],input[type=date],textarea{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px;box-sizing:border-box}
textarea{min-height:90px;resize:vertical;line-height:1.7}
select:focus,input:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:2;white-space:pre-wrap;margin-bottom:12px;font-size:.92rem}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.param-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tips{color:#64748b;font-size:.8rem;line-height:1.7;margin-top:6px}
@media(max-width:600px){.param-row{grid-template-columns:1fr}}
</style>
<script>
var _hmt = _hmt || [];
(function() { var hm = document.createElement("script"); hm.src = "https://hm.baidu.com/hm.js?53f16ef45879b94dce1bf43bd616f949"; var s = document.getElementsByTagName("script")[0]; s.parentNode.insertBefore(hm, s); })();

<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>⏰ AI 加班费计算器</h1><p>平时1.5倍、休息日2倍、节假日3倍，一分钱都别少算</p></div>
<div class="card">
<div class="param-row">
<div><label>💵 月薪（税前，元）</label><input type="number" id="salary" value="10000" min="1000" max="300000"></div>
<div><label>📆 月计薪天数</label>
<select id="baseDays"><option value="21.75" selected>21.75 天（标准）</option><option value="20.83">20.83 天（月工作日）</option></select></div>
</div>
<div class="param-row">
<div><label>🌆 平时加班（小时）</label><input type="number" id="h1" value="10" min="0" step="0.5"></div>
<div><label>🌞 休息日加班（小时）</label><input type="number" id="h2" value="8" min="0" step="0.5"></div>
</div>
<div class="param-row">
<div><label>🎉 法定节假日加班（小时）</label><input type="number" id="h3" value="0" min="0" step="0.5"></div>
<div><label>🔁 休息日是否已安排调休</label>
<select id="comp"><option value="0" selected>没有，公司只给调休承诺</option><option value="1">已经补休过了（可不算钱）</option></select></div>
</div>
<div class="param-row">
<div><label>🕐 每天标准工时（小时）</label><input type="number" id="daily" value="8" min="1" max="12"></div>
<div><label>🧾 工资单上已发的加班费（元）</label><input type="number" id="paid" value="0" min="0"></div>
</div>
<label>📝 补充情况（可选）</label>
<textarea id="note" placeholder="例：公司说加班都可以调休，但一直排不上，我该要加班费吗"></textarea>
<button class="btn-gen" id="genBtn">⏰ 计算加班费</button>
<div class="tips">⚠️ 依据《劳动法》第44条：平时加班不低于150%工资；休息日加班不能补休的按200%；法定节假日加班必须付300%，不能用调休替代。月计薪天数通常为21.75天。</div>
</div>
<div class="result-area" id="resultArea">
<div class="card"><div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制结果</button></div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function m(n){return Math.round(n*100)/100;}
function fmt(n){return "¥"+m(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}
var LEGAL=[
"1月1日 元旦","春节 3天（农历除夕至初二/初三）","4月5日前后 清明","5月1日 劳动节","端午 1天","中秋 1天","10月1-3日 国庆"
];
function gen(){
  var sal=+document.getElementById('salary').value||0;
  var base=+document.getElementById('baseDays').value||21.75;
  var h1=+document.getElementById('h1').value||0;
  var h2=+document.getElementById('h2').value||0;
  var h3=+document.getElementById('h3').value||0;
  var comp=+document.getElementById('comp').value;
  var daily=+document.getElementById('daily').value||8;
  var paid=+document.getElementById('paid').value||0;
  var note=document.getElementById('note').value.trim();

  if(sal<=0){document.getElementById('outputBox').textContent="请输入有效月薪。";document.getElementById('resultArea').classList.add('active');return;}

  var dayPay=sal/base;
  var hourPay=dayPay/daily;
  var p1=h1*hourPay*1.5;
  var p2raw=h2*hourPay*2;
  var p2=(comp===1)?0:p2raw;
  var p3=h3*hourPay*3;
  var total=p1+p2+p3;
  var owed=total-paid;

  var out="【计算基准】\n";
  out+="· 日工资 = "+sal+" ÷ "+base+" = "+fmt(dayPay)+" / 天\n";
  out+="· 时工资 = "+fmt(dayPay)+" ÷ "+daily+" = "+fmt(hourPay)+" / 小时\n";

  out+="\n【① 平时加班（延时）】\n";
  out+="· 时长："+h1+" 小时（1.5倍）\n";
  out+="· 应得："+h1+" × "+fmt(hourPay)+" × 1.5 = "+fmt(p1)+"\n";

  out+="\n【② 休息日加班】\n";
  out+="· 时长："+h2+" 小时（2倍）\n";
  if(comp===1){
    out+="· 公司已安排补休 → 依法可不付加班费，计 0 元\n";
    out+="· （若未实际补休，仍可主张 "+fmt(p2raw)+"）\n";
  } else {
    out+="· 未补休，应得："+h2+" × "+fmt(hourPay)+" × 2 = "+fmt(p2)+"\n";
  }

  out+="\n【③ 法定节假日加班】\n";
  out+="· 时长："+h3+" 小时（3倍，不可用调休替代）\n";
  out+="· 应得："+h3+" × "+fmt(hourPay)+" × 3 = "+fmt(p3)+"\n";

  out+="\n【合计】\n";
  out+="· 应发加班费总计："+fmt(total)+"\n";
  out+="· 工资单已发："+fmt(paid)+"\n";
  if(owed>0.01){
    out+="· ⚠️ 公司还欠你："+fmt(owed)+"\n";
  } else if(owed<-0.01){
    out+="· ✅ 已发金额多于应发，多出 "+fmt(-owed)+"\n";
  } else {
    out+="· ✅ 已足额支付，无欠款\n";
  }

  var extra=total*0.5;
  out+="\n【维权提示】\n";
  out+="· 加班费属于劳动报酬，仲裁时效从离职之日起1年内计算，不受1年时效限制。\n";
  out+="· 关键证据：打卡记录、排班表、工作群通知、邮件往来、加班申请单。\n";
  out+="· 注意月计薪天数口径：公司若用「基本工资」而非「全部月收入」再按21.75折，日工资会被压低，属常见套路。\n";
  out+="· 法定节假日（" + LEGAL.slice(0,4).join("、") + " 等）加班必须给钱，调休不能顶替。\n";
  out+="· 若按「全部月收入」核算，你的日工资还会更高；若公司只按基本工资核算，实际到手约打 6~8 折。\n";

  if(note){
    out+="\n【结合你的情况】\n";
    out+="· 你的补充：「"+note+"」\n";
    if(/调休|补休|调休/.test(note) && comp===0){
      out+="· 公司口头承诺调休但未落实，休息日加班部分可主张 2 倍工资（"+fmt(p2raw)+"）。\n";
    }
    if(/不给|不发|没有|扣|拖欠/.test(note)){
      out+="· 属于拖欠劳动报酬，可拨打 12333 投诉，或向当地劳动监察大队举报。\n";
      out+="· 也可先发书面《加班费支付催告函》给公司，留作证据。\n";
    }
    if(/离职|走人|辞职/.test(note)){
      out+="· 建议离职前把加班证据备份到个人邮箱/网盘，离职后1年内仍可举证主张。\n";
    }
  }

  document.getElementById('outputBox').textContent=out;
  document.getElementById('resultArea').classList.add('active');
}
document.getElementById('genBtn').addEventListener('click',gen);
function copyResult(){
  var t=document.getElementById('outputBox').textContent;
  navigator.clipboard.writeText(t).then(function(){
    var b=document.querySelector('.copy-btn');var o=b.textContent;b.textContent="✅ 已复制";setTimeout(function(){b.textContent=o;},1500);
  });
}
</script>
</body>
</html>
