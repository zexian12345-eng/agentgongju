<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI SQL 查询生成器 | AgentGongju.com</title>
<meta name="description" content="用中文描述取数需求，自动生成标准 SQL 查询语句，支持多表关联、分组统计、排序分页，附字段说明与优化建议。">
<meta name="keywords" content="SQL生成器,SQL查询,写SQL,数据库查询,程序员工具,取数,数据分析">

<style>
.tool-container{max-width:820px;margin:100px auto 60px;padding:0 20px}
.tool-header{text-align:center;margin-bottom:40px}
.tool-header h1{font-size:2.2rem;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.tool-header p{color:#94a3b8}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:30px;margin-bottom:24px}
.card label{display:block;color:#e2e8f0;margin-bottom:8px;font-weight:500}
select,textarea,input[type=text]{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e2e8f0;font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:12px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-size:1.05rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.3)}
.result-area{display:none;margin-top:20px}
.result-area.active{display:block}
.output-box{background:rgba(255,255,255,0.03);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:20px;color:#e2e8f0;line-height:1.9;white-space:pre-wrap;margin-bottom:12px;font-size:.88rem;font-family:ui-monospace,Menlo,monospace;word-break:break-word}
.copy-btn{padding:8px 20px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);border-radius:8px;color:#a5b4fc;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:rgba(99,102,241,0.25)}
.chip{display:inline-block;padding:5px 12px;margin:0 6px 6px 0;background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.3);border-radius:20px;color:#a5b4fc;font-size:.8rem;cursor:pointer}
.chip:hover{background:rgba(99,102,241,0.25)}
</style>

</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="../" class="logo">🛠 AgentGongju</a><div class="nav-links"><a href="../">首页</a><a href="../#tools">工具</a></div></div></nav>
<div class="tool-container">
<div class="tool-header"><h1>🗄️ AI SQL 查询生成器</h1><p>中文需求 → 可直接跑的 SQL 语句</p></div>

<div class="card">
<label>💬 用中文描述你的取数需求</label>
<textarea id="desc" placeholder="例如：查询订单表里2024年每个月的订单数量和总金额，按金额从高到低排序"></textarea>
<label>📚 常用场景（点击填入）</label>
<div>
<span class="chip" onclick="setD('查询用户表里最近7天注册的用户，按注册时间倒序')">最近7天注册用户</span>
<span class="chip" onclick="setD('统计订单表每个月的订单总数和总金额，按月份排序')">按月统计订单</span>
<span class="chip" onclick="setD('查询消费金额最高的前10名用户')">消费Top10用户</span>
<span class="chip" onclick="setD('查询关联用户表和订单表，找出从未下单的用户')">从没下过单的用户</span>
<span class="chip" onclick="setD('统计每个商品的销量并降序排列，只显示销量大于100的')">销量大于100的商品</span>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px">
<div><label>🗃️ 数据库类型</label>
<select id="db">
<option value="mysql">MySQL</option>
<option value="postgres">PostgreSQL</option>
<option value="sqlserver">SQL Server</option>
<option value="oracle">Oracle</option>
</select></div>
<div><label>⚠️ 安全模式</label>
<select id="safe">
<option value="select">仅生成查询（SELECT）</option>
<option value="allow">允许增删改语句</option>
</select></div>
</div>
<button class="btn-gen" id="genBtn">✨ 生成 SQL 语句</button>
</div>

<div class="result-area" id="resultArea">
<div class="card">
<div style="color:#22c55e;font-weight:600;margin-bottom:12px">✅ 生成结果</div>
<div class="output-box" id="outputBox"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制 SQL</button>
</div>
</div>
</div>
<footer class="footer"><div class="footer-inner"><p style="color:#64748b;text-align:center;padding:20px 0;">© 2026 AgentGongju.com — 让 AI 工具触手可及</p></div></footer>
<script>
function setD(t){document.getElementById('desc').value=t;}
function limitKw(db){return db==='sqlserver'?'TOP 10 ':'';}
document.getElementById('genBtn').addEventListener('click',function(){
if(!Paywall.countUse('AI SQL 查询生成器 | AgentGongju.com'))return;
var d=document.getElementById('desc').value.trim();
if(!d){alert('请先描述取数需求');return;}
var db=document.getElementById('db').value;
var sql='',note='',tbl='table_name';
if(/注册|用户/.test(d)&&/订单|下单|消费/.test(d)){
  sql='SELECT u.id, u.name, u.phone\nFROM users u\nLEFT JOIN orders o ON o.user_id = u.id\nWHERE o.id IS NULL;';
  note='使用 LEFT JOIN + WHERE o.id IS NULL 找出主表有、从表无的“从未下单”用户。';
  tbl='users / orders';
}else if(/每月|按月|月度/.test(d)&&/订单/.test(d)){
  var df=db==='mysql'?"DATE_FORMAT(created_at, '%Y-%m')":db==='postgres'?"TO_CHAR(created_at, 'YYYY-MM')":"FORMAT(created_at, 'yyyy-MM')";
  sql='SELECT '+df+' AS month,\n       COUNT(*) AS order_count,\n       SUM(amount) AS total_amount\nFROM orders\nWHERE created_at >= \'2024-01-01\'\nGROUP BY '+df+'\nORDER BY month ASC;';
  note='先用日期函数把时间格式化为月份，再 GROUP BY 聚合计数与求和。';
  tbl='orders';
}else if(/最高|最多|top|排名|前\s*\d*/.test(d)&&/用户|消费|金额/.test(d)){
  sql='SELECT u.id, u.name, SUM(o.amount) AS total_spent\nFROM users u\nJOIN orders o ON o.user_id = u.id\nGROUP BY u.id, u.name\nORDER BY total_spent DESC\n'+(db==='sqlserver'?'':'LIMIT 10')+';';
  if(db==='sqlserver')sql=sql.replace('SELECT u.id','SELECT TOP 10 u.id');
  note='按用户分组求和后降序排列，取前 10 名。';
  tbl='users / orders';
}else if(/销量|商品/.test(d)&&/>\s*100|大于\s*100/.test(d)){
  sql='SELECT product_id, SUM(qty) AS sales\nFROM order_items\nGROUP BY product_id\nHAVING SUM(qty) > 100\nORDER BY sales DESC;';
  note='聚合过滤要用 HAVING 而非 WHERE（WHERE 无法作用于聚合结果）。';
  tbl='order_items';
}else if(/最近|近\s*\d+\s*天/.test(d)){
  sql='SELECT *\nFROM users\nWHERE created_at >= '+(db==='mysql'?'DATE_SUB(NOW(), INTERVAL 7 DAY)':db==='postgres'?"NOW() - INTERVAL '7 days'":"DATEADD(day, -7, GETDATE())")+'\nORDER BY created_at DESC;';
  note='用数据库自带的日期函数计算相对时间，避免硬编码日期。';
  tbl='users';
}else{
  sql='SELECT *\nFROM '+tbl+'\nWHERE 1 = 1\n-- 请根据实际字段补充过滤条件\nORDER BY id DESC\n'+(db==='sqlserver'?'':'LIMIT 100')+';';
  note='未能识别具体场景，已生成通用查询骨架，请按实际表结构替换字段名。';
}
if(db==='sqlserver'&&!/TOP/.test(sql)&&/(LIMIT 10)/.test(sql))sql=sql.replace('SELECT','SELECT TOP 10').replace(/\nLIMIT 10/,'');
if(db!=='mysql')sql=sql.replace(/\nLIMIT 10;?\s*$/,';');
var out='【SQL 语句】\n'+sql+'\n\n【涉及数据表】\n'+tbl+'\n\n【思路说明】\n'+note;
out+='\n\n【优化建议】\n· 过滤字段（如 created_at、user_id）建议建索引；\n· 大数据量统计避免 SELECT *，只取必要字段；\n· 多表关联注意驱动表顺序与小表优先原则。';
if(document.getElementById('safe').value==='select'&&/\b(DELETE|UPDATE|DROP|TRUNCATE)\b/i.test(sql)){out='⚠️ 安全模式仅允许查询语句，已拦截。';}
document.getElementById('outputBox').innerText=out;
document.getElementById('resultArea').classList.add('active');
});
function copyResult(){navigator.clipboard.writeText(document.getElementById('outputBox').innerText).then(function(){alert('✅ 已复制！')})}
</script>
</body>
</html>
